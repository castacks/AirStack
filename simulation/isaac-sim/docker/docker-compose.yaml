services:
  isaac-sim:
    profiles:
      - isaac-sim
    image: &image_tag ${PROJECT_DOCKER_REGISTRY}/${PROJECT_NAME}:v${VERSION}_isaac-sim
    build:
      context: ../
      dockerfile: docker/Dockerfile.isaac-ros
      tags:
        - *image_tag
      cache_from:
        - *image_tag
    container_name: isaac-sim
    entrypoint: ""
    command: >
      bash -c "
      tmux new -d -s isaac;
      if [ $$AUTOLAUNCH = 'true' ]; then
        if [ \"${ISAAC_SIM_USE_STANDALONE}\" = 'true' ]; then
          tmux send-keys -t isaac 'PYTHONPATH="$$ISAAC_SIM_PYTHONPATH" /isaac-sim/python.sh /isaac-sim/AirStack/simulation/isaac-sim/launch_scripts/${ISAAC_SIM_SCRIPT_NAME} --ext-folder ~/.local/share/ov/data/documents/Kit/shared/exts' ENTER
        else
          tmux send-keys -t isaac 'ros2 launch isaacsim run_isaacsim.launch.py install_path:=/isaac-sim gui:=\"${ISAAC_SIM_GUI}\" play_sim_on_start:=\"${PLAY_SIM_ON_START}\" ' ENTER
        fi
      fi;
      sleep infinity"
    # Interactive shell
    stdin_open: true # docker run -i
    tty: true # docker run -t
    ipc: host
    privileged: true
    networks:
      airstack_network:
        ipv4_address: 172.31.0.200 # required to not conflict with other default docker networks on the host machine
    env_file:
      - ./omni_pass.env
    environment:
      - AUTOLAUNCH=${AUTOLAUNCH:-'false'}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # Isaac Sim stuff
      - PLAY_SIM_ON_START=${PLAY_SIM_ON_START}
      - NUM_ROBOTS=${NUM_ROBOTS:-1}
      # EMPTY when unset, not 'false': each launch script has its own
      # default (off for example_multi_px4, on for the multi-drone scene
      # import) and a compose default silently overrides both.
      - ENABLE_LIDAR=${ENABLE_LIDAR:-}
      - ISAAC_SIM_HEADLESS=${ISAAC_SIM_HEADLESS:-false}
      # Scene to generate; empty falls back to the launch script default
      - SCENE_CONFIG=${SCENE_CONFIG:-}
      # A FROZEN DATASET CELL instead of a procedural build. FROZEN_SCENE
      # WINS over SCENE_CONFIG in the launch script, but only if it gets in
      # here: without these lines a mission that sets FROZEN_SCENE loses it at
      # the container boundary, the script sees only SCENE_CONFIG (`suburb`,
      # from the repo's .env, because `Stack.apply_env` MERGES and cannot
      # unset), rebuilds the plat procedurally and dies in `load_archetypes` —
      # the archetype bake is not in git and a pod's clone has none. The crash
      # names the archetypes, so it reads like a missing-asset problem rather
      # than like a scene that was never asked for.
      - FROZEN_SCENE=${FROZEN_SCENE:-}
      - FROZEN_DATASET_ROOT=${FROZEN_DATASET_ROOT:-}
      # Extra authored layer referenced on top of a frozen cell at
      # /World/Overlay (e.g. the standing-person A/B detection rig).
      - FROZEN_OVERLAY_USD=${FROZEN_OVERLAY_USD:-}
      # BARE NAME, like DETECTOR_URL in robot-base-docker-compose.yaml: the
      # script's default is 'ground' and `${SUBURB_COLLIDERS:-}` would define
      # this EMPTY, which is not 'off' and not 'ground' — it falls through to
      # colliding the WHOLE plat (6k+ referenced objects) instead of the ground
      # sheet. Unset must mean unset.
      - SUBURB_COLLIDERS
      # FROZEN-CELL LIGHTING. A frozen cell ships no sky (measured: every
      # Fire cell has one 0.25 m SphereLight, every Tornado cell has none), so
      # the launcher authors a dome + sun for it. Every one of these is
      # OPTIONAL and safe empty — the launcher reads them as
      # `os.environ.get(X) or <default>`, so `${X:-}` rendering an empty
      # string still yields the shipped default. They are listed only so a
      # mission CAN move the sun or the exposure; without these lines setting
      # them in a mission would be silently dropped at the container boundary,
      # which is exactly how FROZEN_SCENE was lost before.
      - FROZEN_LIGHT=${FROZEN_LIGHT:-}
      - FROZEN_SKY=${FROZEN_SKY:-}
      - FROZEN_DOME_INTENSITY=${FROZEN_DOME_INTENSITY:-}
      - FROZEN_DOME_EXPOSURE=${FROZEN_DOME_EXPOSURE:-}
      - FROZEN_SUN=${FROZEN_SUN:-}
      - FROZEN_SUN_INTENSITY=${FROZEN_SUN_INTENSITY:-}
      - FROZEN_SUN_ELEV_DEG=${FROZEN_SUN_ELEV_DEG:-}
      - FROZEN_SUN_AZ_DEG=${FROZEN_SUN_AZ_DEG:-}
      - FROZEN_KILL_STRAY_LIGHTS=${FROZEN_KILL_STRAY_LIGHTS:-}
      # FROZEN-CELL ASSET REBASE. A cell's textures are baked as absolute
      # build-container paths under scene_gen/assets, and aec/ objaverse/ and
      # materials/scorched/ are git-ignored — so a pod's clone has none of
      # them and the ground renders untextured. The launcher repoints any
      # ABSENT one at the Nucleus mirror. Safe empty, same as above.
      - FROZEN_REBASE_ASSETS=${FROZEN_REBASE_ASSETS:-}
      - FROZEN_ASSET_LOCAL_PREFIX=${FROZEN_ASSET_LOCAL_PREFIX:-}
      - FROZEN_ASSET_MIRROR=${FROZEN_ASSET_MIRROR:-}
      # Spec overrides: a preset names a KIND of scene, these pick the
      # instance (size, disaster, severity). Unset leaves the preset alone.
      - REGION_M=${REGION_M:-}
      - DISASTER_TYPE=${DISASTER_TYPE:-}
      - SEVERITY=${SEVERITY:-}
      - HOUSE_YAW_OFFSET_DEG=${HOUSE_YAW_OFFSET_DEG:-}
      - DUMP_HOUSE_POSES=${DUMP_HOUSE_POSES:-}
      # Must match the robot/gcs containers — mixed transport modes across
      # containers have no common data channel, and the isaacsim ros2 bridge
      # ships its own Fast DDS whose SHM segments are incompatible with the
      # ROS Jazzy one, so RTPS-over-TCP is what actually interoperates.
      - FASTDDS_BUILTIN_TRANSPORTS=${FASTDDS_BUILTIN_TRANSPORTS:-LARGE_DATA}
      # MUST default to a device, not to empty. An empty CUDA_VISIBLE_DEVICES
      # is not "unset" — it means NO devices, and Kit then fails every
      # allocation with `cudaErrorNoDevice` while `nvidia-smi -L` still
      # lists the card, which reads like a driver fault rather than a
      # config one. Override per host with ISAAC_SIM_CUDA_DEVICES.
      # DO NOT SET CUDA_VISIBLE_DEVICES FOR KIT. Bare name = passthrough:
      # docker compose renders an unset variable as null and does NOT define
      # it in the container, which is what we want. `${X:-0}` would hardcode a
      # device and `${X:-}` would define it EMPTY; both are wrong here.
      #
      # MEASURED 2026-08-31 on airstack-mission-1gpu-52. Kit prints, 2 s into
      # startup, immediately before it drops every GPU:
      #
      #     CUDA_VISIBLE_DEVICES environment variable is set.
      #     Note CUDA device enumeration and Omniverse device enumeration are
      #     different. Setting CUDA_VISIBLE_DEVICES can lead to undesired
      #     behavior or crashes.
      #     [gpu.foundation.plugin] Skipping NVIDIA GPU due CUDA being in bad
      #     state: NVIDIA RTX PRO 5000 Blackwell            (x6)
      #
      # Omniverse enumerates devices through its own path, so pinning CUDA's
      # view desynchronises the two indices, every CUDA probe fails, and Kit
      # silently falls back to SOFTWARE rendering — both cards at 0 % / 4 MiB
      # / P8 for an entire run while Isaac burns 273 % CPU, and the real-time
      # factor collapses to ~0.083 (600 sim-seconds in ~2 hours, a
      # 24-iteration sweep in ~48 h instead of a few).
      #
      # A/B on the same container, same pod, minutes apart:
      #     CUDA_VISIBLE_DEVICES=0   -> 6 bad-state lines, 4 MiB,  no GPU proc
      #     unset                    -> 0 bad-state lines, 182 MiB, Kit holds
      #                                 the card, "cuda:0" selected
      #
      # This was NOT a broken node — CUDA was healthy throughout (cuInit(0)
      # returned CUDA_SUCCESS in the same container). We disabled our own GPU.
      # `--/renderer/multiGpu/enabled=false` does NOT help: the skip happens
      # inside gpu.foundation.plugin before renderer settings apply (verified
      # with the flag present on Kit's command line).
      #
      # To pin a device deliberately, export CUDA_VISIBLE_DEVICES in the
      # calling environment and accept the warning above.
      - CUDA_VISIBLE_DEVICES
      # WHICH PHYSICAL CARD IS "DEVICE 0" IS NOT THE SAME ON EVERY POD.
      # With NVIDIA_VISIBLE_DEVICES left at the image default ("all"), the
      # nvidia-container-runtime enumerates every GPU the DRIVER reports on
      # the underlying bare-metal host — not just the one this pod's own
      # Docker device reservation (`count: 1`) actually grants it — and the
      # ORDER is not guaranteed to put this pod's own card first.
      #
      # MEASURED 2026-09-02 on airstack-mission-1gpu-56: `nvidia-smi -L` at
      # the POD's own (outer) shell shows exactly one GPU, UUID
      # ...0e496968... — that is the card this pod actually owns. Inside the
      # isaac-sim CONTAINER, `nvidia-smi -L` shows FOUR GPUs, and that same
      # UUID is INDEX 1, not 0: three other tenants' cards are visible
      # alongside it. Kit's default device is index 0 (mask 0x1) — on this
      # pod that was someone else's card, already at 45575/48935 MiB and 40%
      # util, so Kit's own render-graph allocation failed with
      # `ERROR_OUT_OF_DEVICE_MEMORY` and segfaulted a few seconds into scene
      # load — NOT a "not enough VRAM for this scene" failure, a "rendering
      # on somebody else's full card" failure. airstack-mission-1gpu-52 never
      # hit this because index 0 happened to already be its own card there;
      # it is pod-instance luck, not something the unset-CUDA_VISIBLE_DEVICES
      # fix above guarantees.
      #
      # Bare name = passthrough, same reasoning as CUDA_VISIBLE_DEVICES above
      # (compose renders an unset var as null / not defined, which is what we
      # want — NEVER default this to a placeholder value). Unset here means
      # "trust the image default (all)", which is only safe when device 0
      # happens to be this pod's own card. When Kit crashes with
      # `ERROR_OUT_OF_DEVICE_MEMORY` moments into scene load on a pod that
      # should have an idle card:
      #   1. `nvidia-smi -L` at the POD's own shell (not inside any
      #      container) to get this pod's actual GPU UUID.
      #   2. `docker exec isaac-sim nvidia-smi -L` to find which index that
      #      UUID lands at inside the container.
      #   3. If it is not 0, recreate the container with
      #      `NVIDIA_VISIBLE_DEVICES=<that UUID>` exported in the calling
      #      shell before `docker compose up -d --force-recreate isaac-sim`
      #      (a running container's device bindings are fixed at creation —
      #      a `docker exec`-scoped env override does not reach them).
      # DO NOT set this to a bare index (`0`, `1`, ...) as a general fix —
      # the index is only stable for one specific pod's lifetime; the UUID
      # is the only thing worth hardcoding into a resubmit.
      - NVIDIA_VISIBLE_DEVICES
      # MULTI-GPU RENDERING. Spreads the drones' ZED render products across the
      # visible cards. Empty/unset = OFF (the launcher treats "", 0, 1, false,
      # off, no as off), so this is inert until .env sets it.
      #
      # Why it was off: Kit's OWN default is multiGpu/enabled=True, which makes
      # it probe every device NVML reports and, when NVML and CUDA disagree,
      # drop EVERY card and render in software. That disagreement was caused by
      # CUDA_VISIBLE_DEVICES being pinned to a subset while the runtime injected
      # all four device nodes — see the long comment above. With CVD now passed
      # through as a bare name (i.e. left unset), they agree: measured
      # 2026-08-31 on the running sim, 0 "CUDA being in bad state" lines,
      # NVML = 4, cuInit = 0, CUDA devices = 4.
      #
      # DO NOT also set ISAAC_SIM_CUDA_DEVICES to a subset while using this —
      # that is exactly what recreated the mismatch.
      # Verify it took: the Kit log's SceneRenderer line should stop saying
      # `device mask: 0x1` UNLESS index 0 is confirmed (via the UUID check
      # above) to be this pod's own card, in which case 0x1 is correct.
      - ISAAC_SIM_MULTIGPU=${ISAAC_SIM_MULTIGPU:-}
      # RENDERER GPU PIN. NVIDIA_VISIBLE_DEVICES/CUDA_VISIBLE_DEVICES do not
      # affect Vulkan device selection at all — the renderer defaults to
      # device 0 regardless. Set this to the pod's own verified device index
      # (see the NVIDIA_VISIBLE_DEVICES comment above for how to find it) if
      # device 0 is not confirmed to be this pod's own idle card. Same
      # host-does-not-forward-automatically rule as every other var here.
      - ISAAC_SIM_ACTIVE_GPU=${ISAAC_SIM_ACTIVE_GPU:-}
      # Spawn + scene knobs a mission sets in its `env:`. Compose does NOT
      # forward the host environment automatically — a var absent here simply
      # never reaches the launch script, which looks like the script ignoring
      # the mission rather than like a plumbing gap.
      - SPAWN_CONFIGS=${SPAWN_CONFIGS:-}
      - SPAWN_POLY=${SPAWN_POLY:-}
      - SPAWN_SEED=${SPAWN_SEED:-}
      - SPAWN_HEIGHT_M=${SPAWN_HEIGHT_M:-}
      - SPAWN_MIN_DIST_M=${SPAWN_MIN_DIST_M:-}
      - SPAWN_MARGIN_M=${SPAWN_MARGIN_M:-}
      - ENV_URL=${ENV_URL:-}
      - STAGE_SCALE=${STAGE_SCALE:-}
      - OVERHEAD_CENTER_X_M=${OVERHEAD_CENTER_X_M:-}
      - OVERHEAD_CENTER_Y_M=${OVERHEAD_CENTER_Y_M:-}
      - OVERHEAD_COVERAGE_M=${OVERHEAD_COVERAGE_M:-}
      - OVERHEAD_ALTITUDE_M=${OVERHEAD_ALTITUDE_M:-}
      - OVERHEAD_PX_PER_METER=${OVERHEAD_PX_PER_METER:-}
      - RESULTS_SCENE=${RESULTS_SCENE:-}
      - GT_ANNOTATIONS=${GT_ANNOTATIONS:-off}
      # The generated wildfire plat: where its baked archetypes come from, and
      # what `airstack://` resolves to. A pod's clone carries neither the bake
      # nor the AEC packs, so both must point at Nucleus there.
      - ARCH_DIR=${ARCH_DIR:-}
      # Earthquake scene knobs (downtown_quake / bake_quake / eq_building_bench
      # launchers). Same rule: a var not listed here never reaches the script.
      - EPICENTER=${EPICENTER:-}
      - MAGNITUDE=${MAGNITUDE:-}
      - ASSET_SET=${ASSET_SET:-}
      - CITIES=${CITIES:-}
      - CITY_SIZE_M=${CITY_SIZE_M:-}
      - CITY_GAP_M=${CITY_GAP_M:-}
      - CITY_SEEDS=${CITY_SEEDS:-}
      - QUAKE_INTERACT=${QUAKE_INTERACT:-}
      - KEEP_OPEN=${KEEP_OPEN:-}
      - SOFT_SOIL=${SOFT_SOIL:-}
      - QUAKE_SEED=${QUAKE_SEED:-}
      - QUAKE_TILT=${QUAKE_TILT:-}
      - QUAKE_GROUND=${QUAKE_GROUND:-}
      - ARCH_STYLES=${ARCH_STYLES:-}
      - ARCH_GRADES=${ARCH_GRADES:-}
      - ARCH_SEED=${ARCH_SEED:-}
      - ARCH_VARIANTS=${ARCH_VARIANTS:-}
      - SETTLE_STEPS=${SETTLE_STEPS:-}
      - SNAP_DIR=${SNAP_DIR:-}
      - EQ_STYLE=${EQ_STYLE:-}
      - EQ_RECIPES=${EQ_RECIPES:-}
      - EQ_SEED=${EQ_SEED:-}
      - AIRSTACK_ASSET_ROOT=${AIRSTACK_ASSET_ROOT:-}
      - PEOPLE_POLES=${PEOPLE_POLES:-}
      # Preview-scene knobs (modular_house_preview_launch_script.py). Same rule
      # as the spawn block above: a var not listed here never reaches the script.
      # All are forwarded EMPTY-tolerant; the script supplies the defaults.
      - SPAWN_DRONE=${SPAWN_DRONE:-}
      - HOUSE_LIMIT=${HOUSE_LIMIT:-}
      - HOUSE_SEED=${HOUSE_SEED:-}
      - HOUSE_SPACING=${HOUSE_SPACING:-}
      - HOUSE_DRESS=${HOUSE_DRESS:-}
      - DRONE_XY=${DRONE_XY:-}
      - DRONE_Z_M=${DRONE_Z_M:-}
      # Downward ZED tilt in degrees. Empty/0 = the level mount every
      # method but CoNavGPT assumes; search_planner reads the same var so the
      # planner's camera_pitch_rad cannot disagree with the mount.
      - ZED_PITCH_DEG=${ZED_PITCH_DEG:-}
      - ZED_WIDTH=${ZED_WIDTH:-}
      - ZED_HEIGHT=${ZED_HEIGHT:-}
      # Pegasus physics tuning — read by pegasus/simulator/params.py
      - PX4_PHYSICS_HZ=${PX4_PHYSICS_HZ:-100}
      - ARDUPILOT_PHYSICS_HZ=${ARDUPILOT_PHYSICS_HZ:-800}
      - PX4_RENDERING_HZ=${PX4_RENDERING_HZ:-30}
      - ARDUPILOT_RENDERING_HZ=${ARDUPILOT_RENDERING_HZ:-120}
    deploy:
      # let it use the GPU
      resources:
        reservations:
          devices:
            - driver: nvidia # https://stackoverflow.com/a/70761193
              count: 1
              capabilities: [ gpu ]
    volumes:
       # display
      - $HOME/.Xauthority:/isaac-sim/.Xauthority
      - /tmp/.X11-unix:/tmp/.X11-unix
      # isaac sim stuff
      - $HOME/docker/isaac-sim/cache/main:/isaac-sim/.cache:rw \
      - $HOME/docker/isaac-sim/cache/computecache:/isaac-sim/.nv/ComputeCache:rw \
      - $HOME/docker/isaac-sim/logs:/isaac-sim/.nvidia-omniverse/logs:rw \
      - $HOME/docker/isaac-sim/config:/isaac-sim/.nvidia-omniverse/config:rw \
      - $HOME/docker/isaac-sim/data:/isaac-sim/.local/share/ov/data:rw \
      - $HOME/docker/isaac-sim/pkg:/isaac-sim/.local/share/ov/pkg:rw \
      # pegasus integration
      - ../extensions/PegasusSimulator/extensions/pegasus.simulator:/isaac-sim/.local/share/ov/data/documents/Kit/shared/exts/pegasus.simulator/:rw
      # omniverse
      - ./omniverse.toml:/isaac-sim/.nvidia-omniverse/config/omniverse.toml:rw
      # The DDS profile, MOUNTED rather than left to the image. Dockerfile.isaac-ros
      # COPYs docker/fastdds.xml to /isaac-sim/.ros/fastdds.xml at BUILD time, so
      # an image built before that file last changed carries the old profile —
      # which is what happened here: the image predates the LARGE_DATA switch and
      # still shipped a UDP-only profile with useBuiltinTransports=false. The
      # robot and gcs containers announce TCP locators (common/fastdds.xml), an
      # Isaac writer with no TCP transport can never match them, and the symptom
      # is camera topics that ADVERTISE and never deliver a frame. Mounting it
      # makes the file config rather than a build artefact, like .bashrc and
      # omniverse.toml beside it.
      - ./fastdds.xml:/isaac-sim/.ros/fastdds.xml:ro
      - ./user.config.json:/isaac-sim/.local/share/ov/data/Kit/Isaac-Sim Full/5.1/user.config.json:rw # enables pegasus extension; IMPORTANT: set the version number without the trailing .0
      # developer stuff
      - .dev:/isaac-sim/.dev:rw # developer config
      - .bashrc:/isaac-sim/.bashrc:rw # bash config
      - ../../../common/inputrc:/etc/inputrc:rw # for using page up/down to search through command history
      - ../../../common/.tmux.conf:/isaac-sim/.tmux.conf:rw
      # airstack code
      - ../../..:/isaac-sim/AirStack:rw
      - ../../../.devcontainer/isaac-sim/launch.json:/isaac-sim/AirStack/.vscode/launch.json:rw
      - ../../../.devcontainer/isaac-sim/tasks.json:/isaac-sim/AirStack/.vscode/tasks.json:rw
      # THE FROZEN DATASET, OUTSIDE THE REPO ON PURPOSE. `final_disaster_dataset`
      # is hundreds of MB of binary USD and texture per scene and 120 scenes at
      # the full matrix; inside the AirStack mount it sits in the working tree
      # where a stray `git add -A` can pick it up and where every `du` on the
      # repo counts it. Its own mount keeps the artefact and the source apart.
      # Override the host side with FINAL_DATASET_DIR in .env.
      - ${FINAL_DATASET_DIR:-$HOME/SEI-COA/final_disaster_dataset}:/isaac-sim/final_disaster_dataset:rw

  # ===================================================================================================================
  isaac-sim-gui:
    extends:
      service: isaac-sim
    container_name: isaac-sim-gui
    # don't spawn by default, only when you want to use the GUI
    profiles: !override
      - isaac-sim-gui
    command: >
      bash -c "tmux new -d -s isaac; 
        tmux send-keys -t isaac '/isaac-sim/runapp.sh' ENTER;  
      sleep infinity"
    networks: !reset null

  # ===================================================================================================================
  # WebRTC livestream variant for OSMO / remote dev. Headless: no X server,
  # no display, no GUI window. Kit's `omni.kit.livestream.webrtc` extension
  # serves WebSocket signaling on TCP 49100 and SRTP media on UDP 49099 (the
  # latter pinned by `app.livestream.fixedHostPort/minHostPort/maxHostPort=49099`
  # in the Pegasus launch script — see example_one_px4_pegasus_launch_script.py).
  # Those two ports are published into the host (the OSMO workspace pod's
  # network namespace) so `osmo workflow port-forward` can reach them. Kit
  # 107's default media-port range is wider and dynamic, so pinning to a
  # known value is the only way to keep the forward surface to two ports.
  #
  # Selected via COMPOSE_PROFILES (e.g. `desktop,isaac-sim-livestream`) in
  # osmo/workspace/entrypoint.sh, or by setting ISAAC_SIM_LIVESTREAM=true.
  isaac-sim-livestream:
    extends:
      service: isaac-sim
    container_name: isaac-sim-livestream
    profiles: !override
      - isaac-sim-livestream
    # Always run the Pegasus standalone path; the livestream branch in the
    # script is gated on ISAAC_SIM_LIVESTREAM=true (env-driven, additive
    # to the existing script behavior).
    command: >
      bash -c "
      tmux new -d -s isaac;
      tmux send-keys -t isaac 'PYTHONPATH=\"$$ISAAC_SIM_PYTHONPATH\" /isaac-sim/python.sh /isaac-sim/AirStack/simulation/isaac-sim/launch_scripts/${ISAAC_SIM_SCRIPT_NAME} --ext-folder ~/.local/share/ov/data/documents/Kit/shared/exts --/app/livestream/enabled=true' ENTER;
      sleep infinity"
    environment:
      # Inherit everything from isaac-sim and append:
      - ISAAC_SIM_LIVESTREAM=true
      - ISAAC_SIM_USE_STANDALONE=true
      - ISAAC_SIM_HEADLESS=true
      # EMPTY when unset, not 'false': each launch script has its own
      # default (off for example_multi_px4, on for the multi-drone scene
      # import) and a compose default silently overrides both.
      - ENABLE_LIDAR=${ENABLE_LIDAR:-}
      - SCENE_CONFIG=${SCENE_CONFIG:-}
      # A FROZEN DATASET CELL instead of a procedural build. FROZEN_SCENE
      # WINS over SCENE_CONFIG in the launch script, but only if it gets in
      # here: without these lines a mission that sets FROZEN_SCENE loses it at
      # the container boundary, the script sees only SCENE_CONFIG (`suburb`,
      # from the repo's .env, because `Stack.apply_env` MERGES and cannot
      # unset), rebuilds the plat procedurally and dies in `load_archetypes` —
      # the archetype bake is not in git and a pod's clone has none. The crash
      # names the archetypes, so it reads like a missing-asset problem rather
      # than like a scene that was never asked for.
      - FROZEN_SCENE=${FROZEN_SCENE:-}
      - FROZEN_DATASET_ROOT=${FROZEN_DATASET_ROOT:-}
      # Extra authored layer referenced on top of a frozen cell at
      # /World/Overlay (e.g. the standing-person A/B detection rig).
      - FROZEN_OVERLAY_USD=${FROZEN_OVERLAY_USD:-}
      # BARE NAME, like DETECTOR_URL in robot-base-docker-compose.yaml: the
      # script's default is 'ground' and `${SUBURB_COLLIDERS:-}` would define
      # this EMPTY, which is not 'off' and not 'ground' — it falls through to
      # colliding the WHOLE plat (6k+ referenced objects) instead of the ground
      # sheet. Unset must mean unset.
      - SUBURB_COLLIDERS
      # FROZEN-CELL LIGHTING. A frozen cell ships no sky (measured: every
      # Fire cell has one 0.25 m SphereLight, every Tornado cell has none), so
      # the launcher authors a dome + sun for it. Every one of these is
      # OPTIONAL and safe empty — the launcher reads them as
      # `os.environ.get(X) or <default>`, so `${X:-}` rendering an empty
      # string still yields the shipped default. They are listed only so a
      # mission CAN move the sun or the exposure; without these lines setting
      # them in a mission would be silently dropped at the container boundary,
      # which is exactly how FROZEN_SCENE was lost before.
      - FROZEN_LIGHT=${FROZEN_LIGHT:-}
      - FROZEN_SKY=${FROZEN_SKY:-}
      - FROZEN_DOME_INTENSITY=${FROZEN_DOME_INTENSITY:-}
      - FROZEN_DOME_EXPOSURE=${FROZEN_DOME_EXPOSURE:-}
      - FROZEN_SUN=${FROZEN_SUN:-}
      - FROZEN_SUN_INTENSITY=${FROZEN_SUN_INTENSITY:-}
      - FROZEN_SUN_ELEV_DEG=${FROZEN_SUN_ELEV_DEG:-}
      - FROZEN_SUN_AZ_DEG=${FROZEN_SUN_AZ_DEG:-}
      - FROZEN_KILL_STRAY_LIGHTS=${FROZEN_KILL_STRAY_LIGHTS:-}
      # FROZEN-CELL ASSET REBASE. A cell's textures are baked as absolute
      # build-container paths under scene_gen/assets, and aec/ objaverse/ and
      # materials/scorched/ are git-ignored — so a pod's clone has none of
      # them and the ground renders untextured. The launcher repoints any
      # ABSENT one at the Nucleus mirror. Safe empty, same as above.
      - FROZEN_REBASE_ASSETS=${FROZEN_REBASE_ASSETS:-}
      - FROZEN_ASSET_LOCAL_PREFIX=${FROZEN_ASSET_LOCAL_PREFIX:-}
      - FROZEN_ASSET_MIRROR=${FROZEN_ASSET_MIRROR:-}
      # Spec overrides: a preset names a KIND of scene, these pick the
      # instance (size, disaster, severity). Unset leaves the preset alone.
      - REGION_M=${REGION_M:-}
      - DISASTER_TYPE=${DISASTER_TYPE:-}
      - SEVERITY=${SEVERITY:-}
      - HOUSE_YAW_OFFSET_DEG=${HOUSE_YAW_OFFSET_DEG:-}
      - DUMP_HOUSE_POSES=${DUMP_HOUSE_POSES:-}
      # Must match the robot/gcs containers — mixed transport modes across
      # containers have no common data channel, and the isaacsim ros2 bridge
      # ships its own Fast DDS whose SHM segments are incompatible with the
      # ROS Jazzy one, so RTPS-over-TCP is what actually interoperates.
      - FASTDDS_BUILTIN_TRANSPORTS=${FASTDDS_BUILTIN_TRANSPORTS:-LARGE_DATA}
      # MUST default to a device, not to empty. An empty CUDA_VISIBLE_DEVICES
      # is not "unset" — it means NO devices, and Kit then fails every
      # allocation with `cudaErrorNoDevice` while `nvidia-smi -L` still
      # lists the card, which reads like a driver fault rather than a
      # config one. Override per host with ISAAC_SIM_CUDA_DEVICES.
      # DO NOT SET CUDA_VISIBLE_DEVICES FOR KIT. Bare name = passthrough:
      # docker compose renders an unset variable as null and does NOT define
      # it in the container, which is what we want. `${X:-0}` would hardcode a
      # device and `${X:-}` would define it EMPTY; both are wrong here.
      #
      # MEASURED 2026-08-31 on airstack-mission-1gpu-52. Kit prints, 2 s into
      # startup, immediately before it drops every GPU:
      #
      #     CUDA_VISIBLE_DEVICES environment variable is set.
      #     Note CUDA device enumeration and Omniverse device enumeration are
      #     different. Setting CUDA_VISIBLE_DEVICES can lead to undesired
      #     behavior or crashes.
      #     [gpu.foundation.plugin] Skipping NVIDIA GPU due CUDA being in bad
      #     state: NVIDIA RTX PRO 5000 Blackwell            (x6)
      #
      # Omniverse enumerates devices through its own path, so pinning CUDA's
      # view desynchronises the two indices, every CUDA probe fails, and Kit
      # silently falls back to SOFTWARE rendering — both cards at 0 % / 4 MiB
      # / P8 for an entire run while Isaac burns 273 % CPU, and the real-time
      # factor collapses to ~0.083 (600 sim-seconds in ~2 hours, a
      # 24-iteration sweep in ~48 h instead of a few).
      #
      # A/B on the same container, same pod, minutes apart:
      #     CUDA_VISIBLE_DEVICES=0   -> 6 bad-state lines, 4 MiB,  no GPU proc
      #     unset                    -> 0 bad-state lines, 182 MiB, Kit holds
      #                                 the card, "cuda:0" selected
      #
      # This was NOT a broken node — CUDA was healthy throughout (cuInit(0)
      # returned CUDA_SUCCESS in the same container). We disabled our own GPU.
      # `--/renderer/multiGpu/enabled=false` does NOT help: the skip happens
      # inside gpu.foundation.plugin before renderer settings apply (verified
      # with the flag present on Kit's command line).
      #
      # To pin a device deliberately, export CUDA_VISIBLE_DEVICES in the
      # calling environment and accept the warning above.
      - CUDA_VISIBLE_DEVICES
      # WHICH PHYSICAL CARD IS "DEVICE 0" IS NOT THE SAME ON EVERY POD.
      # With NVIDIA_VISIBLE_DEVICES left at the image default ("all"), the
      # nvidia-container-runtime enumerates every GPU the DRIVER reports on
      # the underlying bare-metal host — not just the one this pod's own
      # Docker device reservation (`count: 1`) actually grants it — and the
      # ORDER is not guaranteed to put this pod's own card first.
      #
      # MEASURED 2026-09-02 on airstack-mission-1gpu-56: `nvidia-smi -L` at
      # the POD's own (outer) shell shows exactly one GPU, UUID
      # ...0e496968... — that is the card this pod actually owns. Inside the
      # isaac-sim CONTAINER, `nvidia-smi -L` shows FOUR GPUs, and that same
      # UUID is INDEX 1, not 0: three other tenants' cards are visible
      # alongside it. Kit's default device is index 0 (mask 0x1) — on this
      # pod that was someone else's card, already at 45575/48935 MiB and 40%
      # util, so Kit's own render-graph allocation failed with
      # `ERROR_OUT_OF_DEVICE_MEMORY` and segfaulted a few seconds into scene
      # load — NOT a "not enough VRAM for this scene" failure, a "rendering
      # on somebody else's full card" failure. airstack-mission-1gpu-52 never
      # hit this because index 0 happened to already be its own card there;
      # it is pod-instance luck, not something the unset-CUDA_VISIBLE_DEVICES
      # fix above guarantees.
      #
      # Bare name = passthrough, same reasoning as CUDA_VISIBLE_DEVICES above
      # (compose renders an unset var as null / not defined, which is what we
      # want — NEVER default this to a placeholder value). Unset here means
      # "trust the image default (all)", which is only safe when device 0
      # happens to be this pod's own card. When Kit crashes with
      # `ERROR_OUT_OF_DEVICE_MEMORY` moments into scene load on a pod that
      # should have an idle card:
      #   1. `nvidia-smi -L` at the POD's own shell (not inside any
      #      container) to get this pod's actual GPU UUID.
      #   2. `docker exec isaac-sim nvidia-smi -L` to find which index that
      #      UUID lands at inside the container.
      #   3. If it is not 0, recreate the container with
      #      `NVIDIA_VISIBLE_DEVICES=<that UUID>` exported in the calling
      #      shell before `docker compose up -d --force-recreate isaac-sim`
      #      (a running container's device bindings are fixed at creation —
      #      a `docker exec`-scoped env override does not reach them).
      # DO NOT set this to a bare index (`0`, `1`, ...) as a general fix —
      # the index is only stable for one specific pod's lifetime; the UUID
      # is the only thing worth hardcoding into a resubmit.
      - NVIDIA_VISIBLE_DEVICES
      # MULTI-GPU RENDERING. Spreads the drones' ZED render products across the
      # visible cards. Empty/unset = OFF (the launcher treats "", 0, 1, false,
      # off, no as off), so this is inert until .env sets it.
      #
      # Why it was off: Kit's OWN default is multiGpu/enabled=True, which makes
      # it probe every device NVML reports and, when NVML and CUDA disagree,
      # drop EVERY card and render in software. That disagreement was caused by
      # CUDA_VISIBLE_DEVICES being pinned to a subset while the runtime injected
      # all four device nodes — see the long comment above. With CVD now passed
      # through as a bare name (i.e. left unset), they agree: measured
      # 2026-08-31 on the running sim, 0 "CUDA being in bad state" lines,
      # NVML = 4, cuInit = 0, CUDA devices = 4.
      #
      # DO NOT also set ISAAC_SIM_CUDA_DEVICES to a subset while using this —
      # that is exactly what recreated the mismatch.
      # Verify it took: the Kit log's SceneRenderer line should stop saying
      # `device mask: 0x1` UNLESS index 0 is confirmed (via the UUID check
      # above) to be this pod's own card, in which case 0x1 is correct.
      - ISAAC_SIM_MULTIGPU=${ISAAC_SIM_MULTIGPU:-}
      # RENDERER GPU PIN. NVIDIA_VISIBLE_DEVICES/CUDA_VISIBLE_DEVICES do not
      # affect Vulkan device selection at all — the renderer defaults to
      # device 0 regardless. Set this to the pod's own verified device index
      # (see the NVIDIA_VISIBLE_DEVICES comment above for how to find it) if
      # device 0 is not confirmed to be this pod's own idle card. Same
      # host-does-not-forward-automatically rule as every other var here.
      - ISAAC_SIM_ACTIVE_GPU=${ISAAC_SIM_ACTIVE_GPU:-}
      # Spawn + scene knobs a mission sets in its `env:`. Compose does NOT
      # forward the host environment automatically — a var absent here simply
      # never reaches the launch script, which looks like the script ignoring
      # the mission rather than like a plumbing gap.
      - SPAWN_CONFIGS=${SPAWN_CONFIGS:-}
      - SPAWN_POLY=${SPAWN_POLY:-}
      - SPAWN_SEED=${SPAWN_SEED:-}
      - SPAWN_HEIGHT_M=${SPAWN_HEIGHT_M:-}
      - SPAWN_MIN_DIST_M=${SPAWN_MIN_DIST_M:-}
      - SPAWN_MARGIN_M=${SPAWN_MARGIN_M:-}
      - ENV_URL=${ENV_URL:-}
      - STAGE_SCALE=${STAGE_SCALE:-}
      - OVERHEAD_CENTER_X_M=${OVERHEAD_CENTER_X_M:-}
      - OVERHEAD_CENTER_Y_M=${OVERHEAD_CENTER_Y_M:-}
      - OVERHEAD_COVERAGE_M=${OVERHEAD_COVERAGE_M:-}
      - OVERHEAD_ALTITUDE_M=${OVERHEAD_ALTITUDE_M:-}
      - OVERHEAD_PX_PER_METER=${OVERHEAD_PX_PER_METER:-}
      - RESULTS_SCENE=${RESULTS_SCENE:-}
      - GT_ANNOTATIONS=${GT_ANNOTATIONS:-off}
      # The generated wildfire plat: where its baked archetypes come from, and
      # what `airstack://` resolves to. A pod's clone carries neither the bake
      # nor the AEC packs, so both must point at Nucleus there.
      - ARCH_DIR=${ARCH_DIR:-}
      # Earthquake scene knobs (downtown_quake / bake_quake / eq_building_bench
      # launchers). Same rule: a var not listed here never reaches the script.
      - EPICENTER=${EPICENTER:-}
      - MAGNITUDE=${MAGNITUDE:-}
      - ASSET_SET=${ASSET_SET:-}
      - CITIES=${CITIES:-}
      - CITY_SIZE_M=${CITY_SIZE_M:-}
      - CITY_GAP_M=${CITY_GAP_M:-}
      - CITY_SEEDS=${CITY_SEEDS:-}
      - QUAKE_INTERACT=${QUAKE_INTERACT:-}
      - KEEP_OPEN=${KEEP_OPEN:-}
      - SOFT_SOIL=${SOFT_SOIL:-}
      - QUAKE_SEED=${QUAKE_SEED:-}
      - QUAKE_TILT=${QUAKE_TILT:-}
      - QUAKE_GROUND=${QUAKE_GROUND:-}
      - ARCH_STYLES=${ARCH_STYLES:-}
      - ARCH_GRADES=${ARCH_GRADES:-}
      - ARCH_SEED=${ARCH_SEED:-}
      - ARCH_VARIANTS=${ARCH_VARIANTS:-}
      - SETTLE_STEPS=${SETTLE_STEPS:-}
      - SNAP_DIR=${SNAP_DIR:-}
      - EQ_STYLE=${EQ_STYLE:-}
      - EQ_RECIPES=${EQ_RECIPES:-}
      - EQ_SEED=${EQ_SEED:-}
      - AIRSTACK_ASSET_ROOT=${AIRSTACK_ASSET_ROOT:-}
      - PEOPLE_POLES=${PEOPLE_POLES:-}
      # Preview-scene knobs (modular_house_preview_launch_script.py). Same rule
      # as the spawn block above: a var not listed here never reaches the script.
      # All are forwarded EMPTY-tolerant; the script supplies the defaults.
      - SPAWN_DRONE=${SPAWN_DRONE:-}
      - HOUSE_LIMIT=${HOUSE_LIMIT:-}
      - HOUSE_SEED=${HOUSE_SEED:-}
      - HOUSE_SPACING=${HOUSE_SPACING:-}
      - HOUSE_DRESS=${HOUSE_DRESS:-}
      - DRONE_XY=${DRONE_XY:-}
      - DRONE_Z_M=${DRONE_Z_M:-}
      # Downward ZED tilt in degrees. Empty/0 = the level mount every
      # method but CoNavGPT assumes; search_planner reads the same var so the
      # planner's camera_pitch_rad cannot disagree with the mount.
      - ZED_PITCH_DEG=${ZED_PITCH_DEG:-}
      - ZED_WIDTH=${ZED_WIDTH:-}
      - ZED_HEIGHT=${ZED_HEIGHT:-}
    # Publish the WebRTC livestream ports to the pod NS. Bridge-mode +
    # publish (the conservative choice) keeps the rest of the stack on
    # airstack_network for DDS multicast.
    ports:
      - "49100:49100/tcp"      # WebSocket signaling (omni.kit.livestream.webrtc, app.livestream.port=49100)
      - "49099:49099/udp"      # SRTP media (pinned via app.livestream.fixedHostPort=49099 in the launch script)
    # Drop X11-specific volume mounts inherited from the isaac-sim service —
    # there is no X server in an OSMO pod.
    volumes: !override
      - $HOME/docker/isaac-sim/cache/main:/isaac-sim/.cache:rw
      - $HOME/docker/isaac-sim/cache/computecache:/isaac-sim/.nv/ComputeCache:rw
      - $HOME/docker/isaac-sim/logs:/isaac-sim/.nvidia-omniverse/logs:rw
      - $HOME/docker/isaac-sim/config:/isaac-sim/.nvidia-omniverse/config:rw
      - $HOME/docker/isaac-sim/data:/isaac-sim/.local/share/ov/data:rw
      - $HOME/docker/isaac-sim/pkg:/isaac-sim/.local/share/ov/pkg:rw
      - ../extensions/PegasusSimulator/extensions/pegasus.simulator:/isaac-sim/.local/share/ov/data/documents/Kit/shared/exts/pegasus.simulator/:rw
      - ./omniverse.toml:/isaac-sim/.nvidia-omniverse/config/omniverse.toml:rw
      # The DDS profile, MOUNTED rather than left to the image. Dockerfile.isaac-ros
      # COPYs docker/fastdds.xml to /isaac-sim/.ros/fastdds.xml at BUILD time, so
      # an image built before that file last changed carries the old profile —
      # which is what happened here: the image predates the LARGE_DATA switch and
      # still shipped a UDP-only profile with useBuiltinTransports=false. The
      # robot and gcs containers announce TCP locators (common/fastdds.xml), an
      # Isaac writer with no TCP transport can never match them, and the symptom
      # is camera topics that ADVERTISE and never deliver a frame. Mounting it
      # makes the file config rather than a build artefact, like .bashrc and
      # omniverse.toml beside it.
      - ./fastdds.xml:/isaac-sim/.ros/fastdds.xml:ro
      - ./user.config.json:/isaac-sim/.local/share/ov/data/Kit/Isaac-Sim Full/5.1/user.config.json:rw
      - .dev:/isaac-sim/.dev:rw
      - .bashrc:/isaac-sim/.bashrc:rw
      - ../../../common/inputrc:/etc/inputrc:rw
      - ../../../common/.tmux.conf:/isaac-sim/.tmux.conf:rw
      - ../../..:/isaac-sim/AirStack:rw
      - ../../../.devcontainer/isaac-sim/launch.json:/isaac-sim/AirStack/.vscode/launch.json:rw
      - ../../../.devcontainer/isaac-sim/tasks.json:/isaac-sim/AirStack/.vscode/tasks.json:rw
      # THE FROZEN DATASET, OUTSIDE THE REPO ON PURPOSE. `final_disaster_dataset`
      # is hundreds of MB of binary USD and texture per scene and 120 scenes at
      # the full matrix; inside the AirStack mount it sits in the working tree
      # where a stray `git add -A` can pick it up and where every `du` on the
      # repo counts it. Its own mount keeps the artefact and the source apart.
      # Override the host side with FINAL_DATASET_DIR in .env.
      - ${FINAL_DATASET_DIR:-$HOME/SEI-COA/final_disaster_dataset}:/isaac-sim/final_disaster_dataset:rw
