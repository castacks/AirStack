services:
  isaac-sim:
    profiles:
      - isaac-sim
    image: &image_tag ${PROJECT_DOCKER_REGISTRY}/${PROJECT_NAME}:v${VERSION}_isaac-sim
    build:
      context: ../
      dockerfile: docker/Dockerfile.isaac-ros
      tags:
        - *image_tag
        # Floating tag republished by docker-build.yml on main/develop. The
        # versioned tag above never exists yet on a PR (check-version-increment
        # forces VERSION up), so it can only ever be a cache miss.
        - &cache_tag ${PROJECT_DOCKER_REGISTRY}/${PROJECT_NAME}:${CACHE_TAG:-cache}_isaac-sim
      cache_from:
        - *image_tag
        - *cache_tag
    container_name: isaac-sim
    entrypoint: ""
    command: >
      bash -c "
      tmux new -d -s isaac;
      if [ $$AUTOLAUNCH = 'true' ]; then
        if [ \"${ISAAC_SIM_USE_STANDALONE}\" = 'true' ]; then
          tmux send-keys -t isaac 'PYTHONPATH="$$ISAAC_SIM_PYTHONPATH" /isaac-sim/python.sh /isaac-sim/AirStack/simulation/isaac-sim/launch_scripts/${ISAAC_SIM_SCRIPT_NAME} --ext-folder ~/.local/share/ov/data/documents/Kit/shared/exts' ENTER
        else
          tmux send-keys -t isaac 'ros2 launch isaacsim run_isaacsim.launch.py install_path:=/isaac-sim gui:=\"${ISAAC_SIM_GUI}\" play_sim_on_start:=\"${PLAY_SIM_ON_START}\" ' ENTER
        fi
      fi;
      sleep infinity"
    # Interactive shell
    stdin_open: true # docker run -i
    tty: true # docker run -t
    ipc: host
    privileged: true
    networks:
      airstack_network:
        # INVARIANT: every sim service (isaac-sim, ms-airsim, simple-sim)
        # binds this same fixed address — robot containers reach the sim at
        # SIM_IP (default 172.31.0.200), so only one sim can run at a time.
        ipv4_address: 172.31.0.200
    env_file:
      - ./omni_pass.env
      # PX4 SITL parameter set, applied by rcS at boot.
      - ./px4-params/${PX4_PARAM_SET:-default}.env
    environment:
      - AUTOLAUNCH=${AUTOLAUNCH:-'false'}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # Isaac Sim stuff
      - PLAY_SIM_ON_START=${PLAY_SIM_ON_START}
      - NUM_ROBOTS=${NUM_ROBOTS:-1}
      # EMPTY when unset, not 'false': each launch script has its own
      # default (off for example_multi_px4 and fleet_spawn, on for the
      # multi-drone scene import) and a compose default silently overrides
      # both. Every consumer reads an empty value as off, so this is the same
      # thing for the scripts that want it off.
      - ENABLE_LIDAR=${ENABLE_LIDAR:-}
      # Fleet spawner input: fleet_spawn.py maps the robot-container
      # path onto this container's /isaac-sim/AirStack checkout mount.
      - FLEET_CONFIG_FILE=${FLEET_CONFIG_FILE:-}
      - ISAAC_SIM_HEADLESS=${ISAAC_SIM_HEADLESS:-false}
      # Scene selection (`airstack up --scene <shortname>` → simulation/scenes.yaml):
      # a Pegasus SIMULATION_ENVIRONMENTS key or a USD URL, resolved by the
      # launch scripts (pegasus_app.resolve_scene_from_env). Empty = script default.
      - ISAAC_SIM_SCENE=${ISAAC_SIM_SCENE:-}
      - ISAAC_SIM_STAGE_SCALE=${ISAAC_SIM_STAGE_SCALE:-}
      # Viewport follow-camera (pegasus_app.py): domain id of the drone to
      # chase (default 1; off/none/0 disables) and its world-frame x,y,z
      # offset in meters.
      - ISAAC_SIM_FOLLOW_CAM=${ISAAC_SIM_FOLLOW_CAM:-}
      - ISAAC_SIM_FOLLOW_CAM_OFFSET=${ISAAC_SIM_FOLLOW_CAM_OFFSET:-}
      # Optional raw sensor_msgs/Image feed of the follow camera (topic name,
      # published on the followed drone's ROS domain) and its "WxH" resolution
      # — a third-person video source for headless runs.
      - ISAAC_SIM_FOLLOW_CAM_TOPIC=${ISAAC_SIM_FOLLOW_CAM_TOPIC:-}
      - ISAAC_SIM_FOLLOW_CAM_RES=${ISAAC_SIM_FOLLOW_CAM_RES:-}
      # Spawn-row center "x,y" in meters (default origin) — for scenes whose
      # origin is cluttered; see launch_scripts/pegasus_app.py.
      - ISAAC_SIM_SPAWN_XY=${ISAAC_SIM_SPAWN_XY:-}
      # Dome light override "intensity[,exposure]" for dim indoor scenes.
      - ISAAC_SIM_DOME_LIGHT=${ISAAC_SIM_DOME_LIGHT:-}
      # Multiply the scene's own lights (office/hospital ceiling lights are
      # authored dim); follow-cam headlight intensity for unlit interiors.
      - ISAAC_SIM_LIGHT_BOOST=${ISAAC_SIM_LIGHT_BOOST:-}
      - ISAAC_SIM_FOLLOW_CAM_LIGHT=${ISAAC_SIM_FOLLOW_CAM_LIGHT:-}
      # ---------------------------------------------------------------
      # FROZEN DATASET CELL (example_multi_drone_scene_import.py). Compose does
      # NOT forward the host environment automatically — a var absent here
      # never reaches the launch script, which looks like the script ignoring
      # the mission rather than like a plumbing gap.
      # ---------------------------------------------------------------
      # A FROZEN DATASET CELL instead of a procedural build. FROZEN_SCENE
      # WINS over SCENE_CONFIG in the launch script, but only if it gets in
      # here: without these lines a mission that sets FROZEN_SCENE loses it at
      # the container boundary and the script sees only SCENE_CONFIG.
      - FROZEN_SCENE=${FROZEN_SCENE:-}
      - FROZEN_DATASET_ROOT=${FROZEN_DATASET_ROOT:-}
      # Extra authored layer referenced on top of a frozen cell at
      # /World/Overlay (e.g. the standing-person A/B detection rig).
      - FROZEN_OVERLAY_USD=${FROZEN_OVERLAY_USD:-}
      # Scene to GENERATE. Inert on this branch: scene_gen/ was not ported, so
      # a non-empty value exits with a message pointing at FROZEN_SCENE.
      - SCENE_CONFIG=${SCENE_CONFIG:-}
      # BARE NAME, like CUDA_VISIBLE_DEVICES below: the script's default is
      # 'ground' and `${SUBURB_COLLIDERS:-}` would define this EMPTY, which is
      # neither 'off' nor 'ground' — it falls through to colliding the WHOLE
      # plat instead of the ground sheet. Unset must mean unset.
      - SUBURB_COLLIDERS
      # FROZEN-CELL LIGHTING. A frozen cell ships no sky (measured: every Fire
      # cell has one 0.25 m SphereLight, every Tornado cell has none), so the
      # launcher authors a dome + sun for it. Every one of these is OPTIONAL
      # and safe empty — the launcher reads them as `os.environ.get(X) or
      # <default>`, so `${X:-}` rendering an empty string still yields the
      # shipped default. They are listed only so a mission CAN move the sun or
      # the exposure; without these lines setting them in a mission would be
      # silently dropped at the container boundary, which is exactly how
      # FROZEN_SCENE was lost before.
      - FROZEN_LIGHT=${FROZEN_LIGHT:-}
      - FROZEN_SKY=${FROZEN_SKY:-}
      - FROZEN_DOME_INTENSITY=${FROZEN_DOME_INTENSITY:-}
      - FROZEN_DOME_EXPOSURE=${FROZEN_DOME_EXPOSURE:-}
      - FROZEN_SUN=${FROZEN_SUN:-}
      - FROZEN_SUN_INTENSITY=${FROZEN_SUN_INTENSITY:-}
      - FROZEN_SUN_ELEV_DEG=${FROZEN_SUN_ELEV_DEG:-}
      - FROZEN_SUN_AZ_DEG=${FROZEN_SUN_AZ_DEG:-}
      - FROZEN_KILL_STRAY_LIGHTS=${FROZEN_KILL_STRAY_LIGHTS:-}
      # FROZEN-CELL ASSET REBASE. A cell's textures are baked as absolute
      # build-container paths under scene_gen/assets, and aec/ objaverse/ and
      # materials/scorched/ are git-ignored — so a checkout without the build
      # tree has none of them and the ground renders untextured. The launcher
      # repoints any ABSENT one at the Nucleus mirror. Safe empty, same as above.
      - FROZEN_REBASE_ASSETS=${FROZEN_REBASE_ASSETS:-}
      - FROZEN_ASSET_LOCAL_PREFIX=${FROZEN_ASSET_LOCAL_PREFIX:-}
      - FROZEN_ASSET_MIRROR=${FROZEN_ASSET_MIRROR:-}
      - FROZEN_GROUND_ONLY_CONTACTS=${FROZEN_GROUND_ONLY_CONTACTS:-false}
      # What `airstack://` resolves to for a rebased cell asset.
      - AIRSTACK_ASSET_ROOT=${AIRSTACK_ASSET_ROOT:-}
      # Spec overrides: a preset names a KIND of scene, these pick the
      # instance (size, disaster, severity). REGION_M also sizes the frozen
      # path's overhead camera and search rect. Unset leaves the preset alone.
      - REGION_M=${REGION_M:-}
      - DISASTER_TYPE=${DISASTER_TYPE:-}
      - SEVERITY=${SEVERITY:-}
      # Spawn knobs a mission sets in its `env:`. SPAWN_CONFIGS is a JSON list
      # of {x_m, y_m[, z_m, orient]} dicts; SPAWN_POLY randomises NUM_ROBOTS
      # spawns inside a rect or convex polygon. GENERATED/FROZEN paths only —
      # the ENV_URL fleet is the list in the launch script.
      - SPAWN_CONFIGS=${SPAWN_CONFIGS:-}
      - SPAWN_POLY=${SPAWN_POLY:-}
      - SPAWN_SEED=${SPAWN_SEED:-}
      - SPAWN_HEIGHT_M=${SPAWN_HEIGHT_M:-}
      - SPAWN_MIN_DIST_M=${SPAWN_MIN_DIST_M:-}
      - SPAWN_MARGIN_M=${SPAWN_MARGIN_M:-}
      # Ground truth: RESULTS_SCENE names the annotation files the frozen
      # loader writes out of the cell's GT_hints.json / GT_people.json.
      - RESULTS_SCENE=${RESULTS_SCENE:-}
      - GT_ANNOTATIONS=${GT_ANNOTATIONS:-off}
      # Overhead "map" camera framing (world metres) and its render budget.
      - OVERHEAD_CENTER_X_M=${OVERHEAD_CENTER_X_M:-}
      - OVERHEAD_CENTER_Y_M=${OVERHEAD_CENTER_Y_M:-}
      - OVERHEAD_COVERAGE_M=${OVERHEAD_COVERAGE_M:-}
      - OVERHEAD_ALTITUDE_M=${OVERHEAD_ALTITUDE_M:-}
      - OVERHEAD_PX_PER_METER=${OVERHEAD_PX_PER_METER:-}
      - OVERHEAD_RENDER_STEP=${OVERHEAD_RENDER_STEP:-1}
      - OVERHEAD_HYDRA_TIME_SLICE=${OVERHEAD_HYDRA_TIME_SLICE:-false}
      - OVERHEAD_RENDER_BURST=${OVERHEAD_RENDER_BURST:-8}
      # Per-drone ZED. ZED_PITCH_DEG is read by BOTH sides (the mount here and
      # the planner's camera_pitch_rad) so the two cannot disagree; the URDF
      # models no mount pitch, so TF cannot see a tilt set here.
      - ZED_PITCH_DEG=${ZED_PITCH_DEG:-}
      - ZED_WIDTH=${ZED_WIDTH:-}
      - ZED_HEIGHT=${ZED_HEIGHT:-}
      - ZED_PIPELINE=${ZED_PIPELINE:-stereo}
      - ZED_RENDER_STEP=${ZED_RENDER_STEP:-1}
      - ZED_TIME_SLICE_GROUPS=${ZED_TIME_SLICE_GROUPS:-1}
      - ZED_TIME_SLICE_BURST=${ZED_TIME_SLICE_BURST:-1}
      - ZED_HYDRA_TIME_SLICE=${ZED_HYDRA_TIME_SLICE:-false}
      - LIDAR_RENDER_STEP=${LIDAR_RENDER_STEP:-1}
      - LIDAR_TIME_SLICE_GROUPS=${LIDAR_TIME_SLICE_GROUPS:-1}
      # ---------------------------------------------------------------
      # RENDERER / PHYSICS DEVICE SELECTION.
      # ---------------------------------------------------------------
      # DO NOT SET CUDA_VISIBLE_DEVICES FOR KIT. Bare name = passthrough:
      # compose renders an unset variable as null and does NOT define it in
      # the container, which is what we want. `${X:-0}` would hardcode a
      # device and `${X:-}` would define it EMPTY; both are wrong here. Kit
      # enumerates devices through Omniverse's own path, so pinning CUDA's
      # view desynchronises the two indices, every CUDA probe fails, and Kit
      # silently falls back to SOFTWARE rendering.
      - CUDA_VISIBLE_DEVICES
      # Same passthrough rule. Which physical card is "device 0" is not the
      # same on every host; to pin one, export NVIDIA_VISIBLE_DEVICES=<UUID>
      # (from `nvidia-smi -L`) before `docker compose up -d --force-recreate`
      # — a running container's device bindings are fixed at creation.
      - NVIDIA_VISIBLE_DEVICES
      # RENDERER GPU PIN. NVIDIA_VISIBLE_DEVICES/CUDA_VISIBLE_DEVICES do not
      # affect Vulkan device selection at all — the renderer defaults to
      # device 0 regardless, and on a host whose device 0 is someone else's
      # loaded card that shows up as an unexplained segfault minutes into
      # scene load. Single-GPU workstation: leave at 0.
      - ISAAC_SIM_ACTIVE_GPU=${ISAAC_SIM_ACTIVE_GPU:-}
      # Spreads the drones' ZED render products across the visible cards.
      # Empty/unset = OFF (the launcher treats "", 0, 1, false, off, no as off).
      - ISAAC_SIM_MULTIGPU=${ISAAC_SIM_MULTIGPU:-}
      # Pegasus defaults World to CPU. The launcher primes SimulationManager
      # before PhysicsContext construction when this is true; setting only
      # World(device=cuda) happens too late to enable GPU dynamics in 5.1.
      - ISAAC_SIM_GPU_PHYSICS=${ISAAC_SIM_GPU_PHYSICS:-false}
      - ISAAC_SIM_LEGACY_COOKING=${ISAAC_SIM_LEGACY_COOKING:-false}
      - ISAAC_SIM_FABRIC_SCENE_DELEGATE=${ISAAC_SIM_FABRIC_SCENE_DELEGATE:-}
      - ISAAC_SIM_DLSS_MODE=${ISAAC_SIM_DLSS_MODE:-}
      - ISAAC_SIM_AA_MODE=${ISAAC_SIM_AA_MODE:-}
      - ISAAC_SIM_DISABLE_MOTION_BVH=${ISAAC_SIM_DISABLE_MOTION_BVH:-false}
      - ISAAC_SIM_DISABLE_VIEWPORT_UPDATES=${ISAAC_SIM_DISABLE_VIEWPORT_UPDATES:-false}
      # Pegasus physics tuning — read by pegasus/simulator/params.py
      - PX4_PHYSICS_HZ=${PX4_PHYSICS_HZ:-100}
      - ARDUPILOT_PHYSICS_HZ=${ARDUPILOT_PHYSICS_HZ:-800}
      - PX4_RENDERING_HZ=${PX4_RENDERING_HZ:-30}
      - ARDUPILOT_RENDERING_HZ=${ARDUPILOT_RENDERING_HZ:-120}
    deploy:
      # let it use the GPU
      resources:
        reservations:
          devices:
            - driver: nvidia # https://stackoverflow.com/a/70761193
              count: 1
              capabilities: [ gpu ]
    volumes:
       # display
      - $HOME/.Xauthority:/isaac-sim/.Xauthority
      - /tmp/.X11-unix:/tmp/.X11-unix
      # isaac sim stuff
      - $HOME/docker/isaac-sim/cache/main:/isaac-sim/.cache:rw \
      - $HOME/docker/isaac-sim/cache/computecache:/isaac-sim/.nv/ComputeCache:rw \
      - $HOME/docker/isaac-sim/logs:/isaac-sim/.nvidia-omniverse/logs:rw \
      - $HOME/docker/isaac-sim/config:/isaac-sim/.nvidia-omniverse/config:rw \
      - $HOME/docker/isaac-sim/data:/isaac-sim/.local/share/ov/data:rw \
      - $HOME/docker/isaac-sim/pkg:/isaac-sim/.local/share/ov/pkg:rw \
      # pegasus integration
      - ../extensions/PegasusSimulator/extensions/pegasus.simulator:/isaac-sim/.local/share/ov/data/documents/Kit/shared/exts/pegasus.simulator/:rw
      # omniverse
      - ./omniverse.toml:/isaac-sim/.nvidia-omniverse/config/omniverse.toml:rw
      - ./user.config.json:/isaac-sim/.local/share/ov/data/Kit/Isaac-Sim Full/5.1/user.config.json:rw # enables pegasus extension; IMPORTANT: set the version number without the trailing .0
      # developer stuff
      - .dev:/isaac-sim/.dev:rw # developer config
      - .bashrc:/isaac-sim/.bashrc:rw # bash config
      - ../../../common/inputrc:/etc/inputrc:rw # for using page up/down to search through command history
      - ../../../common/.tmux.conf:/isaac-sim/.tmux.conf:rw
      # airstack code
      - ../../..:/isaac-sim/AirStack:rw
      - ../../../.devcontainer/isaac-sim/launch.json:/isaac-sim/AirStack/.vscode/launch.json:rw
      - ../../../.devcontainer/isaac-sim/tasks.json:/isaac-sim/AirStack/.vscode/tasks.json:rw
      # THE FROZEN DATASET, OUTSIDE THE REPO ON PURPOSE. `final_disaster_dataset`
      # is hundreds of MB of binary USD and texture per cell; inside the
      # AirStack mount it sits in the working tree where a stray `git add -A`
      # can pick it up and where every `du` on the repo counts it. Its own
      # mount keeps the artefact and the source apart. Override the host side
      # with FINAL_DATASET_DIR in .env.
      - ${FINAL_DATASET_DIR:-$HOME/SEI-COA/final_disaster_dataset}:/isaac-sim/final_disaster_dataset:rw
      # A frozen cell's materials still reference the build machine's
      # scene_gen/assets (AEC packs, megascans). This branch carries no scene_gen,
      # so mount the asset packs from the checkout that built the cell, read-only.
      - ${SCENE_ASSETS_DIR:-$HOME/SEI-COA/disaster-dataset/scene_gen/assets}:/isaac-sim/AirStack/scene_gen/assets:ro

  # ===================================================================================================================
  # Full Isaac Sim GUI editor for USD/scene editing on any asset (runapp.sh,
  # no Pegasus/ROS launch script). Deliberately NOT on airstack_network — no
  # DDS reaches the robots, so it is for scene authoring, not for flying.
  # Run with: airstack up --profile isaac-sim-gui isaac-sim-gui
  # See docs/simulation/isaac_sim/docker.md ("GUI-Only Mode").
  isaac-sim-gui:
    extends:
      service: isaac-sim
    container_name: isaac-sim-gui
    # don't spawn by default, only when you want to use the GUI
    profiles: !override
      - isaac-sim-gui
    command: >
      bash -c "tmux new -d -s isaac; 
        tmux send-keys -t isaac '/isaac-sim/runapp.sh' ENTER;  
      sleep infinity"
    networks: !reset null

  # ===================================================================================================================
  # WebRTC livestream variant for OSMO / remote dev. Headless: no X server,
  # no display, no GUI window. Kit's `omni.kit.livestream.webrtc` extension
  # serves WebSocket signaling on TCP 49100 and SRTP media on UDP 49099 (the
  # latter pinned by `app.livestream.fixedHostPort/minHostPort/maxHostPort=49099`
  # in the Pegasus launch script — see example_one_px4_pegasus_launch_script.py).
  # Those two ports are published into the host (the OSMO workspace pod's
  # network namespace) so `osmo workflow port-forward` can reach them. Kit
  # 107's default media-port range is wider and dynamic, so pinning to a
  # known value is the only way to keep the forward surface to two ports.
  #
  # Selected via COMPOSE_PROFILES (e.g. `desktop,isaac-sim-livestream`) in
  # osmo/workspace/entrypoint.sh, or by setting ISAAC_SIM_LIVESTREAM=true.
  isaac-sim-livestream:
    extends:
      service: isaac-sim
    container_name: isaac-sim-livestream
    profiles: !override
      - isaac-sim-livestream
    # Always run the Pegasus standalone path; the livestream branch in the
    # script is gated on ISAAC_SIM_LIVESTREAM=true (env-driven, additive
    # to the existing script behavior).
    command: >
      bash -c "
      tmux new -d -s isaac;
      tmux send-keys -t isaac 'PYTHONPATH=\"$$ISAAC_SIM_PYTHONPATH\" /isaac-sim/python.sh /isaac-sim/AirStack/simulation/isaac-sim/launch_scripts/${ISAAC_SIM_SCRIPT_NAME} --ext-folder ~/.local/share/ov/data/documents/Kit/shared/exts --/app/livestream/enabled=true' ENTER;
      sleep infinity"
    environment:
      # Inherit everything from isaac-sim and append:
      - ISAAC_SIM_LIVESTREAM=true
      - ISAAC_SIM_USE_STANDALONE=true
      - ISAAC_SIM_HEADLESS=true
    # Publish the WebRTC livestream ports to the pod NS. Bridge-mode +
    # publish (the conservative choice) keeps the rest of the stack on
    # airstack_network for DDS multicast.
    ports:
      - "49100:49100/tcp"      # WebSocket signaling (omni.kit.livestream.webrtc, app.livestream.port=49100)
      - "49099:49099/udp"      # SRTP media (pinned via app.livestream.fixedHostPort=49099 in the launch script)
    # Drop X11-specific volume mounts inherited from the isaac-sim service —
    # there is no X server in an OSMO pod.
    volumes: !override
      - $HOME/docker/isaac-sim/cache/main:/isaac-sim/.cache:rw
      - $HOME/docker/isaac-sim/cache/computecache:/isaac-sim/.nv/ComputeCache:rw
      - $HOME/docker/isaac-sim/logs:/isaac-sim/.nvidia-omniverse/logs:rw
      - $HOME/docker/isaac-sim/config:/isaac-sim/.nvidia-omniverse/config:rw
      - $HOME/docker/isaac-sim/data:/isaac-sim/.local/share/ov/data:rw
      - $HOME/docker/isaac-sim/pkg:/isaac-sim/.local/share/ov/pkg:rw
      - ../extensions/PegasusSimulator/extensions/pegasus.simulator:/isaac-sim/.local/share/ov/data/documents/Kit/shared/exts/pegasus.simulator/:rw
      - ./omniverse.toml:/isaac-sim/.nvidia-omniverse/config/omniverse.toml:rw
      - ./user.config.json:/isaac-sim/.local/share/ov/data/Kit/Isaac-Sim Full/5.1/user.config.json:rw
      - .dev:/isaac-sim/.dev:rw
      - .bashrc:/isaac-sim/.bashrc:rw
      - ../../../common/inputrc:/etc/inputrc:rw
      - ../../../common/.tmux.conf:/isaac-sim/.tmux.conf:rw
      - ../../..:/isaac-sim/AirStack:rw
      - ../../../.devcontainer/isaac-sim/launch.json:/isaac-sim/AirStack/.vscode/launch.json:rw
      - ../../../.devcontainer/isaac-sim/tasks.json:/isaac-sim/AirStack/.vscode/tasks.json:rw
      # THE FROZEN DATASET, OUTSIDE THE REPO ON PURPOSE. `final_disaster_dataset`
      # is hundreds of MB of binary USD and texture per cell; inside the
      # AirStack mount it sits in the working tree where a stray `git add -A`
      # can pick it up and where every `du` on the repo counts it. Its own
      # mount keeps the artefact and the source apart. Override the host side
      # with FINAL_DATASET_DIR in .env.
      - ${FINAL_DATASET_DIR:-$HOME/SEI-COA/final_disaster_dataset}:/isaac-sim/final_disaster_dataset:rw
      # A frozen cell's materials still reference the build machine's
      # scene_gen/assets (AEC packs, megascans). This branch carries no scene_gen,
      # so mount the asset packs from the checkout that built the cell, read-only.
      - ${SCENE_ASSETS_DIR:-$HOME/SEI-COA/disaster-dataset/scene_gen/assets}:/isaac-sim/AirStack/scene_gen/assets:ro
