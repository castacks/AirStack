[package]
version = "0.1.0"
title = "OptiTrack NatNet Emulator"
description = "NatNet UDP server emulator for Isaac Sim integration with natnet_ros2"
category = "Simulation"
keywords = ["optitrack", "natnet", "mocap", "simulation"]

[dependencies]
"omni.isaac.core" = {}
"omni.usd" = {}
"omni.ui" = {}
"omni.kit.menu.utils" = {}

# Pure transport/types package (no Kit UI; safe to import anywhere).
[[python.module]]
name = "optitrack.natnet.emulator"

# Kit UI entry point: NatNetEmulatorExtension (menu + config-prim authoring window).
[[python.module]]
name = "optitrack.natnet.emulator.isaac.ui_extension"

[python.build-system]
requires = ["setuptools"]
