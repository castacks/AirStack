# ---------------------------------------------------------------------------
#
# NOTE: person / drone / patch positions below are INHERITED FROM scene_0 and
# are almost certainly wrong for this scene -- geometry differs per scene. Tune
# start/target/init_pos/camera (and the patch cube) to scene_4.usd.
# Scene configuration for scene_drone_person_configuration.py
#
# test_bench/scene_4.usd background, with one drone and one person.
#
# NOTE: scene_4.usd is authored in centimeters. Instead of rescaling the scene
# (which disturbs the lighting), the scene is left native and the meter-scale
# Pegasus person and Iris drone are scaled UP by 100 to match. All positions
# below are therefore in the scene's native centimeter frame.
#
# Vectors and orientations are [x, y, z]; all orientations are in degrees.
# ---------------------------------------------------------------------------

scene:
  usd_path: "omniverse://airlab-nucleus.andrew.cmu.edu/Users/ruiwang3/test_bench/scene_4.usd"
  load_mode: sublayer          # preserves the scene's authored lighting
  scale: 1.0                   # scene left native; actors are scaled instead
  # scene_4.usd's meshes have no PhysX colliders, so the drone falls through.
  # Apply a static triangle-mesh collider to every (non-instanced) scene mesh.
  # Small scene: per-mesh colliders are cheap here and collide actual geometry
  # (not just a flat floor). For large scenes this stalls PhysX -- use ground_plane_z.
  add_collision: true
  # convexDecomposition: far cheaper to cook than exact triangle meshes ('none'),
  # which cooks at play time and can stall/crash PhysX on large scenes.
  collision_approximation: none   # none=triangle mesh; or convexHull / convexDecomposition
  # Collision precedence: non-empty names/paths, then z-range, then all meshes.
  collision_prim_names: []       # exact prim names or absolute prim paths
  collision_z_range: null        # [min_z, max_z], using world-AABB center Z
  # Cheap guaranteed floor: large static collider plane at this Z (stage units).
  # Set to the scene's floor height; null disables.
  ground_plane_z: null
  ground_plane_size: 100000.0
  play_sim_on_start: false

person:
  name: person1
  character: original_male_adult_construction_05
  start: [6118.0, 10047.0, 1689.0]
  # Walk 2 m (= 200 cm, this scene is in centimeters) forward along -Y.
  movement_segments:
    - target: [6118.0, 9847.0, 1689.0]
  orientation_yaw: -90.0       # degrees; facing -Y
  # cm scene + 100x character: ~100 cm/s reads as ~1 m/s and keeps the gait from
  # foot-sliding. 2 m then takes ~2 s of walking (after start_delay).
  walk_speed: 100.0
  start_delay: 2.0             # seconds the person waits before walking
  # cm scene: stop within 20 cm of the target so the character settles into idle
  # instead of wandering (the built-in arrival logic assumes meters).
  arrival_threshold: 20.0
  scale: 100.0               # cm scene: meter-tall character scaled up 100x to match

camera:
  # Offset back and up from the person so the viewport frames the scene.
  eye: [6618.0, 10047.0, 2089.0]
  # target: leave null to look at person.start, or set an explicit [x, y, z].
  target: null

patch:
  enabled: true
  # Fixed-position patch. Set center null and configure board to sample a
  # fully-contained position; with both null, cube-face sampling is used.
  center: [4.5, 30.0, 0.0]
  # Board fields: plane plus center+size or top_left+bottom_right.
  board: null
  # NOTE: these coords are much smaller than the cm building coords elsewhere --
  # confirm the units. size is a guess; set to the patch dimensions you want.
  size: 1.0
  prim_path: /World/EvalPatch/TexturedMeshPlane
  material_path: /World/Looks/EvalPatchOmniPBR
  albedo_path: ""
  orientation_deg: [0.0, 90.0, 0.0]
  texture_scale: [1.0, 1.0]
  size_range: [0.5, 1.0]
  size_seed: 1234
  position_seed: 5678
  target_prim_name: Cube_01
  cube_center: [0.0, 0.0, 0.0]
  cube_scale: [1.0, 1.0, 1.0]
  negative_x_face_offset: 0.01
  y_range: null
  z_range: null

drone:
  enabled: true
  prim: /World/spawned_iris/base_link
  robot_name: robot_1
  vehicle_id: 1
  domain_id: 1
  usd: "~/.local/share/ov/data/documents/Kit/shared/exts/pegasus.simulator/pegasus/simulator/assets/Robots/Iris/iris.usd"
  init_pos: [6.2, -3.5, 0.0]
  orientation_deg: [0.0, 0.0, 90.0]   # yaw +90 deg, facing +Y
  # cm scene: scale the drone up 100x to match. WARNING: visual only -- this does
  # NOT rescale the PX4/PhysX flight dynamics, so free-flight behavior will be off.
  scale: 1.0
  enable_zed: true
  enable_zed_instance_segmentation: true
  enable_zed_semantic_segmentation: true
  enable_zed_bbox_2d: true
  enable_ouster: true
