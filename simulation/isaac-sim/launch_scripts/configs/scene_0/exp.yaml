# ---------------------------------------------------------------------------
# Scene configuration for scene_drone_person_configuration.py
#
# test_bench/scene_0.usd background, with one drone and one person.
#
# NOTE: scene_0.usd is authored in CENTIMETERS and loaded natively (scene.scale
# = 1.0) to preserve its authored lighting. The meter-scale Pegasus person and
# Iris drone are therefore scaled UP by 100 (scale: 100.0), and ALL positions
# below are in centimeters.
#
# Vectors and orientations are [x, y, z]; all orientations are in degrees.
# ---------------------------------------------------------------------------

scene:
  usd_path: "omniverse://airlab-nucleus.andrew.cmu.edu/Users/ruiwang3/test_bench/scene_0.usd"
  load_mode: sublayer          # preserves the scene's authored lighting
  scale: 1.0                   # scene loaded natively in cm; actors scaled up instead
  # scene_0.usd's meshes have no PhysX colliders, so the drone falls through.
  # Apply a static collider to every (non-instanced) scene mesh.
  add_collision: true
  # convexDecomposition: far cheaper to cook than exact triangle meshes ('none'),
  # which cooks at play time and can stall/crash PhysX on large scenes.
  collision_approximation: none   # none=triangle mesh; or convexHull / convexDecomposition
  # Collision precedence: non-empty names/paths, then z-range, then all meshes.
  collision_prim_names: []       # exact prim names or absolute prim paths
  collision_z_range: null        # [min_z, max_z], using world-AABB center Z
  # Cheap guaranteed floor: large static collider plane at this Z (stage units = cm).
  # Set to the scene's floor height; null disables.
  ground_plane_z: null
  ground_plane_size: 100000.0
  play_sim_on_start: false

person:
  name: person1
  character: original_male_adult_construction_05
  start: [6118.0, 10047.0, 1689.0]
  # Walk 2 m (= 200 cm) forward along -Y.
  movement_segments:
    - target: [6118.0, 9847.0, 1689.0]
  orientation_yaw: -90.0       # degrees; facing -Y
  walk_speed: 100.0            # cm/s (~1 m/s walking pace in this cm scene)
  start_delay: 2.0             # seconds the person waits before walking
  # Stop within 20 cm of the target so the character settles into idle. MUST be
  # well under the 200 cm travel distance, else it latches "arrived" immediately
  # and never walks.
  arrival_threshold: 20.0
  scale: 100.0                 # cm scene: meter-tall character scaled up 100x

camera:
  # Offset back and up from the person so the viewport frames the scene (cm).
  eye: [6618.0, 10047.0, 2089.0]
  # target: leave null to look at person.start, or set an explicit [x, y, z].
  target: null

patch:
  # Disabled: the patch must be pinned to a real target cube in THIS scene.
  # Set enabled: true and fill cube_center / cube_scale (and optionally
  # y_range / z_range) with values (in cm) from scene_0.usd to place it.
  enabled: false
  # Force a square patch (width == height). Set false to allow rectangles.
  square: true
  # Set center for a fixed position, or board to sample a fully-contained position.
  center: null
  # Board fields: plane plus center+size or top_left+bottom_right.
  board: null
  # Set size for fixed dimensions, or leave null to sample size_range.
  size: null
  prim_path: /World/EvalPatch/TexturedMeshPlane
  material_path: /World/Looks/EvalPatchOmniPBR
  albedo_path: ""
  orientation_deg: [0.0, 90.0, 0.0]
  texture_scale: [1.0, 1.0]
  size_range: [50.0, 100.0]    # cm
  size_seed: 1234
  position_seed: 5678
  target_prim_name: Cube_01
  cube_center: [0.0, 0.0, 0.0]
  cube_scale: [1.0, 1.0, 1.0]
  negative_x_face_offset: 1.0  # cm
  y_range: null
  z_range: null

drone:
  enabled: true
  prim: /World/spawned_iris/base_link
  robot_name: robot_1
  vehicle_id: 1
  domain_id: 1
  usd: "~/.local/share/ov/data/documents/Kit/shared/exts/pegasus.simulator/pegasus/simulator/assets/Robots/Iris/iris.usd"
  init_pos: [4700.0, 7958.0, 1789.0]
  orientation_deg: [0.0, 0.0, 90.0]   # yaw +90 deg, facing +Y
  # cm scene: scale the drone up 100x to match. WARNING: visual only -- this does
  # NOT rescale the PX4/PhysX flight dynamics, so free-flight behavior will be off.
  scale: 100.0
  enable_zed: true
  enable_zed_instance_segmentation: true
  enable_zed_semantic_segmentation: true
  enable_zed_bbox_2d: true
  enable_ouster: true
