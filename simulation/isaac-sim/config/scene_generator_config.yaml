# Procedural city spec — consumed by utils/scene_generator.py
#
# Usage:
#   bake:    python utils/scene_generator.py --config <this file> --output out.usd
#   runtime: generate_scene_on_stage(stage, <this path>, scene_scale_factor=ssf)
#
# Units: meters. +X = East, +Y = North, +Z = Up. Region centered on origin.
#
# PIPELINE (generation order):
#   0. resolve   — relative usds.* paths prefixed with asset_root; per-USD
#                  footprint measured from bbox (measure_usds) else fallback_sizes
#   1. roads     — recursive subdivision of region_m into irregular blocks on a
#                  road-tile lattice; tile family + yaw from road-neighbor bitmask
#   2. ground    — per block: sidewalk ring (if assets given), grass carpet,
#                  lot subdivision with concrete alleys
#   3. buildings — largest-fitting house per lot, on a concrete pad;
#                  damaged_fraction tilted + sunk; oversized buildings get
#                  dedicated anchor blocks (lot/block maxes auto-raised to fit)
#   4. detail    — trees + humans scattered on open ground (trees.*, humans.*);
#                  streetlights, fire hydrants, trash cans along block
#                  frontages (streetlights.*, fire_hydrants.*, trash_cans.*;
#                  shared occupancy grid — categories never stack); traffic
#                  lights at intersection corners (traffic_lights.*)
#   5. cars      — cars on the right-hand lane of straight road segments (cars.*)
#
# disaster.* (tornado aftermath) is applied inline during steps 4-5:
# per-category topple fractions, leaning traffic lights, wind-scattered trash
# cans, prone humans, and extra car wrecks strewn on open ground.
#
# exclusions apply to clutter only (houses, trees, streetlights, traffic
# lights, hydrants, trash cans, humans, cars); ground tiles and roads still
# cover excluded areas.

seed: 42                    # int — same seed => identical city

# ---- step 1: road network / block layout -----------------------------------
layout:
  region_m: [400, 400]      # [x, y] m — total city extent
  min_block_m: 30           # m — never split a block smaller than this
  max_block_m: 70           # m — always split larger (auto-raised for oversized buildings)
  split_jitter: 0.25        # 0..1 — 0 = split at center, 1 = anywhere in valid range
  tile_overlap: 1.05        # ground-tile scale nudge; >1 trades hairline gaps for slight z-fighting
  # ---- step 2: lot parcelling inside each block ----
  lot:
    min_m: 24               # m — smallest lot dimension
    max_m: 60               # m — keep subdividing larger (auto-raised for oversized buildings)
    alley_m: 3.0            # m — concrete gap between sibling lots in a block
    margin_m: 2.0           # m — grass ring between lot edge and building
    single_lot_chance: 0.45 # 0..1 — chance a whole-block-fitting building keeps the block unsplit
    size_tie_tolerance: 0.1 # 0..1 — footprint-area window treated as tied; random pick among ties

# ---- step 0: asset resolution ------------------------------------------------
asset_root: "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/"
                            # prefix for relative usds.* paths; URLs / absolute paths pass through
asset_scale: 0.01           # global unit scale (RetroNeighborhood authored in cm -> 0.01)
measure_usds: true          # true = measure footprints from USD bboxes (needs asset access);
                            # per-category fallback_sizes used when a measurement fails

# ---- step 3: buildings ---------------------------------------------------------
damaged_fraction: 0.25      # 0..1 — buildings tilted + sunk; uses usds.houses.damaged when non-empty,
                            # else tilts an intact building as a stand-in

# ---- step 4: detail ------------------------------------------------------------
trees:
  per_block: [2, 6]         # [min, max] — trees per block, on open grass
  min_separation_m: 3.0     # m — minimum tree-to-tree distance
  house_margin_m: 1.5       # m — keep-out ring around building footprints

streetlights:
  spacing_m: 18.0           # m — spacing along block frontages

trash_cans:
  spacing_m: 25.0           # m — spacing along block frontages

fire_hydrants:
  spacing_m: 55.0           # m — spacing along block frontages

traffic_lights:
  intersection_chance: 0.9  # 0..1 — chance a 4-way/tee road cell gets a light
  corner_offset_frac: 0.85  # 0..1 — offset from intersection center toward a
                            # random corner; 1 = cell edge. Pole faces the center

humans:
  per_block: [0, 3]         # [min, max] — humans per block, on open ground
  min_separation_m: 2.0     # m — minimum person-to-person distance
  house_margin_m: 1.0       # m — keep-out ring around building lots

# ---- step 5: cars ----------------------------------------------------------------
cars:
  density: 0.15             # 0..1 — fraction of straight road cells that get a car
  lane_offset_frac: 0.3     # 0..1 — lateral offset from road centerline; 0 = centerline,
                            # 1 = road edge; 0.5 = middle of the right-hand lane.
                            # Travel direction is random per car; offset is always to
                            # that direction's right (right-hand traffic)
  yaw_jitter_deg: 4.0       # deg — random heading wobble per car

# ---- disaster pass (steps 4-5) — tornado aftermath -----------------------------
disaster:
  streetlights_toppled_fraction: 0.3    # 0..1 — poles snapped flat, random heading
  traffic_lights_toppled_fraction: 0.25 # 0..1 — poles snapped flat at the base
  traffic_lights_leaning_fraction: 0.3  # 0..1 — of still-standing poles: bent/leaning
  traffic_lights_lean_deg: [8, 30]      # [min, max] deg — lean angle range
  trash_cans_toppled_fraction: 0.6      # 0..1 — light + unanchored: most get tipped
  trash_cans_scatter_m: 4.0             # m — max wind displacement of tipped cans
  fire_hydrants_toppled_fraction: 0.1   # 0..1 — bolted to the main: rarely sheared off
  humans_prone_fraction: 0.5            # 0..1 — lying flat; the rest stand
  cars_toppled_fraction: 0.2            # 0..1 — lane cars flipped on side/roof
  cars_strewn: [4, 10]                  # [min, max] — extra wrecks tossed onto open ground
  strewn_topple_fraction: 0.7           # 0..1 — strewn cars flipped (rest stay upright)
  strewn_margin_m: 1.5                  # m — keep strewn cars off building footprints

# ---- per-family yaw offsets (deg), added to auto-computed rotations -----------
orientation:
  road_straight: 0.0        # 0 = art runs E-W (+90 applied internally for N-S)
  road_four_way: 0.0
  road_tee:      0.0        # yaw keyed on the missing arm
  road_corner:   0.0        # yaw keyed on the connected pair
  road_dead_end: -90.0        # yaw keyed on the single connected arm
  house_front:   0.0        # building front facing offset
  car_front:     90.0        # 0 = car art faces +X (its direction of travel)
  traffic_light_front: 0.0  # 0 = art faces +X (auto-yawed toward intersection center)

# ---- footprints [x, y(, z)] m — used when measure_usds is false or a measure fails
fallback_sizes:
  grass:       [3.0, 3.0]
  road:        [12.0, 12.0]
  concrete:    [4.0, 4.0]
  sidewalk:    [2.0, 2.0]
  house:       [48.0, 48.0]
  tree:        [3.0, 3.0]
  streetlight: [1.0, 1.0]
  car:           [4.5, 2.0, 1.5]
  trash_can:     [0.8, 0.8, 1.2]
  traffic_light: [1.0, 1.0, 6.0]
  fire_hydrant:  [0.5, 0.5, 1.0]
  human:         [0.6, 0.4, 1.8]

# ---- asset library --------------------------------------------------------------
# Entry forms:  "path.usd"                                (global asset_scale, Z-up)
#           or  {usd: "path.usd", scale: 1.0, axis-up: "Y"}  (per-asset overrides)
# Relative paths are resolved against asset_root.
usds:
  tiles:
    grass:
      - "RetroNeighborhood/Props/SM_GrassPiece_02.prop.usd"
    concrete:
      - "RetroNeighborhood/Props/SM_DriveWay_01.prop.usd"
    sidewalk: []             # empty -> sidewalk ring skipped
    asphalt: []
    brick: []
    road:                    # one USD per tile family; missing families fall back
                             # along corner -> dead_end -> tee -> four_way -> straight
      four_way: "RetroNeighborhood/Props/SM_Road_03.prop.usd"
      tee:      "RetroNeighborhood/Props/SM_Road_02.prop.usd"
      straight: "RetroNeighborhood/Props/SM_Road_01.prop.usd"
      dead_end: "RetroNeighborhood/Props/SM_Road_05.prop.usd"
      corner:   "RetroNeighborhood/Props/SM_Road_03.prop.usd"
      # corner:  "Muyang/retro_neighborhood_road_corner.usdc"
  houses:
    intact:
      - "RetroNeighborhood/Props/SM_House_01.prop.usd"
      # - usd: "Muyang/UnityTest/UrbanBuilding/urban_building_Prefab.usd"
      #   scale: 1.0   # authored in meters; override the global asset_scale
      #   axis-up: "Y"  # authored Y-up; fixed to Z-up for Isaac Sim
      - usd: "Muyang/ModernCityEnvironment/Collected_Building01/SM_MERGED_BP_MBuilding01.usd"
        scale: 1.0   # authored in meters; override the global asset_scale
      - "Muyang/ModernCityEnvironment/Collected_Building02/SM_MERGED_BP_MBuilding02.usd"
      - "Muyang/ModernCityEnvironment/Collected_Building03/SM_MERGED_BP_MBuilding03.usd"
      - "Muyang/ModernCityEnvironment/Collected_Building05/SM_MERGED_BP_MBuilding05.usd"

    # damaged:
    #   - "Muyang/RuinedModernBuildings/Flatten_Buildings/SM_Flatten_Building_01.usd"

  trees:
    - "RetroNeighborhood/Props/SM_Tree_01.prop.usd"
    - "RetroNeighborhood/Props/SM_Tree_02.prop.usd"
    - "RetroNeighborhood/Props/SM_Tree_03.prop.usd"
    - "RetroNeighborhood/Props/SM_Tree_04.prop.usd"
    - "RetroNeighborhood/Props/SM_Tree_05.prop.usd"
    - "RetroNeighborhood/Props/SM_Tree_06.prop.usd"
    - "RetroNeighborhood/Props/SM_Tree_07.prop.usd"
  streetlights:
    - "RetroNeighborhood/Props/SM_StreetLight.prop.usd"
  cars:
    - usd: "RetroNeighborhood/130.usdz"
      axis-up: "Y"           # authored Y-up; fixed to Z-up for Isaac Sim
    - usd: "RetroNeighborhood/FREE_GMC_Motorhome_reimagined_low_poly.usdz"
      axis-up: "Y"
    # - usd: "RetroNeighborhood/FREE_Merc_Hovercar.usdz"
    #   axis-up: "Y"
    - usd: "RetroNeighborhood/Nissan_Fairlady_Z_S30240Z_1978.usdz"
      axis-up: "Y"
    # - usd: "RetroNeighborhood/Old_Rusty_Car.usdz"
    #   axis-up: "Y"
    # - usd: "RetroNeighborhood/ZIS-101A_Sport_1938.usdz"
    #   axis-up: "Y"

  # PLACEHOLDER paths below — swap in real assets when available
  trash_cans:
    - "PLACEHOLDER/Props/SM_TrashCan_01.usd"
  traffic_lights:
    - "PLACEHOLDER/Props/SM_TrafficLight_01.usd"
  fire_hydrants:
    - "PLACEHOLDER/Props/SM_FireHydrant_01.usd"
  humans:
    - "PLACEHOLDER/Characters/SM_Human_01.usd"

# ---- clutter keep-out zones ------------------------------------------------------
# circle {center: [x, y], radius: r} or rect {bounds: [[xmin, ymin], [xmax, ymax]]}
exclusions:
  - center: [0.0, 0.0]
    radius: 10.0             # keep the takeoff pad clear
