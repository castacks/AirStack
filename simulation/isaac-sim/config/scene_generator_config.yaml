# Procedural city spec — consumed by utils/scene_generator.py
#
# Bake to a standalone USD (footprint measurement needs Nucleus access, or set
# measure_usds: false to use fallback_sizes):
#   python utils/scene_generator.py --config config/scene_generator_config.yaml \
#       --output assets/scenes/generated_city.usd
#
# Or compose at runtime from a launch script:
#   generate_scene_on_stage(stage, "config/scene_generator_config.yaml",
#                           scene_scale_factor=ssf)
#
# All coordinates and distances are METRIC (meters): +X = East, +Y = North,
# +Z = Up. Generation runs in three steps: (1) ground (roads + grass + concrete
# + optional sidewalk), (2) one house per cell with some damaged, (3) trees on
# open grass + streetlights along the roads.

# Reproducibility: same seed => identical city. Bump it for a new variant.
seed: 42

# City layout. Roads are generated by recursively subdividing the region into
# irregular blocks (no fixed grid); each block is subdivided into lots, and a
# building from the library is fit into each lot. Buildings sharing a block sit
# next to each other separated only by alleys (no road between them).
# NOTE: lot.max_m / max_block_m are auto-raised at generation time if the
# largest library building wouldn't fit a lot at these sizes (with a printed
# warning) — buildings are never silently dropped to grass for being too big.
# Still worth setting these close to your real building sizes so SMALLER
# buildings get varied lot sizes instead of always landing on the bumped max.
layout:
  region_m: [400, 400]     # total city extent in meters (x, y)
  min_block_m: 30          # don't split a block smaller than this
  max_block_m: 70          # keep splitting blocks larger than this
  split_jitter: 0.25       # 0 = split at center, 1 = split anywhere in range
  tile_overlap: 1.05       # nudge tile scale up a touch so rounding never leaves
                           # a visible gap between adjacent tiles (slight
                           # z-fighting instead) — raise if cracks still show
  lot:
    min_m: 24              # smallest lot dimension
    max_m: 60              # keep subdividing lots larger than this
    alley_m: 3.0           # gap between adjacent lots within a block
    margin_m: 2.0          # grass margin between lot edge and building
    size_tie_tolerance: 0.1  # buildings within this fraction of the largest
                              # fitting footprint are picked from at random
                              # (instead of the same one always winning)

# All RetroNeighborhood props are authored in centimeters → scale to meters.
asset_scale: 0.01

# Measure each USD's XY footprint from its bounding box at generation time so
# tiles/houses lay out at their true size. Needs the USDs to be openable (true
# inside Isaac Sim; offline requires Nucleus access). Falls back to
# fallback_sizes below per-category when a measurement fails.
measure_usds: true

# Fraction of buildings rendered as damaged. Damaged buildings get tilted +
# sunk into the ground; they use a USD from usds.houses.damaged when the list
# is non-empty, otherwise an intact building is tilted/sunk as a stand-in.
damaged_fraction: 0.25

trees:
  per_block: [2, 6]        # random tree count per block, on open grass
  min_separation_m: 3.0
  house_margin_m: 1.5      # keep trees this far off building footprints

streetlights:
  spacing_m: 18.0          # uniform spacing along block frontages

# Yaw offsets (degrees) added to each road-tile family's auto-computed rotation
# (rotation comes from the tile's road neighbors). One offset per family rotates
# all of that family's orientations together — tune after a first look if a
# family's art points the wrong way. NOTE: re-tune these for the new bitmask
# road tiler; the old grid values won't necessarily match.
orientation:
  road_straight: 0.0       # straight: 0 = runs E-W, +90 internally for N-S
  road_four_way: 0.0       # 4-way intersection
  road_tee:      0.0       # T-junction (yaw keyed on the missing arm)
  road_corner:   0.0       # corner / bend (yaw keyed on the connected pair)
  road_dead_end: 0.0       # dead end (yaw keyed on the single connected arm)
  house_front:   0.0       # building front facing offset

# Fallback footprints (meters, [x, y] or [x, y, z]) used when measure_usds is
# false or a measurement fails.
fallback_sizes:
  grass:       [3.0, 3.0]
  road:        [12.0, 12.0]
  concrete:    [4.0, 4.0]
  sidewalk:    [2.0, 2.0]
  house:       [48.0, 48.0]
  tree:        [3.0, 3.0]
  streetlight: [1.0, 1.0]

# Asset library. Replace/extend with your own props.
usds:
  tiles:
    grass:
      - "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/RetroNeighborhood/Props/SM_GrassPiece_02.prop.usd"
    concrete:
      - "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/RetroNeighborhood/Props/SM_DriveWay_01.prop.usd"
    sidewalk: []             # none in the library yet → sidewalk ring skipped
    road:
      four_way: "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/RetroNeighborhood/Props/SM_Road_03.prop.usd"
      tee:      "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/RetroNeighborhood/Props/SM_Road_02.prop.usd"
      straight: "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/RetroNeighborhood/Props/SM_Road_01.prop.usd"
      dead_end: "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/RetroNeighborhood/Props/SM_Road_05.prop.usd"
      corner:   "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/RetroNeighborhood/Props/SM_Road_03.prop.usd"
      # corner:  "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/Muyang/retro_neighborhood_road_corner.usdc"
  houses:
    intact:
      - "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/RetroNeighborhood/Props/SM_House_01.prop.usd"
      - usd: "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/Muyang/UnityTest/UrbanBuilding/urban_building_Prefab.usd"
        scale: 1.0   # authored in meters; override the global asset_scale
        axis-up: "Y"  # authored with Y-up; fix to Z-up for Isaac Sim
      - usd: "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/Muyang/ModernCityEnvironment/Collected_Building01/SM_MERGED_BP_MBuilding01.usd"
        scale: 1.0   # authored in meters; override the global asset_scale
      # - "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/Muyang/ModernCityEnvironment/Collected_Building02/SM_MERGED_BP_MBuilding02.usd"
      # - "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/Muyang/ModernCityEnvironment/Collected_Building03/SM_MERGED_BP_MBuilding03.usd"
      # - "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/Muyang/ModernCityEnvironment/Collected_Building05/SM_MERGED_BP_MBuilding05.usd"

    # damaged:
    #   - "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/Muyang/RuinedModernBuildings/Flatten_Buildings/SM_Flatten_Building_01.usd"

  trees:
    - "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/RetroNeighborhood/Props/SM_Tree_01.prop.usd"
    - "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/RetroNeighborhood/Props/SM_Tree_02.prop.usd"
    - "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/RetroNeighborhood/Props/SM_Tree_03.prop.usd"
    - "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/RetroNeighborhood/Props/SM_Tree_04.prop.usd"
    - "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/RetroNeighborhood/Props/SM_Tree_05.prop.usd"
    - "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/RetroNeighborhood/Props/SM_Tree_06.prop.usd"
    - "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/RetroNeighborhood/Props/SM_Tree_07.prop.usd"
  streetlights:
    - "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/RetroNeighborhood/Props/SM_StreetLight.prop.usd"

# Regions kept clear of clutter (houses/trees/streetlights skip these; ground +
# roads still cover them). Circle {center: [x,y], radius: r} or rect
# {bounds: [[xmin,ymin],[xmax,ymax]]}.
exclusions:
  - center: [0.0, 0.0]
    radius: 10.0           # keep the takeoff pad clear
