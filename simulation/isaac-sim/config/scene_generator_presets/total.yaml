# Preset: TOTAL — complete devastation: no intact buildings (every packing
# pick lands in the destroyed or damaged pool), rubble everywhere, nothing
# on the streets left standing.
disaster:
  damaged_fraction: 0.25
  destroyed_fraction: 0.75   # + damaged = 1.0 -> intact weight is zero
  debris:
    piles_per_building: [3, 6]
    pieces_per_building: [15, 30]
    pieces_scatter_m: 8.0
    tilt_chance: 0.5
    tilt_deg: [3, 8]
    sink_m: [0.6, 1.6]
    lean_piles: [3, 4]
  streetlights_toppled_fraction: 0.75
  traffic_lights_toppled_fraction: 0.7
  traffic_lights_leaning_fraction: 0.6
  traffic_lights_lean_deg: [12, 40]
  trash_cans_toppled_fraction: 0.9
  trash_cans_scatter_m: 8.0
  cars_toppled_fraction: 0.5
  cars_strewn: [12, 20]
  strewn_topple_fraction: 0.85
  humans_prone_fraction: 0.7
  humans_strewn: [8, 15]
