services:
  ms-airsim:
    profiles:
      - ms-airsim
    image: &ms_airsim_image ${PROJECT_DOCKER_REGISTRY}/${PROJECT_NAME}:v${VERSION}_ms-airsim
    build:
      context: ./
      dockerfile: Dockerfile
      tags:
        - *ms_airsim_image
        - &ms_airsim_cache ${PROJECT_DOCKER_REGISTRY}/${PROJECT_NAME}:${CACHE_TAG:-cache}_ms-airsim
      cache_from:
        - *ms_airsim_image
        - *ms_airsim_cache
    container_name: ms-airsim
    entrypoint: ""
    command: /root/entrypoint.sh
    stdin_open: true
    tty: true
    ipc: host
    privileged: true
    networks:
      airstack_network:
        # INVARIANT: every sim service (isaac-sim, ms-airsim, simple-sim)
        # binds this same fixed address — robot containers reach the sim at
        # SIM_IP (default 172.31.0.200), so only one sim can run at a time.
        ipv4_address: 172.31.0.200
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - NVIDIA_DRIVER_CAPABILITIES=all
      - XDG_RUNTIME_DIR=/tmp
      - NUM_ROBOTS=${NUM_ROBOTS:-1}
      - AUTOLAUNCH=${AUTOLAUNCH:-true}
      - MS_AIRSIM_BINARY_PATH=${MS_AIRSIM_BINARY_PATH:-}
      - MS_AIRSIM_HEADLESS=${MS_AIRSIM_HEADLESS:-false}
      - MS_AIRSIM_PX4_START_DELAY=${MS_AIRSIM_PX4_START_DELAY:-3}
      # settings.json template knobs (config/generate_settings.py defaults)
      - AIRSIM_CAM_WIDTH=${AIRSIM_CAM_WIDTH:-480}
      - AIRSIM_CAM_HEIGHT=${AIRSIM_CAM_HEIGHT:-300}
      - AIRSIM_CAM_FOV=${AIRSIM_CAM_FOV:-90}
      - AIRSIM_CAM_X=${AIRSIM_CAM_X:-0.4}
      - AIRSIM_CAM_Y=${AIRSIM_CAM_Y:-0.06}
      - AIRSIM_CAM_Z=${AIRSIM_CAM_Z:-0}
      - AIRSIM_CAM_PITCH=${AIRSIM_CAM_PITCH:-0}
      - AIRSIM_SPAWN_SPACING=${AIRSIM_SPAWN_SPACING:-3}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../config:/home/ms-airsim/Documents/AirSim:rw
      - ../ros_ws:/root/ros_ws:rw
      - ${MS_AIRSIM_ENV_DIR:-../assets/scenes}:/ms-airsim-env:rw
      - /usr/share/vulkan/icd.d/nvidia_icd.json:/usr/share/vulkan/icd.d/nvidia_icd.json:ro
      - ../../../common/.tmux.conf:/root/.tmux.conf:rw
