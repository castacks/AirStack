defaults:
  - default
  - override mapping: semantic_ray_frontiers_map
  - override encoder: radseg
  - override vis: ros
  - override messaging_service: ros
  - override feat_compressor: pca
  - _self_

compile: False
amp: True
depth_limit: 20.0



# encoder:
#   model_version: radio_v2.5-b
#   lang_model: siglip

dataset:
  rgb_resolution: [480, 304] #[480, 304]
  depth_resolution: [480, 304] #[480, 304]
  frame_skip: 10

mapping:
  vox_size: 0.50
  vox_accum_period: 1 #4

  max_pts_per_frame: 1000 #-1
  max_empty_pts_per_frame: 3000
  max_rays_per_frame: 300 #500
  # Hard cap on the frustum projection range. -1 (= max depth in frame) lets
  # Isaac GT depth at altitude blow the frustum voxel grid up to hundreds of
  # meters → multi-GiB allocations → CUDA OOM.
  max_depth_sensing: 25.0
  fronti_subsampling: 5
  fronti_subsampling_min_fronti: 9
  ray_tracing: False
  ray_accum_period: 1 #4
  ray_accum_phase: 0 #2
  ray_erosion: 0

  occ_pruning_period: 128

  # Tolerance when consolidating voxels into bigger ones.
  occ_pruning_tolerance: 2

  # How often do we prune semantic voxels to reflect occupancy (That is erase
  # semantic voxels that are no longer occupied). Set to -1 to disable.
  sem_pruning_period: 32

  # Voxels with log-odds occupancy <= this value are removed.
  sem_pruning_thresh: 5
  #global_encoding: True

feat_compressor:
  out_dim: 100
  # null = fit the PCA basis online on the first frame. (??? is Hydra's
  # missing-mandatory marker and crashes at startup.) For a better basis,
  # fit offline with scripts/fit_feat_compressor and set the file path.
  path: null


