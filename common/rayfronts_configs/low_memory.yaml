defaults:
  - default
  - override mapping: semantic_ray_frontiers_map
  - override encoder: radseg
  - override vis: ros
  - override messaging_service: ros
  - override feat_compressor: pca
  - _self_


# PCA-compress stored semantic features — the biggest memory lever: every
# stored voxel/ray feature shrinks from the encoder dim to out_dim.
# path: null fits the basis online on the first frame; for a better basis,
# fit offline with scripts/fit_feat_compressor and set path to the file.
feat_compressor:
  out_dim: 100
  path: null

# encoder:
#   model_version: radio_v2.5-b
#   lang_model: siglip

dataset:
  rgb_resolution: [480, 304] #[480, 304]
  depth_resolution: [480, 304] #[480, 304]
  frame_skip: 10

mapping:
  vox_size: 0.50
  max_pts_per_frame: 1000
  max_empty_pts_per_frame: 3000
  max_rays_per_frame: 300 #500

  occ_pruning_period: 128

  occ_pruning_tolerance: 2

  sem_pruning_period: 32

  sem_pruning_thresh: 5

  angle_bin_size: 30
  ray_tracing: False

  fronti_subsampling: 5
  fronti_subsampling_min_fronti: 9

  vox_accum_period: 1 

  ray_accum_period: 1 #4
  ray_accum_phase: 0 #2
  ray_erosion: 0
  #global_encoding: True



