# Rosbag topics recorded during target tracking mode.
# Relative paths are prefixed with the node namespace (ROBOT_NAME).
# Recording starts when bpmp/target_tracking_enable becomes True.
sections:
  target_tracking:
    mcap_qos: mcap_qos.yaml
    args:
      - -b
      - 4000000000  # ~4GB
      - --max-cache-size
      - 1073741824  # 1GB
    topics:
      # - /tf #MAYBENO
      # - /tf_static #MAYBENO
      # Robot state
      - odometry_conversion/odometry
      # Trajectory
      # - trajectory_controller/trajectory_override #MAYBENO
      # - trajectory_controller/tracking_point #MAYBENO
      # - trajectory_controller/tracking_error #MAYBENO
      # Target tracking
      - bpmp/target_info
      - bpmp/target_tracking_enable
      # Human detection (MODE 1)
      - sensors/front_stereo/left/detection2d
      - sensors/front_stereo/left/semantic_bbox
      # Human detection (MODE 2 - HumanFlow)
      - demo/humanflow
      - demo/reid_groups
      # Camera
      - sensors/front_stereo/left/image_rect
      - sensors/front_stereo/left/camera_info
      # Segmentation & BBox (ZED camera with segmentation enabled)
      - sensors/front_stereo/left/bbox_2d_loose
      - sensors/front_stereo/left/bbox_2d_tight
      - sensors/front_stereo/left/instance_segmentation
      - sensors/front_stereo/left/semantic_segmentation
      - sensors/front_stereo/left/instance_segmentation_labels
      - sensors/front_stereo/left/semantic_segmentation_labels
      - sensors/front_stereo/left/bbox_2d_loose_labels
      - sensors/front_stereo/left/bbox_2d_tight_labels
      # Vehicle state
      - interface/is_armed
