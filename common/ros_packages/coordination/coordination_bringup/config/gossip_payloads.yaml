# ─────────────────────────────────────────────────────────────────────────────
# Gossip Payload Topics
# ─────────────────────────────────────────────────────────────────────────────
# List ROS topics here to have them automatically included as typed payloads
# in this robot's PeerProfile and distributed to all peers via gossip.
#
# Each entry requires:
#   topic: topic name — use {robot_name} as a placeholder for the robot namespace
#   type:  fully-qualified ROS message type (package/msg/Type)
#
# If a topic has never published, the payload is silently skipped — the node
# will not crash or block waiting for it.
#
# ── How to add your own payload ──────────────────────────────────────────────
# 1. Add an entry below with the topic + type.
# 2. On the receiving end, call peer_profile.get_payload("<type>") to get the
#    deserialized message, or peer_profile.payload_types() to list what's there.
#
# Example (receiving side in Python):
#   from coordination_bringup.peer_profile import PeerProfile
#   profile = PeerProfile.from_ros_msg(peer_msg)
#   rays = profile.get_payload("visualization_msgs/msg/MarkerArray")
#   if rays is not None:
#       # use rays as a visualization_msgs/msg/MarkerArray
# ─────────────────────────────────────────────────────────────────────────────

payload_topics:

  # ── Rayfronts + Raven ──────────────────────────────────────────────────────
  # Filtered semantic rays (raven_nav) — peer robots consume this as
  # filtered_rays/transposed to avoid revisiting already-explored areas.
  - topic: "/{robot_name}/filtered_rays"
    type: "visualization_msgs/msg/MarkerArray"

  # Shared frontiers (raven_nav) — post-altitude+polygon filter, pre-clustering.
  # Peers merge these into their own frontier candidate pool
  # (peer_state.peer_frontiers → frontier_behavior.py). Bounded (current
  # boundary, recomputed each tick — not accumulating), so safe to gossip.
  - topic: "/{robot_name}/shared_frontiers"
    type: "sensor_msgs/msg/PointCloud2"

  # Filtered frontiers (raven_nav) — post altitude + polygon + zone filter.
  # Debug/visualization only: peers don't consume these (each computes its
  # own filtered set from shared_frontiers). Gossiped so the GCS can render the
  # shrinking explorable area per drone in Foxglove.
  - topic: "/{robot_name}/filtered_frontiers"
    type: "sensor_msgs/msg/PointCloud2"

  # RGB voxel map (rayfronts) — semantic 3D map for GCS visualization ONLY.
  # - topic: "/{robot_name}/rayfronts/voxel_rgb"
  #   type: "sensor_msgs/msg/PointCloud2"

  # Per-query semantic voxel cloud (rayfronts) — x,y,z + sim_0..N similarity per
  # query. GCS visualization ONLY (colour by sim_K in Foxglove; sim_0 = first
  # query). The last path segment is "all", so an explicit name is given.
  # NOTE: this is the FULL accumulating map — heaviest payload on the gossip
  # channel. Comment it out when not actively inspecting detections in GCS.
  # - topic: "/{robot_name}/rayfronts/msg_serv/voxels_sim/all"
  #   type: "sensor_msgs/msg/PointCloud2"
  #   name: "voxels_sim"
  #   # Published in RDF (camera-optical); rotate RDF→FLU before the ENU translation
  #   # (same swap raven applies in _vox_all_cb) so it lands in the right place.
  #   rotate_rdf_to_flu: true


  # Active raven_nav behavior ('frontier'/'ray'/'voxel'/'idle'). Used by peer
  # raven_nav instances to decide whether to treat that robot's waypoint as a
  # frontier "claim" for the multi-robot divergence heuristic.
  - topic: "/{robot_name}/navigation_mode"
    type: "std_msgs/msg/String"

  # Per-target bids from the ray-mode auction. Higher = closer = wins.
  - topic: "/{robot_name}/bids"
    type: "airstack_msgs/msg/BidVector"

  # Label this robot is currently committed to ("" if uncommitted). Peers
  # use this together with raw bids to resolve double-commit collisions
  # (the farther-away robot releases).
  - topic: "/{robot_name}/committed_target"
    type: "std_msgs/msg/String"

  # Shared rays (raven_nav) — FLU local-frame rays so peer drones can bid on
  # the same target the publisher saw. gossip translates x,y,z to global ENU;
  # dx,dy,dz directions and sim_* scores pass through unchanged.
  - topic: "/{robot_name}/shared_rays"
    type: "sensor_msgs/msg/PointCloud2"

  # Explored-area coverage (raven_nav) — XY centers of cells a robot has
  # observed. Peers union their own coverage with these to skip nearby
  # frontiers and to feed the novelty cost in frontier selection.
  - topic: "/{robot_name}/raven_nav/explored_area_coverage"
    type: "coordination_msgs/msg/CoverageGrid"

  # Confirmed target AABBs (raven_nav, fed from voxel_behavior) — JSON list of
  # [{label, cx, cy, cz, sx, sy, sz, status, confidence, ts}]. Peers anchor ray
  # triangulation onto these and dedupe discoveries by AABB overlap.
  - topic: "/{robot_name}/raven_nav/confirmed_targets"
    type: "std_msgs/msg/String"

  # ── Add more payloads below ────────────────────────────────────────────────
  # - topic: "/{robot_name}/your/topic"
  #   type: "your_msgs/msg/YourType"
