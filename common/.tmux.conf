# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set-option -g default-shell /bin/bash

set -g mouse on
set -g @plugin 'noscript/tmux-mighty-scroll'


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# ── Split Window ──────────────────────────────────────────────────────────────

# Auto-split the bringup session's first window into a 5-over-3 grid so users
# have manual shells alongside the autonomy launch:
#
#   +------+------+------+------+------+
#   |  0   |  1   |  2   |  3   |  4   |   0 = autonomy launch (compose sends to bringup:0.0)
#   +------+------+------+------+------+
#   |    5     |     6      |     7     |   1-7 = idle shells
#   +----------+------------+-----------+
#
# Each row is spread evenly with `select-layout -E`. Every split pane is titled
# "shell" so automated liveliness checks can tell it apart from a pane that has
# crashed back to bash. The detached session is created before any client
# attaches, so default-size gives the splits room; the layout rescales on attach.
# Each shell pane also waits for the launch pane's `bws` to finish and then
# sources the workspace (sws_after_build, defined in robot/docker/.bashrc). The
# guard keeps containers without that helper (GCS) from printing an error; their
# .bashrc already runs sws on startup.
SHELL_PANE_CMD='type sws_after_build >/dev/null 2>&1 && sws_after_build'
set -g default-size 200x50
set-hook -g after-new-session 'if -F "#{==:#{session_name},bringup}" " \
  split-window -v -l 50% -t bringup:0.0 ; select-pane -T shell ; \
  split-window -h -t bringup:0.0 ; select-pane -T shell ; \
  split-window -h -t bringup:0.0 ; select-pane -T shell ; \
  split-window -h -t bringup:0.0 ; select-pane -T shell ; \
  split-window -h -t bringup:0.0 ; select-pane -T shell ; \
  select-layout -E -t bringup:0.0 ; \
  split-window -h -t bringup:0.5 ; select-pane -T shell ; \
  split-window -h -t bringup:0.5 ; select-pane -T shell ; \
  select-layout -E -t bringup:0.5 ; \
  select-pane -t bringup:0.0 ; \
  send-keys -t bringup:0.1 \"$SHELL_PANE_CMD\" ENTER ; \
  send-keys -t bringup:0.2 \"$SHELL_PANE_CMD\" ENTER ; \
  send-keys -t bringup:0.3 \"$SHELL_PANE_CMD\" ENTER ; \
  send-keys -t bringup:0.4 \"$SHELL_PANE_CMD\" ENTER ; \
  send-keys -t bringup:0.5 \"$SHELL_PANE_CMD\" ENTER ; \
  send-keys -t bringup:0.6 \"$SHELL_PANE_CMD\" ENTER ; \
  send-keys -t bringup:0.7 \"$SHELL_PANE_CMD\" ENTER"'

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom

# Overall bar colours: deep navy background, white foreground
set -g status-style "bg=#0a2540,fg=#ffffff"

# Left: Docker container name (ROBOT_NAME env var, falling back to hostname)
set -g status-left-length 100
set -g status-left "\
#[bg=#06b6d4,fg=#ffffff,bold] Docker container: #(printenv ROBOT_NAME 2>/dev/null || hostname) \
#[bg=#0a2540,fg=#06b6d4,nobold]\
#[fg=#7dd3fc,bold]  tmux session: #S "

# Window list (centre)
set -g status-justify centre
set -g window-status-format         "#[fg=#93c5fd,nobold] #I:#W "
set -g window-status-current-format "#[bg=#06b6d4,fg=#ffffff,bold] #I:#W #[bg=#0a2540,fg=#06b6d4,nobold]"

# Right: keyboard tips
set -g status-right-length 200
set -g status-right "\
#[fg=#ffffff,bold]Detach: \
#[fg=#34d399,bold]Ctrl-b d  \
#[fg=#ffffff,bold]Create Window: \
#[fg=#34d399,bold]Ctrl-b c  \
#[fg=#ffffff,bold]Select Window: \
#[fg=#34d399,bold]Ctrl-b [index]  \
#[fg=#ffffff,bold]Kill Window: \
#[fg=#34d399,bold]Ctrl-b &  \
#[fg=#ffffff,bold]Copy: \
#[fg=#34d399,bold]Shift#[fg=#ffffff,bold]+drag, \
#[fg=#34d399,bold]Ctrl-Shift-C  \
#[fg=#ffffff,bold]Help: \
#[fg=#34d399,bold]Ctrl-b ? "
# ─────────────────────────────────────────────────────────────────────────────

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
