repo_url: https://github.com/castacks/AirStack
theme:
  favicon: docs/assets/StackedWhite.png
  custom_dir: docs/overrides
  features:
    - navigation.indexes
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    # - navigation.expand
    - navigation.footer
    - navigation.top
    - navigation.sections
    - search.highlight
    - search.suggest
    - search.share
    - toc.integrate
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  font:
    text: Inter
    code: JetBrains Mono
  logo: docs/assets/airstack_white.png
  name: material
  palette:
    - accent: custom
      primary: custom
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - accent: custom
      primary: custom
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode