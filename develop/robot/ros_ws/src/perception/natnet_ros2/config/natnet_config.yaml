# NatNet ROS 2 configuration — parsed by natnet_ros2.launch.py, which selects the
# profile matching the container's ROBOT_NAME.
# See docs/robot/px4_external_vision.md for the schema and setup guide.

natnet:

  # --- Connection settings (generic across all agents) -----------------------
  server:
    # Motive host; defaults to the in-sim emulator. Set NATNET_SERVER_IP per deployment.
    server_ip: "$(env NATNET_SERVER_IP 172.31.0.200)"
    # Bind explicitly when the client has multiple NICs.
    client_ip: "0.0.0.0"

    command_port: 1510
    data_port: 1511

    # "unicast" (default) or "multicast"; multicast_address applies to the latter.
    connection_type: "unicast"
    multicast_address: "239.255.42.99"

    frame_id: "world"
    debug: false

    # Per-message latency reporting.
    latency_sampling_warmup_s: 5.0
    latency_sampling_window_s: 20.0
    cube_orange_latency_ms: 5.0

  # --- Per-robot profiles (selected by ROBOT_NAME) ---------------------------
  robots:

    robot_1:
      # MAVROS vision_pose bridge; enabled=false skips the converter.
      vision_pose:
        enabled: true
        input_topic:           "perception/optitrack/drone/pose_cov"
        output_pose_topic:     "interface/mavros/vision_pose/pose"
        output_pose_cov_topic: "interface/mavros/vision_pose/pose_cov"

      # Rigid bodies this robot tracks. name and id must match Motive exactly; the
      # client filters frames by numeric id. Defaults match the in-sim emulator.
      bodies:
        - rigid_body_name: "Drone"
          id: 1
          topic: "perception/optitrack/drone"
          pose: true
          pose_cov: true
          position_covariance:
            [1.0e-6, 0.0,    0.0,
             0.0,    1.0e-6, 0.0,
             0.0,    0.0,    1.0e-6]
          orientation_covariance:
            [3.0e-6, 0.0,    0.0,
             0.0,    3.0e-6, 0.0,
             0.0,    0.0,    3.0e-6]
    robot_2:
      vision_pose:
        enabled: true
        input_topic:           "perception/optitrack/drone/pose_cov"
        output_pose_topic:     "interface/mavros/vision_pose/pose"
        output_pose_cov_topic: "interface/mavros/vision_pose/pose_cov"
      bodies:
        - rigid_body_name: "Drone2"
          id: 2
          topic: "perception/optitrack/drone"
          pose: true
          pose_cov: true
        - rigid_body_name: "Target"       # shared target — also tracked by robot_1
          id: 100
          topic: "perception/optitrack/target"
          pose: true
          pose_cov: false
          position_covariance:
            [1.0e-6, 0.0,    0.0,
              0.0,    1.0e-6, 0.0,
              0.0,    0.0,    1.0e-6]
          orientation_covariance:
            [3.0e-6, 0.0,    0.0,
              0.0,    3.0e-6, 0.0,
              0.0,    0.0,    3.0e-6]
    
    robot_3:
      vision_pose:
        enabled: true
        input_topic:           "perception/optitrack/drone/pose_cov"
        output_pose_topic:     "interface/mavros/vision_pose/pose"
        output_pose_cov_topic: "interface/mavros/vision_pose/pose_cov"
      bodies:
        - rigid_body_name: "Drone3"
          id: 3
          topic: "perception/optitrack/drone"
          pose: true
          pose_cov: true
          position_covariance:
            [1.0e-6, 0.0,    0.0,
              0.0,    1.0e-6, 0.0,
              0.0,    0.0,    1.0e-6]
          orientation_covariance:
            [3.0e-6, 0.0,    0.0,
              0.0,    3.0e-6, 0.0,
              0.0,    0.0,    3.0e-6]
