# Per-stack image composition: the P4 machinery
# (tools/compose_module_layers.py) composes per-module dependency layers on
# top of the trunk base image and emits a compose override for `airstack up`.
#
# full_default pins the asm_mighty module (see modules.repos), which declares
# no image-level deps (its nlohmann-json header dep ships in the trunk robot
# image), so the zero-module identity rule applies: containers run the trunk
# images byte-identically and nothing is composed. Other stacks' module layers
# are generated by `airstack module lock --build` at lock time, never
# committed. The empty services map keeps this file valid YAML for the
# stack-anatomy contract (tests/meta/test_stack_layout_contract.py).
services: {}
