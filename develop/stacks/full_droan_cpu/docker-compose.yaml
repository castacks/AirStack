# Per-stack image composition: the P4 machinery
# (tools/compose_module_layers.py) composes per-module dependency layers on
# top of the trunk base image and emits a compose override for `airstack up`.
#
# full_droan_cpu pins the asm_droan module (see modules.repos). The module's
# tier-1 apt layer (droan_gl's assimp/EGL/GLFW/GLM link deps — unused by the
# CPU planner but part of the module) is generated by `airstack module lock
# --build` (run by `airstack up` when the layer is missing), so nothing is
# committed here. The empty services map keeps this file valid YAML for the
# stack-anatomy contract (tests/meta/test_stack_layout_contract.py).
services: {}
