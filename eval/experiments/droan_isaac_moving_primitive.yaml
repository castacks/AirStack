# DROAN through the full AirStack stack on SAFE's paper/isaac_moving_primitive.yaml grid:
# 2 domains x 6 scenarios x 10 perturbations x 1 episode = 120 episodes with walking people.
# Live capture is off: filming every tick slows Isaac to about 0.1x real time, at which PX4
# loses control, so this run writes no episode video.
# Run (from the AirStack root):
#   PYTHONPATH=/home/kayla/workspace/benchmark:/home/kayla/AirStack \
#   python3 eval/run.py --config eval/experiments/droan_isaac_moving_primitive.yaml -y --headless
experiment_tag: droan_isaac_moving_primitive_seed100
robot: iris
benchmark_seed: 100
agents:
  - droan
env_domains:
  - primitive_sparse
  - primitive_dense
humans: true
simple: false
num_scenarios:     6
num_perturbations: 10
max_episodes:      1
max_episode_time:  60
goal_distance:     60
# One host step per Isaac physics tick (1/60 s), the resolution SAFE's own runs score at.
env_dt: 0.016666666666666666
keep_up: false
workers: 1
debug:   quiet
save_videos: none
