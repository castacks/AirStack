# Dry run of every SAFE paper policy through the AirStack stack: one episode each on
# primitive_sparse with SAFE's walking people as the moving obstacles.
# Run (from the AirStack root):
#   PYTHONPATH=/home/kayla/workspace/benchmark:/home/kayla/AirStack \
#   python3 eval/run.py --config eval/experiments/airstack_all_policies_primitive_sparse.yaml -y --headless
experiment_tag: airstack_all_policies_primitive_sparse
robot: iris
benchmark_seed: 100
agents:
  - droan
  - aggressive
  - conservative
  - adaptive
  - diffphysdrone
  - depthnav
  - diffaero
  - vitfly
  - agileautonomy
  - dynus
  - egoplanner
  - faster
  - fastplanner
  - mighty
  - raptor
  - super
  - sando
env_domains:
  - primitive_sparse
# Moving obstacles are SAFE's walking people, as in SAFE's paper moving studies.
humans: true
simple: true
num_scenarios:     1
num_perturbations: 1
max_episodes:      1
max_episode_time:  60
# SAFE policies act once per Isaac physics tick (1/60 s); every policy here steps at it.
env_dt: 0.016666666666666666
keep_up: true
workers: 1
debug:   default
# The post-run replay stage has no AirStack renderer; the video comes from live capture.
save_videos: none
