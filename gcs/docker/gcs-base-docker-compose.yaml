---
# docker compose file
services:
  gcs-base:
    build:
      context: ../
      dockerfile: docker/Dockerfile.gcs
      tags:
        - &gcs_image ${PROJECT_DOCKER_REGISTRY}/${PROJECT_NAME}:v${VERSION}_gcs
      cache_from:
        - *gcs_image
    # The foxglove_msgs install is a best-effort no-op once the image ships it
    # (see Dockerfile.gcs) — it lets prebuilt images that predate the
    # dependency still publish outlined voxel scene entities (gcs_visualizer).
    command: >
      bash -c "
      ssh service restart;
      [ -d /opt/ros/jazzy/share/foxglove_msgs ] ||
      { apt-get update -qq && apt-get install -y -qq ros-jazzy-foxglove-msgs; }
      >/dev/null 2>&1 || true;
      python3 /root/AirStack/gcs/foxglove_extensions/install.py;
      python3 /root/AirStack/gcs/foxglove_extensions/render_layout.py;
      tmux new -d -s bringup;
      if [ $$AUTOLAUNCH = 'true' ]; then
        tmux send-keys -t bringup:0.0 'bws &&  sws; ros2 launch desktop_bringup gcs.launch.xml' ENTER;
      fi;
      sleep infinity"
    # Interactive shell
    deploy:
      # let it use the GPU
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: 1
              driver: nvidia
    entrypoint: ''
    environment:
      # Bag-size decimation for foxglove_visualizer_node's republished
      # layers. Measured: 8 occupancy grids + /gcs/robot_markers are 90 %
      # of a 26.7 GiB per-iteration bag; a 24-cell sweep writes ~650 GB.
      # 2 halves it. 1 = original behaviour. map_origin and sim_ground
      # are on separate publishers and are NOT decimated.
      - GCS_VIZ_DECIMATE=${GCS_VIZ_DECIMATE:-1}
      - AUTOLAUNCH=${AUTOLAUNCH:-false}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_DRIVER_CAPABILITIES=all
      # Must match the robot/isaac containers — mixed transport modes across
      # containers have no common data channel (see common/fastdds.xml)
      - FASTDDS_BUILTIN_TRANSPORTS=LARGE_DATA
      # Number of robots (used by action_relay to spawn per-robot relays)
      - NUM_ROBOTS=${NUM_ROBOTS:-1}
      # Gossip radio range in metres (coordination_bringup/comms_model.py).
      # Must match the robots' value; 5000 = effectively unlimited.
      - COMMS_RANGE_M=${COMMS_RANGE_M:-5000}
      # rayfronts_debug voxel sim-gradient min (raven_nav voxel_score_threshold),
      # read by render_layout.py and foxglove_visualizer_node. Empty → 0.85.
      - VOXEL_SCORE_THRESHOLD=${VOXEL_SCORE_THRESHOLD:-}
      # GT annotation scene for the bbox overlay; set per environment by the
      # mission runner (osmo `environments:` RESULTS_SCENE) so the GCS shows the
      # right scene's ground truth instead of a hardcoded RetroNeighborhood.
      - RESULTS_SCENE=${RESULTS_SCENE:-RetroNeighborhood}
      # sim_ground / overhead-still knobs, read by foxglove_visualizer_node and
      # by the mission's overhead-snapshot step. All empty-tolerant: the code
      # reads them as `os.environ.get(X) or <default>`, and an empty string is
      # falsy, so `${VAR:-}` cannot smuggle in a zero.
      #
      # These exist because the FIRST overhead frame of a frozen cell is blank
      # — 250 MB of geometry with textures still streaming off Nucleus — and
      # the visualizer used to build sim_ground from exactly that frame.
      # WARMUP_S: ignore everything this long after the first frame.
      # MIN_STD:  reject a frame whose per-channel std is below this (the real
      #           gate; a timer cannot know how long a cell takes to arrive).
      # SETTLE_S / REPEAT_PERIOD_S: how long to keep republishing the marker
      #           and when to rebuild it once from the final frame.
      - SIM_GROUND_WARMUP_S=${SIM_GROUND_WARMUP_S:-}
      - SIM_GROUND_MIN_STD=${SIM_GROUND_MIN_STD:-}
      - SIM_GROUND_SETTLE_S=${SIM_GROUND_SETTLE_S:-}
      - SIM_GROUND_REPEAT_PERIOD_S=${SIM_GROUND_REPEAT_PERIOD_S:-}
      - OVERHEAD_SNAP_WARMUP_S=${OVERHEAD_SNAP_WARMUP_S:-}
      - OVERHEAD_SNAP_PERIOD_S=${OVERHEAD_SNAP_PERIOD_S:-}
      - OVERHEAD_SNAP_FRAMES=${OVERHEAD_SNAP_FRAMES:-}
      - OVERHEAD_SNAP_MIN_STD=${OVERHEAD_SNAP_MIN_STD:-}
      - OVERHEAD_SNAP_DEADLINE_S=${OVERHEAD_SNAP_DEADLINE_S:-}
      # Record bags
      - RECORD_BAGS=${RECORD_BAGS}
    image: ${PROJECT_DOCKER_REGISTRY}/${PROJECT_NAME}:v${VERSION}_gcs
    # Needed to display graphical applications
    # ipc: host
    privileged: true
    stdin_open: true
    tty: true
    # Same 1024 -> 65536 soft-descriptor raise as the robot containers: the
    # GCS is a Fast DDS participant on the SAME shared host /dev/shm and runs
    # the ddsrouter plus one action_relay per robot, so it spends descriptors
    # at eight times the rate of any single robot.
    ulimits:
      nofile:
        soft: 65536
        hard: 524288
    volumes:
      # shared /dev/shm: required for Fast DDS shared-memory transport
      # across containers (see common/fastdds.xml)
      - /dev/shm:/dev/shm
      # display stuff
      - $HOME/.Xauthority:/root/.Xauthority
      - /tmp/.X11-unix:/tmp/.X11-unix
      # developer stuff
      - ../../common/.bash_profile:/root/.bash_profile:rw
      - .bashrc:/root/.bashrc:rw
      - ../../common/.tmux.conf:/root/.tmux.conf:rw
      - ../../common/inputrc:/etc/inputrc:rw
      - ../../.devcontainer/gcs/launch.json:/root/AirStack/.vscode/launch.json:rw
      - ../../.devcontainer/gcs/tasks.json:/root/AirStack/.vscode/tasks.json:rw
      - ./Foxglove:/root/.config/Foxglove:rw
      # waypoint/polygon editor saves (so they survive container restarts)
      - ../saves:/root/.airstack:rw
      # foxglove extensions
      - ../foxglove_extensions:/root/AirStack/gcs/foxglove_extensions:rw
      # autonomy stack stuff
      - ../../common/ros_packages:/root/AirStack/gcs/ros_ws/src/common:rw
      - ../../common/fastdds.xml:/root/AirStack/gcs/ros_ws/src/fastdds.xml
      - ../ros_ws:/root/AirStack/gcs/ros_ws:rw
      # bags
      - ../bags:/bags:rw
      # OSMO mission bags: host bind mount (gitignored osmo/bags/) so
      # `ros2 bag record` writes straight to the pod disk next to the
      # results tree; the runner MOVES them (same fs) instead of a slow
      # docker cp of tens of GB. Shared by every recorder (one host dir).
      - ../../osmo/bags:/osmo_bags:rw
