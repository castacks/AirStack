# Scene catalog for `airstack up --scene <shortname>` (resolved by
# simulation/resolve_scene.py).
#
# Each entry maps a simulator-agnostic shortname to the scene reference each
# simulator understands. A scene may declare one or both simulators:
#
#   <shortname>:
#     isaac: <ref>                # Pegasus SIMULATION_ENVIRONMENTS key, or an
#                                 # omniverse:// / https:// / *.usd reference
#     isaac:                      # long form, when the stage needs extras
#       ref: <ref>
#       stage_scale: 0.01         # scale applied to /World/stage (default 1.0);
#                                 # 0.01 converts cm-authored stages to meters
#     msairsim: <key>             # fetch_scene.sh catalog key (pre-built UE4
#                                 # binary downloaded on first use)
#
# `airstack up --sim isaac --scene <name>` exports ISAAC_SIM_SCENE (+
# ISAAC_SIM_STAGE_SCALE); `--sim airsim --scene <name>` exports
# MS_AIRSIM_SCENE. Launch scripts / entrypoints do the final resolution.

scenes:
  # ── Pegasus SIMULATION_ENVIRONMENTS catalog (NVIDIA Isaac assets) ─────────
  default:
    isaac: Default Environment
    msairsim: blocks
  black-gridroom:
    isaac: Black Gridroom
  curved-gridroom:
    isaac: Curved Gridroom
  hospital:
    isaac: Hospital
  office:
    isaac: Office
  simple-room:
    isaac: Simple Room
  warehouse:
    isaac: Warehouse
  warehouse-forklifts:
    isaac: Warehouse with Forklifts
  warehouse-shelves:
    isaac: Warehouse with Shelves
  full-warehouse:
    isaac: Full Warehouse
  flat-plane:
    isaac: Flat Plane
  rough-plane:
    isaac: Rough Plane
  slope-plane:
    isaac: Slope Plane
  stairs-plane:
    isaac: Stairs Plane
  exhibition-hall:
    isaac: Exhibition Hall

  # ── AirLab Nucleus public stages (guest-readable) ─────────────────────────
  # omniverse://airlab-nucleus.andrew.cmu.edu:443/Public/AirStack/Stages/
  # stage_scale mirrors each root layer's metersPerUnit (verified 2026-08-24):
  # cm-authored stages get 0.01, meter-authored stages 1.0.
  abandoned-factory:
    isaac:
      ref: omniverse://airlab-nucleus.andrew.cmu.edu:443/Public/AirStack/Stages/AbandonedFactory/AbandonedFactory.stage.usd
      stage_scale: 1.0
  abandoned-warehouse-night:
    isaac:
      ref: omniverse://airlab-nucleus.andrew.cmu.edu:443/Public/AirStack/Stages/AbandonedWarehouse/Warehouse_01_night.stage.usd
      stage_scale: 0.01
  abandoned-warehouse-day:
    isaac:
      ref: omniverse://airlab-nucleus.andrew.cmu.edu:443/Public/AirStack/Stages/AbandonedWarehouse/Warehouse_02_day.stage.usd
      stage_scale: 0.01
  chemical-plant:
    isaac:
      ref: omniverse://airlab-nucleus.andrew.cmu.edu:443/Public/AirStack/Stages/ChemicalPlant/Map_ChemicalPlant_2.stage.usd
      stage_scale: 1.0
  construction-site:
    isaac:
      ref: omniverse://airlab-nucleus.andrew.cmu.edu:443/Public/AirStack/Stages/ConstructionSite/ConstructionSite.stage.usd
      stage_scale: 0.01
  retro-neighborhood:
    isaac:
      ref: omniverse://airlab-nucleus.andrew.cmu.edu:443/Public/AirStack/Stages/RetroNeighborhood/RetroNeighborhood.stage.usd
      stage_scale: 0.01

  # ── MS AirSim pre-built UE4 scenes (fetch_scene.sh) ───────────────────────
  # Only the UE4 binaries that actually ship in the AirSim v1.8.1 release.
  blocks:
    msairsim: blocks
  neighborhood:
    msairsim: airsimnh
  abandoned-park:
    msairsim: abandonedpark
  landscape-mountains:
    msairsim: landscapemountains
  zhangjiajie:
    msairsim: zhangjiajie
  africa-savannah:
    msairsim: africasavannah
  msbuild2018:
    msairsim: msbuild2018
