# Per-stack image composition arrives with this stack's first
# module pins: the P4 machinery (tools/compose_module_layers.py) composes
# per-module dependency layers on top of the trunk base image and emits a
# compose override for `airstack up`.
#
# lite_offload_global pins no modules (see modules.repos), so there is nothing
# to compose yet -- the trunk compose profiles provide every service meanwhile
# (the onboard half runs in the robot service; the offboard half maps to the
# robot-offboard service pattern until fleet generation lands).
# The empty services map keeps this file valid YAML for the stack-anatomy
# contract (tests/meta/test_stack_layout_contract.py).
services: {}
