# note that all ROS2 topics must be prefixed:
#   rt/ (ROS Topic): Prefixed to all standard ROS 2 topics.
#   rq/<service_name>Request (ROS Service Request): Prefixed to the request topic of a ROS 2 service.
#   rr/<service_name>Reply (ROS Service Reply): Prefixed to the reply topic of a ROS 2 service.
#   rs/ (ROS Service): Reserved for systems where services are handled as a single entity rather than separate request/reply topics. 
#   [action_topic]/_action/status: A topic for goal status updates.
#   [action_topic]/_action/feedback: A topic for feedback during execution.
#   [action_topic]/_action/send_goal: A service to initiate the action.
#   [action_topic]/_action/get_result: A service to retrieve the final result.
#   [action_topic]/_action/cancel_goal: A service to cancel an active goal. 

# all topics are bidirectional by default. See https://eprosima-dds-router.readthedocs.io/ for more details

# mtl_search robot <-> GCS DDS Router allowlist.
# A verbatim copy of the shared autonomy_bringup/config/dds_router.yaml plus
# the "MTL search" block at the end (search products, gimbal, and the
# search_mission / takeoff / land actions so a GCS-side operator can start
# missions). Keep the shared part in sync when that file changes.
participants:
  - name: "robot"
    kind: "local"
    domain: $(env ROS_DOMAIN_ID)
  - name: "gcs"
    kind: "local"
    domain: $(var gcs_domain)
allowlist:
  # lidar and world model
  - name: "rt/$(env ROBOT_NAME)/sensors/ouster/point_cloud"
  - name: "rt/$(env ROBOT_NAME)/vdb_mapping/vdb_map_visualization"

  # camera streams
  - name: "rt/$(env ROBOT_NAME)/sensors/front_stereo/left/image_rect"
  - name: "rt/$(env ROBOT_NAME)/sensors/front_stereo/left/camera_info"
  - name: "rt/$(env ROBOT_NAME)/sensors/front_stereo/right/image_rect"
  - name: "rt/$(env ROBOT_NAME)/sensors/front_stereo/right/camera_info"
  - name: "rt/$(env ROBOT_NAME)/sensors/front_stereo/right/depth_ground_truth"
  - name: "rt/$(env ROBOT_NAME)/perception/stereo_image_proc/point_cloud"

  # state information
  - name: "rt/$(env ROBOT_NAME)/odometry_conversion/odometry"
  - name: "rt/$(env ROBOT_NAME)/interface/mavros/global_position/global"
  - name: "rt/$(env ROBOT_NAME)/trajectory_controller/trajectory_vis"
  - name: "rt/$(env ROBOT_NAME)/global_plan"

  # # allow all services
  # - name: "rq/*"
  #   type: "*"
  # - name: "rr/*"
  #   type: "*"

  # behavior tree services
  - name: "rq/$(env ROBOT_NAME)/interface/robot_commandRequest"
  - name: "rr/$(env ROBOT_NAME)/interface/robot_commandReply"

  - name: "rq/$(env ROBOT_NAME)/trajectory_controller/set_trajectory_modeRequest"
  - name: "rr/$(env ROBOT_NAME)/trajectory_controller/set_trajectory_modeReply"

  - name: "rq/$(env ROBOT_NAME)/takeoff_landing_planner/set_takeoff_landing_commandRequest"
  - name: "rr/$(env ROBOT_NAME)/takeoff_landing_planner/set_takeoff_landing_commandReply"

  - name: "rq/$(env ROBOT_NAME)/behavior/global_plan_toggleRequest"
  - name: "rr/$(env ROBOT_NAME)/behavior/global_plan_toggleReply"

  # bag recording status
  - name: "rt/$(env ROBOT_NAME)/bag_record/bag_recording_status"
  - name: "rt/$(env ROBOT_NAME)/bag_record/set_recording_status"

  # gossip peer profiles are bridged by the dedicated gossip_dds_router (domain 99),
  # NOT here — having it in both routers causes message flooding/amplification.

  # ── MTL search (mtl_search stack) ────────────────────────────────
  - name: "rt/$(env ROBOT_NAME)/search/plan"
  - name: "rt/$(env ROBOT_NAME)/search/planned_path"
  - name: "rt/$(env ROBOT_NAME)/search/planned_boresight"
  - name: "rt/$(env ROBOT_NAME)/search/markers"
  - name: "rt/$(env ROBOT_NAME)/search/follower_status"
  - name: "rt/$(env ROBOT_NAME)/search/metrics"
  - name: "rt/$(env ROBOT_NAME)/search/detection_markers"
  - name: "rt/$(env ROBOT_NAME)/search/footprint"
  - name: "rt/$(env ROBOT_NAME)/search/carrot"
  - name: "rt/$(env ROBOT_NAME)/search/aim_point"
  - name: "rt/$(env ROBOT_NAME)/gimbal/state"
  - name: "rt/$(env ROBOT_NAME)/gimbal/cmd_pitch_yaw"
  - name: "rt/$(env ROBOT_NAME)/gimbal/camera_info"
  - name: "rt/$(env ROBOT_NAME)/gimbal/rgb"
  # action search_mission
  - name: "rq/$(env ROBOT_NAME)/search_mission/_action/send_goalRequest"
  - name: "rr/$(env ROBOT_NAME)/search_mission/_action/send_goalReply"
  - name: "rq/$(env ROBOT_NAME)/search_mission/_action/cancel_goalRequest"
  - name: "rr/$(env ROBOT_NAME)/search_mission/_action/cancel_goalReply"
  - name: "rq/$(env ROBOT_NAME)/search_mission/_action/get_resultRequest"
  - name: "rr/$(env ROBOT_NAME)/search_mission/_action/get_resultReply"
  - name: "rt/$(env ROBOT_NAME)/search_mission/_action/status"
  - name: "rt/$(env ROBOT_NAME)/search_mission/_action/feedback"
  # action tasks/takeoff
  - name: "rq/$(env ROBOT_NAME)/tasks/takeoff/_action/send_goalRequest"
  - name: "rr/$(env ROBOT_NAME)/tasks/takeoff/_action/send_goalReply"
  - name: "rq/$(env ROBOT_NAME)/tasks/takeoff/_action/cancel_goalRequest"
  - name: "rr/$(env ROBOT_NAME)/tasks/takeoff/_action/cancel_goalReply"
  - name: "rq/$(env ROBOT_NAME)/tasks/takeoff/_action/get_resultRequest"
  - name: "rr/$(env ROBOT_NAME)/tasks/takeoff/_action/get_resultReply"
  - name: "rt/$(env ROBOT_NAME)/tasks/takeoff/_action/status"
  - name: "rt/$(env ROBOT_NAME)/tasks/takeoff/_action/feedback"
  # action tasks/land
  - name: "rq/$(env ROBOT_NAME)/tasks/land/_action/send_goalRequest"
  - name: "rr/$(env ROBOT_NAME)/tasks/land/_action/send_goalReply"
  - name: "rq/$(env ROBOT_NAME)/tasks/land/_action/cancel_goalRequest"
  - name: "rr/$(env ROBOT_NAME)/tasks/land/_action/cancel_goalReply"
  - name: "rq/$(env ROBOT_NAME)/tasks/land/_action/get_resultRequest"
  - name: "rr/$(env ROBOT_NAME)/tasks/land/_action/get_resultReply"
  - name: "rt/$(env ROBOT_NAME)/tasks/land/_action/status"
  - name: "rt/$(env ROBOT_NAME)/tasks/land/_action/feedback"
