# =============================================================================
#  MTL SEARCH MISSION  (stacks/mtl_search)
#
#  The ONE human-edited definition of the search problem. Everything else in
#  this folder is GENERATED from it + the fleet file by
#
#      python3 scripts/mtl_generate_scenario.py            # (repo root)
#
#  which writes scenario.json (planner-facing), ground_truth.json (targets, never
#  read by a planner) and belief.png (ground texture). The Isaac scene, every
#  robot's mtl_search_planner and mtl_metrics_logger read those files, so the
#  belief the world is painted with and the belief the planner optimises are the
#  same array (the reason mtl_plan_json.cpp takes host-extracted cells).
#
#  FRAMES: mission NED metres  (n +North, e +East, d +Down), origin = Isaac world
#  origin. Isaac/AirStack world is ENU: x = e, y = n, z = -d.
#
#  SCALE: the testbed's `search_small` preset (1/12.5 of the 5 km / 300 m / 20 m/s
#  fixed-wing reference) so a PX4 Iris flies a sortie in ~2 minutes. Lengths are
#  scaled; speed is 6 m/s; the Dubins radius stays a planning constraint; the
#  detection sigmoid is rescaled with the altitude (c, beta x0.1, b x10).
# =============================================================================

mission:
  name: mtl_search_small
  seed: 210                       # drives the belief bumps AND target sampling

  area:
    size_m: 5000.0                # square, centred on center_ned
    center_ned: [0.0, 0.0]
    belief_res_m: 1.0            # -> 5001 x 5001 prior raster

  belief:                        # sum of Gaussian bumps, capped, floored, then normalised to sum to 1
    num_centroids: 10
    max_prior_peak: 0.4
    sigma_min_m: 200.0
    sigma_max_m: 400.0
    belief_cap: 0.85
    base_uncertainty: 0.0
    edge_margin_frac: 0.12       # keep bump centres off the boundary

  targets:                       # GROUND TRUTH ONLY
    count: 50
    min_separation_m: 30.0
    render:
      model: beacon              # pad + post + emissive top
      size_m: 16
      rgba: [0.95, 0.12, 0.10, 1.0]

  team:
    max_flight_time_s: 500.0      # per agent -> 6000 m of track at 6 m/s (the curve planner needs it finite)
    max_flight_distance_m: .inf  # the tighter of the two binds
    altitude_separation_m: 1.0   # vertical deconfliction: robot_N cruises (and takes off) at
                                 # altitude_m + (N-1) * this -> 300 / 301 / 302 m. The team is
                                 # planned at altitude_m; the planner is deconfliction-unaware
                                 # (robot_2/robot_3 were planned 0.8 m apart at t = 2 s).

  aircraft:
    altitude_m: 300.0
    speed_mps: 6.0
    min_turn_radius_m: 12.0      # V/R = 0.5 rad/s of turn; carrot L = 1.2 R = 14.4 m
    dt: 0.1                      # planner trajectory step (NOT the control period)
    dubins_step_m: 0.5

  mapping:
    target_cell_size_m: 200.0
    minimum_belief_mass: 2.0e-4  # keep a 20 m cell when P(target in cell) > 0.2 %. The prior is
                                 # normalised to sum to 1, so this is a per-cell PROBABILITY (it
                                 # replaced the retired mean_information_thresh: 0.08, a mean-belief
                                 # test). 400 blocks here (uniform share 1/400 = 2.5e-3); 2e-3 keeps
                                 # exactly the same 144 cells the old threshold kept (89.5 % of the
                                 # prior; the next block down holds 1.94e-3), so the plans are
                                 # unchanged. Scales with target_cell_size_m^2 / size_m^2: recompute
                                 # it if you change the area, the cell size or the belief bumps.
    max_cluster_radius_m: 550.0
    kmeans_replicates: 3
    kmeans_max_iter: 200

  sensor:
    fov_deg: 60.0                # full cone; ground radius = slant * tan(FOV/2)
    single_axis_gimbal: true     # 1-DOF cross-track (false = 2-DOF hierarchical TSP)
    tilt_deg: 30.0               # forward mount tilt -> h tan(tau) = 17.3 m stand-off
    max_slant_range_m: 900.0
    detection:                   # Moon et al. (2022), rescaled with the altitude
      a: 1.10
      b: 0.10
      c: 610.0
      beta: 900.0
      p_out_of_range: 1.0e-6
      threshold: 0.90            # cumulative P_det at which a target is "found"
      dt_ref_s: 0.1              # the per-look calibration period (= aircraft.dt)

  gimbal:                        # planner-side scheduler knobs (mtl GimbalSchedulerParams)
    enable_repair_loop: false

  solver:                        # optional mtl solver overrides (n_starts, max_outer_iter,
                                 # reserve_frac0, cell_refine, reallocate, max_cell_candidates,
                                 # extend_dist_m, max_extra_dist_m)
    extend_dist_m: 2.0          # single-axis "lateral coverage" run-out flown straight past the
                                 # end of a route whose tail cells never come abeam. The planner
                                 # default (300 m) is sized for the 5 km reference; unscaled it sent
                                 # robot_3 110 m past the north boundary and, via the budget
                                 # reserve, shrank its route to 195 m (run 20260923-155234).
                                 # 300 / 12.5 = 24 m -> team info 96.9 % -> 100 %, nobody leaves
                                 # the area, and the "agent 3 could not be planned" warning is gone.

  info_aware:                    # MTL PLANNER MODE TOGGLE (mtl::PlannerParams::infoAware)
    enabled: true                # which plan is FLOWN. false: the plain planner (k-means clusters
                                 # by proximity, route scored by the mass the boresight is aimed
                                 # at). true: the information-aware search - clusters follow the
                                 # prior's peaks, cut into nested mass levels (core / shoulder /
                                 # tail) so the route can take a peak's core and move on; several
                                 # such abstractions (and the plain one) are planned, each flown
                                 # plan is scored by what the footprint would actually detect,
                                 # and split / peel / merge moves refine the best. Adds seconds
                                 # of planning at mission start (planned on worker threads).
    report_both: true            # also plan the OTHER mode (never flown): the planner writes it
                                 # as plan_alt.json / track_alt.json and the report scores both
                                 # plans side by side (planned residual belief of each).
    # optional tuning, planner defaults shown:
    # level_sets: [[1.0], [0.5, 1.0], [0.35, 0.7, 1.0]]   # cumulative-mass cuts of each peak
    # persistence: 0.6           # merge two peaks when the saddle >= this x the lower peak
    # reach_scales: [1.0]        # extra cluster radii, x the detection reach (slant <= beta)
    # restarts: 2                # extra orienteering seeds per abstraction, all scored
    # max_moves: 16              # split / peel / merge re-plans after the candidate sweep
    # threads: 0                 # 0 = hardware concurrency (max 8)

  planner:                       # WHICH PLANNER IS FLOWN (mtl_search_planner)
    type: curve           # orienteering: mtl::planner (cells -> clusters -> budgeted orienteering ->
                                 #   Dubins -> gimbal schedule); its mode is info_aware.enabled above.
                                 # curve: mtl::curve::Planner - ONE continuous curve per aircraft, exactly
                                 #   the budget long, never tighter than min_turn_radius_m, optimised jointly
                                 #   for the lowest residual belief, while the 1-DOF gimbal sweeps
                                 #   alpha(t) = alphaMax sin(2 pi f t) across track (the curve: block below).
                                 #   Needs a finite team budget. Plans take seconds to tens of seconds.
    compare_orienteering: true   # curve only: ALSO plan the orienteering planner in BOTH modes (plain and
                                 # info_aware), never flown, so the report compares all three plans
                                 # (plan_alt_plain.json / plan_alt_info_aware.json). false: skip them.
                                 # (With type: orienteering, info_aware.report_both decides instead.)

  curve:                         # mtl::curve::Planner options = mtlc_plan's "curve" block. Every key is
                                 # optional; an ABSENT key keeps the planner default, auto-scaled to this
                                 # mission by the adapter (grids / samples / knots x size_m / 5000, kernel
                                 # geometry x beta / 610). Unknown keys are refused. For THIS mission
                                 # (5 km, 1 m raster, beta 900 m, 300 m altitude) the auto-scaled defaults are:
                                 #   fast_grid_step_m 25 (>= the 1 m raster; 200 x 200 optimiser grid),
                                 #   explore_grid_step_m 50, sample_spacing_m 25, knot_spacing_m 100
                                 #   (61 curvature knots over the 6 km curve), kernel geometry x 900/610 = 1.48
                                 #   (lambdaCap 150, the planner default since the upstream fix; not scaled).
                                 # Checked against the planner's validate(): reach sqrt(beta^2 - h^2) =
                                 # 849 m >> the 25 m fast grid; every agent's boresight is in range while
                                 # h < 0.98 beta cos(tilt) = 764 m.
    representation: curvature    # kappa(s) piecewise linear in arc length: the curve is EXACTLY the budget
                                 # long and |kappa| <= 1 / min_turn_radius_m everywhere by construction.
    endpoint_mode: open          # like the orienteering routes (no return leg); return_home | fixed_dest
                                 # (+ destinations_ned: [[n, e], ...]) also work.
    altitude_stagger_m: 1.0      # agent a plans (and flies) at altitude_m + a * this. = team.altitude_separation_m,
                                 # so the curve's planned altitudes ARE the flown deconfliction layers
                                 # (300 / 301 / 302 m; the planner default 25 m would put robot_3 50 m
                                 # above its takeoff layer). The adapter does not add altitude_offset_m again.
    sweep_freq_hz: 0.075         # the reference 0.25 Hz is for 20 m/s (40 m flown per half-sweep); at 6 m/s,
                                 # 0.25 x 6/20 = 0.075 Hz keeps the same 40 m spacing. Amplitude +/-60 deg
                                 # (gimbal_max_deg; at beta 900 the slant-range bound, 66.9 deg, no longer
                                 # binds), so the peak rate is 28.3 deg/s instead of 94 - well inside the
                                 # 120 deg/s gimbal (planner, follower, sim). Planned residual was the same at
                                 # both (0.3076 vs 0.3073, 1 agent, measured at beta 610).
    # --- first solve (upstream 8ba811a defaults, adopted 2026-10-23; written out so a later
    #     upstream default change cannot silently change the flown plan) ---------------------
    init_strategies: [sector]    # ONE seed per agent, optimised once: sector = coverage orienteering over a
                                 # sector grid (planning::solveSectorOrienteering) on the belief the agents
                                 # already planned leave unswept. Upstream: ~-3% mean residual at ~40% of the
                                 # time of the previous [clusters, greedy] over 118 maps, with a tail of maps
                                 # that do worse; [sector, clusters] (2 optimisations) removes most of it.
                                 # Any of sector | clusters | greedy (gcs needs SCS: not built here).
                                 # KNOWN (2026-10-23, kept on purpose until the multi-agent pipeline is
                                 # revamped): good for 1 agent (fast residual 0.4921 vs 0.4925, 3.4 s vs 9.4 s)
                                 # but much worse for a TEAM: 3 agents homed 30 m apart planned 0.138 with
                                 # [sector] vs 0.103 with [clusters, greedy] (1 sweep) and 0.073 with the old
                                 # pipeline below; reallocate: true brings [sector] to 0.105.
    coordination_sweeps: 1       # 1 = one optimisation per seed (was 2: + a warm re-solve of every agent)
    order_budget_frac: 0.95      # Euclidean ordering budget of the 'clusters' seed (x curve length). Unused with
                                 # [sector]. 0.95 is AirStack's own tune (5ee6f4209 had patched it into the
                                 # vendored params.hpp; upstream: 0.8 before 8ba811a, 1.0 now): kept here as a key.
    sector:                      # the sector seed (mtlc_plan curve.sector). size_m and grid_step_m auto-scale
                                 # with size_m / 5000; for THIS 5 km mission that is the reference scale, so
                                 # these ARE the upstream defaults (written out as the calibration record):
      size_m: 200.0              #   sector pitch: 25 x 25 = 625 sectors over 5 km, the best 250 kept as nodes
                                 #   (max_candidates); 0.35 calibrated swath half-widths (hw 578 m here)
      grid_step_m: 50.0          #   raster of the box sums (= explore_grid_step_m; >= the 1 m belief raster)
      box_frac: 1.2              #   a visited sector credits a box of half-side 1.2 x the calibrated swath
                                 #   half-width (694 m here; scales with beta by itself); the study's best "f1.2b1"
      budget_frac: 1.0           #   Euclidean route budget = 1.0 x the curve length (3000 m here)
                                 # (starts 8, perturb 40, max_candidates 250: planner defaults)
    reallocate: false            # slack audit + cluster reallocation after the static solve: OFF (upstream
                                 # default since 8ba811a; was true). The realloc_* keys below only act with true.
    realloc_strategies: [path]   # seeds a slack agent tries when it claims an unserviced cluster
                                 # (best feasible one kept, only if the team residual falls):
                                 #   path   splice the cluster into the agent's current OPTIMISED curve -
                                 #          waypoints every 100 m along it, cheapest insertion, the length
                                 #          overrun cut from the lowest-yield arcs, the kept arcs copied into
                                 #          the new seed; a claim that cannot fit is skipped unsolved
                                 #          (upstream 7a45427, curve_planning/path_insert)
                                 #   insert cheapest insertion into its cluster waypoints + a fresh seed
                                 #          (the seed before 7a45427; [insert, direct] restores that plan)
                                 #   direct fly to the cluster first, then information pursuit
                                 # = the upstream default. Fixed by the planner, not keys: waypoint spacing
                                 # 100 m (~30 waypoints on this 3 km curve, = knot_spacing_m) and pi/2 x
                                 # min_turn_radius_m = 18.8 m of turning slack per join.
    realloc_path_max_iter: 75    # refine iterations of a path trial (0 = max_iter). Half of max_iter 150,
                                 # as upstream: the seed keeps most of the optimised curve.
    realloc_path_warm: true      # path trials explore with explore_iter_warm (the seed is already in the
                                 # optimised curve's basin); false = the full cold exploration.
    # optional, planner defaults: max_realloc_trials: 4, realloc_rounds: 2, max_iter: 150, explore_iter: 100.
    # The previous (pre-8ba811a) first solve was init_strategies: [clusters, greedy], coordination_sweeps: 2,
    # reallocate: true (with order_budget_frac 0.95) - set those to plan exactly as before (checked: the same
    # plan, byte for byte, as the 7a45427 build).

  follower:                      # mtl_trajectory_follower, via every SearchPlan (gimbal_law)
    gimbal_law: open_loop        # single-axis gimbal: open_loop = replay the PLANNED cross-track angle
                                 # (roll + phi) with the look angle held at tilt_deg - the gimbal just swings
                                 # left and right as planned, no correction. aim_point = the follower's
                                 # original law: aim at the planned ground point from the ACTUAL pose, with
                                 # a +/-5 deg pitch nudge. (2-DOF mounts always aim.)

  flight:                        # how scripts/mtl_start_mission.sh flies it
    takeoff_altitude_m: 300.0
    takeoff_velocity_m_s: 6.0

  sim_gimbal:                    # the native Isaac gimbal (search_mission_scene.py)
    width: 640
    height: 480
    publish_hz: 15.0
    mount_offset_m: [0.10, 0.0, -0.08]   # FLU from the body frame origin
    slew_rate_deg_s: 120.0
    roll_limit_deg: [-80.0, 80.0]
    pitch_limit_deg: [-20.0, 110.0]
    initial_pitch_deg: 60.0      # boresight at rest before any command

  render:                        # cosmetic; no planner reads this
    texture_px: 512
    show_valid_cells: true
    ground_rgba: [0.30, 0.38, 0.23, 1.0]
    surround_m: 150.0            # plain collider ground beyond the area
    boundary_rgba: [1.0, 0.85, 0.1, 1.0]
