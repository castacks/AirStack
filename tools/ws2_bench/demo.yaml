# Engineering demonstration values, not CyLab-approved threat bounds.
# Same furnished layout is kept for the clean / noise / patch comparison.
dwell_sim_s: 8
conditions:
  - {name: "Original Office", layout: stock, light: 2200}
  - {name: "Office - moved and added props", layout: furnished_a, light: 2200}
  - {name: "Different layout and lighting", layout: furnished_b, light: 800}
  - {name: "Same scene - clean input", layout: furnished_a, light: 2200}
  - {name: "RGB noise and sensor delay", layout: furnished_a, light: 2200, rgb_noise: 25, delay: 0.25}
  - {name: "Patch on - 0.3 m", layout: furnished_a, light: 2200, patch_enabled: true, patch_size: 0.3}
  - {name: "Patch on - 0.9 m", layout: furnished_a, light: 2200, patch_enabled: true, patch_size: 0.9}
  - {name: "Combined conditions", layout: furnished_a, light: 1600, rgb_noise: 15, delay: 0.15, patch_enabled: true, patch_size: 0.9}
  - {name: "Restored clean input", layout: furnished_a, light: 2200}
