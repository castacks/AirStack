# Every rail car on the site, surveyed by hand: world XY of each car's two ENDS, read off 10 cm/px
# gridded crops of the tile ortho (data/recon/ortho_site.png), +-0.5 m. The tile mesh merges coupled
# and derailed cars into single blobs, so automatic fitting cannot separate them; this list is what
# place_assets.py places instead (asset scaled to the surveyed length). `tilt` rolls a car about its
# own long axis (a derailed car on its side); `asset` picks from data/recon/assets/lib/library.json.
#
