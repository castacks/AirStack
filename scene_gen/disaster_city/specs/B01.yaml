# B01 "133" building -- measured off data/recon/b01/sheets/ (render-and-compare georeferenced
# dense cloud, recon_georef.py; +-0.2 m). Frame: measure_sheets.py B01 --yaw 47.35 (the yaw of the
# fitted front wall line), origin at the tile footprint's corner, z = 0 at the cloud's ground (0.5 m
# above the LOD1 box's ground_z). Concrete block x 0.4..12.7, y 3.4..9.8; steel frame continues it
# to x 24.8 with a deck at the block's first floor and a roof deck over x 12.7..18.8.
# The blue-roofed wing in the Google tiles (y 10..15) has since collapsed: its roof slab leans off the
# block's roof edge down onto the pile (modelled below as wing_*).
# Openings: what the sheets show. The yhi face and the interior were not filmed -- see the end.
id: B01
name: roof_crane_building
origin: [43.38, -425.35, 57.74]
yaw_deg: 47.35
lights:          # block ground + first floor; the frame's first-floor deck (under the roof deck)
  - {rect: [0.7, 3.7, 12.4, 9.5], ceiling: 3.4, spacing: 5}
  - {rect: [0.7, 3.7, 12.4, 9.5], ceiling: 7.4, spacing: 5}
  - {rect: [13.0, 3.7, 18.5, 9.7], ceiling: 7.4, spacing: 5}
photo: {mats: [concrete, sign]}    # these faces get an atlas projected from the georeferenced frames (photo_bake.py)
