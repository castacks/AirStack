title: Disaster City (TEEX) in Isaac Sim
intro: 'Rebuilt from Google 3D tiles + two drone videos: hero buildings measured off drone reconstructions and textured from the video, rubble piles from rubble assets, vehicles and props from Nucleus/Objaverse,
  survivors where the video shows them.'
