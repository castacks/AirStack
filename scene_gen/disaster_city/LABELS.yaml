# LABELS.yaml — names for everything in the Disaster City map, for talking about it.
#
# Coordinates are WORLD X/Y in metres in blender_data/disaster_city.blend
# (Blosm origin lat 30.57891, lon -96.35235; +X east, +Y north). They were read
# off a top-down ortho render of "Google 3D Tiles.001" and are good to ~2 m.
# `height_m` is measured off the tile mesh (top minus surrounding ground) by
# tools/label_map.py -- photogrammetry, so +/- ~1 m and thin things read low.
#
# ID prefixes:  B building   V vehicle(s)   R rubble   S structure / prop
#               Z zone / block   RD road   W water   X off-site (not TEEX)
# `side: left` only moves the text on LABELS_map.png.
#
# The grid of 45-degree blocks in the south is "the grid". The loop road runs
# round the pond; "the street" is the east-west cul-de-sac road with houses.
# `seen_in` names clips in mocaps/clips/ where the thing is clearly identified.

labels:
# ---------------- water / roads ----------------
- {id: W01, name: pond, kind: water, at: [-5, -160]}
- {id: RD01, name: loop_road, kind: road, at: [-58, -250], note: "runs round the pond, west side here"}
- {id: RD02, name: the_street, kind: road, at: [140, -258], note: "east-west road with the houses; turnaround loop at its west end"}
- {id: RD03, name: east_road, kind: road, at: [240, -230], note: "north-south road on the east side"}
- {id: RD04, name: grid_diagonal, kind: road, at: [-35, -370], note: "loop road entering the grid from the NW"}
