# URBAN FIRE — LEVEL 2. established, SSE — burnt-out core behind the front
#
# GENERATED by `tools/make_urban_fire_levels.py` from `downtown_urban_1000.yaml`. Do not
# hand-edit: edit the generator (for the fire) or the base (for the city) and
# regenerate, or the "one shared layout" guarantee silently stops holding.
#
# The city comes from the base VERBATIM — every district, layout, packing and
# pool key. The only differences from the base are the four lines below the
# marker: the city `seed`, and the fire.
#
# THE FIRE IS A WIND-DRIVEN CORRIDOR — see `disaster/fire_corridor.py`. One
# origin, one front, running downwind at `heading_deg: 160.0`; every
# building in the swathe burns, which is what keeps the burn contiguous
# instead of leaving pristine buildings inside a burnt block.
#
# `start_offset_frac: 0.45` opens the scene at `duration_s * 0.45` =
# 12960 s (3.6 h) after ignition, so the tail by the origin is
# burnt out and the head at the front is freshly alight. Both axes move with
# the level: the fire has run FURTHER (24% of the city here) and each
# building is FURTHER THROUGH its own fire. See the generator's docstring for
# why the old ladder — all three levels at the same 5.6 h epoch, separated
# only by a post-hoc count shuffle — produced an "early / contained" L1
# holding nothing but F4 and F5.
#
# HEADING VARIES BY LEVEL so the three cells do not all burn along the same
# diagonal.
locale: downtown
disaster-type: fire
severity: 0.0

asset-set: urban_gac
# 800 m, not none.yaml's 400. The OSM-calibrated block targets below are
# 60-95 x 135-200 m; a 400 m region fits about two of those across, so it lands
# at 14 blocks with only 3 arterial corridors and no readable road hierarchy.
# At 800 m the same targets give 31 blocks, 34 corridors and a real core/mid/
# edge gradient. Measured cost is 25.3M points (39.5M per km2) — under the 400 m
# scene's own 26.7M, because the calibrated terrace runs and parkland share are
# both smaller than the guesses they replaced.
# The A/B against none.yaml is no longer like-for-like on area; compare per km2.
region_m: [1000, 1000]
seed: 18

# ---- LIGHT -------------------------------------------------------------------
# NO `sky:` KEY, deliberately — reverted (user, 2026-08-29: "revert the sky back
# to what it was before"). With no `sky` configured, `resolve_sky` returns "" and
# `scene_prep.add_sky` takes its empty branch: a plain untextured dome light, and
# the sky itself comes from the Pegasus "Default Environment" the launcher loads.
# The `mealie_road.hdr` dome that briefly sat here is what made the city read as
# evening — a clear-sky HDRI carries its own low sun baked into the image, and no
# intensity setting can raise that sun.
#
# WHAT IS KEPT is the brightness. `add_sky`'s own defaults are intensity 3500 at
# exposure -3.0, and exposure is a power of two, so the effective figure is
# 3500 * 2^-3 = 437 — which is what made the city read flat and dim. 2000 at
# exposure 0.0 is about 4.6x that, and on an UNTEXTURED dome it arrives as even
# ambient from every direction with no low-sun colour cast, which is the closest
# this rig gets to overhead noon.
#
# Note the launcher's `_disable_sky_sun` switches off any DistantLight under
# `/World/Environment/sky/`, so there is no hard directional sun on top of this;
# the dome is doing all the lighting. If a real sun angle is ever wanted, that
# pass is where to stop disabling it, not here.
sky_intensity: 2000.0
sky_exposure: 0.0

overrides:
  # Roof plant, water tanks, masts and fire escapes from the pack's own 122
  # props (`detail/gac_props.py`). UNDER `overrides`, not at the top level:
  # this preset is a HIGH-LEVEL spec compiled against `low_level/default.yaml`,
  # and the compiler drops top-level keys it does not know — the pass silently
  # never ran and printed nothing, which is indistinguishable from "placed 0".
  # ---- rooftop plant and wall kit (detail/gac_props.py) ----------------------
  # AC units, water tanks, roof bulkheads and fire escapes, from the
  # GreatAmericanCity pack's own 122 props. Placed by the LAYOUT GENERATOR, not
  # by a disaster pass (user, 2026-08-29: "remove the extra ones from earthquake
  # and fire. Keep it central with the urban layout generator. Those can pick it
  # up from here") — the earthquake and fire pipelines adopt what is already on
  # the roof and settle it, rather than authoring a second set.
  building_props:
    enabled: true
    max_roof_props: 6
    # A TANK IS A MID-RISE THING. The user's rule verbatim: "Don't add water
    # tower to low rises. Only mid rises(higher ones)." Tested against the
    # building's own measured height; SM_Water_Tank_02 is 5.0 x 5.0 x 11.3 m and
    # has no business on a 15 m shed.
    water_tank_min_h_m: 30.0
    water_tank_max_h_m: 90.0
    # A fire escape is low- and mid-rise too. Without the cap, SM_Building_20
    # (151 m) took one continuous 35-segment stack to the roof, and fire escapes
    # were 76% of every prop in the scene.
    fire_escape_min_h_m: 12.0
    fire_escape_max_h_m: 80.0
    fire_escape_max_storeys: 12
    ac_min_h_m: 0.0          # AC goes on any eligible flat roof
    # MEASURED, not guessed (`tools/roof_flatness.py`): the share of each
    # asset's upward-facing area lying within 1.5 m of its own top. A flat
    # massing shell is near 1.0; a pitched or stepped roof is far below it.
    #   BG_Building_D 0.90  BG_Building_A 0.82  MBuilding01 0.74
    #   BG_Building_B 0.69  BG_Building_C 0.69
    # Left out: BG_Building_F 0.53 and BG_Building_E 0.31 (a spire lifts E's
    # max-Z above its real roof deck, which understates it — worth a look
    # before adding), every Dmytro shed 0.06-0.51, and the brownstones
    # 0.07-0.48, which are cornices and mansards.
    flat_roof: ["BG_Building_A", "BG_Building_B", "BG_Building_C",
                "BG_Building_D", "SM_MERGED_BP_MBuilding01"]
    # NO PROPS ON THESE TWO (user, 2026-08-29 scene review, pointed at
    # /World/stage/generated/house_19_541 and house_21_547): "the tops are odd
    # shaped". SM_Building_31 (302 m) and SM_Building_16 (312 m) are the two
    # tallest in the library and neither has a flat deck to stand plant on —
    # they carry a crown/setback, so the parapet-inset maths seats a tank on a
    # roof height that only part of the footprint actually reaches.
    #
    # `roof_flatness.py` does not catch this: it measures the share of
    # upward-facing area within 1.5 m of the asset's own max Z, and a big flat
    # crown ON TOP of a setback still scores well. Judged by eye, recorded here.
    # A ROOF HOUSE MUST BE CLAD LIKE THE BUILDING IT STANDS ON — brick on
    # brick, concrete on concrete (user, 2026-08-29, said it twice: "brick
    # doesn't go with concrete"). MEASURED per asset off `info:unreal:
    # sourceAsset` on each bound material, area-weighted: 01 and 04 are 35-36%
    # `M_Bricks_Superior_Construction_Inst`, 02 and 03 are the identical mesh
    # carrying `M_Wall_...` (this pack's precast skin) instead, Glass_Roof is
    # 100% glass. The building's own cladding comes from the dominant texture
    # on its `front` elevation in `_plans/gac_faces.json`.
    #
    # A building with no matching bulkhead gets NO bulkhead — a bare roof
    # beats a brick hut on a concrete tower. Measured: 3 of 8 roof houses were
    # mismatched before this, 0 of 9 after.
    roof_house_match_material: true
    no_roof_props: ["SM_Building_31", "SM_Building_16"]

  # ROAD ASPHALT, matched to the suburb wildfire scene: the local megascans
  # asphalt swatch instead of shared.yaml's Nucleus MI_Asphalt. `apply_ground_planes`
  # reads `usds.materials.asphalt`; the urban marking vocabulary is drawn on
  # top by `road_markings.py` and is unchanged.
  usds:
    materials:
      asphalt: "airstack://scene_gen/assets/materials/megascans/Road_Asphalt.usda"
  # ---- block shape -----------------------------------------------------------
  # The built-in BSP always splits whichever side is longer, which drives every
  # block toward square: measured over this same region it gives a median
  # long:short ratio of 1.2x with a 38 m short side. Real downtown grids are
  # directional — Manhattan runs ~80 m between streets and ~280 m between
  # avenues, about 1:3.5 — and the sparse axis carries the wide roads.
  #
  # city_layout.py gives each axis its own target extent and splits whichever
  # one most exceeds *its own* target, so blocks converge on the configured
  # aspect instead of on a square. See that module for why it is applied by
  # patching rather than by a parameter.
  # MEASURED TARGET (tools/osm_measurements.md, Midtown Manhattan 450 m):
  #     block short side  79.7 m   (IQR 79.1-80.2, remarkably tight)
  #     block long side  273.9 m   (IQR 154-310)
  #     long:short         2.3x    (IQR 1.7-3.5)
  #     blocks / km2        35
  # The built-in BSP produces 38 x 50 m at 1.2x and 350 blocks/km2 — three
  # times too dense, and square where the real thing is 2.3x elongated.
  #
  # Measured sweep of this generator (median short x long, ratio, count):
  #
  #    region   built-in            anisotropic          with the targets below
  #     400 m   38x50  1.2x  n=56   88x186  2.1x  n=8    51x 98  2.0x  n=17
  #     800 m   39x52  1.3x  n=207  109x189 1.9x  n=26
  #    1200 m   36x50  1.2x  n=499   92x279 3.0x  n=48   <- matches Manhattan
  #
  # Real block sizes cost block count: a 274 m block does not fit twice into a
  # 400 m region, so Manhattan targets here leave only 8 superblocks. The
  # targets below keep 17 blocks at ~51 x 98 m and 2.0x — the ratio is right
  # (measured 2.3x), the absolute size is scaled down to fit. Region held equal
  # to none.yaml so the A/B stays like-for-like.
  #
  # FOR A FULL-SCALE CITY: region_m [1200, 1200] with [70, 95] / [170, 260],
  # which lands at 92 x 279 m and 3.0x — within a few metres of the measured
  # Manhattan block.
  layout:
    # Inherited max_block_m 70 is BELOW every measured block short side
    # (60-116 m) and silently caps the per-typology targets below.
    # 340, not 200. The `highrise` typology below targets a 235-320 m long
    # axis because SM_Building_31 is 60.3 x 142.2 m in plan and no smaller
    # block holds it. A cap under the target silently clamps it and the
    # district comes out unable to place the very buildings it exists for.
    max_block_m: 340
    anisotropic:
      # Per-cell jitter on the LONG-axis block target. Without it the first
      # split cuts the plate into strips and every block in a strip inherits
      # that strip's long side -- measured at 1 km, eight consecutive 245 m
      # blocks then six at 235 m, with the whole plate landing on just
      # 245/235/229/98. 0.0 reproduces the original targets exactly.
      target_jitter: 0.22
      enabled: true
      long_axis: x            # blocks run long east-west, as Manhattan's do
      # FALLBACK ONLY while districts.enabled is true: city_layout's `targets`
      # delegates to districts.zone_field(...).targets_at(x, y), so the
      # per-typology block_short_m/block_long_m below are what actually size a
      # block, blended across area boundaries. These apply where that returns
      # nothing — zoning off, or a cell outside every ring.
      #
      # Kept in the same range as the typology targets so switching zoning off
      # does not silently collapse the grain: at the previous [36,46] the short
      # axis was under every tower footprint in the library (BG_Building_A
      # 51.3 x 51.3, C 50.1 x 40.1, E 60.5 x 36.5, F 80.9 x 50.4, MBuilding02
      # 91.1 x 96.1), so nothing tall could be placed at all.
      # RESIZED FOR THIS STOCK. Inherited [70,105] sits mostly ABOVE the
      # terrace band `[2*depth + alley, 2*depth + alley_max]` that
      # `_terrace_strips` will accept, so 8 of 8 rowhouse blocks were refused
      # and rebuilt as mid-rise — which is also where the three-rows-per-block
      # came from, since `pack` has no row limit. The GreatAmericanCity terrace
      # pool is up to ~29 m deep, putting the band near [61, 66].
      # The terrace band is `[2*depth + alley_m, 2*depth + alley_max_m]`, and
      # `_terrace_rows` takes the pool's DEEPEST member: 31.5 m here, with
      # alley 2..26, so the band is [65, 89]. Blocks have to be generated
      # INSIDE that band or every terrace is refused and rebuilt as pack —
      # which is where both complaints came from, the three-rows-per-block
      # (pack has no row limit) and half the wrong facings (pack does not
      # orient to the street; terrace does, by construction).
      block_short_m: [66, 80]    # street-to-street, the dense axis
      block_long_m: [190, 260]   # avenue-to-avenue, the sparse axis
      # Road width follows the axis. MEASURED (Manhattan, share of segments by
      # class and median lane count):
      #     secondary     53.9%   4 lanes
      #     residential   34.2%   1 lane
      #     primary       10.5%   5 lanes
      # so ~64% of segments carry 4+ lanes. The built-in subdivision gives every
      # road the same width regardless of axis, which is the second thing that
      # makes its grid read as generated. Splitting the long axis is what
      # creates an avenue, so the main-road promotion goes there.
      #
      # These are below the measured 64% on purpose: Manhattan is an outlier
      # (one-way pairs inflate its multi-lane share) and at this region size
      # every extra wide road eats block area. Raise main_road_chance_short
      # toward 0.3 for a more Manhattan-like arterial density.
      main_road_chance_long: 0.80
      main_road_chance_short: 0.05
      stop_chance: 0.85       # 1 - chance of an extra split once in range
      # Kerb strip reserved either side of every interior carriageway. Reserved
      # whatever the policy: the rect has to stay symmetric because
      # apply_ground_planes draws the yellow centre line at the rect centre, so
      # an asymmetric rect would paint it inside a parking lane. The strips a
      # corridor's policy does not use are handed to the abutting blocks as kerb
      # extensions, which is what steps the kerb line in and out instead of
      # running it dead straight. 0.0 disables the whole feature.
      parking_lane_m: 2.4
      # Parking policy is drawn once per corridor and held for its whole length —
      # a street does not switch from both-sides to none halfway along. one_side
      # resolves to the lo or hi kerb. Used when zoning is off or a ring below
      # omits its own.
      parking_policy: {none: 0.15, one_side: 0.35, both: 0.50}

      # ---- ROAD WIDTH BY THE DISTRICTS A ROAD SEPARATES ----------------------
      # (user, 2026-08-29, looking at the built city): "The Skyscraper
      # districts have to be surrounded by the widest roads that we do ...
      # With the smaller roads it looks odd next to skyscrapers, they're too
      # close to other blocks", and "all roads that surround high rises and
      # high rise <-> mid rise and mid rise <-> mid rise need to widen."
      #
      # The `zones` block below keys road width off the concentric RING, which
      # is not the same thing as the typology: zoning grows irregular areas
      # from nuclei, so a ring says roughly how far from the centre a road is
      # and nothing about what stands either side of it. These rules read the
      # typology on BOTH flanks (median over five samples along the run, the
      # same discipline `zone_of` uses, because a corridor crossing several
      # districts must take what it is MOSTLY between).
      #
      # Matched MOST-SPECIFIC FIRST: two literal names beat one, which beats
      # ["*","*"]; ties keep list order. A pair no rule matches falls through
      # to the ring behaviour below, unchanged.
      #
      # NO PARKING beside a tower, per the request. Bike lanes need no rule
      # here — `road_markings.plan_bike_lanes` already draws them on any
      # corridor of 4+ lanes, so widening alone took eligible corridors from
      # 4 to 11 and drawn lanes from 4 to 14 with no change to that module.
      typology_roads:
        enabled: true
        rules:
          - {between: [highrise, "*"],           lanes: 6, parking: none}
          - {between: [tower, midrise],          lanes: 4, parking: one_side}
          - {between: [tower, brick_midrise],    lanes: 4, parking: one_side}
          - {between: [midrise, midrise],        lanes: 4, parking: one_side}
          - {between: [midrise, brick_midrise],  lanes: 4, parking: one_side}

      # ---- road hierarchy per district ring ----------------------------------
      # Keys must match districts.rings names. Anything omitted falls back to the
      # un-zoned value above. A corridor takes the median ring over five samples
      # along its run: a single midpoint sample makes every full-length road a
      # core road and the outer ring never appears.
      # KEYS MUST MATCH `districts.rings` NAMES. `inner` and `outer` were added
      # with the five-ring gradient; a ring with no entry here silently falls
      # back to the un-zoned values above, which is a road hierarchy that does
      # not match its own district.
      zones:
        core:
          main_road_chance_long: 0.95
          main_road_chance_short: 0.50
          lanes_main: 4
          lanes_secondary: 2
          # Downtown gives its kerb to loading and bus stops, not to parking.
          parking_policy: {none: 0.45, one_side: 0.35, both: 0.20}
        inner:
          main_road_chance_long: 0.90
          main_road_chance_short: 0.40
          lanes_main: 4
          lanes_secondary: 2
          parking_policy: {none: 0.30, one_side: 0.40, both: 0.30}
        mid:
          main_road_chance_long: 0.85
          main_road_chance_short: 0.30
          lanes_main: 4
          lanes_secondary: 2
          parking_policy: {none: 0.15, one_side: 0.35, both: 0.50}
        outer:
          main_road_chance_long: 0.60
          main_road_chance_short: 0.15
          lanes_main: 4
          lanes_secondary: 2
          parking_policy: {none: 0.10, one_side: 0.30, both: 0.60}
        edge:
          # Residential: narrow streets, avenues rare, parking on both kerbs.
          main_road_chance_long: 0.40
          main_road_chance_short: 0.05
          lanes_main: 2
          lanes_secondary: 2
          parking_policy: {none: 0.05, one_side: 0.25, both: 0.70}
          # Mews width for an even k-way cut. This is the ONE number that sizes
          # a terrace block, because the strip is fixed and the arithmetic is
          # 4*block + 3*mews = 212 m. It leaves 27.2 m to divide between three
          # streets and four alleys: at 6.0 the blocks come out 48.5 m, which a
          # terrace pair fills with a 2.3 m alley behind. Raising it takes width
          # straight out of the alley, and past ~8 the pair no longer fits and
          # every row-house block is refused.
          even_split_road_m: 6.0
        # The four streets bounding a park superblock. Not excluded from the
        # hierarchy — a real park is usually bounded by at least one significant
        # street (Central Park has 5th Ave and CPW) — but never promoted to an
        # avenue, and parking is generous because people drive to parks.
        park_edge:
          main_road_chance_long: 0.0
          main_road_chance_short: 0.0
          lanes_main: 2
          lanes_secondary: 2
          parking_policy: {none: 0.05, one_side: 0.25, both: 0.70}

      # PARK SUPERBLOCKS. Carved out of the region BEFORE subdivision and
      # emitted as one leaf, so a park is one place with streets on its sides
      # and no road through it. Leaving parks to `packing.park_block_chance`
      # gives BSP leaves, and two that land side by side read as one design
      # mirrored about the street between them — which is exactly what they
      # looked like. Size is a multiple of the LOCAL block target, so a park
      # stays proportionate to its neighbourhood's grain.
      parks:
        enabled: true
        count: [2, 3]
        block_scale: [1.2, 1.8]   # x the local block target, per axis.
                                  # MEASURED green land is 3.5-11.3% of a
                                  # real district; [2,3] x [1.4,2.2] implied 21%
        margin_m: 50.0            # keep off the region edge
        min_separation_m: 110.0

  # ---- packing ---------------------------------------------------------------
  # build_city makes NO parks of its own: they are reserved as superblocks in
  # layout.anisotropic.parks above, before subdivision. Its own park pass picks
  # BSP leaves, which is how two park blocks ended up adjacent and read as one
  # mirrored design. Leaving min_parks non-zero would put them straight back.
  packing:
    # 6.0, not the inherited 2.5. Guillotine packing fills from one corner, so a
    # tight gap crams the buildings into part of the block and leaves the rest
    # as one wide unbuilt margin — which from the street reads as an enormous
    # sidewalk. It is not sidewalk, it is the block's own leftover. A bigger gap
    # spreads the same buildings across the whole block, putting the slack
    # BETWEEN them instead of all of it at the edge.
    building_gap_m: 6.0
    park_block_chance: 0.0
    min_parks: 0
    max_parks: 0

  # ---- hand the frontage over to city_detail.py ------------------------------
  # A spacing of 0 is already how the generator switches a street-furniture
  # category off (see _frontage_positions), so this needs no code change and
  # leaves exactly one owner of sidewalk props. Traffic lights, pedestrians,
  # cars and the park passes stay with build_city — they are not frontage props
  # and do not compete for the same space.
  streetlights:   {spacing_m: 0.0}
  benches:        {spacing_m: 0.0}
  trash_cans:     {spacing_m: 0.0}
  fire_hydrants:  {spacing_m: 0.0}
  bus_stops:      {spacing_m: 0.0}
  planters:       {tree_spacing_m: 0.0, plant_spacing_m: 0.0}

  # Junction control moves to city_detail with the rest of the frontage. The
  # built-in pass places ONE head per junction on a random corner, yawed at the
  # junction centre — so a corner-mounted mast arm points diagonally, one
  # approach gets a signal and the other three get nothing, and a junction can
  # end up with a signal and a stop sign at once. MUTCD 4D.13 wants two faces
  # per APPROACH, which is one two-head assembly on each.
  traffic_lights:
    intersection_chance: 0.0

  # ---- sidewalk zones + the categories that live in them ---------------------
  city_detail:
    # NACTO sidewalk section, metres, measured from the kerb inward. The through
    # zone is deliberately left empty — 1.8 m is the 6 ft desired minimum, and
    # keeping it clear is both the realism tell and what makes the sidewalk
    # walkable for a ground robot.
    #
    # THESE MUST SUM TO THE PAVED RING WIDTH, which is not a config value: the
    # ring is exactly ONE sidewalk tile wide and `build_city` takes that width as
    # max(tile.sx, tile.sy). SM_GroundModule01 is authored 5.00 x 5.00 m, so
    # every sidewalk in the city was 5 m wide whatever these said — a downtown
    # avenue section applied to every residential street. The tile is scaled to
    # 0.70 in the asset set to give a 3.5 m ring, and the zones below sum to
    # match; changing one without the other puts props on grass or leaves a
    # metre of unused paving.
    zones:
      curb_m:       0.15
      furnishing_m: 1.35
      through_m:    1.80
      frontage_m:   0.20
      interior_m:   5.00   # kerb to the service ring, behind the frontage

    # Occupancy is now a FOOTPRINT reservation, not a point grid — a point grid
    # gave a 6 m bench the same single cell as a bollard, which is why props
    # overlapped. This is only the bucket size for that reservation.
    occupancy_cell_m: 4.0
    occupancy_pad_m:  0.1        # gap held between neighbouring footprints
    curb_margin_m:    0.3        # gap between a footprint and the kerb line
    canopy_footprint_frac: 0.25  # share of a tree's crown its trunk/pit occupies
    jitter_frac: 0.12       # slide along the kerb so rows don't look stamped

    # A refused prop gets two more searches before it is dropped: another row
    # inside its OWN zone (never the through zone), then a slide along the kerb.
    # Measured, the frontage ring is only 41% occupied and removing every
    # clearance changes the placed total by 8 props — so rejections were a phase
    # problem, several categories landing on the same metre while the metres
    # either side stayed empty, not a capacity problem. Sliding recovers +19%.
    slide_m: 3.0
    lateral_tries: 3
    pole_clearance_m: 1.0   # pole-to-pole working clearance

    # Junction control. One two-head mast assembly per approach meets MUTCD
    # 4D.13's two-faces-per-approach minimum; masts go on the arterial
    # approaches and poles on the minor ones at the same junction. The arm
    # direction is derived from the measured bbox centroid, not from a
    # yaw-offset, so swapping the asset cannot silently rotate every signal.
    signals:
      mast_usds: traffic_lights_mast
      pole_usds: traffic_lights_pole
      signal_lanes: 4       # a leg this wide warrants a signal
      # Pole set at the kerb, not back in the furnishing zone. A mast arm has to
      # reach out over the lanes it governs, so every metre the pole sits back
      # is a metre the heads do not reach.
      corner_margin_m: 0.5
      # Explicit override of the derived stop-line setback. Derived it is
      # setback + crosswalk_depth + stop_bar_advance = 4.80 m back from the
      # junction box; 0.30 pulls the pole 4.5 m closer to the crossing.
      stopline_setback_m: 0.30
      # Empirical trim on top of the derived arm direction, SIGNED by which side
      # of the approach the pole stands on — so the two sides of a street get
      # opposite quarter turns and the arm reaches across the road on both.
      #
      # 0 removes the trim, leaving the direction _mast_yaw derives from the
      # asset's own bbox. The corner moved from far-side to near-side when the
      # signals were repositioned to the stop line, and the trim that suited the
      # far corner is a quarter turn out on the near one.
      #
      # THE FOUR VALUES ARE ALL A QUARTER TURN APART: 0, 90, -90, 180. If the
      # heads now face along the street instead of across it, the arm needs a
      # quarter turn — try 90 or -90. If they face across but point away from
      # the traffic they govern, it is a half turn — 180.
      yaw_offset_deg: 0.0
      stop_zones: []        # rings downgraded to two-way stop, e.g. [edge]

    # Stop-sign approach sight triangles. AASHTO Green Book SSD
    # 0.278*V*t + 0.039*V^2/a with t=2.5 s, a=3.4 m/s^2: 40 km/h -> 46 m. The
    # test is vertical as well as lateral — the sightline runs from the driver's
    # eye UP to the panel, so a 1.2 m bin never occludes a sign and a tree
    # always does, which is what keeps the keep-out to ~10-15 m of kerb.
    sightlines:
      design_speed_kph: 40.0
      eye_height_m:     1.08   # AASHTO driver eye
      sign_face_z_m:    2.1    # MUTCD 2A.18 urban mounting height
      min_obstruction_m: 1.0

    # ---- PLAZAS: composed open ground between the towers --------------------
    # (user, 2026-08-29): "In large empty sidewalk areas you can place cafe
    # tables and benches, fountain, some sort of attraction, etc ... arrangement
    # has to look nice not just a different ones put together, need some sort of
    # pattern" — and, on scope: "only in the skyscraper districts".
    #
    # That is where the ground actually is: `highrise` runs `perimeter_depth_m:
    # 0` with a 30 m `building_gap_m`, so a block holds two to four towers with
    # large paved gaps between them, and those gaps read as bare concrete.
    #
    # ONE ARRANGEMENT FAMILY, varied by fit — a centrepiece on the gap's
    # centroid, a bench ring around it at even pitch facing inward, a cafe row
    # against whichever tower wall actually borders the gap, and a planter line
    # on the plaza's own edge. Radius, centrepiece and rotation vary; the
    # pattern does not. Scattering was rejected once already on the roofs
    # ("the AC units seem random instead of structured").
    plazas:
      enabled: true
      typologies: [highrise]
      min_side_m:    15.0
      min_area_m2:   280.0
      max_per_block: 2
      podium_margin_m: 1.5
      edge_margin_m:   2.5
      max_radius_m:   13.0
      min_radius_m:    5.0
      fountain_chance: 0.65
      ring_gap_m:      2.2
      bench_spacing_m: 6.5
      trash_cans_per_plaza: 2
      streetlights_per_plaza: 4
      planter_spacing_m: 5.0
      planter_inset_m:   1.2
      cafe_setback_m:    3.0
      cafe_spacing_m:    4.5
      cafe_min_run_m:    8.0
      cluster_radius_frac: 0.35
    categories:
      # UNITS. spacing_m is metres of BLOCK FRONTAGE RING per prop, and the
      # ring runs along one kerb. A street has two kerbs, belonging to two
      # different blocks, each walked at spacing_m — so the spacing a person
      # standing in the street actually sees is HALF of the number here:
      #
      #     along-street spacing = spacing_m / 2
      #     count = total frontage / spacing_m   (measured: 13,921 m effective,
      #             i.e. a 15,818 m ring thinned by districts.furniture_scale)
      #
      # Every published figure below is an ALONG-STREET spacing, so each one is
      # doubled to land here. Getting this backwards is what made the street
      # furniture read as twice as dense as the standards it was copied from.
      #
      # Sources are tagged CODE (binding text), STANDARD (consensus document)
      # or PRACTICE (documented agency practice, no legal force). Most street
      # furniture is governed by NONE of the three — where that is so it is
      # said plainly rather than dressed up as compliance.
      #
      # OSM was measured for all of these (tools/osm_measurements.md) and is
      # cited below only where it is worth citing. It under-reports street
      # furniture badly: Midtown Manhattan returns 34 fire hydrants per
      # 1.96 km2 against NYCDEP's own 109,725-hydrant dataset, about an 8x
      # under-count, and the two best-mapped cities disagree with each other by
      # 3-4x on the same category. It is a lower bound, not a measurement.
      #
      # guard_chance was 0.45, which put 173 tree guards in the scene at
      # ~380k points each — 65.8M points, 73.8% of the whole thing, and an
      # OOM kill. A guard REPLACES a bare tree rather than adding to one, so
      # that bought no extra content: the same tree, 5x the cost, plus a small
      # metal ring. 0.10 keeps the detail visible at ~4M points.
      # 8 m is the real planting pitch and it produced 317 trees — a canopy
      # closed over the whole street and 37.8% of the scene's geometry.
      # 18 m is a KNOWING DEVIATION from the standard, not compliance with it:
      # the 20-30 ft planting pitch is 6.1-9.1 m, so this is roughly double the
      # loosest spacing any guideline endorses, traded for the point budget.
      # It also happens to be where the rejections stop: below ~18 m the leftover
      # slots are all inside the 5 m tree-to-streetlight/utility-pole clearance,
      # so they are slots a tree may not legally take anyway.
      # curb_margin_m 0.9 against the 0.3 default: codes measure the setback to
      # the TRUNK — Seattle 3'6" centreline-to-kerb, Sedro-Woolley 3 ft back of
      # kerb for a medium tree — and pulls the trunk clear of the gutter so the
      # canopy overhangs the carriageway instead of standing over it.
      # HELD at 18.0. This is the one category here that IS codified as a
      # density and the code wants it DENSER, not sparser: Portland PCC
      # 11.50.060 and NYC ZR 26-41 both require one street tree per 25 ft
      # (7.62 m) of frontage, so 18 m is already 2.4x short of code. Loosening
      # the streetlight pitch below frees kerb that the 5 m tree-to-light
      # clearance was denying, so the count rises on its own — toward the code
      # figure, not away: 583 trees at a 24 m light pitch, 704 at 50 m.
      # SPACING CARRIES THE BUDGET HERE, because the pool has no cheap option
      # left. Every Nucleus tree (385-9,430 pts) has been rejected by name, so
      # street trees are AEC vegetation at ~53,000 points each — 20-140x dearer.
      # At the old 18 m that is 631 trees and 33.6M points, which took the scene
      # to ~85M against the 89.1M that OOM-killed it. 30 m gives ~376 trees and
      # ~20M, leaving roughly 17M of headroom.
      #
      # This is well above the 6-9 m planting standard and above the 18 m that
      # was already a knowing deviation. It buys three species instead of one
      # and geometry that renders correctly; the honest cost is a visibly
      # sparser street. One cheap bound 8-12 m tree would undo the whole trade.
      # CROWN SIZED TO THE ROAD IT STANDS ON (user, 2026-08-29): the 11.4 m
      # Shumard_Oak "is too big to be used on the narrower roads, esp
      # brownstones. It looks good on bigger roads and in the park."
      # max_crown_m = carriageway_width * carriage_frac + sidewalk_depth, so a
      # crown may reach about six-tenths of the way over the carriageway and
      # never the far side. With this preset's 3.3 m lanes and 3.50 m sidewalk
      # that is 7.5 m on a 2-lane residential street against the oak's measured
      # 10.5 m crown, and 11.4 m on a 4-lane avenue. Row-house frontage went
      # from 51.7% oak to 7.8%, with the total street-tree count unchanged
      # (553 -> 554) — the filter re-species a slot, it never drops one.
      street_trees:   {zone: furnishing, spacing_m:  22.0, guard_chance: 0.10,
                       curb_margin_m: 0.9,
                       crown_by_road: {enabled: true, carriage_frac: 0.6,
                                       min_crown_m: 0.0}}
      # NO NATIONAL CODE for street lighting spacing. ANSI/IES RP-8 is a
      # STANDARD and sets illuminance and uniformity, not a pitch; a minority of
      # municipalities codify a maximum outright. CODE, Larimer County Urban
      # Area Street Standards Table 15-3 (Fort Collins, reenacted 2021), maximum
      # spacing PER SIDE: 4/6-lane arterial 150 ft (45.7 m), 2-lane arterial
      # 180 ft (54.9 m), local-commercial 175 ft (53.3 m). Note 3 puts lights on
      # each side of a 6-lane arterial rather than staggering them, which is the
      # both-kerb arrangement this ring produces, so those figures map straight
      # onto spacing_m. Cross-check, Iowa SUDAS 11B-1: practical spacing does
      # not exceed 5-6 mounting heights, and a 9 m urban pole gives 45-55 m.
      # 50 m sits inside every one of those bands.
      # OSM is no use here — Manhattan 111 street lamps and Chicago 158 per
      # 1.96 km2 is an order of magnitude short of reality; lamps are simply not
      # mapped.
      # 80 is a DELIBERATE OVERSHOOT of that band, not a reading of it. Care is
      # needed here: Table 15-3 is written per side and spacing_m is per side,
      # so 50 sat inside the 45.7-53.3 m band rather than under it — the 25 m
      # figure it also produces is the combined both-kerb pitch, which is not
      # what the table specifies and must not be compared against it.
      # Two things justify going past the codified maximum anyway:
      #   - this ring lights BOTH kerbs of every street unconditionally, while a
      #     real local or collector street is commonly lit from one side only,
      #     so matching a one-side-lit street's total fixture count wants about
      #     twice the per-side pitch;
      #   - headroom. At 8,628 points a fixture this is the second dearest
      #     category on the ring, and the street_trees pool above now costs
      #     ~53,000 points a tree, which spends the budget this used to have.
      # So this is a knowing deviation traded for the point budget, in the same
      # spirit as street_trees, and it should be called that rather than dressed
      # up as compliance. 50.0 is the code-compliant value if budget allows.
      streetlights:   {zone: furnishing, spacing_m:  80.0}
      # NO CODE governs litter bin provision anywhere checked. The UK Code of
      # Practice on Litter and Refuse (statutory, EPA 1990 s.89(7)) regulates
      # cleanliness grades and never bin density. PRACTICE, NYC DSNY: ~23,000
      # baskets, sited at COMMERCIAL STREET CORNERS on collection routes, not on
      # an interval. 130 m over this ring is ~107 bins against 108 block
      # corners, i.e. one per corner, which is the DSNY rule expressed as the
      # only knob this generator has.
      trash_cans:     {zone: furnishing, spacing_m: 130.0}
      # NO CODE mandates a bench, a seating count or a rest interval. PROWAG is
      # enforceable (US DOT adopted it as its ADA standards, Dec 2024) and is
      # silent on seating: it constrains the 1.22 m continuous clear width
      # (R302.2) and a 61 m passing-space interval (R302.3), which govern where
      # furniture may sit, not how often a bench appears. 140 m of frontage is
      # 70 m along the street, near both that 61 m passing-space interval — the
      # only codified longitudinal figure in the pedestrian ROW — and the 75 m
      # along-street figure measured in San Francisco, the best-provided of the
      # five cities sampled.
      # OSM frontage-equivalent spreads 7x across those five (SF 149 m,
      # Chicago 324 m, Portland 399 m, Barcelona 409 m, Manhattan 1029 m),
      # which is mapping effort rather than real variation, so the per-km2 axis
      # is the sounder one: this lands at ~155/km2 against a measured 34-236.
      benches:        {zone: furnishing, spacing_m: 140.0}
      # CODE, but not the rule it is usually quoted as. IFC Appendix C Table
      # C102.1 is keyed to FIRE FLOW, not land use, and sprinklers LOOSEN it by
      # 50% rather than tightening it: average spacing between hydrants runs
      # 500 ft (152.4 m) at <=1750 gpm down to 300 ft (91.4 m) at 4500-5000 gpm
      # and 200 ft (61.0 m) at >=7500 gpm. The appendix also binds only where a
      # jurisdiction adopts it; the always-binding rule is IFC 507.5.1, a 400 ft
      # (122 m) hose lay. The familiar "300 ft commercial, 400 ft sprinklered"
      # wording is a Southern California / Southern Nevada local amendment and
      # is not in the base code.
      # A commercial downtown sits in the high-fire-flow rows, so 300 ft
      # (91.4 m) BETWEEN HYDRANTS ALONG THE STREET governs, and the code's axis
      # is along the street, not per kerb — so 180 m of frontage, which puts a
      # hydrant every 90 m of street.
      # Two independent provision cross-checks agree: NYCDEP publishes 109,725
      # hydrants over 790 km2 = 139/km2, and OSM Portland — the only city of the
      # five whose hydrants are mapped anywhere near completely, at n=300 —
      # gives 153/km2. 180 m here lands at 121/km2, just under both, and stays
      # inside NYC Fire Code 507.5.1's 250 ft (76.2 m) trigger distance.
      fire_hydrants:  {zone: furnishing, spacing_m: 180.0}
      # NOT a street-spacing rule at all. Bicycle parking is CODE only as a
      # ZONING minimum per building — NYC ZR 25-80/36-70 ask for one enclosed
      # long-term space per 2 dwelling units and one short-term per 10 car
      # spaces — which yields per-building indoor spaces and implies nothing
      # about kerbside racks. No city checked codifies an on-street rack pitch.
      # So this is the one category set from OSM, which is defensible because
      # cyclists map bike parking comparatively well and the three cities agree
      # to within 2x where other categories spread 7x: frontage-equivalent
      # Chicago 267 m (312 racks), SF 432 m (160), Manhattan 500 m (138).
      # 200 m stays denser than all three, which is the right side to err on
      # given the under-report, and lands at 109 racks/km2 against a measured
      # 70-159/km2.
      bike_racks:     {zone: furnishing, spacing_m: 200.0}
      # NO CODE. A meter per parking space is ~6 m and that is what a legacy
      # metered kerb looks like, but the unit modern cities meter is the BLOCK
      # FACE: NYC codifies exactly that (34 RCNY 4-08(h)(4) — parking time is
      # valid only on the blockface it was bought on). PRACTICE, NYC DOT
      # single-space-to-kiosk conversions: 351 meters -> 62 kiosks (5.7:1) and
      # 230 -> 21 (11:1); the NYC Street Design Manual sites a kiosk within
      # 6 car lengths of any covered space, so one serves ~240 ft (73 m) of
      # blockface. 75 m is that figure.
      # Still an over-count in one respect this ring cannot express: meters are
      # walked along every frontage, including the 45% of core corridors whose
      # parking_policy is `none` and which would carry no meter at all.
      parking_meters: {zone: furnishing, spacing_m:  75.0}
      utility_poles:  {zone: furnishing, spacing_m:  38.0}
      signs_parking:  {zone: furnishing, spacing_m:  25.0}
      mailboxes:      {zone: furnishing, spacing_m: 120.0}
      bus_stops:      {zone: furnishing, spacing_m: 130.0}
      # Regulatory signage. near_corner_m anchors these AT block corners rather
      # than filtering a spaced walk — spacing_m is then unused for them. The
      # two types get different offsets so they occupy different posts around
      # the same junction instead of fighting for one cell; they all alias to
      # the "sign" category and share the furnishing-zone occupancy grid.
      signs_street_name: {zone: furnishing, spacing_m: 0.0, near_corner_m:  4.0}
      # control: stop restricts these to junctions the control table signs, so a
      # junction never gets a signal and a stop sign at once. sightline reserves
      # the approach sight triangle against anything tall enough to occlude.
      signs_stop:        {zone: furnishing, spacing_m: 0.0, near_corner_m:  8.0,
                          control: stop, sightline: true}
      phone_booths:   {zone: frontage,   spacing_m: 180.0}
      # Roadworks: one cluster every ~250 m of frontage. Enough that the city
      # looks lived-in, sparse enough that it does not read as a building site.
      traffic_cones:  {zone: curb,       spacing_m: 250.0}
      # Service access. The `interior` zone is the strip behind the frontage,
      # off the pavement entirely — a real street keeps dumpsters there, and on
      # the frontage ring they read as litter bins the size of a car.
      dumpsters:      {zone: interior,   spacing_m: 150.0}
      # 1.5 m is the real bollard pitch, but applied along every frontage metre
      # it yields ~3,300 of them and reads as fencing. Corner-anchored instead,
      # which is where a street actually puts them — at crossings and plaza
      # mouths. spacing_m is unused once near_corner_m is set.
      bollards:       {zone: frontage,   spacing_m:   0.0, near_corner_m: 6.0}
      # Café seating is a frontage-zone treat, not a default: only a minority of
      # ground floors are cafés, so this is deliberately far sparser than the
      # kerb categories.
      # 60,806 pts each; at 120 m it placed 110 of them = 6.7M points,
      # 10.3% of the scene, for a prop only a minority of frontages have.
      cafe_sets:      {zone: frontage,   spacing_m: 400.0}

    # Props on the carriageway, walked along the road corridors instead of the
    # block frontage. Manholes ride the crown of the road; drains hug the kerb,
    # which is where drainage actually is. surface_z clears the lane markings
    # at 0.02 so the covers do not z-fight with them.
    road_surface:
      # Above the lane dashes at z=0.02 and the crosswalk bars at 0.021. At the
      # previous 0.005 a cap sat 5 mm over the asphalt, under every marking and
      # inside z-fighting range of the road mesh — placed, counted, invisible.
      # A real cover is flush; this is 5 mm of deliberate proudness so it reads.
      surface_z: 0.026
      # Cars parked AT THE KERB, in the strips the per-corridor policy parks
      # on — build_city's own car pass only fills travel lanes, so nothing was
      # ever parked. Walks the same strips road_markings paints bays on, so
      # paint and metal agree. 6.5 m is a car plus the gap to the next one;
      # density 0.35 leaves the kerb sparse rather than bumper to bumper.
      # junction_clear_m matches roads.markings.no_parking_m — no jurisdiction
      # lets you park across a crossing.
      parked_cars:  {spacing_m: 6.5, density: 0.35, junction_clear_m: 7.5}
      manholes:     {spacing_m: 55.0, lateral: centre}
      # kerb_margin_m is measured from the corridor RECT, which is now the
      # maximum extent including both reserved parking strips. At 0.6 m a drain
      # lands on the grass bulb wherever a block took its strip; parking_lane_m
      # + 0.6 keeps it on asphalt everywhere, at the cost of sitting just inside
      # the carriage edge on parking stretches.
      storm_drains: {spacing_m: 40.0, lateral: kerb, kerb_margin_m: 3.0}
      # Bike-lane delineators take no spacing_m: the stations come from
      # `road_markings.plan_bike_lanes`, the same call that paints the lane, so
      # the two cannot disagree about which stretches are protected. Spacing is
      # under roads.markings.bike_lanes. surface_z is 0 rather than the value
      # above because a 1 m post stands ON the carriageway; the proud offset
      # exists for flush covers that would otherwise z-fight the road.
      bike_lane_delineators: {enabled: true, surface_z: 0.0}

    # Minimum metres between categories, applied as keep-outs. Without these the
    # result reads as random scatter rather than a designed street.
    #
    # Trees keep 10 ft from hydrants, which is the planting standard as written.
    # The tree-to-light figure is a deliberate relaxation: the standard says
    # 25 ft (7.6 m) to stop a canopy occluding the lamp, but applying it
    # literally against any realistic light spacing leaves no room to plant at
    # all. Real streets instead alternate — light, tree, tree, light — which is
    # what 5 m plus the spacings above produces.
    clearances:
      street_trees:  {fire_hydrants: 3.0, streetlights: 5.0, utility_poles: 5.0}
      fire_hydrants: {streetlights: 1.8, utility_poles: 1.8}
      # The signal assembly carries its own luminaire on the same pole, so a
      # streetlight beside it puts two lights on one corner. 18 m clears the
      # whole junction approach rather than just the pole itself.
      #
      # streetlights AGAINST THEMSELVES is the corner case: the frontage walk
      # runs each block face, and at a corner the two faces meeting there each
      # reach a spacing point within a couple of metres of the same kerb return,
      # so the corner gets two lamps — one nominally lighting each street. A
      # real corner is lit once. Self-clearance is honoured because `_clear_of`
      # tests `placed[other]`, which for other == name is what the category has
      # already laid; the ordering pass sees the self-edge as a cycle and falls
      # through, which affects order only, not the test. 20 m is under the 40 m
      # of street the 80 m per-kerb spacing implies, so it only ever removes a
      # genuine corner duplicate.
      streetlights:  {traffic_lights: 18.0, streetlights: 20.0}

  # ---- prune sub-prims out of placed assets ----------------------------------
  # For assets that are wanted apart from one part of themselves. Deactivated
  # rather than removed: the prim lives in a referenced layer, so a session-layer
  # RemovePrim would not take.
  # ---- force roughness on over-glossy library materials -----------------------
  # Authored once per MATERIAL, not per prim: the material lives in a referenced
  # layer and every instance shares it. The DowntownWest walk tile is lit for an
  # archviz still and comes back looking like wet stone in a daylit park.
  # 1.0 is fully matte; drop toward 0.7 if it reads too flat.
  surface_overrides:
    - categories: [trail]
      roughness: 0.92
      metallic: 0.0

  prune_prims:
    - usd_contains: "599a74c1c8fd4f19bf6754b8128da6b8"
      # "Street Sign Final" — a street-name blade with a stop sign welded on,
      # so every street-name post also planted a stop sign.
      prims: ["pCube4", "pCube44"]

  # ---- road surface markings -------------------------------------------------
  roads:
    # NACTO Urban Street Design Guide, Lane Width: 10 ft travel lanes "provide
    # adequate safety in urban settings while discouraging speeding", and lanes
    # over 11 ft are not to be used — they read as highway and induce speed.
    # The inherited default is 3.5 m (11.5 ft), over that ceiling. 3.0 m also
    # gives ~2 m of carriageway back per 4-lane arterial, which is block area.
    #
    # The other two geometry figures were checked against the same guide and are
    # already right, so they are left alone:
    #   parking_lane_m 2.4 m = 7.9 ft   vs NACTO 7-9 ft          OK
    #   no_parking_m   7.5 m = 24.6 ft  vs NACTO 20-25 ft daylighting  OK
    # 3.3 m (10.8 ft) — the top of what NACTO allows before "lanes greater than
    # 11 ft should not be used" bites. 3.0 was the guide's preferred figure but
    # left the car assets tight in their lane.
    lane_width_m: 3.3

    # MUTCD broken lane line is a 10 ft segment against a 30 ft gap — a 1:3
    # ratio. The inherited default is 3.0/3.0, i.e. 1:1, which reads as a
    # dotted extension line (the marking used THROUGH a junction) rather than
    # an ordinary lane divider.
    lane_lines:
      dash_length_m: 3.0
      dash_gap_m:    9.0

    markings:
      crosswalks:     true
      stop_bars:      true
      parking_bays:   true
      # OFF by request — the diagonal closing a parking lane into a turn pocket
      # reads wrong on approach. Worth recording that I never found a clause for
      # this device: a lane-drop taper is real in MUTCD terms, but this specific
      # composition was never verified against one. Re-enable only with a
      # citation.
      turn_lane_flares: false
      # OFF by request. This is the daylighting hatch at junction approaches —
      # the remaining source of diagonal lines now that turn_lane_flares is off.
      # MUTCD 11th ed. §3B.25 p07/p09 does scope it (white, in a no-parking
      # zone), so unlike the flare it IS a real device; it is off because it
      # reads wrong here, not because it was invented. The bays still hold back
      # from junctions and hydrants — the prohibition is enforced, just unpainted.
      no_parking_hatch: false
      # MARKING HEIGHTS. Two planes, because `apply_ground_planes` is tracked
      # and hardcodes its centre lines and lane dashes at z=0.020.
      #
      # z_high is for the markings that genuinely cross one of those and have
      # to win: the crosswalk band, the asphalt mask that hides the centre line
      # inside it, the stop bar, and the single bike lane line that lands on a
      # lane divider by design. It is clamped to at least 0.0205 in code — set
      # it below 0.020 and those markings silently disappear under paint this
      # module cannot edit.
      #
      # z_low is everything else: bay ticks, no-parking hatching, turn-lane
      # flares and the inside of a bike lane, all of which sit on bare asphalt.
      # At the old single 0.021 the paint visibly floated at close range; real
      # thermoplastic is 2-3 mm proud. 5 mm reads flush and still clears the
      # road mesh at z=0 by enough not to stipple.
      z_low_m:        0.005
      z_high_m:       0.021
      bar_width_m:    0.45   # ladder bar, along the direction of travel
      bar_gap_m:      0.45
      crosswalk_depth_m: 2.4 # kerb-to-kerb depth of the striped band
      stop_bar_width_m: 0.5
      setback_m:      1.2    # gap between the kerb line and the striped band
      # Clear gap from the crosswalk's near edge back to the stop bar. This was
      # hardcoded at 0.15 m, which put the bar hard against the crossing so the
      # two read as one thick smear. MUTCD 3B.16 minimum is 4 ft.
      stop_bar_advance_m: 1.2
      bay_tick_width_m: 0.12
      # Daylighting: no parking within this of a junction box — no jurisdiction
      # allows parking across a crossing, and that cleared length is exactly
      # what the approach borrows for a turn lane. Bays are held back by
      # max(no_parking_m, flare_m + flare_taper_m), but only no_parking_m is
      # painted: hatching the flare reserve too carpets every approach in yellow,
      # and that stretch is a running lane, not a prohibition.
      no_parking_m:   7.5
      # flare_m is measured from the junction BOX, but the pocket only starts
      # clear of the stop bar at ~5.6 m, so at 8.0 the straight pocket was 2.4 m
      # against a 5 m diagonal — a stub with a long slant hung off it, which is
      # what read as unnatural. 16 m gives ~10 m of pocket to 5 m of taper, so
      # the straight run dominates and it reads as a lane.
      flare_m:       16.0    # turn pocket length back from the junction box
      flare_taper_m:  5.0    # diagonal back out to the kerb
      flare_chance:   0.55   # not every approach flares
      lane_line_width_m: 0.15
      # Yellow diagonal hatching over a parking strip where parking is signed
      # out. Duller than the generator's pure-yellow centre line so the two do
      # not read as one smear. Raise the pitch to thin it: 1.6 m across a 2.4 m
      # strip gives ~1.1 m perpendicular spacing.
      hatch_pitch_m:  1.6
      hatch_width_m:  0.15
      # 15 ft either side of a hydrant. reach is how far off the kerb a hydrant
      # can stand and still be matched to it — the furnishing zone is ~1.05 m in.
      hydrant_clear_m: 4.6
      hydrant_reach_m: 4.0

      # ---- bus zones -------------------------------------------------------
      # Kerb reserved either side of a placed bus stop. Parking bays are kept
      # out of it (you cannot park in a bus zone) but it is deliberately NOT
      # hatched: a bus zone is a stopping place, signed and kerb-marked, and
      # diagonal hatching is not the device for that.
      #
      # TCRP Report 19 "Guidelines for the Location and Design of Bus Stops",
      # ch.3 p.24-25, Figure 3 "Typical Dimensions for On-Street Bus Stops":
      # far-side 90 ft, near-side 100 ft, mid-block 150 ft, for a 40 ft bus.
      # 27.4 m = 90 ft, the FAR-SIDE figure, because that is the stop type
      # transit practice prefers by default (CA MUTCD 2014 Rev 9 3B.23 para 21,
      # Standard: "Whenever practicable, bus stands shall be located on the far
      # side of the intersection"). Stops here are placed by frontage spacing
      # and are not classified near/far/mid-block, so one length has to serve;
      # this is the conservative middle of the three.
      # Figure 3 note 2 adds 50 ft per additional 40 ft bus berthing at once
      # and note 1 adds 20 ft for an articulated bus — neither is modelled, so
      # every stop here is single-berth.
      #
      # bus_reach_m is how far off the kerb a stop can stand and still be
      # matched to it — a shelter sits in the furnishing zone and is deeper
      # than a hydrant, hence 5.0 against the hydrant's 4.0.
      bus_zone_m:     27.4
      bus_reach_m:    5.0

      # ---- bike lanes ------------------------------------------------------
      # A road diet, not a widening: the rect is fixed and the blocks are built
      # against it, so the lane comes out of the carriageway. One lane_width_m
      # is taken off EACH kerb, which leaves the generator's yellow centre line
      # on the centre of what remains and puts the new lane's inner edge
      # exactly on the outermost white divider it already drew. See the BIKE
      # LANES section of road_markings.py.
      bike_lanes:
        enabled: true
        # Arterials only. Below 4 lanes there is nothing to give up — a 2-lane
        # street would be left with no travel lane at all on one side. Taking a
        # WHOLE lane also satisfies MUTCD 9E.02 para 07 (Standard), "a bicycle
        # lane shall not be marked within a general-purpose lane": this is a
        # road diet, not a stripe inside a live lane.
        min_lanes: 4
        # Rideable width, kerb side of the buffer. 2.0 m = 6.6 ft, inside
        # NACTO's 6.5-7 ft minimum rideable for a one-way protected lane
        # (Designing Protected Bike Lanes), over the 6 ft NACTO calls desirable
        # for a conventional lane at a kerb (Conventional Bike Lanes), and over
        # AASHTO 4th ed. 4.6.4 p.4-15, which sets 5 ft minimum against a kerb
        # measured to the CENTRE of the lane line.
        # The buffer is whatever lane_width_m leaves: 3.0 - 2.0 = 1.0 m
        # = 3.3 ft, over NACTO's >=3 ft for motor vehicle speeds above 25 mph
        # (>=2 ft otherwise), and over 3x the line width as MUTCD 9E.06 para 08
        # advises. Raising this eats the buffer, it does not widen the lane.
        # MUTCD itself specifies NO bike lane width — 1A.02 para 02 puts
        # geometry outside its scope — so every number here is AASHTO/NACTO.
        ride_width_m: 2.0
        # Share of eligible arterials that carry a lane, and share of the
        # protectable stretches on those that get posts rather than paint
        # alone. Both are taken as an exact count of a shuffled list, not as a
        # coin flip per candidate — a scene holds only a couple of dozen
        # arterials and at that sample size a flip misses its own mean badly
        # (0.60 measured 4 of 15). Protection is deliberately a minority: it is
        # what real networks look like, and every post is an instance.
        corridor_chance: 0.60
        protected_chance: 0.45
        protected_min_m: 30.0    # no 5 m stub of bollards
        # The BSP leaves one junction-to-junction stretch per corridor, so
        # protection is drawn per this length of it rather than per stretch —
        # otherwise a corridor is protected end to end or not at all and the
        # lane never changes character along its length.
        protected_seg_m: 55.0
        # MUTCD 9E.02 para 11 (Guidance) breaks the lane line on approaches
        # where turning vehicles cross through bicyclists, and Figure 9E-2
        # calls for "50 to 200 feet of dotted line" there (Figure 9E-3 sheet 3:
        # 50 ft MIN). 22 m = 72 ft sits in that band. Everything outside it is
        # the solid lane, and only the solid lane may carry posts.
        mix_zone_m: 22.0
        # MUTCD 3A.04 para 02.A: a NORMAL line is 4-6 in. Figures 9E-1 and
        # 9E-2 both mark a bike lane with a normal line, NOT a wide one, so
        # 0.15 m = 5.9 in is the top of the normal range — which is also the
        # bottom of NACTO's 6-8 in recommendation.
        line_width_m: 0.15
        # MUTCD calls these DOTTED, not dashed; the 10 ft/30 ft broken line is
        # a different device and is not used on bike lanes. Figure 9E-2 draws
        # the weave zone as "2-foot line, 6-foot space" = 0.6/1.8.
        # There is no through-junction pattern here: 9E.03 para 07 would allow
        # a dotted extension across the box, but nothing is painted inside a
        # junction at all — see the clear zone note above.
        dash_len_m: 0.6
        dash_gap_m: 1.8
        # Diagonal hatching inside the buffer. MUTCD 9E.06 para 14 (Standard)
        # makes it mandatory above a 3 ft buffer, and this one is 3.3 ft.
        # Para 12 (Guidance) wants strokes 10 ft apart or more, hence 4.0 m
        # = 13 ft — also cheap, since the buffer runs for kilometres and each
        # stroke is a quad. 0.10 m = 4 in matches NACTO's cross-hatch width,
        # and the stroke runs 1.0 m across in 1.0 m along, i.e. 45 degrees,
        # inside NACTO's 30-45. Direction is set in code: 9E.06 para 11
        # (Standard) slants the diagonals AWAY from the adjacent travel lane.
        # 0 = off, by request: every diagonal marking in the scene is off
        # together. This one IS mandated (9E.06 p14 Standard above a 3 ft
        # buffer), so it is a knowing deviation. Restore 4.0 to comply.
        buffer_hatch_pitch_m: 0.0
        buffer_hatch_width_m: 0.10
        # MUTCD 9E.01 para 03 (Guidance): first marking at the start of the
        # lane, further ones after major intersections, then "periodic
        # intervals along the bicycle lane based on engineering judgment".
        # There is NO federal number for the interval, so 60 m is judgment;
        # the after-every-junction part is not, and falls out of placing the
        # first symbol at the head of each solid stretch.
        #
        # KNOWN DEVIATION: 9E.01 para 02 (Standard) requires a bicycle SYMBOL
        # or BIKE LANE legend together with the lines. Only the arrow of para
        # 04 is drawn — the pictogram cannot be built from flat quads. It needs
        # a decal texture to be compliant.
        symbol_spacing_m: 60.0
        symbol_len_m: 1.8
        # Green conflict-area pavement. Cite MUTCD 3H.06, NOT Interim Approval
        # IA-14: IA-14 was terminated once the 11th edition absorbed it, and
        # its nighttime chromaticity rule was rescinded with it. Only 3H.06
        # para 02(C) is used — weave areas where motor vehicles cross
        # bicyclists. Para 02(B), extensions through an intersection, is NOT:
        # nothing is painted inside a junction box here at all. Para 04
        # (Standard) then requires the green to MATCH the dotted pattern of
        # the line it supplements, which is why it is drawn dotted in code
        # rather than as a continuous slab.
        green_conflict: true
        # Share of weave zones that actually get colour. Green marks a CONFLICT
        # POINT, not the general run of the lane, so most of the network is
        # plain white dashes with or without posts. Low on purpose, and an
        # exact count off a shuffled list of every weave zone in the scene, the
        # same as the two shares above.
        green_chance: 0.25
        # NACTO (Separating Protected Bike Lanes) puts flexible delineators
        # every 10-40 ft and "closer together ... on the approach and departure
        # of intersections". 3.0 m = 10 ft at either end of a protected
        # stretch, easing to 12.0 m = 39 ft in the middle over a 20 m taper —
        # which also stays under the <=40 ft that MUTCD 3I.02 para 02 implies
        # via 3B.14 para 07 (N = one segment plus one gap = 10+30 ft).
        # NACTO gives no NUMBER for the tightening, only the direction, so the
        # 3.0 m end is judgment inside its own band.
        # post_setback_m keeps the first post off the junction; 9E.17 para 08
        # additionally wants devices >=1 ft off the lane line, which the buffer
        # centreline satisfies at 0.5 m each side.
        post_spacing_near_m: 3.0
        post_spacing_far_m: 12.0
        post_taper_m: 20.0
        post_setback_m: 2.0

  # ---- districts -------------------------------------------------------------
  # NOT OSM-calibrated yet, and the one place where that matters most.
  # `building:levels` is exactly the tag that would set these height bands, but
  # the buildings query hit a ConnectionError after Overpass rate-limited an
  # earlier run (see tools/osm_measurements.md). Until it lands, bands are split
  # by measured USD height rather than by a real floor-count distribution.
  #
  # What DID measure: the Manhattan sample is 96% commercial landuse, i.e. a
  # dense core with no residential ring at all. A three-ring gradient is
  # therefore a generic-city assumption, not something Manhattan supports —
  # verify against a mixed-use sample before leaning on it.
  districts:
    # --- variance knobs, all OFF in the stock presets ---------------------
    # Each block packs from its OWN RNG, so two same-sized blocks in one
    # district stop coming out identically arranged (measured on gac seed 8:
    # midrise #46/#47/#48 were 235x74/235x74/235x73 m with 11 buildings each
    # in the same layout). See `districts._block_rng`.
    per_block_rng: true
    # The packer's area band widens until it offers at least this many
    # DISTINCT assets, so the four anti-repeat rules always have something to
    # choose between. See `districts._band_top`.
    pack_min_candidates: 4
    # Retry the hard repeat radius at R/2 before failing open, so a near-
    # touching twin is still excluded when the strict radius cannot be met.
    repeat_hard_ladder: true
    enabled: true
    min_region_m: 300      # below this the whole region stays one district
    # Radial gradient from the region centre, as fractions of the half-diagonal.
    # Core is the dense mid-rise centre; edge gets the cheap massing shells.
    # Height is SAMPLED from each ring's log-normal profile, then the nearest
    # fitting library asset wins — so the library quantises a smooth
    # distribution instead of being it, and adding one asset improves the whole
    # scene rather than adding one more discrete step. Cutting the library into
    # per-ring bands (the previous approach) is what made neighbours jump
    # between two extremes with nothing between: that is the "unnatural height
    # difference". Calibrated against NVIDIA's CityEngine demo city, 600
    # buildings: right-skewed, p90/p50 about 2x, a thin tail of towers.
    neighbour_weight: 0.5     # 0..1 — pull toward nearby placed heights so a
                              # street steps gradually rather than jumping
    neighbour_radius_m: 45.0
    pick_sigma: 0.30          # log-height tolerance when matching the library
    # Damps an asset's odds by (1 + times already placed) ^ this. Height match
    # alone concentrated the city: an asset is eligible whenever it FITS, so
    # small footprints won far more slots and two models took 66% of every
    # building. 0 restores pure height matching.
    repeat_penalty: 1.6
    # The last run reported repeat_radius_m=0, which disables the LOCAL repeat
    # penalty entirely — one model took 56.3% of 119 buildings. With a library
    # of fifteen that is the difference between seeing all of them and seeing
    # three. The radius is in metres and wants to be about a block.
    repeat_radius_m: 110.0
    repeat_local_penalty: 0.05
    # HARD EXCLUSION, on top of the graded penalty above. MEASURED on the
    # 800 m baseline: MBuilding05 stood 13 times with its nearest twin 26.9 m
    # away, and four whole tower blocks were the same model twice over — which
    # is the "buildings appear to be repeating too close to each other"
    # complaint exactly. A multiplier alone cannot guarantee a separation; this
    # removes a candidate outright when a copy of it stands inside the radius,
    # and falls back to the graded penalty only when that would leave the slot
    # with nothing to build.
    repeat_hard_radius_m: 45.0
    # LANDMARKS — the tall tail the height model cannot reach on its own.
    # MEASURED on the probe: of the eleven `highrise` assets, the four most
    # distinctive were never placed — SM_Building_16 (312 m), _31 (302 m),
    # _14 (193 m) and _18 (150 m) — while 134-140 m stock took every slot.
    # That is the feedback loop `_Skyline` documents: `neighbour_weight` blends
    # each draw halfway in log space toward the mean height ALREADY standing
    # nearby, so short neighbours beget shorter targets, and `pick_sigma` is a
    # Gaussian in log height so a 312 m model against a ~150 m target scores
    # near zero. Raising `height_median_m` lifts the WHOLE skyline instead of
    # giving it a tail, and raising `height_max_m` does nothing because the cap
    # was never the binding constraint.
    #
    # So a landmark is a BUDGET rather than a hoped-for tail event: this many
    # slots may ignore the height match and the packer's area band and take a
    # tall model outright. The threshold sits just under SM_Building_14 (193 m)
    # so all four of the missing ones qualify, and the repeat penalties still
    # decide WHICH landmark — two identical towers facing each other is no
    # better for being tall.
    # TWO TALL BUILDINGS MAY SHARE A BLOCK BUT NOT TOUCH (user, 2026-08-29,
    # looking at the built scene): "don't have 2 of the really tall buildings
    # immediately next to each other. They can be in the same city block but
    # not right next to each other." This is NOT the repeat penalty — that
    # keeps two copies of ONE model apart; this applies to any two tall
    # buildings whatever they are, because the 312 m and the 302 m tower ended
    # up shoulder to shoulder and read as a single mass.
    #
    # The gap is measured between FOOTPRINTS, not centres: these plans run from
    # 42 x 42 m to 60 x 142 m, so a centre-to-centre rule would treat a slender
    # tower beside a broad one completely differently from the reverse.
    # MEASURED before the rule: 7 towers on a 116 x 261 m block with closest
    # pairs at 42-51 m centre to centre on 42-86 m wide footprints — touching.
    # 30 m is what the block density actually allows; 60 m rejects nearly every
    # candidate and empties the district.
    tall_min_h_m: 120.0
    tall_min_gap_m: 30.0
    landmark_count: 4
    landmark_min_height_m: 190.0
    # Terrace runs never reach the skyline's penalties — `_tile_run` lays them
    # by length — so a run would happily put the same model twice in a row.
    # OFF by default because it shifts the RNG stream and would restyle
    # `downtown.yaml`, which `downtown_earthquake.yaml` builds on.
    terrace_no_repeat: true
    infill:
      enabled: true
      # INFILL FROM THE BLOCK'S OWN DISTRICT. Off, infill merges every
      # non-terrace typology into one pool and fills every block from it, which
      # put an 11.8 m Dmytro factory shed inside a block of 134-312 m glass
      # towers — invisible in the typology counts, because the block still
      # reports as `highrise`. Default off so `downtown` and the earthquake
      # scene keep the mix they were tuned with.
      per_block_pool: true
      gap_m: 2.0              # clearance between infilled buildings
      # min_gap_m: 8.0        # raise to leave courtyards / cap the point budget
    # Ring names are load-bearing: layout.anisotropic.zones is keyed by them.
    # Rings no longer decide WHAT gets built — only the mixture of typologies
    # likely at that distance, which is the prior on where a zoning nucleus
    # lands. `mix` is that prior.
    rings:
      # FIVE RINGS, NOT THREE. The user asked for "a more gradual high rise to
      # mid rise to lower mid rise to low rise", and the ladder that delivers it
      # is `_AreaMap._ladder`, which forbids a rank jump greater than one
      # between neighbouring zoning cells. With three typologies a tower could
      # sit one cell from a terrace; with the six ranked typologies below, the
      # ladder is forced to insert every intermediate step, so the gradient is a
      # property of the zoning rather than something tuned into the mixes.
      #
      # The mixes overlap deliberately — each ring shares a typology with the
      # ring inside and outside it, so no ring boundary is also a typology
      # boundary. A ring whose mix is disjoint from its neighbour's reads as a
      # wall however gradual the ranks are.
      #
      # A RING'S MIX MAY ONLY SPAN ADJACENT RANKS. `_ladder` resolves a rank
      # gap greater than one by REPLACING THE HIGHER-RANKED CELL with the
      # intermediate typology, and it sweeps three times — so a mix that puts
      # rank 5 beside rank 3 does not produce a gradient, it erodes the rank 5
      # away. MEASURED: with `brick_midrise` (rank 3) at 0.05 in the core mix
      # and `midrise` (rank 2) at 0.05 in inner, `highrise` ended with ZERO
      # blocks in the whole city and all eleven of its towers unplaced. Each
      # mix below spans at most three consecutive ranks.
      #
      # `to_frac` IS A FRACTION OF THE HALF-DIAGONAL, NOT OF THE HALF-WIDTH, and
      # on a square plate those differ by sqrt(2). On this 800 m region the
      # half-diagonal is 565.7 m while the plate only reaches 400 m along its
      # axes, so a ring boundary at 0.83 sits at radius 470 m — outside the
      # region except in its four corners. MEASURED consequence: `edge` held
      # about 4% of the ground, drew well under one nucleus at the measured
      # 30,000 m2 per nucleus, and `rowhouse` came out with ZERO blocks while
      # `highrise` — 12% of the ground and 2.6 expected nuclei — lost its only
      # draws to the 0.28 tower share and came out at zero too.
      #
      # These are solved for an even-ish AREA share by integrating the
      # square-disc intersection: 12 / 18 / 22 / 25 / 23 % per ring.
      #     core 0.276 -> r 156 m    inner 0.437 -> r 247 m
      #     mid  0.575 -> r 326 m    outer 0.700 -> r 396 m
      # Re-solve if the region changes SHAPE; a different aspect ratio moves
      # every one of them.
      #
      # CORE WIDENED 0.276 -> 0.36 AND `inner` GIVEN A REAL HIGHRISE SHARE.
      # MEASURED over 24 seeds at the narrower core (`tools/asset_fit_audit.py
      # --seeds 24`): the core held ~12% of the ground, which is 2-3 blocks,
      # and the skyscrapers were rare rather than absent —
      #     SM_Building_18  P(placed) 8%    _17 12%    _31 (302 m) 12%
      #     _10 / _23 / _20 21%             _16 (312 m) 33%   _15 33%
      # None of that is a fit problem: every one of them fits every highrise
      # block. There were simply too few highrise blocks for eleven models to
      # appear in any one run.
      - {name: core,  to_frac: 0.360, furniture_scale: 1.0,
         mix: {highrise: 0.85, tower: 0.15}}
      - {name: inner, to_frac: 0.500, furniture_scale: 1.1,
         mix: {highrise: 0.40, tower: 0.40, brick_midrise: 0.20}}
      - {name: mid,   to_frac: 0.575, furniture_scale: 1.3,
         mix: {tower: 0.25, brick_midrise: 0.50, midrise: 0.25}}
      - {name: outer, to_frac: 0.700, furniture_scale: 1.6,
         mix: {brick_midrise: 0.25, midrise: 0.42, lowrise: 0.33}}
      # Row houses concentrated at the edge for the reason the old comment gave:
      # real brownstone stock is a DISTRICT — the West Village, Brooklyn Heights —
      # block after block of one height, not scattered oddities among towers.
      - {name: edge,  to_frac: 1.01, furniture_scale: 1.9,
         mix: {midrise: 0.15, lowrise: 0.25, rowhouse: 0.60}}

    zoning:
      cell_m: 40.0              # lattice the areas are grown on. MEASURED
                                # green patches are 29-44 m; at 120 m a 400 m
                                # region is a 3x3 grid and cannot make a
                                # ragged boundary at all
      area_m2_per_nucleus: 30000.0    # MEASURED: non-green landuse patches
                                      # are 58-112 m median side (175 m sq)
      # 40 m, not 150. Nuclei are ~173 m across at area_m2_per_nucleus 30000,
      # so a 150 m blend radius reached past the whole district and EVERY cell
      # averaged in its neighbours: rowhouse blocks configured at 46-52 m were
      # delivered at 53-64 m, which left 18 m of dead ground between the backs
      # of two terraces. One block-width still grades the seam without erasing
      # the typology's own size.
      blend_m: 40.0             # distance over which block size grades across
                                # an area boundary instead of snapping
      adjacency_ladder: true    # a tower area may not abut a row-house one; the
                                # intermediate typology is inserted between them
      bleed: 0.12               # per-block chance of re-rolling from the ring
                                # mix — the corner apartment block in a terrace
                                # street. Clean zoning is the giveaway.

    # TYPOLOGIES. Each owns a building pool, a height profile, a block size and
    # a morphology. `rank` orders them by intensity for the adjacency ladder and
    # for the fallback when a pool cannot fit the block it landed on.
    typologies:
      # SIX TYPOLOGIES, RANKED. `rank` drives two things: the adjacency ladder
      # above, and the fallback when a pool cannot fit the block it landed on.
      # The ranks are the height ladder — 0 terrace, 1 low, 2 mid, 3 brick mid,
      # 4 tower, 5 high — so "one rank apart" and "one step in height" are the
      # same statement.
      rowhouse:
        rank: 0
        pools: [rowhouse]
        morphology: terrace
        facing_offset_deg: 0.0
        # BROWNSTONES ONLY. The GreatAmericanCity brick stock used to be
        # appended here, and being 28-31 m deep against the brownstones' 21.1 m
        # it moved the admissible band for the whole pool to [65, 89] and
        # refused all eight brownstone blocks. It now has its own district
        # (`brick_midrise`), which is both what the user asked for and what
        # keeps this band where the brownstones need it.
        height_median_m: 14.5
        height_sigma: 0.18
        cross_grain: 400.0
        max_superblocks: 4
        street_w_m: 6.0
        street_park_w_m: 2.4
        alley_m: 2.0
        # 20, not 12. MEASURED: at 12 the buildable band is [44.2, 54.2] and
        # SIX of nine row-house blocks fell outside it and were rebuilt as the
        # next rank up (`rowhouse_refused=6`). The block sizes this subdivider
        # can produce are quantised, so a band has to be wide enough to contain
        # one — a court 20 m deep behind two rows is a garden court rather than
        # an alley, and both rows still front their own street, which is the
        # thing that actually matters.
        # 30, and this number is set by MEASUREMENT of the blocks the
        # subdivider actually delivers, not by what a terrace ideally wants.
        # Block size is sampled at the CELL CENTRE during a top-down recursion,
        # so a cut made while the cell still straddled two districts carries the
        # other district's target — which is why row-house blocks come out
        # 57.0-74.1 m however this typology is tuned. At alley_max 20 the band
        # topped out at 66.2 m outer and nine blocks were refused and rebuilt a
        # rank up. A 30 m court behind two rows is a garden court rather than a
        # service alley, but both rows still front their own street, which is
        # the thing that actually matters.
        alley_max_m: 30.0
        # 2 x 21.1 m of terrace plus the court, then the 4.00 m the sidewalk
        # inset takes off both sides: buildable [44.2, 72.2], outer [48.2, 76.2].
        block_short_m: [52.0, 64.0]
        block_long_m: [150.0, 210.0]
        run_median_m: 45.0
        run_sigma: 0.70
        run_gap_m: [3.0, 9.0]

      lowrise:
        rank: 1
        pools: [lowrise]
        morphology: pack
        perimeter_depth_m: 26.0
        # MEASURED across the eleven Dmytro sheds: 11.1-16.7 m.
        height_median_m: 13.5
        height_sigma: 0.22
        # Narrowest side per asset runs 25.0-45.1 m, so the pool needs a 49 m
        # short side for its widest member to have anywhere to stand.
        block_short_m: [62.0, 84.0]
        block_long_m: [150.0, 210.0]

      midrise:
        rank: 2
        pools: [midrise_v2]
        morphology: pack
        # NOT `midrise` — that key is `urban.yaml`'s and still holds the eleven
        # 11-17 m Dmytro sheds. Drawing from `midrise_v2` is what actually
        # answers "there's too many low rises, we need more mid rises": the
        # typology keeps its name and its rank, and only its draw list changes.
        perimeter_depth_m: 32.0
        # MEASURED across the pool: 29.0-48.0 m.
        height_median_m: 36.0
        height_sigma: 0.28
        block_short_m: [85.0, 112.0]
        block_long_m: [205.0, 270.0]

      brick_midrise:
        rank: 3
        pools: [brick_midrise]
        morphology: terrace
        facing_offset_deg: 0.0
        # MEASURED across the pool: 38.6-71.8 m, p50 59.3.
        height_median_m: 58.0
        height_sigma: 0.22
        # Its own grain, offset from the row-house district's 400 m sections so
        # the two terrace districts do not run parallel where they meet.
        cross_grain: 260.0
        max_superblocks: 2
        street_w_m: 6.0
        street_park_w_m: 2.4
        alley_m: 2.0
        # 30, for the same measured reason as `rowhouse` above: this district's
        # blocks are delivered at 79.9-124.8 m short side (median 104), well
        # above anything this typology asks for, because the cut that made them
        # was sized by whatever district the parent cell's centre was in.
        alley_max_m: 30.0
        # THE BAND IS SET BY THE POOL'S DEEPEST MEMBER, SM_Building_04 at 31.5 m
        # in X after its yaw-offset: `_terrace_strips` accepts a block only when
        # the BUILDABLE short side is in [2*31.5 + 2, 2*31.5 + 20] = [65, 83],
        # and `build_city` insets 2.00 m per side, so the OUTER block has to
        # land in [69, 87]. Read `rowhouse_refused` / the terrace-refused line
        # in the run log: if it is non-zero this band and the block targets have
        # drifted apart, and the district silently rebuilt as the next rank up.
        block_short_m: [72.0, 84.0]
        block_long_m: [190.0, 250.0]
        # 95, NOT 48, AND THE FLOOR IS ARITHMETIC. A run has to pay for two
        # end-capable pieces before it can have any interior at all, and in
        # this pool the two cheapest are SM_Building_26 (28.4 m along the run)
        # and SM_Building_03 (28.9 m) — 57.3 m of frontage spent on the
        # brackets. At a 48 m median most log-normal draws landed BELOW that
        # floor, so a run could only ever be a bracket with nothing between:
        # measured, 10 runs laid at a 42.4 m median and house counts of
        # [1,3,1,1,1,2,1,2,1,2]. No amount of end-picking heuristic fixes a
        # target below the minimum. At 95 m a typical run is the two ends plus
        # two to four interior pieces, which is what a terrace looks like.
        #
        # This is ABOVE the 43-48 m measured for real row-house runs, and that
        # is correct rather than a fudge: the measurement is of 5-8 m wide row
        # houses, and these units are 14-42 m of frontage each, so the same
        # HOUSE COUNT costs twice the metres.
        # END-CAPS ON THE TWO SHORT EDGES (user, 2026-08-29, on a brick
        # terrace block): "it's block is 2 rows. Which is fine but lots of free
        # space in the middle. The smaller edges can place the house 42 there
        # since it's very compact and we can afford depth in a block like that."
        #
        # `_lay_terrace` deliberately builds NOTHING behind the pair — the
        # middle is the service alley and rear yards. That is still right; what
        # was missing is the block's two SHORT edges, which are street frontage
        # like any other and were being left bare. `SM_Building_02` is 28.0 x
        # 14.4 m and fronts its 14.4 m face, so it closes a short edge without
        # eating the alley. `max_depth_m` is set just past its 28 m depth so
        # only genuinely compact stock qualifies.
        terrace_end_caps:
          pools: [midrise_v2]
          max_depth_m: 30.0
        run_median_m: 95.0
        run_sigma: 0.45
        run_gap_m: [3.0, 8.0]

      tower:
        rank: 4
        pools: [tower]
        morphology: pack
        perimeter_depth_m: 60.0
        # MEASURED: the merged pool (Muyang + GreatAmericanCity 08/09/11/12/19/
        # 21/22/26/27/28) runs 44.7-131.0 m.
        height_median_m: 78.0
        height_sigma: 0.35
        height_max_m: 140.0
        block_short_m: [78.0, 118.0]
        block_long_m: [190.0, 250.0]

      highrise:
        rank: 5
        pools: [highrise]
        morphology: pack
        # NO COURTYARD. A highrise block holds one or two buildings and the
        # building IS the block; a perimeter band would carve a frontage strip
        # narrower than the tower standing in it.
        perimeter_depth_m: 0.0
        # MEASURED across the pool: 103.7-312.0 m, p50 143.
        height_median_m: 165.0
        height_sigma: 0.40
        height_max_m: 320.0
        # SIZED TO SM_Building_31, which is 60.3 x 142.2 m in plan once its
        # yaw-offset is applied — the binding footprint in the whole library and
        # the reason these towers went unplaced before. The next largest are
        # 10 (86.0 x 60.1), 20 (85.4 x 61.5), 14 (85.4 x 58.0) and 17
        # (85.4 x 57.4), so a 95 m floor lets most of the pool into a modest
        # block while the 320 m ceiling gives 31 somewhere to stand.
        # `layout.max_block_m` is raised to 340 for this; at the inherited 200
        # the long axis is clamped and 31 can never be placed.
        # A TOWER BLOCK HOLDS ONE OR TWO TOWERS, NOT EIGHT. This is the real
        # answer to "don't have 2 of the really tall buildings immediately next
        # to each other", and the separation knobs above are NOT — measured,
        # `tall_min_gap_m` is inert for this typology whatever it is set to,
        # because the whole `highrise` pool is 134-312 m and the rule can only
        # redirect a slot to SHORTER stock. There is none, so every candidate
        # is tall, the filter empties the list and falls through. The largest
        # gap that changed anything at the old block size was about 6 m.
        #
        # At 235-320 m long a block took 5-8 towers packed shoulder to
        # shoulder (closest pairs 38-42 m centre to centre on 42-86 m wide
        # plans — touching). At 150-210 m it takes one or two, and the space
        # between towers becomes STREET, which is what actually separates them
        # and what a real downtown looks like. The floor stays at 150 because
        # SM_Building_31 is 142.2 m along its long axis and no shorter block
        # can hold it at all.
        # THE GAP THE PACKER ITSELF LEAVES, and this is what actually keeps
        # towers apart — see `_typ_gap`. 30 m of clear ground between two
        # towers reads as a plaza or a service street; 2.5 m (the global
        # default, right for a mid-rise block built to its edges) reads as one
        # mass.
        building_gap_m: 30.0
        block_short_m: [95.0, 130.0]
        block_long_m: [150.0, 210.0]

  # ---- parks (parks.py) ------------------------------------------------------
  # build_city gives a park ONE trail entering and leaving at opposite edge
  # midpoints, with benches/lamps/bins walked along that single ribbon and trees
  # spread deliberately EVENLY. That reads as a path through a field, not a
  # park. This re-lays each one: gates at corners and edge midpoints joined by
  # curved desire lines to off-centre hubs, a perimeter promenade, furniture by
  # AREA density, tree groves plus a perimeter row, and an open lawn left at the
  # point farthest from any path.
  #
  # Densities rather than along-path spacings: the new network is 4-5x the
  # length of the single trail, so a 14 m bench pitch applied to all of it gives
  # a bench every few metres. Central Park runs about one bench per 380 m2.
  parks:
    layout:
      # Corners first: a corner entrance pulls a desire line diagonally across
      # the park, which is what stops the network reading as a cross.
      entrances: [4, 6]
      # Each interior junction is an ATTRACTION — fountain, playground, seating
      # plaza. A walk has to lead somewhere or the layout reads as decoration.
      attractions: [2, 3]
      loop_min_side_m: 45.0   # perimeter promenade only above this park size
      # Always, above that size. With the attractions composed as rings the
      # through walks are radial, so without the promenade a park has no
      # circumferential route at all — measured, the seeds that skipped it came
      # out at 611 m of walk against 1,090-1,221 m for the seeds that drew it.
      loop_chance: 1.0
      loop_inset_m: 8.0
      path_curve_m: 5.0       # lateral wander of a desire line
      # Trunk keep-out beyond the paving edge. Small because the shared
      # footprint reservation already holds planting off the tiles themselves,
      # and a crown over a walk is a shade tree, not a collision.
      path_clear_m: 1.0

    # THE ATTRACTION AS A CENTREPIECE. Every walk drawn to an attraction is
    # clipped to the outside of its ring, so a path leads to it and the ring
    # carries you around it; nothing crosses the water. Radii are derived per
    # attraction from the MEASURED footprint of whatever stands in the middle,
    # so these are the clearances added to it, not absolute sizes.
    attraction:
      ring_gap_m: 1.0         # grass between the keep-out and the ring paving
      clearing_m: 9.0         # tree clearing OUTSIDE the ring — what makes the
                              # fountain visible instead of buried in canopy
      # 16 m along the ring: at 9 m a 12 m-radius ring carried 8 benches, which
      # rings the fountain in seating rather than punctuating it. ~3 now.
      bench_spacing_m: 16.0   # along the ring, benches facing inward
      plaza_radius_m: 4.0     # a seating circle has no centrepiece to clear

    # 2.5 benches per 1000 m2 is CENTRAL PARK density — ~9,000 benches over
    # 3.41 km2 is 2.6 — and Central Park is the densest-seated park in the US.
    # An ordinary urban park is nothing like it: 0.8 gives ~17 benches in a
    # 2 ha park, which is a bench every few tens of metres of walk.
    bench_density_per_1000m2: 0.8
    # Likewise the lamps: 1.6 lit the park like a car park. 0.5 keeps the walks
    # lit without the fixture becoming the thing you notice.
    lamp_density_per_1000m2: 0.5
    trash_can_density_per_1000m2: 0.5
    furniture_offset_m: 1.2   # kerb-to-prop gap off the walk edge

    # Planting is a jittered grid, one candidate per cell, so density is uniform
    # by construction — rejection sampling with a retry cap gave dense patches
    # and bare ones. Densities set the cell pitch: sqrt(100/density) metres.
    # Trees are laid FIRST and plants take only what is left, so raising the
    # tree density and cutting the plant density keeps shrubs as underplanting
    # rather than as a substitute canopy. At 1.2 / 0.8 the park was drifting the
    # wrong way — plants 106 -> 198 while trees fell 351 -> 237, which reads as a
    # park full of bushes.
    tree_density_per_100m2: 1.8
    plant_density_per_100m2: 0.45
    tree_min_separation_m: 4.0
    plant_min_separation_m: 2.0
    # A crown is above head height and may overhang a walk, a bench or another
    # crown — massed canopy is what a grove is. What reserves ground is the
    # trunk and its pit, this share of the crown, floored at the separation
    # above. Bigger trees therefore stand further apart without a second knob.
    canopy_footprint_frac: 0.45
    # A backstop against a mis-scaled asset, NOT a design rule. A park is the one
    # place a large canopy belongs, so this is set above every tree in the pool
    # (largest is Black_Oak at 25.4 m) and excludes nothing today.
    #
    # At 14.0 it excluded Black_Oak, which left Shumard_Oak as the ONLY canopy
    # tree in the park — everything else in the pool is 0.6-4 m understorey — and
    # accounted for most of the park's point saving. That was a budget cut
    # dressed as a planting rule, and a monoculture is the visible result.
    #
    # Crowns overlapping is not the problem it looks like: occupancy reserves the
    # trunk and pit (canopy_footprint_frac), so crowns interleave by design. That
    # is what a grove is.
    tree_max_canopy_m: 30.0
    grove_area_m2: 1600.0     # one species per grove, so planting reads massed
    lawn_area_frac: 0.10      # protected greensward, as a fraction of park area
                              # — MEASURED, Central Park's Great Lawn is 6.5%
    # A meadow is mown grass and wildflower, not bare ground: understorey up to
    # this footprint goes ON the lawn, bushes and trees stay off it. The lawn is
    # the largest single hole in a park's ground cover, and leaving it literally
    # empty is most of what reads as "empty in places".
    lawn_plant_max_m: 1.2
    fence_module_gap_m: 0.0   # railing modules butt end to end

    # Footprint reservation shared by every category, path tiles included.
    # Cell size is the bucket for the overlap test, not a placement grid.
    occupancy_cell_m: 6.0
    occupancy_pad_m: 0.2      # gap held between neighbouring footprints

# --- FIRE (the only thing that varies by level) ---------
epicenter: [0.0, 0.0]
wind_mps: 4.0
duration_s: 28800
heading_deg: 160.0
start_offset_frac: 0.45

# Corridor sizing, consumed by `tools/fire_corridor_manifest.py` (not by the generator).
fire_target_frac: 0.24
fire_collapse: 1
fire_f6: 0
