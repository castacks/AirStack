# HIGH-LEVEL scene spec — a detailed residential suburb.
#
# The v2 counterpart to `suburban.yaml`, which stays untouched and runnable so
# the two can be compared side by side. That one is a stub: it sets
# `locale: suburban` and inherits everything, which gives a downtown grid with
# houses dropped into it. A suburb is not a downtown with different buildings —
# its street network, its lotting and its planting are all different in kind.
#
# Run it with the v2 launch script, which is the only thing that calls the new
# passes:
#     SCENE_CONFIG=suburban_v2 \
#     ISAAC_SIM_SCRIPT_NAME=city_v2_preview_launch_script.py \
#     airstack up isaac-sim
#
# WHAT IS DIFFERENT FROM THE URBAN SCENE, and why each is its own pass:
#
#   suburb_layout.py   Streets. A downtown is a grid; a post-war suburb is a
#                      hierarchy — collector, looping local street, cul-de-sac —
#                      and the BSP cannot express a dead end at all.
#   suburb_lots.py     Neighbourhoods and lotting. A block is subdivided into
#                      LOTS, each with a house set back from the street, a
#                      driveway to the kerb, and front/rear yards. Which of
#                      those exist depends on the neighbourhood type.
#   suburb_yards.py    Yard planting. Front yards and back yards take different
#                      material, and fenced lots differ from open ones.
#
# The urban passes are reused where they still apply — `parks.py` for the parks,
# `city_detail.py` for the small amount of street furniture a suburb carries,
# `road_markings.py` for stop bars and centre lines.

locale: suburban
disaster-type: none
severity: 0.0

asset-set: suburban_v2

# Bigger than the urban 800 m: a suburb is lower density, and a neighbourhood
# with a collector, its looping locals and their cul-de-sacs needs room to read
# as one place rather than as a fragment. Watch the point budget — the urban
# scene OOM-killed at 89.1M, and the same ceiling applies here.
#
# 1600 x 1200 m = 1.92 km², six neighbourhood cells. The size is not arbitrary:
# below about 1.2 km the arterial border ring is a large fraction of the whole
# network and the measured street density comes out at a downtown's 14 km/km²
# instead of a suburb's. Swept host-side, this size lands at 10.9-12.5 km/km²
# against 7.4-12.4 measured over five real suburbs. 1600 x 1600 verifies just as
# cleanly and matches the OSM sample box exactly, but is 33% more land to fill
# and therefore 33% more point budget; go there only if the scene has headroom.
region_m: [1600, 1200]
seed: 42

overrides:
  # ---- STREETS  (owner: suburb_layout.py) ------------------------------------
  # A post-war suburb is a HIERARCHY, not a grid: arterials on the section line,
  # collectors between them, local streets that serve lots and stop. The BSP in
  # `scene_generator` (and the anisotropic one in `city_layout`) splits every
  # cell edge to edge, so it cannot make a street that stops — which means it
  # cannot make a cul-de-sac, the one form this fabric is defined by.
  # `suburb_layout.py` therefore composes corridors top-down instead of
  # recursively splitting, and recovers the blocks as the complement.
  #
  # THE LIMIT: everything downstream consumes axis-aligned rects, so these
  # streets are STRAIGHT. Real suburban streets curve. The realism here is
  # topological — hierarchy, dead ends, T-junctions, loops, varied grain — not
  # geometric, and curvature needs edits to tracked code that this may not make.
  suburb_layout:
    enabled: true

    # WIDTHS. The single biggest visual difference from the urban scene, and in
    # every source the driver is the PARKING configuration, not the class:
    #   VDOT Road Design Manual App. B(1) (Subdivision Street Design Guide),
    #     Table B(1)-1, 25 mph, <=2000 ADT: 24 ft no parking, 24 ft parking one
    #     side, 29 ft parking both sides, face of curb to face of curb.
    #   Iowa SUDAS 5C-1, Table 5C-1.01: local residential lane 10.5 ft, parking
    #     lane 8 ft, collector/arterial lane 12 ft; footnote 10 QUANTISES every
    #     two-lane roadway to 26 / 31 / 34 / 37 ft.
    #   ITE/CNU RP-036A "Designing Walkable Urban Thoroughfares" ch.9: 10-12 ft
    #     lanes on arterials, 10-11 ft on collectors; parking 8 ft commercial,
    #     7 ft residential. (RP-036A covers arterials and collectors ONLY — it
    #     has no local-street or "queuing street" guidance, so nothing here is
    #     attributed to it that it does not say.)
    #   Larimer County Urban Area Street Standards Table 7-2 (Loveland): Minor
    #     Collector 38 ft roadway; City of Napa Table 3.1: local 36 ft.
    # The rect a corridor publishes is lanes*lane_w_m + 2*parking_m, because
    # `apply_ground_planes` paints the whole rect; `carriage` carries the
    # travelled way for the markings pass.
    classes:
      # Section-line arterial: the border ring, and the only 4-lane road here.
      # 4 x 11.5 ft = 46 ft, inside RP-036A's 10-12 ft arterial lane band. No
      # kerb parking — SUDAS 5C-2(O) does not allow it on arterials.
      arterial:   {lanes: 4, lane_w_m: 3.5,  parking_m: 0.0}
      # 2 x 11 ft + 2 x 8 ft = 38 ft, exactly Loveland's Minor Collector.
      collector:  {lanes: 2, lane_w_m: 3.35, parking_m: 2.44,
                   parking_policy: {none: 0.30, one_side: 0.45, both: 0.25}}
      # 2 x 10.5 ft (SUDAS local residential) + 2 x 7 ft (RP-036A residential
      # parking) = 35 ft, on SUDAS's 34 ft quantisation step.
      local:      {lanes: 2, lane_w_m: 3.20, parking_m: 2.13,
                   parking_policy: {one_side: 0.30, both: 0.70}}
      # 20 ft EXACTLY: the width IFC Table D103.4 requires of a 151-500 ft dead
      # end, and the 20 ft clear traveled way RP-036A says fire districts want.
      # No kerb parking; the whole width is the fire lane.
      cul_de_sac: {lanes: 2, lane_w_m: 3.05, parking_m: 0.0}

    # Collectors divide the suburb into neighbourhood cells.
    #
    # FHWA's *Highway Functional Classification* Table III-1 gives SUBURBAN
    # arterial spacing as 1-2 miles — the section-line grid — and that is what
    # `region_m` expresses, since the border ring IS the arterial network.
    # FHWA gives NO numeric collector spacing (only a 3/4-mile trip-length split
    # between major and minor collectors), so this range is measured off OSM:
    # 380-620 m between tertiary/secondary streets in the five sampled suburbs.
    collector_spacing_m: [380, 620]

    # Local street grid inside a cell. Two independent checks:
    #   OSM: block faces run 87-176 m short side and 197-287 m long in the five
    #     suburbs; these settings produce 89-150 short and 188-360 long once the
    #     dead-end spurs are discounted the way OSM's face-finding discounts them.
    #   LEED v4 ND, SLL Prerequisite "Smart Location" Option 2, requires a
    #     through-connection at least every 600 ft (180 m) on average and at
    #     least every 800 ft (245 m). 165-265 m brackets exactly that.
    # No verified ordinance MAXIMUM block length was found, so none is claimed.
    block_short_m: [72, 118]
    block_long_m:  [165, 265]

    # Two lot depths back to back, so nothing narrower can appear between two
    # through streets. Zoning minima: Fremont CA Table 18.90.040 min lot depth
    # 100 ft, Concord CA Table 18.30.030 min 85 ft; and the US Census median new
    # for-sale lot of ~8,400 sq ft over a 70 ft frontage back-computes to ~114 ft
    # (34.7 m). So one lot depth is ~26-35 m and two are 52-70 m.
    #
    # A cul-de-sac may back onto the next street across ONE lot depth, hence the
    # separate smaller figure. Both clear SUDAS Table 5L-3.05's 75 ft (22.9 m)
    # minimum intersection clearance on a local residential street.
    min_gap_m: 62.0
    stub_gap_m: 34.0
    jitter: 0.35

    # How each neighbourhood cell is laid out. Mixing the three is what stops
    # the suburb reading as one repeated motif:
    #   ladder       rails along the cell, rungs across it, most of them
    #                stopping on a rail rather than crossing — this is where the
    #                T-junctions come from
    #   loop         ring street round an interior superblock, fed by stems
    #   cul_cluster  one street through the cell and nothing else; the
    #                cul-de-sacs do the rest
    cell_patterns: {ladder: 0.40, loop: 0.35, cul_cluster: 0.25}
    # Measured: 69-87% of suburban junctions are three-way, against 38% in a
    # pre-war grid. A rung that runs through makes two four-way junctions; one
    # that stops on a rail makes a T. Hence a low through chance.
    rung_through_chance: 0.30

    cul_de_sac:
      # Counted directly from OSM: a degree-1 node on a residential way IS a
      # cul-de-sac. The five suburbs give 3-16 per km² (12-35% of all nodes),
      # against 4/km² and 6-8% for a pre-war gridded neighbourhood.
      # Barrington-Leigh & Millard-Ball, PNAS 2015 112(27):8244, SI Table S2,
      # agrees from a different direction: US intersections BUILT in 1993-97 are
      # 26.6% dead ends, 2008-12 are 19.1%, with metro extremes 19-42%
      # (Greensboro-Winston-Salem 42.4%, Harrisburg-York 19.0%).
      per_km2: [10, 18]
      # LENGTH. The floor is IFC D103.4: a dead end over 150 ft (45.7 m) needs a
      # turnaround, so anything shorter would not have one. The cap is chosen so
      # every cul-de-sac stays inside Table D103.4's 151-500 ft tier, where a
      # 20 ft width is sufficient — 140 m is 459 ft. It also clears the tighter
      # real caps: many Iowa cities stop at 500-600 ft, IFC recommends under
      # 750 ft, and ITE/ULI/ASCE want under 1,000 ft or under 200 trips/day,
      # which for single-family at 8-10 trips/day is about 20 lots.
      # Measured dead-end stub length in the five suburbs: 37-119 m median.
      length_m: [46, 140]
      # TURNAROUND. A fire-apparatus dimension, not a styling choice. IFC Table
      # D103.4 lists exactly three acceptable forms and Figure D103.1 dimensions
      # them: a 96 ft DIAMETER cul-de-sac (so 48 ft = 14.6 m radius, to the
      # driving surface, NOT to the ROW line), a 120 ft hammerhead (60 ft each
      # side of the stem), and a 60 ft "Y". Iowa SUDAS 5C-2(P) adopts the same
      # radius: "the minimum radius for cul-de-sacs is 45 feet", against IFC's
      # 48. A ROW radius would be larger — 60-120 ft is quoted as typical — and
      # is not what this is.
      #
      # 48 ft is 14.630 m; this rounds UP, because the code figure is a minimum
      # and a bulb built at 14.60 comes out 8 mm short of 96 ft.
      bulb_radius_m: 14.64
      # The hammerhead form, at IFC's 120 ft: the arm reaches 60 ft (18.3 m)
      # either side of the stem centreline, of which the stem itself is 10 ft, so
      # the arm extends 15.25 m past the kerb.
      hammerhead_share: 0.25
      hammerhead_arm_m: 15.25

    # PARKS — the urban park composition reused (parks.py owns what goes inside;
    # this only reserves the land), but much bigger, as asked. A park is a loop
    # cell whose interior is never built on, so it comes out with four street
    # frontages and no road through it, which is what `parks.py` expects.
    #
    # Sized in absolute metres rather than as a multiple of the block target the
    # way the urban scene does it: 150-250 m a side is 2.3-6.2 ha, against the
    # urban parks' ~0.7-3 ha. That is a neighbourhood park in the NRPA sense
    # rather than a garden square, which is the right unit for a suburb.
    parks:
      enabled: true
      count: [1, 2]
      side_m: [150, 250]

  # ---- NEIGHBOURHOODS, LOTS, HOUSES  (owner: suburb_lots.py) -----------------
  #
  # WHERE THESE NUMBERS COME FROM. Lot geometry is not a matter of taste — it is
  # written down, district by district, in a zoning ordinance, and it varies by
  # ERA far more than by region. So the three neighbourhood types below are
  # three documented lotting regimes, not three sizes of one thing, and every
  # dimension is taken from a named district in a real code. Where codes
  # disagree the disagreement is noted rather than averaged away.
  #
  # PRIMARY SOURCES (retrieved 2026-08):
  #   [LG]  Town of Los Gatos CA, Town Code Ch. 29, "What is an R-1 Zone?"
  #         https://www.losgatosca.gov/DocumentCenter/View/357
  #   [MW]  City of Mount Washington KY, Zoning Ord. §5.600-5.603 (R-1/R-2/R-3)
  #         https://cms3.revize.com/revize/mtwashington/Documents/Departments/Building%20&%20Housing/Planning%20&%20Zoning/R1-R2-R3-R4.pdf
  #   [JC]  City of Junction City OR, JCMC 17.10 (R1), 17.95.020 (fences)
  #         https://www.codepublishing.com/OR/JunctionCity/html/JunctionCity17/JunctionCity1710.html
  #   [PDX] City of Portland OR, Title 33: 33.110 Table 110-4 + §33.110.275
  #         (fences), 33.610 Table 610-2 (lots), 33.266.130 (parking/driveway)
  #         https://www.portland.gov/code/33/100s/110
  #   [TAY] Town of Taylor AZ, TTC §18.20.050 (R-1), §18.60.050 (fences/walls)
  #   [SA]  City of San Antonio TX, UDC §35-310.05a (small-lot R-1/R-2/R-3)
  #   [LEV] Levittown NY 1947-51 plat: 60 x 100 ft lots, house = 12% of lot;
  #         1949 ranch 32 x 25 ft. njdigitalhighway.org/lesson/suburban_nj/levittown
  #   [SOC] US Census Survey of Construction via NAHB: 2025 median new
  #         single-family lot 8,543 sq ft; 38% of 2025 lots under 7,000 sq ft.
  #         https://eyeonhousing.org/2026/07/shrinking-lots-trend-levels-off-as-smaller-lots-remain-the-norm/
  #   [CN]  Concrete Network driveway width guidance — INDUSTRY, NOT CODE.
  #
  #   tract      Post-war Levittown: 60 x 100 ft (18.3 x 30.5 m, 6,000 sq ft)
  #              [LEV], houses 32 x 25 ft on 12% coverage [LEV], front-load
  #              drive, and the deepest front lawn of the three. FRONT YARD ONLY
  #              — the archetype's back yards were unimproved and unfenced, so
  #              the planting pass is told to treat only the front as a yard.
  #              Levittown's own setback is NOT stated in any source retrieved;
  #              the 25 ft used here is [LG] R-1:8, the nearest documented
  #              small-lot figure.
  #
  #   compact    Modern small lot [LG] R-1:8 / [JC] R1: 60 ft width, 90 ft
  #              depth, 8,000 sq ft, 20-25 ft front, 6-8 ft sides, 15-20 ft
  #              rear. Shallow front, real back garden, single drive. This is
  #              the "houses closer together with a small back yard" type.
  #              60 ft is also the FLOOR THE ART IMPOSES: the bungalow pool is
  #              ~12 m wide, so 12 + 3.0 drive + 2 x 1.8 side = 18.6 m is the
  #              narrowest lot that can hold a house and a driveway at all.
  #              Codes go far narrower — [PDX] R5 is 36 ft, [SA] R-3 is 20 ft —
  #              and none of it is buildable with this library.
  #
  #   large_lot  Low-density R-1 [LG] R-1:20 (20,000 sq ft): 100 ft width,
  #              140 ft depth, 30 ft front, 15 ft sides, 25 ft rear; [MW] R-1
  #              agrees on 100 ft width and 15/25 ft sides and rear. Deep
  #              setback, double side-load drive, both yards, and the only type
  #              that fences its street frontage.
  #              DISAGREEMENT WORTH KNOWING: the front setback is the least
  #              settled figure in US zoning. [PDX] R20 says 20 ft, [LG] says
  #              30 ft, [MW] R-1 says 50 ft measured from the RIGHT-OF-WAY line
  #              rather than the lot line. 30 ft is the middle and the most
  #              commonly cited.
  #
  # The mix is weighted so the scene's median lot lands near the [SOC] national
  # median of 8,543 sq ft: tract 6,000, compact ~8,000, large_lot ~14,000.
  #
  # DRIVEWAYS: 10 ft (3.0 m) single, 20 ft (6.1 m) double [CN]. [PDX]
  # 33.266.130.D.2 sets the code MINIMUM at 9 ft and D.1 sizes a parking space
  # at 9 x 18 ft, which is where the 5.5 m parking pad in the pass comes from.
  # [SA] caps the drive at 12 ft WHERE IT CROSSES THE RIGHT OF WAY on a small
  # lot — this pass runs one constant width the whole way and does not narrow
  # at the apron, which is a simplification, not a code figure.
  #
  # FENCES: US codes split front from rear almost universally, and the split is
  # why `lot_fences` in the asset set is tagged `low` / `privacy`:
  #   front  3.5 ft [PDX 33.110.275.C], 3.5 ft [JC 17.95.020], 4 ft [TAY]
  #   rear   8 ft [PDX], 7 ft [JC], 6 ft [TAY]
  # Miami-Dade RU-1 allows 6 ft in front and is the outlier. The low pool here
  # measures 0.95-0.99 m (3.1-3.2 ft) and the privacy pool 1.89 m (6.2 ft), so
  # both sit inside the mainstream band.
  #
  # UNVERIFIED, stated plainly: (a) no source was found for a standard wood
  # fence PANEL width, so the module length is whatever each asset measures
  # rather than a cited 8 ft; (b) modern house footprint dimensions are derived
  # from Census median floor area, not reported directly, and the house pool
  # here is sized by its own art anyway.
  suburb_lots:
    enabled: true

    neighbourhoods:
      # Seeds every ~300 m over the 1600 x 1200 m region: ~20 patches, so a
      # neighbourhood is several blocks across and there is a boundary you can
      # walk to. Per-block assignment was the alternative and it reads as
      # noise — see the module docstring.
      patch_m: 300.0
      patch_jitter: 0.35
      mix:
        tract: 1.0
        compact: 1.0
        large_lot: 0.8

    # build_city scattered its trees, shrubs, paving and parked cars against
    # ITS house positions. Every one of them is now standing in a lot, a
    # driveway or a house, so they come out; suburb_yards replants the yards.
    clear_block_scatter: true

    types:
      # ---- post-war tract: FRONT YARD ONLY, NO FENCES --------------------
      tract:
        pools: [intact]
        lot_width_m: 18.3         # 60 ft  [LEV]
        lot_width_min_m: 16.8     # 55 ft — floor before parcels merge
        lot_depth_m: 30.5         # 100 ft [LEV]
        lot_depth_min_m: 26.0
        lot_depth_max_m: 34.0
        front_setback_m: 7.6      # 25 ft  [LG] R-1:8 (Levittown's own: n/s)
        side_setback_m: 2.4       # 8 ft   [LG] R-1:8
        rear_setback_m: 6.1       # 20 ft  [LG] R-1:8
        driveway_width_m: 3.0     # 10 ft single [CN]; code min 9 ft [PDX]
        driveway_to_rear: false
        driveway_car_chance: 0.45
        yards: [front]            # the whole point of this type
        fence: {chance: 0.0}      # the archetype is an open, unfenced lawn

      # ---- modern small lot: REAR YARD, PRIVACY FENCE --------------------
      compact:
        pools: [intact]
        lot_width_m: 18.3         # 60 ft  [LG] R-1:8, [JC] R1
        lot_width_min_m: 16.8
        lot_depth_m: 27.4         # 90 ft  [LG] R-1:8
        lot_depth_min_m: 23.0
        lot_depth_max_m: 32.0
        front_setback_m: 6.1      # 20 ft  [JC] R1 (20 ft to the garage face)
        side_setback_m: 1.8       # 6 ft   [JC] R1
        rear_setback_m: 4.6       # 15 ft  [JC] R1
        driveway_width_m: 3.0
        driveway_to_rear: false
        driveway_car_chance: 0.5
        yards: [rear]
        fence:
          chance: 0.75
          tag: privacy            # 1.89 m = 6.2 ft, inside the 6-8 ft band
          front: false            # a 6 ft fence on the street is not a suburb
          side: true              # from the front building line back
          rear: true
          module_gap_m: 0.0       # a fence is continuous

      # ---- large lot: BOTH YARDS, LOW FRONT FENCE ------------------------
      large_lot:
        pools: [intact]
        lot_width_m: 30.5         # 100 ft [LG] R-1:20, [MW] R-1
        lot_width_min_m: 24.0
        lot_depth_m: 42.7         # 140 ft [LG] R-1:20
        lot_depth_min_m: 29.0
        lot_depth_max_m: 52.0
        front_setback_m: 9.1      # 30 ft  [LG] R-1:20 (see disagreement above)
        side_setback_m: 4.6       # 15 ft  [LG] R-1:20, [MW] R-1
        rear_setback_m: 7.6       # 25 ft  [LG] R-1:20, [MW] R-1
        driveway_width_m: 6.1     # 20 ft double [CN]
        driveway_to_rear: true    # side-load, garage at the back of the lot
        driveway_car_chance: 0.55
        yards: [front, rear]
        fence:
          chance: 0.85
          tag: low                # 0.95-0.99 m = 3.1-3.2 ft, inside the
                                  # 3.5-4 ft front-yard cap
          front: true
          side: false
          rear: true
          module_gap_m: 0.0

  # ---- YARDS  (owner: suburb_yards.py) ---------------------------------------
  # A front yard and a back yard are different places and are composed
  # differently: the front is a kept, seen thing — foundation shrubs in a row
  # against the wall, one specimen tree, a mailbox, and a lawn deliberately
  # left open — and the back is a working one, massed along its boundary, with
  # the shed, the patio set and the bin. The `neighbourhoods:` block below
  # takes that further per type, keyed on the same names `suburb_lots.types`
  # uses.
  suburb_yards:
    layout_key: lot_yards       # where suburb_lots publishes its lot records

    # THE POINT BUDGET IS THE BINDING CONSTRAINT AND THIS IS THE ONE KNOB.
    #
    # Nothing is USD-instanced: `apply_placements` composes every placement as
    # its own reference and never sets `instanceable`, so N trees cost N x the
    # tree. The AEC vegetation is archviz-grade, the cheapest bound green tree
    # in the library is 48,701 points, and the urban scene OOM-killed at 89.1M.
    #
    # So the tree count is set by THIS NUMBER, not by the lot count:
    #
    #     trees  ~=  point_budget * tree_budget_frac / 55,000
    #
    # 30M gives ~340 trees and ~1,700 shrubs and props. The lot count only
    # decides what FRACTION of yards get one — measured host-side over four
    # seeds: 60 lots (106 yards) 54-70% treed, 250 lots 51-59%, 500 lots 34%.
    # Raise this only against a measured total for the rest of the scene; the
    # pass prints exactly what it spent, so run it once and read the number.
    # Halving it degrades evenly rather than emptying half the suburb — the
    # per-yard share carries forward, so at 4M the trees thin to 4% of yards
    # and stay spread across the whole map.
    point_budget: 30000000
    # The share reserved for canopy. NOT a tuning knob — it is the split of the
    # scene's geometry between trees and everything else, and it exists because
    # a single purse always loses to the cheap end: a grass tuft is 1,220
    # points against a tree's 48,701, and one shared budget spent itself on
    # ground cover and produced a treeless suburb (151 trees over 875 yards).
    tree_budget_frac: 0.62

    # Reservation grid. Finer than the park's 6 m because a yard's props sit
    # tighter, and the pad is the guaranteed gap between any two footprints.
    occupancy_cell_m: 4.0
    occupancy_pad_m: 0.15

    # Keep-outs, all claimed in the occupancy BEFORE anything is planted, so
    # "nothing on the house, the drive or the fence" is a property of the
    # reservation rather than a rule each routine has to remember.
    house_clear_m: 0.5
    drive_clear_m: 0.35
    walk_clear_m: 0.25
    fence_clear_m: 0.5
    # An OPEN lot holds its planting off the property line so the lawns read as
    # one continuous sweep, which is what `tract` (fence chance 0.0) looks like
    # and the single clearest difference between a fenced lot and an open one.
    boundary_inset_m: 0.4

    # A tree reserves its TRUNK AND PIT, not its crown: massed canopy is what a
    # mature suburb looks like from above, and what may not overlap is the
    # ground the trunk stands on. Same rule as the park pass.
    tree_min_separation_m: 3.0
    canopy_footprint_frac: 0.35

    # ---- the front yard: composed, not scattered ----------------------------
    front:
      # Over half of it is open lawn. This is the single most important number
      # in the front-yard composition — a front garden scattered evenly with
      # plants stops reading as a garden and starts reading as rough ground.
      # The specimen tree is allowed to stand IN it; only the scatter is held
      # out.
      lawn_frac: 0.55
      # A row along the house wall the yard actually faces, chosen by which
      # side of the house the yard lies beyond rather than by nearest centre —
      # that is what puts the row along the frontage instead of the gable end.
      foundation:
        chance: 0.85
        offset_m: 0.9
        spacing_m: 1.5
        jitter_m: 0.25
        height_m: [0.4, 1.8]    # MEASURED height, so the 0.1 m lawn tufts
                                # cannot end up lined against a wall
      tree:
        chance: 0.7
        count: [1, 1]           # one specimen; a front garden is not a grove
        darts: 40
        height_m: [4.5, 7.5]
        from_house_m: 2.5
      # Border planting only, and real shrubs rather than tufts — the tufts
      # bind a khaki lawngrass albedo (29% green) that reads as dry tussock,
      # which is fine at the back and wrong on a kept front lawn.
      scatter:
        density_per_100m2: 0.3
        height_m: [0.4, 1.8]
      mailbox_chance: 0.6
      shed_chance: 0.0          # not in a front garden
      patio_chance: 0.0
      bin_chance: 0.0

    # ---- the back yard: massed, and it works for a living -------------------
    rear:
      lawn_frac: 0.35
      foundation: {chance: 0.35, offset_m: 1.1, spacing_m: 2.0,
                   height_m: [0.4, 2.6]}
      tree:
        chance: 0.6
        count: [1, 2]
        darts: 40
        height_m: [6.5, 11.0]   # the canopy, against the front's ornamental
        from_house_m: 3.5
      # Boundary massing, FENCED LOTS ONLY. A hedge along an invisible property
      # line reads as a mistake, so an open lot gets the scatter instead. One
      # or two sides of the four, never all of them — a yard hedged on every
      # boundary is a maze, and which sides are planted is exactly what varies
      # between neighbouring gardens.
      hedge:
        chance: 0.7
        offset_m: 0.7
        spacing_m: 1.8
        height_m: [0.5, 2.6]
      scatter:
        density_per_100m2: 0.9
        height_m: [0.05, 2.6]   # tufts allowed here
      shed_chance: 0.35
      patio_chance: 0.35
      bin_chance: 0.5
      mailbox_chance: 0.0

    # ---- per-neighbourhood style, keyed on suburb_lots.types -----------------
    # Sparse patches deep-merged over the two blocks above. `skip:` suppresses
    # a yard kind outright, so the style and the lotting can disagree without
    # either having to know about the other — belt and braces against a lot
    # record that carries a rect the neighbourhood should not have.
    neighbourhoods:
      # Levittown: covenanted open, front yard only, and UNIFORM. The tree in
      # the front lawn is the type's defining feature, so it is near-certain
      # and everything else is restrained.
      tract:
        skip: [rear]
        front:
          lawn_frac: 0.6
          tree: {chance: 0.85}
          foundation: {chance: 0.9, spacing_m: 1.4}
          scatter: {density_per_100m2: 0.2}
          mailbox_chance: 0.8

      # Shallow lot, 1.9 m close-board fence, rear yard only. The fence is what
      # makes the boundary massing legible, so the hedge is near-certain; the
      # yard is only ~6 m deep, so the canopy is smaller and the pass shrinks
      # each tree from its own measured height to fit.
      compact:
        skip: [front]
        rear:
          lawn_frac: 0.3
          tree: {chance: 0.55, count: [1, 1], height_m: [5.0, 8.0]}
          hedge: {chance: 0.85, spacing_m: 1.6}
          scatter: {density_per_100m2: 1.1}
          shed_chance: 0.45
          patio_chance: 0.45

      # 90 ft frontage, both yards, low picket to the street and a side-load
      # drive. Room for everything, so this is where the accent species and the
      # second rear tree actually land.
      large_lot:
        front:
          lawn_frac: 0.5
          tree: {chance: 0.8, height_m: [5.0, 8.5]}
          foundation: {chance: 0.9, spacing_m: 1.6}
          scatter: {density_per_100m2: 0.4}
        rear:
          tree: {chance: 0.75, count: [1, 2], height_m: [7.0, 12.0]}
          hedge: {chance: 0.6}
          scatter: {density_per_100m2: 0.9}
          shed_chance: 0.5
          patio_chance: 0.55

  # ---- street furniture: a suburb carries very little ------------------------
  # The downtown kit is switched off at the source rather than thinned, because
  # a suburb genuinely has none of it: no parking meters, no bike racks, no
  # bus shelters on a residential street, no traffic signals.
  parking_meters: {spacing_m: 0.0}
  bike_racks:     {spacing_m: 0.0}
  bus_stops:      {spacing_m: 0.0}
  benches:        {spacing_m: 0.0}
  trash_cans:     {spacing_m: 0.0}

  traffic_lights:
    intersection_chance: 0.0    # a suburb is stop-controlled throughout

  # ---- the little street furniture a suburb DOES carry -----------------------
  city_detail:
    # The `suburban` locale leaves this off — a plain suburb keeps the simpler
    # built-in frontage passes. This preset is a *detailed* suburb and wants
    # the zoned pass, so it opts back in explicitly.
    enabled: true

    # THE SIDEWALK IS MOSTLY NOT THERE. A downtown pavement runs kerb to
    # building on both sides of every street; a post-war suburb often has grass
    # straight to the kerb, and where a walk exists it is narrow. The paved ring
    # is ONE sidewalk tile wide and `build_city` takes that width as
    # max(tile.sx, tile.sy) — there is no separate knob — so the tile scale IS
    # the walk width. 0.30 of the 5.00 m tile gives a 1.5 m walk, the usual
    # residential minimum, against the urban scene's 3.5 m.
    # These zones must SUM to that width or props land on grass.
    zones:
      curb_m:       0.15
      furnishing_m: 0.55
      through_m:    0.70
      frontage_m:   0.10
      interior_m:   4.00

    categories:
      # Stop signs at every junction — a suburb is stop-controlled throughout,
      # which is why traffic_lights.intersection_chance is 0 above. `control`
      # and `sightline` carry over from the urban scene: control keeps a
      # junction from getting a signal and a sign at once, sightline reserves
      # the AASHTO approach triangle so a shrub cannot grow in front of a sign.
      signs_stop:      {zone: furnishing, spacing_m: 0.0, near_corner_m: 6.0,
                        control: stop, sightline: true}
      signs_street_name: {zone: furnishing, spacing_m: 0.0, near_corner_m: 3.0}
      # Sparse compared with downtown: a residential street is lit at the
      # junctions and little else, and hydrants sit at the IFC 400 ft hose lay
      # rather than the tighter commercial figure.
      streetlights:    {zone: furnishing, spacing_m: 120.0}
      fire_hydrants:   {zone: furnishing, spacing_m: 240.0}
      # Street trees belong in the YARD here, not the verge — suburb_yards.py
      # owns the planting. 0 switches the frontage pass off for them.
      street_trees:    {zone: furnishing, spacing_m: 0.0}

    clearances:
      streetlights:  {streetlights: 30.0}

  roads:
    lane_width_m: 3.3
    markings:
      # NO BIKE LANES by request, and no diagonal markings anywhere — same
      # decision as the urban scene.
      bike_lanes: {enabled: false}
      turn_lane_flares: false
      no_parking_hatch: false
      # A residential street is marked far more lightly than a downtown one:
      # no centre line on a local street, no parking bays, and crossings only
      # where a collector is involved.
      crosswalks: true
      stop_bars: true
      parking_bays: false
