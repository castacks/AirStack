# HIGH-LEVEL scene spec — the detailed urban, after a major earthquake.
#
# THE POINT OF THIS FILE
# ----------------------
# Composing a disaster with the *detailed* city was impossible before the
# config hoist. `urban.yaml` used to carry ~1,100 lines under `overrides:`,
# and `overrides` is deep-merged LAST — after the locale axis and after the
# disaster axis — so any disaster settings it produced were promptly overwritten
# by the preset's own block. The two axes could not both be expressed.
#
# Now that those settings live in `default.yaml`, `locales/urban.yaml` and
# `compile_locale.compile_urban()`, this file is all it needs to be: a
# locale, a disaster, and a severity. The detailed generator comes from being a
# urban; the damage comes from the disaster axis; they compose.
#
# WHAT IT EXERCISES THAT THE PRISTINE PRESETS DO NOT
# ---------------------------------------------------
# * building fate against the v2 building pools — `_assign_fate` swaps a ruin
#   in only where one fits the intact footprint (`ruin_footprint_tolerance`),
#   so the layout is unchanged and only the asset differs;
# * `disaster_stage` over `city_detail`'s eighteen prop categories, which the
#   built-in frontage passes never touched.
#
# Severity 0.6 is the calibrated point: the hand-tuned original earthquake sits
# at 0.5-0.6, so this is "a bad one" rather than a worst case. Sweep it against
# `urban.yaml` (the same scene at severity 0) to see damage alone — the
# layout is identical between them by construction, which is the guarantee the
# tests in `tests/` enforce.
#
# Shares the Objaverse pre-flight with `urban` (same asset pack):
#
#     UV_PYTHON=3.13 uv run --no-project --with objaverse --with pandas \
#         --with pyyaml --with trimesh \
#         python scene_gen/prepare_assets.py --asset-pack urban
#
#     SCENE_CONFIG=earthquake \
#     ISAAC_SIM_SCRIPT_NAME=scene_launch_script.py \
#     airstack up isaac-sim

locale: urban
disaster-type: earthquake
severity: 1.0

asset-pack: urban
# Matches urban_v2.yaml, so the two are directly comparable side by side.
region_m: [800, 800]
seed: 42
