# HIGH-LEVEL scene spec — a pristine downtown with detailed street furniture.
#
# The pristine downtown baseline.
# region, so the two are directly comparable side by side. What differs is the
# asset set — this one draws on Objaverse props that `none.yaml`'s Nucleus-only
# set does not have.
#
# WHERE THE SETTINGS WENT (Phase 1 of the three-stage refactor)
# -------------------------------------------------------------
# This file used to carry ~1,100 lines under `overrides:` — the whole detailed
# generator, inline. That defeated the two-level config design: `overrides:` is
# deep-merged LAST, so it won over the locale and the disaster axes alike, and
# no disaster could be composed with a detailed city. Those settings now live
# where the design says they should:
#
#   config/low_level/default.yaml        the schema tier — what every knob
#                                        means, with a safe default
#   config/low_level/locales/downtown.yaml   downtown's street-furniture
#                                        category table (~200 cited lines)
#   compile_locale.compile_downtown()    which subsystems downtown enables,
#                                        and the values that are a property of
#                                        downtown rather than the generator
#   config/asset_sets/urban_v2.yaml      asset-specific fixups (prim pruning,
#                                        material overrides) — they name asset
#                                        uids, so they belong with the assets
#
# So a downtown scene now gets the detailed generator by virtue of being a
# downtown, and this file is back to being what a high-level spec should be:
# where, what happened, and how bad.
#
# PRE-FLIGHT REQUIRED. This scene draws 22 props from Objaverse, so the cache
# has to be filled on the HOST before launching — the sim container has no uv,
# objaverse or Blender:
#
#     UV_PYTHON=3.13 uv run --no-project --with objaverse --with pandas \
#         --with pyyaml --with trimesh \
#         python scene_gen/prepare_assets.py --asset-set urban
#
# UV_PYTHON=3.13 is load-bearing. convert_to_usd.py declares
# `requires-python = ">=3.13"`, which uv satisfies with the newest interpreter
# it has — but `bpy` only publishes a cp313 wheel, so on 3.14 every conversion
# dies with "no wheels with a matching Python ABI tag" and all 22 assets report
# as failed. The failure is per-asset and looks like an asset problem; it isn't.
#
# Skipping it is not fatal but is very visible: uncached assets render as
# placeholder prisms and the generator lists the missing uids at startup.
# Re-running once cached is a sub-second no-op, so it is safe before every
# launch. `--list` shows state without downloading anything.
#
#     SCENE_CONFIG=downtown \
#     ISAAC_SIM_SCRIPT_NAME=scene_launch_script.py \
#     airstack up isaac-sim

locale: downtown
disaster-type: none
severity: 0.0

asset-set: urban
# 800 m, not none.yaml's 400. The OSM-calibrated block targets are
# 60-95 x 135-200 m; a 400 m region fits about two of those across, so it lands
# at 14 blocks with only 3 arterial corridors and no readable road hierarchy.
# At 800 m the same targets give 31 blocks, 34 corridors and a real core/mid/
# edge gradient. Measured cost is 25.3M points (39.5M per km2) — under the 400 m
# scene's own 26.7M, because the calibrated terrace runs and parkland share are
# both smaller than the guesses they replaced.
# The A/B against none.yaml is no longer like-for-like on area; compare per km2.
region_m: [800, 800]
seed: 42

overrides:
  # ROAD ASPHALT, matched to the suburb wildfire scene: the local megascans
  # asphalt swatch instead of shared.yaml's Nucleus MI_Asphalt.
  # `apply_ground_planes` reads `usds.materials.asphalt`; the urban marking
  # vocabulary is drawn on top by `road_markings.py` and is unchanged.
  usds:
    materials:
      asphalt: "airstack://scene_gen/assets/materials/megascans/Road_Asphalt.usda"
