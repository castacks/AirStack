# HIGH-LEVEL scene spec — an intact residential suburb.
#
# Exercises the locale axis: `locale: suburban` is what makes this a suburb
# rather than a downtown built out of house models — blocks stay lawn instead
# of being paved, houses sit back from the street with side yards, trees grow
# out of the grass rather than out of planters, cars park on driveways, and
# the downtown street kit (benches, bins, shelters, signals) is absent.
#
# The locale also selects the `suburban` asset set by default, so the houses
# are detached single-family (imported from Objaverse). Also useful as the
# smoke test for that import pipeline — if the houses load and measure here,
# they work anywhere.

locale: suburban      # downtown | suburban | rural — how the place is laid out

disaster-type: none   # none | earthquake | tornado | explosion | flood | hurricane
severity: 0.0         # 0..1

# asset-set: suburban # optional — the locale already implies this
