# HIGH-LEVEL scene spec — see earthquake.yaml for the full key list.
#
# A narrow track of extreme wind across an otherwise intact city: total
# destruction inside the corridor, near-nothing outside it. Everything light
# is thrown a long way — cans fly, cars are flipped and strewn downwind.

locale: downtown      # downtown | suburban | rural — how the place is laid out

disaster-type: tornado
severity: 1.0

heading_deg: 35        # direction the track runs (deg, 0 = +X / East)

# 800 m, matching downtown.yaml, so the disaster presets are directly
# comparable with the pristine baseline and with each other.
region_m: [800, 800]
seed: 42
