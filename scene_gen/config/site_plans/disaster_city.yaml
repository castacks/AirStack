name: disaster_city
source:
  image: disaster-city.png
  meters_per_pixel: 0.1628
  image_px: [1903, 1396]
  traced_by: scene_gen/tools/trace_site_plan.py
  calibration: RECALIBRATED 2026-09-07 against `disaster-city/image (7).png`, whose ground extent is known
    (275 m E-W x 190 m N-S). The same parking module spans 192 px there and 119.3 px here, so this image
    is 0.1628 m/px. The earlier 0.1534 came from ASSUMING the module was a textbook 18.3 m; it is really
    19.4 m, and the whole site was 6% too small as a result.
  oblique: disaster-city-side-view-right.png
region_m: [309.79, 227.22]
# STRAIGHTEN THE TRACE. The centrelines come out of a pixel skeleton, so every
# road carries a metre or two of wobble that the kerbs then draw as a row of
# kinks. `simplify_m` is a Douglas-Peucker tolerance -- a hard bound on how far
# a centreline may move -- and 1.5 m on a 5-11 m carriageway takes this plan
# from 120 interior vertices at a median 19 degree turn to 32 at a median 36,
# which is the difference between skeletonisation noise and the corners a
# surveyor set. `fillet_m` is the radius those surviving corners are cut to;
# real intersection kerbs run 6-12 m.
simplify_m: 1.5
fillet_m: 10.0
min_block_m2.3: 150.0
