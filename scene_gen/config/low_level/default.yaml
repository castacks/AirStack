# LOW-LEVEL procedural city spec — consumed by utils/scene_generator.py.
#
# This is the base low-level config: every GENERATOR knob, with the city
# untouched by any disaster. The assets themselves live in an asset set
# (../asset_sets/<name>.yaml) named by `asset_set:` below — settings and asset
# sources are deliberately separate, so a scene can be re-skinned by naming a
# different set. utils/compile_disaster.py builds on this file: a high-level
# spec in ../presets/ (disaster type + severity + asset set) compiles into a
# low-level config under ./compiled/. See ../../GENERATION.md.
#
# Usage:
#   compile: python utils/compile_disaster.py            # presets/ -> compiled/
#   bake:    python utils/scene_generator.py --config <a low-level config> --output out.usd
#   runtime: generate_scene_on_stage(stage, <a low-level config>, scene_scale_factor=ssf)
#
# Units: meters. +X = East, +Y = North, +Z = Up. Region centered on origin.
#
# PIPELINE (generation order):
#   0. resolve   — asset_set merged in; relative usds.* paths prefixed with
#                  asset_root; per-USD footprint measured from bbox
#                  (measure_usds) else fallback_sizes — both from the set
#   1. roads     — metric BSP subdivision into blocks + road corridors (roads.*)
#                  1 asphalt plane for the whole region; 1 grass plane per block;
#                  yellow/white lane-marking dashes per corridor
#   2. ground    — per block: brick sidewalk ring; packed blocks paved wall-to-wall
#   3. buildings — each block packed out to the sidewalk (guillotine packing,
#                  packing.*) drawing from intact/damaged/destroyed pools by
#                  fate weight (disaster.damaged_fraction / destroyed_fraction),
#                  each with its own footprint; park_block_chance blocks stay
#                  grass; destroyed ruins get debris piles hugging the base +
#                  settled fragments, and sometimes lean (tilt + sink) with
#                  rubble on the caved side (disaster.debris); oversized
#                  buildings get anchor blocks; placeholders fill gaps when enabled
#   3b. parks    — park blocks get a meandering trail (tiles.trail) with
#                  park-tagged benches/lamps/trash cans along it (parks.*);
#                  a playground cluster off the trail (playground_* knobs,
#                  usds.play_structures); rocks + plants scattered on park
#                  grass (usds.rocks, plants.*); trees spread evenly at
#                  parks.tree_density_per_100m2
#   4. detail    — humans on sidewalks/trails/grass (humans.*); bus stops,
#                  streetlights, benches, planters (street trees + plant
#                  boxes), fire hydrants, trash cans along block frontages,
#                  each inset onto the sidewalk (frontage.curb_margin_m;
#                  shared occupancy grid — categories never stack); traffic
#                  lights at NS×EW corridor intersections (traffic_lights.*)
#   5. cars      — cars parked along road corridors, right-hand traffic (cars.*)
#
# disaster.* holds ALL disaster settings: building fates + debris (step 3)
# and the steps 4-5 aftermath (topples, leaning traffic lights, wind-scattered
# trash cans, prone humans, strewn wrecks). Every one of those knobs is a
# MAXIMUM, reached only where disaster.field reads 1.0 — the field is what
# gives each disaster type its shape (uniform storm / radial epicenter /
# tornado track). Normally written by compile_disaster.py, not by hand.
#
# exclusions apply to clutter only (houses, trees, streetlights, traffic
# lights, hydrants, trash cans, humans, cars); ground tiles and roads still
# cover excluded areas.

seed: 42                    # int — same seed => identical city

# ---- clutter keep-out zones ------------------------------------------------------
# circle {center: [x, y], radius: r} or rect {bounds: [[xmin, ymin], [xmax, ymax]]}
exclusions:
  - center: [0.0, 0.0]
    radius: 10.0             # keep the takeoff pad clear

# ---- step 0: assets -----------------------------------------------------------
# WHICH assets to build with. The named set (../asset_sets/<name>.yaml) supplies
# asset_root, asset_scale, sky, orientation, fallback_sizes and the whole usds
# library; this file supplies only the generator settings that use them. Swap
# the set to re-skin a scene without touching a single knob below.
# Anything the set defines can still be overridden here — this file wins.
asset_set: urban

measure_usds: true          # true = measure footprints from USD bboxes (needs asset access);
                            # per-category fallback_sizes used when a measurement fails

# ---- step 1: road network / block layout -----------------------------------
layout:
  region_m: [400, 400]      # [x, y] m — total city extent
  min_block_m: 30           # m — never split a block smaller than this
  max_block_m: 70           # m — always split larger (auto-raised for oversized buildings)
  split_jitter: 0.25        # 0..1 — 0 = split at center, 1 = anywhere in valid range
  tile_overlap: 1.02        # ground-tile seam overlap; tiles are stretched to exactly
                            # cover their grid step, this inflates them a hair further
                            # so neighbors overlap instead of meeting at a float-exact seam

# ---- step 3: block packing ------------------------------------------------------
packing:
  building_gap_m: 2.5       # m — clearance between adjacent buildings in a block
  park_block_chance: 0.12   # 0..1 — fraction of blocks left as grassy parks
                            # (where trees/plants/humans end up)
  min_parks: 2              # guaranteed minimum park count — extra blocks are
                            # promoted to parks when the chance rolls land short
  max_parks: 3            # optional cap; set min = max to pin an exact count

  # ---- locale shape (set by the `locale:` axis — see compile_locale.py) ----
  pave_blocks: true         # true  = downtown: concrete wall-to-wall between
                            #         buildings, greenery only in parks/planters
                            # false = suburb/rural: the block stays lawn and only
                            #         buildings + driveways are hard surface
  setback_m: 0.0            # m — hold buildings back from the sidewalk; the strip
                            # left in front stays lawn (front yards). 0 = built
                            # out to the sidewalk, downtown-style

  placeholders:             # filler prisms for gaps no library building fits
    enabled: false
    min_footprint_m: 5.0    # m — gaps thinner than this stay pavement
    max_footprint_m: 20.0   # m — bigger gaps split into several varied prisms
    height_m: [8, 30]       # [min, max] m — random prism height range

# ---- step 4: detail ------------------------------------------------------------
frontage:
  verge_m: 0.0              # m — planting strip between the kerb and the sidewalk;
                            # the exposed strip shows the block's grass (residential
                            # tell). 0 = sidewalk runs kerb-to-building
  curb_margin_m: 0.3        # m — gap between a street prop's mesh edge and the curb
                            # line; every frontage prop is inset by half its short
                            # footprint axis plus this, so nothing pokes into the road

trees:
  house_margin_m: 1.5       # m — keep-out ring around buildings / trail tiles
  lawn_density_per_100m2: 0.0  # trees per 100 m² of RESIDENTIAL lawn (needs
                            # packing.pave_blocks false — a paved block has no
                            # lawn). 0 = downtown: street trees only, potted in
                            # tree-tagged planters (planters.tree_spacing_m)
  lawn_min_separation_m: 6.0   # m — minimum lawn-tree-to-tree distance

plants:
  per_block: [4, 12]        # [min, max] — plant clumps per PARK block (park grass only);
                            # sidewalk plants are potted — see planters.plant_spacing_m
  min_separation_m: 1.0     # m — minimum plant-to-plant distance
  house_margin_m: 1.5       # m — keep-out ring around trail tiles
  lawn_density_per_100m2: 0.0  # shrubs/beds per 100 m² of residential lawn
                            # (as trees.lawn_density_per_100m2)
  lawn_house_margin_m: 0.6  # m — smaller ring for lawn planting, so shrubs can
                            # sit against a house foundation

planters:
  tree_spacing_m: 30.0      # m — street trees (in planters tagged "tree") along frontage
  plant_spacing_m: 40.0     # m — plant boxes along frontage
  plant_slot_m: 0.7         # m — planter length per plant clump (1-3 clumps per box)
  soil_level_frac: 0.75     # 0..1 — greenery base sits at this fraction of the
                            # planter's height (tall bush planters ≠ ground level)

bus_stops:
  spacing_m: 130.0          # m — shelter spacing along frontages (≈ one per block or two)

streetlights:
  spacing_m: 18.0           # m — spacing along block frontages

benches:
  spacing_m: 30.0           # m — spacing along block frontages (uses usds.benches
                            # entries tagged "sidewalk")

fire_hydrants:
  spacing_m: 55.0           # m — spacing along block frontages (one per ~half block)

trash_cans:
  spacing_m: 25.0           # m — spacing along block frontages

traffic_lights:
  intersection_chance: 0.9  # 0..1 — chance a road intersection gets a light
  corner_margin_m: 1.0      # m — pole distance past the road corner onto the
                            # sidewalk; pole faces the intersection center

humans:
  per_block: [0, 3]         # [min, max] — idlers per block on open grass (parks mostly)
  sidewalk_spacing_m: 45.0  # m — pedestrians along sidewalks, walking with the
                            # street (0 disables)
  trail_spacing_m: 30.0     # m — walkers along park trails (0 disables)
  min_separation_m: 2.0     # m — minimum person-to-person distance
  house_margin_m: 1.0       # m — keep-out ring around building lots

# ---- park blocks (see packing.park_block_chance) ---------------------------------
# Each park gets a meandering trail (tiles.trail) edge to edge across its longer
# axis, with park-tagged furniture (tags: ["park"] in usds entries) along the
# sides — benches face the trail — and rocks scattered on the grass.
parks:
  trail_margin_m: 4.0       # m — meander lateral clearance from the park edge
  trail_waypoints: [2, 4]   # [min, max] — interior meander waypoints
  bench_spacing_m: 14.0     # m — along-trail spacing of park benches
  streetlight_spacing_m: 22.0 # m — along-trail spacing of park lamps
  trash_can_spacing_m: 30.0 # m — along-trail spacing of park trash cans
  furniture_offset_m: 0.8   # m — gap between the trail edge and furniture
  rocks_per_park: [3, 8]    # [min, max] — rocks scattered per park
  rock_min_separation_m: 2.5 # m — minimum rock-to-rock distance
  tree_density_per_100m2: 0.8 # park trees per 100 m² of park grass — evenly
                            # spread (best-candidate sampling), off the trail
  tree_min_separation_m: 4.0 # m — minimum park-tree-to-tree distance
  playground_chance: 0.6    # 0..1 — chance a (big-enough) park gets a playground
  playground_structures: [2, 3] # [min, max] — play structures per playground
  playground_spacing_m: 5.0 # m — structure distance from the playground center
  playground_margin_m: 2.0  # m — keep-out ring around structures (blocks
                            # trees/rocks/humans from spawning inside)

# ---- step 5: cars ----------------------------------------------------------------
cars:
  density: 0.15             # 0..1 — fraction of straight road cells that get a car
  lane_offset_frac: 0.3     # 0..1 — lateral offset from road centerline; 0 = centerline,
                            # 1 = road edge; 0.5 = middle of the right-hand lane.
                            # Travel direction is random per car; offset is always to
                            # that direction's right (right-hand traffic)
  yaw_jitter_deg: 4.0       # deg — random heading wobble per car

# ---- driveways (suburban/rural; chance 0 disables) --------------------------
# A paved strip from each house out to the nearest block edge, optionally with
# a car parked on it — where suburban cars belong, rather than at the kerb.
driveways:
  chance: 0.0               # 0..1 — per building
  width_m: 3.0              # m — drive width
  car_chance: 0.0           # 0..1 — of drives, how many get a parked car

# ---- disaster ---------------------------------------------------------------
# Everything disaster-related lives here — building fates (step 3), debris,
# and the step 4-5 aftermath (topples, wrecks, casualties).
#
# THIS BLOCK IS PRISTINE ON PURPOSE. compile_disaster.py replaces it wholesale
# from a high-level spec (../presets/*.yaml), so building default.yaml directly
# gives an undamaged city. The keys stay here as the schema reference — the
# comments document what each one means to the generator.
#
# Every fraction / count below is a MAXIMUM: the generator scales it by the
# damage field at each object's position, so `field` decides where the
# disaster actually landed.
disaster:
  # Building fates: packing draws from intact / damaged / destroyed pools by
  # these pick weights (intact gets the remainder). A pool whose weight is
  # zero everywhere is excluded from packing entirely.
  damaged_fraction: 0.0      # 0..1 — pick weight for usds.buildings.damaged art
                             # (tilted + sunk intact stand-in when the pool is empty)
  destroyed_fraction: 0.0    # 0..1 — pick weight for usds.buildings.destroyed art,
                             # with a debris field around it (debris below)

  debris:                    # scattered around each destroyed building
    piles_per_building: [0, 0]   # [min, max] — rubble piles hugging the ruin
                                 # (overlap with building/road is fine)
    pile_max_offset_m: 3.0       # m — max pile offset beyond the footprint edge
    pieces_per_building: [0, 0]  # [min, max] — smaller fragments just past the
                                 # footprint; physics-settled like the toppled cars
    pieces_scatter_m: 6.0        # m — max fragment distance beyond the footprint
    tilt_chance: 0.0             # 0..1 — destroyed ruins also lean: slight
                                 # tilt + sink, rubble piled on the caved-in side
    tilt_deg: [2, 6]             # [min, max] deg — lean angle (roll and pitch)
    sink_m: [0.4, 1.2]           # [min, max] m — how far a leaning ruin sinks
    lean_piles: [2, 3]           # [min, max] — extra piles at the overhanging base

  # Aftermath (steps 4-5) — street-level damage.
  streetlights_toppled_fraction: 0.0    # 0..1 — poles snapped flat, random heading
  traffic_lights_toppled_fraction: 0.0  # 0..1 — poles snapped flat at the base
  traffic_lights_leaning_fraction: 0.0  # 0..1 — of still-standing poles: bent/leaning
  traffic_lights_lean_deg: [8, 30]      # [min, max] deg — lean angle range
  trash_cans_toppled_fraction: 0.0      # 0..1 — light + unanchored: most get tipped
  trash_cans_scatter_m: 0.0             # m — max wind displacement of tipped cans
  cars_toppled_fraction: 0.0            # 0..1 — lane cars flipped on side/roof
  cars_strewn: [0, 0]                   # [min, max] — extra wrecks tossed onto open ground
  strewn_topple_fraction: 0.7           # 0..1 — strewn cars flipped (rest stay upright)
  strewn_margin_m: 1.5                  # m — keep strewn cars off building footprints
  humans_prone_fraction: 0.0            # 0..1 — pedestrians/idlers lying flat where
                                        # they stood (casualties / taking cover)
  humans_strewn: [0, 0]                 # [min, max] — extra casualties on road asphalt

  # WHERE the disaster hit — scales every knob above by position (0..1).
  # This is what distinguishes disaster types from one another.
  field:
    kind: uniform            # uniform | radial | path
    inside: 1.0              # intensity in the affected zone
    outside: 0.0             # intensity far outside it (radial / path only)
    # radial — epicenters (earthquake, blast):
    # center: [0.0, 0.0]     # m
    # radius_m: 80.0         # full intensity out to here
    # falloff_m: 120.0       # then eases to `outside` over this distance
    # path — tracks (tornado):
    # points: [[-200, -200], [0, 0], [200, 200]]   # polyline, m
    # heading_deg: 35.0      # or omit points for a straight sweep on this heading
    # width_m: 60.0          # full-intensity corridor width
    # falloff_m: 40.0        # eases to `outside` over this distance past the edge

# ---- road network configuration -----------------------------------------------
roads:
  lane_width_m: 3.5          # m — width of a single traffic lane (realistic urban: 3–4m)
  main_road_lanes: 4         # total lanes for main roads (2 per direction)
  secondary_road_lanes: 2    # total lanes for secondary roads (1 per direction)
  border_lanes: 2            # lanes for the outer ring road
  main_road_chance: 0.25     # 0..1 — probability a BSP split becomes a main (wide) road
  asphalt_uv_scale_m: 4.0   # m per UV unit for asphalt tiling
  grass_uv_scale_m: 3.0     # m per UV unit for grass tiling
  lane_lines:
    dash_length_m: 3.0       # m — length of each white/yellow dash
    dash_gap_m: 3.0          # m — gap between dashes
    dash_width_m: 0.15       # m — width of a single dash stripe
    center_line_width_m: 0.20 # m — lateral separation between the two yellow centre lines
