    # MEASURED AND REJECTED: every Planter_* and PlanterFence* in both packs
    # payloads live vegetation, which is where their cost comes from —
    # PlanterBench is 6,777,655 points, more than a fifth of the entire yard
    # budget in ONE prop. Planter_03 / Ext_Bench_01 are the same 6.0 x 1.0 m
    # precast street planter (Ext_Bench_01's root prim is literally
    # `/World/planter_03`), too big and too urban for a garden. Bollard_01 is
    # 4.8% unbound.

  # ---- STREET FURNITURE THE DETAIL PASSES CONSUME -----------------------------
  # EMPTY, AND DECLARED SO THE INTENT IS ON RECORD. `city_detail`'s street-tree
  # pass can place a tree GUARD instead of a bare tree, and each guard asset
  # carries a PAYLOAD REFERENCE TO ITS OWN TREE — so the guard is not a metal
  # ring, it is a metal ring plus one of the species this file just priced out.
  # Measured by urban_v2 with tools/measure_assets.py, after the payload
  # resolves:
  #     PlanterFenceType1  215,627 pts   (bundles Largetooth_Aspen 198k)
  #     PlanterFenceType2  349,638 pts   (bundles Honey_Locust     332k)
  #     PlanterFenceType3  614,058 pts   (bundles Hawthorn         596k)
  # against 49-56k for a bare street tree. At guard_chance 0.45 that was 173
  # guards = 65.8M points, 73.8% of the whole urban scene, and IT OOM-KILLED
  # ISAAC SIM; even the single kept type measured 12.1M for 56 objects at 800 m.
  # The guard smuggles back in exactly the species street_trees excludes on
  # cost, so the exclusion carries here unchanged. Re-enable only with a cheap
  # tree substituted into the payload.
  #
  # An earlier measurement read 17,852 pts for these, because the payload could
  # not resolve at the time (the pack directory had been renamed) and the tree
  # was simply missing from the count. Always re-measure after moving packs.
  planter_fences: []

  # SIGNS — the pool the suburban chain never had, so both `suburb_scene` and
  # `city_detail` logged "signs_stop: no assets in the set — skipped".
  # `build_signs` reads `signs_stop` (falling back to `traffic_signs`) and puts
  # one on every minor approach to a junction of degree >= 3: 119 junctions on
  # the shipped graph preset, seed 3. A suburb is stop-controlled throughout,
  # which is what the preset says with `traffic_lights.intersection_chance: 0`,
  # so these are the traffic control the scene claims to have, not decoration.
  #
  # THE STOP SIGN IS THE PACK'S OWN, not urban_v2's Objaverse one:
  # RetroNeighborhood is already this scene's art family — houses, streetlight,
  # hydrant, driveway tile and sky all come out of it — so the sign matches by
  # construction, and being on Nucleus it needs no `prepare_assets.py` download.
  # cm-authored like every other prop in the pack, hence `scale: 0.01`.
  #
  # UNVERIFIED HOST-SIDE: this path was read off a Nucleus listing, not measured
  # — `pxr`/`omni.client` exist only inside the isaac-sim container. It follows
  # the pack's exact `SM_*.prop.usd` convention and sits beside
  # SM_StreetLight/SM_FireHydrant, which this chain already resolves. If it comes
  # up a placeholder prism, the fallback is urban_v2's, cached and known good:
  #   {usd: "objaverse://a3963ab8133b45cab4e60da94d255ac3", target-size-m: 2.40, fit: height}
  signs_stop:
    - usd: "RetroNeighborhood/Props/SM_Sign_Stop.prop.usd"
      scale: 0.01
      # FACE POINTED THE WRONG WAY. `build_signs` yaws the sign back down its
      # own approach so the plate meets the driver; this art needs a further
      # turn on top of that.
      # 270, NOT 180: this art's plate faces +-Y, not +-X, so it needs a
      # QUARTER turn on top of the approach heading, not a half. The urban
      # path needs no number here at all — `city_detail._prop_yaw` derives
      # that quarter turn from the MEASURED panel (sx < sy) and discards
      # the asset's offset. `suburb_scene.build_signs` has no aspect step,
      # so the correction has to live on the asset until it gains one.
      yaw-offset: 270.0
    #
    # ALSO IN THE PACK, DELIBERATELY NOT WIRED, because no pass would place
    # either and a pool nothing reads is dead config that reads as intent:
    #   SM_Sign_Children  a MID-BLOCK warning, and both passes that exist here
    #     are junction passes (`build_signs` walks approaches to nodes of degree
    #     >= 3, `city_detail` places at `near_corner_m`). In `signs_stop` it
    #     would stand at a junction in place of a stop sign. It wants a mid-block
    #     pass in suburb_scene, which is code, not a config line.
    #   SM_Sign_OneWay    a one-way plate; a residential street rarely is one,
    #     and no pool reads it.

  # STILL urban_v2's, because RetroNeighborhood has no street-name blade — the
  # pack ships a stop, a one-way and a children-crossing sign and nothing that
  # names a street. Both uids are already cached at this exact size and fit, so
  # they cost no download either.
  signs_street_name:
    - {usd: "objaverse://555fbab686004738b974373f6ad71d82", target-size-m: 2.40, fit: height,
       yaw-offset: 180.0}  # Road Sign (speed limit), 104f — face was to the kerb
    - {usd: "objaverse://599a74c1c8fd4f19bf6754b8128da6b8", target-size-m: 2.40, fit: height}  # Street Sign Final, 148f
    # NOT re-added, urban_v2's findings carried across so nobody retries them:
