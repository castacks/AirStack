# ASSET SET: suburban — detached single-family houses on residential blocks.
#
# Extends `shared.yaml`, which carries everything a locale doesn't get to
# choose: street furniture, greenery, ground tiles, vehicles, people. What is
# left here is what makes a place a suburb — timber-frame houses, and the
# wreckage they leave: lumber and scraped earth. Unlike `urban.yaml`'s debris,
# none of this is shared — the urban debris library (concrete chunks, cinder
# block, brick) reads as city-building rubble, wrong for a timber-frame
# collapse, so this set carries its own debris from scratch rather than
# appending to it.
#
# ONE EXCEPTION TO "ONLY BUILDINGS AND DEBRIS", added deliberately: the three
# kerb-furniture pools at the bottom. `shared.yaml` offers one of everything
# because it has to serve a downtown, a suburb and a village at once — four
# streetlights from three unrelated art families, eight bins. A NEIGHBOURHOOD
# IS NOT FURNISHED THAT WAY: a municipality buys one pole and one bin and
# repeats them, and the mixed pool is most of what reads as generated. That is
# a locale statement, not a detail-level one, so it belongs here rather than in
# `suburban_v2.yaml` — `build_city` reads these pools directly, so curating
# them at this level fixes the plain suburban scene as well as the detailed one.
# The reasoning is urban_v2.yaml's, carried across asset by asset.

extends: shared

# A detached bungalow, not a downtown block. Only used when a measure fails.
fallback_sizes:
  house: [12.0, 12.0]

# ---- the suburb-specific library --------------------------------------------------
usds:
  buildings:
    intact:
      # Objaverse assets, named by their dataset uid — that is the whole
      # identity. `airstack up` downloads and converts anything not already in
      # the local cache (scene_gen/assets/objaverse/<uid>/), so this list works
      # from an empty checkout; see assets/objaverse/manifest.yaml for
      # provenance and attribution (all CC-BY, artist "headerstock").
      #
      # `target-size-m` is baked into the cached USD at conversion, so there is
      # deliberately no `scale:` here — nothing to drift from the geometry.
      # It pins the longest plan dimension: a detached bungalow is ~12 m across.
      - usd: "objaverse://6644de89c2f0449db3de934744162b63"   # Bungalow The Chase
        target-size-m: 12
      - usd: "objaverse://388ea89b91524e4eb79068c24d170619"   # Bungalow-the Weeks
        target-size-m: 12
      - usd: "objaverse://1c6d17070d9e4b6595e5de2fa3e20d81"   # Bungalow The Ryder
        target-size-m: 12
      - usd: "objaverse://4b7d97e8a74248c79f4704e1967c3577"   # Bungalow The Budd
        target-size-m: 12
      - usd: "objaverse://358466b1877b4947aee36a50662d633b"   # Bungalow The Gilchrist
        target-size-m: 12
      - usd: "objaverse://85961c7ab0d14a9a8766fe58f28886a8"   # Bungalow The Dawson
        target-size-m: 12
      - usd: "objaverse://19331875f8d84137a94003f0660e2a50"   # Bungalow The Haynes
        target-size-m: 12
      - usd: "objaverse://1ca9bf31b9d34b44a9b9cac8c240a8d7"   # Bungalow The Crosby
        target-size-m: 12
      - usd: "objaverse://bee0da9227fa40029ad5352a2075ead8"   # Bungalow The Hale
        target-size-m: 12
      - usd: "objaverse://968ca5757023470ab603067d79f713fc"   # Bungalow The Goodson
        target-size-m: 12
      - usd: "objaverse://71474e859887459a96d2d281ffe53f18"   # Bungalow The Colbert
        target-size-m: 12
      - usd: "objaverse://ab67dc215f8344eabadeeae05eacd887"   # Bungalow The Cass
        target-size-m: 12
      - usd: "objaverse://f87535ec6d9a475db58965aa46ba6979"   # Bungalow The Clayton
        target-size-m: 12
      - usd: "objaverse://3bc5f70542014501a1e380891295299e"   # Bungalow The Newport
        target-size-m: 12
      - usd: "objaverse://7c64a6d90567428eb511f41036fe2d88"   # Bungalow The Walton
        target-size-m: 12

      # RetroNeighborhood houses, mixed in with the bungalows rather than
      # replacing them. The pack is where this locale's streetlight, hydrant,
      # driveway tile and sky already come from, so these are the neighbours the
      # rest of the scene was built around; urban.yaml has SM_House_01
      # commented out with the note "was tagged suburban/rural — belongs in a
      # suburban set, not here", which is this set. Fifteen bungalows plus ten
      # of these is 25 models on a street of ~1,700 houses.
      #
      # scale: 0.01 — CENTIMETRE-AUTHORED, the pack's own convention and the
      # value every other RetroNeighborhood entry in this chain already uses
      # (SM_StreetLight, SM_FireHydrant, SM_DriveWay_01, shared.yaml's
      # SM_Tree_*), and the value urban.yaml wrote on the commented-out house.
      #
      # NO `target-size-m`, and that is not an omission. It is an OBJAVERSE-ONLY
      # key: `objaverse_assets.scan_asset_sets` reads it to bake a size into the
      # cached USD at conversion time, and `scene_generator` never reads it at
      # all — so on a Nucleus path it would be silently ignored and would only
      # look like a size had been pinned. These arrive at their authored size,
      # which is correct once scaled.
      #
      # UNVERIFIED, AND IT MATTERS: their footprints have not been measured.
      # `suburb_parcel` cuts lots for houses 9-13 m wide by 8-11 m deep and
      # rejects a house whose corners fall outside the lot polygon, so anything
      # much larger than the bungalows' pinned 12 m will thin out the street
      # rather than fail loudly. Measuring needs `pxr`/`omni.client`, i.e. the
      # isaac-sim container — check them on the stage, and if one is far off,
      # drop that line rather than scaling it (a per-asset scale away from 0.01
      # would resize the doors and windows too).
      - usd: "RetroNeighborhood/Props/SM_House_01.prop.usd"
        scale: 0.01
      - usd: "RetroNeighborhood/Props/SM_House_02.prop.usd"
        scale: 0.01
      - usd: "RetroNeighborhood/Props/SM_House_03.prop.usd"
        scale: 0.01
      - usd: "RetroNeighborhood/Props/SM_House_04.prop.usd"
        scale: 0.01
      - usd: "RetroNeighborhood/Props/SM_House_05.prop.usd"
        scale: 0.01
      - usd: "RetroNeighborhood/Props/SM_House_06.prop.usd"
        scale: 0.01
      - usd: "RetroNeighborhood/Props/SM_House_07.prop.usd"
        scale: 0.01
      - usd: "RetroNeighborhood/Props/SM_House_08.prop.usd"
        scale: 0.01
      - usd: "RetroNeighborhood/Props/SM_House_09.prop.usd"
        scale: 0.01
      - usd: "RetroNeighborhood/Props/SM_House_10.prop.usd"
        scale: 0.01
      #
      # LEFT OUT OF `intact` ON PURPOSE — it would be placed as if it were a
      # whole house. See `house_addons` below, which is where it now goes.
      #   SM_House_01_Lot
      #     a lot/ground plane rather than a building (it is tiny beside
      #     SM_House_01), and this scene already lays its own ground:
      #     `suburb_scene.apply_ground` writes block grass, driveways and
      #     asphalt as meshes. Left out rather than guessed at — if it does turn
      #     out to be a house, it can be added in one line.

    # GARAGES AND WINGS — the add-on half of a house, not a house.
    #
    # These were excluded from `intact` because an extension placed as if it
    # were a whole house is a detached fragment standing alone on a lot. That
    # reasoning was right about `intact` and wrong as a conclusion: the answer
    # is not to drop them, it is to COMPOSE, which is what the user asked for
    # ("construct the house as a component ... generate types of houses").
    #
    # `suburb_scene.build_placements` pairs each of these to its parent by the
    # shared stem (SM_House_04_Extension -> SM_House_04) and, when a lot's
    # archetype carries a garage, emits BOTH at the identical transform. That is
    # exactly right and only right there: the extension is authored to sit
    # against its parent in the PARENT'S frame, so the same transform composes
    # the two and any other placement scatters a fragment.
    #
    # Only 3 of the 10 houses ship one, so a garage lot draws its house from
    # this subset rather than uniformly — otherwise 7 lots in 10 marked "garage"
    # would render identically to "plain" and the archetype stays invisible.
    house_addons:
      - usd: "RetroNeighborhood/Props/SM_House_04_Extension.prop.usd"
        scale: 0.01
      - usd: "RetroNeighborhood/Props/SM_House_06_Extension.prop.usd"
        scale: 0.01
      - usd: "RetroNeighborhood/Props/SM_House_10_Extension.prop.usd"
        scale: 0.01

    # Wooden house ruins (Nucleus, authored in cm). Split by *measured* height
    # against an intact bungalow's ~6.4 m: walls still standing reads as
    # damaged, collapsed below roof height reads as destroyed. Their footprints
    # run 18-33 m, wider than the 12 m houses they replace — which is right,
    # since a wrecked house throws its debris well past its own slab.
    damaged:
      - usd: "Muyang/WoodenHouseRuins/Assets/SM_house_ruins_002.usd"
        scale: 0.01     # 7.7 m tall
      - usd: "Muyang/WoodenHouseRuins/Assets/SM_house_ruins_004.usd"
        scale: 0.01     # 9.0 m tall
      - usd: "Muyang/WoodenHouseRuins/Assets/SM_house_ruins_005.usd"
        scale: 0.01     # 6.4 m tall
      - usd: "Muyang/WoodenHouseRuins/Assets/SM_house_ruins_006.usd"
        scale: 0.01     # 6.5 m tall
      - usd: "Muyang/WoodenHouseRuins/Assets/SM_house_ruins_007.usd"
        scale: 0.01     # 8.9 m tall
      - usd: "Muyang/WoodenHouseRuins/Assets/SM_house_ruins_010.usd"
        scale: 0.01     # 6.9 m tall

    destroyed:
      - usd: "Muyang/WoodenHouseRuins/Assets/SM_house_ruins_001.usd"
        scale: 0.01     # 5.8 m tall
      - usd: "Muyang/WoodenHouseRuins/Assets/SM_house_ruins_003.usd"
        scale: 0.01     # 3.1 m tall
      - usd: "Muyang/WoodenHouseRuins/Assets/SM_house_ruins_008.usd"
        scale: 0.01     # 5.8 m tall
      - usd: "Muyang/WoodenHouseRuins/Assets/SM_house_ruins_009.usd"
        scale: 0.01     # 5.2 m tall
      # The one timber-frame collapse Objaverse had: down on its slab with
      # planks thrown clear.
      - usd: "objaverse://a0c01ce35a474545b805c0739806aace"   # Abandoned House
        target-size-m: 12

  debris:
    # Wood-frame wreckage: lumber and snapped limbs. Instanced by the hundred,
    # so both are deliberately low-poly.
    pieces:
      - usd: "objaverse://1b31413d89a4485e93f4bdb9eb735d88"   # Planches - Planks (weathered, scattered), 512 faces
        target-size-m: 2.5
      - usd: "objaverse://2341e9c2456f4876b2e86a9465724b0d"   # Planks Of Wood (fresh lumber), 534 faces
        target-size-m: 2.2
      - usd: "objaverse://aedb8f44f78944c7a1d53ff14c6d3290"   # Wood Stick 08 Remesh (snapped limb), 430 faces
        target-size-m: 2.5
        fit: max          # scanned standing on end, so pin its length, not its
                          # plan — footprint would stretch it into a 7 m spike.
                          # Debris is dropped and physics-settled, so it lands flat.

    # Scraped earth and mounded rubble — the other half of the aftermath.
    piles:
      - usd: "objaverse://b3b11017332040d6b717839c07a782c4"   # Large Dirt Pile, 200 faces
        target-size-m: 3.0
      - usd: "objaverse://107f6a1f6aa74449bcd32ef136311d86"   # A pile of sand (dark soil mound)
        target-size-m: 3.0
      - usd: "objaverse://042bc78e7d1d4275b3cd87e97f35d11c"   # Low Poly Heap of construction debris
        target-size-m: 3.5
      - usd: "objaverse://0ab5415789a1454a925d82f0650910ff"   # Heap of construction old debris
        target-size-m: 3.0
      - usd: "objaverse://c7544d9183c24ed3a716f8255536afa8"   # Roof Rubble Pile Debris Tiles (flat scatter)
        target-size-m: 4.0

  # ---- KERB FURNITURE: fewer models, repeated ---------------------------------
  # HOW THE OVERRIDE WORKS, because getting it wrong is silent: asset sets merge
  # through `scene_generator._merge_asset_set`, where a key written `<name>+`
  # APPENDS to the inherited list and a bare `<name>:` REPLACES it outright.
  # These three are written bare on purpose — the point is to own the pool, not
  # to add to it. `resolve_asset_set` prints the chain it merged
  # (`suburban_v2.yaml <- suburban.yaml <- shared.yaml`) at startup, and the
  # resolved lengths are 1 / 2 / 1 rather than shared.yaml's 4 / 8 / 1.

  # ONE streetlight. Chosen off the live stage, not from the list: the pole at
  # /World/stage/generated/streetlight_43_27606 is this asset, and it is the one
  # that belongs on a residential street — RetroNeighborhood is the pack the
  # suburban sky and driveways already come from, so it is the art family this
  # scene is built in. Scale and yaw carried over verbatim from shared.yaml
  # (cm-authored; the arm points +Y, hence the quarter turn).
  #
  # Dropped, all three of them Dmytro/ModernCityEnvironment01, for urban_v2's
  # stated reason — several unrelated lamp families on one street is what reads
  # as generated, and a city buys one pole and repeats it:
  #   SM_Lamp_002, SM_Lamp_005   modern city posts, a second art family
  #   SM_Lamp_006                the same, and the only `park`-tagged lamp in
  #                              the chain. Losing the tag is a known and
  #                              accepted consequence: `parks.py` asks for
  #                              `tag="park"` and FALLS BACK to the whole pool,
  #                              so park trails get this pole instead — which is
  #                              what a suburban park has anyway. `build_city`'s
  #                              park-trail lamp pass does not fall back and
  #                              simply places none.
  streetlights:
    - usd: "RetroNeighborhood/Props/SM_StreetLight.prop.usd"
      scale: 0.01
      yaw-offset: 90.0

  # TWO bins where shared.yaml had eight, split by ROLE rather than by taste: a
  # suburb's kerb carries a DOMESTIC wheelie bin, and the civic litter bin is
  # the park one. That is the opposite of the downtown answer — urban_v2 kept
  # the civic bin for the kerb and threw the domestic ones out.
  #
  # Both are Nucleus. The obvious third, the AEC brownstone dustbin this repo
  # already uses in `suburban_v2.yard_props` (0.51 x 0.51 x 0.73 m, 630 pts), is
  # deliberately NOT here: the AEC packs are git-ignored vendor content, and the
  # plain `suburban` set is the one that has to run without them. It stays a
  # yard prop, where suburban_v2 already depends on the packs anyway.
  #
  # Dropped, with urban_v2's measured reasons carried across:
  #   SM_MTrashCan            black commercial rectangular bin — alley, not kerb
  #   SM_Bin_003_01, _003_02  recolours of SM_Bin_003, one model in three
  #                           paint jobs; keeping one recolour is the whole rule
  #   SM_Bin_006              green 4-wheel COMMUNAL dumpster — a flat block's
  #                           bin store, not a single-family kerb
  #   SM_Bin_004              a fourth kerbside model with no role left once one
  #                           wheelie bin is kept. Dropped as surplus variation;
  #                           no defect is claimed against it.
  #   CityPark SM_Small_Trash_can   the park bin, replaced by SM_MLitterBin
  #                           below. urban_v2 records the CityPark bin as 1.27 m
  #                           wide — out of scale beside a 0.6 m civic bin.
  #   Muyang garbageCan       a third art family for a prop this scene places at
  #                           most a few dozen of.
  trash_cans:
    - "Dmytro/Assets/Game/ModernCityEnvironment01/Meshes/SM_Bin_003.usd"
      # Blue two-wheel wheelie bin — the bin a house actually puts out. One
      # recolour of the three shared.yaml carries.
    - usd: "Dmytro/Assets/Game/ModernCityEnvironment01/Meshes/SM_MLitterBin.usd"
      tags: ["park"]
      # 0.60 x 0.60 x 0.91 m, 759 pts (measured in urban_v2, where it is THE
      # street bin). Kept only as the park/verge civic bin, so the tag pools in
      # `build_city` and `parks.py` still have something to select — and so a
      # domestic wheelie bin never turns up on a park trail.

  # UNCHANGED AT ONE, and stated here rather than left implicit. shared.yaml
  # already carries exactly one hydrant model, so there is nothing to cut — a
  # municipality buys one pattern, which is the same rule as the pole and the
  # bin. Pinned explicitly so a later edit to shared.yaml cannot widen it
  # silently.
  #
  # NOT appended: urban_v2's `fire_hydrants+` AEC hydrant
  # (brownstone/Props/Hydrant, 0.56 x 0.52 x 1.62 m). It is a second art family
  # bought for nothing — hydrants sit at 240 m here (IFC 400 ft hose lay), so
  # the whole suburb places a few dozen and none of them is ever seen beside
  # another.
  fire_hydrants:
    - usd: "RetroNeighborhood/Props/SM_FireHydrant.prop.usd"
      scale: 0.01
