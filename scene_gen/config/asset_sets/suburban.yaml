# The suburban asset set — everything a suburban scene builds with.
#
# `extends: suburban_nucleus`: the Nucleus-only subset it layers on. That split is
# by SOURCE, not by version — suburban_nucleus needs no pre-flight and works
# offline, this adds the Objaverse and AEC content that does. Point a
# config at `suburban_nucleus` to build without either.
#
# Extends it so the houses and existing props come across unchanged and this
# file only adds what the new passes consume. Nothing in `suburban_nucleus.yaml`
# or `shared.yaml` is edited, so the old scene keeps working.
#
# `<key>+` appends to the inherited pool; a bare key REPLACES it.
#
# MEASURE BEFORE ADDING. Two lessons carried from the urban set:
#   * Material binding is per GEOMSUBSET on every UE-exported asset in this
#     library. A per-Mesh ComputeBoundMaterial reports the whole library as
#     unbound and is wrong; use tools/material_binding.py.
#   * `scale` is per asset, never global. The CityPark stones are authored 10x
#     apart from each other, so one shared scale made two of them enormous and
#     two of them pebbles. Derive each from its own measured bbox.

extends: suburban_nucleus

fallback_sizes:
  # Only bites when `measure_usds` is off or a measurement fails — but without
  # an entry a category silently takes the generic 4.0 x 4.0 m default, so a
  # stop sign would reserve four metres of verge and every clearance test around
  # it would be wrong. Same value and reason as urban_v2. `house: [12, 12]` from
  # suburban.yaml survives this block: asset sets merge nested dicts key by key.
  sign: [0.4, 0.08, 2.4]

usds:
  # A NARROW walk, and only where one exists at all. The paved ring is one tile
  # wide and build_city takes that width as max(tile.sx, tile.sy), so the tile
  # scale IS the walk width — there is no separate knob, and city_detail.zones
  # in the preset must sum to match. 5.00 m authored x 0.30 = 1.50 m, the usual
  # residential minimum, against 3.5 m in the urban scene.
  tiles:
    sidewalk:
      usd: "Dmytro/Assets/Game/ModernCityEnvironment01/Meshes/SM_GroundModule01.usd"
      scale: 0.30         # 5.00 x 5.00 m authored -> 1.50 m walk

  # ---- GROUND MATERIALS  (owner: suburb_scene.apply_ground) ------------------
  # Overrides shared.yaml's single Nucleus `grass` for THIS set only; the urban
  # set keeps the shared entries. Dicts merge key by key, so `asphalt` is still
  # inherited from shared.yaml and is deliberately not repeated here.
  #
  # These are LOCAL, out of the NVIDIA AEC Brownstone pack, which ships ground
  # materials as bare `.mdl` modules with no USD alongside them. `_load_mat`
  # binds `UsdShade.Material` at the prim the value names, so an `.mdl` cannot
  # be named directly -- each entry points at a hand-authored wrapper layer
  # under `scene_gen/assets/materials/` whose default prim IS the Material. See
  # Grass_Cut.usda for the full reasoning.
  #
  # The pack has exactly TWO grasses, so `grass_park` and `grass_rough`
  # necessarily share Grass_Countryside. What matters is that both differ from
  # the mown `grass` on the lawns -- the park is not supposed to read as an
  # extension of the front yards.
  materials:
    grass: "airstack://scene_gen/assets/materials/Grass_Cut.usda"
    grass_rough: "airstack://scene_gen/assets/materials/Grass_Countryside.usda"
    grass_park: "airstack://scene_gen/assets/materials/Grass_Countryside.usda"
    dirt: "airstack://scene_gen/assets/materials/Dirt.usda"
    mulch: "airstack://scene_gen/assets/materials/Mulch_Brown.usda"

  # ---- LOT FURNITURE  (owners: suburb_lots.py, suburb_scene.build_placements)
  # Fences run as MODULES butted end to end along a lot boundary, so what each
  # entry has to supply is the module length and which axis the art runs along.
  # The length is read from the measured footprint at run time, taking `sx` or
  # `sy` according to `yaw-offset` — an asset running along +Y without the
  # offset would have its 0.33 m rail THICKNESS taken as the module length and
  # be laid forty times over.
  #
  # EVERY ENTRY IS A PLAIN, CONTINUOUS PANEL. Nothing here may be a gate, a
  # doorway, a post on its own, or a "pack" of loose pieces, and that is the
  # single most important rule in this pool: `_fence_run` repeats ONE module
  # end to end, so anything the module contains repeats every few metres, and
  # any air the module contains becomes a hole every few metres. The pool
  # carried "Wooden Fence" (objaverse bd8afe2fa6c24d238a761bc4751ebb03) for
  # exactly this reason and it was wrong — its 5.95 m bbox is a lone post, a
  # gap, a 3.3 m picket panel, another gap and a solid plank GATE LEAF, so a
  # tiled run read as panel/gate/panel/gate with a metre of nothing between
  # each. It is removed, not re-tagged.
  #
  # `tags` are which boundary a module may serve. A house draws ONE asset for
  # its whole perimeter (`suburb_scene._fence_pick`), so "privacy" now means
  # "may fence a lot at all" and every entry that can carries it; "low" means
  # additionally short enough for the FRONT yard. US municipal codes cap a
  # front-yard fence far lower than a rear one — 3.5 ft front / 8 ft rear
  # (Portland Title 33 §33.110.275.C), 3.5 / 7 ft (Junction City OR JCMC
  # 17.95.020), 4 / 6 ft (Taylor AZ TTC §18.60.050) — and `suburb_scene` also
  # re-derives that cap from the MEASURED height (`_FRONT_FENCE_MAX_H_M`, 4 ft),
  # so a tag that disagrees with the art loses.
  lot_fences:
    # ORNAMENTAL IRON — 0.99 m = 3.2 ft, inside every front-yard cap above, and
    # a plain repeating rail with no gate in it. Measured in the urban set,
    # where parks.py already runs it as a park railing; 1,528 pts a module, the
    # cheapest fence in either library. Art runs along +Y, hence the yaw-offset.
    # TAGGED FOR BOTH BOUNDARIES because the pick is now per HOUSE: an entry
    # tagged "low" alone could never be drawn, since a house chooses its asset
    # from the set that can fence a side or rear line. A 3 ft rail right round a
    # lot is the "open" identity — common on tighter and older US lots — and its
    # 5.28 m module is the one that reads as a long run rather than as pickets.
    - usd: "Dmytro/Assets/Game/Downtown_West/Assets/props/prop_park_railing/SM_prop_park_railing_rail_a.usd"
      scale: 1.0          # 0.33 x 5.28 x 0.99 m, 1,528 pts
      yaw-offset: 90.0
      tags: ["low", "privacy"]

    # CLOSE-BOARD — the standard US side and rear fence, and the replacement for
    # the gate kit described above. One continuous wall of vertical boards on
    # two cross-rails: no gate, no free-standing post, no void, so a tiled run
    # is a continuous fence.
    # SIZED FROM THE SOURCE GLB host-side before it was converted (no trimesh
    # here — the glTF accessor min/max pushed through the node matrices):
    #   36.4 x 879.9 x 1688.0 in source units = 1.918 : 1 length : height,
    # so pinning the longest PLAN dimension at 3.51 m puts the height at
    # 3.51 / 1.918 = 1.83 m — 6 ft exactly, the bottom of the 6-8 ft side/rear
    # band every code above allows. MEASURED AFTER CONVERSION, which is what
    # the pass actually reads: 3.51 x 0.077 x 1.830 m, 312 faces. Runs along
    # +X, which is what the pass asks for, so NO yaw-offset.
    # LICENCE: plain CC-BY, deliberately. The better-looking candidate for this
    # slot (objaverse 1db7df90…, a painted plank wall at 3.02:1) is CC-BY-NC,
    # and every other asset in this repo's manifest is `by` or `by-sa` — a
    # non-commercial clause on a fence that appears on 60% of the lots is not
    # worth the redistribution question.
    - usd: "objaverse://1cec32aea61e4959bb1ba9a79ada7cd5"   # "Wood fence", CC-BY
      target-size-m: 3.51   # pins the longest PLAN dimension; height follows
      points: 888
      tags: ["privacy"]

    # PICKET — the classic small-lot fence, and a short enough module that a
    # 15 m boundary takes seven of them rather than three, so the run reads as
    # pickets rather than as panels. One plain panel, no gate.
    # MEASURED AFTER CONVERSION: 2.00 x 0.09 x 0.96 m, base -0.001, 1,558 pts.
    # 0.96 m = 3.1 ft, inside the 3.5-4 ft front-yard cap, so this is the entry
    # that actually closes a front yard. Tagged for both boundaries for the same
    # reason as the rail: the pick is per house. Runs along +X.
    - usd: "objaverse://9c2fb0b1afaa450f97ac9f6217ed6dc9"   # "HandPainted Fence", CC-BY
      target-size-m: 2.0
      points: 1558
      tags: ["low", "privacy"]

    # POINT BUDGET. On the GRAPH path `fence` is one of `suburb_scene`'s default
    # `instance_categories`, so N modules cost one prototype plus N transforms;
    # the RECT path (`build_city`) passes no instance categories and still pays
    # N x `points`. A 1600 x 1200 m suburb runs roughly 2,000-3,000 modules once
    # the compact neighbourhoods are fenced, which un-instanced is 4-7M points
    # against the ~89M ceiling the urban scene OOM-killed at. The levers, in
    # order: `fence.chance` per neighbourhood type in the preset, then which
    # boundaries a type fences, then `module_gap_m` (a gappy fence is worse than
    # no fence, so it is last).

  # Driveway paving. The pass repeats and STRETCHES a tile from the house out
  # across the verge and sidewalk to the kerb, so the authored tile size only
  # sets how far the texture stretches, not the fit — a driveway is 3.0-5.5 m
  # wide and nothing in the library is. Entries must NOT carry `yaw-offset`:
  # the stretch is applied in the asset's own frame, before yaw.
  driveway_tiles:
    # The library's actual driveway art, and it already resolves — shared.yaml
    # uses it as the park trail tile, which is what urban_v2 called out as wrong
    # there. Here it is being used for what it is.
    # UNVERIFIED: size not measured — Nucleus needs Kit and the container was
    # off limits for this work. The stretch tiler does not depend on it.
    - usd: "RetroNeighborhood/Props/SM_DriveWay_01.prop.usd"
      scale: 0.01         # RetroNeighborhood is authored in cm


  # ---- TREES: TWO POOLS, TWO JOBS  (owners: suburb_scene.py, city_detail) ----
  # A street is not planted with what a back garden is planted with, and a real
  # neighbourhood repeats a few species rather than showing one of everything.
  # So the vegetation is split by ROLE, and `suburb_scene.build_placements`
  # chooses between the two on the `kind` suburb_parcel stamps on every tree:
  #
  #   street_trees   kind "street" (the verge rhythm) and kind "front" — modest
  #                  crowns only, nothing that reaches out over the carriageway.
  #                  Also the pool city_detail's street_trees pass reads, though
  #                  the suburban preset holds that at `spacing_m: 0.0` because
  #                  the planting belongs to the yard.
  #   trees          kind "back", block interiors, park scatter and build_city's
  #                  lawn pass — OPEN SPACE, where a 25 m crown is a specimen
  #                  rather than an obstruction. `parks.py` still pulls its
  #                  stumps out of this pool by tag, so they stay in it.
  #
  # `yard_trees` below is a third pool: the composed per-lot planting, and the
  # only one of the three that carries a point budget and sampling weights.
  #
  # `trees` REPLACES the inherited pool (no `+`), and that is the whole point.
  # shared.yaml's 14 entries are RetroNeighborhood SM_Tree_01..07 and CityPark
  # SM_Tree_01/_03/_04/_05/_08 — every one of which urban_v2 and this file's own
  # yard_trees note already record as REJECTED BY NAME AND NOT TO BE
  # REINTRODUCED. Inheriting them is how the suburb ended up planted with one of
  # everything, including species already turned down for the urban scene.
  #
  # COST, MEASURED. Every tree left in the library is AEC archviz vegetation at
  # 49-305k points; urban_v2 records the search that established there is no
  # cheap bound green tree anywhere in it. Swept host-side against the shipped
  # graph preset (config/presets/suburb_net.yaml, seed 3, 1600 x 1200 m),
  # suburb_parcel emits 1,974 street trees, which at ~55k each is ~109M points
  # UN-INSTANCED, against the 89.1M that OOM-killed the urban scene. It is not
  # un-instanced any more on the graph path: `tree` is one of `suburb_scene`'s
  # default `instance_categories`, so a species costs its points ONCE and the
  # copies are transforms. The RECT path (`build_city`) passes no instance
  # categories and does still pay per copy, so this pool is only affordable
  # there at low density.
  #
  # `build_placements` draws UNIFORMLY and charges NO budget — unlike
  # `suburb_yardplan`, which has a purse. The one live density lever is
  # `suburb_parcel.street_tree_spacing_m` [16, 30] in suburb_net.yaml; the front
  # and back tree knobs beside it are inert, because yardplan owns yard
  # planting.
  street_trees:
    - {usd: "airstack://scene_gen/assets/aec/tower/Assets/Vegetation/Shumard_Oak/Shumard_Oak.usd", scale: 0.01}
      # 10.29 x 10.47 x 11.43 m, 54,766 pts, 4/4 bound, 0% unbound, oakleaves1
      # green. A ~10 m crown clears a 9-11 m residential carriageway from a
      # verge set back 2.6 m; this is urban_v2's primary street tree.
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Trees/Douglas_Fir.usd", scale: 0.01}
      # 3.02 x 2.77 x 6.03 m, 56,262 pts, 8/8 bound, pine_needles 100% green.
      # The narrowest crown in the library and the only evergreen — the one tree
      # that fits between a driveway and a kerb without being shrunk.
      # "8/8 bound" WAS TRUE AND STILL MISSED A DEFECT: branchM bound a
      # Default_Material whose MDL module is not in the pack, so 99 points
      # rendered unshaded on a perfect bind count. Repointed at the trunk's own
      # TreeBark_10; now 3/3 materials resolve. A bind count cannot see this —
      # tools/measure_assets.py `mdl` column can. Patch is vendor-side and a
      # re-extract undoes it: scene_gen/assets/aec/README.md.
    #
    # TWO SPECIES, NOT THREE, AND THE LIBRARY IS THE REASON. Every other tree in
    # it is excluded by urban_v2 on a measured defect or on cost, and those
    # exclusions are carried across verbatim rather than re-litigated:
    #   Black_Oak        48,701 pts — the CHEAPEST bound green tree there is,
    #                    and still out: 19.7 m tall with a 25.4 m crown is a
    #                    park specimen, not a kerb tree — it would overhang the
    #                    whole carriageway. It is in `trees` below, which is
    #                    exactly where urban_v2 put it.
    #   Largetooth_Aspen 197,775 — right shape for a kerb (5.1 x 5.2 m crown),
    #                    priced out. urban_v2 excluded it from street_trees on
    #                    cost at 631 trees; this scene plants 1,974.
    #   Common_Apple     237,356 — likewise: a 5.9 m crown at 4.3x the cost of
    #                    the oak. Kept as a rear-garden accent in `yard_trees`.
    #   American_Beech   305,126, Honey_Locust 331,786, Hawthorn 596,296 —
    #                    urban_v2's street exclusions on cost, unchanged.
    #   White_Ash        66k — binds ashtree_leaves_fall1: an AUTUMN variant.
    #   Service_Berry    84k — 48.0% of faces unbound, renders half white.
    #   Scarlet_Oak / _fall  40k — 35.5% of faces unbound; _fall is also red.
    #   Dogwood 184k red, Japanese_Cherry 255k all-blossom — measured in
    #                    yard_trees below and rejected there for the same reason.
    #   Blue_Berry_Elder — the one AEC species nobody has measured. NOT added on
    #                    a guess; measure it with tools/measure_assets.py +
    #                    material_binding.py first.
    # The Nucleus alternatives are not available either: every SM_Tree* in the
    # chain is rejected by name (see the `trees` note above).

  trees:
    - {usd: "airstack://scene_gen/assets/aec/tower/Assets/Vegetation/Black_Oak/Black_Oak.usd", scale: 0.01}
      # 25.42 x 24.07 x 19.74 m, 48,701 pts, 10/11 bound, 0.2% unbound (123 pts,
      # one branch stub), oakleaves1 100% green. THE reason this pool exists:
      # banned from the kerb for its crown, and the best thing in the library
      # standing in the middle of a block or a park.
    - {usd: "airstack://scene_gen/assets/aec/tower/Assets/Vegetation/Shumard_Oak/Shumard_Oak.usd", scale: 0.01}
      # 10.29 x 10.47 x 11.43 m, 54,766 pts. In both pools deliberately — a
      # species that lines the street and also stands in the open is what makes
      # a neighbourhood read as one place rather than two.
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Trees/Largetooth_Aspen.usd", scale: 0.01}
      # 5.09 x 5.20 x 7.89 m, 197,775 pts, 2/2 bound, aspenleaf 99.9% green.
    - {usd: "airstack://scene_gen/assets/aec/tower/Assets/Vegetation/Common_Apple/Common_Apple.usd", scale: 0.01}
      # 5.86 x 5.23 x 5.59 m, 237,356 pts, 2/2 bound, apple_leaf 100% green.
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Trees/American_Beech.usd", scale: 0.01}
      # 4.09 x 4.01 x 5.97 m, 305,126 pts, 2/2 bound, beech_leaf 100% green.
      # Five species: two that carry the canopy and three that are only ever a
      # few trees each. The expensive three are affordable HERE and not on the
      # street because an open-space pass places hundreds where a kerb places
      # thousands.
    # BLACKLISTED, both sets: the three CityPark stumps. They were kept here so
    # `parks.py` could select them by tag ("stump"), but every other consumer --
    # frontage planting, yard planting, open-space scatter -- draws from `trees`
    # WITHOUT filtering tags, so a stump got planted as a tree (SM_Stump_03 was
    # found standing in a lawn). Removed rather than re-tagged: `parks.py` falls
    # back to the whole pool when a tag matches nothing, so it degrades to
    # ordinary trees rather than breaking. Re-add only behind a pool of their own.
    #   CityPark/Props/SM_Stump.prop.usd
    #   CityPark/Props/SM_Stump_02.prop.usd
    #   CityPark/Props/SM_Stump_03.prop.usd

  # ---- YARD PLANTING  (owner: suburb_yards.py) -------------------------------
  # Front yards and back yards want different material: a front yard is kept and
  # visible, a back yard is where the shed and the bigger shrubs go. Which pool
  # an entry lands in is decided by `tags` and by its MEASURED height — the pass
  # picks a foundation shrub by asking for 0.4-1.8 m, not by name.
  #
  # TWO EXTRA KEYS THIS PASS READS, both ignored by `_parse_usd_entry`:
  #
  #   points:  the asset's measured Mesh point count. NOT decoration:
  #            `suburb_yards.point_budget` is enforced against the sum, and an
  #            entry with no `points` is treated as costing 0 and will silently
  #            break the budget. Measure before you add. (The budget is a
  #            worst-case: on the graph path yardplan emits under `tree` and
  #            `plant`, both of which `suburb_scene` instances, so the stage
  #            pays less than the purse charges.)
  #   weight:  relative sampling weight. This is how the library's handsome
  #            species stay usable: they cost 4-6x the cheap ones, so they are
  #            carried as rare accents rather than dropped or allowed to eat the
  #            whole budget.
  #
  # ALL MEASURED WITH tools/measure_assets.py AND tools/material_binding.py at
  # scale 0.01 (every AEC asset is centimetre-authored, Z-up). Sizes below are
  # x * y * z in metres AT THAT SCALE — which is what the pass then rescales
  # per asset from its own bbox, never by a shared multiplier.
  #
  # SEASON WAS TRACED THROUGH THE BOUND MATERIAL: material_binding gives the
  # bound MDLs, the MDL's own `texture_2d(...)` gives the albedo, and the
  # albedo's green share over alpha-masked pixels gives the season. Sampling a
  # leaf PNG alone proves nothing — an asset can measure green and render white.

  # 6 species where the scene had 2. Every one: bound (GeomSubset-aware), green,
  # and affordable enough to be worth its place. The three at the top carry the
  # planting; the three accents are 4-6x the cost and are weighted to about one
  # tree in twenty-five.
  yard_trees:
    - {usd: "airstack://scene_gen/assets/aec/tower/Assets/Vegetation/Black_Oak/Black_Oak.usd", scale: 0.01,
       points: 48701, weight: 1.0, tags: ["rear"]}
      # 25.42 x 24.07 x 19.74 m — the biggest thing in the pool, and the pass
      # scales it down per placement from this measured height. 10/11 meshes
      # bound, 0.2% of faces unbound (123 points, one branch stub) — the same
      # asset and the same defect urban_v2 already ships. Leaves oakleaves1,
      # 100% green.
    - {usd: "airstack://scene_gen/assets/aec/tower/Assets/Vegetation/Shumard_Oak/Shumard_Oak.usd", scale: 0.01,
       points: 54766, weight: 1.0, tags: ["front", "rear"]}
      # 10.29 x 10.47 x 11.43 m. 4/4 bound, 0% unbound. Mixed canopy by design:
      # oakleaves1 (100% green) on three leaf materials, oakleaves2 (100%
      # yellow) on the fourth — an oak turning, not an autumn asset.
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Trees/Douglas_Fir.usd", scale: 0.01,
       points: 56262, weight: 0.8, tags: ["front"]}
      # 3.02 x 2.77 x 6.03 m. 8/8 bound, 0% unbound, 3/3 mdl resolve (only after
      # the branchM patch — see the street_trees entry above), pine_needles 100%
      # green. An EVERGREEN, which is what a front yard actually has and what
      # neither oak can give — and the narrowest crown in the pool, so it is the
      # one tree that fits a shallow front garden without being shrunk.
    # ---- accents: 4-6x the cost --------------------------------------------
    # Weighted to buy about 15 of them in 500 lots, at a measured cost of 12% of
    # the total tree count (302 trees with accents at 0.30, against 341 at 0.04
    # for two accents). One tree in twenty-five is a species you do not
    # otherwise see, for one canopy in eight.
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Trees/Largetooth_Aspen.usd", scale: 0.01,
       points: 197775, weight: 0.30, tags: ["rear"]}
      # 5.09 x 5.20 x 7.89 m. 2/2 bound. aspenleaf 99.9% green — a Brownstone
      # deciduous that is NOT autumn, checked rather than assumed.
    - {usd: "airstack://scene_gen/assets/aec/tower/Assets/Vegetation/Common_Apple/Common_Apple.usd", scale: 0.01,
       points: 237356, weight: 0.30, tags: ["rear"]}
      # 5.86 x 5.23 x 5.59 m. 2/2 bound, apple_leaf 100% green. A fruit tree,
      # which is a back-garden thing and nothing else in the library is.
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Trees/American_Beech.usd", scale: 0.01,
       points: 305126, weight: 0.20, tags: ["front", "rear"]}
      # 4.09 x 4.01 x 5.97 m. 2/2 bound, beech_leaf 100% green.
    #
    # MEASURED AND REJECTED, each on a number:
    #   Dogwood            184k  3.1 x 3.0 x 3.4  — all FOUR bound leaf
    #     materials resolve to red albedos (dogwood_leaf 99.7% red, _v2 95.1%,
    #     _v3 79.1%, _v4 99.8%). A red ornamental, not the green small-tree
    #     specimen its size and price suggest — it binds cleanly and is the
    #     right shape, so only tracing the MDLs catches it.
    #   Japanese_Cherry    255k  4.9 x 5.7 x 4.6  — binds ONLY
    #     JapaneseCherry_blossom_Mat (87.9% pink) and bark3: no green leaf
    #     material at all, so the whole canopy is blossom. Correct for a cherry
    #     in bloom, but at 255k it buys one pink tree for five green ones.
    #   Honey_Locust       332k  6.8 x 7.0 x 8.2  — leaf albedo is half green,
    #     half yellow-orange; borderline, and priced out regardless.
    #   Hawthorn           596k  9.5 x 7.2 x 8.6  — green and clean, 12x the
    #     cheapest tree. Unaffordable at yard density.
    #   Scarlet_Oak / _fall 40k  — 35.5% of faces unbound, renders white.
    #   White_Ash           66k  — binds ashtree_leaves_fall1: autumn.
    #   Service_Berry       84k  — 48.0% of faces unbound.
    # Rejected by name and NOT reintroduced: every Dmytro SM_Tree*, every
    # Muyang/DownTown Tree_A/B/C, RetroNeighborhood SM_Tree_01..07, CityPark
    # SM_Tree_03/_04/_05/_08.

  # Shrubs and ground cover. THIS POOL IS WHERE THE LIBRARY HURTS: it has no
  # cheap shrub. Below 34k points everything is a lawn tuft, and the cheapest
  # thing that reads as a bush from a metre away is Meadowlark at 83k. The
  # weights are therefore doing real work — the tufts carry the ground cover and
  # the shrubs are rationed.
  yard_shrubs:
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Shrub/Grass_Trimmed_C.usd", scale: 0.01,
