# ASSET SET: urban_quake_v4 — `urban_quake_v3` PLUS the 31 GreatAmericanCity
# (GAC) merged buildings, each swapped at assembly for its OWN per-building
# earthquake bake instead of a size-matched kit twin.
#
# WHY A NEW SWAP MECHANISM, NOT ANOTHER `same_art` ENTRY: `urban_quake_v3`
# added the three ModernCityEnvironment originals, which get a size-matched
# KIT TWIN (`kit_substitute.route()`'s `same_art` outcome — MBuilding01 ->
# `commercial_mid`, etc.) because MCE *is* the kit's own art, re-assembled
# (`kit_substitute.py`'s module docstring). GAC is a DIFFERENT pack with its
# own real (if unnamed) parts — `route()` sends it to `'slice'`, never
# `'kit'` (see `kit_substitute.check()`'s own GAC assertion) — so there is no
# honest kit stand-in for a GAC building at all. The fix, landed this round
# in parallel, is a per-building bake: `disaster.quake.decide_gac_building`
# swaps a damaged GAC placement for ITS OWN quake bake at
# `scene_gen/assets/gac_quake/gac_<name>_<grade>_s<seed>.usd` — see
# `_plans/earthquake_round5_plan.md` and `decide_gac_building`'s own
# docstring in `disaster/quake.py`. A GAC building with no bake at any grade
# (the bakes do not exist on this host yet) is left pristine and falls
# through to `_mono_pass`'s rigid lean/ruin fallback, exactly like a
# same_art building `route()` refused — "as today", nothing regresses.
#
# `extends: urban_quake_v3`: every pool v3 already owns (the three MCE
# originals + five fire-proven kit DG0 styles) rides through unchanged.
# ONLY `midrise` and `tower` gain entries here, and they gain them with `+`
# (APPEND), not a bare key — v3's own header explains why a bare key would
# be wrong: it REPLACES the inherited pool rather than adding to it, which
# is exactly the mistake that once collapsed the greenery pools to nothing
# (`urban_gac.yaml`'s own warning, same trap). `rowhouse` and `intact` gain
# nothing: no GAC building is anywhere near the ~21 m party-wall depth
# `rowhouse` needs, and `intact` is pre-rezone filler that v3 itself never
# put its own towers into either.
#
# WHICH POOL EACH BUILDING GOES IN: BY MEASURED HEIGHT, split at 45 m — the
# gap `urban_quake_v3` itself left open (its own `midrise` tops out at 29 m,
# MBuilding01; its own `tower` starts at 62.4 m, MBuilding05). Only two of
# the 31 GAC buildings fall in the old midrise range (`_02` at 38.6 m,
# `_24` at 43.2 m); every other one — 40.3 m up past 300 m — goes in `tower`.
# `tower`'s own typology caps `height_max_m` at 65 in `downtown_earthquake`
# (mirroring `midrise`'s draw), so the tallest GAC entries (`_16` at 312 m,
# `_31` at 302 m) are listed here exactly as MBuilding02 already is at
# 68.7 m against the same 65 m cap — they simply get selected far less often
# than the shorter members of the pool, and `_31`'s 60.3 x 142.2 m footprint
# (see `urban_gac.yaml`'s own note: "no ordinary downtown block holds it")
# means it will rarely if ever actually fit a `tower` block here. That is
# not a bug to work around in THIS file: `urban_gac.yaml`'s own `highrise`
# typology exists precisely to give those extreme towers a district sized
# for them, and `downtown_earthquake` (unlike `downtown_gac`) defines no
# such typology — adding one is a PRESET change, out of scope for an asset
# set. `tools/layout_dry_run.py --asset-set urban_quake_v4` reports what
# actually gets placed; that report, not a guess here, is the bake shopping
# list.
#
# CONSTRUCTION TYPE (the `material:` tag `disaster.quake._same_art_material`
# reads — `quake_flow.FAMILY_TYPE`'s urm / rc / rc_glass vocabulary, NOT a
# texture name): `gac_buildings.json` carries no construction-type field (it
# is a pure geometry probe — W/D/H/points/tris/subsets), so the tag here is
# read off `urban_gac.yaml`'s OWN classification, which is the closest thing
# to ground truth this repo has for these assets:
#   * urm  (masonry/brick) — the nine `brick_midrise` members PLUS `_01`
#     and `_30` (both also members of that pool, see `urban_gac.yaml`
#     lines 429-484: "GAC's mid rise brick buildings").
#   * rc_glass — the ten `highrise` pool members, called out by name and by
#     measurement in `urban_gac.yaml` (lines 553-627: "GLASS CURTAIN-WALL
#     TOWERS ... metallic 0.82-0.97 with opacity 0.50-0.98").
#   * rc — everything left over (`_08`, `_09`, `_11`, `_12`, `_19`, `_21`,
#     `_22`, `_24`, `_27`, `_28`): plain concrete office/block towers in
#     `urban_gac.yaml`'s `intact+`/`tower+` with neither the brick nor the
#     glass call-out.
#
# `yaw-offset` and `tags` are copied VERBATIM from `urban_gac.yaml` — do not
# re-derive them. They matter here even though `midrise`/`tower` use
# `morphology: pack`, not `terrace`: `districts._pack_free` still hard-rejects
# a `place_mid` (one modelled elevation) asset at a 2+-street-side slot and
# scores every candidate's yaw against its `blank:`/`front:` metadata (see
# `.agents/skills/urban-layout/SKILL.md` and `detail/districts.py::
# _pack_free`'s own docstring) — dropping the tags would not error, it would
# just let a blank wall face the sidewalk.
extends: urban_quake_v3

