# ASSET SET: urban_v2 — `urban` plus the 2026-08-26 building drop.
#
# WHY A NEW FILE AND NOT AN EDIT TO `urban.yaml`
# ----------------------------------------------
# `urban.yaml` is what `downtown.yaml` and `downtown_earthquake.yaml` build
# from, and the earthquake pipeline is mid-flight. This set is purely
# ADDITIVE — `extends: urban`, every pool written `<name>+` — so the two
# existing presets are untouched and byte-for-byte reproducible, and a preset
# opts into the bigger library by naming `asset-set: urban_v2`.
#
# WHERE THE ASSETS LIVE, AND WHY THE URLS ARE ABSOLUTE
# -----------------------------------------------------
# `asset_root` (shared.yaml) is `.../Library/Stages/`, which is where the
# inherited Muyang/Dmytro packs sit. Everything added here was uploaded to the
# PROJECT root instead — `.../Projects/SEI-COA/` — and one config has one
# `asset_root`, so these carry the full `omniverse://` URL. That is the same
# thing `suburban.yaml` does for the RenderPeople rigs, for the same reason.
#
# `airstack://` was deliberately NOT used even though these paths look local.
# It resolves to the repo root unless `AIRSTACK_ASSET_ROOT` is exported, and
# `scene_gen/assets/standalone/` and `scene_gen/assets/downtowncity/` are NOT
# in this checkout — the drop was uploaded to Nucleus, not committed. An
# `airstack://` entry would therefore resolve to a path that does not exist and
# fall through to `fallback_sizes.house` (30 x 20 x 24 m) for every one of
# them, which is a silent wall of identically-sized boxes rather than an error.
#
# EVERY SIZE IN THE COMMENTS IS MEASURED, not copied from the drop file:
# `Usd.Stage.Open` + `UsdGeom.BBoxCache` over Nucleus, standalone pxr, no
# SimulationApp (the recipe is in `_plans/earthquake_asset_catalogue.md` §0).
# All 175 assets read `metersPerUnit = 1`, Z-up, base at z = 0, so NONE of them
# carries a `scale:` — `asset_scale` is already 1.
#
# `material:` is carried through from the drop file where it stated one. This
# repo reads no such key (`_parse_usd_entry` drops what it does not know); it is
# kept because the fracture pipeline on the other branch keys off it, and
# re-judging 100 assets later is worse than carrying the judgement now. Entries
# with no `material:` are the ones nobody has judged.
#
# WHAT IS IN
# ----------
#   tower     +20 selected_citydemo, +4 standalone, +1 DowntownCity  ->  32
#   midrise   +65 selected_citydemo, +13 standalone, +2 DowntownCity ->  93
#   rowhouse  +7 standalone                                          ->  15
#   destroyed +6 standalone ruin towers
#   cars      +11 standalone
#   debris    +34 pieces, +2 piles
#
# The drop file named only 18 of the 20 `selected_citydemo` towers and 2 of its
# 65 midrise blocks. All 87 are taken here (user, 2026-08-26): that folder's
# own README records that every one of them was rendered in Cycles and picked
# by eye, with no two picks sharing a primary facade texture, and they are
# 70-291 MESH POINTS each — the cheapest buildings in the whole library by
# three orders of magnitude (the AEC brownstone is 4.6k, MBuilding02 is 471k). The 63 that the drop left out are the midrise pool.
#
# WHAT IS OUT, AND WHY
# --------------------
# * The 12 DowntownCity `Carved_*` blocks — carved out of a merged mesh rather
#   than authored as buildings (user direction, carried from the drop file).
# * `selected_citydemo/houses/` (2 assets). They are freestanding CityEngine
#   masses, and its README is explicit that nothing in that pack shares a party
#   wall — so they are not terrace units, and `rowhouse` is the only pool a
#   4-8 m building could join here.
# * `city_tower_01..07` and `glass_curved_tower`, listed commented-out below
#   with the drop file's reasons intact.
# * `new_assets/buildings/296.fbx` — a CAD site-plan export, nothing in it
#   reads at the scale a drone sees.
#
# ROW HOUSES: READ THIS BEFORE ADDING ONE
# ---------------------------------------
# The seven standalone terrace houses are 3.9-8.4 m DEEP against the
# brownstones' 21.1 m, and `districts._lay_terrace` sizes a terrace block's
# frontage strips from the pool's depth. It used to take the MINIMUM, which
# with this pool would have set the strip depth to 3.9 m and the admissible
# block short side to [10, 18] m — a band no downtown block is in, so every
# terrace block would have been refused and the rowhouse typology would have
# come out at ZERO with no error anywhere. It now takes the MAXIMUM, which
# leaves the band exactly where the brownstones tuned it and lets the shallow
# houses sit on the same street edge with a deeper back alley behind them.

extends: urban

