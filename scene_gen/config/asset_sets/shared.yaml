# ASSET SET: shared — everything every locale builds with.
#
# Street furniture, greenery, ground tiles, vehicles and people are the same
# whether the scene is a downtown, a suburb or a village: a bench is a bench.
# Only the *buildings* and the *debris they leave* are locale-specific, so those
# live in the sets that extend this one — `urban.yaml` (mid-rise concrete) and
# `suburban.yaml` (detached timber-frame houses).
#
# Don't name this set from a scene config; point at a locale set, which pulls
# this in via `extends: shared`.
#
# Entry forms:  "path.usd"                                (global asset_scale, Z-up)
#           or  {usd: "path.usd", scale: 1.0, axis-up: "Y", yaw-offset: 90}
# Per-asset overrides: scale (unit conversion), axis-up ("Y" for Y-up-authored
# art, fixed via +90° roll), yaw-offset (deg — for art whose front isn't +X;
# added to every computed yaw, e.g. a streetlight arm that points +Y needs -90).
# Relative paths are resolved against asset_root; `objaverse://` and
# `airstack://` resolve to repo-local directories instead (see
# scene_generator.LOCAL_ASSET_ROOTS).
#
# `tags` select *behavior*, not locale — the generator pools on them:
#   park      furniture used only along park trails (never street frontage)
#   sidewalk  benches used only on street frontage
#   tree      planters big enough to hold a street tree
#   stump     trees that are stumps — park scatter only, never potted
#   residential / livery / commercial / rv / vintage
#             what KIND of vehicle an entry is, so a suburban driveway does not
#             draw a taxi — see the `cars` block for the full note
#   glass_separable
#             a vehicle whose glass is its own mesh and can be removed

asset_root: "omniverse://airlab-nucleus.andrew.cmu.edu:443/Library/Stages/"
                            # prefix for relative usds.* paths; URLs / absolute paths pass through
asset_scale: 1              # global unit scale — default fits Dmytro assets (authored in meters);
                            # RetroNeighborhood assets override to 0.01 (authored in cm) below

# sky: equirect HDRI (.exr/.hdr) applied to the dome light, OR a stage .usd
# whose root sky/environment prims (outside its defaultPrim) get borrowed.
# RetroNeighborhood's /Environment holds a dynamic-sky rig + dome light and
# no geometry, so borrowing it costs almost nothing at load time.
sky: "RetroNeighborhood/RetroNeighborhood.stage.usd"

# ---- per-family yaw offsets (deg), added to auto-computed rotations -----------
# Art conventions of the shared library. For a single misaligned asset, prefer
# a per-USD yaw-offset in its usds entry.
orientation:
  house_front:   0.0        # building front facing offset
  car_front:     0.0        # 0 = car art faces +X (its direction of travel)
  traffic_light_front: 0.0  # 0 = art faces +X (auto-yawed toward intersection center)

# ---- footprints [x, y(, z)] m — used when measure_usds is false or a measure fails
# `house`, `debris` and `debris_pile` are locale-specific; the sets that extend
# this one override them.
fallback_sizes:
  concrete:      [4.0, 4.0, 0.1]   # thin slab — z feeds the walking-surface height
  sidewalk:      [2.0, 2.0, 0.1]   # thin slab — z feeds the walking-surface height
  trail:         [4.0, 3.0, 0.1]
  rock:          [1.5, 1.5]
  house:         [48.0, 48.0]
  tree:          [3.0, 3.0]
  plant:         [1.0, 1.0]
  streetlight:   [1.0, 1.0]
  bench:         [2.0, 0.6, 0.9]
  # MEASURED, AND ON THE POOL'S OWN AXIS. Every car in `usds.cars` is authored
  # with its nose on local -Y (hence `yaw-offset: 90` on all of them), so its
  # LENGTH is y and its WIDTH is x — Muyang/Vehicle_A measures 2.15 x 5.44 m in
  # Isaac. The old [4.5, 2.0] had the axes the other way round, which made a
  # fallback car 2 m long and 4.5 m wide to anything fitting one into a space.
  car:           [2.15, 5.44, 1.5]
  fire_hydrant:  [0.5, 0.5, 0.9]
  trash_can:     [0.8, 0.8, 1.2]
  traffic_light: [1.0, 1.0, 6.0]
  human:         [1.2, 0.35, 1.8]  # A-pose bbox; y = body depth (prone lift)
  bus_stop:      [4.0, 1.5, 2.5]
  planter:       [1.0, 1.0, 0.5]
  play_structure: [4.0, 2.0, 2.5]
  debris_pile:   [3.0, 3.0, 1.5]
  debris:        [1.5, 1.5, 0.8]

