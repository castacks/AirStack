  humans:
    - {usd: "Muyang/People/Assets/rp_carla_rigged_001_ue4.usd", scale: 0.01, yaw-offset: 90}
    - {usd: "Muyang/People/Assets/rp_claudia_rigged_002_ue4.usd", scale: 0.01, yaw-offset: 90}
    - {usd: "Muyang/People/Assets/rp_eric_rigged_001_ue4.usd", scale: 0.01, yaw-offset: 90}
    - {usd: "Muyang/People/Assets/rp_manuel_rigged_001_ue4.usd", scale: 0.01, yaw-offset: 90}
    - {usd: "Muyang/People/Assets/rp_nathan_rigged_003_ue4.usd", scale: 0.01, yaw-offset: 90}
    - {usd: "Muyang/People/Assets/rp_sophia_rigged_003_ue4.usd", scale: 0.01, yaw-offset: 90}
