# ============================================================================
# THE DAMAGE WIRING LIVES IN `disaster/quake.py`, NOT HERE
# ============================================================================
# * downtowncity (`usd` contains "downtowncity/") and the AEC brownstones
#   (`usd` contains "assets/aec/") are now PRISTINE-ALWAYS — see
#   `disaster.quake.PRISTINE_PACKS` / `_is_pristine_pack`. `assemble` never
#   even measures them: no grade, no `_mono_pass` lean / sink / ruin-swap,
#   no heap / rubble / pounding-interaction bookkeeping (all of that keys
#   off `records`, which they never enter). A ground fissure or dust patch
#   authored independently of any one building may still cross underneath
#   one — that is fine, only the BUILDING itself must stay untouched.
#   Standalone monoliths (the `assets/standalone/` 2026-08-26 drop, Muyang
#   DownTown, Dmytro FactoryDistrict) are NOT on this list and keep today's
#   `_mono_pass` fallback lean unchanged — "no damage pipeline of its own"
#   is a different claim from "must never lean"; only downtowncity and AEC
#   get the stronger guarantee the user asked for.
# * GAC buildings drawn a grade above DG0 get `decide_gac_building`'s
#   per-building bake if one exists at `assets/gac_quake/`; without one they
#   are `kept` — their OWN mesh reference, never swapped to an unrelated
#   building or a generic ruin (`destroyed` is cleared above, so the
#   DG5-tower-ruin-swap branch in `_mono_pass` can never fire on one either)
#   — and, like any other kept monolith, may still receive `_mono_pass`'s
#   rigid lean / sink fallback. Unchanged from `urban_quake_v4`, pinned here
#   by `tests/test_quake_v5_city.py`.
# * MCE same_art originals get `decide_building`'s size-matched kit twin,
#   using the `quake_material_tags` table above for construction type — the
#   SAME mechanism `urban_quake_v3` established, now able to see the
#   correct type without a bare-key pool replacement.
#
# ============================================================================
# FOLLOW-UP LANDED (2026-08-31, same round): `downtown_earthquake.yaml`'s
# ring/typology section now MIRRORS `downtown_gac.yaml`'s five rings / six
# typologies in full (`rowhouse`/`lowrise`/`midrise`/`brick_midrise`/
# `tower`/`highrise`), not the three (`rowhouse`/`midrise`/`tower`,
# `rowhouse` always at mix weight 0.00) it used alone before. This was
# originally logged here as a KNOWN LIMITATION — the coordinator's own
# follow-up correctly overrode that call: "the entire point of the user's
# request is that downtowncity + AEC brownstones actually appear ... so the
# preset extension you identified is IN scope now." See
# `config/presets/downtown_earthquake.yaml`'s own `rings:` / `typologies:`
# comments for the full delta (what mirrors `downtown_gac.yaml` exactly —
# `lowrise`/`brick_midrise`/`highrise`, `midrise`'s pool, `tower`'s height
# range — and the ONE typology that deliberately did NOT change:
# `rowhouse`'s block/height params stay the ones already measured and tuned
# for THIS 250 m plate, a legitimate quake-specific divergence).
#
# CONFIRMED (region 500, `tools/layout_dry_run.py --asset-set
# urban_quake_v5`, `_plans/eq_v5_city_dry_run.md`): downtowncity, GAC
# (including `highrise` members — SM_Building_10/13/14/17/18/20 all placed),
# all three MCE originals, kit, and standalone content now place together
# in one run. `pristine_aec` specifically lives in only ONE typology
# (`rowhouse`), drawn at only the `edge` ring's mix — whether a
# rowhouse-ranked zoning nucleus forms AT ALL is per-seed random (Harris &
# Ullman's multiple-nuclei model); measured over seeds 1-12 at this same
# region/asset-set it was nonzero for 5 of 12 (this preset's own committed
# `seed: 42` happened not to draw one at region 500) — ordinary zoning
# variance, not a gap. `tests/test_quake_v5_city.py` pins a specific seed
# (9) that reliably draws both downtowncity and AEC, as a deterministic
# placement-level proof the mechanism itself works.
