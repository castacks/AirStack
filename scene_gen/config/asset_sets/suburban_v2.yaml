# ASSET SET: suburban_v2 — the suburban set plus what a detailed suburb needs.
#
# Extends `suburban`, so the houses and existing props come across unchanged and
# this file only adds what the new passes consume. Nothing in `suburban.yaml` or
# `shared.yaml` is edited — the old scene keeps working.
#
# `<key>+` appends to the inherited pool; a bare key REPLACES it.
#
# MEASURE BEFORE ADDING. Two lessons from the urban set, both of which cost real
# time there:
#   * Material binding is per GEOMSUBSET on every UE-exported asset in this
#     library. A per-Mesh ComputeBoundMaterial reports the whole library as
#     unbound and is wrong; use tools/material_binding.py.
#   * `scale` is per asset, never global. The CityPark stones are authored 10x
#     apart from each other, so one shared scale made two of them enormous and
#     two of them pebbles. Derive each from its own measured bbox.

extends: suburban

usds:
  # A NARROW walk, and only where one exists at all. The paved ring is one tile
  # wide and build_city takes that width as max(tile.sx, tile.sy), so the tile
  # scale IS the walk width — there is no separate knob, and city_detail.zones
  # in the preset must sum to match. 5.00 m authored x 0.30 = 1.50 m, the usual
  # residential minimum, against 3.5 m in the urban scene.
  tiles:
    sidewalk:
      usd: "Dmytro/Assets/Game/ModernCityEnvironment01/Meshes/SM_GroundModule01.usd"
      scale: 0.30         # 5.00 x 5.00 m authored -> 1.50 m walk

  # ---- LOT FURNITURE  (owner: suburb_lots.py) --------------------------------
  # Fences run as MODULES butted end to end along a lot boundary, so what the
  # pass needs from each entry is the module length and which axis the art runs
  # along. It reads the length from the measured footprint at run time and picks
  # `sx` or `sy` according to `yaw-offset` — an asset running along +Y without
  # the offset would have its 0.33 m rail THICKNESS taken as the module length
  # and be laid forty times over.
  #
  # `tags` are the boundary the fence belongs on, and they are not
  # interchangeable. US municipal codes cap a FRONT-yard fence far lower than a
  # rear one — 3.5 ft front / 8 ft rear (Portland Title 33 §33.110.275.C),
  # 3.5 / 7 ft (Junction City OR JCMC 17.95.020), 4 / 6 ft (Taylor AZ TTC
  # §18.60.050) — so one asset cannot serve both boundaries: a 6 ft privacy
  # panel along the street is not a suburb, it is a compound.
  lot_fences:
    # LOW / FRONT — ornamental iron, 0.99 m = 3.2 ft, inside the usual 3-4 ft
    # front-yard cap. Measured in the urban set, where parks.py already runs it
    # as a park railing; 1.5k points a module, the cheapest fence in either
    # library. Art runs along +Y, hence the yaw-offset.
    - usd: "Dmytro/Assets/Game/Downtown_West/Assets/props/prop_park_railing/SM_prop_park_railing_rail_a.usd"
      scale: 1.0          # 0.33 x 5.28 x 0.99 m, 1,528 pts
      yaw-offset: 90.0
      tags: ["low"]

    # PRIVACY / REAR — close-board with posts, the standard US rear-yard fence.
    # Candidate chosen by measuring the SOURCE GLB host-side with trimesh (no
    # Blender, no container) — absolute size is meaningless in glTF, so the
    # decision was the aspect ratio: a single 5.95 : 1.89 : 0.16 panel tiles as
    # a run, and a "pack" of eight panels laid side by side does not. Five of
    # the ten candidates were packs or had illegible bboxes and were rejected.
    # MEASURED AFTER CONVERSION (tools/measure_assets.py on the cached USD):
    #   5.95 x 0.16 x 1.89 m, base -0.027, 2,296 pts, mpu 1.0, Z-up.
    # 1.89 m = 6.2 ft, inside the 6-8 ft side/rear band every code above allows.
    # Runs along +X, which is what the pass asks for, so NO yaw-offset.
    # CAVEAT, unverified by eye: the module bundles a gate (~1.15 m of the
    # 5.95 m), so a repeated run puts a gate every 6 m. Acceptable behind a
    # house, wrong along a street — which is why it is not tagged "low".
    - usd: "objaverse://bd8afe2fa6c24d238a761bc4751ebb03"   # "Wooden Fence", CC-BY
      target-size-m: 5.95   # pins the longest PLAN dimension; height follows
      points: 2296
      tags: ["privacy"]

    # PICKET / FRONT — the classic small-lot front fence, and a short enough
    # module that a 15 m frontage takes seven of them rather than three, so the
    # run reads as pickets rather than as panels.
    # MEASURED AFTER CONVERSION: 2.00 x 0.09 x 0.96 m, base -0.001, 1,558 pts.
    # 0.96 m = 3.1 ft, inside the 3.5-4 ft front-yard cap. Runs along +X.
    - usd: "objaverse://9c2fb0b1afaa450f97ac9f6217ed6dc9"   # "HandPainted Fence", CC-BY
      target-size-m: 2.0
      points: 1558
      tags: ["low"]

    # POINT BUDGET. Nothing here is USD-instanced — apply_placements composes
    # each placement as its own reference — so N modules cost N x `points`. A
    # 1600 x 1200 m suburb runs roughly 2,000-3,000 modules once the compact
    # neighbourhoods are fenced, which is 4-7M points against the ~89M ceiling
    # the urban scene OOM-killed at. The levers, in order: `fence.chance` per
    # neighbourhood type in the preset, then which boundaries a type fences,
    # then `module_gap_m` (a gappy fence is worse than no fence, so it is last).

  # Driveway paving. The pass repeats and STRETCHES a tile from the house out
  # across the verge and sidewalk to the kerb, so the authored tile size only
  # sets how far the texture stretches, not the fit — a driveway is 3.0-5.5 m
  # wide and nothing in the library is. Entries must NOT carry `yaw-offset`:
  # the stretch is applied in the asset's own frame, before yaw.
  driveway_tiles:
    # The library's actual driveway art. Already resolves — shared.yaml uses it
    # as the park trail tile, which is what the urban set called out as wrong
    # there ("a real paved walk instead of SM_DriveWay_01, which is a
    # DRIVEWAY"). Here it is being used for what it is.
    # UNVERIFIED: size not measured — Nucleus needs Kit and the container was
    # off limits for this work. The stretch tiler does not depend on it.
    - usd: "RetroNeighborhood/Props/SM_DriveWay_01.prop.usd"
      scale: 0.01         # RetroNeighborhood is authored in cm


  # ---- YARD PLANTING  (owner: suburb_yards.py) -------------------------------
  # Front yards and back yards want different material: a front yard is kept and
  # visible, a back yard is where the shed and the bigger shrubs go. Which pool
  # an entry lands in is decided by `tags` and by its MEASURED height — the pass
  # picks a foundation shrub by asking for 0.4-1.8 m, not by name.
  #
  # TWO EXTRA KEYS THIS PASS READS, both ignored by `_parse_usd_entry`:
  #
  #   points:  the asset's measured Mesh point count. NOT decoration. Nothing is
  #            USD-instanced — `apply_placements` composes each placement as its
  #            own reference and never sets `instanceable` — so N copies cost
  #            N x this, and `suburb_yards.point_budget` is enforced against the
  #            sum. An entry with no `points` is treated as costing 0 and will
  #            silently break the budget, so measure before you add.
  #   weight:  relative sampling weight. This is how the library's handsome
  #            species stay usable: they cost 4-6x the cheap ones, so they are
  #            carried as rare accents rather than dropped or allowed to eat the
  #            whole budget.
  #
  # ALL MEASURED WITH tools/measure_assets.py AND tools/material_binding.py at
  # scale 0.01 (every AEC asset is centimetre-authored, Z-up). Sizes below are
  # x * y * z in metres AT THAT SCALE — which is what the pass then rescales
  # per asset from its own bbox, never by a shared multiplier.
  #
  # SEASON WAS TRACED THROUGH THE BOUND MATERIAL, not guessed from the filename
  # and not sampled off a texture that might not be referenced: material_binding
  # gives the bound MDLs, the MDL's own `texture_2d(...)` gives the albedo, and
  # the albedo's green share over alpha-masked pixels gives the season. Sampling
  # a leaf PNG alone proves nothing — an asset can measure perfectly green and
  # render white.

  # 6 species where the scene had 2. Every one: bound (GeomSubset-aware), green,
  # and affordable enough to be worth its place. The three at the top carry the
  # planting; the three accents are 4-6x the cost and are weighted to about one
  # tree in twenty-five.
  yard_trees:
    - {usd: "airstack://scene_gen/assets/aec/tower/Assets/Vegetation/Black_Oak/Black_Oak.usd", scale: 0.01,
       points: 48701, weight: 1.0, tags: ["rear"]}
      # 25.42 x 24.07 x 19.74 m — the biggest thing in the pool, and the pass
      # scales it down per placement from this measured height. 10/11 meshes
      # bound, 0.2% of faces unbound (123 points, one branch stub) — the same
      # asset and the same defect urban_v2 already ships. Leaves oakleaves1,
      # 100% green.
    - {usd: "airstack://scene_gen/assets/aec/tower/Assets/Vegetation/Shumard_Oak/Shumard_Oak.usd", scale: 0.01,
       points: 54766, weight: 1.0, tags: ["front", "rear"]}
      # 10.29 x 10.47 x 11.43 m. 4/4 bound, 0% unbound. Mixed canopy by design:
      # oakleaves1 (100% green) on three leaf materials, oakleaves2 (100%
      # yellow) on the fourth — an oak turning, not an autumn asset.
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Trees/Douglas_Fir.usd", scale: 0.01,
       points: 56262, weight: 0.8, tags: ["front"]}
      # 3.02 x 2.77 x 6.03 m. 8/8 bound, 0% unbound, pine_needles 100% green.
      # An EVERGREEN, which is what a front yard actually has and what neither
      # oak can give — and the narrowest crown in the pool, so it is the one
      # tree that fits a shallow front garden without being shrunk.
    # ---- accents: 4-6x the cost --------------------------------------------
    # Weighted to buy about 15 of them in 500 lots, at a measured cost of 12%
    # of the total tree count (302 trees with accents at 0.30, against 341 at
    # 0.04 for two accents). That trade — one tree in twenty-five is a species
    # you do not otherwise see, for one canopy in eight — is the whole reason
    # they are here rather than dropped for being expensive.
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Trees/Largetooth_Aspen.usd", scale: 0.01,
       points: 197775, weight: 0.30, tags: ["rear"]}
      # 5.09 x 5.20 x 7.89 m. 2/2 bound. aspenleaf 99.9% green — a Brownstone
      # deciduous that is NOT autumn, checked rather than assumed.
    - {usd: "airstack://scene_gen/assets/aec/tower/Assets/Vegetation/Common_Apple/Common_Apple.usd", scale: 0.01,
       points: 237356, weight: 0.30, tags: ["rear"]}
      # 5.86 x 5.23 x 5.59 m. 2/2 bound, apple_leaf 100% green. A fruit tree,
      # which is a back-garden thing and nothing else in the library is.
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Trees/American_Beech.usd", scale: 0.01,
       points: 305126, weight: 0.20, tags: ["front", "rear"]}
      # 4.09 x 4.01 x 5.97 m. 2/2 bound, beech_leaf 100% green.
    #
    # MEASURED AND REJECTED, each on a number:
    #   Dogwood            184k  3.1 x 3.0 x 3.4  — all FOUR bound leaf
    #     materials resolve to red albedos (dogwood_leaf 99.7% red, _v2 95.1%,
    #     _v3 79.1%, _v4 99.8%). It is a red ornamental, not the green
    #     small-tree specimen its size and price suggest. This is the one that
    #     would have shipped: it binds cleanly, it is the right shape for a
    #     front garden, and only tracing the MDLs catches it.
    #   Japanese_Cherry    255k  4.9 x 5.7 x 4.6  — binds ONLY
    #     JapaneseCherry_blossom_Mat (87.9% pink) and bark3: no green leaf
    #     material at all, so the whole canopy is blossom. Correct for a cherry
    #     in bloom, but at 255k it buys one pink tree for five green ones.
    #   Honey_Locust       332k  6.8 x 7.0 x 8.2  — leaf albedo is half green,
    #     half yellow-orange; borderline, and priced out regardless.
    #   Hawthorn           596k  9.5 x 7.2 x 8.6  — green and clean, 12x the
    #     cheapest tree. Unaffordable at yard density.
    #   Scarlet_Oak / _fall 40k  — 35.5% of faces unbound, renders white.
    #   White_Ash           66k  — binds ashtree_leaves_fall1: autumn.
    #   Service_Berry       84k  — 48.0% of faces unbound.
    # Rejected by name and NOT reintroduced: every Dmytro SM_Tree*, every
    # Muyang/DownTown Tree_A/B/C, RetroNeighborhood SM_Tree_01..07, CityPark
    # SM_Tree_03/_04/_05/_08.

  # Shrubs and ground cover. THIS POOL IS WHERE THE LIBRARY HURTS: it has no
  # cheap shrub. Below 34k points everything is a lawn tuft, and the cheapest
  # thing that reads as a bush from a metre away is Meadowlark at 83k. The
  # weights are therefore doing real work — the tufts carry the ground cover and
  # the shrubs are rationed.
  yard_shrubs:
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Shrub/Grass_Trimmed_C.usd", scale: 0.01,
       points: 1220, weight: 1.0}      # 0.24 x 0.26 x 0.09 m — the cheapest asset here by 28x
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Shrub/Grass_Short_C.usd", scale: 0.01,
       points: 2208, weight: 1.0}      # 0.28 x 0.30 x 0.13 m
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Shrub/Grass_Trimmed_B.usd", scale: 0.01,
       points: 8476, weight: 0.8}      # 0.62 x 0.64 x 0.10 m
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Shrub/Grass_Short_B.usd", scale: 0.01,
       points: 15375, weight: 0.6}     # 0.66 x 0.68 x 0.16 m
      # The five above all bind lawngrass_a_mat, whose albedo is a khaki
      # (mean RGB 0.63/0.59/0.42, 29% green / 71% yellow-orange) — dry tussock
      # grass, not lawn. They are ground cover in the rear yard and are kept
      # OUT of the front by the height band there, which asks for 0.4-1.8 m.
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Shrub/Lupin.usd", scale: 0.01,
       points: 34685, weight: 0.5}     # 1.65 x 1.38 x 1.37 m
      # The cheapest thing in the library at shrub height by a factor of 2.4, so
      # it is the backbone of every foundation row. 7/7 bound; one atlas carries
      # green foliage (25.5%) and purple flower spikes (45.8% off-hue) — a
      # flowering perennial, correctly.
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Shrub/Grass_Short_A.usd", scale: 0.01,
       points: 44922, weight: 0.2}     # 1.29 x 1.29 x 0.16 m
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Shrub/Meadowlark.usd", scale: 0.01,
       points: 83329, weight: 0.25}    # 0.94 x 1.02 x 0.92 m
      # 2/2 bound. Binds Meadowlark_flowers -> forsythiaflower (100% yellow) and
      # bark3: a forsythia in full bloom with NO green leaf material. Yellow all
      # over, deliberately, and the only true bush under 170k.
    # ---- accents: 2-4x Meadowlark, so a few per street -------------------------
    - {usd: "airstack://scene_gen/assets/aec/tower/Assets/Vegetation/Fountain_Grass_Short/Fountain_Grass_Short.usd", scale: 0.01,
       points: 173997, weight: 0.05}   # 2.02 x 2.05 x 1.47 m — 100% green
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Shrub/Hibiscus.usd", scale: 0.01,
       points: 195688, weight: 0.05}   # 2.31 x 2.13 x 1.64 m — green leaf, red flower
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Shrub/Yew.usd", scale: 0.01,
       points: 324028, weight: 0.03}   # 1.23 x 1.24 x 0.73 m — pine_needles, 100% green
      # THE archetypal clipped foundation shrub, and 324k points for 1.2 m of
      # it — 266x a Grass_Trimmed_C. Carried at 0.03 for that reason alone.
    #
    # MEASURED AND REJECTED:
    #   Acacia            820k  1.62 x 1.67 x 1.19 — green and bound; a 1.6 m
    #     shrub at 820k points is 17x the cheapest tree in the scene.
    #   Forsythia         429k  3.54 x 3.65 x 2.32 — same yellow bloom as
    #     Meadowlark at 5x the price.
    #   Prairie_Dropseed  241k / Fountain_Grass_Tall 247k — duplicates of
    #     Fountain_Grass_Short's look at 1.4x the cost.
    #   Hydrangea         224k  1.57 x 1.61 x 1.39 — both non-bark materials
    #     are blooms (hydrangea 97.1% red, rhododendron 73.2% purple); no green
    #     foliage anywhere in it.
    #   Sweet_Mock_Orange 212k  0.70 x 0.68 x 0.60 — green, but 212k for a
    #     knee-high shrub is the worst points-per-metre in the library.
    #   Goldflame_Spirea  101k  0.32 x 0.31 x 0.20 — 101k for a 30 cm plant.

  # Yard furniture. Tagged by ROLE, because the pass places each where it
  # belongs: `shed` in a far corner facing the house, `patio` and `bin` against
  # the house wall, `mailbox` at the street edge. All bound, all cheap — the
  # whole prop pool costs less than two trees.
  yard_props:
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Props/Mailbox/MailboxType01.usd", scale: 0.01,
       points: 264, weight: 1.0, tags: ["mailbox"]}   # 0.65 x 0.52 x 1.34 m
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Props/Mailbox/MailboxType02.usd", scale: 0.01,
       points: 264, weight: 1.0, tags: ["mailbox"]}   # 0.76 x 0.61 x 1.14 m
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Props/TrashCan/TrashCan.usd", scale: 0.01,
       points: 630, weight: 1.0, tags: ["bin"]}       # 0.51 x 0.51 x 0.73 m
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Props/ParkBench01/ParkBench01.usd", scale: 0.01,
       points: 1463, weight: 0.6, tags: ["patio"]}    # 2.62 x 0.79 x 0.39 m — a garden seat
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Props/MobilaShelter/MobilaShelter.usd", scale: 0.01,
       points: 11698, weight: 1.0, tags: ["shed"]}    # 2.14 x 1.95 x 2.33 m
      # UNVERIFIED BY EYE, and the one aesthetic call in this file. Authored as
      # a transit shelter — two meshes, Frame + Roof, binding Steel_Blued_Frame
      # and Glass_OpticalWFrit — but at 2.1 x 2.0 x 2.3 m it is shed-sized, and
      # a steel-and-glass box that size in a back garden reads as a greenhouse
      # or garden room. It is the ONLY structure in either AEC pack at domestic
      # scale. If it renders as an obvious bus stop, drop this one line.
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Props/Kalmar_TblChr/Kalmar_TblChr.usd", scale: 0.01,
       points: 60806, weight: 1.0, tags: ["patio"]}   # 2.43 x 2.42 x 1.01 m — table and chairs
      # 10/10 bound, ash and cast steel. As expensive as a whole tree, hence
      # `patio_chance` rather than one per garden.
    #
    # MEASURED AND REJECTED: every Planter_* and PlanterFence* in both packs
    # payloads live vegetation, which is where their cost comes from —
    # PlanterBench is 6,777,655 points, more than a fifth of the entire yard
    # budget in ONE prop. Planter_03 / Ext_Bench_01 are the same 6.0 x 1.0 m
    # precast street planter (Ext_Bench_01's root prim is literally
    # `/World/planter_03`), too big and too urban for a garden. Bollard_01 is
    # 4.8% unbound.
