# ASSET SET: suburban_park — the suburb, plus the park's recreation content.
#
# `suburb_net.py` reserves ground for a park and frames it with a street;
# `suburb_scene.py` then builds the park's content into that reserve. That
# content needs pools the suburban set has no reason to carry (hoops, goals,
# tennis courts, chain-link, gazebos, play equipment), and the park set has no
# reason to carry houses. So this joins the two rather than duplicating either.
#
# Cache both halves before `airstack up`:
#     .venv/bin/python scene_gen/prepare_assets.py --asset-set suburban_park
# ORDER MATTERS AND IS NOT ALPHABETICAL. Parents merge LEFT TO RIGHT, so the
# LAST one wins any pool they share. park.yaml extends shared, which still
# carries the 14 RetroNeighborhood/CityPark trees and the 3 stumps that both
# urban_v2 and suburban_v2 explicitly reject -- so listing park last silently
# reinstated every tree the curation had removed, stumps included. suburban_v2
# goes last so its curated pools win; park contributes only the recreation
# pools, which suburban_v2 does not define and therefore cannot clobber.
extends: [park, suburban_v2]
