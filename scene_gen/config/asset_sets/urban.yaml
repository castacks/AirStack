# The urban asset set — everything a urban scene builds with.
#
# `extends: urban_nucleus`: the Nucleus-only subset it layers on. That split is
# by SOURCE, not by version — urban_nucleus needs no pre-flight and works
# offline, this adds the Objaverse and AEC content that does. Point a
# config at `urban_nucleus` to build without either.
#
# WHAT THIS FILE DOES AND DOES NOT DEFINE. It adds a proper street-furniture
# library on top of the inherited set. It defines NO `buildings` and NO
# `debris` of its own — both come across from `urban_nucleus` untouched, so a
# scene on this set places Nucleus rubble even though the word `debris` does
# not appear below. `deep_merge` cannot narrow an inherited dict either, so an
# empty `debris: {}` here would not remove them; only pointing at a different
# parent would.
#
# New categories here are consumed by `city_detail.py`, not by
# `scene_generator.build_city`. The built-in frontage passes are switched off
# by `low_level/default.yaml` setting their spacings to 0 for this locale, so
# there is exactly one owner of street furniture.
#
# The NVIDIA AEC assets are git-ignored and staged locally; see
# `../../assets/aec/README.md` for re-extraction. All of them are
# centimetre-authored and Z-up, hence `scale: 0.01` everywhere and no axis-up.
# Sizes in the comments are measured (`tools/measure_assets.py`), not guessed.

extends: urban_nucleus
# `<key>+` appends to the inherited pool instead of replacing it, so the Nucleus
# props stay in the mix and the AEC ones add variety.

fallback_sizes:
  # Without an entry here a category silently takes the generic 4.0 x 4.0 m
  # default, so a traffic cone reserves four metres of kerb. Only bites when a
  # measurement fails or measure_usds is off — quiet either way, hence explicit.
  street_tree:   [8.0, 8.0, 9.5]
  traffic_light: [1.65, 8.01, 10.83]  # mast arm, not a post
  trash_can:     [0.6, 0.6, 0.95]
  phone_booth:   [1.0, 1.0, 2.3]
  traffic_cone:  [0.4, 0.4, 0.7]
  billboard:     [3.0, 0.3, 4.0]
  newspaper_box: [0.6, 0.5, 1.2]
  manhole:       [0.7, 0.7, 0.05]
  storm_drain:   [0.6, 0.4, 0.05]
  # Overrides shared.yaml's [48, 48] — which has no z, so any failed
  # measurement yields a 3 m tall "building". 30 x 20 x 24 is nearer
  # CityEngine's measured median footprint of 41 x 20 m.
  house:         [30.0, 20.0, 24.0]
  planter_fence: [1.5, 1.5, 0.73]
  cafe_set:      [2.43, 2.42, 1.01]
  mailbox:       [0.65, 0.52, 1.34]
  bollard:       [0.25, 0.25, 0.9]
  bike_lane_delineator: [0.11, 0.11, 1.0]   # measured 0.101 x 0.101 x 1.0
  parking_meter: [0.2, 0.2, 1.3]
  bike_rack:     [1.0, 0.1, 0.8]
  sign:          [0.4, 0.08, 2.4]
  utility_pole:  [0.35, 0.35, 11.0]
  dumpster:      [1.8, 1.2, 1.3]

usds:
  # Pre-assembled party-wall terraces. The right SHAPE for a block frontage:
  # ~21 m deep and long along the street (aspect 1.6-3.8, against a squarish
  # inherited pool), so a row tiles a frontage instead of leaving a gap either
  # side. This is what closes the "very large sidewalk" — which is not sidewalk
  # at all but unbuilt paved block interior, left bare because no library
  # building fit. Cheapest useful building geometry in either AEC pack, ~4.6k
  # points per house, linear in row length.
  # TYPOLOGY POOLS. `intact` stays exactly as urban.yaml left it — build_city
  # packs from it and `districts.rezone_blocks` then rebuilds each block from
  # the pool its zone calls for. The terraces are deliberately NOT in `intact`:
  # build_city picks uniformly among everything that fits, so a row house wins
  # most slots and the city fills with single detached terraces standing in
  # gaps, which is exactly what a row house must never do. They are only ever
  # placed by the `terrace` morphology, in a contiguous run along a block face.
  #
  # Sizes and point counts below are MEASURED against Nucleus
  # (tools/measure_assets.py), not guessed.
  buildings:
    # REPLACES urban.yaml's inherited `intact` (no `+`), solely to drop
    # MBuilding03 — it does not read as a building. Everything else is carried
    # over verbatim; build_city packs from this pool before districts rezone,
    # so leaving it here would keep placing it on blocks that never get rezoned.
    intact:
      - "ModernCityEnvironment/Collected_Building01/SM_MERGED_BP_MBuilding01.usd"
        # authored in metres; already matches the global default (1.0)
      - {usd: "ModernCityEnvironment/Collected_Building02/SM_MERGED_BP_MBuilding02.usd", scale: 0.01}
      - {usd: "ModernCityEnvironment/Collected_Building05/SM_MERGED_BP_MBuilding05.usd", scale: 0.01}
      - {usd: "DownTown/Assets/BG_Building_A.usd", scale: 0.01}
      - {usd: "DownTown/Assets/BG_Building_B.usd", scale: 0.01}
      - {usd: "DownTown/Assets/BG_Building_C.usd", scale: 0.01}
      - {usd: "DownTown/Assets/BG_Building_D.usd", scale: 0.01}
      - {usd: "DownTown/Assets/BG_Building_E.usd", scale: 0.01}
      - {usd: "DownTown/Assets/BG_Building_F.usd", scale: 0.01}

    rowhouse:
      - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Create_Brownstone02/Reference_Brownstone02.usd",   scale: 0.01}   # 21.1 x  6.8 x 14.2 m,  4.6k
      - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Create_Brownstone02/Reference_Brownstone2Row.usd", scale: 0.01}   # 21.1 x 13.4 x 14.6 m,  9.3k
      - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Create_Brownstone02/Reference_Brownstone5Row.usd", scale: 0.01}   # 21.1 x 33.4 x 14.8 m,   23k
      - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Create_Brownstone02/Reference_Brownstone6Row.usd", scale: 0.01}   # 21.1 x 40.0 x 14.9 m,   28k
      - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Create_Brownstone02/Reference_Brownstone8Row.usd", scale: 0.01}   # 21.1 x 53.3 x 14.9 m,   37k
      - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Create_Brownstone02/Reference_Brownstone10Row.usd", scale: 0.01}  # 21.1 x 66.6 x 15.2 m,   46k
      - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Create_Brownstone02/Reference_Brownstone11Row.usd", scale: 0.01}  # 21.1 x 73.4 x 15.2 m,   51k
      - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Create_Brownstone02/Reference_Brownstone12Row.usd", scale: 0.01}  # 21.1 x 80.1 x 15.3 m,   56k

    # Small footprints (15-29 m), 22-29 m tall — and the two EXPENSIVE assets in
    # the library at 88k/140k points. A mid-rise district costs roughly 100x a
    # tower district per block, which is why the ring mixes keep it a minority.
    midrise:
      # NO scale override: this one is authored in METRES, unlike every other
      # Muyang building. urban.yaml lists it bare for that reason; copying the
      # 0.01 off its neighbours renders it 28 cm tall.
      - {usd: "ModernCityEnvironment/Collected_Building01/SM_MERGED_BP_MBuilding01.usd", scale: 1.0}   # 28.5 x 18.5 x 29.0 m, 140k
      - {usd: "DownTown/Assets/BG_Building_D.usd", scale: 0.01}                                        # 64.9 x 34.9 x 33.0 m, 2.8k
      # FactoryDistrict: 14 DISTINCT masses, 23-72 m wide, 10-17 m tall, at
      # 4-18k points each. Metre-authored, so no scale. base -1.0 to -1.5 m.
      # This is the variety fix: with only three midrise assets, MBuilding01 and
      # BG_Building_D were landing 77 and 72 times out of 225 buildings.
      - "FactoryDistrict/Meshes/Building_TypeD_A.usd"      # 42.0 x 31.5 x 11.7 m,  4,359
      - "FactoryDistrict/Meshes/Building_TypeD_B.usd"      # 52.0 x 32.0 x 16.7 m,  4,717
      - "FactoryDistrict/Meshes/Building_TypeA_B.usd"      # 24.4 x 47.0 x 11.8 m,  4,774
      - "FactoryDistrict/Meshes/Building_TypeA_A.usd"      # 25.0 x 39.7 x 11.9 m,  4,998
      - "FactoryDistrict/Meshes/Building_TypeB_B.usd"      # 45.1 x 30.1 x 12.0 m,  5,718
      - "FactoryDistrict/Meshes/Building_TypeD_C.usd"      # 72.0 x 32.0 x 16.7 m,  7,087
      - "FactoryDistrict/Meshes/Building_TypeB_C.usd"      # 67.1 x 45.1 x 12.0 m,  8,067
      - "FactoryDistrict/Meshes/Building_TypeA_C.usd"      # 50.2 x 41.6 x 12.4 m,  8,316
      - "FactoryDistrict/Meshes/Building_TypeC_A.usd"      # 25.1 x 25.1 x 11.1 m,  8,980
      # Every FactoryDistrict *_Frame asset is OUT by request — they are open
      # steel frames, not finished buildings.
      - "FactoryDistrict/Meshes/Building_TypeC_C.usd"      # 33.1 x 49.1 x 16.0 m, 14,184
      - "FactoryDistrict/Meshes/Building_TypeC_D.usd"      # 41.1 x 41.1 x 16.0 m, 17,704
      # Old_Shipyard is OUT by request. Worth recording why it also mattered
      # numerically: its pieces are small in plan (7.2 x 14.4, 28.5 x 5.4), so
      # packing fitted many per block and they took 97 of 301 buildings.

    # 44-131 m tall. The six BG_Building_* are massing shells and cost
    # 756-4,643 points EACH — a tower downtown is effectively free, which is
    # what makes a bigger city affordable. Footprints are 50-96 m, so these
    # only fit where the subdivider cut a downtown-sized block.
    tower:
      - {usd: "DownTown/Assets/BG_Building_A.usd", scale: 0.01}                                        # 51.3 x 51.3 x  44.7 m, 3.5k
      - {usd: "DownTown/Assets/BG_Building_C.usd", scale: 0.01}                                        # 50.1 x 40.1 x  66.0 m,   756
      - {usd: "DownTown/Assets/BG_Building_E.usd", scale: 0.01}                                        # 60.5 x 36.5 x 131.0 m, 3.5k
      - {usd: "DownTown/Assets/BG_Building_B.usd", scale: 0.01}                                        # 60.3 x 40.2 x  84.1 m, 1.8k
      - {usd: "DownTown/Assets/BG_Building_F.usd", scale: 0.01}                                        # 80.9 x 50.4 x  72.3 m, 4.6k
      - {usd: "ModernCityEnvironment/Collected_Building05/SM_MERGED_BP_MBuilding05.usd", scale: 0.01}   # 27.7 x 20.6 x  62.4 m, 311k
      - {usd: "ModernCityEnvironment/Collected_Building02/SM_MERGED_BP_MBuilding02.usd", scale: 0.01}  # 91.1 x 96.1 x 68.7 m, 471k

  # ---- park content ------------------------------------------------------------
  # A real paved walk instead of `RetroNeighborhood/SM_DriveWay_01`, which is a
  # DRIVEWAY and is what the park paths have been made of. 75 points a tile.
  # NOTE the tile is authored at kerb height (bbox min-z +0.157), so parks.py
  # places it at trail_z + base rather than at trail_z, or it floats 16 cm.
  tiles:
    trail:
      usd: "Downtown_West/Assets/ground_walkways/SM_ground_mod_walk_tile_a_4m.usd"
      scale: 1.0          # 4.02 x 4.02 x 0.02 m, 75 pts

    # The paved sidewalk ring is ONE tile wide and build_city takes that width
    # as max(tile.sx, tile.sy), so the TILE SIZE is the sidewalk width — there is
    # no separate knob. SM_GroundModule01 is authored 5.00 x 5.00 m, which put a
    # 5 m downtown-avenue pavement on every street in the city. 0.70 gives a
    # 3.5 m ring, which is an ordinary urban sidewalk and still carries the NACTO
    # 6 ft through zone. city_detail.zones in the preset sums to match; the two
    # have to move together.
    sidewalk:
      usd: "ModernCityEnvironment01/Meshes/SM_GroundModule01.usd"
      scale: 0.70         # 5.00 x 5.00 m authored -> 3.50 m ring

  # Co-located stacks placed at ONE point as a park's focal attraction. The
  # basin and all three water discs share an origin and their z-bases nest
  # inside the basin profile, so they need no offsets — see the pack survey.
  park_features:
    - name: fountain
      radius_m: 6.0       # keep-out for planting and benches
      parts:
        - "Downtown_West/Assets/props/prop_fountain/SM_prop_fountain_full.usd"   # 8.63 x 8.36 x 4.96 m, 88.5k
        - "Downtown_West/VFX/Meshes/SM_fountain_water_bottom.usd"                # 2.5k
        - "Downtown_West/VFX/Meshes/SM_fountain_water_middle.usd"                # 2.5k
        - "Downtown_West/VFX/Meshes/SM_fountain_water_top.usd"                   # 2.5k

  # A playground is a COMPOSED SET, not a scatter. The swings and the slide have
  # a fixed relationship to each other — corrected by hand in the viewport and
  # measured back out — and it has to survive wherever the group lands and
  # whatever way it faces.
  #
  # `offset_m` is in the ANCHOR'S OWN FRAME, not world, so the whole group
  # rotates rigidly: parks.py places part 0 at the attraction centre with a
  # random group yaw, then each later part at
  #     centre + R(group_yaw) . offset_m,  yaw = group_yaw + yaw_deg
  # Derived from the corrected placement (swings 11.2,-64.8 @345; slide
  # 19.2,-64.8 @250): world offset (8.0, 0.0) becomes (7.727, 2.071) once
  # expressed in the swings' frame, and the yaws differ by -95.
  play_groups:
    - name: swings_and_slide
      radius_m: 9.0         # keep-out for planting and benches
      parts:
        - {usd: "CivilianArea/Assets/SM_PlaygroundSwings_02.usd", scale: 0.01,
           offset_m: [0.0, 0.0],     yaw_deg: 0.0}     # anchor
        - {usd: "CivilianArea/Assets/SM_PlaygroundSlide_01.usd",  scale: 0.01,
           offset_m: [7.727, 2.071], yaw_deg: -95.0}

  # Ornamental iron park railing, 5.28 m module running along Y, origin centred.
  park_fences:
    - usd: "Downtown_West/Assets/props/prop_park_railing/SM_prop_park_railing_rail_a.usd"
      scale: 1.0          # 0.33 x 5.28 x 0.99 m, 1.5k
      yaw-offset: 90.0    # art runs along +Y; parks.py asks for a run along +X

  # Park trees. The Downtown_West foliage is 200-300k points EACH — 100 of them
  # is 20-30M, the whole scene's budget — so the park uses ModernCityEnvironment's
  # trees at 9-20k instead, which are the same visual scale.
  # Park trees come from shared.yaml's CityPark set, which IS textured.
  # SM_Tree1/SM_Tree2 were tried here and are unbound — see street_trees above.


  # ---- existing categories, extended with the AEC versions --------------------
  # REPLACES the inherited pool rather than extending it (no `+`). shared.yaml
  # mixes two Victorian lanterns, two modern pedestrian posts and three cobra
  # heads — three unrelated families on one street, which is what reads as
  # "too much variation in street lights". These two are one family, and the
  # plain mast is the SAME POLE as the traffic signal below, so every junction
  # matches by construction.
  # ONE streetlight. A city buys one pole and repeats it; two families on one
  # street is what reads as generated. The arterial mast is dropped rather than
  # the ornamental post because the traffic signal assembly ALREADY carries a
  # luminaire on the same pole — placing a mast beside a signal put two
  # identical lights on one corner.
  streetlights:
    - usd: "Downtown_West/Assets/props/props_light_post/SM_lightpost_light_post_b.usd"
      yaw-offset: 270.0
      # 0.55 x 2.19 x 6.01 m, 8,628 pts — ornamental 3-globe, sidewalk scale.
      # 270, not 180: the post carries banners, and at 180 they faced along the
      # kerb instead of out to the street. A quarter turn puts them broadside to
      # traffic, which is what a banner is for.
      # The 2.19 m extent is the outreach arm, and the pole sits at one end of
      # it rather than at the origin. Without the half-turn the arm hangs back
      # over the pavement instead of the kerb, and because placement centres the
      # BBOX the pole itself lands about 2 m off where it should be — the yaw
      # and the apparent offset are the same fault.
    #
    # Dropped: AEC StreetLamp.usd — its arm points -X with no yaw-offset, a
    # latent orientation bug, and it belongs to a third visual family.

  # REPLACES the inherited pool (no `+`). ONE street bench and ONE park bench —
  # municipal street furniture is bought to a single specification.
  benches:
    - usd: "airstack://scene_gen/assets/aec/brownstone/Props/ParkBench01/ParkBench01.usd"
      scale: 0.01          # 2.62 x 0.79 x 0.39 m
      tags: ["sidewalk"]
    - usd: "Downtown_West/Assets/props/prop_bench_wood/SM_bench_wood_a.usd"
      tags: ["park"]       # 3.27 x 0.67 x 0.90 m, 3,551 pts

  # REPLACES the inherited pool (no `+`). Every dropped entry was rendered and
  # checked, not judged by name:
  #   SM_MTrashCan          black commercial rectangular bin — alley, not kerb
  #   SM_Bin_003/_01/_02    blue WHEELIE BIN, three recolours of one model
  #   SM_Bin_006            green 4-wheel communal dumpster
  #   CityPark SM_Trash_can 1.27 m wide, out of scale
  #   brownstone TrashCan   domestic dustbin with a lid
  #   brownstone OutdoorTrash01  right look, 27,309 pts — 20x every alternative
  # ONE bin, for the same reason as the benches and the lights.
  trash_cans:
    - "ModernCityEnvironment01/Meshes/SM_MLitterBin.usd"
      # 0.60 x 0.60 x 0.91 m, 759 pts — black domed civic litter bin

  fire_hydrants+:
    - usd: "airstack://scene_gen/assets/aec/brownstone/Props/Hydrant/Hydrant.usd"
      scale: 0.01          # 0.56 x 0.52 x 1.62 m

  # REPLACES the inherited pool (no `+`) so the AEC MobilaShelter cannot be used
  # as a bus stop — it does not read as a shelter. It stays in the library for
  # other uses. It also carried NO yaw-offset while the real shelter carries
  # 180, so the MobilaShelters were the ones standing backwards to the kerb.
  bus_stops:
    - usd: "DownTown/Assets/BusStop.usd"
      scale: 0.01
      yaw-offset: 180.0    # opening faces the carriageway
      # If any shelter still faces the building line after this, the fix is to
      # drop this to 0.0 — the two candidates disagreed by exactly 180.

  # Placed by build_city's own intersection pass (intersection_chance stays 0.9),
  # not by city_detail — appending here is enough to widen the pool.
  # REPLACES the inherited pool (no `+`). The DowntownWest signal: a full US
  # mast-arm assembly — two 3-lens heads on a 7.7 m arm, pedestrian head and
  # controller on the pole, street-name blade, plus a luminaire. It IS the
  # arterial streetlight above with the arm fitted, so poles match at every
  # junction. One merged mesh; the signal cannot be separated from the light.
  # build_city places ONE per intersection, so this is ~50-90 instances.
  # Two signal pools, because a signalised junction mixes hardware: masts on the
  # arterial approaches, poles on the minor ones at the SAME junction. Both are
  # read by city_detail's signal pass, keyed by name from
  # `city_detail.signals.mast_usds` / `.pole_usds`.
  #
  # No yaw-offset on the mast arm: the arm direction is derived from the measured
  # bbox centroid, so each assembly is aimed at the approach it governs and
  # swapping the asset cannot silently rotate every signal in the city.
  traffic_lights_mast:
    - usd: "Downtown_West/Assets/props/props_streetlight/SM_light_streetlight_complete.usd"
      # 1.65 x 8.01 x 10.83 m, 15,845 pts — two heads, arm reaches -Y
  traffic_lights_pole:
    - usd: "ModernCityEnvironment01/Meshes/SM_Traffic_Lamp_001.usd"
      # 0.36 x 0.48 x 4.00 m, 2,641 pts

  # build_city's own intersection pass is switched off (intersection_chance: 0),
  # so this pool is unused. Kept non-empty so the old path still resolves if the
  # preset is run without the v2 launch script.
  traffic_lights:
    - usd: "ModernCityEnvironment01/Meshes/SM_Traffic_Lamp_001.usd"

  # ---- new categories ---------------------------------------------------------
  # Street trees, as distinct from `trees` (which the park scatter uses). Only
  # the cheap end of the AEC vegetation: the expensive species are 300k-800k
  # points each and a downtown places hundreds of these. See assets/aec/README.md.
  # GREEN FOLIAGE ONLY. The Brownstone deciduous trees are autumn variants —
  # their materials bind oakleaves1_fall2/5/6.png and ashtree_leaves_fall1.mdl —
  # which is where the red and orange trees came from. The Tower pack ships the
  # summer versions of the same species (oakleaves1_basecolor.png, no _fall), so
  # the street pool is drawn entirely from there.
  #
  # Excluded and why:
  #   Scarlet_Oak_fall (Brownstone) 40k — autumn, the red trees
  #   White_Ash                     66k — autumn (ashtree_leaves_fall1)
  #   Service_Berry                 84k — season unverified
  #   Douglas_Fir                   56k — conifer; wrong for a downtown kerb,
  #                                       and the likely source of the pale ones
  # Park-scatter trees. REPLACES the inherited pool (no `+`).
  #
  # Season decided by sampling each leaf albedo off Nucleus and taking the mean
  # hue over alpha-masked pixels (tools/foliage_season.py), not by asset name.
  #
  # WHITE GEOMETRY IS THE ONLY REASON ANYTHING IS EXCLUDED HERE. Check binding
  # with tools/material_binding.py, which walks GeomSubsets — NOT a per-Mesh
  # ComputeBoundMaterial, which is wrong for this library:
  #
  #     asset                          direct  subsets  unbound faces
  #     Muyang Tree_A / _B / _C          0       2/2        0.0%
  #     SM_Tree1 / SM_Tree2              0       2/2        0.0%
  #     BG_Building_A (control)          0       5/5        0.0%
  #     Scarlet_Oak                      5/6      -        35.5%
  #
  # Every UE-exported Dmytro asset binds PER GEOMSUBSET, so a per-Mesh
  # test reports the whole library as unbound. BG_Building_A is the control: it
  # reports direct_binding NONE and has always rendered correctly.
  #
  # Sampling a leaf ALBEDO FILE proves nothing either way — it says what the
  # texture contains, not whether any mesh references it.
  #
  # EXCLUDED, each on a measured defect or an explicit instruction:
  #   Scarlet_Oak / Scarlet_Oak_fall — 35.5% unbound faces; _fall is also red.
  #   RetroNeighborhood SM_Tree_02, SM_Tree_05 — rejected by name. SM_Tree_05
  #     names TWO assets (RetroNeighborhood 17.44 m, CityPark 5.04 m); the
  #     RetroNeighborhood one is the coarse 1,249-point model and is out, the
  #     CityPark one stays.
  #   RetroNeighborhood SM_Tree_07 — leaf albedo hue 5.8, a RED ornamental.
  # Nothing is held back for looking wrong to me. Anything else that should go,
  # say so and it goes.
  trees:
    - {usd: "airstack://scene_gen/assets/aec/tower/Assets/Vegetation/Shumard_Oak/Shumard_Oak.usd", scale: 0.01}
      # 4/4 meshes bound, 0% unbound faces, leaf basecolor hue 77 — safe green.
    - {usd: "airstack://scene_gen/assets/aec/tower/Assets/Vegetation/Black_Oak/Black_Oak.usd", scale: 0.01}
      # 10/11 bound, 0.2% unbound (123 pts of 48,701, one branch stub) — safe.
      # ~40-55k pts each, so park density only: at 317 street trees the oaks
      # were 37.8% of the whole scene.
      #
      # Scarlet_Oak is PULLED: 35.5% of its faces are unbound — an 11,697-point
      # leaf mesh with no material, which renders white. Scarlet_Oak_fall is the
      # same geometry with red leaf art (hue 9.9), so it carries both faults.
      # This is a measured render defect, not a preference.
    # DownTown Tree_A / Tree_B / Tree_C are OUT — the whole pack's
    # vegetation, rejected on how it renders. They shared one leaf atlas, so
    # dropping one and keeping the others would have kept the same look.
    # Only the TREES from that pack go; its paths, patio furniture, bus shelter
    # and BG_Building_* massing are unaffected.
    # Rejected by name, cumulatively: RetroNeighborhood SM_Tree_02, _05, _06,
    # _07; CityPark SM_Tree_01, _05; Dmytro SM_Tree1, SM_Tree2. Every Dmytro
    # street tree is now out, which is why street_trees above falls back to the
    # AEC oaks.
    - {usd: "CityPark/Props/SM_Stump.prop.usd",    scale: 0.01, tags: ["stump"]}
    - {usd: "CityPark/Props/SM_Stump_02.prop.usd", scale: 0.01, tags: ["stump"]}
    - {usd: "CityPark/Props/SM_Stump_03.prop.usd", scale: 0.01, tags: ["stump"]}

  # REPLACES the inherited pool (no `+`) purely to scale the stones up. The
  # CityPark stones are boulder assets authored small; at the inherited 0.01
  # they sit ankle-high, so a seating circle built around them reads as an empty
  # roundabout. 2.5x puts them at knee-to-waist height — something the ring is
  # plausibly built around. The DowntownWest rocks are metre-authored and are
  # already the right size, so they carry no scale.
  rocks:
    # PER-ASSET, DERIVED FROM MEASUREMENT, not a blanket multiplier. The
    # CityPark stones are authored 10x apart from each other — raw max dimension
    # 487.6 / 313.0 / 54.2 / 66.0 — so ANY single scale makes two of them
    # boulders the size of a building and the other two pebbles. Each is scaled
    # to the same ~2.6 m max dimension: big enough to build a seating circle
    # around, small enough to sit under a canopy.
    # The DowntownWest rocks are metre-authored at 2.35-2.51 m, already the
    # target, so they carry no scale.
    - {usd: "CityPark/Props/SM_Stone_04.prop.usd", scale: 0.0053}   # 487.6 -> 2.6 m
    - {usd: "CityPark/Props/SM_Stone_05.prop.usd", scale: 0.0083}   # 313.0 -> 2.6 m
    - {usd: "CityPark/Props/SM_Stone_08.prop.usd", scale: 0.0480}   #  54.2 -> 2.6 m
    - {usd: "CityPark/Props/SM_Stone_09.prop.usd", scale: 0.0394}   #  66.0 -> 2.6 m
    - "Downtown_West/Assets/props/prop_rocks/SM_rock_large_a_low.usd"   # 2.51 m, as authored
    - "Downtown_West/Assets/props/prop_rocks/SM_rock_medium_a_low.usd"  # 2.37 m, as authored
    - "Downtown_West/Assets/props/prop_rocks/SM_rock_medium_b_low.usd"  # 2.35 m, as authored

  # REPLACES the inherited pool (no `+`) to drop SM_Grass_Flowers2, which lives
  # in tracked shared.yaml and so cannot be removed at source. Everything else
  # from shared.yaml is carried over verbatim.
  plants:
    - "ModernCityEnvironment01/Meshes/SM_Grass.usd"
    - "ModernCityEnvironment01/Meshes/SM_Grass_Flowers.usd"
    - "ModernCityEnvironment01/Meshes/SM_Grass_Flowers1.usd"
    - "ModernCityEnvironment01/Meshes/SM_Bush_1.usd"
    - "ModernCityEnvironment01/Meshes/SM_Bush_2.usd"
    - {usd: "DownTown/Assets/Plant_Red.usd",    scale: 0.01}
    - {usd: "DownTown/Assets/Plant_Purple.usd", scale: 0.01}
    - {usd: "DownTown/Assets/Plant_Pink.usd",   scale: 0.01}

  # Dmytro ModernCityEnvironment, not the AEC oaks. Three reasons, measured:
  # the oaks are 10-25 m canopies of dense foliage that close over the street;
  # they cost 40-55k points each and at 317 trees were 37.8% of the entire
  # scene; and they are a fourth art family. SM_Tree2 at a 9.4 m canopy is the
  # right size for a kerb, and at 9.4k points it is 4-6x cheaper.
  # MEASURED with UsdShade.MaterialBindingAPI: SM_Tree1 and SM_Tree2 have
  # meshes=1, bound=0 — NO material binding at all, which is why they render
  # white. So do Muyang Tree_A/B/C and the whole Downtown_West foliage set.
  # The CityPark trees are the only cheap ones that are actually textured, and
  # at ~1.2k points they are 8-16x cheaper than the untextured ones they
  # replace: street_tree was 533 x 19,768 = 7.9M points, 12% of the scene.
  # ONE street-tree species, two sizes. A real street is planted with a single
  # species per block, not a mixed arboretum.
  # SM_Tree_05 is out: both assets carrying that name are now rejected.
  # MEASURED: the AEC oaks are unaffordable here. At 618 street trees Shumard_Oak
  # is 33.8M points — 36% of the scene, taking the total to 93.5M, above the
  # 89.1M that OOM-killed this scene once already. Even at double the spacing it
  # is ~17M. Street trees are the highest-count category in the city, so the
  # per-asset cost has to be small; the oaks stay in `trees` for the park, where
  # there are ~300 of everything rather than 600 of one thing.
  #
  # EMPTY ON PURPOSE — THE LIBRARY IS EXHAUSTED. Every tree in it has now been
  # rejected by name: Dmytro SM_Tree1/SM_Tree2, DownTown Tree_A/B/C, the
  # whole RetroNeighborhood family (SM_Tree_01..07), and CityPark SM_Tree_03,
  # _04, _05, _08. Nothing bound at street scale remains, so the streets carry
  # no planting at all rather than something already turned down.
  #
  # The two AEC oaks are the only trees left, and they cannot do this job: at
  # 631 street trees Shumard_Oak measures 33.8M points and took the scene to
  # 93.5M against the 89.1M that OOM-killed it once. Spacing them far enough
  # apart to afford (~125 m) is far enough apart to read as nothing. They stay
  # in `trees`, where a park places a few hundred rather than six hundred.
  #
  # UNBLOCKING THIS NEEDS ONE NEW ASSET, against four testable criteria:
  #   bound        via GeomSubsets — tools/material_binding.py, NOT a per-Mesh
  #                ComputeBoundMaterial, which false-negatives on this library
  #   green        leaf albedo traced through the BOUND material, not the file
  #   8-12 m       actual street-tree scale
  #   <10k points  so 600 instances stay under ~6M
  # Three species, from the AEC vegetation sets — local files that were never in
  # a pool, so never rejected. All measured: 0% unbound faces, leaf material is
  # an evergreen/summer MDL, 6-20 m.
  #
  # EXCLUDED after measuring, so they are not retried:
  #   White_Ash        9.6 m, 66k, 0% unbound — but binds ashtree_leaves_fall1,
  #                    an AUTUMN variant. Yellow, against green-only.
  #   Service_Berry    9.2 m — 48.0% unbound faces, renders half white.
  #   Scarlet_Oak      12.8 m — 35.5% unbound.
  #   Honey_Locust     8.2 m and the classic American street tree, but 331,786
  #                    points — 6x these, and unaffordable at this count.
  #   Hawthorn 596k, American_Beech 305k, Largetooth_Aspen 198k — same reason.
  #
  # COST: ~53k points each against the 1-9k of the Nucleus trees that were
  # rejected. All AEC vegetation is archviz-grade, so there is no cheap option
  # left in the library — street_trees.spacing_m carries this, see the preset.
  street_trees:
    - {usd: "airstack://scene_gen/assets/aec/tower/Assets/Vegetation/Shumard_Oak/Shumard_Oak.usd", scale: 0.01}
      # 11.4 m, 54,766 pts, 4/4 bound, oakleaves1 — green
    # Black_Oak is NOT here: 19.7 m tall with a 25.4 m crown is a park specimen,
    # not a kerb tree — it would overhang the whole carriageway. It stays in
    # `trees` for the park.
    - {usd: "airstack://scene_gen/assets/aec/brownstone/Assets/Vegetation/Trees/Douglas_Fir.usd", scale: 0.01}
      # 6.0 m, 56,262 pts, 8/8 bound, Pine_needles — evergreen conifer

  # Tree guards. Each carries a PAYLOAD REFERENCE TO ITS OWN TREE, so a guard is
  # placed *instead of* a bare street tree, not on top of one — see city_detail.
  #
  # COST WARNING, measured (tools/measure_assets.py, after the payload resolves):
  #     PlanterFenceType1  215,627 pts   (bundles Largetooth_Aspen 198k)
  #     PlanterFenceType2  349,638 pts   (bundles Honey_Locust     332k)
  #     PlanterFenceType3  614,058 pts   (bundles Hawthorn         596k)
  # against 40-84k for a bare street tree. At guard_chance 0.45 that was 173
  # guards = 65.8M points, 73.8% of the whole scene, and it OOM-killed Isaac Sim.
  #
  # The bundled species are the expensive ones deliberately excluded from
  # street_trees above — the guard smuggles them back in. Only Type1 is kept,
  # and city_detail's guard_chance is turned down hard. Worth knowing: an
  # earlier measurement read 17,852 pts for these, because the payload could not
  # resolve at the time (the directory layout was renamed); the tree was simply
  # missing from the count. Always re-measure after moving pack directories.
  # EMPTY ON COST. Measured at 800 m: 56 guards x 215,627 pts = 12.1M points,
  # 18.7% of the entire scene — the single largest consumer, for 56 objects.
  # The cost is the AEC tree bundled in the payload, not the metal ring. A bare
  # CityPark street tree is 1.2k. Re-enable only with a cheap tree substituted.
  planter_fences: []
    # - usd: "airstack://scene_gen/assets/aec/brownstone/Props/PlanterFence/PlanterFenceType1.usd"
    #   scale: 0.01        # 5.09 x 5.20 x 8.26 m (incl. tree), 215,627 pts
    # Held back on cost alone — re-enable if the budget allows:
    # PlanterFenceType2 (349,638), PlanterFenceType3 (614,058)

  mailboxes:
    - usd: "airstack://scene_gen/assets/aec/brownstone/Props/Mailbox/MailboxType01.usd"
      scale: 0.01          # 0.65 x 0.52 x 1.34 m
    - usd: "airstack://scene_gen/assets/aec/brownstone/Props/Mailbox/MailboxType02.usd"
      scale: 0.01          # 0.76 x 0.61 x 1.14 m

  # Frontage-zone seating — sits against the building line, not the kerb.
  cafe_sets:
    - usd: "airstack://scene_gen/assets/aec/brownstone/Props/Kalmar_TblChr/Kalmar_TblChr.usd"
      scale: 0.01          # 2.43 x 2.42 x 1.01 m

  # ---- categories with no art wired in yet ------------------------------------
  # city_detail.py skips any category with an empty pool and logs it, so these
  # stay declared: the intent is documented and enabling one is a one-line edit.
  #
  # The candidates below were found with
  #   objaverse_assets.py search "<query>" --max-faces 60000
  # and are recorded as uid / faces / likes. They are NOT vetted — Objaverse's
  # texture count only says images exist in the archive, not that the materials
  # sample them, and an untextured asset renders as a grey blob. Vet before
  # uncommenting:
  #   objaverse_assets.py ensure <uid> --target-size <m>
  #   uv run --script render_usd.py assets/objaverse/<uid>/
  # Note: adding ANY objaverse:// entry here means urban scenes gain a
  # prepare_assets.py pre-flight they do not currently need.

  # Sourced from the City Tower pack — no Objaverse needed, so the urban set
  # still requires no prepare_assets.py pre-flight.
  bollards:
    - usd: "airstack://scene_gen/assets/aec/tower/Assets/Bollard_01/Bollard_01.usd"
      scale: 0.01          # 0.19 x 0.19 x 0.80 m, 2.6k pts
    # Objaverse alternates, if more variety is wanted (unvetted):
    # - {usd: "objaverse://9b9db79ae21c4e118423efae658e7fb7", target-size-m: 0.9}   # Street Bollard, 1.5k faces
    # - {usd: "objaverse://1ccd0c761fc744a3a62e168044a9d2eb", target-size-m: 0.9}   # Bollard, 4.8k

  # Vertical separator posts for the protected stretches of a bike lane. Kept
  # apart from `bollards` (a kerb prop) because these are placed by the bike
  # lane pass at a regulated spacing along the buffer, and because the point
  # budget only tolerates a 138-face asset repeated hundreds of times.
  # FHWA Separated Bike Lane Guide ch.4 posts are 28-48 in tall; 1.0 m sits in
  # that band and matches the 36 in (0.91 m) delineator NACTO illustrates.
  bike_lane_delineators:
    - {usd: "objaverse://532b02858c67410f9a1973544f25dcc4", target-size-m: 1.00, fit: height}  # 138f, 12L

  parking_meters:
    - {usd: "objaverse://cfaf0f457ca244e59c746ebdd6f3ad6c", target-size-m: 1.30, fit: height}  # Parking Meter, 12.3k, 27L
    # Held back: a1932b57… Parking Meter (34.9k) — 3x the polys for no gain.

  # NOTE ON PACKS: several entries below are multi-asset — one file holding
  # several props, so a single placement lands a cluster rather than one object.
  # That is accepted deliberately: a rack with bikes already parked at it, or a
  # sign cluster, is what a real kerb looks like, and unwanted prims can be
  # pruned or nudged on the stage afterwards. `target-size-m` then sizes the
  # WHOLE cluster, not one item, so packs get a larger value.
  # ONE rack, and smaller. 8c8fd4fa (Bike Rack #4) was the oversized one; at
  # target-size-m 1.00 with the default `fit` the largest bbox axis was driven
  # to 1 m, which on a wide multi-hoop rack scales the whole thing up. Fitting
  # on HEIGHT instead pins it to a real 0.75 m hoop and lets the length follow.
  bike_racks:
    - {usd: "objaverse://8c8fd4fa06eb4b1c8db5bd3584892f3c", target-size-m: 0.75, fit: height}  # Bike Rack #4, 1.1k
    # Removed 38c8c08e… BICYCLE PARKING: not a pack at all but ONE merged
    # 45,156-point mesh, and it has a baked sand ground plane in it — so it
    # drops a tan patch of desert on the pavement and cannot be split apart.

  dumpsters:
    - {usd: "objaverse://093e5b05faa947729b1be24c013e563b", target-size-m: 1.80}  # LOW POLY - DUMPSTER, 6.3k, 160L
    - {usd: "objaverse://f80a2a0af6924562be10be7354b7a72f", target-size-m: 1.80}  # Dumpster, 3.3k, 141L
    # Held back: 989ea7f0… dumpster (11.2k, 218L), bed7cc22… Dumpster (17.3k),
    # 15e01b41… Dumpster Old and weathered (2.5k) — weathering reads wrong in a
    # pristine city, keep for the disaster sets.

  signs_stop:
    - {usd: "objaverse://a3963ab8133b45cab4e60da94d255ac3", target-size-m: 2.40, fit: height}  # Stop-sign-ts, 100f

  signs_street_name:
    - {usd: "objaverse://555fbab686004738b974373f6ad71d82", target-size-m: 2.40, fit: height,
       yaw-offset: 180.0}  # Road Sign (speed limit), 104f — face was to the kerb
    - {usd: "objaverse://599a74c1c8fd4f19bf6754b8128da6b8", target-size-m: 2.40, fit: height}  # Street Sign Final, 148f
    # REMOVED 13eeb2da… "Road Traffic Sign" (7.2k, 597 likes): its USD carries a
    # `sign_fbx/CINEMA_4D_Editor` prim — the authoring app's editor scaffolding
    # exported into the asset, which composes into the scene as junk geometry.
    # Both packs removed after splitting them with asset_packs.py. A cluster is
    # fine when it is a cluster of the right thing; these are not:
    #   7fac2b1b… Road signs pack — 14 signs laid out FLAT in a 2.8 cm plane, so
    #             it places as a signboard rather than posts
    #   741e5442… Street Props    — a bench, bins, cones and barriers, i.e. an
    #             assortment dropped wherever a street-name sign was asked for
    # Re-addable as individual sub-prims once scene_generator's AddReference
    # can take a prim path (it currently takes the asset only, so the whole
    # default prim always comes in).

  phone_booths:
    - {usd: "objaverse://1ac9bf684da3476d918fd086d554bd5c", target-size-m: 2.20, fit: height}  # Phone Booth, 256f, 182L
    # Held back: 3b50fb74… Public Phone Booth (12.9k)

  # Carriageway props — placed by city_detail.build_road_surface, which walks
  # the road corridors rather than the block frontage ring.
  # Different art from the DowntownWest SM_sewer_cap_* set, which is out by
  # request. One of each — a city uses one municipal casting pattern, not three.
  manholes:
    - {usd: "objaverse://a657396d68fa43f0ac7da12a6403d59f", target-size-m: 0.62, fit: footprint}  # Manhole, 1,456f

  # NOT a grate: no gutter-inlet asset exists in any pack surveyed, so this is a
  # second cover pattern standing in. Worth replacing when one turns up.
  storm_drains:
    - {usd: "objaverse://bbf5c9aa04c24fbaba328728d955777d", target-size-m: 0.70, fit: footprint}  # Manhole, 72f

  billboards: []
    # - {usd: "objaverse://864b8ce5d520478481198d1face5a7e5", target-size-m: 6.0}  # Low poly Ad Billboard, 420f, 40L
    # STILL PARKED, and honestly so: a billboard is roof- or wall-mounted, and
    # nothing here knows where a building's roof or facade is. build_city
    # returns building placements but not their heights, so a rooftop pass has
    # to re-measure each building through the resolver first. That is a real
    # piece of work, not a config line — see the note in generate_city_v2.

  # Roadworks. Placed sparsely — a working city always has some, but a pristine
  # scene should not read as a construction site. The barrier packs are the
  # useful ones here: a pre-arranged cone-and-barrier cluster is exactly what a
  # works zone looks like, and beats scattering single cones evenly.
  # ONE cone. e03b1d2d ("Traffic Cones") is out by request — it is also a 19k
  # point PACK, so each placement dropped a cluster rather than a cone. The
  # other two packs go with it for the same reason.
  traffic_cones:
    - {usd: "objaverse://8cdac192abd044988c314eeb6377a3a0", target-size-m: 0.75, fit: height}  # Traffic cone (Game ready), 1.7k

  # Held back entirely: utility_poles. Every candidate read as rural
  # (single-pole rural distribution, WW2 scene, sci-fi), not urban.
  utility_poles: []

  # Held back: 8d6cf232… Ticket vending machine (654f) — the only **by-nc**
  # licence in the picked set, and a ticket machine rather than a newsstand.
  # Kept out so the whole asset set stays uniformly CC-BY.
  newspaper_boxes: []

  # REMOVED. These were the repeated lit pylons: the Tower pack ships exactly
  # two sign assets and they are the same object — both 0.40 x 0.40 x 2.09 m,
  # identical silhouette (9,201 vs 9,308 pts), both under rh_Boardwalk, both
  # binding only RustedMetal + Light_1900K. No name texture, no variant set
  # anywhere in the pack, so there was nothing to vary.
  #
  # For real street-name variety: DownTown/Assets/StreetSigns_*.usd —
  # 12 distinct textured blades (1st Ave, W 42 st, ...), 8 pts each. They are
  # blades with no post, so they need a mount before they can be a category.
  signs_parking: []



# --- asset-specific fixups (moved from presets/urban_v2.yaml, Phase 1) -------
# These name asset uids and categories, not generator behaviour, so they belong
# with the assets rather than in a scene spec or in default.yaml.
surface_overrides:
  - categories: [trail]
    roughness: 0.92
    metallic: 0.0

prune_prims:
  - usd_contains: "599a74c1c8fd4f19bf6754b8128da6b8"
    # "Street Sign Final" — a street-name blade with a stop sign welded on,
    # so every street-name post also planted a stop sign.
    prims: ["pCube4", "pCube44"]

