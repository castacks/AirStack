    # THE SAME ELEVEN DMYTRO SHEDS `urban.yaml` FILES UNDER `midrise`, under a
    # key that says what they are. Measured, they are 11.1-16.7 m — four to
    # five storeys — and calling that a mid-rise is why the city came out the
    # way it did: of the 163 buildings whose size was known in the 800 m plan,
    # 118 (72%) were under 20 m and 98 of those were these. They are not
    # removed from `urban.yaml`'s `midrise` (that pool is what `downtown.yaml`
    # and the earthquake preset build from and is not this scene's business);
    # the GAC preset's typologies simply draw from THIS key instead.
    rowhouse+:
      # ---- standalone drop, 2026-08-26: rendered terrace houses -----------
      # Door on -X, which is the front `_lay_terrace` assumes at facing 0, so
      # they need no `yaw-offset`. They are 3.9-8.4 m DEEP against the
      # brownstones' 21.1 m, and that is safe here: `_lay_terrace` sizes its
      # strips by the pool's DEEPEST member, so adding shallower stock cannot
      # move the band — a shallow house simply leaves a wider alley behind it.
      # Adding anything DEEPER than 21.1 m would move it for everyone.
      - {usd: "omniverse://airlab-nucleus.andrew.cmu.edu:443/Projects/SEI-COA/scene_gen/assets/standalone/buildings/intact/rowhouse/house_01/house_01.usdc", material: concrete}
