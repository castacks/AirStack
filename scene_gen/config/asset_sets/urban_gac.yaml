# ASSET SET: urban_gac — the GreatAmericanCity buildings, nothing else.
#
# `extends: urban_nucleus` for streets, furniture, greenery and vehicles, then
# REPLACES the building pools. A bare key replaces the inherited pool; `intact+`
# would have appended and left the other packs in the mix.
#
# THREE THINGS THIS FILE ENCODES, all of them measured rather than guessed
# (`tools/gac_faces.py` -> `_plans/gac_faces.json`, triangle density per
# elevation against each building's own best side):
#
# 1. `yaw-offset` PER ASSET. These buildings do not share a front: 01 fronts E,
#    03 fronts S, 22 fronts W, 24 fronts N. A layout rule can only orient a pool
#    that agrees on which way is forward, so each asset is turned here until its
#    good elevation points -X, which is what `_terrace_rows` assumes at
#    `facing_deg` 0. Without this one rule oriented some correctly and spun the
#    rest to face the block interior.
#
# 2. WHICH POOL. `districts.typologies.<name>.pools` names KEYS under
#    `usds.buildings` — not tags. `urban.yaml` defines rowhouse/midrise/tower;
#    `urban_nucleus` does not, so extending the nucleus alone leaves all three
#    EMPTY and the zoning pass replaces every building with nothing
#    ("POOL EMPTY (asset paths unresolved?)", 325 replaced by 0).
#
# 3. DEPTH DECIDES THE POOL. `_terrace_strips` lays two back-to-back rows only
#    where the block's short side is in `[2*depth + alley, 2*depth + alley_max]`.
#    Terrace is the morphology these assets want — two rows is the cap asked
#    for, and a party wall covers the blank flanks that most of them have — so
#    everything shallow enough to terrace goes to `rowhouse`, the 44 m-deep 09
#    to `midrise`, and only the three too deep to terrace at this block size
#    (20, 21, 22 at 58-62 m) fall back to `tower`/pack. Those three are also the
#    ones with the fewest blank flanks, so pack costs least there.
#
# BLANK-FLANK CLASSES, for the record and for whoever wires the run-end rule:
#   mid-terrace only (both flanks blank): 01 04 05 06_Small 07 25 26
#   end or corner ok (one flank blank)  : 02 03 09 22 24 29
#   anywhere         (no blank flank)   : 20 21

extends: urban_nucleus

usds:
  buildings:
    # every one of the fifteen, so nothing can drop out of the city
    intact:
      - usd: "omniverse://airlab-nucleus.andrew.cmu.edu:443/Projects/SEI-COA/GreatAmericanCity/Assets/Game/GreatAmericanCity/Meshes/SM_Building_01.usd"
        scale: 0.01
        yaw-offset: 180    # front E -> W
