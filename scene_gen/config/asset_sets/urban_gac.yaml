    # ---- brick_midrise: 38-72 m, TERRACE ----------------------------------
    # The user's request: "GAC's mid rise brick buildings should be it's own
    # district similar to brownstones."
    #
    # And they genuinely are terrace stock — that is not a styling choice, it
    # is what the measurement says. Seven of these nine are `place_mid`: ONE
    # modelled elevation, blank on the other three. A building modelled on one
    # face can only ever stand in the interior of a run with neighbours
    # covering both flanks. Free-standing it reads as three missing walls.
    #
    # DEPTH DECIDES THE BLOCK SIZE, and depth means the X extent AFTER
    # `yaw-offset` — `_lay_terrace` takes `max(sx)` over the pool. Fronts are
    # normalised to -X, so a front-E asset keeps its W as depth and a front-S
    # asset (03) contributes its D. Deepest here is SM_Building_04 at 31.5 m,
    # putting the admissible band at [2*31.5 + alley_m, 2*31.5 + alley_max_m].
    #
    # SM_Building_09 (44.1 m), _24 (58.0 m after its 90 yaw swaps the axes) and
    # _21/_22 (58 m) are deliberately NOT here: one deep member moves the band
    # for the whole pool and would refuse every block the shallow stock fits.
    #
    # A RUN NEEDS TWO END-CAPABLE PIECES AND THIS POOL NEARLY HAD ONE.
    # `_order_run` puts `end`/`corner`/`any` stock at the two ends of a terrace
    # run and `mid` in the interior, and DROPS a run it cannot lay legally. Of
    # the nine brick assets, eight are `place_mid` — one modelled elevation —
    # and only SM_Building_03 is `place_end`, so no run could ever close and
    # every brick_midrise block was refused however well the block fitted the
    # band. SM_Building_26 (`any`, brick, and the shallowest in the pool at
    # 14.3 m) and SM_Building_30 (`any`, 28.4 m) are here to cap runs.
    #
    # 30 is NOT brick — it is windowed concrete (`M_Building_30_Win_Concrete`).
    # It is in because the alternatives that are brick and end-capable are all
    # too deep to terrace: 09 at 44.1 m, 21/22 at 58 m, 08 at 86.2 m. One
    # concrete end against seven brick fronts is a normal thing on a real
    # street; a district that cannot lay a single run is not.
