# ASSET SET: urban_gac — GreatAmericanCity, filled out with downtowncity.
#
# PURELY ADDITIVE (user, 2026-08-29): "the og urban_v2.yaml/urban.yaml is the
# base. Everything in there looks good ... GAC and downtowncity have to ADD to
# this, not replace it." So `extends: urban` and EVERY pool below is written
# `<name>+`. A bare key REPLACES the inherited pool — that is how the greenery
# got cut to a single tree once already, and it is the mistake to watch for
# here, because the two spellings differ by one character and neither errors.
#
# See `.agents/skills/urban-layout` for the reasoning. In short, three per-asset
# facts, all MEASURED (`tools/gac_faces.py`, triangle density per elevation
# against that building's own best side):
#
# 1. `yaw-offset` — these packs do not agree on which way is forward. Among the
#    fifteen GreatAmericanCity buildings, 01 fronts E, 03 fronts S, 22 fronts W
#    and 24 fronts N. A layout rule can only orient a pool that agrees on a
#    front, so each asset is turned here until its best elevation points -X,
#    which is what `_lay_terrace` assumes at `facing_deg` 0. Without this, one
#    rule oriented some correctly and spun the rest to face the block interior.
#
# 2. `tags: [place_*]` — HOW MANY ELEVATIONS ARE MODELLED decides where a
#    building may stand (user, 2026-08-29):
#       place_mid     1 modelled side  — interior of a run, both flanks covered
#       place_end     2 modelled sides — an end of a run, one flank covered
#       place_corner  3 modelled sides — a corner; only its back is blank
#       (untagged)    4 modelled sides — anywhere
#    `districts._order_run` orders each terrace run by these and DROPS a run it
#    cannot lay legally, rather than laying a blank wall against a street.
#
# 3. WHICH POOL. `districts.typologies.<name>.pools` names KEYS under
#    `usds.buildings`, not tags. `urban.yaml` defines rowhouse/midrise/tower;
#    `urban_nucleus` does not, so extending the nucleus alone leaves all three
#    EMPTY and zoning replaces every building with nothing ("POOL EMPTY (asset
#    paths unresolved?)", 325 replaced by 0).
#
# UNITS ARE PER PACK AND MUST BE MEASURED, NOT ASSUMED. GreatAmericanCity is
# centimetre-authored (`scale: 0.01`); downtowncity is METRES (`mpu = 1`, so
# `scale: 1.0`). Assuming 0.01 for both shrank every downtowncity building to
# ~0.4 m, and the packer duly fitted 5628 of them into 26 blocks instead of
# ~120. A wrong scale does not error — it changes the layout.
#
# FILLERS: `scene_gen/assets/downtowncity/` — 15 buildings, 11 of them modelled
# on all four elevations, so they are what a block gets when the run rules leave
# a hole. `selected_citydemo` is deliberately absent: those 112 low-poly
# monoliths were excluded by review.

# The 2026-08-13 urban library/layout is the baseline.  The newer GAC and
# downtowncity buildings below are additive; they must not replace the AEC
# brownstones, Dmytro mid-rises, or Muyang towers that produced urban_v2.json.
extends: urban

usds:
  buildings:
    # ---- intact: EVERY building, for the pre-rezone pass -------------------
    # `build_city` packs from `intact` BEFORE `districts.rezone_blocks` runs,
    # and rezone then deletes and rebuilds every block it zones. A block that
    # never gets zoned keeps what this pool gave it, so everything belongs
    # here — the typology pools below are the ones that actually shape a
    # district.
    intact+:
      - usd: "omniverse://airlab-nucleus.andrew.cmu.edu:443/Projects/SEI-COA/GreatAmericanCity/Assets/Game/GreatAmericanCity/Meshes/SM_Building_01.usd"
