# Asset material tags — debris. The SURVEY behind the tags, not the tags
# themselves: applied to `urban_nucleus.yaml` on 2026-08-25 as per-asset
# `material:` keys, which is what the generator reads
# (`scene_generator.asset_materials`, then `disaster/debris.py`).
#
# The sibling of `urban.buildings.materials.yaml` and the same vocabulary, for
# the same reason: `disaster/debris.py` only gives a building the debris its
# own construction could have shed, so a piece of rubble has to say what it
# came off exactly as a building says what it is clad in.
#
# HOW THESE WERE JUDGED. Every asset was mirrored off Nucleus
# (`tools/nucleus.py`) and rendered from two angles in Cycles
# (`render_usd.py`), and the call is off the render. The DebrisPack assets
# corroborate it — each binds one named material instance
# (`Mat_Debris_Concrete_Inst`, `Mat_Debris_Blocks_Inst`,
# `Mat_Debris_Bricks_Red_Inst`, `Mat_Bricks_White_Inst`) — while the
# DestroyedBuildings `debris_*` all share ONE atlas (`MI_debris_1`,
# `MI_props_1`), so for those the geometry is the only evidence there is.
source: scene_gen/config/asset_packs/urban_nucleus.yaml
