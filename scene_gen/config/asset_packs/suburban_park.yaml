# ASSET SET: suburban_park — the suburb, plus the park's recreation content.
#
# `suburb_net.py` reserves ground for a park and `suburb_scene.py` builds its
# content into the reserve. That needs pools the suburban set has no reason to
# carry (hoops, goals, tennis courts, chain-link, gazebos, play equipment), and
# the park set has no reason to carry houses — so this joins the two.
#
# Cache both halves before `airstack up`:
#     .venv/bin/python scene_gen/prepare_assets.py --asset-pack suburban_park
#
# ORDER MATTERS AND IS NOT ALPHABETICAL. Parents merge LEFT TO RIGHT, so the
# LAST one wins any pool they share. park.yaml extends shared, which still
# carries the 14 RetroNeighborhood/CityPark trees and the 3 stumps that both
# urban and suburban reject — listing park last silently reinstated every
# one of them. suburban goes last so its curated pools win; park contributes
# only the recreation pools, which suburban never defines and so cannot
# clobber.
extends: [park, suburban]
