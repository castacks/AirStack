      - usd: "DebrisPack/Assets/Brick_white_06.usd"
        scale: 0.01
        material: brick

    # Mounds rather than single pieces: crushed grey rubble, one of them with
    # snapped columns and their rebar still standing out of it.
    piles:
      - usd: "DestroyedBuildings/Assets/debris_1.usd"
        scale: 0.01
        material: concrete
      - usd: "DestroyedBuildings/Assets/debris_12.usd"
        scale: 0.01
        material: concrete
      - usd: "DestroyedBuildings/Assets/debris_14.usd"
        scale: 0.01
        material: concrete
      - usd: "DestroyedBuildings/Assets/debris_15.usd"
        scale: 0.01
        material: concrete
