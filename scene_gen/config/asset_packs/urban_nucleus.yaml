# ASSET SET: urban — a dense modern city (mid-rise blocks, urban props).
#
# Extends `shared.yaml`, which carries everything a locale doesn't get to
# choose: street furniture, greenery, ground tiles, vehicles, people. What is
# left here is what actually makes a place an urban scene — the buildings, and the
# rubble they leave. This debris (concrete chunks, cinder block, brick) reads
# as city-building wreckage, so it is exclusive to this set rather than
# shared — a suburb leaves lumber and scraped earth instead, see
# `suburban.yaml`.

extends: shared

# ---- the urban-specific library ------------------------------------------------
usds:
  buildings:
    intact:
      - "ModernCityEnvironment/Collected_Building01/SM_MERGED_BP_MBuilding01.usd"
        # authored in meters; already matches the global default (1.0)
      - usd: "ModernCityEnvironment/Collected_Building02/SM_MERGED_BP_MBuilding02.usd"
        scale: 0.01
      - usd: "ModernCityEnvironment/Collected_Building03/SM_MERGED_BP_MBuilding03.usd"
        scale: 0.01
      - usd: "ModernCityEnvironment/Collected_Building05/SM_MERGED_BP_MBuilding05.usd"
        scale: 0.01
      - usd: "DownTown/Assets/BG_Building_A.usd"
        scale: 0.01
      - usd: "DownTown/Assets/BG_Building_B.usd"
        scale: 0.01
      - usd: "DownTown/Assets/BG_Building_C.usd"
        scale: 0.01
      - usd: "DownTown/Assets/BG_Building_D.usd"
        scale: 0.01
      - usd: "DownTown/Assets/BG_Building_E.usd"
        scale: 0.01
      - usd: "DownTown/Assets/BG_Building_F.usd"
        scale: 0.01
      # SM_House_01 was tagged suburban/rural — belongs in a suburban set,
      # not here:
      # - usd: "RetroNeighborhood/Props/SM_House_01.prop.usd"
      #   scale: 0.01

    damaged:
      - usd: "DestroyedBuildings/Assets/destroyed_building_4.usd"
        scale: 0.01
      - usd: "DestroyedBuildings/Assets/destroyed_building_4_variation_1.usd"
        scale: 0.01
      - usd: "DestroyedBuildings/Assets/destroyed_building_5.usd"
        scale: 0.01
      - usd: "DestroyedBuildings/Assets/destroyed_building_9.usd"
        scale: 0.01
      - usd: "DestroyedBuildings/Assets/destroyed_building_10.usd"
        scale: 0.01

    destroyed:
      - usd: "DestroyedBuildings/Assets/destroyed_building_1.usd"
        scale: 0.01
      - usd: "DestroyedBuildings/Assets/destroyed_building_2.usd"
        scale: 0.01
      - usd: "DestroyedBuildings/Assets/destroyed_building_5_variation_1.usd"
        scale: 0.01
      - usd: "DestroyedBuildings/Assets/destroyed_building_6.usd"
        scale: 0.01
      - usd: "DestroyedBuildings/Assets/destroyed_building_7.usd"
        scale: 0.01
      - usd: "DestroyedBuildings/Assets/destroyed_building_8.usd"
        scale: 0.01
      - usd: "DestroyedBuildings/Assets/destroyed_building_9_variation_1.usd"
        scale: 0.01
      - usd: "DestroyedBuildings/Assets/destroyed_building_10_variation_1.usd"
        scale: 0.01
      - usd: "DestroyedBuildings/Assets/destroyed_building_11_variation_1.usd"
        scale: 0.01
      - usd: "DestroyedBuildings/Assets/destroyed_building_12.usd"
        scale: 0.01

  debris:
    # Concrete/masonry mid-rise wreckage — generic chunks plus cinder block
    # and brick. Exclusive to this set: a timber-frame suburb leaves none of
    # it (see suburban.yaml).
    #
    # `material:` MEANS THE SAME THING HERE AS ON A BUILDING. A piece of
    # rubble came off something, and `disaster/debris.py` will only give a
    # building the debris its own construction could have shed — so a brick
    # rowhouse drops brick and a concrete frame drops slab. The label is the
    # facade vocabulary (`tools/tag_asset_materials.py`: wood / concrete /
    # brick / steel / glass, plus `earth` for ground spoil), turned into a
    # structure by `mesh_damage.STRUCTURE_OF` exactly as a building's is.
    # Every entry below was rendered and looked at (2026-08-25) — see
    # `urban.debris.materials.yaml` for the survey and the per-asset notes.
    #
    # NOTHING HERE IS STEEL OR GLASS, and the set has six steel and three
    # glass buildings. They fall back to concrete rubble (`debris.SHEDS`);
    # bent sheet, mullion and glazing debris is the gap to fill next.
    pieces:
      # Broken slabs and block chunks off a cast frame — grey, spalled, some
      # with the reinforcement showing.
      - usd: "DestroyedBuildings/Assets/debris_2.usd"
        scale: 0.01
        material: concrete
      - usd: "DestroyedBuildings/Assets/debris_3.usd"
        scale: 0.01
        material: concrete
      - usd: "DestroyedBuildings/Assets/debris_4.usd"
        scale: 0.01
        material: concrete
      - usd: "DestroyedBuildings/Assets/debris_5.usd"
        scale: 0.01
        material: concrete
      - usd: "DestroyedBuildings/Assets/debris_6.usd"
        scale: 0.01
        material: concrete
      - usd: "DestroyedBuildings/Assets/debris_7.usd"
        scale: 0.01
        material: concrete
      - usd: "DestroyedBuildings/Assets/debris_8.usd"
        scale: 0.01
        material: concrete
      - usd: "DestroyedBuildings/Assets/debris_9.usd"
        scale: 0.01
        material: concrete
      - usd: "DestroyedBuildings/Assets/debris_10.usd"
        scale: 0.01
        material: concrete
      - usd: "DestroyedBuildings/Assets/debris_11.usd"
        scale: 0.01
        material: concrete
      # Smooth pale lumps — `Mat_Debris_Concrete_Inst`. Read as spalled
      # concrete and render/plaster off it rather than as cut fragments.
      - usd: "DebrisPack/Assets/Debris_01.usd"
        scale: 0.01
        material: concrete
      - usd: "DebrisPack/Assets/Debris_02.usd"
        scale: 0.01
        material: concrete
      - usd: "DebrisPack/Assets/Debris_03.usd"
        scale: 0.01
        material: concrete
      - usd: "DebrisPack/Assets/Debris_04.usd"
        scale: 0.01
        material: concrete
      - usd: "DebrisPack/Assets/Debris_05.usd"
        scale: 0.01
        material: concrete
      - usd: "DebrisPack/Assets/Debris_06.usd"
        scale: 0.01
        material: concrete
      - usd: "DebrisPack/Assets/Debris_07.usd"
        scale: 0.01
        material: concrete
      - usd: "DebrisPack/Assets/Debris_08.usd"
        scale: 0.01
        material: concrete
      - usd: "DebrisPack/Assets/Debris_09.usd"
        scale: 0.01
        material: concrete
      - usd: "DebrisPack/Assets/Debris_10.usd"
        scale: 0.01
        material: concrete
      - usd: "DebrisPack/Assets/Debris_11.usd"
        scale: 0.01
        material: concrete
      - usd: "DebrisPack/Assets/Debris_12.usd"
        scale: 0.01
        material: concrete
      # Hollow cinder blocks, snapped through the web so the cell shows.
      # `concrete` and not `brick`: it is a concrete masonry unit and it
      # renders grey. A brick wall never sheds one.
      - usd: "DebrisPack/Assets/Blok_1_LODs.usd"
        scale: 0.01
        material: concrete
      - usd: "DebrisPack/Assets/Blok_2_LODs.usd"
        scale: 0.01
        material: concrete
      - usd: "DebrisPack/Assets/Blok_3_LODs.usd"
        scale: 0.01
        material: concrete
      - usd: "DebrisPack/Assets/Blok_4_LODs.usd"
        scale: 0.01
        material: concrete
      # Single bricks, whole and part-broken. The only masonry in the set, so
      # the brownstone rows depend on them.
      - usd: "DebrisPack/Assets/Brick_red_01.usd"
        scale: 0.01
        material: brick
      - usd: "DebrisPack/Assets/Brick_red_02.usd"
        scale: 0.01
        material: brick
      - usd: "DebrisPack/Assets/Brick_red_03.usd"
        scale: 0.01
        material: brick
      - usd: "DebrisPack/Assets/Brick_red_04.usd"
        scale: 0.01
        material: brick
      - usd: "DebrisPack/Assets/Brick_red_05.usd"
        scale: 0.01
