# ASSET SET: urban — a dense modern city (mid-rise blocks, urban props).
#
# Extends `shared.yaml`, which carries everything a locale doesn't get to
# choose: street furniture, greenery, ground tiles, vehicles, people. What is
# left here is what actually makes a place an urban scene — the buildings, and the
# rubble they leave. This debris (concrete chunks, cinder block, brick) reads
# as city-building wreckage, so it is exclusive to this set rather than
# shared — a suburb leaves lumber and scraped earth instead, see
# `suburban.yaml`.

extends: shared

# ---- the urban-specific library ------------------------------------------------
usds:
  buildings:
    intact:
      - "ModernCityEnvironment/Collected_Building01/SM_MERGED_BP_MBuilding01.usd"
        # authored in meters; already matches the global default (1.0)
      - usd: "ModernCityEnvironment/Collected_Building02/SM_MERGED_BP_MBuilding02.usd"
        scale: 0.01
      - usd: "ModernCityEnvironment/Collected_Building03/SM_MERGED_BP_MBuilding03.usd"
        scale: 0.01
      - usd: "ModernCityEnvironment/Collected_Building05/SM_MERGED_BP_MBuilding05.usd"
        scale: 0.01
      - usd: "DownTown/Assets/BG_Building_A.usd"
        scale: 0.01
