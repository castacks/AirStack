  # [park]
  # Borrowed from urban_v2, which already vetted and cached it: a bike rack is
  # the same object in a park as on a street.
  bike_racks:
    # DELIBERATELY THE SAME SPEC AS urban.yaml, character for character.
    # The objaverse cache is keyed by uid and holds ONE conversion, so two sets
    # asking for different sizes do not get one each — whichever was prepared
    # last silently rebakes the other's. This entry used to ask for
    # `target-size-m: 1.8` (plus a contradictory `scale: 0.01`), which pinned
    # the PLAN dimension and let the height ride to 3.76 m: not a rack in the
    # park, and it rebaked urban's racks to the same 3.76 m on the way past.
    #
    # 0.75 m on `fit: height` is urban's vetted spec and gives
    # 0.359 x 0.114 x 0.750 m — a short rack, but a rack. If the park wants a
    # bigger one, the answer is a DIFFERENT uid, not a second size for this one.
    - usd: "objaverse://8c8fd4fa06eb4b1c8db5bd3584892f3c"
      target-size-m: 0.75
      fit: height

