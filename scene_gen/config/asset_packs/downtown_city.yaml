# ASSET SET: downtown_city — `urban`, plus fifteen DowntownCity buildings.
#
# WHERE THEY CAME FROM
# --------------------
# `Projects/SEI-COA/DowntownCity` on Nucleus ships as a joined DCC export, not
# as USD. Three buildings are named objects in it; the other twelve had been
# MERGED INTO A MESH CALLED `Path and Imperfections` and their own objects left
# with zero vertices — see `../../assets/downtowncity/README.md`, which records
# how they were found and how to rebuild them.
#
# WHY IT EXTENDS RATHER THAN REPLACES
# -----------------------------------
# Fifteen buildings would make a thin city on their own: `districts` packs a
# 500 m map with 80-odd buildings, so each would land five times and the blocks
# would read as copies. Appended to `urban`'s 28 they are variety.
# `<key>+` appends to the inherited pool — the same mechanism `urban.yaml` uses
# to add the AEC props to the Nucleus ones.
#
# WHAT THEY ADD THAT THE LIBRARY DID NOT HAVE
# --------------------------------------------
# EUROPEAN PERIMETER BLOCKS. Everything in `midrise` today is either an
# American commercial block or a FactoryDistrict shed. These are street-wall
# buildings with continuous shopfronts, mansard roofs, courtyards and rooftop
# plant — four of them are courtyard or L-plan blocks, which the library had
# none of. At 16-39 m they sit exactly on `midrise`'s 27 m median.
#
# They are HEAVY: 93k-432k triangles each, against 3-18k for the DownTown and
# FactoryDistrict assets. Fifteen of them in one scene is a different point
# budget, and the fracture is superlinear in points, so expect them to be the
# expensive cells in an archetype bake.

extends: urban

usds:
  buildings:
    # Appended to the pools `districts` draws from, not to `intact`: `intact`
    # is what `build_city` packs with BEFORE the rezone, and the typology pools
    # are where a building says what KIND of building it is.
    tower+:
      # 42.3 x 48.8 x 231.4 m, 502k tris. Dark glazing in a stone/metal grid
      # over a solid podium, rooftop planting. `glass` for the same reason
      # BG_Building_C and _F are: the glazing reads as the envelope, and
      # `mesh_damage.STRUCTURE_OF` turns it into the steel frame a break
      # actually exposes.
      #
      # IT WILL NOT BE PLACED BY A STOCK URBAN SCENE, and that is a property of
      # the packer rather than of the asset. `districts._pack_free` keeps only
      # the candidates whose FOOTPRINT AREA is within `area_band` (0.55) of the
      # largest one that fits the gap, and a tower block is 70-110 x 135-190 m,
      # so MBuilding02 (91 x 96 m = 8,752 m2) fits and sets the floor at
      # 4,814 m2. Amar Tower is a SLENDER supertall — 2,064 m2 — so it is cut
      # before the height draw ever sees it, along with six of the other seven
      # towers. Measured: 0 placements in 4 seeds, and still 0 with the height
      # ceiling raised to 260 m, because height was never the binding filter.
      #
      # What does work is denying the wide assets the gap. Measured 9
      # placements in 3 seeds with:
      #
      #   overrides:
      #     layout:
      #       districts:
      #         typologies:
      #           tower:
      #             block_short_m: [45, 60]     # too narrow for MBuilding02
      #             block_long_m:  [70, 100]
      #             height_median_m: 170        # so the draw reaches 231 m
      #             height_max_m:    260
      #
      # That belongs in a preset, not here: an asset pack cannot carry layout
      # settings, and narrowing every tower block is a decision about the CITY.
      - {usd: "airstack://scene_gen/assets/downtowncity/Amar_Tower.usdc", material: glass}

    # The perimeter blocks. All `concrete`: rendered stone facades with punched
    # windows over a glazed shopfront base — a clad frame, which is the call
    # already made on BG_Building_A and _D. Sizes are measured, not guessed.
    midrise+:
      - {usd: "airstack://scene_gen/assets/downtowncity/Carved_13.usdc", material: concrete}   # 83.9 x 44.2 x 30.6 m, 432k — the largest, mansard corner pavilion
      - {usd: "airstack://scene_gen/assets/downtowncity/Carved_18.usdc", material: concrete}   # 44.4 x 44.4 x 29.2 m, 263k — courtyard block
      - {usd: "airstack://scene_gen/assets/downtowncity/Carved_01.usdc", material: concrete}   # 42.8 x 44.0 x 28.4 m, 182k — mansard roof over a corner
      - {usd: "airstack://scene_gen/assets/downtowncity/Carved_03.usdc", material: concrete}   # 42.6 x 44.4 x 27.6 m, 150k — mansard, forecourt at the base
      - {usd: "airstack://scene_gen/assets/downtowncity/Carved_14.usdc", material: concrete}   # 84.0 x 39.5 x 25.4 m, 263k — long block, mansard wing
      - {usd: "airstack://scene_gen/assets/downtowncity/Carved_02.usdc", material: concrete}   # 43.2 x 44.3 x 22.0 m, 283k — courtyard block
      - {usd: "airstack://scene_gen/assets/downtowncity/Carved_21.usdc", material: concrete}   # 37.4 x 43.5 x 21.0 m, 207k — U-plan around a court
      - {usd: "airstack://scene_gen/assets/downtowncity/Carved_15.usdc", material: concrete}   # 83.9 x 44.4 x 19.0 m, 278k — L-plan with a long low wing
      - {usd: "airstack://scene_gen/assets/downtowncity/Carved_06.usdc", material: concrete}   # 39.9 x 44.4 x 19.0 m, 209k — stepped plan
      - {usd: "airstack://scene_gen/assets/downtowncity/Carved_05.usdc", material: concrete}   # 44.4 x 44.3 x 18.6 m, 145k
      - {usd: "airstack://scene_gen/assets/downtowncity/Carved_17.usdc", material: concrete}   # 44.0 x 24.1 x 17.0 m,  93k — narrow street-wall infill
      - {usd: "airstack://scene_gen/assets/downtowncity/Carved_04.usdc", material: concrete}   # 34.1 x 39.1 x 16.0 m, 130k — the smallest
      # The two that were named objects in the source rather than carved out.
      - {usd: "airstack://scene_gen/assets/downtowncity/Building_12.usdc", material: concrete} # 44.3 x 18.7 x 38.9 m,  87k — narrow, pilaster order
      - {usd: "airstack://scene_gen/assets/downtowncity/Building_11.usdc", material: concrete} # 30.9 x 35.4 x 32.6 m, 222k — mansard, dormers, AC units

# No `scale` and no `axis-up` on any of them, and that is a property of the
# conversion rather than luck: `tools/extract_objects_to_usd.py` writes Z-up,
# metre-authored USDs re-centred on the origin with their base at z = 0, and
# the generator measures `base = 0.00` on all fifteen. Every Nucleus entry in
# the inherited pools needs `scale: 0.01` because those packs are
# centimetre-authored; these do not.
