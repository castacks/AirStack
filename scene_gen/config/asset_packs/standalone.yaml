      - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/midrise/mini_auto_service/mini_auto_service.usdc", material: concrete, tags: [intact]}   # 15.0 x 26.3 x  8.5 m — single-storey auto-service showroom, sign on +X
      - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/midrise/federal_bureau/federal_bureau.usdc", material: stone, tags: [intact]}            # 28.0 x 58.2 x 21.1 m — 7-storey stone U-plan office (x0.1), flat facade on +X

