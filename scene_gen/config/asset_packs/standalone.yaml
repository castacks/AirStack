# ASSET SET: standalone — the unified urban set, built from repo-local assets.
#
# `extends: shared` and NOTHING ELSE. `urban` reached its buildings through a
# three-deep chain (urban <- urban_nucleus <- shared) and drew every building
# and every piece of rubble off Nucleus; this set flattens that chain into one
# file whose buildings, ruins, debris and extra cars are all files under
# `scene_gen/assets/standalone/` (plus the three DowntownCity buildings that
# were named objects in their source, under `assets/downtowncity/`). Nothing
# here needs the Nucleus server except what `shared.yaml` itself pulls in.
#
# WHERE THE ASSETS CAME FROM — `~/coasei/new_assets`, converted 2026-08-26 with
# `tools/extract_objects_to_usd.py` (one folder per asset so sources that reuse
# texture file names cannot clobber each other). Every USD is metres, Z-up,
# footprint centred on the origin, base at z = 0, so no entry below needs a
# `scale` or an `axis-up`. Orientation is BAKED too: cars face +X (the
# `car_front: 0` convention), the street-wall blocks have their shopfront on
# +X, and the terrace houses have their door on -X — which is what
# `districts._lay_terrace` turns toward the street at `facing_offset_deg: 0`.
#
# POOL LAYOUT. `buildings.intact` and `buildings.destroyed` are each split into
# the three typology sub-pools, which is the structure the generator reads:
# `build_city` packs from `intact` flattened, `districts` rezones from
# `intact.<typology>`, and the disaster fate pass swaps a ruin in from
# `destroyed` flattened, footprint-checked, whichever sub-pool it sits in.
#
# `material:` is the CONSTRUCTION, judged by eye from renders of every asset
# (see `tools/tag_asset_materials.py` for the vocabulary): on a building it is
# the cladding a break exposes a structure behind, on a piece of rubble it is
# what the piece came off — `disaster/debris.py` only gives a building rubble
# its own construction could have shed.
#
# AUTHORED RUINS ARE FINISHED. `destroyed.*` is post-apocalyptic art that
# already reads as collapsed: the fate pass swaps it in as-is (and drops
# `_mesh_damage`, so no cutter touches it). They are NOT to be baked per
# disaster type; the one thing they still owe is a single simple debris bake
# for the ground around them — a follow-up, not done here.
#
# EXCLUDED, with reasons, at the bottom of each section.
#
# SUPERSEDED as the everything-pack by `urban_v2.yaml`, which unifies this
# file with `urban.yaml`'s Nucleus/AEC content; this stays as the repo-local
# subset (no Nucleus buildings at all).

extends: shared

# Category footprints when a measurement fails — copied from `urban.yaml`.
