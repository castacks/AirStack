      - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/rowhouse/graffiti_brick_house/graffiti_brick_house.usdc", material: brick, tags: [intact]}     #  8.4 x  7.2 x 12.3 m — 3-storey brick end-of-terrace, graffiti and boarded shopfront, door on -X (cm source, yawed 180)

