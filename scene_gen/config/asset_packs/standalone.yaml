    # section in `urban_v2.yaml` for why, and `scene_generator.building_entries`
    # for the reader (which still understands the old condition-keyed layout).

    tower:
      # --- intact
      # Cream precast panels in a grid, blue ribbon glazing, on a podium with
      # a multi-storey car park. From the ASCII FBX (Blender cannot read
      # those; converted via FBX2glTF first). Untextured, material colours only.
      - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/tower/office_tower/office_tower.usdc", material: concrete, tags: [intact]}   # 74.9 x 36.8 x 93.3 m, 65k tris
      # The one DowntownCity tower that was a named object in its source.
      # Glazing reads as the envelope — see `downtown_city.yaml` for the
      # packer note about why a slender supertall places rarely.
      - {usd: "airstack://scene_gen/assets/downtowncity/Amar_Tower.usdc", material: glass, tags: [intact]}   # 42.3 x 48.8 x 231.4 m, 502k
      # --- added 2026-08-26 (new_assets drop 2)
      - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/tower/stepped_tower/stepped_tower.usdc", material: concrete, tags: [intact]}   # 65 x 78 x 81 m — stepped low-poly office cluster (inches, x0.0254), 24 storeys
      # --- added 2026-08-26 (new_assets drop 2): the BlackthornProd low-poly
      # city set, split on its object names. EXTREMELY cheap — 60-632 tris
      # each against 3-500k for the rest of the pool — so these are the
      # assets to lean on when a map needs many towers. Materials judged
      # from the gallery heroes.
      - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/tower/city_tower_01/city_tower_01.usdc", material: concrete, tags: [intact]}   # 39.9 x 41.2 x 125.0 m
      - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/tower/city_tower_02/city_tower_02.usdc", material: concrete, tags: [intact]}   # 60.7 x 60.1 x 234.5 m
      - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/tower/city_tower_03/city_tower_03.usdc", material: concrete, tags: [intact]}   # 60.7 x 63.6 x 234.5 m
      - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/tower/city_tower_04/city_tower_04.usdc", material: concrete, tags: [intact]}   # 60.7 x 75.4 x 270.6 m
      - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/tower/city_tower_05/city_tower_05.usdc", material: brick, tags: [intact]}      # 148.9 x 60.1 x 140.1 m — salmon brick slab, not concrete (gallery hero)
      - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/tower/city_tower_06/city_tower_06.usdc", material: concrete, tags: [intact]}   # 148.9 x 60.1 x 185.1 m
      - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/tower/city_tower_07/city_tower_07.usdc", material: concrete, tags: [intact]}   # 81.3 x 165.1 x 234.5 m
      # --- added 2026-08-26 (new_assets drop 3)
      # EXCLUDED 2026-08-26 after trying to fix it. NOT a conversion fault: every
      # material in the converted USD matches the source byte for byte, and the
      # per-face bindings survive as GeomSubsets. The SOURCE is the problem — it
      # ships three texture files, all `Plaster_*`, and 53% of its surface is a
      # flat `_White` material (authored at metallic 1.0, roughness 1.0) with
      # another 18% on a material NAMED `Ceramic_Black_Tiles_001` but authored
      # pure white. Repairing both (white -> 0.86 non-metallic, tiles -> near
      # black) is done in the asset on disk and still leaves a white clay model:
      # the balcony slabs dominate the silhouette and the dark glazing reads as
      # thin lines. Against a pack of photo-textured buildings it is a white
      # blob. Re-enable if a white modernist block is wanted.
      # - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/tower/glass_curved_tower/glass_curved_tower.usdc", material: concrete, tags: [intact]}  # 55.6 x 54.8 x 44.1 m — curved CONCRETE balcony slabs with glazing between (the name says glass, the structure is not); source was 2.8M tris, decimated to 200k
      - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/tower/slab_tower/slab_tower.usdc", material: concrete, tags: [intact]}                  # 48.7 x 64.6 x 83.3 m — 20-storey white slab over a canopied podium, 310 TRIS; the cheapest tall building in the pack
      # --- added 2026-08-26 (new_assets drop 4)
      - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/tower/podium_highrise/podium_highrise.usdc", material: concrete, tags: [intact]}  # 26.7 x 44.0 x 82.5 m, 122k — slender white tower on a wide dark podium, glazed balcony stack and a signed entrance on +X
      # --- destroyed
      # Six ruined high-rises from `post_apocalyptic_buildings.usdz`
      # (scale x28 -> 48-70 m, ~3.3 m storeys): sheared tops, exposed
      # floor plates, missing bays. Three read as painted concrete frames,
      # three as dark steel frames with the glazing gone.
      - {usd: "airstack://scene_gen/assets/standalone/buildings/destroyed/tower/ruin_tower_01/ruin_tower_01.usdc", material: steel, tags: [destroyed]}
      - {usd: "airstack://scene_gen/assets/standalone/buildings/destroyed/tower/ruin_tower_02/ruin_tower_02.usdc", material: steel, tags: [destroyed]}
      - {usd: "airstack://scene_gen/assets/standalone/buildings/destroyed/tower/ruin_tower_03/ruin_tower_03.usdc", material: steel, tags: [destroyed]}
      - {usd: "airstack://scene_gen/assets/standalone/buildings/destroyed/tower/ruin_tower_04/ruin_tower_04.usdc", material: steel, tags: [destroyed]}
      - {usd: "airstack://scene_gen/assets/standalone/buildings/destroyed/tower/ruin_tower_05/ruin_tower_05.usdc", material: steel, tags: [destroyed]}
      - {usd: "airstack://scene_gen/assets/standalone/buildings/destroyed/tower/ruin_tower_06/ruin_tower_06.usdc", material: steel, tags: [destroyed]}

    midrise:
      # --- intact
      # Nine street-wall blocks from `buildings.usdz`: 3-7 storeys over a
      # shopfront base, one detailed face (now +X) and plain brick party
