      - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/midrise/block_07/block_07.usdc", material: brick, tags: [intact]}     # brown brick, windows all round
      - {usd: "airstack://scene_gen/assets/standalone/buildings/intact/midrise/block_08/block_08.usdc", material: concrete, tags: [intact]}  # white render, front only
