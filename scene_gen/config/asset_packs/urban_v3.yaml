# ASSET SET: urban_v3 — EVERY usable urban asset, in ONE FLAT FILE.
#
# Same content as `urban_v2.yaml`, with `extends: shared` RESOLVED IN PLACE.
# Nothing here inherits: `asset_root`, `asset_scale`, `sky`, `orientation`,
# every `fallback_sizes` entry and every `usds` pool that used to come from
# `shared.yaml` are written out below, and the two `<key>+` appends that v2
# used (`cars+`, `fire_hydrants+`) are spelled as complete lists with the
# shared entries first — the order the merge produced. Load this file and you
# have the whole set; nothing else is read. `urban_v2.yaml` stays as it is for
# the presets that name it.
#
# WHY FLAT. The v2 chain was short (`urban_v2 <- shared`) but still meant that
# "what does an urban scene build with" could not be answered from one file,
# and that an edit to `shared.yaml` for a suburb silently moved the urban set.
# New urban work goes here.
#
# WHAT CAME FROM `shared.yaml` (marked `# [shared]` at each block): the ground
# and material tiles, play structures, trees, plants, rocks, planters,
# streetlights, bus stops, trash cans, traffic lights, fire hydrants, benches,
# cars and the RenderPeople humans — minus every pool urban_v2 replaced
# outright, which is most of the street furniture. Only the pools v2 never
# named survive from shared as-is: `materials`, `play_structures`, `planters`
# and `humans`, plus `tiles.concrete`.
#
# --- everything below is urban_v2's own documentation, unchanged ------------
#
# The unification of `urban.yaml` (Nucleus buildings and DestroyedBuildings
# ruins, DebrisPack rubble, AEC brownstones, the Objaverse/AEC/Downtown_West
# furniture) with `standalone.yaml` (the repo-local set converted from
# `~/coasei/new_assets` on 2026-08-26) and the three DowntownCity buildings
# that were named objects in their source.
#
# WHAT IS IN, WHAT IS NOT
# - IN: every building `urban.yaml` placed (the nine `intact` Nucleus
#   buildings by typology, the eleven FactoryDistrict sheds, the eight
#   Brownstone rows), all fifteen DestroyedBuildings ruins, all 42 DebrisPack /
#   DestroyedBuildings rubble entries, every `standalone` asset,
#   `Amar_Tower` / `Building_11` / `Building_12` from `assets/downtowncity/`,
#   and all 31 GreatAmericanCity buildings (2026-08-29).
# - NOT: the twelve DowntownCity `Carved_*` blocks (carved out of a merged
#   mesh rather than authored as buildings — user direction), MBuilding03
#   (`urban.yaml` already left it out of every typology pool), and
#   `RetroNeighborhood/SM_House_01` (suburban).
#
# GREATAMERICANCITY (added 2026-08-29, user). All 31 buildings, taken from
# `urban_gac.yaml` — a pack on a DIVERGENT BRANCH whose organisation is not
# this one's: it extends `urban`, spells every pool `<name>+`, and files the
# GAC stock across five keys (`intact`, `lowrise`, `midrise_v2`,
# `brick_midrise`, `tower`, `highrise`), several of which list the same asset
# twice. Only the GAC assets were taken. Its `assets/archetype/bld_*` kit, its
# `Dmytro/…/FactoryDistrict` and `Muyang/…` re-spellings of art this pack
# already has, and its `downtowncity` entries (already here) were NOT.
#
# What DID come across verbatim, per asset: `scale: 0.01` (GAC is
# centimetre-authored), the `yaw-offset`, the measured footprint comment, and
# the TAGS — `place_mid` / `place_end` / `place_corner`, `front:<compass>` and
# `blank:<compass list>`. Those were measured over there
# (`tools/gac_faces.py`: triangle density per elevation against the asset's own
# best side) and are not re-derivable here, so they are carried, not rebuilt.
#
# THE `place_*` TAGS ARE INERT ON THIS BRANCH and that is not a defect. They
# are read by `districts._order_run`, which orders a terrace run so that a
# building modelled on one elevation only ever stands between two neighbours —
# and no such function exists in this checkout (`grep place_mid` finds nothing
# outside the asset packs). `scene_generator.condition_of` scans the tag list
# for a CONDITION and ignores everything else, so they ride along harmlessly
# and are already correct for whenever that layout rule lands here. Until it
# does, a one-sided GAC building can be placed with its blank walls to a
# street.
#
# TAG COVERAGE (2026-08-29): 34 of the 107 building entries carry a `front:` /
# `blank:` / `place_*` tag — the 31 GAC buildings and the three `downtowncity`
# ones. That is EVERY asset `urban_gac.yaml` has a measurement for; the merge
# took all of it and invented none. The other 73 are untagged, and two
# different reasons are worth telling apart:
#
# - UNTAGGED `place_*` ALREADY MEANS SOMETHING. In urban_gac's scheme the
#   absence of a `place_*` tag is the fourth case — "4 modelled elevations,
#   stands anywhere" — which is what the Nucleus, AEC and standalone art
#   actually is. So these 73 are not a hole in the data; they are the default
#   case, and `_order_run` would treat them as end-capable stock.
#
# - A COMPASS `front:` DOES NOT APPLY TO THE REPO-LOCAL ART. `front:E` records
#   which side of an UN-NORMALISED source was its best elevation, and pairs
#   with the `yaw-offset` that turns it to -X. The standalone, downtowncity and
#   AEC assets were normalised at conversion instead — orientation is baked in,
#   shopfronts on +X and terrace doors on -X (see CONVENTIONS below) — so their
#   front is a fixed axis, not a compass direction, and tagging one would state
#   a fact about a rotation that was already applied.
#
# What is genuinely missing is a `place_*` measurement for the 15
# DestroyedBuildings ruins and the 7 standalone ruins, where "how many sides
# are modelled" is a real question and nothing here answers it. That needs the
# equivalent of `tools/gac_faces.py`, which this branch does not have.
#
# MATERIALS ON THE GAC ENTRIES WERE JUDGED BY EYE, from RTX renders of every
# asset (2026-08-29). All 31 were laid out one per station and photographed
# from two azimuths by
# `simulation/isaac-sim/launch_scripts/asset_catalogue_launch_script.py`:
#
#     CAT_PACK=urban_v3 CAT_POOLS=highrise,midrise,lowrise,townhouse \
#     CAT_MATCH="^SM_Building_" SNAP_DIR=.../cat_urban_v3 \
#     ./python.sh .../asset_catalogue_launch_script.py
#
# Shots in `~/docker/isaac-sim/logs/cat_urban_v3/`. Every measured size in that
# run matched the footprint comment on the entry here, so the shots and the
# entries line up asset for asset. The result: 14 brick, 12 concrete, 5 glass.
#
# THIS REPLACED AN EARLIER SET OF GUESSES AND MOVED SEVENTEEN OF THE THIRTY-ONE.
# The first pass read materials out of `urban_gac.yaml`'s prose: brick from
# membership of its `brick_midrise` pool, glass from its note that the
# `highrise` pool is "GLASS CURTAIN-WALL TOWERS". The brick half held up — all
# ten of those are brick on the render. The glass half did not. SM_Building_10,
# _13, _17, _18, _20, _23 and _31 are concrete: pier, fin, spandrel-band and
# precast-panel towers with recessed or punched glazing, not curtain walls.
# Only _14, _15, _16 of that pool are genuinely glass (plus _19 and _24, which
# the prose never called). The other ten had no material at all and now do.
#
# So: a pool is a DRAW LIST, not a material claim. `brick_midrise` was selected
# for terrace geometry — depth and the `place_*` tags — and it visibly mixes
# materials; SM_Building_30 sits in it and is windowed concrete. Do not read
# cladding off a pool name again.
#
# These are eyeball calls on a render, which is what `material:` needs: it
# picks a fracture core (`mesh_damage.STRUCTURE_OF`) and which rubble a
# building may shed (`disaster/debris.py`), both of which want the dominant
# construction, not a spectrophotometer. A banded tower that is half concrete
# spandrel and half glass is called concrete here.
#
# DEBRIS IS PILES / PIECES / SCATTERS (2026-08-29, user), replacing the old
# `pieces` + `piles`. Every one of the 166 candidates was rendered under RTX
# and sorted by eye; the header of `usds.debris` below has the rule and the
# provenance. 122 entries: 81 pieces, 20 piles, 21 scatters.
#
# `scatters` IS NOT WIRED INTO THE GENERATOR YET, and that is the one thing to
# know before using it. `scene_generator.py` reads exactly two keys —
# `debris.piles` and `debris.pieces` (around line 1644) — and
# `disaster/debris.py:pools()` builds its `{category: {material: […]}}` from
# the same pair, mapping them to the `debris_pile` and `debris` placement
# categories. A third key is simply not read, so the 21 scatter assets are
# INERT until someone adds `("debris_scatter", "scatters")` to that loop, an
# `OCCUPANCY` entry for it, and the category to the rubble sets in
# `targets.py`, `findability.py` and `detail/districts.py`. That was left
# undone deliberately: `disaster/debris.py` was being actively rewritten by
# another session on 2026-08-29 (debris placement went Gaussian-about-centre
# there), and editing it underneath that would have collided.
#
# TWO NEW NUCLEUS PACKS WERE MINED FOR THIS, and most of one was left out:
# - `DebrisConcrete/` — all 28 taken. Ten single upright fragments with rebar
#   whiskers (pieces), sixteen rubble heaps of 6-190 m3 (piles), and two low
#   sparse spreads (scatters).
# - `DebrisGroundScatter/` — 16 of 60 taken, the `SM_Rock_Debris_Pile_*`
#   family. The other 44 are NOT building rubble: `SM_Dead_Grass_Pile_*` (10)
#   and `SM_Dead_Leaf_Pile_*` (18) are organic litter — dead grass tufts and
#   fallen leaves — and would put leaf litter wherever a damaged building is
#   meant to shed masonry, and `SM_Wall_Patch_Pile_*` (16) are VERTICAL cards
#   (their y extent measures 0.0), which makes them wall decals rather than
#   anything that lies on the ground. They stay on Nucleus, unlisted here.
#
# EVERY ASSET IN THAT PACK IS A FLAT CARD — zero height, an alpha-masked atlas
# on a plane. That is fine for a scatter and worth knowing before one is used
# as a collision or a fracture source. It also means they are INVISIBLE in a
# normal catalogue render: at the launcher's 20 deg elevation all 60 came back
# as blank frames, and they were only judged after `CAT_ELEV=85` was added to
# `asset_catalogue_launch_script.py` to shoot them from overhead.
#
# ROLLING ADDITIONS. `~/coasei/new_assets/` is a live drop folder: new sources
# are converted into `assets/standalone/` and appended to the pools below,
# newest last, each marked `# --- added <date> (new_assets drop N)`.
# `assets/standalone/.sources_processed.json` records which sources have been
# handled, and `assets/standalone/README.md` has the per-asset procedure.
#
# RECLASSIFICATIONS AND DEACTIVATIONS (user calls, not defects):
#   2026-08-29  `usds.buildings` REORGANISED into highrise / midrise /
#               lowrise / townhouse, and all 31 GreatAmericanCity
#               buildings added from `urban_gac.yaml`. See below.
#   2026-08-29  the whole `selected_citydemo/` selection — 18 towers and
#               2 midrises — DEACTIVATED as too low quality. Commented
#               out in place rather than deleted; see the note in the
#               tower pool.
#   2026-08-26  abandoned_brick_building  destroyed/midrise -> intact/midrise
#               (weathered but standing, so it is intact art)
#   2026-08-26  destroyed_building_12     destroyed -> damaged
#
#   2026-08-26  BG_Building_C and SM_MERGED_BP_MBuilding05 were briefly
#               excluded for "rendering black", then re-enabled: their facades
#               are REFLECTIVE GLASS and only look black without raytracing.
#               A dark curtain wall is not evidence of a broken material —
#               check it in a raytraced frame before judging it.
#   2026-08-26  new_assets/buildings/296.fbx is NOT in this pack. It is a CAD
#               site-plan export (`组件#NNNN` components): 659 objects over a
#               100 x 100 m site, nothing taller than 12 m, and the families
#               resolve to kerb outlines, railings and floor plates rather
#               than to any building or prop. Nothing in it reads at the scale
#               a drone sees. Kept in the drop folder, marked `excluded` in
#               `assets/standalone/.sources_processed.json`.
#
# EVERY ASSET IS ON NUCLEUS (2026-08-27), with no local scheme left. This pack
# used to reach its repo-local art through `airstack://` and its Objaverse
# props through `objaverse://`, both of which resolve against the checkout;
# all of it now lives under `Projects/SEI-COA/`, where the same files were
# uploaded. Nothing here needs the AirStack working copy, and the Objaverse
# PRE-FLIGHT IS NO LONGER REQUIRED for this pack: `prepare_assets.py` finds an
# asset by scanning for `objaverse://<uid>`, so it now reports nothing to do,
# and the props load from Nucleus like everything else.
#
# EVERY PATH IS RELATIVE TO `asset_root` (2026-08-29). The repo-local art
# arrived here written out in full as
# `omniverse://airlab-nucleus.andrew.cmu.edu:443/Projects/SEI-COA/scene_gen/…`,
# which is the same string `asset_root` already puts in front of every relative
# entry — `_join_asset_root` passes a `://` path through untouched and prefixes
# everything else, so the two forms resolved identically and the long one just
# repeated the root 110 times. They are now all relative
# (`scene_gen/assets/…`, `DownTown/Assets/…`), so the server and the project
# are named in exactly one place: `asset_root` above. Point that at a different
# Nucleus and the whole pack follows. Write a path in full only for an asset
# that genuinely lives outside `asset_root`.
#
# `target-size-m` and `fit` are kept on those entries and are now INERT. They
# were only ever read by `prepare_assets.py`, which bakes the normalisation
# into the cached USD at conversion time — the file on Nucleus is already the
# right size. They stay as the record of how each prop was normalised, and so
# that reverting a path to `objaverse://` still pre-flights correctly.
#
# THE COST, so it is not discovered as a mystery: the HOST cannot open an
# `omniverse://` stage — only Kit can — so host-side tools that MEASURE assets
# (`tools/plan_png.py`, anything building a scene outside Isaac) now fall back
# to `fallback_sizes` for these too, and a host-built layout will differ from
# the one Isaac builds. That was already true of every other Nucleus entry
# here; it is simply true of more of them now. `tools/localize_nucleus_assets.py`
# and the `assets/nucleus/` mirror exist for that, and the Cycles gallery
# resolves these paths back to the local copies itself — `tools/local_mirror.py`
# (`to_url` then `local_for`) and `building_gallery.resolve` both try the
# checkout before the mirror, for the relative form as well as the full URL.
#
# CONVENTIONS. Nucleus and AEC art is centimetre-authored (`scale: 0.01`) —
# every such entry says so, as `urban.yaml` did. The standalone and
# DowntownCity USDs are metres, Z-up, base at z = 0 with orientation baked in
# (cars face +X, street-wall blocks' shopfront +X, terrace houses' door -X),
# so they carry no scale and no yaw. `material:` is the construction (see
# `urban.buildings.materials.yaml`, `urban.debris.materials.yaml` and the
# notes in `standalone.yaml` for how each was judged); it feeds both the
# fracture core (`mesh_damage.STRUCTURE_OF`) and which rubble a building may
# shed (`disaster/debris.py`).
#
# Entry forms:  "path.usd"                                (global asset_scale, Z-up)
#           or  {usd: "path.usd", scale: 1.0, axis-up: "Y", yaw-offset: 90}
# Per-asset overrides: scale (unit conversion), axis-up ("Y" for Y-up-authored
# art, fixed via +90° roll), yaw-offset (deg — for art whose front isn't +X;
# added to every computed yaw, e.g. a streetlight arm that points +Y needs -90).
# Relative paths are resolved against asset_root; `objaverse://` and
# `airstack://` resolve to repo-local directories instead (see
# scene_generator.LOCAL_ASSET_ROOTS).
#
# `tags` select *behavior*, not locale — the generator pools on them:
#   park      furniture used only along park trails (never street frontage)
#   sidewalk  benches used only on street frontage
#   tree      planters big enough to hold a street tree
#   stump     trees that are stumps — park scatter only, never potted
#
# POOL LAYOUT — FOUR BANDS (2026-08-29, user): `highrise` / `midrise` /
# `lowrise` / `townhouse`, replacing `tower` / `midrise` / `rowhouse`. The
# cuts, what moved and why, and the fact that these names are NOT the ones
# `config/low_level/default.yaml` still asks for, are all argued at the top of
# `usds.buildings` below — read that before pointing a preset at this pack.
#
# The townhouse pool mixes 21 m-deep brownstones with 4-9 m-deep plaster
# houses. `districts._lay_terrace` sizes its strips by the DEEPEST entry, so
# the default row-house block band (tuned on the brownstones) still applies
# and the shallow houses simply leave a wider alley behind them.

# ---- scene-wide [shared] ---------------------------------------------------
asset_root: "omniverse://airlab-nucleus.andrew.cmu.edu:443/Projects/SEI-COA/"
                            # prefix for relative usds.* paths; URLs / absolute paths pass through
asset_scale: 1              # global unit scale — default fits Dmytro assets (authored in meters);
                            # RetroNeighborhood assets override to 0.01 (authored in cm) per entry

# sky: equirect HDRI (.exr/.hdr) applied to the dome light, OR a stage .usd
# whose root sky/environment prims (outside its defaultPrim) get borrowed.
# RetroNeighborhood's /Environment holds a dynamic-sky rig + dome light and
# no geometry, so borrowing it costs almost nothing at load time.
sky: "RetroNeighborhood/RetroNeighborhood.stage.usd"

# ---- per-family yaw offsets (deg), added to auto-computed rotations [shared] -
# For a single misaligned asset, prefer a per-USD yaw-offset in its usds entry.
orientation:
  house_front:   0.0        # building front facing offset
  car_front:     0.0        # 0 = car art faces +X (its direction of travel)
  traffic_light_front: 0.0  # 0 = art faces +X (auto-yawed toward intersection center)

# Category footprints when a measurement fails — from `urban.yaml`,
# over the `shared.yaml` defaults (both inlined).
fallback_sizes:
  # [shared] categories urban_v2 never overrode
  concrete:      [4.0, 4.0, 0.1]   # thin slab — z feeds the walking-surface height
  sidewalk:      [2.0, 2.0, 0.1]   # thin slab — z feeds the walking-surface height
  trail:         [4.0, 3.0, 0.1]
  rock:          [1.5, 1.5]
  tree:          [3.0, 3.0]
  plant:         [1.0, 1.0]
  streetlight:   [1.0, 1.0]
  bench:         [2.0, 0.6, 0.9]
  car:           [4.5, 2.0, 1.5]
  fire_hydrant:  [0.5, 0.5, 0.9]
  human:         [1.2, 0.35, 1.8]  # A-pose bbox; y = body depth (prone lift)
  bus_stop:      [4.0, 1.5, 2.5]
  planter:       [1.0, 1.0, 0.5]
  play_structure: [4.0, 2.0, 2.5]
  # urban's own — those marked `*` also override a shared value above
  street_tree:   [8.0, 8.0, 9.5]
  traffic_light: [1.65, 8.01, 10.83]  # *
  trash_can:     [0.6, 0.6, 0.95]     # *
  phone_booth:   [1.0, 1.0, 2.3]
  traffic_cone:  [0.4, 0.4, 0.7]
  billboard:     [3.0, 0.3, 4.0]
  newspaper_box: [0.6, 0.5, 1.2]
  manhole:       [0.7, 0.7, 0.05]
  storm_drain:   [0.6, 0.4, 0.05]
  house:         [30.0, 20.0, 24.0]   # *
  planter_fence: [1.5, 1.5, 0.73]
  cafe_set:      [2.43, 2.42, 1.01]
  mailbox:       [0.65, 0.52, 1.34]
  bollard:       [0.25, 0.25, 0.9]
  bike_lane_delineator: [0.11, 0.11, 1.0]
  parking_meter: [0.2, 0.2, 1.3]
  bike_rack:     [1.0, 0.1, 0.8]
  sign:          [0.4, 0.08, 2.4]
  utility_pole:  [0.35, 0.35, 11.0]
  dumpster:      [1.8, 1.2, 1.3]
  debris_pile:   [3.0, 3.0, 1.5]      # *
  debris:        [1.5, 1.5, 0.8]      # *

usds:
  buildings:
    # KEYED BY TYPOLOGY; the CONDITION IS A TAG on each entry
    # (`tags: [intact|damaged|destroyed]`, and an untagged entry is intact),
    # so a pool name carries no condition and one list per typology says each
    # thing once: `districts` rezones a block from the INTACT entries of one
    # typology, the disaster stage's fate swap draws from the damaged and
    # destroyed ones by TAG across every pool, and the Stage A baker takes
    # every intact entry and skips the rest — all through
    # `scene_generator.building_entries`, which still reads the old layout too.
    #
    # FOUR BANDS (2026-08-29, user), replacing `tower` / `midrise` / `rowhouse`:
    #
    #   highrise   >= 44 m          the tall stock, one building to a block
    #   midrise    20 - 44 m        street-wall blocks and free-standing offices
    #   lowrise    < 20 m           sheds, shopfront blocks, single-storey art
    #   townhouse  party-wall runs  terrace stock, by MORPHOLOGY not height
    #
    # THE TWO NUMERIC CUTS SIT IN GAPS IN THE PACK'S OWN MEASUREMENTS, which is
    # the only honest place to put them: the intact heights run
    # … 16.7, 18.6, 18.8, 18.8 | 21.1, 21.3, 23.6 … and … 38.6, 38.9, 43.2 |
    # 44.1, 44.7, 47.6 …, so 20 m and 44 m each separate two clusters rather
    # than splitting one. 44 rather than a round 45 keeps BG_Building_A
    # (44.7 m) in the tall pool it has always been in.
    #
    # WHAT MOVED, AND WHY IT MATTERS: the old `midrise` held the eleven
    # FactoryDistrict sheds (11.1-16.7 m) and seven of the nine street-wall
    # blocks (11.9-18.8 m). Nineteen of its 28 intact entries were under 20 m,
    # so a "mid-rise" district built four-storey stock most of the time and the
    # city came out flat. Those are `lowrise` now and `midrise` means what it
    # says. `townhouse` is the old `rowhouse` unchanged, renamed for the band.
    #
    # A RUIN'S BAND IS ITS SOURCE POOL'S, not a measurement: the authored ruins
    # are unmeasured on the host (Nucleus only). It costs nothing — the fate
    # swap picks ruins by CONDITION TAG across every pool and footprint-checks
    # each swap — so the band only says which scale of ruin it is. `lowrise`
    # and `townhouse` have none; no library has a wrecked shed or terrace.
    #
    # THESE NAMES ARE NOT `config/low_level/default.yaml`'s. Its
    # `districts.typologies` still name `pools: [rowhouse]` / `[midrise]` /
    # `[tower]`, so a config that points `asset_pack: urban_v3` at the DEFAULT
    # typologies finds `rowhouse` and `tower` empty and zones those blocks to
    # nothing. A preset using this pack has to name these four pools.

    # HIGH-RISE — 44 m and up.
    highrise:
      # --- intact
      # --- Nucleus (cm), materials per urban.buildings.materials.yaml
      - {usd: "DownTown/Assets/BG_Building_A.usd", scale: 0.01, material: concrete, tags: [intact]}   # 51.3 x 51.3 x  44.7 m, 3.5k
      # READS BLACK IN A NON-RAYTRACED VIEW, AND THAT IS CORRECT (user,
      # 2026-08-27): the facade is REFLECTIVE GLASS, so with reflections off it
      # has almost nothing to show and comes out a flat black slab, while under
      # raytracing it reads as a dark glass tower. An earlier note here called
      # that a defect and briefly excluded the asset — it is not. Judge this
      # one (and any dark curtain wall) from a raytraced frame only.
      - {usd: "DownTown/Assets/BG_Building_C.usd", scale: 0.01, material: glass, tags: [intact]}      # 50.1 x 40.1 x  66.0 m,  756
      - {usd: "DownTown/Assets/BG_Building_E.usd", scale: 0.01, material: concrete, tags: [intact]}   # 60.5 x 36.5 x 131.0 m, 3.5k
      - {usd: "DownTown/Assets/BG_Building_B.usd", scale: 0.01, material: concrete, tags: [intact]}   # 60.3 x 40.2 x  84.1 m, 1.8k — dark-grey banded slab, checked in RTX
      - {usd: "DownTown/Assets/BG_Building_F.usd", scale: 0.01, material: glass, tags: [intact]}      # 80.9 x 50.4 x  72.3 m, 4.6k
      # Same as BG_Building_C above: `MI_MBuilding05_SkyscraperWindows` is
      # reflective glass, so it looks black wherever reflections are off and
      # correct under raytracing. Not a defect.
      - {usd: "ModernCityEnvironment/Collected_Building05/SM_MERGED_BP_MBuilding05.usd", scale: 0.01, material: glass, tags: [intact]}   # 27.7 x 20.6 x 62.4 m, 311k
