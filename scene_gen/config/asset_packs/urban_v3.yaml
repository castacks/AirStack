      # --- added 2026-08-29 from `assets/concrete_rubble_debris/`, the FAB
      #     "Concrete Elements" pack the user dropped in as ONE 233 MB usdz.
      #     Split with `tools/extract_objects_to_usd.py --group-by-material`
      #     (a flag added for it) into `split/<name>/<name>.usdc`.
      #
      #     THE SPLIT IS BY MATERIAL, NOT BY OBJECT, and that is the whole
      #     trick. The pack's exporter (`obj_cleaner_materialmerger_gles`)
      #     chops every mesh at the 16-bit index limit, so a prop arrives as
      #     `Object_2` (65,532 verts) PLUS `Object_3` (the remainder) — same
      #     material, and one bbox NESTED INSIDE the other rather than beside
      #     it. Splitting on the object names would have produced half-props.
      #     Three of these ten were reassembled that way. Also dropped: the
      #     pack's 14.7 m backdrop plane (`GRID_002`, 2 tris) and two empty
      #     Xforms.
      #
      #     NO `scale:` / `axis-up:` ON ANY OF THEM. The extractor writes
      #     metres, Z-up, footprint centred on the origin, base at z = 0 —
      #     verified per file after export. The source is Y-up centimetres;
      #     that conversion is baked into the USD, not deferred to here.
      #
      #     PATHS ARE NUCLEUS-RELATIVE AND MIRROR THE LOCAL TREE (user,
      #     2026-08-29): `Projects/SEI-COA/scene_gen/…` on the server is the
      #     same layout as `scene_gen/…` in the repo, so one string serves
      #     both. Uploaded and verified the same day — all ten `.usdc` and
      #     their twenty textures are byte-identical to the local copies, so
      #     the `.measurements.json` entries seeded from those copies are
      #     good for the Nucleus URLs too.
      #
      #     ALL `material: concrete` AND ALL UNDER `piles` — user's call.
      #     The `concrete` half of it is right by eye as well as by fiat: the
      #     two `brick_debris_pile*` are named for brick but RENDER as grey
      #     concrete rubble with only a few brick fragments in them
      #     (`galleries/concrete_pack/`), so nothing is being mislabelled.
      #     What the `piles` half papers over is worth knowing:
      #       - `concrete_slabs`, `cracked_paving_slabs`,
      #         `concrete_sidewalk_elements` and the two `lamppost_block*` are
      #         street and paving ELEMENTS, not heaps. The last two are
      #         0.04 m3 — well under the 1 m3 bar that cut the `pieces` tail.
      #
      #     `_hp` IS THE SAME PROP AT HIGHER POLY, not a different one. Both
      #     halves of each pair are listed because the ask was "all"; drawing
      #     from both means the pool can land near-identical geometry twice at
      #     2-3x the triangles. Comment out one of each pair to stop that.
      - {usd: "scene_gen/assets/concrete_rubble_debris/split/huge_concrete_rubble_pile/huge_concrete_rubble_pile.usdc", material: concrete}    # 8.05 x 7.68 x 1.48 m,  71k tris — the one true heap of the set
      - {usd: "scene_gen/assets/concrete_rubble_debris/split/brick_debris_pile/brick_debris_pile.usdc", material: concrete}                    # 6.07 x 4.90 x 1.20 m,  58k tris — brick rubble spread (see above: tagged concrete)
      # - {usd: "scene_gen/assets/concrete_rubble_debris/split/brick_debris_pile_hp/brick_debris_pile_hp.usdc", material: concrete}              # 6.07 x 4.93 x 1.20 m, 189k tris — ditto, high poly
      # - {usd: "scene_gen/assets/concrete_rubble_debris/split/concrete_slabs/concrete_slabs.usdc", material: concrete}                          # 3.64 x 2.46 x 0.67 m,  58k tris — broken slabs, stacked
      - {usd: "scene_gen/assets/concrete_rubble_debris/split/concrete_debris_elements/concrete_debris_elements.usdc", material: concrete}      # 3.53 x 2.58 x 0.38 m,  97k tris — low spread of mixed fragments
      # - {usd: "scene_gen/assets/concrete_rubble_debris/split/concrete_debris_elements_hp/concrete_debris_elements_hp.usdc", material: concrete}  # 3.54 x 2.58 x 0.38 m, 125k tris — ditto, high poly
      # - {usd: "scene_gen/assets/concrete_rubble_debris/split/concrete_sidewalk_elements/concrete_sidewalk_elements.usdc", material: concrete}  # 1.72 x 1.77 x 0.34 m,  29k tris — kerb and sidewalk fragments
      # - {usd: "scene_gen/assets/concrete_rubble_debris/split/cracked_paving_slabs/cracked_paving_slabs.usdc", material: concrete}              # 1.08 x 1.60 x 0.31 m,  28k tris — cracked paving
      # - {usd: "scene_gen/assets/concrete_rubble_debris/split/lamppost_block/lamppost_block.usdc", material: concrete}                          # 0.16 x 0.35 x 0.74 m,  21k tris — lamppost base block
      # - {usd: "scene_gen/assets/concrete_rubble_debris/split/lamppost_block_v2/lamppost_block_v2.usdc", material: concrete}                    # 0.16 x 0.35 x 0.74 m,  21k tris — same block, second texture variant

