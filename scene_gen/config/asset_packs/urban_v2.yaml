      - {usd: "DownTown/Assets/BG_Building_F.usd", scale: 0.01, material: glass, tags: [intact]}      # 80.9 x 50.4 x  72.3 m, 4.6k
      # Same as BG_Building_C above: `MI_MBuilding05_SkyscraperWindows` is
      # reflective glass, so it looks black wherever reflections are off and
      # correct under raytracing. Not a defect.
      - {usd: "ModernCityEnvironment/Collected_Building05/SM_MERGED_BP_MBuilding05.usd", scale: 0.01, material: glass, tags: [intact]}   # 27.7 x 20.6 x 62.4 m, 311k
      - {usd: "ModernCityEnvironment/Collected_Building02/SM_MERGED_BP_MBuilding02.usd", scale: 0.01, material: concrete, tags: [intact]}  # 91.1 x 96.1 x 68.7 m, 471k
      # --- repo-local (metres)
      - {usd: "omniverse://airlab-nucleus.andrew.cmu.edu:443/Projects/SEI-COA/scene_gen/assets/standalone/buildings/intact/tower/office_tower/office_tower.usdc", material: concrete, tags: [intact]}   # 74.9 x 36.8 x 93.3 m, 65k, untextured colours
