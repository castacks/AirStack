# ASSET SET: urban_v2 — EVERY usable urban asset, in one file.
#
# The unification of `urban.yaml` (Nucleus buildings and DestroyedBuildings
# ruins, DebrisPack rubble, AEC brownstones, the Objaverse/AEC/Downtown_West
# furniture) with `standalone.yaml` (the repo-local set converted from
# `~/coasei/new_assets` on 2026-08-26) and the three DowntownCity buildings
# that were named objects in their source. `extends: shared` and nothing else:
# `urban.yaml` reached its buildings through `urban <- urban_nucleus <-
# shared`, and this flattens that chain so one file says what an urban scene
# is built from. `urban.yaml` / `urban_nucleus.yaml` / `standalone.yaml` stay
# as they are for the presets that name them; new urban work goes here.
#
# WHAT IS IN, WHAT IS NOT
# - IN: every building `urban.yaml` placed (the nine `intact` Nucleus
#   buildings by typology, the eleven FactoryDistrict sheds, the eight
#   Brownstone rows), all fifteen DestroyedBuildings ruins, all 42 DebrisPack /
#   DestroyedBuildings rubble entries, every `standalone` asset, and
#   `Amar_Tower` / `Building_11` / `Building_12` from `assets/downtowncity/`.
# - NOT: the twelve DowntownCity `Carved_*` blocks (carved out of a merged
#   mesh rather than authored as buildings — user direction), MBuilding03
#   (`urban.yaml` already left it out of every typology pool), and
#   `RetroNeighborhood/SM_House_01` (suburban).
#
# ROLLING ADDITIONS. `~/coasei/new_assets/` is a live drop folder: new sources
# are converted into `assets/standalone/` and appended to the pools below,
# newest last, each marked `# --- added <date> (new_assets drop N)`.
# `assets/standalone/.sources_processed.json` records which sources have been
# handled, and `assets/standalone/README.md` has the per-asset procedure.
#
# RECLASSIFICATIONS (user calls, not defects):
#   2026-08-26  abandoned_brick_building  destroyed/midrise -> intact/midrise
#               (weathered but standing, so it is intact art)
#   2026-08-26  destroyed_building_12     destroyed -> damaged
#
#   2026-08-26  BG_Building_C and SM_MERGED_BP_MBuilding05 were briefly
#               excluded for "rendering black", then re-enabled: their facades
#               are REFLECTIVE GLASS and only look black without raytracing.
#               A dark curtain wall is not evidence of a broken material —
#               check it in a raytraced frame before judging it.
#   2026-08-26  new_assets/buildings/296.fbx is NOT in this pack. It is a CAD
#               site-plan export (`组件#NNNN` components): 659 objects over a
#               100 x 100 m site, nothing taller than 12 m, and the families
#               resolve to kerb outlines, railings and floor plates rather
#               than to any building or prop. Nothing in it reads at the scale
#               a drone sees. Kept in the drop folder, marked `excluded` in
#               `assets/standalone/.sources_processed.json`.
#
# EVERY ASSET IS ON NUCLEUS (2026-08-27), with no local scheme left. This pack
# used to reach its repo-local art through `airstack://` and its Objaverse
# props through `objaverse://`, both of which resolve against the checkout;
# all 117 are now absolute `omniverse://` URLs under
# `Projects/SEI-COA/scene_gen/assets/`, where the same files were uploaded.
# Nothing here needs the AirStack working copy, and the Objaverse PRE-FLIGHT IS
# NO LONGER REQUIRED for this pack: `prepare_assets.py` finds an asset by
# scanning for `objaverse://<uid>`, so it now reports nothing to do, and the
# props load from Nucleus like everything else.
#
# `target-size-m` and `fit` are kept on those entries and are now INERT. They
# were only ever read by `prepare_assets.py`, which bakes the normalisation
# into the cached USD at conversion time — the file on Nucleus is already the
# right size. They stay as the record of how each prop was normalised, and so
# that reverting a path to `objaverse://` still pre-flights correctly.
#
# THE COST, so it is not discovered as a mystery: the HOST cannot open an
# `omniverse://` stage — only Kit can — so host-side tools that MEASURE assets
# (`tools/plan_png.py`, anything building a scene outside Isaac) now fall back
# to `fallback_sizes` for these too, and a host-built layout will differ from
# the one Isaac builds. That was already true of every other Nucleus entry
# here; it is simply true of more of them now. `tools/localize_nucleus_assets.py`
# and the `assets/nucleus/` mirror exist for that, and the Cycles gallery
# resolves these URLs back to the local copies itself.
#
# CONVENTIONS. Nucleus and AEC art is centimetre-authored (`scale: 0.01`) —
# every such entry says so, as `urban.yaml` did. The standalone and
# DowntownCity USDs are metres, Z-up, base at z = 0 with orientation baked in
# (cars face +X, street-wall blocks' shopfront +X, terrace houses' door -X),
# so they carry no scale and no yaw. `material:` is the construction (see
# `urban.buildings.materials.yaml`, `urban.debris.materials.yaml` and the
# notes in `standalone.yaml` for how each was judged); it feeds both the
# fracture core (`mesh_damage.STRUCTURE_OF`) and which rubble a building may
# shed (`disaster/debris.py`).
#
# POOL LAYOUT. `intact` and `destroyed` are split into the typology sub-pools;
# every flat reader sees the union and `districts` rezones from
# `intact.<typology>`. The DestroyedBuildings ruins are unmeasured on the
# host (Nucleus only), so their sub-pool is a best guess by name — the fate
# pass footprint-checks every swap anyway, so a wrong guess costs nothing.
# `damaged` stays a flat list: it has no typology reader.
#
# The terrace pool mixes 21 m-deep brownstones with 4-9 m-deep plaster
# houses. `districts._lay_terrace` sizes its strips by the DEEPEST entry, so
# the default row-house block band (tuned on the brownstones) still applies
# and the shallow houses simply leave a wider alley behind them.

extends: shared

# Category footprints when a measurement fails — from `urban.yaml`.
fallback_sizes:
  street_tree:   [8.0, 8.0, 9.5]
  traffic_light: [1.65, 8.01, 10.83]
  trash_can:     [0.6, 0.6, 0.95]
  phone_booth:   [1.0, 1.0, 2.3]
  traffic_cone:  [0.4, 0.4, 0.7]
  billboard:     [3.0, 0.3, 4.0]
  newspaper_box: [0.6, 0.5, 1.2]
  manhole:       [0.7, 0.7, 0.05]
  storm_drain:   [0.6, 0.4, 0.05]
  house:         [30.0, 20.0, 24.0]
  planter_fence: [1.5, 1.5, 0.73]
  cafe_set:      [2.43, 2.42, 1.01]
  mailbox:       [0.65, 0.52, 1.34]
  bollard:       [0.25, 0.25, 0.9]
  bike_lane_delineator: [0.11, 0.11, 1.0]
  parking_meter: [0.2, 0.2, 1.3]
  bike_rack:     [1.0, 0.1, 0.8]
  sign:          [0.4, 0.08, 2.4]
  utility_pole:  [0.35, 0.35, 11.0]
  dumpster:      [1.8, 1.2, 1.3]
  debris_pile:   [3.0, 3.0, 1.5]
  debris:        [1.5, 1.5, 0.8]

usds:
  buildings:
    # KEYED BY TYPOLOGY; the CONDITION IS A TAG on each entry
    # (`tags: [intact|damaged|destroyed]`, and an untagged entry is intact).
    # This used to be the other way round — `intact:`/`damaged:`/`destroyed:`
    # each carrying its own tower/midrise/rowhouse tree — which duplicated the
    # typology three times and left the flat `damaged` pool with no typology at
    # all. One list per typology says each thing once: `districts` rezones a
    # block from the INTACT entries of one typology, the disaster stage's fate
    # swap draws from the damaged/destroyed ones, and the Stage A baker takes
    # every intact entry and skips the rest — all through
    # `scene_generator.building_entries`, which still reads the old layout too.
    #
    # A ruin's typology is from its MEASURED height (>= 45 m is a tower), not
    # from a guess: the old flat `damaged` pool could not state one.

    # TOWERS — 45 m and up. Intact art first, then the authored ruins.
    tower:
      # --- intact
      # --- Nucleus (cm), materials per urban.buildings.materials.yaml
      - {usd: "DownTown/Assets/BG_Building_A.usd", scale: 0.01, material: concrete, tags: [intact]}   # 51.3 x 51.3 x  44.7 m, 3.5k
      # READS BLACK IN A NON-RAYTRACED VIEW, AND THAT IS CORRECT (user,
      # 2026-08-27): the facade is REFLECTIVE GLASS, so with reflections off it
      # has almost nothing to show and comes out a flat black slab, while under
      # raytracing it reads as a dark glass tower. An earlier note here called
      # that a defect and briefly excluded the asset — it is not. Judge this
      # one (and any dark curtain wall) from a raytraced frame only.
      - {usd: "DownTown/Assets/BG_Building_C.usd", scale: 0.01, material: glass, tags: [intact]}      # 50.1 x 40.1 x  66.0 m,  756
      - {usd: "DownTown/Assets/BG_Building_E.usd", scale: 0.01, material: concrete, tags: [intact]}   # 60.5 x 36.5 x 131.0 m, 3.5k
