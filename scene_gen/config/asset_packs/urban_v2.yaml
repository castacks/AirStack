      # - {usd: "omniverse://airlab-nucleus.andrew.cmu.edu:443/Projects/SEI-COA/scene_gen/assets/standalone/buildings/intact/tower/city_tower_07/city_tower_07.usdc", material: concrete, tags: [intact]}   # 81.3 x 165.1 x 234.5 m
