# Manifest for analysis/reuse/loc_reuse.py -- ICRA 2027 AirStack paper, Sec. V / Table I.
#
# Every project lists the repositories it was developed in, with the BASE ref
# (pre-existing code the team started from) and the HEAD ref (the team's final
# code) pinned to full SHAs.  `run_reuse_study.sh` clones/fetches these and
# runs the analysis.  Vendored patterns carry a rationale; change them and
# re-run if you disagree with a classification -- nothing is hard-coded.
#
# Fork points were found with:  git merge-base <team-branch> castacks/AirStack@{main,develop}

# Third-party code bundled INSIDE the AirStack base tree.  Removed from every
# denominator so "base LOC" means code the AirStack team wrote/maintains.
base_excludes:
  - "*/glad/*"                       # OpenGL loader generated by glad.dav1d.de
  - "*/stb_image.h"                  # Sean Barrett's single-header libs
  - "*/stb_image_write.h"
  - "*/xdot/xdot*.py"                # jrfonseca/xdot.py, bundled in rqt_behavior_tree
  - "gcs/foxglove_extensions/*/dist/*"   # webpack bundles generated from src/
  - "*/CMakeModules/Find*.cmake"     # copied from the OpenVDB project
  - "*/CMakeModules/OpenVDBUtils.cmake"
  - "robot/ros_ws/src/perception/natnet_ros2/*"  # L2S-lab/natnet_ros2 driver vendored 2026-06 (see swarmcbf)
  - "*/mosquitto.conf"               # stock Eclipse Mosquitto config

table_order: [RAVEN, DFM2, Hummingbird, Shimizu, SwarmCBF]

projects:
  raven:
    name: RAVEN
    notes: |
      RAVEN (castacks/RAVEN) is a composite: a thin top-level repo of launch
      scripts plus three submodules -- AirStack pinned to its `raven` branch,
      RayFronts (seungchan-kim/RayFronts, `raven` branch, extending the
      pre-existing RayFronts mapping library), and LVLM (a small VLM service).
      The AirStack component's base is the fork point on castacks/AirStack; the
      RayFronts component's base is the RayFronts trunk the raven branch forked
      from, i.e. the pre-existing library counts as reused, not authored.
      Scene annotation JSON (5.2k lines) is data, not source, and is excluded by
      category. The behavior tree / planner and the ROS mapping server live in
      RayFronts; AirStack-side changes are scene launch scripts and rviz config.
    components:
      - repo: castacks/AirStack
        repo_dir: AirStack
        role: airstack
        base: 2d4f4be313fdb2221b23cf728fd906ae30c6d62a   # merge-base(raven, develop): "Add airstack build command for docker compose build" 2026-02-20
        head: 278acbffaf748cd6e0102b3a25cfea544e031c83   # origin/raven tip, pinned by castacks/RAVEN@91ef2e7
      - repo: seungchan-kim/RayFronts
        repo_dir: RayFronts
        role: extended-library
        base: cded3eee90ad82fbff44c58e7dff31523c7fe529   # merge-base(raven, main) -- pre-existing RayFronts trunk
        head: 8d838d79e444a035b71865034e4c33020b981fc8   # raven branch, pinned by castacks/RAVEN
      - repo: seungchan-kim/LVLM
        repo_dir: LVLM
        role: new-repo
        base: null                                       # entire repo authored for RAVEN
        head: 7e5c652f4c56a4a7f2fe77940d79bf20898dae69
      - repo: castacks/RAVEN
        repo_dir: RAVEN
        role: new-repo
        base: null
        head: 91ef2e7aacb9d2cbb6bbaf72bdcac7754638a778
        paths: [launch_raven.sh, RAVEN_setup.sh, stop_raven.sh, README.md, LICENSE, .gitmodules]  # figs/ are images

  dfm2:
    name: DFM2
    notes: |
      Don't Fool Me Twice was developed in a private fork of AirStack
      (castacks/airstack-dfm2); the public castacks/DontFoolMeTwice repo holds
      only the resilience package + vendored RayFronts and has no AirStack
      history, so the fork is the measurable artifact. Reproduces
      analysis/dfm2_reuse_analysis.md (2026-08-04) under the common rules.
    components:
      - repo: castacks/airstack-dfm2
        repo_dir: airstack-dfm2
        role: airstack
        base: 19bf91d82380bc5a5cdd44bce06b265a23dd7524   # merge-base with castacks/AirStack main & develop, 2026-02-11
        head: 3af8f8e0797207ac9d0c8232012ec1362101d04a   # main tip, 2026-02-19
        vendored:
          - pattern: "*/resilience/RayFronts/*"
            why: "pre-existing AirLab RayFronts library copied in as a subtree (130 files)"

  hummingbird:
    name: Hummingbird
    notes: |
      The Hummingbird fork (JohnYanxinLiu/Hummingbird-AirStack) is a private
      mirror the paper authors cannot access. The team ran the same
      git-diff-vs-fork-point method and returned CODE_REUSE_ANALYSIS_HUMMINGBIRD.md
      (copied to analysis/reuse/hummingbird/); numbers below are transcribed from
      it. The fork point is public, so its base LOC is recomputed here under the
      common rules for comparison.
    base_only:
      repo: castacks/AirStack
      repo_dir: AirStack
      ref: 1c41f8c029a6b579fa3910e8c69c0dcc02e78c22   # fork point = upstream/develop tip 2026-08-17 (#376)
    reported:
      source_file: analysis/reuse/hummingbird/CODE_REUSE_ANALYSIS_HUMMINGBIRD.md
      measured_on: "2026-09-01, branch rough/workshop_demo @ 106dc726"
      authored_source_loc: 20979        # "133 files changed, 20,979 insertions(+), 46 deletions(-)" (their source definition incl. .md)
      authored_runtime_loc: 12200       # "actual new runtime engineering is ~12.2k lines" (excl. tests, docs)
      authored_docs_loc: 3330
      authored_tests_loc: 5517
      vendored_source_loc: 0
      airstack_base_source_loc: 159967  # "Hand-written source lines" of base @ 1c41f8c0 under THEIR exclusion list
      base_modified_files: 28
      base_modified_lines: 572
      base_deleted_files: 1
      base_share_of_final: 0.884        # "88.4% inherited from AirStack unchanged"
      authored_share_of_final: 0.116
      additive_share: 0.973             # "97.3% of the diff went into new modules"

  shimizu:
    name: Shimizu
    notes: |
      Construction-site exploration/inspection demo on the castacks/AirStack
      branch `junbin/planning_demo` (55 commits, three authors). New packages:
      integrated_planner, inspection_planning, path_tracker,
      modalai_livox_tf_bridge; extends the pre-existing exploration package. Also
      adds a submodule pointer (YuanJunbin/vdb_edt_ros2 @ frontier_map) whose
      contents are not in this repo and are therefore not counted. Six .rviz
      files (3.6k lines) are GUI state, categorised as data.
    components:
      - repo: castacks/AirStack
        repo_dir: AirStack
        role: airstack
        base: 39e5e698cf3404abe70c208b99e7667db5a28ab6   # merge-base(junbin/planning_demo, develop): "Jkeller/airlab docker registry (#294)" 2025-11-07
        head: a50c19e9edd092f2606432be3e046a090a10da10   # origin/junbin/planning_demo tip "livox config" 2026-06-08
        vendored:
          - pattern: "*/CMakeModules/Find*.cmake"
            why: "FindOpenVDB/FindBlosc copied from the OpenVDB project"
          - pattern: "*/CMakeModules/OpenVDBUtils.cmake"
            why: "copied from the OpenVDB project"

  swarmcbf:
    name: SwarmCBF
    notes: |
      Swarm CBF ground controller on the castacks/AirStack branch
      `yikuan/SVG_ground_control` (21 commits). New package svg_ground_control
      (CBF filter, geofence, swarm commander, mocap bridge, tests). The branch
      also vendors the L2S-lab natnet_ros2 mocap driver (commit c1f69fe4 "Vendor
      natnet_ros2 (L2S-lab fork)") and copies a reference path tracker from the
      Shimizu branch; both are third-party for this project and excluded from
      *authored*. A 1.1k-line experiment log (.md) is docs, not source.
    components:
      - repo: castacks/AirStack
        repo_dir: AirStack
        role: airstack
        base: e4b499d120ef5157232c6ef6b1109488a94c9641   # merge-base(yikuan/SVG_ground_control, develop): "Release 0.18.0" 2026-05-20
        head: 564d43e4542c1e2dd4cd24cebeb21b3fb3843ad2   # origin/yikuan/SVG_ground_control tip 2026-08-11
        vendored:
          - pattern: "robot/ros_ws/src/perception/natnet_ros2/*"
            why: "L2S-lab/natnet_ros2 driver vendored verbatim (GPLv3, author Aarsh Thakker); incl. a 5.6k-line Qt .ui"
          - pattern: "robot/ros_ws/src/svg_ground_control/reference/*"
            why: "reference copies of other teams' code (pid_path_tracker_px4.cpp is byte-identical to the Shimizu branch)"
