# Branch-scoped OSMO workflow for the live RRM replan stack.
#
# This intentionally avoids both floating `latest` tags:
#   - The workspace image contains the baked entrypoint that reconciles the
#     robot's clock epoch after Isaac starts.
#   - `ore_proj` contains the Isaac Sim NumPy pin that keeps the ZED, RTX
#     LiDAR, and VDB map publishers working.
#
# Before submitting, publish the workspace image from this checkout:
#   cd osmo/workspace
#   docker buildx build --platform linux/amd64 \
#     -t airlab-docker.andrew.cmu.edu/airstack/airstack-osmo-workspace:ore-proj-epoch-numpy126-1 \
#     --push .
#
# Also commit and push the Dockerfile change on `ore_proj`; the workspace
# clones that remote branch before building the inner Isaac Sim image.
#
# Submit:
#   osmo workflow submit osmo/workflows/airstack-live-replan-ore-proj.yaml \
#     --pool airstack \
#     --set-env "SSH_PUB_KEY=$(cat ~/.ssh/id_ed25519.pub)"

workflow:
  name: airstack-live-replan-ore-proj
  groups:
  - name: airstack-live-replan
    ignoreNonleadStatus: false
    tasks:
    - name: workspace
      lead: true
      resource: workspace-gpu
      image: airlab-docker.andrew.cmu.edu/airstack/airstack-osmo-workspace:ore-proj-epoch-numpy126-1
      privileged: true
      command: ["bash"]
      args: ["/usr/local/bin/entrypoint.sh"]
      environment:
        AUTOLAUNCH: "true"
        ISAAC_SIM_LIVESTREAM: "true"
        NUM_ROBOTS: "1"
        AIRSTACK_BRANCH: "ore_proj"
        AIRSTACK_REPO_URL: "https://github.com/castacks/AirStack.git"
        RRM_COSMOS_WORKER_URL: "http://{{host:cosmos-worker}}:8090"
      credentials:
        airlab-nucleus:
          OMNI_USER: omni_user
          OMNI_PASS: omni_pass
          OMNI_SERVER: omni_server
        airlab-docker-login:
          AIRLAB_REGISTRY_USER: username
          AIRLAB_REGISTRY_PASS: password

    - name: cosmos-worker
      resource: cosmos-worker-gpu
      image: airlab-docker.andrew.cmu.edu/airstack/airstack-rrm-cosmos-worker:latest
      command: ["bash", "-lc"]
      args:
      - |
        set -euo pipefail
        : "${HF_TOKEN:?Missing rrm-huggingface-read credential}"
        readonly MODEL_ID="nvidia/Cosmos-Reason2-8B"
        readonly MODEL_REVISION="a9fae2cf89dc64db96b12860417f0eb403013bb9"
        readonly MODEL_DIR="$COSMOS_MODEL_PATH"
        if [[ ! -f "$MODEL_DIR/config.json" ]]; then
          mkdir -p "$MODEL_DIR"
          hf download "$MODEL_ID" --revision "$MODEL_REVISION" \
            --local-dir "$MODEL_DIR" --token "$HF_TOKEN"
        fi
        unset HF_TOKEN
        exec python3 /opt/rrm/scripts/rrm_cosmos_worker.py \
          --host 0.0.0.0 --port 8090 --model-path "$MODEL_DIR"
      environment:
        COSMOS_MODEL_PATH: "/var/lib/rrm/models/Cosmos-Reason2-8B"
        HF_HOME: "/var/lib/rrm/hf-cache"
      credentials:
        rrm-huggingface-read:
          HF_TOKEN: hf_token

  resources:
    workspace-gpu:
      cpu: 12
      gpu: 1
      memory: 48Gi
      storage: 500Gi
    cosmos-worker-gpu:
      cpu: 12
      gpu: 1
      memory: 48Gi
      storage: 200Gi

  timeout:
    exec_timeout: 8h
