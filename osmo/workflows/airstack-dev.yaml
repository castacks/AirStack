# AirStack remote developer workflow on OSMO.
#
# Submits a single GPU task ("workspace") that runs Docker-in-Docker
# (DinD) and brings up the regular AirStack three-container stack (Isaac Sim
# with WebRTC livestream, robot-desktop, GCS) on the inner Docker daemon. The
# task also runs sshd so a student can attach VS Code or Cursor over Remote-SSH
# from their laptop (Mac, Windows, or Linux — no local Docker / NVIDIA driver
# required).
#
# To submit (replace <gpu-pool> and substitute your actual pubkey):
#
#   osmo workflow submit osmo/workflows/airstack-dev.yaml \
#     --pool <gpu-pool> \
#     --set-env "SSH_PUB_KEY=$(cat ~/.ssh/id_ed25519.pub)"
#
# To stream the IDE, Isaac Sim, and Foxglove back to the laptop:
#
#   # SSH so VS Code / Cursor Remote-SSH can attach (1 terminal):
#   osmo workflow port-forward <wf-id> workspace --port 2200:22 --connect-timeout 86400
#
#   # Isaac Sim WebRTC (2 terminals — TCP + UDP):
#   osmo workflow port-forward <wf-id> workspace \
#     --port 47995-48012,49000-49007,49100 --connect-timeout 86400
#   osmo workflow port-forward <wf-id> workspace \
#     --port 49099 --udp --connect-timeout 86400
#
#   # GCS Foxglove websocket (1 terminal):
#   osmo workflow port-forward <wf-id> workspace --port 8766:8766 --connect-timeout 86400
#
# See docs/tutorials/airstack_on_osmo.md for the full walkthrough and
# osmo/README.md for the lab-admin setup (pool prerequisites, OSMO credential
# registration, workspace image build).

workflow:
  name: airstack-dev
  groups:                              # `groups:` keeps room to add a separate
                                       # dind sidecar or split out isaac-sim /
                                       # robot-desktop / gcs as their own
                                       # tasks later. For now, one lead task.
  - name: airstack
    tasks:
    - name: workspace
      lead: true
      image: airlab-docker.andrew.cmu.edu/airstack/airstack-osmo-workspace:latest
      # Required so the inner dockerd can run. hostNetwork is intentionally
      # NOT set — osmo workflow port-forward reaches the pod NS, where the
      # inner dockerd publishes ports via standard NAT.
      privileged: true
      command: ["bash"]
      args: ["/usr/local/bin/entrypoint.sh"]
      environment:
        # Behaviour switches consumed by entrypoint.sh and airstack.sh:
        AUTOLAUNCH: "true"             # boot AirStack on startup
        ISAAC_SIM_LIVESTREAM: "true"   # use the isaac-sim-livestream profile
        NUM_ROBOTS: "1"
        AIRSTACK_BRANCH: "multi-raven"        # branch entrypoint.sh clones
        AIRSTACK_REPO_URL: "https://github.com/castacks/AirStack.git"
        # RESOLVE `airstack://` FROM NUCLEUS, NOT FROM THE CLONE.
        #
        # Every OSMO MISSION yaml already sets this; the dev workflow did not,
        # and the cost was invisible: ~4.4 GB of AEC packs, objaverse props and
        # material textures were being rsynced onto every fresh pod over the
        # ssh tunnel — five minutes a pod, repeated after every OOM, timeout or
        # resubmit — for assets that were already sitting on Nucleus, on the
        # same LAN as the worker. Measured: the same library uploads in FOUR
        # SECONDS from the pod, because it never leaves the building.
        #
        # It also fixes what git cannot. `Crushed_Asphalt_Ground`'s 8K maps and
        # the other large textures do not belong in the repo at all; on Nucleus
        # they resolve through the same `airstack://` path as everything else.
        #
        # The whole `scene_gen/assets` tree is mirrored under this root — aec,
        # objaverse, archetype, materials — verified 2026-08-31 by walking both
        # sides and comparing sizes: 548 material files identical, 0 missing.
        # `scene_gen/tools/upload_materials.py` keeps it that way and is
        # idempotent, so re-running after adding one material costs one upload.
        AIRSTACK_ASSET_ROOT: "omniverse://airlab-nucleus.andrew.cmu.edu:443/Projects/SEI-COA"
        # SSH_PUB_KEY is supplied at submit time:
        #   --set-env "SSH_PUB_KEY=$(cat ~/.ssh/id_ed25519.pub)"
      credentials:
        # Each student registers these in their own OSMO profile once.
        # See docs/tutorials/airstack_on_osmo.md "Step 0".
        #
        # airlab-nucleus (GENERIC) — materialized into omni_pass.env by
        # entrypoint.sh so Compose env_files it into the Isaac Sim ctnr.
        airlab-nucleus:
          OMNI_USER: omni_user
          OMNI_PASS: omni_pass
          OMNI_SERVER: omni_server
        # airlab-docker-login (GENERIC) — exposed as env vars so the
        # inner dockerd can authenticate to airlab-docker.andrew.cmu.edu
        # when `airstack up` triggers an AirStack image-pull. (The
        # *outer* pod's image-pull of airstack-osmo-workspace is handled
        # automatically by a sibling REGISTRY-type credential which does
        # not need a reference here — OSMO auto-attaches it on submit.)
        airlab-docker-login:
          AIRLAB_REGISTRY_USER: username
          AIRLAB_REGISTRY_PASS: password

  resources:
    default:
      # 20 cpu / 120Gi is the interactive scene-authoring shape, not the
      # mission shape.
      #
      # SIZED TO A NODE, NOT TO A WISH. A pod must fit on ONE worker, and this
      # cluster is three shared 215Gi / 47-cpu / 4-GPU boxes that are usually
      # most of the way full. Read `osmo resource list` before submitting, and
      # remember its columns are USED/TOTAL -- subtract. When this was set the
      # best node had 128Gi and 22 cpu free, so this takes nearly all of it and
      # still places. Asking for more does not get a bigger pod, it gets an
      # unschedulable one that sits in SCHEDULING forever. A scene build is one Isaac Sim process plus the
      # scene_gen python driver: no robot containers, no rayfronts, no
      # ROS graph. What it DOES need is headroom for USD composition —
      # the 1 km assemblies peak well past 40Gi resident while the
      # archetype stage holds every baked building open at once, and the
      # settle passes are single-threaded PhysX, so cores past ~12 sit
      # idle -- EXCEPT that on these workers the settle runs on CPU (see the
      # memory note below), which is where the extra cores go.
      # (airstack-mission-2gpu.yaml runs 20/80Gi because it also carries a
      # robot + a quantised VLM server.)
      cpu: 12
      # ONE, down from two. Isaac Sim renders on GPU 0 and nothing measured
      # here ever used the second card: the settle that was supposed to need
      # it runs on CPU on these workers anyway (see the memory note), and a
      # 500 m assembly fits one 48 GB card comfortably. Asking for two made
      # the pod harder to place for no benefit -- the cluster is routinely
      # down to 1-2 free GPUs across all three workers.
      gpu: 1
      # 160Gi, RAISED FROM 80Gi 2026-08-31 after an archetype bake OOM-killed
      # the whole pod — not just the bake, every container in the cgroup.
      #
      # 80Gi is the right number for a bake whose settle runs on the GPU. It is
      # NOT the right number here, because on these workers Kit logs "Skipping
      # NVIDIA GPU due CUDA being in bad state" and PhysX silently falls back
      # to CPU — so ~6,845 rigid bodies and their cooked collision meshes live
      # in HOST RAM instead of on the card. The kernel log was unambiguous:
      # "Memory cgroup out of memory: Killed process (python.sh)".
      #
      # The host has 216 GB, so the cgroup was the only ceiling that mattered.
      # 160Gi leaves roughly 2x headroom over the observed peak and still
      # leaves most of the worker for other tenants.
      #
      # Batching the bake (`ARCH_STYLES=` on the tornado/quake bakers) cuts
      # peak memory ~3x and is worth doing ANYWAY — but it should be a choice,
      # not the only thing standing between a routine bake and a dead pod.
      memory: 80Gi
      # AirStack image set is large: airstack-dev-9 (2026-05-14) hit the
      # 100Gi container ephemeral cap during inner Compose's first image
      # extract, before the second image even started downloading. So the
      # full set of inner images alone exceeds 100Gi extracted. 500Gi
      # comfortably holds isaac-sim + robot-desktop + gcs images, plus the
      # AirStack source clone, colcon build output, the baked archetype
      # USDs (a merged-asset bake set runs to tens of Gi), and rendered
      # preview frames. The airstack pool's workers have 4.2Ti of
      # ephemeral capacity each (root disks resized 2026-05-14), so this
      # leaves plenty of room for other tenants on the shared workers.
      storage: 500Gi

  timeout:
    # 20h. It was 8h, and 8h is wrong for scene authoring: a single 500 m
    # assembly plus its captures runs 6-10 minutes, an archetype bake with a
    # settle runs 20-25 (PhysX GPU dynamics does not engage on this pod — see
    # the build-hurricane-scenes bug catalogue), and an iteration loop is
    # dozens of those. airstack-dev-175 timed out mid-session on 2026-08-30
    # with the pod still in use.
    #
    # THE POD IS NOT FREED BY A SHORTER TIMEOUT, it is freed by
    # `airstack osmo:down`, which is one command and is the honest way to
    # give the GPU back. A timeout is a backstop against a forgotten pod, not
    # a scheduling policy — so set it past any session you would actually sit
    # through and cancel deliberately instead.
    exec_timeout: 100h
