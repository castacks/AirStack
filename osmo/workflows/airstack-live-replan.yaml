# Two-GPU OSMO workflow for shadow-only RRM live action → replan development.
#
# This is separate from airstack-dev.yaml so the ordinary one-GPU Isaac workspace
# remains unchanged. It uses one workspace GPU and one persistent Cosmos worker GPU.
# The worker downloads the pinned Cosmos snapshot into its task-local storage at
# startup. It is deliberately not a persistent cache.
#
# Submit with an existing pool (this does not create or restart a pool):
#   osmo workflow submit osmo/workflows/airstack-live-replan.yaml --pool <gpu-pool> \
#     --set-env "SSH_PUB_KEY=$(cat ~/.ssh/id_ed25519.pub)"

workflow:
  name: airstack-live-replan
  groups:
  - name: airstack-live-replan
    # The workspace and worker start together and communicate only over the
    # group-private network. `{{host:cosmos-worker}}` is OSMO's task-address token.
    ignoreNonleadStatus: false
    tasks:
    - name: workspace
      lead: true
      resource: workspace-gpu
      image: airlab-docker.andrew.cmu.edu/airstack/airstack-osmo-workspace:latest
      privileged: true
      command: ["bash"]
      args: ["/usr/local/bin/entrypoint.sh"]
      environment:
        AUTOLAUNCH: "true"
        ISAAC_SIM_LIVESTREAM: "true"
        NUM_ROBOTS: "1"
        AIRSTACK_BRANCH: "main"
        AIRSTACK_REPO_URL: "https://github.com/castacks/AirStack.git"
        # The current console does not call this yet. The future provider adapter
        # receives this private URL; no worker port-forward is required.
        RRM_COSMOS_WORKER_URL: "http://{{host:cosmos-worker}}:8090"
      credentials:
        airlab-nucleus:
          OMNI_USER: omni_user
          OMNI_PASS: omni_pass
          OMNI_SERVER: omni_server
        airlab-docker-login:
          AIRLAB_REGISTRY_USER: username
          AIRLAB_REGISTRY_PASS: password

    - name: cosmos-worker
      resource: cosmos-worker-gpu
      image: airlab-docker.andrew.cmu.edu/airstack/airstack-rrm-cosmos-worker:latest
      command: ["bash", "-lc"]
      args:
      - |
        set -euo pipefail
        : "${HF_TOKEN:?Missing rrm-huggingface-read credential}"
        readonly MODEL_ID="nvidia/Cosmos-Reason2-8B"
        readonly MODEL_REVISION="a9fae2cf89dc64db96b12860417f0eb403013bb9"
        readonly MODEL_DIR="$COSMOS_MODEL_PATH"
        if [[ ! -f "$MODEL_DIR/config.json" ]]; then
          mkdir -p "$MODEL_DIR"
          hf download "$MODEL_ID" --revision "$MODEL_REVISION" \
            --local-dir "$MODEL_DIR" --token "$HF_TOKEN"
        fi
        unset HF_TOKEN
        exec python3 /opt/rrm/scripts/rrm_cosmos_worker.py \
          --host 0.0.0.0 --port 8090 --model-path "$MODEL_DIR"
      environment:
        # Task-local storage. It is re-downloaded after every new OSMO workflow.
        COSMOS_MODEL_PATH: "/var/lib/rrm/models/Cosmos-Reason2-8B"
        HF_HOME: "/var/lib/rrm/hf-cache"
      credentials:
        # Create once in the operator's OSMO profile; see cosmos-worker/README.md.
        # Only this worker task receives the short-lived read token.
        rrm-huggingface-read:
          HF_TOKEN: hf_token

  resources:
    workspace-gpu:
      cpu: 12
      gpu: 1
      memory: 48Gi
      storage: 500Gi
    cosmos-worker-gpu:
      cpu: 12
      gpu: 1
      memory: 48Gi
      storage: 200Gi

  timeout:
    exec_timeout: 8h
