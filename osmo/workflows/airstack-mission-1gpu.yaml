# AirStack batch mission workflow on OSMO — SINGLE GPU.
#
# Identical to airstack-mission.yaml except `resources:`. Everything shares one
# card: Isaac Sim, the robot's rayfronts, and (under CONAVGPT_BASELINE) the
# InternVL3-2B assigner. `_pick_rayfronts_gpu()` and `_pick_conavgpt_gpu()` both
# return None at n_gpus <= 1, so nothing is pinned and they simply co-tenant.
#
# THIS IS THE THING TO WATCH ON THE FIRST RUN. The 4-GPU sizing exists because a
# rayfronts that lands on Isaac Sim's card died of CUDA OOM and silently cost
# that drone the whole mission. At one robot the budget is roughly Isaac ~10 GB
# + rayfronts' RADIO encoder + ~2.2 GB of 8-bit InternVL3, which fits a 48 GB
# card comfortably and a 24 GB card only just. If rayfronts reports OOM in the
# robot log, move to airstack-mission.yaml (gpu: 4) rather than tuning.
#
# NOT FOR osmo/missions/conavgpt_wildfire_1robot.yaml. That one adds a
# conavgpt2 VLM server to the same card and the pair broke Isaac Sim two
# different ways: `robots [1] not ready within 1800s` + NV_ERR_NO_MEMORY on an
# OSMO submission, and locally an RTX render graph that failed every frame
# ("Render Graph on device 0 has failed during recording") so no camera image
# was ever published. It runs on osmo/workflows/airstack-mission-2gpu.yaml.
#
# Same workspace image and pod layout as airstack-dev.yaml, but instead of a
# single `airstack up` for an interactive session, this runs a batch mission:
# osmo/workspace/mission_runner.py executes the mission spec named by
# OSMO_MISSION_FILE — repeated cycles of
#
#   airstack down → airstack up → wait for PX4 ready → record mcap bags
#   → run steps (takeoff / land / navigate / any ros2 command) → collect
#   bags + logs → airstack down
#
# NO IMAGE REBUILD NEEDED. The mission engine is NOT baked into the image:
# the command below reuses the baked entrypoint for pod setup only
# (OSMO_AIRSTACK_UP=false → sshd, inner dockerd, branch clone, creds, registry
# login — no `airstack up`), then hands off to mission_launcher.sh FROM THE
# CLONE. So `git push` your branch and resubmit; the launcher + runner + spec
# all come from the branch. (The launcher pip-installs PyYAML at runtime if
# the image predates it.)
#
# Mission specs live in osmo/missions/ (cloned with the branch, so what you
# push is what runs). Schema: osmo/missions/README.md.
#
# To submit (or use the wrapper: airstack osmo:mission <mission.yaml>):
#
#   osmo workflow submit osmo/workflows/airstack-mission.yaml \
#     --pool <gpu-pool> \
#     --set-env "SSH_PUB_KEY=$(cat ~/.ssh/id_ed25519.pub)" \
#                "OSMO_MISSION_FILE=osmo/missions/example_takeoff_land.yaml" \
#                "AIRSTACK_BRANCH=<your-branch>"
#
# Results land in /osmo/output/airstack-mission-results (symlinked from
# /root/AirStack/osmo/results). With the default OSMO_MISSION_KEEP_ALIVE=true
# the pod stays alive after the mission so you can pull artifacts from your
# laptop:
#
#   airstack osmo:fetch ./results/
#
# Set OSMO_MISSION_KEEP_ALIVE=false for fire-and-forget runs: the task exits
# cleanly when the mission ends, which frees the GPU and triggers the
# `outputs:` upload below (if a destination bucket is configured).
#
# NAS upload: if the airlab-storage credential is set (airstack osmo:setup) and
# the mission spec has `nas_dest:`, the pod rsyncs results to airlab-storage
# then tears itself down — no laptop fetch needed. See mission_launcher.sh.

workflow:
  name: airstack-mission-1gpu
  groups:
  - name: airstack
    tasks:
    - name: workspace
      lead: true
      image: airlab-docker.andrew.cmu.edu/airstack/airstack-osmo-workspace:latest
      # Required so the inner dockerd can run (same DinD setup as airstack-dev).
      privileged: true
      # Bootstrap: run the baked entrypoint for pod setup ONLY
      # (OSMO_AIRSTACK_UP=false), backgrounded, then hand off to the launcher
      # that ships in the freshly-cloned branch. This is what makes the
      # mission engine rebuild-free — see the header comment.
      command: ["bash", "-c"]
      args:
      - |
        set -uo pipefail
        log() { echo "[mission-bootstrap] $*"; }
        log "starting pod setup via baked entrypoint (OSMO_AIRSTACK_UP=false)"
        # Baked entrypoint for pod setup, backgrounded. `tee` streams its logs to
        # `osmo workflow logs` and to a file the launcher greps for the terminal
        # "sleeping forever" line. `tee` holds THIS task's stdout pipe open, so
        # mission_launcher.sh kills BAKED_PID before it exits — otherwise
        # osmo_exec never sees pipe EOF on our exit and the pod never frees the
        # GPU (it hangs at RUNNING until exec_timeout).
        OSMO_AIRSTACK_UP=false /usr/local/bin/entrypoint.sh 2>&1 \
          | tee /tmp/baked-entrypoint.log &
        export BAKED_PID=$!
        LAUNCHER=/root/AirStack/osmo/workspace/mission_launcher.sh
        log "waiting for branch clone to provide $LAUNCHER"
        for i in $(seq 1 600); do [ -f "$LAUNCHER" ] && break; sleep 2; done
        if [ ! -f "$LAUNCHER" ]; then
          log "ERROR: $LAUNCHER not found after clone wait; sleeping for SSH debug"
          exec sleep infinity
        fi
        log "handing off to mission_launcher.sh"
        exec bash "$LAUNCHER"
      environment:
        # Mission selection — repo-relative path into the clone. Override at
        # submit time to run a different mission.
        OSMO_MISSION_FILE: "osmo/missions/example_takeoff_land.yaml"
        # true  → pod sleeps after the mission; fetch results over ssh, then
        #         `airstack osmo:down` (results die with the pod!).
        # false → task exits when the mission ends: GPU freed, /osmo/output
        #         uploaded to `outputs:` destinations.
        OSMO_MISSION_KEEP_ALIVE: "false"
        AIRSTACK_BRANCH: "krrishj18/osmo-mission-runner"        # branch entrypoint.sh clones
        AIRSTACK_REPO_URL: "https://github.com/castacks/AirStack.git"
        # SSH_PUB_KEY is supplied at submit time (needed for osmo:fetch):
        #   --set-env "SSH_PUB_KEY=$(cat ~/.ssh/id_ed25519.pub)"
      # Uncomment and point at a bucket the OSMO deployment can write to, to
      # have /osmo/output uploaded automatically when the task exits (only
      # meaningful with OSMO_MISSION_KEEP_ALIVE=false — a canceled workflow
      # does not upload outputs):
      #
      # outputs:
      #   - url: s3://<bucket>/airstack-missions/{{workflow_id}}/
      credentials:
        # Same per-user credentials as airstack-dev.yaml — see
        # docs/tutorials/airstack_on_osmo.md "Step 0" / `airstack osmo:setup`.
        # These map OSMO credential fields → pod env vars; no secret values live
        # in this file.
        airlab-nucleus:
          OMNI_USER: omni_user
          OMNI_PASS: omni_pass
          OMNI_SERVER: omni_server
        airlab-docker-login:
          AIRLAB_REGISTRY_USER: username
          AIRLAB_REGISTRY_PASS: password
        # Optional: NAS result upload. Absent credential → nothing injected →
        # upload disabled. Enabled per-mission via `nas_dest:` in the spec.
        airlab-storage:
          AIRLAB_STORAGE_USER: username
          AIRLAB_STORAGE_PASS: password
          AIRLAB_STORAGE_HOST: host

  resources:
    default:
      # One robot, one card. CPU/memory come down with the fleet; storage stays
      # generous because the plat build and the mcap bags are unchanged by it.
      cpu: 25
      gpu: 1
      memory: 64Gi
      storage: 400Gi

  timeout:
    # With keep-alive the pod sleeps after the mission until this expires (then
    # it's gone — fetch first). Sized to stay up ~30h post-mission for
    # osmo:fetch (mission itself runs in the first ~1-2h).
    exec_timeout: 100h
