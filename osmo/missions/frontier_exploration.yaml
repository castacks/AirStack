# frontier_exploration — 3-robot frontier-only semantic-search BASELINE,
# cycled across three scenes (RetroNeighborhood, FireAcademy, ConstructionSite).
#
# semantic_search_task spawns raven_nav with frontier_only_baseline:=true
# (see semantic_search_task/node.py): navigation is pure frontier exploration
# with no semantic cues; target tracking still runs.
#
# Environment scheduling (see `environment_order` / `environments:` below):
# grouped runs each scene `iterations` times in a row (retro×N → fireacademy×N →
# constructionsite×N); total runs = iterations * 3. Each environment sets a
# different ENV_URL + spawn rectangle (drones are randomized inside it every
# bring-up — in-bounds, >=3 m apart, random yaw) and its own search_area.
#
# Run on OSMO (workflow resources are sized for this mission: 3 GPU / 24 CPU
# / 96Gi / 500Gi):
#   airstack osmo:mission osmo/missions/frontier_exploration.yaml --pool <gpu-pool>
#
# Or locally:
#   python3 osmo/workspace/mission_runner.py osmo/missions/frontier_exploration.yaml \
#     --airstack-root "$(pwd)"
#
# Schema reference: osmo/missions/README.md

name: frontier_exploration

stack:
  # Plain isaac-sim (headless via ISAAC_SIM_HEADLESS below): the livestream
  # variant encodes a WebRTC viewport every frame, competing with the camera
  # render products for the same render loop.
  services: [isaac-sim, robot-desktop, gcs]

env:
  NUM_ROBOTS: 3
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  # Reads ENV_URL + SPAWN_POLY (set per iteration from `environments:` below)
  # and spawns one randomized drone per robot inside the spawn rectangle.
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  # Opt into the frontier-only baseline (default is full coordination).
  FRONTIER_ONLY_BASELINE: "true"

# Environments cycled across iterations. UPPERCASE keys (ENV_URL, SPAWN_POLY)
# are exported as env vars before `airstack up`, so the isaac-sim launch script
# picks them up; lowercase keys (search_area) are templated into the steps via
# {{env.search_area}}.
#
#   ENV_URL:    full omniverse://… URL, or just the path after the nucleus
#               server (the launch script prepends omniverse://<server>/).
#   SPAWN_POLY: JSON — 2 opposite corners for an axis-aligned rectangle, or
#               >=3 corners for a convex polygon. Drones spawn randomly inside
#               it (>=3 m apart, random heading) on every bring-up.
environments:
  - name: retroneighborhood
    ENV_URL: "Library/Stages/RetroNeighborhood/RetroNeighborhood.stage.usd"
    # Fixed spawn (pos + orient). Re-randomize: uncomment SPAWN_POLY, drop SPAWN_CONFIGS.
    # SPAWN_POLY: "[[11, 6.5], [-13, -6.5]]"
    SPAWN_CONFIGS: '[{"x_m": 6.764, "y_m": -1.767, "orient": [0,0,-0.1193,0.9929]}, {"x_m": -0.354, "y_m": 2.251, "orient": [0,0,0.8743,0.4854]}, {"x_m": 2.939, "y_m": 5.117, "orient": [0,0,-0.7931,0.6091]}]'
    # 2nd fixed spawn (swap in): '[{"x_m": -11.323, "y_m": -3.956, "orient": [0,0,0.803,0.5959]}, {"x_m": 0.977, "y_m": 0.338, "orient": [0,0,-0.9754,0.2203]}, {"x_m": -3.943, "y_m": 2.377, "orient": [0,0,0.6611,0.7503]}]'
    STAGE_SCALE: "0.01"
    SPAWN_HEIGHT_M: "0.3"
    # GT annotation file (annotations/<RESULTS_SCENE>.json) for finalize scoring.
    RESULTS_SCENE: "RetroNeighborhood"
    query: "house"
    background_queries: "sky, ground, grass, road, bus stop, shed, garage, tree"
    search_area:
      points:
        - {x: -150.0, y: -110.0, z: 0.0}
        - {x: -150.0, y: 70.0, z: 0.0}
        - {x: 170.0, y: 70.0, z: 0.0}
        - {x: 170.0, y: -110.0, z: 0.0}

  - name: fireacademy
    ENV_URL: "Projects/AirStack/scenes/urban/allegheny_county_fire_academy/fire_academy.scene.usd"
    # Fixed spawn (pos + orient). Re-randomize: uncomment SPAWN_POLY, drop SPAWN_CONFIGS.
    # SPAWN_POLY: "[[27.5, 3.8], [23.8, 14.4], [26.1, 17.5], [30, 11.8]]"
    SPAWN_CONFIGS: '[{"x_m": 27.34, "y_m": 5.359, "orient": [0,0,0.9757,0.2192]}, {"x_m": 25.982, "y_m": 12.241, "orient": [0,0,-0.2076,0.9782]}, {"x_m": 26.223, "y_m": 15.534, "orient": [0,0,-0.3285,0.9445]}]'
    # 2nd fixed spawn (swap in): '[{"x_m": 25.052, "y_m": 12.711, "orient": [0,0,0.6342,0.7731]}, {"x_m": 28.86, "y_m": 12.714, "orient": [0,0,0.5051,0.8631]}, {"x_m": 27.83, "y_m": 8.978, "orient": [0,0,0.9986,0.0538]}]'
    STAGE_SCALE: "0.01"
    SPAWN_HEIGHT_M: "0.3"
    RESULTS_SCENE: "FireAcademy"
    query: "red building, water tower, radio tower, blue container, red container"
    background_queries: "sky, ground, grass, road, tree, container, gas tank"
    search_area:
      points:
        - {x: 13.0, y: -135.0, z: 0.0}
        - {x: 135.0, y: -13.0, z: 0.0}
        - {x: 13.0, y: 135.0, z: 0.0}
        - {x: -135.0, y: 13.0, z: 0.0}

  - name: constructionsite
    ENV_URL: "Library/Stages/ConstructionSite/ConstructionSite.stage.usd"
    # Fixed spawn (pos + orient). Re-randomize: uncomment SPAWN_POLY, drop SPAWN_CONFIGS.
    # SPAWN_POLY: "[[27.63, 2], [21, -5.8]]"
    SPAWN_CONFIGS: '[{"x_m": 22.99, "y_m": -4.679, "orient": [0,0,0.2886,0.9575]}, {"x_m": 25.203, "y_m": 0.448, "orient": [0,0,-0.2699,0.9629]}, {"x_m": 22.903, "y_m": -1.579, "orient": [0,0,0.9137,0.4063]}]'
    # 2nd fixed spawn (swap in): '[{"x_m": 25.19, "y_m": -3.707, "orient": [0,0,-0.6227,0.7825]}, {"x_m": 24.078, "y_m": 0.6, "orient": [0,0,0.9756,0.2195]}, {"x_m": 22.347, "y_m": -1.95, "orient": [0,0,-0.8817,0.4718]}]'
    STAGE_SCALE: "0.01"
    SPAWN_HEIGHT_M: "0.3"
    RESULTS_SCENE: "ConstructionSite"
    query: "Forklift, Towercrane, red container"
    background_queries: "sky, ground, grass, road, Building, cabling winches, blue tarp"
    search_area:
      points:
        - {x: 76.0, y: 50.0, z: 0.0}
        - {x: 76.0, y: -71.0, z: 0.0}
        - {x: -37.0, y: -67.0, z: 0.0}
        - {x: -40.0, y: 50.0, z: 0.0}

  - name: abandonedfactory
    ENV_URL: "Library/Stages/AbandonedFactory/AbandonedFactory.stage.usd"
    # Fixed spawn (pos + orient; z from SPAWN_HEIGHT_M). Re-randomize: uncomment SPAWN_POLY.
    # SPAWN_POLY: "[[16.5, -1.2], [22, 9.6]]"
    SPAWN_CONFIGS: '[{"x_m": 20.458, "y_m": 1.499, "orient": [0,0,0.1166,0.9932]}, {"x_m": 20.46, "y_m": 4.676, "orient": [0,0,-0.9881,0.1541]}, {"x_m": 20.476, "y_m": 8.299, "orient": [0,0,0.4036,0.9149]}]'
    # 2nd fixed spawn (swap in): '[{"x_m": 18.342, "y_m": 1.867, "orient": [0,0,-0.313,0.9497]}, {"x_m": 17.552, "y_m": 5.243, "orient": [0,0,-0.8323,0.5543]}, {"x_m": 20.879, "y_m": 7.149, "orient": [0,0,-0.147,0.9891]}]'
    STAGE_SCALE: "1.0"
    SPAWN_HEIGHT_M: "1.0"
    RESULTS_SCENE: "AbandonedFactory"
    query: "building, water tower"
    background_queries: "sky, ground, grass, road, tree"  
    search_area:
      points:
        - {x: 45.0, y: 102.0, z: 0.0}
        - {x: 45.0, y: -97.0, z: 0.0}
        - {x: -109.0, y: -97.0, z: 0.0}
        - {x: -109.0, y: 102.0, z: 0.0}

# Send goals through the GCS action_relay — the exact path Foxglove uses.
# The relay transforms the global-ENU search polygon into each robot's local
# 'map' frame (subtracting that robot's GPS boot pose) before forwarding,
# identical to what happens when the polygon is entered in Foxglove.
command_route: gcs

# grouped: run each environment `iterations` times in a row (retro×N, then
# fireacademy×N, then constructionsite×N). So iterations is PER ENVIRONMENT;
# total runs = iterations * 3. The spawn layout re-randomizes each run.
environment_order: grouped
iterations: 3

# Redo an iteration (clean down→up→fly→down) if a step up to and including
# semantic_search fails — i.e. the precondition steps fail, or semantic_search
# never gets feedback after its own retries. Up to 3 attempts per iteration.
iteration_attempts: 3

ready:
  timeout_s: 600

record:
  enabled: true
  scope: gcs
  required: true
  topics:
    - /tf
    - /tf_static
    - /gcs/robot_markers
    - /gcs/payload/{robot}/filtered_rays
    - /gcs/payload/{robot}/filtered_frontiers
    - /gcs/payload/{robot}/explored_area_coverage
    - /gcs/payload/{robot}/confirmed_targets
    - /gcs/sim_ground
    - /gcs/annotations/bboxes

on_step_failure: abort_iteration

steps:
  - run:
      container: robot_1
      cmd: python3 -c "import torch; torch.hub.load('NVlabs/RADIO', 'radio_model', version='c-radio_v3-b', skip_validation=True, adaptor_names=['siglip2','sam'])"
      timeout_s: 900
      attempts: 5
      retry_delay_s: 15

  - action:
      task: takeoff
      goal: {target_altitude_m: 12.0, velocity_m_s: 1.0}
      timeout_s: 180

  - wait: 5

  # Only needs to RUN, not succeed: pass as soon as feedback is seen (the search
  # actually started); if no feedback after the retries, the step fails and the
  # iteration is redone.
  - action:
      task: semantic_search
      timeout_s: 900
      cancel_on_timeout: true
      pass_on_feedback: true
      goal:
        query: "{{env.query}}"
        background_queries: "{{env.background_queries}}"
        search_area: "{{env.search_area}}"
        min_altitude_agl: 10.0
        max_altitude_agl: 20.0
        min_flight_speed: 0.5
        max_flight_speed: 1.0
        confidence_threshold: 0.95