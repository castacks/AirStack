# Send goals through the GCS action_relay — the exact path Foxglove uses.
command_route: gcs

# Tags results dirs iter_NNN__<scene>__conavgpt; without it resolve_method finds
# no known token in the mission name and labels every iteration "na".
method: conavgpt

# grouped: each entry runs `iterations` times in a row, in file order, so a
# scene's start locations stay adjacent. iterations is PER ENTRY.
environment_order: grouped
# 1: one flight per (scene, start). The sweep is the environments list, not
# repeats — repeats buy less than another scene at this cost per run.
iterations: 1

# 3: a lost takeoff / a semantic_search goal that never gets feedback is a
# harness fault, not a result, so redo the whole clean down->up->fly->down.
iteration_attempts: 3

ready:
  # 600 s: single-robot PX4 bring-up is the fastest case in the fleet, and this
  # is the value every 1-3 robot mission in the family already uses.
  timeout_s: 600

record:
  enabled: true
  # both: the GCS mcap holds the bridged fleet view; the per-robot mcaps hold
  # the conavgpt topics, which are robot-domain only — the gossip payload
  # visualizer has no handler for "assignment", so nothing conavgpt reaches
  # /gcs/payload/*.
  scope: both
  # The bags ARE the deliverable here; don't fly a run unrecorded.
  required: true
  topics:
    - /tf
    - /tf_static
    - /{robot}/odometry_conversion/odometry
    - /gcs/robot_markers
    - /gcs/payload/{robot}/filtered_rays
    - /gcs/payload/{robot}/filtered_frontiers
    - /gcs/payload/{robot}/explored_area_coverage
    - /gcs/payload/{robot}/confirmed_targets
    - /gcs/payload/{robot}/auction_table
    - /gcs/sim_ground
    - /gcs/annotations/bboxes
  robot_topics:
    - /robot_{n}/rayfronts/voxel_rgb
    - /robot_{n}/rayfronts/msg_serv/voxels_sim/all
    # conavgpt debug set (contract sec. "Topics"). assign_request + map_image
    # only ever publish on the leader; rosbag2 waits on absent topics, so
    # recording them on every robot domain is free and survives a leader change.
    - /robot_{n}/conavgpt/assign_request
    - /robot_{n}/conavgpt/assignment
    - /robot_{n}/conavgpt/map_image
    - /robot_{n}/conavgpt/round_table

# abort_iteration: a failed precondition (no RADIO weights, no takeoff) makes
# the rest of that flight meaningless, but the next scene is still worth flying.
on_step_failure: abort_iteration

steps:
  # rayfronts' encoder. Pre-pulled once into the shared /root/.cache so the
  # first in-node load can't time out mid-iteration.
  - run:
      container: robot_1
      cmd: python3 -c "import torch; torch.hub.load('NVlabs/RADIO', 'radio_model', version='c-radio_v3-b', skip_validation=True, adaptor_names=['siglip2','sam'])"
      timeout_s: 900
      attempts: 5
      retry_delay_s: 15

  # The assigner's VLM. Leader-only at runtime, but the cache mount is shared,
  # so one pull on robot_1 serves whichever robot ends up leading.
  - run:
      container: robot_1
      cmd: python3 -c "from huggingface_hub import snapshot_download; snapshot_download('OpenGVLab/InternVL3-2B')"
      timeout_s: 900
      attempts: 5
      retry_delay_s: 15

  - action:
      task: takeoff
      goal: {target_altitude_m: 12.0, velocity_m_s: 1.0}
      timeout_s: 180

  - wait: 5

  # 2400 s wall backstop for a 300 sim-second budget — deliberately loose.
  # The sim budget must be what ends the run; if the WALL timeout binds first
  # the run covers less simulated ground than its peers and stops being
  # comparable, which is the one failure this whole scheme exists to prevent.
  # 1200 s only covers 300 sim s down to RTF 0.25; 2400 s covers it to 0.125,
  # well under anything a single robot should ever produce. An unused backstop
  # costs nothing — the step ends when the sim budget is hit.
  # cancel_on_timeout still lets the task compile its metrics.
  - action:
      task: semantic_search
      timeout_s: 2400
      cancel_on_timeout: true
      pass_on_feedback: true
      goal:
        query: "{{env.query}}"
        background_queries: "{{env.background_queries}}"
        search_area: "{{env.search_area}}"
        min_altitude_agl: 5.0
        max_altitude_agl: 20.0
        min_flight_speed: 0.5
        max_flight_speed: 1.0
        confidence_threshold: 0.95
        # Per-scene voxel similarity gate (see each scene template above).
        voxel_score_threshold: "{{env.voxel_score_threshold}}"
        # Per-scene ray score gate + voxel cluster size (-1 on an entry = raven_nav default).
        score_threshold: "{{env.score_threshold}}"
        voxel_min_cluster_size: "{{env.voxel_min_cluster_size}}"
        # Consensus bundle length (head executed, tail reserved + replanned).
        bundle_len: 3
        # 300 simulated seconds, the budget the whole simtime300 family uses.
        # Isaac's real-time factor falls as drones are added, so scoring on sim
        # time is the only way 1- and 5-robot runs mean the same thing.
        #
        # RAISING THIS: semantic_search_task logs one `[rtf]` line per run
        # (sim s, wall s, ratio, and the projected wall cost of the budget) and
        # puts the same numbers in the action result. Read it out of the first
        # sweep's container logs, then size a larger budget from the MEASURED
        # rate rather than the extrapolated one — and raise timeout_s with it,
        # keeping wall >= sim / (worst measured RTF) with margin.
        max_sim_seconds: 300
