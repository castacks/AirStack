# conavgpt_1robot — SINGLE-ROBOT ablation of the CoNavGPT (VLM-Assign) baseline,
# across all 8 scenes x 3 fixed start locations (24 runs).
#
# This is the same method with a fleet of one: each round the VLM is shown one
# numbered robot and the numbered frontier regions and assigns that robot one
# region. It is the degenerate case on purpose — it isolates "does the VLM pick
# good regions" from "does the VLM divide work well". Two axes go dead here and
# nothing should be read off them: the gossip distribution path is exercised
# only trivially (the leader is the sole consumer of its own assignment, so an
# assignment can never be stale-by-comms), and the comms axis is meaningless —
# COMMS_RANGE_M below is the no-limit sentinel and must not be swept.
#
# Method (Co-NavGPT, Yu et al. arXiv:2310.07937, "VLM-Assign" arm): every round
# ONE 2B VLM call looks at the team's shared BEV with numbered frontier regions
# and numbered robots and returns a robot -> region assignment; the assignment
# is gossiped and each robot flies to its region. A robot with no fresh
# assignment falls back to nearest-viable-frontier and the round is marked
# `fallback: true` — that degradation is a measured result, not a run failure.
# The published method is single-target with co-located starts; this is the
# multi-target, non-co-located, time-integrated adaptation.
#
# multi_raven_mission.yaml IS THE SOURCE OF TRUTH. Its scene templates, queries,
# background queries, search areas, detection thresholds, spawn layouts and
# steps block are copied verbatim here so the numbers are directly comparable
# with multi-raven / frontier / vlfm / lvlm. The ONLY intended behavioural
# differences are CONAVGPT_BASELINE=true and the fleet size.
#
# Depends on the CONAVGPT_BASELINE passthrough in
# robot/docker/robot-base-docker-compose.yaml; without it the flag never reaches
# raven_nav and this silently runs as full multi-raven coordination. Check the
# first iteration's raven log says CoNavGPT-based before trusting a sweep.
#
# GPU mapping (semantic_search_task._pick_rayfronts_gpu: gpu = ROS_DOMAIN_ID %
# n_gpus). On the stock 4-GPU pod: robot_1 -> GPU 1, and GPU 0 stays Isaac Sim's
# alone. The InternVL3-2B assigner is pinned the same way, so it shares GPU 1
# with robot_1's rayfronts — the only card with two tenants, and the reason the
# stock workflow is still the right size here.
#
# Submit with the STOCK workflow:
#   airstack osmo:mission osmo/missions/conavgpt_1robot.yaml --pool <gpu-pool>
#
# Or locally:
#   python3 osmo/workspace/mission_runner.py osmo/missions/conavgpt_1robot.yaml \
#     --airstack-root "$(pwd)"
#
# Schema reference: osmo/missions/README.md

name: conavgpt_1robot

# Beside the rest of the 300-sim-second family, which is the set these runs are
# scored against.
nas_dest: /volume4/dsta/raven-simtime300/

stack:
  services: [isaac-sim, robot-desktop, gcs]

env:
  NUM_ROBOTS: 1
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  # Honours SPAWN_CONFIGS verbatim (the NUM_ROBOTS-driven default script would
  # ignore it); a 1-entry SPAWN_CONFIGS spawns exactly one drone.
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  # The one behavioural switch this file exists for.
  CONAVGPT_BASELINE: "true"
  # Pinned false, not left to the node defaults: Stack.apply_env only MERGES env
  # vars, and the precedence chain is frontier > vlfm > conavgpt, so a sticky
  # true from an earlier mission on the same pod would silently outrank
  # CoNavGPT and the run would be mislabelled rather than fail.
  FRONTIER_ONLY_BASELINE: "false"
  VLFM_BASELINE: "false"
  LVLM_BASELINE: "false"
  # The thresholds in the templates below are SOFTMAX probabilities; with raw
  # cosines (which top out near 0.16) a 0.5 gate rejects every voxel and the run
  # detects nothing. Set explicitly for the same sticky-env reason as above.
  RAYFRONTS_COMPUTE_PROB: "True"
  # No-limit sentinel. With one robot there is no peer to be out of range of;
  # this exists so the value is pinned rather than inherited.
  COMMS_RANGE_M: 5000

# ── scene templates ────────────────────────────────────────────────────────
# Per-scene inputs (map, stage scale, spawn height, query, thresholds, search
# area), anchored once and merged into that scene's three spawn entries via
# `<<:` so all three start locations run byte-identical settings. STAGE_SCALE
