ready:
  timeout_s: 2400
  poll_interval_s: 10

up_timeout_s: 5400
iteration_attempts: 2
on_step_failure: abort_iteration
# Takeoff/land go through the GCS action_relay; so does the semantic_search
# goal (RAVEN has no separate per-robot planner process to launch out of
# band the way the sectored/team baselines do — semantic_search_task spawns
# and owns raven_nav itself, inside the action call).
command_route: gcs

record:
  scope: both
  required: true
  topics:
    - /tf
    - /tf_static
    - /{robot}/odometry_conversion/odometry
    - /{robot}/global_plan
    - /{robot}/navigation_mode
    - /{robot}/raven_nav/discoveries
    - /{robot}/raven_nav/confirmed_targets
    - /{robot}/raven_nav/lvlm_trigger
    - /{robot}/raven_nav/lvlm_request
    - /{robot}/raven_nav/guiding_objects
    - /{robot}/raven_nav/explored_area_coverage
    - /{robot}/debug/voxel_table
    - /{robot}/debug/ray_table
    - /{robot}/rayfronts/status
    # Full-map snapshots — the cross-restart record under the OOM-restart
    # supervisor in offboard_compute.sh (see run-raven-single-shared SKILL.md
    # §5-6 and the memory of the 2026-09-02 live round).
    - /{robot}/rayfronts/msg_serv/voxels_sim/all
    - /{robot}/rayfronts/msg_serv/rays_sim/all
    - /{robot}/rayfronts/voxel_rgb
    - /{robot}/frontiers
    - /{robot}/frontier_cloud
    - /{robot}/current_target
    - /{robot}/committed_target
    # WORLD-FRAME VOXEL CLOUDS: foxglove_visualizer_node.py translates each
    # robot's own local `map`-frame cloud by that robot's locked boot ENU and
    # republishes here, frame_id 'map' — the copy a GCS layout should
    # actually point at (see raven_shared_t250_1robot.yaml's comment for the
    # full derivation). Unlike the 250 m 2-robot rig (where all robots stood
    # close enough that one copy covered the map), this cell spans 1 km
    # across 8 widely separated sectors, so EVERY robot's copy is kept here.
    - /rayfronts_debug/{robot}/voxels_sim/all
    - /rayfronts_debug/{robot}/voxel_rgb
    - /gcs/{robot}/map_origin
    - /gcs/robot_markers
    - /gcs/payload/{robot}/filtered_rays
    - /gcs/payload/{robot}/filtered_frontiers
    - /gcs/payload/{robot}/explored_area_coverage
    - /gcs/payload/{robot}/confirmed_targets
    - /gcs/payload/{robot}/navigation_mode
    - /gcs/sim_ground
    - /gcs/annotations/bboxes

steps:
  # 1. THE GROUND TRUTH THIS ITERATION WILL BE SCORED AGAINST — identical
  #    check to hurricane_suburban_8robot.yaml's step 1; generic to any
  #    method, verifies GT_hints.json/region.json/obstacles.json for THIS
  #    RESULTS_SCENE exist and that the search area contains survivors,
  #    before flying anything.
  - run:
      container: robot_1
      cmd: |
        A=/root/AirStack/robot/ros_ws/src/global/planners/raven_nav/annotations
        S={{env.RESULTS_SCENE}}
        for f in "$A/$S.json" "$A/${S}_obstacles.json" "$A/${S}_region.json"; do
          [ -f "$f" ] || { echo "MISSING $f"; exit 1; }
        done
        python3 - "$A" "$S" <<'EOF'
        import json, sys
        a, s = sys.argv[1], sys.argv[2]
        people = json.load(open(f"{a}/{s}.json"))
        obst = json.load(open(f"{a}/{s}_obstacles.json"))
        reg = json.load(open(f"{a}/{s}_region.json"))
        meta = next(e for e in reg if e.get("class") == "meta")
        srch = next(e for e in reg if e.get("class") == "search")
        print(f"scene {s}: {len(people)} people, {len(obst)} obstacle boxes")
        print(f"  frozen_usd  {meta.get('frozen_usd')}")
        print(f"  disaster    {meta.get('disaster')} / {meta.get('scene_config')}")
        print(f"  search area {srch['area_m2']:,.0f} m2 "
              f"({meta['search_frac_of_plate']:.0%} of the plate), "
              f"{len(srch['polygon_xy'])} pts")
        print(f"  people inside the search {meta['people_inside_search']}"
              f"/{meta['people_total']}")
        assert len(people) == meta["people_total"], "people GT / region disagree"
        assert meta["people_inside_search"] > 0, "no survivor is in the search area"
        EOF
      timeout_s: 120

  # 2. THE SHARED RAYFRONTS SERVER — proof it launched and did not crash
  #    immediately, before any robot's semantic_search goal starts its own
  #    (longer) per-robot wait on /robot_N/rayfronts/status. Grounded in
  #    offboard_compute.sh's own verified behaviour (the encoder socket path
  #    and the two *.pid files it writes), not an assumed log line — the
  #    REAL per-robot readiness gate is RAYFRONTS_WAIT_TIMEOUT_S inside the
  #    semantic_search action itself (raised to 600s above for an 8-robot
  #    cold start).
  - run:
      container: offboard-compute
      cmd: |
        SOCK=/tmp/rayfronts/encoder.sock
        echo "waiting up to 300s for $SOCK"
        for i in $(seq 1 60); do
          [ -S "$SOCK" ] && { echo "ENCODER_SOCKET_UP"; break; }
          sleep 5
        done
        [ -S "$SOCK" ] || echo "WARN: encoder socket not present after 300s (see rayfronts_encoder.log below)"
        for name in rayfronts_encoder rayfronts_mapping; do
          pid_file="/tmp/offboard/$name.pid"
          if [ -f "$pid_file" ] && kill -0 "$(cat "$pid_file")" 2>/dev/null; then
            echo "$name ALIVE pid=$(cat "$pid_file")"
          else
            echo "$name NOT RUNNING — tail of its log:"
            tail -n 60 "/tmp/offboard/$name.log" 2>/dev/null || echo "(no log yet)"
            exit 1
          fi
        done
        echo "--- pin check ---"
        grep -a "pinned: CUDA_VISIBLE_DEVICES" /tmp/offboard/*.log 2>/dev/null \
          || echo "(no pin line — OFFBOARD_COMPUTE_GPU is unset, or this ran before the pin fix)"
        grep -aE "Traceback|Error" /tmp/offboard/rayfronts_encoder.log /tmp/offboard/rayfronts_mapping.log 2>/dev/null \
          | tail -20 || true
      timeout_s: 360

  # 3. THE EXECUTION LAYER IS ALIVE — identical to hurricane_suburban_8robot
  #    .yaml's step 3b (mighty_bridge / tasks/navigate), generic to MIGHTY on
  #    any method. See that file's comment block for the full 2026-08-29
  #    incident this catches (8 drones hovering for 95 minutes while nothing
  #    checked for a live mighty_bridge).
  - run:
      container: airstack-robot-desktop-{n}
      cmd: |
        source /root/.bashrc >/dev/null 2>&1 || true
        export ROBOT_NAME=robot_{n}
        export ROS_DOMAIN_ID={n}
        for i in $(seq 1 36); do
          if ros2 node list 2>/dev/null | grep -qx "/robot_{n}/mighty/mighty_bridge"; then
            echo "BRIDGE_UP robot_{n}"
            grep -ah "mighty_bridge up" /root/.ros/log/mighty_bridge_*.log 2>/dev/null | tail -1
            ros2 action list 2>/dev/null | grep -qx "/robot_{n}/tasks/navigate" \
              && echo "NAVIGATE_ACTION_PRESENT robot_{n}" \
              || echo "WARN: /robot_{n}/tasks/navigate not advertised"
            exit 0
          fi
          sleep 5
        done
        echo "BRIDGE_MISSING robot_{n}: no /robot_{n}/mighty/mighty_bridge after 180 s."
        echo "--- mighty namespace as seen on this domain ---"
        ros2 node list 2>/dev/null | grep "/mighty/" || echo "(no mighty nodes at all)"
        echo "--- bring-up pane, mighty_bridge lines ---"
        tmux capture-pane -p -S -30000 -t bringup:0.0 2>/dev/null \
          | grep -a "mighty_bridge" | tail -60 || echo "(pane history already rolled over)"
        exit 1
      timeout_s: 300

  # 4. THE PERCEPTION CHAIN, before takeoff — identical to
  #    hurricane_suburban_8robot.yaml's step 3c (disparity streaming, cloud
  #    publisher present), generic to any method on this stack. See that
  #    file's comment block for the 2026-08-30 robot_3 incident this catches
  #    and why it probes /perception/stereo_image_proc/disparity rather than
  #    the point cloud itself (the latter is on the dds_router allowlist and
  #    subscribing to it opens an unbounded cross-domain bridge route).
  - run:
      container: airstack-robot-desktop-{n}
      cmd: |
        source /root/.bashrc >/dev/null 2>&1 || true
        export ROBOT_NAME=robot_{n}
        export ROS_DOMAIN_ID={n}
        DISP=/robot_{n}/perception/stereo_image_proc/disparity
        PC=/robot_{n}/perception/stereo_image_proc/point_cloud
        ok_disp=0; npub=0
        for i in $(seq 1 20); do
          if [ "$ok_disp" = "0" ]; then
            timeout 20 ros2 topic hz "$DISP" 2>/dev/null \
              | grep -m1 -q "average rate" && ok_disp=1
          fi
          if [ "$ok_disp" = "1" ]; then
            npub=$(ros2 topic info "$PC" 2>/dev/null \
                   | grep -oE "Publisher count: [0-9]+" | grep -oE "[0-9]+")
            npub=${npub:-0}
            if [ "$npub" -gt 0 ]; then
              echo "PERCEPTION_OK robot_{n}: $DISP streaming, $PC has $npub publisher(s)"
              exit 0
            fi
          fi
          sleep 5
        done
        echo "PERCEPTION_DEAD robot_{n}: disparity=$ok_disp cloud_publishers=$npub"
        echo "--- is the sim publishing to this domain at all ---"
        ros2 topic list 2>/dev/null | grep -c "/robot_{n}/sensors/" || true
        echo "--- perception nodes on this domain ---"
        ros2 node list 2>/dev/null | grep -E "stereo|point_cloud|disparity|global_mapper" \
          || echo "(no perception nodes)"
        echo "--- global_mapper log, PointCloudCallback lines ---"
        grep -ah "PointCloudCallback" /root/.ros/log/global_mapper_node_*.log 2>/dev/null \
          | tail -20 || echo "(the callback never fired — not one line)"
        exit 1
      timeout_s: 420

  # 5. Takeoff — all eight robots in parallel via the GCS relay. 20 m AGL,
  #    matching the other three baselines' takeoff on these exact 9 cells
  #    (their scene overlays fly the 15-40 m AGL band) — NOT the t250 rig's
  #    8.5 m workaround, which existed only because that mission predates the
  #    mighty_bridge follower fix (`follow_min_climb_m` now 1.0 m in
  #    local.launch.xml; ANY reasonable takeoff altitude satisfies the gate).
  - action:
      task: takeoff
      goal: {target_altitude_m: 20.0, velocity_m_s: 2.0}
      timeout_s: 420
      robots: all

  - wait: 5

  # 6. THE SEARCH. ONE action, all 8 robots, each getting its own sector via
  #    goal_per_robot (see this file's header for how those were generated).
  #    The base `goal.search_area` is the CELL'S WHOLE damage-derived polygon
  #    — the fallback only a robot whose index is missing from goal_per_robot
  #    would ever see; every 1-8 index is populated below so it is never
  #    actually used, exactly like raven_shared_t250_2robot.yaml's base goal.
  - action:
      task: semantic_search
      timeout_s: 13800
      cancel_on_timeout: true
      cancel_grace_s: 180
      pass_on_feedback: true
      goal_per_robot: "{{env.goal_per_robot}}"
      goal:
        query: "person"
        # Verbatim from raven_shared_t250_1robot.yaml's final, live-flown
        # vocabulary (11 labels) — NOT re-tuned per cell.
        background_queries: "road, grass, tree, house, wall, debris, sky, car, utility pole, street light, hydrant, crosswalk"
        search_area: "{{env.search_area}}"
        # FLAGGED DEVIATION FROM THE t250 FILE (1.0/25.0 there): these 9
        # cells are real 1 km suburbs with houses and mature trees, not a
        # mostly-open 250 m rig, and the other three baselines already fly
        # this exact 15-40 m AGL band safely on these same 9 cells (their
        # generated scene overlays: min_altitude_agl_m 15.0 / max_altitude_
        # agl_m 40.0). This is judged a frozen-cell FLIGHT-SAFETY concern,
        # not a RAVEN detection-tuning concern, so it is matched here rather
        # than carried over from the smaller test rig. If a live run shows
        # RAVEN's detection-driven descent needs to go lower than 15 m to
        # confirm a lying casualty, that is a real tuning question for the
        # user to weigh against the collision risk, not a default to guess.
        min_altitude_agl: 15.0
        max_altitude_agl: 40.0
        min_flight_speed: 0.5
        max_flight_speed: 1.0
        confidence_threshold: 0.95
        # Verbatim from raven_shared_t250_1robot.yaml — explicitly not
        # re-tuned per cell (see this file's header).
        voxel_score_threshold: 0.75
        score_threshold: 0.85
        voxel_min_cluster_size: 12
        # Same sim-time axis as the other three baselines on these 9 cells
        # (their scene overlays: max_sim_seconds: 600.0) — RAVEN's own
        # scoring is not on one axis with theirs (semantic_search_task owns
        # coverage/recall here, search_planner owns it there), but the SIM
        # time budget lining up is what makes "600 sim-s" comparable prose
        # in any result table, per hurricane_suburban_8robot.yaml's own note.
        max_sim_seconds: 600.0

  # 7. Land is optional: by the time it runs the gating step has already
  #    produced its result, and a failed land must not fail the iteration.
  - action:
      task: land
      goal: {}
      timeout_s: 180
      optional: true
      robots: all

  # 8. Per-robot RAVEN logs — the unfiltered stdout tee
  #    (semantic_search_task's `_spawn(log_name='raven')`) and debug tables,
  #    collected from EACH robot's own container.
  - run:
      container: airstack-robot-desktop-{n}
      cmd: |
        DEST=/root/AirStack/results/raven_suburban_8robot/{{env.RESULTS_SCENE}}/raven/robot_{n}
        mkdir -p "$DEST"
        cp -v /tmp/raven_robot_{n}.log "$DEST"/ 2>/dev/null || true
        cp -v /tmp/rayfronts_robot_{n}.log "$DEST"/ 2>/dev/null || true
        cp -v /tmp/lvlm_robot_{n}.log "$DEST"/ 2>/dev/null || true
        echo "collected robot_{n} logs into $DEST"
      timeout_s: 120
      expect_success: false

  # 9. THE SHARED RESULTS DIR — one copy, not per-robot: `/root/.cache` is
  #    the SAME host directory bind-mounted into every robot replica
  #    (semantic_search_task/node.py's own comment: "Shared bind-mounted
  #    dir... so all robots' raven dumps land where any container can
  #    compile them"), so `<robot>.json` for every one of the 8 robots plus
  #    the compiled/scored files already sit together — one copy from any
  #    one container gets the whole cell's results.
  - run:
      container: robot_1
      cmd: |
        DEST=/root/AirStack/results/raven_suburban_8robot/{{env.RESULTS_SCENE}}/raven
        mkdir -p "$DEST"
        cp -rv /root/.cache/raven_results "$DEST"/ 2>/dev/null || true
        echo "# compiled_results.json"; cat "$DEST"/raven_results/compiled_results.json 2>/dev/null || echo "(missing)"
        echo "# metrics.json"; cat "$DEST"/raven_results/metrics.json 2>/dev/null || echo "(missing)"
        echo "# groundtruth_comparison.json"; cat "$DEST"/raven_results/groundtruth_comparison.json 2>/dev/null || echo "(missing)"
      timeout_s: 180
      expect_success: false

  # 10. Offboard-compute-side logs — the shared server's own record,
  #     including the GPU-pin confirmation line from step 2 and any
  #     OOM-restart supervisor activity (offboard_compute.sh's own
  #     documented `os._exit(99)` + restart loop).
  - run:
      container: offboard-compute
      cmd: |
        DEST=/root/AirStack/results/raven_suburban_8robot/{{env.RESULTS_SCENE}}/raven/offboard-compute
        mkdir -p "$DEST"
        cp -v /tmp/offboard/rayfronts_encoder.log "$DEST"/ 2>/dev/null || true
        cp -v /tmp/offboard/rayfronts_mapping.log "$DEST"/ 2>/dev/null || true
        cp -v /tmp/offboard/vlm_server.log "$DEST"/ 2>/dev/null || true
        echo "# supervisor restarts this iteration"
        grep -ac "mapping server start #" "$DEST"/rayfronts_mapping.log 2>/dev/null || true
      timeout_s: 120
      expect_success: false
