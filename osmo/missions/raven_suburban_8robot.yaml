# raven_suburban_8robot — RAVEN (single-agent RAVEN planner logic + LVLM tier,
# ONE shared off-board RayFronts map server) across the NINE existing frozen
# Suburban cells — Fire/Suburban, Hurricane/Suburban, Tornado/Suburban,
# levels 1-3 each — EIGHT drones per cell. 9 iterations, one arm, one file.
# The other baselines (frontier/lawnmower/vlfm/conavgpt2_team) already have
# their own missions (frozen_suburban_8robot.yaml, hurricane_suburban_8robot
# .yaml); this is RAVEN's turn at the same 9 cells, not a new method matrix.
#
# Built from two existing files: hurricane_suburban_8robot.yaml for the
# 8-robot / frozen-cell mechanics (FROZEN_SCENE resolution, the GT sanity
# check, the mighty_bridge / perception preflight gates, the results-
# collection shape), and raven_shared_t250_1robot.yaml for every RAVEN_*,
# RAYFRONTS_*, VLM and MIGHTY-controller env var — that file's values are
# carried over VERBATIM as this mission's starting hyperparameters (they were
# tuned live against a 250 m test rig, not these cells; re-tuning per-cell is
# explicitly out of scope here, same as every other baseline running one
# fixed hyperparameter set across all 9). Two deliberate exceptions, both
# flagged inline below: the flight altitude band and the takeoff altitude,
# which are FROZEN-CELL mechanics (real house/tree geometry, not RAVEN
# tuning) and are pinned to the values already proven safe on these exact 9
# cells by the other four baselines' own scene overlays, not the 250 m rig's.
#
# ── THE SECTORING QUESTION, ANSWERED ────────────────────────────────────────
#
# hurricane_suburban_8robot.yaml's four arms get an automatic per-robot
# sector at RUNTIME: `search_planner` (search_baselines/planner_node.py)
# reads `search_area_source: 'scene'` + `search_area_scene_key: 'search'`
# from its scene overlay, then calls `sector.sector_for(poly, n, my_index,
# mode='rect', axis='principal')` itself — search_baselines/sector.py, a
# small pure-geometry module private to that package (grep-confirmed absent
# from raven_nav; the CONTAINMENT and PARTITION math is not shared code).
#
# `semantic_search_task` — the SAME action server RAVEN goes through
# (RAYFRONTS_MODE=shared dispatches inside it; grep-verified against
# semantic_search_task/node.py) — does NOT do this. It has no import of
# sector.py, no partition call, nothing that looks at ROS_DOMAIN_ID to slice
# a polygon. It only forwards whatever `goal.search_area` polygon the ACTION
# GOAL already carries (`_publish_search_area`, straight from
# `goal_handle.request.search_area`). Per-robot splitting must therefore be
# HANDED TO IT, exactly like raven_shared_t250_2robot.yaml already does by
# hand for 2 sectors on one 250 m scene via the mission schema's
# `action.goal_per_robot: {robot_index: {field: value}}` (osmo/workspace/
# mission_runner.py:1155 — a plain per-robot dict, deep-merged over the base
# `goal` at SUBMIT time, nothing computed at runtime).
#
# Hand-typing 8 sectors x 9 cells the way the 2-robot file typed 2 sectors x
# 1 cell is not practical, and re-deriving the partition math by hand risks
# disagreeing with what the OTHER four baselines already fly on these same
# cells. So this file's `goal_per_robot` blocks below were generated OFFLINE
# by importing `scene_gen/tools/frozen_cell_plan.py`'s own `plan_cell()` —
# the SAME tool that already produced the FROZEN_SCENE/RESULTS_SCENE/
# SPAWN_CONFIGS values in hurricane_suburban_8robot.yaml and
# frozen_suburban_8robot.yaml — and reading back its `sectors` field, which
# is computed by calling `sector.sector_for(poly, 8, i, mode='rect',
# axis='principal', margin_m=0.0)` per index: the PLANNER'S OWN function, the
# PLANNER'S OWN parameters (confirmed against every one of these 9 cells'
# generated scene overlays — `sector_axis: 'principal'` — and against
# frozen_cell_plan.py's own docstring: "the same call the node makes on the
# same already-padded polygon"). Re-running the 8-cell spawn print
# (`python3 scene_gen/tools/frozen_cell_plan.py --robots 8`) reproduced this
# mission's own SPAWN_CONFIGS numbers exactly, which is the check that the
# sectors below are the SAME sectors the other four arms already fly on these
# cells, not a second, divergent partition.
#
# One consequence of this design: `mission_runner.substitute_env` resolves a
# step string that is EXACTLY one `{{env.KEY}}` placeholder to the raw value
# (osmo/workspace/mission_runner.py:473-491) — including a whole dict — so
# the ONE shared `steps:` list below sets `goal_per_robot: "{{env.goal_per_
# robot}}"` and `search_area: "{{env.search_area}}"`, and each of the 9
# `environments:` entries carries its OWN lowercase `goal_per_robot`/
# `search_area` values. Lowercase keys are never exported as env vars for
# `airstack up` (only UPPERCASE ones are — env_exports() filters on
# `.isupper()`), so these exist purely for this templating and never reach a
# container's shell environment.
#
# ── THE GPU SPLIT, ANSWERED ─────────────────────────────────────────────────
#
# The user's requirement: 2 GPUs, Isaac Sim on one, the off-board models on
# the OTHER. RAVEN's architecture makes this simpler than the existing
# 2-GPU workflow (airstack-mission-2gpu.yaml) assumes: that file's header
# describes a PER-ROBOT picker (`semantic_search_task._pick_rayfronts_gpu()`
# / `_pick_conavgpt_gpu()`, `ROS_DOMAIN_ID % n_gpus`) which its own comment
# says breaks past 1 robot ("a second robot maps 2 % 2 = 0 and drops its
# rayfronts onto Isaac Sim's card") — irrelevant here because RAVEN's
# rayfronts is not per-robot: ONE `multi_robot_mapping_server` (plus,
# optionally, ONE VLM server) runs as a process tree on `offboard-compute`,
# serving all 8 robots, so there is exactly one thing to pin, not eight.
#
# WHAT WAS ALREADY WIRED, AND WHAT WAS NOT (verified by reading
# offboard_compute.sh and robot/docker/docker-compose.yaml, not assumed):
#   - `CONAVGPT2_VLM_GPU`, referenced in hurricane_suburban_8robot.yaml's own
#     comments ("Set this on a multi-GPU pod"), is NOT read anywhere in
#     offboard_compute.sh — grep-confirmed absent. It is a DIFFERENT,
#     unrelated mechanism: osmo/missions/conavgpt2_wildfire_1robot.yaml's own
#     mission STEP exports CUDA_VISIBLE_DEVICES by hand around a VLM server
#     it starts itself, outside offboard_compute.sh entirely. Naming
#     confusion, not a bug in that other mission — but it means the variable
#     named in this mission's own inherited comments does nothing here and
#     must not be relied on.
#   - offboard_compute.sh had NO device-pinning knob at all for the
#     processes it starts (detector/itm/vlm servers via `--device`, defaulted
#     to `cuda:0`; rayfronts' encoder_server/multi_robot_mapping_server, with
#     no device flag whatsoever — always whatever CUDA calls `cuda:0`).
#   - Fixed in THIS branch (robot/docker/docker-compose.yaml +
#     offboard_compute.sh): a new `OFFBOARD_COMPUTE_GPU` env var. Set, it
#     exports `CUDA_VISIBLE_DEVICES` once at the top of offboard_compute.sh,
#     before ANY server starts — every process that script launches is a
#     plain CUDA process (no Kit/Vulkan renderer in this container, unlike
#     isaac-sim, where the identical-looking var is explicitly forbidden —
#     see osmo/workflows/airstack-mission-8robot-2gpu.yaml's header), so
#     masking the whole container to one device is safe and needs no
#     per-server plumbing. Verified with a new host-side test,
#     `robot/ros_ws/src/global/planners/search_baselines/scripts/
#     test_offboard_compute_gpu_pin.sh` (fakes python3/nvidia-smi; asserts
#     CUDA_VISIBLE_DEVICES=1 reaches a launched server when set, and is
#     COMPLETELY ABSENT — not empty-string, which CUDA reads as "no
#     devices" — when unset). Unset (every existing mission) changes nothing.
#   - Isaac Sim's own pin is INTENTIONALLY left alone here — see
#     airstack-mission-8robot-2gpu.yaml's header for why ISAAC_SIM_CUDA_
#     DEVICES is the wrong, and now actively dangerous, tool for this job.
#
# ── SUBMIT ───────────────────────────────────────────────────────────────
#
#   airstack osmo:mission osmo/missions/raven_suburban_8robot.yaml \
#     --pool coasei --branch krrishj/disaster-dataset \
#     --workflow osmo/workflows/airstack-mission-8robot-2gpu.yaml
#
# NOT SUBMITTED BY THIS CHANGE. Building and pushing only — the user starts
# it. To fly one cell first (strongly recommended before committing to all
# 9), cut `environments:` down to one entry and set `iterations: 1`.
#
# Schema: osmo/missions/README.md. Frozen-cell mechanics + the method matrix:
# .agents/skills/benchmark-disaster-dataset/SKILL.md,
# .agents/skills/run-osmo-baseline-mission/SKILL.md. RAVEN stack + monitoring:
# .agents/skills/run-raven-single-shared/SKILL.md.

name: raven_suburban_8robot
# /volume2/coa-sei_raven never existed on the NAS -- same nonexistent-base bug
# found and fixed in hurricane_suburban_8robot.yaml on 2026-09-03. Every prior
# mission's results landed at /volume2/coa-sei/<mission_name>/, which is what
# the upload rsyncs `osmo/results/` into.
nas_dest: /volume2/coa-sei

stack:
  services: [isaac-sim, robot-desktop, gcs, offboard-compute]

env:
  # ── the fleet and the sim (frozen-cell mechanics — see
  #    hurricane_suburban_8robot.yaml for the full rationale on every line in
  #    this sub-block; unchanged here) ──────────────────────────────────────
  NUM_ROBOTS: 8
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_MULTIGPU: ""
  GCS_VIZ_DECIMATE: "2"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  SCENE_CONFIG: ""
  FROZEN_DATASET_ROOT: "omniverse://airlab-nucleus.andrew.cmu.edu:443/Projects/SEI-COA/final_disaster_dataset"
  SUBURB_COLLIDERS: "ground"
  # 0.5, matching the OTHER three missions that already fly these 9 cells
  # (frozen_suburban_8robot.yaml, hurricane_suburban_8robot.yaml) — NOT the
  # 1.0 raven_shared_t250_*.yaml used, which was tuned for that scene's own
  # geometry. DRONE_Z_M is grep-verified inert everywhere but the modular-
  # house preview script; kept equal so nobody "fixes" a disagreement that
  # does not exist (same reasoning the t250 files already document).
  SPAWN_HEIGHT_M: "0.5"
  DRONE_Z_M: "0.5"
  ENABLE_LIDAR: "true"   # mighty maps from the Ouster — 360-degree avoidance; RAVEN needs this, not the forward stereo cone
  MIGHTY_CLOUD_SUFFIX: "sensors/ouster/point_cloud"
  MIGHTY_CLOUD_FRAME: "ouster"
  MAP_ANCHOR_ENU: "true"
  AIRSTACK_STACK: "full_mighty"
  LOCAL_PLANNER: "mighty"
  CONAVGPT_BASELINE: "false"
  FRONTIER_ONLY_BASELINE: "false"
  VLFM_BASELINE: "false"
  LVLM_BASELINE: "false"
  COMMS_RANGE_M: 5000
  GT_ANNOTATIONS: "on"

  # ── the GPU split ────────────────────────────────────────────────────────
  # Pins detector/itm/vlm (if started) + rayfronts' encoder_server and
  # multi_robot_mapping_server to GPU 1, leaving GPU 0 to Isaac Sim
  # (unpinned — see this mission's header and the workflow file's header for
  # why Isaac is deliberately NOT pinned the same way). Requires
  # osmo/workflows/airstack-mission-8robot-2gpu.yaml (gpu: 2); on a 1-GPU
  # workflow this would mask the container down to a device that does not
  # exist there, so do not carry this value onto a 1-GPU submission.
  OFFBOARD_COMPUTE_GPU: "1"

  # ── RAYFRONTS_MODE=shared (verbatim from raven_shared_t250_1robot.yaml,
  #    the proven live-flown config; NUM_ROBOTS/RAYFRONTS_ROBOT_IDS updated
  #    for 8) ────────────────────────────────────────────────────────────
  RAYFRONTS_MODE: shared
  START_RAYFRONTS_SERVER: "true"
  START_DETECTOR_SERVER: "false"
  START_ITM_SERVER: "false"
  RAYFRONTS_CONFIG: shared_humans
  RAYFRONTS_ROBOT_IDS: "1,2,3,4,5,6,7,8"
  RAYFRONTS_COMPUTE_PROB: "True"
  # Raised from the shipped default (180s): eight robots' first frames all
  # queue behind ONE shared encoder_server's cold start (RADSeg weights,
  # cache-warmed per the run-raven-single-shared runbook's prerequisite #0),
  # where the 250 m 1-2 robot tests only ever waited on one or two.
  RAYFRONTS_WAIT_TIMEOUT_S: "600"

  VLM_URL: http://offboard-compute:8000/v1
  # LVLM tier OFF, matching the last live-flown config (memory: "LVLM tier
  # never live — VLM off for VRAM"). The 2-GPU split above removes the
  # ORIGINAL reason (offboard-compute now has a card to itself, not a sliver
  # of Isaac's) — but turning it on for the first time across an unattended
  # 9-cell sweep is a scope decision for the user, not a silent upgrade
  # bundled into this build. Flip both to enable it; OFFBOARD_COMPUTE_GPU
  # above already covers the VLM server if you do.
  RAVEN_LVLM: "false"
  START_VLM_SERVER: "false"
  CONAVGPT2_VLM_MODEL: Qwen/Qwen2.5-VL-3B-Instruct
  CONAVGPT2_VLM_QUANT: nf4

  # ── MIGHTY controller tuning (verbatim from raven_shared_t250_1robot.yaml)
  MIGHTY_V_MAX: "1.0"
  MIGHTY_A_MAX: "0.2"
  MIGHTY_J_MAX: "1.0"
  MIGHTY_OVERRIDE_PERIOD_S: "0.2"
  MIGHTY_SEGMENT_STRIDE: "2"
  MIGHTY_NATIVE_SETPOINTS: "1"
  PID_POS_FF: "1.0"
  PID_VEL_FF: "0.102"
  PID_VZ_FF: "0.0"

  # ── RAVEN detection tuning (verbatim from raven_shared_t250_1robot.yaml —
  #    explicitly NOT re-tuned per cell, same as every other baseline running
  #    one fixed hyperparameter set across all 9) ─────────────────────────
  RAVEN_VOX_SIZE_M: "0.3"
  RAVEN_VOXEL_MAX_EXTENT_M: "3.0"
  RAYFRONTS_HOLD_TIMEOUT_S: "0"
  RAYFRONTS_RESUME_VOX: "300"
  RAVEN_COVERAGE_RESTART: "1"
  RAVEN_FRONTIER_EXCLUDE_OBSERVED: "1"
  RAVEN_FRONTIER_NOVELTY_W: "100.0"
  RAVEN_FRONTIER_VISITED_W: "30.0"
  RAVEN_FRONTIER_VISITED_SCALE_M: "15.0"
  RAVEN_FRONTIER_MAX_DZ_M: "2.0"
  ZED_WIDTH: "960"
  ZED_HEIGHT: "600"
  # 0, not .env's 30: RayFronts' dataset config takes pose straight off
  # odometry with no mount-tilt correction (grep-verified absent from
  # raven_nav / semantic_search_task / common/rayfronts_configs) — left at
  # 30 every voxel unprojects 30 deg off. See raven_shared_t250_1robot.yaml's
  # own comment for the full derivation; this is a correctness requirement
  # for RAVEN, not a style choice, so it does NOT match the other three
  # baselines' 30 on these same cells.
  ZED_PITCH_DEG: "0"

# ── the 9 iterations: 9 cells x 1 arm (RAVEN), cell-major ─────────────────
# round_robin with iterations == len(environments) runs each cell exactly
# once, in this order.
environment_order: round_robin
iterations: 9
