# Example mission: takeoff → hover 30s → land, 3 times, Isaac Sim headless.
#
# Run on OSMO:
#   airstack osmo:mission osmo/missions/example_takeoff_land.yaml --pool <gpu-pool>
#
# Or locally against a machine that can run `airstack up` (no OSMO needed):
#   python3 osmo/workspace/mission_runner.py osmo/missions/example_takeoff_land.yaml \
#     --airstack-root "$(pwd)"
#
# Schema reference: osmo/missions/README.md

name: example_takeoff_land

# Optional: upload results to airlab-storage, then auto-teardown once the
# upload succeeds (needs the airlab-storage OSMO credential — see
# `airstack osmo:setup`). Override the path with osmo:mission --nas-dest,
# or suppress with --no-nas-upload.
# nas_dest: /volume<X>/<share>/airstack-missions

# How to bring the stack up. `services` are passed straight through:
#   ./airstack.sh up isaac-sim robot-desktop gcs
# (docker compose auto-enables a named service's profile, so no
# COMPOSE_PROFILES needed). On OSMO swap isaac-sim → isaac-sim-livestream to
# watch the run over WebRTC. Alternatively use `profiles:` to export
# COMPOSE_PROFILES and run a plain `airstack up`.
stack:
  services: [isaac-sim-livestream, robot-desktop, gcs]
  # profiles: [desktop, isaac-sim]

# Exported before every `airstack up`. Anything the compose stack reads from
# the environment can go here (.env values, ISAAC_SIM_SCRIPT_NAME, etc.).
env:
  NUM_ROBOTS: 1
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  # The default script only spawns one drone; for NUM_ROBOTS > 1 switch to
  # example_multi_px4_pegasus_launch_script.py.
  ISAAC_SIM_SCRIPT_NAME: example_one_px4_pegasus_launch_script.py
  # Missions are unattended — the sim must start playing without a GUI click.
  PLAY_SIM_ON_START: "true"

# Where `action` steps are sent by default:
#   gcs   — through the GCS action_relay, the same String-JSON → typed-goal
#           path Foxglove and the GCS panels use (exercises the full
#           GCS→robot chain, including the relay's airborne preconditions)
#   robot — `ros2 action send_goal` directly on the robot's DDS domain
# Override per step with `via:`.
command_route: gcs

# Full up → fly → collect → down cycles.
iterations: 3

# Gate before any steps run: per robot, MAVROS connected, then
# local_position/odom publishing (PX4 EKF converged = ready to arm).
ready:
  timeout_s: 600

# One mcap per iteration with ALL robots' data, recorded on the GCS
# (domain 0) where each robot's domain_bridge forwards its state topics —
# replaying the .mcap in Foxglove reproduces the live GCS view.
# {robot} expands to robot_1..robot_N and the list is unioned.
record:
  enabled: true
  scope: gcs               # or `robot`: one mcap per robot on its own
                           # domain, for topics not bridged to the GCS
  topics:
    - /tf
    - /tf_static
    - /{robot}/odometry_conversion/odometry
    - /{robot}/interface/mavros/global_position/global
    - /{robot}/trajectory_controller/trajectory_vis
    - /{robot}/global_plan
    - /gcs/robot_markers
    - /gcs/map_origin/location
    - /gcs/map_origin/ground_msl
    - /gcs/{robot}/location
  # Or record everything visible on the recording domain (large):
  # all: true

# continue | abort_iteration (default) | abort_mission
on_step_failure: abort_iteration

# Steps run top to bottom. Every step that addresses a robot fans out over a
# robot selection — `robots:` (default `all` = robots 1..NUM_ROBOTS, or a
# list like [1, 3]) — and {robot} → robot_N / {n} → N expand per robot.
# Per-step knobs (all optional, shown here with their defaults):
#   action: robots=all  via=<command_route>  timeout_s=120 (per attempt)
#           attempts=3 retry_delay_s=10 (per-robot retries on failure)
#           via: gcs (through the GCS action_relay) | robot (direct send_goal)
#   run:    robots=all  container=robot_{n} (per-robot) or robot_1 | gcs | pod |
#           <name>;  fans out when cmd/container references {robot}/{n}
#   wait:   <seconds>   (runs once)
steps:
  - action:
      task: takeoff                      # → /<robot>/tasks/takeoff (TakeoffTask)
      goal: {target_altitude_m: 10.0, velocity_m_s: 1.0}
      #to specify robot(s)   
      #robots: [1]   (1st robot)
      #robots: [1, 3]   (1st and 3rd robot)
      #robots: all   (all robots)

  - wait: 30                             # hover

  - run:                                 # arbitrary command, that runs per robot
      cmd: ros2 topic echo --once /{robot}/odometry_conversion/odometry
      timeout_s: 20
      #to specify robot(s):   
      #robots: [1]   (1st robot)
      #robots: [1, 3]   (1st and 3rd robot)

      #To specify the container:
      #container: gcs   (GCS container)
      #container: <container name> 

  - action:
      task: land                         # → /<robot>/tasks/land (LandTask)
      goal: {velocity_m_s: 0.5}
