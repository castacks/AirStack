# Independent reproducibility repeats of the three highest-scoring completed 30 m RAVEN starts.
# Scores: AbandonedFactory s3 6/7; FireAcademy s3 8/10; ConstructionSite s1 5/7.
# Third-place tie resolved alphabetically by scene/start (other ties: ConstructionSite s2, ModernCityDowntown s3).
# Copy original trial configurations exactly, including all four spawn positions and orientations.
# Retain original and repeated scores separately; do not select the better result.
name: simtime300_4robot_comms30_top3_validation_20260921
nas_dest: /volume4/dsta/raven-simtime300/
stack:
  services:
  - isaac-sim
  - robot-desktop
  - gcs
env:
  NUM_ROBOTS: 4
  RAYFRONTS_COMPUTE_PROB: 'True'
  ISAAC_SIM_HEADLESS: 'true'
  ISAAC_SIM_USE_STANDALONE: 'true'
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: 'true'
  FRONTIER_ONLY_BASELINE: 'false'
  VLFM_BASELINE: 'false'
  LVLM_BASELINE: 'false'
  CONAVGPT_BASELINE: 'false'
