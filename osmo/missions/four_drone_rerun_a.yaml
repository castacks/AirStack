# four_drone_rerun_a — 4-robot full comms: the runs that produced no data,
# plus a requested re-fly of RAVEN-multi on DowntownWest and FireAcademy.
#
# 22 runs, raven-multi + frontier, 5 of them re-flies. Same scenes, spawns, queries, thresholds and
# search areas as four_drone_sweep_a; this file only narrows the list.
#
# WHY THE FAILED ONES FAILED
#
# 31 of the 35 were not a mission fault. In both halves of the sweep every
# iteration past ~33 died with `robots [1,2,3,4] not ready within 900s
# (connected so far: [])` — no robot connected at all. The dds_router leaked
# across iterations (RSS ~130 MB at iteration 1, ~870 MB by 30, dead from 34
# on) and never recovered, so whatever was scheduled late failed regardless of
# scene. The bridged rayfronts voxel clouds were the traffic doing it; they are
# no longer routed (onboard_all/config/dds_router.yaml) and are recorded per
# robot instead. This file is also short enough to finish well inside where the
# leak used to bite.
#
# The other 4 were a real spawn fault: downtownwest_s3's 4th drone sat inside a
# parked car's footprint and timed out on takeoff for all four methods. It has
# been moved to (-123.70, 1.10), 8.55 m clear of the nearest annotated object.
#
# EXTRACTING THE RE-FLIES
#
# The RAVEN-multi DowntownWest/FireAcademy entries replace runs that already
# have a cached JSON, and extract_mission.sh skips a run whose .json exists.
# Extract these into a fresh directory, or pass FORCE=1 to overwrite.
#
# PRECONDITIONS
#
# 1. Full comms — coordination_bringup/comms_model.py COMMS_RANGE_M = 5000
#    (it reads 30.0 after a degraded-comms sweep).
# 2. gpu: 4 is correct. robot_4 shares GPU 0 with Isaac Sim via
#    _pick_rayfronts_gpu's ROS_DOMAIN_ID % n_gpus; the last sweep ran that way
#    with no CUDA OOM (582 rayfronts batches on robot_4).
#
#   airstack osmo:mission osmo/missions/four_drone_rerun_a.yaml --pool <gpu-pool>

name: four_drone_rerun_a

nas_dest: /volume4/dsta/raven-4robot-rerun/

stack:
  services: [isaac-sim, robot-desktop, gcs]

env:
  # The one substantive change from the 3-robot sweep. mission_runner reads this
  # to size the stack and to expand the {robot} placeholders in `record.topics`,
  # and the Isaac spawn script takes the fleet from SPAWN_CONFIGS, so both ends
  # agree at two.
  NUM_ROBOTS: 4
  # voxel_score_threshold below is a SOFTMAX PROBABILITY. Stated explicitly
  # because mission_runner.apply_env only ever SETS env vars: a run after
  # raven_ablation (which uses False) would otherwise inherit raw cosines,
  # which top out near 0.16, and a 0.50 gate would reject every voxel.
  RAYFRONTS_COMPUTE_PROB: "True"
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  # Methods are selected per environment entry below; these are the defaults
  # each entry then overrides.
  FRONTIER_ONLY_BASELINE: "false"
  VLFM_BASELINE: "false"
  LVLM_BASELINE: "false"

# ── method anchors ─────────────────────────────────────────────────────────
baseline_templates:

  frontier: &frontier
    FRONTIER_ONLY_BASELINE: "true"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: frontier

  vlfm: &vlfm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "true"
    LVLM_BASELINE: "false"
    method: vlfm

  lvlm: &lvlm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "true"
    method: lvlm

  # No flag set -> the default full-coordination raven stack.
  multiraven: &multiraven
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: multi-raven

