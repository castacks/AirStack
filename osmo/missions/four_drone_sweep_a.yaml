environment_order: grouped
iterations: 1

iteration_attempts: 3

ready:
  timeout_s: 900

# Superset of the three per-baseline record blocks. The lvlm iterations simply
# produce no payload / rayfronts_debug topics; `ros2 bag record` waits on names
# that never appear rather than failing, and record.required only trips if the
# recorder process itself won't start.
record:
  enabled: true
  # both: the fleet view on the GCS domain (as before) PLUS one mcap per robot
  # on its own domain. The rayfronts voxel clouds moved to the per-robot
  # recorder because they are no longer bridged — see robot_topics below.
  scope: both
  required: true
  topics:
    - /tf
    - /tf_static
    - /{robot}/odometry_conversion/odometry
    - /gcs/robot_markers
    - /gcs/payload/{robot}/filtered_rays
    - /gcs/payload/{robot}/filtered_frontiers
    - /gcs/payload/{robot}/explored_area_coverage
    - /gcs/payload/{robot}/confirmed_targets
    - /gcs/payload/{robot}/auction_table
    - /gcs/sim_ground
    - /gcs/annotations/bboxes

  # Recorded on each robot's OWN domain, never crossing the DDS router. Two
  # different clouds, both visualisation-only:
  #   voxel_rgb            x,y,z,rgb — the coloured 3D map, one topic per robot
  #   voxels_sim/all       x,y,z + sim_0..N — per-query similarity scores, a
  #                        different cloud entirely, not a coloured map
  # rayfronts also advertises voxels_sim/q{q}_{label} per registered query (48
  # on a typical mission); those are NOT recorded — they were only crossing DDS
  # because the router's allowlist wildcard made it a subscriber. At ~10 MB a
  # cloud that traffic grew the router's RSS from ~130 MB to ~870 MB over a
  # sweep until it died. Local frame (FLU / RDF), not the ENU republish
  # gcs_visualizer used to produce.
  robot_topics:
    - /robot_{n}/rayfronts/voxel_rgb
    - /robot_{n}/rayfronts/msg_serv/voxels_sim/all

on_step_failure: abort_iteration

steps:
  # Both model pre-downloads run every iteration: RADIO is what rayfronts needs
  # (frontier + vlfm), InternVL3 is what the lvlm node needs. Both land in the
  # persistent /root/.cache shared across replicas, so after the first iteration
  # each is a cache hit and costs seconds.
  - run:
      container: robot_1
      cmd: python3 -c "import torch; torch.hub.load('NVlabs/RADIO', 'radio_model', version='c-radio_v3-b', skip_validation=True, adaptor_names=['siglip2','sam'])"
      timeout_s: 900
      attempts: 5
      retry_delay_s: 15

  - run:
      container: robot_1
      cmd: python3 -c "from huggingface_hub import snapshot_download; snapshot_download('OpenGVLab/InternVL3-2B')"
      timeout_s: 900
      attempts: 5
      retry_delay_s: 15

  - action:
      task: takeoff
      goal: {target_altitude_m: 12.0, velocity_m_s: 1.0}
      timeout_s: 180

  - wait: 5

  # 15-minute budget, same as the original sweep so the numbers stay comparable.
  # min_altitude_agl is 10.0 in lvlm_baseline.yaml and 5.0 in the other three;
  # 5.0 is used here because raven's altitude band is the one that matters for
  # frontier/vlfm and the lvlm node clamps its own waypoints anyway.
  - action:
      task: semantic_search
      # Wall-clock safety net only — the search now ends itself on the sim-time
      # budget below. Sized from the worst observed 4-robot sim/wall ratio
      # (0.236): 900 s would yield just 212 sim s and would bind before the
      # 300 s budget was ever reached.
      timeout_s: 1500
      cancel_on_timeout: true
      pass_on_feedback: true
      goal:
        query: "{{env.query}}"
        background_queries: "{{env.background_queries}}"
        search_area: "{{env.search_area}}"
        min_altitude_agl: 5.0
        max_altitude_agl: 20.0
        min_flight_speed: 0.5
        max_flight_speed: 1.0
        confidence_threshold: 0.95
        voxel_score_threshold: "{{env.voxel_score_threshold}}"
        score_threshold: "{{env.score_threshold}}"
        voxel_min_cluster_size: "{{env.voxel_min_cluster_size}}"
        bundle_len: 3
        # Simulated-time budget: semantic_search_task ends the search when the
        # SIM clock has advanced this far, so every fleet size gets the same
        # simulated search regardless of Isaac Sim's real-time factor (~0.46 at
        # 2 robots, ~0.34 at 3, ~0.27 at 4). timeout_s above stays a wall-clock
        # safety net and must remain comfortably larger than the wall equivalent.
        max_sim_seconds: 300
