# four_drone_sweep_a — 4-robot benchmark, multiraven + frontier.
#
# The fleet-size study's fourth point. Same 8 scenes x 3 starts, same queries,
# thresholds, search areas and full-comms radio as the 2- and 3-robot sweeps;
# the only change is a fourth drone.
#
#   8 scenes x 3 starts = 24 environments x 2 methods = 48 runs
#
# SPAWNS ARE NESTED. Robots 1-3 keep the exact positions and orientations the
# 2- and 3-robot sweeps flew, so fleet size stays the only difference across all
# three fleet sizes. Only the 4th entry is new: it sits at the point of the
# scene's spawn rectangle furthest from the other three (>= 3 m from each, inside
# the search polygon), heading continuing the layout's fan.
#
# Two environments are placed differently. constructionsite_s3 and shipyard_s2
# have spawn rectangles 119 m and 206 m from the drones that actually fly them —
# those two were relocated on 2026-08-07 after failing bring-up 28 consecutive
# times, and the rectangles were not updated. Putting the 4th drone in the
# rectangle would strand it a scene away from its fleet, so there it extends the
# line the current three form, at their own spacing.
#
# PRECONDITIONS
#
# 1. Full comms. The radio range is a module constant, not a mission key:
#      coordination_bringup/comms_model.py  COMMS_RANGE_M = 5000
#    It currently reads 30.0 from the degraded-comms sweep.
#
# 2. GPUs. The standard workflow's `gpu: 4` is correct for this mission — do NOT
#    raise it. semantic_search_task._pick_rayfronts_gpu pins robot N to
#    ROS_DOMAIN_ID % n_gpus, so at 4 GPUs the mapping is robot_1->1, robot_2->2,
#    robot_3->3, robot_4->0. Robot 4 shares GPU 0 with Isaac Sim, which keeps one
#    rayfronts per card instead of doubling two onto GPU 1.
#
#    That pairing is what failed at gpu: 3, where the robot sharing the sim's
#    card lost its rayfronts to a CUDA OOM and hovered for the whole mission.
#    Check rayfronts_robot_4.log on the first iteration: if it OOMs, the fleet
#    needs a fifth GPU rather than a different pairing.
#
#   airstack osmo:mission osmo/missions/four_drone_sweep_a.yaml --pool <gpu-pool>

name: four_drone_sweep_a

nas_dest: /volume4/dsta/raven-4robot/

stack:
  services: [isaac-sim, robot-desktop, gcs]

env:
  # The one substantive change from the 3-robot sweep. mission_runner reads this
  # to size the stack and to expand the {robot} placeholders in `record.topics`,
  # and the Isaac spawn script takes the fleet from SPAWN_CONFIGS, so both ends
  # agree at two.
  NUM_ROBOTS: 4
  # voxel_score_threshold below is a SOFTMAX PROBABILITY. Stated explicitly
  # because mission_runner.apply_env only ever SETS env vars: a run after
  # raven_ablation (which uses False) would otherwise inherit raw cosines,
  # which top out near 0.16, and a 0.50 gate would reject every voxel.
  RAYFRONTS_COMPUTE_PROB: "True"
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  # Methods are selected per environment entry below; these are the defaults
  # each entry then overrides.
  FRONTIER_ONLY_BASELINE: "false"
  VLFM_BASELINE: "false"
  LVLM_BASELINE: "false"

# ── method anchors ─────────────────────────────────────────────────────────
baseline_templates:

  frontier: &frontier
    FRONTIER_ONLY_BASELINE: "true"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: frontier

  vlfm: &vlfm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "true"
    LVLM_BASELINE: "false"
    method: vlfm

  lvlm: &lvlm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "true"
    method: lvlm

  # No flag set -> the default full-coordination raven stack.
  multiraven: &multiraven
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: multi-raven

