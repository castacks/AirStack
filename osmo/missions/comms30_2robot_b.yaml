# comms30_2robot_b — degraded comms (R = 30 m), 2 robots, vlfm + lvlm.
#
# Same scenes, starts, queries, thresholds and search areas as the full-comms
# benchmark; the ONLY difference is the radio. comms_model.py is pinned to
# COMMS_RANGE_M = 30.0 with MAX_RELAY_HOPS = NUM_ROBOTS, so a peer is heard only
# within 30 m (Euclidean, altitude included) and messages relay at most once per
# robot. The earlier runs used 5000 m, i.e. effectively unlimited.
#
# Split two methods per file so four jobs can run concurrently. Results land
# under a SEPARATE nas_dest (/volume4/dsta/raven-comms30/) so degraded-comms runs are never
# mixed with the full-comms benchmark.
#
#   8 scenes x 3 starts = 24 environments x 2 methods = 48 runs
#
#   airstack osmo:mission osmo/missions/comms30_2robot_b.yaml --pool <gpu-pool>

name: comms30_2robot_b

nas_dest: /volume4/dsta/raven-comms30/

stack:
  services: [isaac-sim, robot-desktop, gcs]

env:
  # The one substantive change from the 3-robot sweep. mission_runner reads this
  # to size the stack and to expand the {robot} placeholders in `record.topics`,
  # and the Isaac spawn script takes the fleet from SPAWN_CONFIGS, so both ends
  # agree at two.
  NUM_ROBOTS: 2
  # voxel_score_threshold below is a SOFTMAX PROBABILITY. Stated explicitly
  # because mission_runner.apply_env only ever SETS env vars: a run after
  # raven_ablation (which uses False) would otherwise inherit raw cosines,
  # which top out near 0.16, and a 0.50 gate would reject every voxel.
  RAYFRONTS_COMPUTE_PROB: "True"
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  # Methods are selected per environment entry below; these are the defaults
  # each entry then overrides.
  FRONTIER_ONLY_BASELINE: "false"
  VLFM_BASELINE: "false"
  LVLM_BASELINE: "false"

# ── method anchors ─────────────────────────────────────────────────────────
baseline_templates:

  frontier: &frontier
    FRONTIER_ONLY_BASELINE: "true"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: frontier

  vlfm: &vlfm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "true"
    LVLM_BASELINE: "false"
    method: vlfm

  lvlm: &lvlm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "true"
    method: lvlm

  # No flag set -> the default full-coordination raven stack.
  multiraven: &multiraven
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: multi-raven

