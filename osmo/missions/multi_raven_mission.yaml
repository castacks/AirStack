# multi_raven_mission — 3-robot FULL raven coordination semantic search, cycled
# across four scenes (RetroNeighborhood, FireAcademy, ConstructionSite,
# AbandonedFactory).
#
# Full raven coordination (the default): semantic navigation, ray/voxel
# behaviors, target bidding. frontier_exploration is the frontier-only baseline
# variant of this.
#
# Run on OSMO (3 GPU / 24 CPU / 96Gi / 500Gi):
#   airstack osmo:mission osmo/missions/multi_raven_mission.yaml --pool <gpu-pool>
#
# Or locally:
#   python3 osmo/workspace/mission_runner.py osmo/missions/multi_raven_mission.yaml \
#     --airstack-root "$(pwd)"
#
# Schema reference: osmo/missions/README.md
name: multi_raven_mission

stack:
  services: [isaac-sim, robot-desktop, gcs]

env:
  NUM_ROBOTS: 3
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"

# Environments cycled across iterations. UPPERCASE keys (ENV_URL, SPAWN_POLY)
# are exported as env vars before `airstack up`; lowercase keys (search_area,
# query) are templated into the steps via {{env.<key>}}.
environments:
  - name: retroneighborhood
    ENV_URL: "Library/Stages/RetroNeighborhood/RetroNeighborhood.stage.usd"
    SPAWN_POLY: "[[11, 6.5], [-13, -6.5]]"
    # GT annotation file (annotations/<RESULTS_SCENE>.json) for finalize scoring.
    RESULTS_SCENE: "RetroNeighborhood"
    query: "house"
    background_queries: "road, grass, mountain, parking lot, tree, fence, billboard, electrical cables, container, utility pole, car garage, street light"
    search_area:
      points:
        - {x: -150.0, y: -110.0, z: 0.0}
        - {x: -150.0, y: 70.0, z: 0.0}
        - {x: 170.0, y: 70.0, z: 0.0}
        - {x: 170.0, y: -110.0, z: 0.0}

  - name: fireacademy
    ENV_URL: "Projects/AirStack/scenes/urban/allegheny_county_fire_academy/fire_academy.scene.usd"
    SPAWN_POLY: "[[27.5, 3.8], [23.8, 14.4], [26.1, 17.5], [30, 11.8]]"
    RESULTS_SCENE: "FireAcademy"
    query: "red walled building, water tower, radio tower, shipping container, gas tank"
    background_queries: "road, grass, mountain, parking lot, tree, utility pole, flood light"
    search_area:
      points:
        - {x: 13.0, y: -135.0, z: 0.0}
        - {x: 135.0, y: -13.0, z: 0.0}
        - {x: 13.0, y: 135.0, z: 0.0}
        - {x: -135.0, y: 13.0, z: 0.0}

  - name: constructionsite
    ENV_URL: "Library/Stages/ConstructionSite/ConstructionSite.stage.usd"
    SPAWN_POLY: "[[27.63, 2], [21, -5.8]]"
    RESULTS_SCENE: "ConstructionSite"
    query: "Forklift, Towercrane, red shipping container"
    background_queries: "road, grass, mountain, parking lot, building, scaffolding, fence, cement"
    search_area:
      points:
        - {x: 76.0, y: 50.0, z: 0.0}
        - {x: 76.0, y: -71.0, z: 0.0}
        - {x: -37.0, y: -67.0, z: 0.0}
        - {x: -40.0, y: 50.0, z: 0.0}

  - name: abandonedfactory
    ENV_URL: "Library/Stages/AbandonedFactory/AbandonedFactory.stage.usd"
    SPAWN_POLY: "[[16.5, -1.2], [22, 9.6]]"
    STAGE_SCALE: "1.0"
    SPAWN_HEIGHT_M: "1.0"
    RESULTS_SCENE: "AbandonedFactory"
    query: "building, water tower"
    background_queries: "ground, grass, road, tree, pipes"
    search_area:
      points:
        - {x: 45.0, y: 102.0, z: 0.0}
        - {x: 45.0, y: -97.0, z: 0.0}
        - {x: -109.0, y: -97.0, z: 0.0}
        - {x: -109.0, y: 102.0, z: 0.0}

# Send goals through the GCS action_relay — the exact path Foxglove uses.
command_route: gcs

# grouped: each environment runs `iterations` times in a row (per-environment
# count; total runs = iterations * 4). Spawn layout re-randomizes each run.
environment_order: grouped
iterations: 1

# Redo an iteration (clean down→up→fly→down) if a step up to and including
# semantic_search fails — i.e. the precondition steps fail, or semantic_search
# never gets feedback after its own retries. Up to 3 attempts per iteration.
iteration_attempts: 3

ready:
  timeout_s: 600

record:
  enabled: true
  scope: gcs
  required: true
  topics:
    - /tf
    - /tf_static
    - /{robot}/odometry_conversion/odometry
    - /gcs/robot_markers
    - /gcs/payload/{robot}/filtered_rays
    - /gcs/payload/{robot}/filtered_frontiers
    - /gcs/payload/{robot}/explored_area_coverage
    - /gcs/payload/{robot}/confirmed_targets
    - /gcs/payload/{robot}/auction_table
    - /gcs/payload/{robot}/voxel_rgb
    - /gcs/consensus_AABBs
    - /gcs/consensus_targets
    - /gcs/sim_ground
    - /gcs/annotations/bboxes

on_step_failure: abort_iteration

steps:
  - run:
      container: robot_1
      cmd: python3 -c "import torch; torch.hub.load('NVlabs/RADIO', 'radio_model', version='c-radio_v3-b', skip_validation=True, adaptor_names=['siglip2','sam'])"
      timeout_s: 900
      attempts: 5
      retry_delay_s: 15

  - action:
      task: takeoff
      goal: {target_altitude_m: 12.0, velocity_m_s: 1.0}
      timeout_s: 180

  - wait: 5

  # Run budget = 15 min OR 80% explored, whichever first (cancel_on_timeout lets
  # semantic_search_task run its compile + metrics finalize on the deadline).
  # pass_on_feedback: the iteration only needs the search to RUN — pass as soon
  # as feedback is seen, regardless of outcome; redo the iteration only if no
  # feedback arrives after the retries.
  - action:
      task: semantic_search
      timeout_s: 900
      cancel_on_timeout: true
      pass_on_feedback: true
      goal:
        query: "{{env.query}}"
        background_queries: "{{env.background_queries}}"
        search_area: "{{env.search_area}}"
        min_altitude_agl: 10.0
        max_altitude_agl: 50.0
        min_flight_speed: 0.5
        max_flight_speed: 1.0
        confidence_threshold: 0.95

