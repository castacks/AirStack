    ENV_URL: "Library/Stages/Dmytro/downtown_edited_v3_818.usd"
    STAGE_SCALE: "1.0"
    SPAWN_HEIGHT_M: "0.2"
    RESULTS_SCENE: "DowntownWest"
    query: "fountain, car, truck"
    voxel_score_threshold: 0.5
    score_threshold: -1
    voxel_min_cluster_size: 50
    background_queries: "concrete, pavement, sidewalk, dirt, gravel, sand, soil, grass, mountain, hill, water, pond, rubble, tree, shrub, hedge, forest, tree canopy, building, building facade, wall, roof, window, door, warehouse, house, garage, shed, hangar, fence, railing, stairs, parking lot, runway, utility pole, electrical pole, power line, street lamp, street light, traffic signal, sign, mast, ground"
    search_area:
