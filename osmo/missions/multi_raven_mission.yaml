# multi_raven_mission — 3-robot FULL raven coordination semantic search across
# all 8 scenes x 3 fixed start locations each (24 runs).
#
# Full raven coordination (the default): semantic navigation, ray/voxel
# behaviors, target bidding. frontier_exploration / vlfm_baseline /
# lvlm_baseline are the baseline variants. This file is the SOURCE OF TRUTH for
# the scene templates: all four missions run these queries, background queries,
# detection thresholds, search areas and 24 spawn layouts, so the only
# difference between them is the method flag.
#
# Run on OSMO (4 GPU / 24 CPU / 96Gi / 500Gi — GPU 0 is Isaac Sim, robot N gets GPU N):
#   airstack osmo:mission osmo/missions/multi_raven_mission.yaml --pool <gpu-pool>
#
# Or locally:
#   python3 osmo/workspace/mission_runner.py osmo/missions/multi_raven_mission.yaml \
#     --airstack-root "$(pwd)"
#
# Schema reference: osmo/missions/README.md

name: multi_raven_mission

# Upload results (mcap bags + logs) to airlab-storage, then auto-teardown once
# the upload succeeds (needs the airlab-storage OSMO credential — airstack
# osmo:setup). Override the path with osmo:mission --nas-dest.
nas_dest: /volume4/dsta/raven-multi/

stack:
  services: [isaac-sim, robot-desktop, gcs]

env:
  NUM_ROBOTS: 3
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  # voxel_score_threshold below is a SOFTMAX PROBABILITY — rayfronts computes
  # softmax(100 * cos_sim) over the registered vocabulary. Set explicitly so a
  # sticky env var from an earlier mission (raven_ablation runs it False) cannot
  # leave raw cosines in place: those top out near 0.16, so a 0.50 gate would
  # reject every voxel and the run would silently detect nothing.
  RAYFRONTS_COMPUTE_PROB: "True"

# ── scene templates ────────────────────────────────────────────────────────
# Per-scene inputs (map, stage scale, spawn height, query, thresholds, search
# area), anchored once and merged into that scene's three spawn entries via
# `<<:` so all three start locations run byte-identical settings. STAGE_SCALE
# and SPAWN_HEIGHT_M are set on EVERY scene on purpose: mission_runner.apply_env
# only merges env vars, so an omitted key silently inherits the previous
# iteration's value. `scene_templates` is not a recognized top-level mission
# key — the runner ignores it; it exists only to hold the anchors.
scene_templates:
