# wildfire1km_5robot_b — 5 drones on the 1 km x 1 km generated WILDFIRE suburb,
# the DETECTOR-ONLY pair: frontier then lawnmower. Two baselines in one file via
# `environments:` + environment_order: grouped (iterations: 1 => 2 iterations:
# frontier, then lawnmower), a clean down -> up -> fly -> down each.
#
# Neither arm needs a GPU model server — only the shared detector :8200 that
# EVERY arm uses (the model-heavy pair is in wildfire1km_5robot_a.yaml). The
# detector lives on the offboard-compute container and serves the whole fleet.
# The backlog poller (step 2) watches whether the detector's mean latency or
# failed-request count climbs as five robots share it.
#
# METHOD SELECTION by templating: each environment entry's lowercase `method:`
# -> {{env.method}}.launch.xml and the results dir. ONE scene file —
# config/suburb_wildfire_1km.yaml — serves both arms. Both sector the 1 km area
# into NUM_ROBOTS STRIPS (sector_partition: 'strips' in frontier.yaml /
# lawnmower.yaml), so each robot flies its own slice.
#
# Submit (SAME existing 1-GPU workflow as every wildfire1km mission; no `gpu:` key):
#   airstack osmo:mission osmo/missions/wildfire1km_5robot_b.yaml \
#     --pool coasei --branch krrishj/disaster-dataset \
#     --workflow osmo/workflows/airstack-mission-1gpu.yaml
#
# Schema: osmo/missions/README.md ; method matrix + scaling: benchmark-disaster-dataset skill.

name: wildfire1km_5robot_b
nas_dest: /volume2/coa-sei

stack:
  services: [isaac-sim, robot-desktop, gcs, offboard-compute]

env:
  DETECTOR_URL: "http://offboard-compute:8200"
  ITM_URL: "http://offboard-compute:8100"
  VLM_URL: "http://offboard-compute:8000/v1"
  CONAVGPT2_YOLO_WORLD_WEIGHTS: "/root/.cache/conavgpt2_weights/yolov8l-world.pt"

  NUM_ROBOTS: 5
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_CUDA_DEVICES: "0"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"

  SCENE_CONFIG: suburb
  REGION_M: "1000x1000"
  DISASTER_TYPE: "wildfire"
  SEVERITY: "0.6"
  AIRSTACK_ASSET_ROOT: "omniverse://airlab-nucleus.andrew.cmu.edu:443/Projects/SEI-COA"
  # FIVE drones ~6 m apart on the x = -30 kerb near the block centre.
  SPAWN_CONFIGS: >-
    [{"x_m": -30.0, "y_m": -12.0, "orient": [0.0, 0.0, 0.0, 1.0]},
     {"x_m": -30.0, "y_m":  -6.0, "orient": [0.0, 0.0, 0.0, 1.0]},
     {"x_m": -30.0, "y_m":   0.0, "orient": [0.0, 0.0, 0.0, 1.0]},
     {"x_m": -30.0, "y_m":   6.0, "orient": [0.0, 0.0, 0.0, 1.0]},
     {"x_m": -30.0, "y_m":  12.0, "orient": [0.0, 0.0, 0.0, 1.0]}]
  SPAWN_HEIGHT_M: "0.5"
  # People poles are the ANSWER KEY; OFF for a scored run.
  # PEOPLE_POLES: "1"

  ENABLE_LIDAR: "false"

  ZED_PITCH_DEG: "30"
  ZED_WIDTH: "720"
  ZED_HEIGHT: "450"

  MAP_ANCHOR_ENU: "true"

  CONAVGPT_BASELINE: "false"
  FRONTIER_ONLY_BASELINE: "false"
  VLFM_BASELINE: "false"
  LVLM_BASELINE: "false"
  COMMS_RANGE_M: 5000
  RESULTS_SCENE: SuburbWildfire1km
  GT_ANNOTATIONS: "on"

environment_order: grouped
iterations: 1
environments:
  - name: frontier
    method: frontier
    model_port: ""
    START_DETECTOR_SERVER: "true"
    START_ITM_SERVER: "false"
    START_VLM_SERVER: "false"
  - name: lawnmower
    method: lawnmower
    model_port: ""
    START_DETECTOR_SERVER: "true"
    START_ITM_SERVER: "false"
    START_VLM_SERVER: "false"

ready:
  timeout_s: 2400
  poll_interval_s: 10

up_timeout_s: 3600
iteration_attempts: 2
on_step_failure: abort_iteration
command_route: gcs

record:
  enabled: true
  scope: both
  required: true
  topics:
    - /{robot}/odometry_conversion/odometry
    - /{robot}/interface/mavros/global_position/global
    - /{robot}/global_plan
    - /gcs/robot_markers
    - /gcs/sim_ground
    - /gcs/annotations/bboxes
    - /sim/overhead/image
    - /sim/overhead/spec
    - /sim/overhead/center_x
    - /sim/overhead/center_y
    - /{robot}/occupancy
    - /{robot}/frontiers
    - /{robot}/frontier_cloud
    - /{robot}/voxel_map
    - /{robot}/value_map
    - /{robot}/search/markers
    - /{robot}/search/round_stats
    - /{robot}/search/run_complete
  robot_topics:
    - /tf
    - /tf_static
    - /robot_{n}/odometry_conversion/odometry
    - /robot_{n}/global_plan
    - /robot_{n}/occupancy
    - /robot_{n}/frontiers
    - /robot_{n}/value_map
    - /robot_{n}/search/map_image
    - /robot_{n}/search/round_stats
    - /robot_{n}/search/run_complete
    - /robot_{n}/search/agent_image
    - /robot_{n}/voxel_map
    - /robot_{n}/frontier_cloud
    - /robot_{n}/search/markers
    - /robot_{n}/interface/mavros/state
    - /robot_{n}/sensors/front_stereo/left/image_rect

steps:
  # 1. Wait for the offboard-compute detector (:8200). No model server for these
  #    arms, so {{env.model_port}} is empty and only the detector is gated.
  - run:
      container: robot_1
      cmd: |
        MP="{{env.model_port}}"
        echo "waiting for offboard-compute: detector :8200${MP:+ + model :$MP}"
        for i in $(seq 1 120); do
          d=$(curl -sf http://offboard-compute:8200/health 2>/dev/null | grep -c '"status": *"ok"')
          if [ -n "$MP" ]; then
            m=$(curl -sf "http://offboard-compute:$MP/health" 2>/dev/null | grep -c '"status": *"ok"')
          else
            m=1
          fi
          if [ "$d" = "1" ] && [ "$m" = "1" ]; then
            echo OFFBOARD_READY
            curl -s http://offboard-compute:8200/health | head -c 300; echo
            exit 0
          fi
          sleep 15
        done
        echo OFFBOARD_NOT_READY; exit 1
      timeout_s: 1900
      attempts: 2
      retry_delay_s: 20

  # 2. Server-metrics BACKLOG POLLER (fleet-wide; ONE poller in robot_1). For
  #    these arms only the detector answers; itm/vlm record {}. Detector fields:
  #    calls, mean_ms, yolo_mean_ms, sam_mean_ms, throughput_hz, errors,
  #    vocab_switches — rising mean_ms/errors under five robots is the answer.
  - run:
      container: robot_1
      cmd: |
        mkdir -p /tmp/search
        : > /tmp/search/server_metrics.jsonl
        nohup bash -c '
          for i in $(seq 1 500); do
            ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            det=$(curl -s --max-time 5 http://offboard-compute:8200/metrics 2>/dev/null); [ -n "$det" ] || det="{}"
            itm=$(curl -s --max-time 5 http://offboard-compute:8100/metrics 2>/dev/null); [ -n "$itm" ] || itm="{}"
            vlm=$(curl -s --max-time 5 http://offboard-compute:8000/metrics 2>/dev/null); [ -n "$vlm" ] || vlm="{}"
            printf "{\"ts\":\"%s\",\"detector\":%s,\"itm\":%s,\"vlm\":%s}\n" "$ts" "$det" "$itm" "$vlm" >> /tmp/search/server_metrics.jsonl
            sleep 15
          done
        ' > /tmp/search/server_metrics_poller.log 2>&1 &
        echo $! > /tmp/search/poller.pid
        echo POLLER_STARTED pid=$(cat /tmp/search/poller.pid)
      timeout_s: 60

  - action:
      task: takeoff
      goal: {target_altitude_m: 20.0, velocity_m_s: 2.0}
      timeout_s: 300
      robots: all

  - wait: 5

  # 3. ONE planner per robot, each IN ITS OWN CONTAINER on its OWN domain. See
  #    wildfire1km_5robot_a.yaml step 4 for why `container: robot_{n}` is WRONG
  #    (all five would land in robot-desktop-1 as robot_1) and why the literal
  #    container name + /root/.bashrc sourcing + explicit ROBOT_NAME/ROS_DOMAIN_ID
  #    is right. The `{n}` fans the step out => one planner in each
  #    airstack-robot-desktop-N on domain N. Pod prefix is `airstack-` (clone at
  #    /root/AirStack); a local run would use that checkout dir's prefix.
  - run:
      container: airstack-robot-desktop-{n}
      cmd: |
        source /root/.bashrc >/dev/null 2>&1 || true
        export ROBOT_NAME=robot_{n}
        export ROS_DOMAIN_ID={n}
        mkdir -p /tmp/search
        CFG=$(ros2 pkg prefix search_baselines)/share/search_baselines/config
        nohup ros2 launch search_baselines {{env.method}}.launch.xml \
          scene_params_file:=$CFG/suburb_wildfire_1km.yaml \
          > /tmp/search/planner.log 2>&1 &
        echo $! > /tmp/search/planner.pid
        sleep 25
        if kill -0 "$(cat /tmp/search/planner.pid)" 2>/dev/null; then
          echo PLANNER_STARTED robot_{n}
          grep -a -E "sector [0-9]+/|search_planner starting" /tmp/search/planner.log | head -2 || true
        else
          echo PLANNER_DEAD robot_{n}; tail -n 60 /tmp/search/planner.log; exit 1
        fi
      timeout_s: 300
      attempts: 2
      retry_delay_s: 15

  # 4. Gate on SIM time for EVERY robot (fans out over all containers).
  - run:
      container: airstack-robot-desktop-{n}
      cmd: |
        source /root/.bashrc >/dev/null 2>&1 || true
        export ROS_DOMAIN_ID={n}
        for i in $(seq 1 300); do
          if timeout 10 ros2 topic echo /{robot}/search/run_complete --once 2>/dev/null | grep -q "data: true"; then
            echo RUN_COMPLETE {robot}; exit 0
          fi
          kill -0 "$(cat /tmp/search/planner.pid)" 2>/dev/null || {
            echo PLANNER_EXITED {robot}; tail -n 60 /tmp/search/planner.log; exit 1; }
          sleep 15
        done
        echo RUN_DID_NOT_COMPLETE {robot}; tail -n 40 /tmp/search/planner.log; exit 1
      timeout_s: 4800

  # 5. Per-ROBOT results + planner-side signals. DEST includes method and robot.
  - run:
      container: airstack-robot-desktop-{n}
      cmd: |
        source /root/.bashrc >/dev/null 2>&1 || true
        DEST=/root/AirStack/results/wildfire1km_5robot_b/{{env.method}}/{robot}
        mkdir -p "$DEST"
        cp -v /tmp/search/*.log "$DEST"/ 2>/dev/null || true
        cp -v /tmp/conavgpt2/search_planner_rounds.jsonl "$DEST"/ 2>/dev/null || true
        {
          echo "# ticks with a detection / total"
          grep -ac "targets:" /tmp/search/planner.log
          grep -a "targets:" /tmp/search/planner.log | grep -acv "'n': 0,"
          echo "# best goal_max (goal-class confidence; 0 => detector never proposed the goal)"
          grep -ao "goal_max': [0-9.]*" /tmp/search/planner.log | sort -t' ' -k2 -g | tail -1
          echo "# people visited / given up / goals blacklisted"
          grep -ac "target VISITED" /tmp/search/planner.log
          grep -ac "GIVING UP" /tmp/search/planner.log
          grep -ac "BLACKLISTED" /tmp/search/planner.log
          echo "# lawnmower: lane legs flown / lifted (empty for frontier)"
          grep -ac "leg flown" /tmp/search/planner.log
          grep -ac "lifting it to" /tmp/search/planner.log
          echo "# detector-call failures seen by the planner"
          grep -acE "detector.*(fail|error|timeout)" /tmp/search/planner.log
        } > "$DEST"/summary.txt 2>&1
        cat "$DEST"/summary.txt
      timeout_s: 180
      expect_success: false

  # 6. Fleet detector /metrics snapshot + poller stop (robot_1 == robot-desktop-1).
  - run:
      container: robot_1
      cmd: |
        DEST=/root/AirStack/results/wildfire1km_5robot_b/{{env.method}}
        mkdir -p "$DEST"
        cp -v /tmp/search/server_metrics.jsonl "$DEST"/ 2>/dev/null || true
        cp -v /tmp/search/server_metrics_poller.log "$DEST"/ 2>/dev/null || true
        curl -s http://offboard-compute:8200/metrics > "$DEST"/detector_metrics_final.json 2>/dev/null || true
        echo "# detector:"; cat "$DEST"/detector_metrics_final.json; echo
        echo "# poller samples: $(wc -l < /tmp/search/server_metrics.jsonl 2>/dev/null || echo 0)"
        kill "$(cat /tmp/search/poller.pid)" 2>/dev/null || true
        sleep 2; echo stopped
      timeout_s: 120
      expect_success: false

  # 7. Stop each planner (per container).
  - run:
      container: airstack-robot-desktop-{n}
      cmd: |
        kill "$(cat /tmp/search/planner.pid)" 2>/dev/null || true
        sleep 1; echo stopped robot_{n}
      timeout_s: 60
    optional: true

  - action:
      task: land
      goal: {}
      timeout_s: 240
      robots: all
    optional: true
