# simtime300_4robot_comms
#
# 4 robots at 50 m and 30 m gossip range, both conditions in one file
# (192 environments = 8 scenes x 3 starts x 4 methods x 2 comms ranges).
#
# Each environment reuses the spawn layout its full-comms counterpart flew, so
# full / 50 m / 30 m are matched cell by cell and a difference between them is
# the comms range rather than the start pose. Environments the refly re-laid out
# (militarybase_s2, militarybase_s3, shipyard_s1, shipyard_s3) carry the refly
# layout, since that is what their full-comms runs used.
#
# shipyard_s2 is the exception: it has never completed at 4 robots. Its supplied
# rect was nowhere near the env's actual spawn band and produced "robots
# connected but never ready", so the layout here is spread across the original
# band x[32,56] y[-54,-45] instead. Treat those 8 runs as unproven.
#
# ready.timeout_s is 2400, not the inherited 900 - at 4 robots the stack needs
# longer to come up, and 900 s is what stalled the first sweep.

name: simtime300_4robot_comms
nas_dest: /volume4/dsta/raven-simtime300/
stack:
  services:
  - isaac-sim
  - robot-desktop
  - gcs
env:
  NUM_ROBOTS: 4
  RAYFRONTS_COMPUTE_PROB: 'True'
  ISAAC_SIM_HEADLESS: 'true'
  ISAAC_SIM_USE_STANDALONE: 'true'
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: 'true'
  FRONTIER_ONLY_BASELINE: 'false'
  VLFM_BASELINE: 'false'
  LVLM_BASELINE: 'false'
baseline_templates:
  frontier:
    FRONTIER_ONLY_BASELINE: 'true'
    VLFM_BASELINE: 'false'
    LVLM_BASELINE: 'false'
    method: frontier
