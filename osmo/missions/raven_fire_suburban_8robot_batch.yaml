# Generated 3-cell RAVEN batch; actual mission capped below 12 hours.
name: raven_fire_suburban_8robot_batch
nas_dest: /volume2/coa-sei
stack:
  services:
  - isaac-sim
  - robot-desktop
  - gcs
  - offboard-compute
env:
  NUM_ROBOTS: 8
  ISAAC_SIM_HEADLESS: 'true'
  ISAAC_SIM_MULTIGPU: ''
  GCS_VIZ_DECIMATE: '2'
  ISAAC_SIM_USE_STANDALONE: 'true'
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: 'true'
  SCENE_CONFIG: ''
  FROZEN_DATASET_ROOT: omniverse://airlab-nucleus.andrew.cmu.edu:443/Projects/SEI-COA/final_disaster_dataset
  SUBURB_COLLIDERS: ground
  SPAWN_HEIGHT_M: '0.5'
  DRONE_Z_M: '0.5'
  ENABLE_LIDAR: 'true'
  MIGHTY_CLOUD_SUFFIX: sensors/ouster/point_cloud
  MIGHTY_CLOUD_FRAME: ouster
  MAP_ANCHOR_ENU: 'true'
  AIRSTACK_STACK: full_mighty
  LOCAL_PLANNER: mighty
  CONAVGPT_BASELINE: 'false'
  FRONTIER_ONLY_BASELINE: 'false'
  VLFM_BASELINE: 'false'
  LVLM_BASELINE: 'false'
  COMMS_RANGE_M: 5000
  GT_ANNOTATIONS: 'on'
  OFFBOARD_COMPUTE_GPU: '1'
  RAYFRONTS_MODE: shared
  START_RAYFRONTS_SERVER: 'true'
  START_DETECTOR_SERVER: 'false'
  START_ITM_SERVER: 'false'
  RAYFRONTS_CONFIG: shared_humans
  RAYFRONTS_ROBOT_IDS: 1,2,3,4,5,6,7,8
  RAYFRONTS_COMPUTE_PROB: 'True'
  RAYFRONTS_WAIT_TIMEOUT_S: '600'
  VLM_URL: http://offboard-compute:8000/v1
  RAVEN_LVLM: 'false'
  START_VLM_SERVER: 'false'
  CONAVGPT2_VLM_MODEL: Qwen/Qwen2.5-VL-3B-Instruct
  CONAVGPT2_VLM_QUANT: nf4
  MIGHTY_V_MAX: '1.0'
  MIGHTY_A_MAX: '0.2'
  MIGHTY_J_MAX: '1.0'
  MIGHTY_OVERRIDE_PERIOD_S: '0.2'
  MIGHTY_SEGMENT_STRIDE: '2'
  MIGHTY_NATIVE_SETPOINTS: '1'
  PID_POS_FF: '1.0'
  PID_VEL_FF: '0.102'
  PID_VZ_FF: '0.0'
  RAVEN_VOX_SIZE_M: '0.3'
  RAVEN_VOXEL_MAX_EXTENT_M: '3.0'
  RAYFRONTS_HOLD_TIMEOUT_S: '0'
  RAYFRONTS_RESUME_VOX: '300'
  RAVEN_COVERAGE_RESTART: '1'
  RAVEN_FRONTIER_EXCLUDE_OBSERVED: '1'
  RAVEN_FRONTIER_NOVELTY_W: '100.0'
  RAVEN_FRONTIER_VISITED_W: '30.0'
  RAVEN_FRONTIER_VISITED_SCALE_M: '15.0'
  RAVEN_FRONTIER_MAX_DZ_M: '2.0'
  ZED_WIDTH: '960'
  ZED_HEIGHT: '600'
  ZED_PITCH_DEG: '0'
