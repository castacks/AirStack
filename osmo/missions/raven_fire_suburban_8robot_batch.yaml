ready:
  timeout_s: 2400
  poll_interval_s: 10
up_timeout_s: 5400
iteration_attempts: 2
on_step_failure: abort_iteration
command_route: gcs
record:
  scope: both
  required: true
  topics:
  - /tf
  - /tf_static
  - /{robot}/odometry_conversion/odometry
  - /{robot}/global_plan
  - /{robot}/navigation_mode
  - /{robot}/raven_nav/discoveries
  - /{robot}/raven_nav/confirmed_targets
  - /{robot}/raven_nav/lvlm_trigger
  - /{robot}/raven_nav/lvlm_request
  - /{robot}/raven_nav/guiding_objects
  - /{robot}/raven_nav/explored_area_coverage
  - /{robot}/debug/voxel_table
  - /{robot}/debug/ray_table
  - /{robot}/rayfronts/status
  - /{robot}/rayfronts/msg_serv/voxels_sim/all
  - /{robot}/rayfronts/msg_serv/rays_sim/all
  - /{robot}/rayfronts/voxel_rgb
  - /{robot}/frontiers
  - /{robot}/frontier_cloud
  - /{robot}/current_target
  - /{robot}/committed_target
  - /rayfronts_debug/{robot}/voxels_sim/all
  - /rayfronts_debug/{robot}/voxel_rgb
  - /gcs/{robot}/map_origin
  - /gcs/robot_markers
  - /gcs/payload/{robot}/filtered_rays
  - /gcs/payload/{robot}/filtered_frontiers
  - /gcs/payload/{robot}/explored_area_coverage
  - /gcs/payload/{robot}/confirmed_targets
  - /gcs/payload/{robot}/navigation_mode
  - /gcs/sim_ground
  - /gcs/annotations/bboxes
steps:
- run:
    container: robot_1
    cmd: "A=/root/AirStack/robot/ros_ws/src/global/planners/raven_nav/annotations\nS={{env.RESULTS_SCENE}}\nfor f in \"$A/$S.json\"\
      \ \"$A/${S}_obstacles.json\" \"$A/${S}_region.json\"; do\n  [ -f \"$f\" ] || { echo \"MISSING $f\"; exit 1; }\ndone\n\
      python3 - \"$A\" \"$S\" <<'EOF'\nimport json, sys\na, s = sys.argv[1], sys.argv[2]\npeople = json.load(open(f\"{a}/{s}.json\"\
      ))\nobst = json.load(open(f\"{a}/{s}_obstacles.json\"))\nreg = json.load(open(f\"{a}/{s}_region.json\"))\nmeta = next(e\
      \ for e in reg if e.get(\"class\") == \"meta\")\nsrch = next(e for e in reg if e.get(\"class\") == \"search\")\nprint(f\"\
      scene {s}: {len(people)} people, {len(obst)} obstacle boxes\")\nprint(f\"  frozen_usd  {meta.get('frozen_usd')}\")\n\
      print(f\"  disaster    {meta.get('disaster')} / {meta.get('scene_config')}\")\nprint(f\"  search area {srch['area_m2']:,.0f}\
      \ m2 \"\n      f\"({meta['search_frac_of_plate']:.0%} of the plate), \"\n      f\"{len(srch['polygon_xy'])} pts\")\n\
      print(f\"  people inside the search {meta['people_inside_search']}\"\n      f\"/{meta['people_total']}\")\nassert len(people)\
      \ == meta[\"people_total\"], \"people GT / region disagree\"\nassert meta[\"people_inside_search\"] > 0, \"no survivor\
      \ is in the search area\"\nEOF\n"
    timeout_s: 120
- run:
    container: offboard-compute
    cmd: "SOCK=/tmp/rayfronts/encoder.sock\necho \"waiting up to 300s for $SOCK\"\nfor i in $(seq 1 60); do\n  [ -S \"$SOCK\"\
      \ ] && { echo \"ENCODER_SOCKET_UP\"; break; }\n  sleep 5\ndone\n[ -S \"$SOCK\" ] || echo \"WARN: encoder socket not\
      \ present after 300s (see rayfronts_encoder.log below)\"\nfor name in rayfronts_encoder rayfronts_mapping; do\n  pid_file=\"\
      /tmp/offboard/$name.pid\"\n  if [ -f \"$pid_file\" ] && kill -0 \"$(cat \"$pid_file\")\" 2>/dev/null; then\n    echo\
      \ \"$name ALIVE pid=$(cat \"$pid_file\")\"\n  else\n    echo \"$name NOT RUNNING \u2014 tail of its log:\"\n    tail\
      \ -n 60 \"/tmp/offboard/$name.log\" 2>/dev/null || echo \"(no log yet)\"\n    exit 1\n  fi\ndone\necho \"--- pin check\
      \ ---\"\ngrep -a \"pinned: CUDA_VISIBLE_DEVICES\" /tmp/offboard/*.log 2>/dev/null \\\n  || echo \"(no pin line \u2014\
      \ OFFBOARD_COMPUTE_GPU is unset, or this ran before the pin fix)\"\ngrep -aE \"Traceback|Error\" /tmp/offboard/rayfronts_encoder.log\
      \ /tmp/offboard/rayfronts_mapping.log 2>/dev/null \\\n  | tail -20 || true\n"
    timeout_s: 360
- run:
    container: airstack-robot-desktop-{n}
    cmd: "source /root/.bashrc >/dev/null 2>&1 || true\nexport ROBOT_NAME=robot_{n}\nexport ROS_DOMAIN_ID={n}\nfor i in $(seq\
      \ 1 36); do\n  if ros2 node list 2>/dev/null | grep -qx \"/robot_{n}/mighty/mighty_bridge\"; then\n    echo \"BRIDGE_UP\
      \ robot_{n}\"\n    grep -ah \"mighty_bridge up\" /root/.ros/log/mighty_bridge_*.log 2>/dev/null | tail -1\n    ros2\
      \ action list 2>/dev/null | grep -qx \"/robot_{n}/tasks/navigate\" \\\n      && echo \"NAVIGATE_ACTION_PRESENT robot_{n}\"\
      \ \\\n      || echo \"WARN: /robot_{n}/tasks/navigate not advertised\"\n    exit 0\n  fi\n  sleep 5\ndone\necho \"BRIDGE_MISSING\
      \ robot_{n}: no /robot_{n}/mighty/mighty_bridge after 180 s.\"\necho \"--- mighty namespace as seen on this domain ---\"\
      \nros2 node list 2>/dev/null | grep \"/mighty/\" || echo \"(no mighty nodes at all)\"\necho \"--- bring-up pane, mighty_bridge\
      \ lines ---\"\ntmux capture-pane -p -S -30000 -t bringup:0.0 2>/dev/null \\\n  | grep -a \"mighty_bridge\" | tail -60\
      \ || echo \"(pane history already rolled over)\"\nexit 1\n"
    timeout_s: 300
- run:
    container: airstack-robot-desktop-{n}
    cmd: "source /root/.bashrc >/dev/null 2>&1 || true\nexport ROBOT_NAME=robot_{n}\nexport ROS_DOMAIN_ID={n}\nDISP=/robot_{n}/perception/stereo_image_proc/disparity\n\
      PC=/robot_{n}/perception/stereo_image_proc/point_cloud\nok_disp=0; npub=0\nfor i in $(seq 1 20); do\n  if [ \"$ok_disp\"\
      \ = \"0\" ]; then\n    timeout 20 ros2 topic hz \"$DISP\" 2>/dev/null \\\n      | grep -m1 -q \"average rate\" && ok_disp=1\n\
      \  fi\n  if [ \"$ok_disp\" = \"1\" ]; then\n    npub=$(ros2 topic info \"$PC\" 2>/dev/null \\\n           | grep -oE\
      \ \"Publisher count: [0-9]+\" | grep -oE \"[0-9]+\")\n    npub=${npub:-0}\n    if [ \"$npub\" -gt 0 ]; then\n      echo\
      \ \"PERCEPTION_OK robot_{n}: $DISP streaming, $PC has $npub publisher(s)\"\n      exit 0\n    fi\n  fi\n  sleep 5\n\
      done\necho \"PERCEPTION_DEAD robot_{n}: disparity=$ok_disp cloud_publishers=$npub\"\necho \"--- is the sim publishing\
      \ to this domain at all ---\"\nros2 topic list 2>/dev/null | grep -c \"/robot_{n}/sensors/\" || true\necho \"--- perception\
      \ nodes on this domain ---\"\nros2 node list 2>/dev/null | grep -E \"stereo|point_cloud|disparity|global_mapper\" \\\
      \n  || echo \"(no perception nodes)\"\necho \"--- global_mapper log, PointCloudCallback lines ---\"\ngrep -ah \"PointCloudCallback\"\
      \ /root/.ros/log/global_mapper_node_*.log 2>/dev/null \\\n  | tail -20 || echo \"(the callback never fired \u2014 not\
      \ one line)\"\nexit 1\n"
    timeout_s: 420
- action:
    task: takeoff
    goal:
      target_altitude_m: 20.0
      velocity_m_s: 2.0
    timeout_s: 420
    robots: all
- wait: 5
- action:
    task: semantic_search
    timeout_s: 13800
    cancel_on_timeout: true
    cancel_grace_s: 180
    pass_on_feedback: true
    goal_per_robot: '{{env.goal_per_robot}}'
    goal:
      query: person
      background_queries: road, grass, tree, house, wall, debris, sky, car, utility pole, street light, hydrant, crosswalk
      search_area: '{{env.search_area}}'
      min_altitude_agl: 15.0
      max_altitude_agl: 40.0
      min_flight_speed: 0.5
      max_flight_speed: 1.0
      confidence_threshold: 0.95
      voxel_score_threshold: 0.75
      score_threshold: 0.85
      voxel_min_cluster_size: 12
      max_sim_seconds: 600.0
- action:
    task: land
    goal: {}
    timeout_s: 180
    optional: true
    robots: all
- run:
    container: airstack-robot-desktop-{n}
    cmd: 'DEST=/root/AirStack/results/raven_suburban_8robot/{{env.RESULTS_SCENE}}/raven/robot_{n}

