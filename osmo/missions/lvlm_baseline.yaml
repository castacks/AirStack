# lvlm_baseline — 3-robot FPV + LVLM (InternVL3-2B) navigation BASELINE, cycled
# across three scenes (RetroNeighborhood, FireAcademy, ConstructionSite).
#
# Each robot navigates purely from its first-person camera: the lvlm_baseline
# node asks InternVL3 for {move forward, turn left, turn right} and sends the
# resulting waypoint to the robot's real global planner (droan_gl) as a
# NavigateTask action — droan flies there with obstacle avoidance.
#
# Selected by LVLM_BASELINE=true (mirrors FRONTIER_ONLY_BASELINE / full-raven):
# semantic_search_task spawns lvlm_baseline_node instead of rayfronts + raven_nav.
# There is NO rayfronts mapping / detection / GT scoring in this mode — scoring
# is done offline from the recorded bags (drone path vs /gcs/annotations/bboxes).
#
# Run on OSMO (3 GPU / 24 CPU / 96Gi / 500Gi):
#   airstack osmo:mission osmo/missions/lvlm_baseline.yaml --pool <gpu-pool>
#
# Or locally:
#   python3 osmo/workspace/mission_runner.py osmo/missions/lvlm_baseline.yaml \
#     --airstack-root "$(pwd)"
#
# Schema reference: osmo/missions/README.md

name: lvlm_baseline

stack:
  services: [isaac-sim, robot-desktop, gcs]

env:
  NUM_ROBOTS: 3
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  # Opt into the FPV+LVLM baseline (default is full coordination).
  LVLM_BASELINE: "true"

# Environments cycled across iterations. UPPERCASE keys (ENV_URL, SPAWN_*) are
# exported as env vars before `airstack up`; lowercase keys (query, search_area)
# are templated into the steps via {{env.<key>}}.
environments:
  - name: retroneighborhood
    ENV_URL: "Library/Stages/RetroNeighborhood/RetroNeighborhood.stage.usd"
    SPAWN_CONFIGS: '[{"x_m": 6.764, "y_m": -1.767, "orient": [0,0,-0.1193,0.9929]}, {"x_m": -0.354, "y_m": 2.251, "orient": [0,0,0.8743,0.4854]}, {"x_m": 2.939, "y_m": 5.117, "orient": [0,0,-0.7931,0.6091]}]'
    STAGE_SCALE: "0.01"
    SPAWN_HEIGHT_M: "0.3"
    RESULTS_SCENE: "RetroNeighborhood"
    query: "house"
    background_queries: "sky, ground, grass, road, bus stop, shed, garage, tree"
    search_area:
      points:
        - {x: -150.0, y: -110.0, z: 0.0}
        - {x: -150.0, y: 70.0, z: 0.0}
        - {x: 170.0, y: 70.0, z: 0.0}
        - {x: 170.0, y: -110.0, z: 0.0}

  - name: fireacademy
    ENV_URL: "Projects/AirStack/scenes/urban/allegheny_county_fire_academy/fire_academy.scene.usd"
    SPAWN_CONFIGS: '[{"x_m": 27.34, "y_m": 5.359, "orient": [0,0,0.9757,0.2192]}, {"x_m": 25.982, "y_m": 12.241, "orient": [0,0,-0.2076,0.9782]}, {"x_m": 26.223, "y_m": 15.534, "orient": [0,0,-0.3285,0.9445]}]'
    STAGE_SCALE: "0.01"
    SPAWN_HEIGHT_M: "0.3"
    RESULTS_SCENE: "FireAcademy"
    query: "red building, water tower, radio tower, blue container, red container"
    background_queries: "sky, ground, grass, road, tree, container, gas tank"
    search_area:
      points:
        - {x: 13.0, y: -135.0, z: 0.0}
        - {x: 135.0, y: -13.0, z: 0.0}
        - {x: 13.0, y: 135.0, z: 0.0}
        - {x: -135.0, y: 13.0, z: 0.0}

  - name: constructionsite
    ENV_URL: "Library/Stages/ConstructionSite/ConstructionSite.stage.usd"
    SPAWN_CONFIGS: '[{"x_m": 22.99, "y_m": -4.679, "orient": [0,0,0.2886,0.9575]}, {"x_m": 25.203, "y_m": 0.448, "orient": [0,0,-0.2699,0.9629]}, {"x_m": 22.903, "y_m": -1.579, "orient": [0,0,0.9137,0.4063]}]'
    STAGE_SCALE: "0.01"
    SPAWN_HEIGHT_M: "0.3"
    RESULTS_SCENE: "ConstructionSite"
    query: "Forklift, Towercrane, red container"
    background_queries: "sky, ground, grass, road, Building, cabling winches, blue tarp"
    search_area:
      points:
        - {x: 76.0, y: 50.0, z: 0.0}
        - {x: 76.0, y: -71.0, z: 0.0}
        - {x: -37.0, y: -67.0, z: 0.0}
        - {x: -40.0, y: 50.0, z: 0.0}

# Send goals through the GCS action_relay — the exact path Foxglove uses. The
# relay transforms the global-ENU search polygon into each robot's local 'map'
# frame before forwarding (the lvlm node clamps its waypoints to it).
command_route: gcs

# grouped: run each environment `iterations` times in a row (retro×N, then
# fireacademy×N, then constructionsite×N). iterations is PER ENVIRONMENT;
# total runs = iterations * 3. The spawn layout is fixed per scene above.
environment_order: grouped
iterations: 2

# Redo an iteration (clean down→up→fly→down) if a step up to and including
# semantic_search fails — i.e. the precondition steps fail, or semantic_search
# never gets feedback after its own retries. Up to 3 attempts per iteration.
iteration_attempts: 3

ready:
  timeout_s: 600

# Scoring is offline for this baseline, so record the flown trajectory and the
# ground-truth boxes (open the .mcap in Foxglove). Add FPV image topics at
# scope: robot if you want the camera stream too (large bags).
record:
  enabled: true
  scope: gcs
  required: true
  topics:
    - /tf
    - /tf_static
    - /{robot}/odometry_conversion/odometry
    - /gcs/robot_markers
    - /gcs/sim_ground
    - /gcs/annotations/bboxes

on_step_failure: abort_iteration

steps:
  # Pre-download InternVL3-2B into the persistent /root/.cache so the first real
  # 8-bit load inside the node doesn't time out (robot_1 only; the cache mount is
  # shared across replicas).
  - run:
      container: robot_1
      cmd: python3 -c "from huggingface_hub import snapshot_download; snapshot_download('OpenGVLab/InternVL3-2B')"
      timeout_s: 900
      attempts: 5
      retry_delay_s: 15

  - action:
      task: takeoff
      goal: {target_altitude_m: 12.0, velocity_m_s: 1.0}
      timeout_s: 180

  - wait: 5

  # Run budget = 15 min (cancel_on_timeout). pass_on_feedback: the iteration only
  # needs the baseline to RUN — pass as soon as feedback is seen; redo only if no
  # feedback arrives after the retries.
  - action:
      task: semantic_search
      timeout_s: 900
      cancel_on_timeout: true
      pass_on_feedback: true
      goal:
        query: "{{env.query}}"
        background_queries: "{{env.background_queries}}"
        search_area: "{{env.search_area}}"
        min_altitude_agl: 10.0
        max_altitude_agl: 20.0
        min_flight_speed: 0.5
        max_flight_speed: 1.0
        confidence_threshold: 0.95
