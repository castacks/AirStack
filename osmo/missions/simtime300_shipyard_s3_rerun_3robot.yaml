# simtime300_shipyard_s3_rerun_3robot
#
# Re-fly of the `shipyard_s3` cells that are missing from the 300 s sim-time
# grid, so every method reaches 24 runs per comms condition.
#
# Missing cells this covers:
#   shipyard_s3_lvlm_comms50_3r  (method=lvlm, COMMS_RANGE_M=50)
#   shipyard_s3_frontier_comms30_3r  (method=frontier, COMMS_RANGE_M=30)
#
# These cells are missing because the iteration never armed in the original
# sweep, not because it was scored short — so they may fail again.
# iteration_attempts is raised to 5 for that reason.
#
# Scene definition (ENV_URL, query, search area, SPAWN_CONFIGS) is copied
# verbatim from the existing shipyard_s3 environment; only the method flags and
# COMMS_RANGE_M differ per environment. max_sim_seconds is 300.

