# two_drone_rerun — the three two-robot runs that never armed.
#
# shipyard_s3 failed for frontier, lvlm and multi-raven with
# `robots [1, 2] not ready within 900s`. VLFM's run of the SAME environment and
# the SAME spawn passed, so this is the intermittent PX4/EKF arming failure, not
# a bad spawn site — re-flying is the fix, not moving the drones.
#
# Everything else (scenes, spawns, queries, thresholds, search areas) is
# identical to two_drone_sweep.yaml.
#
#   1 environment x 3 methods = 3 runs, ~1h
#
#   airstack osmo:mission osmo/missions/two_drone_rerun.yaml --pool <gpu-pool>

name: two_drone_rerun

nas_dest: /volume4/dsta/raven-multi/

stack:
  services: [isaac-sim, robot-desktop, gcs]

env:
  # The one substantive change from the 3-robot sweep. mission_runner reads this
  # to size the stack and to expand the {robot} placeholders in `record.topics`,
  # and the Isaac spawn script takes the fleet from SPAWN_CONFIGS, so both ends
  # agree at two.
  NUM_ROBOTS: 2
  # voxel_score_threshold below is a SOFTMAX PROBABILITY. Stated explicitly
  # because mission_runner.apply_env only ever SETS env vars: a run after
  # raven_ablation (which uses False) would otherwise inherit raw cosines,
  # which top out near 0.16, and a 0.50 gate would reject every voxel.
  RAYFRONTS_COMPUTE_PROB: "True"
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  # Methods are selected per environment entry below; these are the defaults
  # each entry then overrides.
  FRONTIER_ONLY_BASELINE: "false"
  VLFM_BASELINE: "false"
  LVLM_BASELINE: "false"

# ── method anchors ─────────────────────────────────────────────────────────
baseline_templates:

  frontier: &frontier
    FRONTIER_ONLY_BASELINE: "true"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: frontier

  vlfm: &vlfm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "true"
    LVLM_BASELINE: "false"
    method: vlfm

  lvlm: &lvlm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "true"
    method: lvlm

  # No flag set -> the default full-coordination raven stack.
  multiraven: &multiraven
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: multi-raven

