# simtime300_4robot_comms_rerun_d
#
# Remaining runs from simtime300_4robot_comms (192 envs, of which 38 completed
# in run 2026-08-25_06-29-01 — comms50 multiraven/frontier through
# militarybase_s1). Environments are copied verbatim from
# simtime300_4robot_comms.yaml, so spawn layouts, queries and search areas stay
# matched cell-for-cell with their full-comms counterparts.
#
# WHY THIS IS SPLIT: every 4-robot mission so far has died at the same point.
# simtime300_4robot_a passed 37 then failed 38-48; simtime300_4robot_b passed
# 38 then failed 39-48; simtime300_4robot_comms passed 38 then failed 39-68 —
# all with `robots [1, 2, 3, 4] not ready ... (connected so far: [])`, never
# recovering inside that pod even across three attempts per iteration. The last
# iteration to pass in the comms run (038) is also the first one whose bag
# recorder logged `RTPS_TRANSPORT_SHM ... Failed to create segment`, i.e. the
# pod's /dev/shm (shared by every container via `ipc: host`) runs out after
# ~37 up/down cycles and DDS bring-up never works again. So each file here is
# capped at 30 iterations — submit them as separate workflows, each on a
# fresh pod.
#
# ready.timeout_s is 1200, not the 2400 the parent used: across all 38 passing
# iterations the slowest robot was ready in 379 s, so 1200 s keeps a 3x margin
# while halving the time a dead pod burns per failed iteration.
#
# The first step is an optional /dev/shm + disk probe on the pod; it never
# fails the iteration and gives per-iteration evidence for the leak above.
#
# Contents (30 envs): 5x comms30/multi-raven, 5x comms30/frontier, 10x comms30/vlfm, 10x comms30/lvlm

