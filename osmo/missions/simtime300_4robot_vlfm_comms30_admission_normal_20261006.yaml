# One missing trial to test fair-use admission; use the 2h workflow.
name: simtime300_4robot_vlfm_comms30_admission_normal_20261006
nas_dest: /volume4/dsta/raven-simtime300/
stack:
  services:
  - isaac-sim
  - robot-desktop
  - gcs
env:
  NUM_ROBOTS: 4
  RAYFRONTS_COMPUTE_PROB: 'True'
  ISAAC_SIM_HEADLESS: 'true'
  ISAAC_SIM_USE_STANDALONE: 'true'
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: 'true'
  FRONTIER_ONLY_BASELINE: 'false'
  VLFM_BASELINE: 'false'
  LVLM_BASELINE: 'false'
  CONAVGPT_BASELINE: 'false'
environments:
- FRONTIER_ONLY_BASELINE: 'false'
  VLFM_BASELINE: 'true'
  LVLM_BASELINE: 'false'
  method: vlfm
  ENV_URL: Library/Stages/Dmytro/downtown_edited_v3_818.usd
  STAGE_SCALE: '1.0'
  SPAWN_HEIGHT_M: '0.2'
  RESULTS_SCENE: DowntownWest
  query: fountain, car, truck
  background_queries: concrete, pavement, sidewalk, dirt, gravel, sand, soil, grass, mountain, hill, water,
    pond, rubble, tree, shrub, hedge, forest, tree canopy, building, building facade, wall, roof, window,
    door, warehouse, house, garage, shed, hangar, fence, railing, stairs, parking lot, runway, utility
    pole, electrical pole, power line, street lamp, street light, traffic signal, sign, mast, ground
  voxel_score_threshold: 0.5
  score_threshold: -1
  voxel_min_cluster_size: 50
  search_area:
    points:
    - x: 160.0
      y: 100.0
      z: 0.0
    - x: 160.0
      y: -100.0
      z: 0.0
    - x: -260.0
      y: -100.0
      z: 0.0
    - x: -260.0
      y: 100.0
      z: 0.0
  name: downtownwest_s1_vlfm_comms30_4r
  SPAWN_CONFIGS: '[{"x_m": -1.0, "y_m": -41.0, "orient": [0.0, 0.0, 0.698, 0.716]}, {"x_m": 3.0, "y_m":
    -35.0, "orient": [0.0, 0.0, 0.736, 0.677]}, {"x_m": 7.0, "y_m": -30.0, "orient": [0.0, 0.0, 0.784,
    0.621]}, {"x_m": 8.5, "y_m": -42.5, "orient": [0.0, 0.0, 0.8277, 0.5612]}]'
  COMMS_RANGE_M: 30
command_route: gcs
environment_order: grouped
iterations: 1
iteration_attempts: 1
ready:
  timeout_s: 1200
record:
  enabled: true
  scope: both
  required: true
  topics:
  - /tf
  - /tf_static
  - /{robot}/odometry_conversion/odometry
  - /gcs/robot_markers
  - /gcs/payload/{robot}/filtered_rays
  - /gcs/payload/{robot}/filtered_frontiers
  - /gcs/payload/{robot}/explored_area_coverage
  - /gcs/payload/{robot}/confirmed_targets
  - /gcs/payload/{robot}/auction_table
  - /gcs/sim_ground
  - /gcs/annotations/bboxes
  robot_topics:
  - /robot_{n}/rayfronts/voxel_rgb
  - /robot_{n}/rayfronts/msg_serv/voxels_sim/all
on_step_failure: abort_iteration
steps:
- run:
    container: pod
    cmd: 'echo "[pod] shm: $(df -h /dev/shm | tail -1) segments=$(ls -1 /dev/shm 2>/dev/null | wc -l)";
      echo "[pod] disk: $(df -h / | tail -1)"'
    timeout_s: 60
    expect_success: false
  optional: true
- run:
    container: robot_1
    cmd: python3 -c "import torch; torch.hub.load('NVlabs/RADIO', 'radio_model', version='c-radio_v3-b',
      skip_validation=True, adaptor_names=['siglip2','sam'])"
    timeout_s: 900
    attempts: 5
    retry_delay_s: 15
- run:
    container: robot_1
    cmd: python3 -c "from huggingface_hub import snapshot_download; snapshot_download('OpenGVLab/InternVL3-2B')"
    timeout_s: 900
    attempts: 5
    retry_delay_s: 15
- action:
    task: takeoff
    goal:
      target_altitude_m: 12.0
      velocity_m_s: 1.0
    timeout_s: 180
- wait: 5
- action:
    task: semantic_search
    timeout_s: 2400
    cancel_on_timeout: false
    pass_on_feedback: false
    goal:
      query: '{{env.query}}'
      background_queries: '{{env.background_queries}}'
      search_area: '{{env.search_area}}'
      min_altitude_agl: 5.0
      max_altitude_agl: 20.0
      min_flight_speed: 0.5
      max_flight_speed: 1.0
      confidence_threshold: 0.95
      voxel_score_threshold: '{{env.voxel_score_threshold}}'
      score_threshold: '{{env.score_threshold}}'
      voxel_min_cluster_size: '{{env.voxel_min_cluster_size}}'
      bundle_len: 3
      max_sim_seconds: 300
    attempts: 1
