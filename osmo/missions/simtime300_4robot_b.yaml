# simtime300_4robot_b
#
# 4-robot sweep scored on a fixed 300 s of SIMULATED time per run
# (`max_sim_seconds`), so fleets whose real-time factor differs are still
# compared over the same amount of simulated search.
#
# Derived from four_drone_sweep_b.yaml: scene templates, search areas and the per-scene
# SPAWN_CONFIGS are unchanged. What differs is the sim-time budget, an explicit
# full-comms range, the NAS destination and the environment names.
#
# COMMS_RANGE_M = 5000 is the "no range limit" sentinel the other simtime300
# missions use; set it to 30 or 50 per environment for a degraded-comms sweep.
#
# The search action's timeout_s is a wall-clock backstop only — the run ends at
# 300 sim s. 4-robot runs observed a real-time factor as low as 0.13, so the
# backstop is sized well above the wall time that budget can take.
#
# 48 environments = 8 scenes x 3 starts x lvlm + vlfm.

name: simtime300_4robot_b
nas_dest: /volume4/dsta/raven-simtime300/
stack:
  services:
  - isaac-sim
  - robot-desktop
  - gcs
env:
  NUM_ROBOTS: 4
  RAYFRONTS_COMPUTE_PROB: 'True'
  ISAAC_SIM_HEADLESS: 'true'
  ISAAC_SIM_USE_STANDALONE: 'true'
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: 'true'
  FRONTIER_ONLY_BASELINE: 'false'
  VLFM_BASELINE: 'false'
  LVLM_BASELINE: 'false'
baseline_templates:
  frontier:
    FRONTIER_ONLY_BASELINE: 'true'
    VLFM_BASELINE: 'false'
    LVLM_BASELINE: 'false'
    method: frontier
