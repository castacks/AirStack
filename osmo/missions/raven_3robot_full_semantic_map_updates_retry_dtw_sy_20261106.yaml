  SPAWN_CONFIGS: '[{"x_m": -66.066, "y_m": -11.867, "orient": [0.0, 0.0, -0.9089,
    0.417]}, {"x_m": -68.796, "y_m": -14.581, "orient": [0.0, 0.0, -0.6509, 0.7591]},
    {"x_m": -61.737, "y_m": -14.407, "orient": [0.0, 0.0, 0.2744, 0.9616]}]'
  SPAWN_HEIGHT_M: '2.0'
  STAGE_SCALE: '1.0'
  VLFM_BASELINE: 'false'
  background_queries: concrete, pavement, sidewalk, dirt, gravel, sand, soil, grass,
    mountain, hill, water, pond, rubble, tree, shrub, hedge, forest, tree canopy,
    building, building facade, wall, roof, window, door, warehouse, house, garage,
    shed, hangar, fence, railing, stairs, parking lot, runway, utility pole, electrical
    pole, power line, street lamp, street light, traffic signal, sign, mast, ground
  method: multi-raven
