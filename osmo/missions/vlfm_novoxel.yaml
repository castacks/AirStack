# vlfm_novoxel — the VLFM baseline WITHOUT access to the 3D semantic voxel field.
#
# Why: the published VLFM (rai-opensource/vlfm) has no 3D semantic map. It
# explores on a 2D BEV "value map" — one BLIP-2 ITM cosine score per RGB frame,
# painted across the camera's FOV cone — and closes the last few metres with a
# separate channel: a 2D detector (YOLOv7 / GroundingDINO) plus MobileSAM, whose
# mask is back-projected through depth to localise the object. Reading object
# geometry straight out of rayfronts' voxel field, as our earlier VLFM runs did,
# is a capability it never had, and it showed: VLFM's progress was implausibly
# strong for a greedy single-agent method.
#
# VLFM_USE_VOXEL_TARGETS=false turns that off. Arrival is then inferred from the
# rays themselves — rayfronts casts semantic rays from frontier boundaries, so a
# ray's disappearance IS the arrival signal: get close enough and the object is
# no longer beyond a frontier. raven already keys on the same observable
# (_mark_lead_serviced_if_reached). A lead is retired once the drone is within
# 8 m of it AND no ray origin remains within 6 m, and the region then goes on a
# 120 s cooldown so selection is forced elsewhere rather than parking there.
#
# Everything else — scenes, spawns, queries, background queries, thresholds,
# search areas, 3 robots, the 15-minute window — is identical to
# multi_raven_mission.yaml and to the earlier vlfm_baseline.yaml, so the only
# difference from those results is the voxel channel.
#
#   8 scenes x 3 starts - 2 dead environments = 22 runs, ~7h20m
#
# constructionsite_s3 and shipyard_s2 are omitted: never armed in any sweep —
# 28 attempts, 0 successes, MAVROS connected but PX4's EKF never converging, so
# `local_position/odom` never publishes. Including them burns ~45 min each for
# no data.
#
# To reproduce the OLD (stronger) behaviour instead, set
# VLFM_USE_VOXEL_TARGETS: "true" in the env block below.
#
# Run on OSMO (4 GPU / 24 CPU / 96Gi / 500Gi — GPU 0 is Isaac Sim, robot N gets GPU N):
#   airstack osmo:mission osmo/missions/vlfm_novoxel.yaml --pool <gpu-pool>
#
# Or locally:
#   python3 osmo/workspace/mission_runner.py osmo/missions/vlfm_novoxel.yaml \
#     --airstack-root "$(pwd)"
#
# Schema reference: osmo/missions/README.md

name: vlfm_novoxel

nas_dest: /volume4/dsta/raven-multi/

stack:
  services: [isaac-sim, robot-desktop, gcs]

env:
  NUM_ROBOTS: 3
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  VLFM_BASELINE: "true"
  # The point of this mission. Reaches raven_nav as the vlfm_use_voxel_targets
  # parameter via semantic_search_task; false = no 3D voxel go-to-object.
  VLFM_USE_VOXEL_TARGETS: "false"
  VLFM_RAY_BLACKLIST: "false"
  # Raw cosine similarity, NOT a softmax over the query vocabulary — see
  # vlfm_baseline.yaml for the reasoning. Published VLFM scores a frame with one
  # BLIP-2 ITM cosine against one prompt; there is no vocabulary to normalise
  # against, whereas compute_prob=True makes each target score depend on which
  # background queries are registered.
  RAYFRONTS_COMPUTE_PROB: "False"
  # Required companion: 300 is calibrated for softmaxed scores (best-vs-typical
  # gap ~0.5). Raw cosines spread ~10x less, so 300 leaves distance dominant and
  # VLFM degenerates into plain frontier exploration.
  VLFM_VALUE_WEIGHT: "1500.0"

