command_route: gcs

# grouped: each entry runs `iterations` times in a row, in file order, so a
# scene's three start locations are adjacent. iterations is PER ENTRY —
# total runs = iterations * 24.
environment_order: grouped
iterations: 1

# Redo an iteration (clean down→up→fly→down) if a step up to and including
# semantic_search fails — i.e. the precondition steps fail, or semantic_search
# never gets feedback after its own retries. Up to 3 attempts per iteration.
iteration_attempts: 3

# 900 rather than 600: PX4 heartbeat has taken up to 325 s on a loaded box,
# and these iterations are being re-flown precisely because they fell short.
ready:
  timeout_s: 900

record:
  enabled: true
  scope: gcs
  required: true
  topics:
    - /tf
    - /tf_static
    - /{robot}/odometry_conversion/odometry
    - /gcs/robot_markers
    - /gcs/payload/{robot}/filtered_rays
    - /gcs/payload/{robot}/filtered_frontiers
    - /gcs/payload/{robot}/explored_area_coverage
    - /gcs/payload/{robot}/confirmed_targets
    - /gcs/payload/{robot}/auction_table
    - /gcs/payload/{robot}/voxel_rgb
    - /gcs/sim_ground
    - /gcs/annotations/bboxes
    - /rayfronts_debug/{robot}/voxels_sim/all
    - /rayfronts_debug/{robot}/voxel_rgb

on_step_failure: abort_iteration

steps:
  - run:
      container: robot_1
      cmd: python3 -c "import torch; torch.hub.load('NVlabs/RADIO', 'radio_model', version='c-radio_v3-b', skip_validation=True, adaptor_names=['siglip2','sam'])"
      timeout_s: 900
      attempts: 5
      retry_delay_s: 15

  - action:
      task: takeoff
      goal: {target_altitude_m: 12.0, velocity_m_s: 1.0}
      timeout_s: 180

  - wait: 5

  # Run budget = 15 min OR 80% explored, whichever first (cancel_on_timeout lets
  # semantic_search_task run its compile + metrics finalize on the deadline).
  # pass_on_feedback: the iteration only needs the search to RUN — pass as soon
  # as feedback is seen, regardless of outcome; redo the iteration only if no
  # feedback arrives after the retries.
  - action:
      task: semantic_search
      timeout_s: 1300
      cancel_on_timeout: true
      pass_on_feedback: true
      goal:
        query: "{{env.query}}"
        background_queries: "{{env.background_queries}}"
        search_area: "{{env.search_area}}"
        min_altitude_agl: 5.0
        max_altitude_agl: 20.0
        min_flight_speed: 0.5
        max_flight_speed: 1.0
        confidence_threshold: 0.95
        # Per-scene voxel similarity gate (see each scene template above).
        voxel_score_threshold: "{{env.voxel_score_threshold}}"
        # Per-scene ray score gate + voxel cluster size (-1 on an entry = raven_nav default).
        score_threshold: "{{env.score_threshold}}"
        voxel_min_cluster_size: "{{env.voxel_min_cluster_size}}"
        # Consensus bundle length (head executed, tail reserved + replanned).
        bundle_len: 3
        # Simulated-time budget: semantic_search_task ends the search when the
        # SIM clock has advanced this far, so every fleet size gets the same
        # simulated search regardless of Isaac Sim's real-time factor (~0.46 at
        # 2 robots, ~0.34 at 3, ~0.27 at 4). timeout_s above stays a wall-clock
        # safety net and must remain comfortably larger than the wall equivalent.
        max_sim_seconds: 300
