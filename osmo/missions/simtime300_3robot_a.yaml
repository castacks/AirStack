# simtime300_3robot_a — re-fly of the runs that never reached 300 simulated seconds
# of semantic_search, so every condition can be scored at a common sim-time cut.
#
# 43 runs, 3 robots, mixed radio ranges.
#
# WHY
#
# The 15-minute budget is WALL clock, and Isaac Sim's real-time factor falls as
# drones are added: ~0.46 at 2 robots, ~0.34 at 3, ~0.27 at 4. The same wall
# budget therefore buys 407 / 313 / 247 simulated seconds, so a fleet-size
# comparison at each run's own cut-off is partly measuring simulator throughput.
# Scoring every run at a fixed 300 sim s removes that, but 97 of 571 existing
# 2- and 3-robot runs stop short of 300 s — this file re-flies them.
#
# TWO CHANGES FROM THE ORIGINAL SWEEPS
#
# 1. COMMS_RANGE_M is now an env var (coordination_bringup/comms_model.py reads
#    it, docker-compose passes it to the robot and gcs containers), set per
#    entry below. That is what lets full-comms, 50 m and 30 m re-flies share
#    one mission instead of needing a source edit per range.
#
# 2. semantic_search timeout_s is 1300, not 900. At the worst observed
#    sim/wall ratio (0.251) 900 s yields only 226 simulated seconds — which
#    is exactly why so many runs landed at 260-299 s. 1300 s clears 300 sim s
#    at every ratio seen across 571 runs, with margin.
#
#    This still bounds the run in WALL time; the search is not stopped on a sim
#    clock. Runs will overshoot 300 sim s by varying amounts and are truncated
#    to 300 s at scoring time.
#
#   airstack osmo:mission osmo/missions/simtime300_3robot_a.yaml --pool <gpu-pool>

name: simtime300_3robot_a

nas_dest: /volume4/dsta/raven-simtime300/

stack:
  services: [isaac-sim, robot-desktop, gcs]

env:
  NUM_ROBOTS: 3
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  # voxel_score_threshold below is a SOFTMAX PROBABILITY — rayfronts computes
  # softmax(100 * cos_sim) over the registered vocabulary. Set explicitly so a
  # sticky env var from an earlier mission (raven_ablation runs it False) cannot
  # leave raw cosines in place: those top out near 0.16, so a 0.50 gate would
  # reject every voxel and the run would silently detect nothing.
  RAYFRONTS_COMPUTE_PROB: "True"

# ── scene templates ────────────────────────────────────────────────────────
# Per-scene inputs (map, stage scale, spawn height, query, thresholds, search
# area), anchored once and merged into that scene's three spawn entries via
# `<<:` so all three start locations run byte-identical settings. STAGE_SCALE
# and SPAWN_HEIGHT_M are set on EVERY scene on purpose: mission_runner.apply_env
# only merges env vars, so an omitted key silently inherits the previous
# iteration's value. `scene_templates` is not a recognized top-level mission
# key — the runner ignores it; it exists only to hold the anchors.
  frontier: &frontier
    FRONTIER_ONLY_BASELINE: "true"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: frontier

  vlfm: &vlfm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "true"
    LVLM_BASELINE: "false"
    method: vlfm

  lvlm: &lvlm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "true"
    method: lvlm

  # No flag set -> the default full-coordination raven stack.
  multiraven: &multiraven
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: multi-raven

