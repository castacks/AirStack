# raven_ablation — data capture for an OFFLINE detector ablation.
#
# Eight runs, one start on each scene. The progress numbers are not the point;
# the point is to record enough to sweep detection threshold, cluster size and
# background-query set afterwards WITHOUT re-flying.
#
# COVERAGE IS THE PRODUCT. An offline sweep can only score ground truth the
# drones actually mapped — the first three-scene capture reached just 28 of 72
# annotated targets, so most "misses" were flight coverage, not detection. Hence
# VLFM_BASELINE=true with VLFM_USE_VOXEL_TARGETS=false: frontier-style costs for
# broad sweep, biased toward high-similarity rays, and no go-to-object lock to
# cut a run short. See the env block for the value-weight rescaling this needs.
#
# Four load-bearing choices:
#
# 1. RAYFRONTS_COMPUTE_PROB=False — raw cosine similarities, not a softmax over
#    the query set. Raw scores are per-label independent, so dropping a
#    background query offline leaves every other column untouched. Under softmax
#    every column moves when the vocabulary changes, so the background-query
#    ablation would need one flight per subset. This is what makes the whole
#    experiment possible.
#      => the per-scene voxel_score_threshold values below are softmax-era and
#         are MEANINGLESS on this scale. Sweep the gate offline; do not read
#         anything into the runtime detections this mission produces. With VLFM
#         driving and voxel targets off, nothing reads them anyway — VLFM ranks
#         raw cosines and never thresholds. score_threshold is already -1, which
#         is what keeps the peer ray relay from dropping every cosine-scale ray.
#
# 2. record.scope: robot — records /robot_N/rayfronts/msg_serv/voxels_sim/all,
#    the topic raven_nav actually subscribes to, on each robot's own DDS domain
#    and at its true rate. Earlier missions recorded the GCS-side
#    /rayfronts_debug/... republish, which is a visualisation relay at ~0.1 Hz —
#    far too sparse to model the temporal confirmer.
#
# 3. Every scene registers the SAME 108-label bank: 64 background
#    classes (ground, vegetation, built surface, poles, clutter — the things
#    target voxels must out-score) plus 52 annotation classes carried as
#    distractor columns. Offline you can only REMOVE columns, never add them, so
#    the bank must be a superset of every subset you may want to test.
#
# SIZE WARNING: each label adds 4 bytes per voxel. At ~70k voxels/robot this is
# ~31 MB per published cloud against ~4 MB for a normal run, recorded per robot
# at full rate. Expect very large bags and budget pod disk accordingly; the
# runner now uploads and prunes each iteration as it finishes.
#
#   airstack osmo:mission osmo/missions/raven_ablation.yaml --pool <gpu-pool>

name: raven_ablation

nas_dest: /volume4/dsta/raven-multi/

stack:
  services: [isaac-sim, robot-desktop, gcs]

env:
  NUM_ROBOTS: 3
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  RAYFRONTS_COMPUTE_PROB: "False"
  FRONTIER_ONLY_BASELINE: "false"
  # VLFM explore is the coverage policy for this capture: frontier-style costs
  # (distance + peer repulsion + novelty) biased toward high-similarity rays, so
  # the drones sweep broadly but lean at target regions. Nothing here is scored
  # online — the point is to overfly as many annotated objects as possible.
  VLFM_BASELINE: "true"
  # No voxel search. VLFM never closes on the 3D semantic field, so no run is
  # cut short by a go-to-object lock and coverage keeps growing for the full
  # 15 minutes.
  VLFM_USE_VOXEL_TARGETS: "false"
  # Raw cosines spread ~10x less than softmaxed scores, so the 300.0 default
  # leaves distance dominant and VLFM collapses into plain frontier. 1500 keeps
  # a real but not overpowering pull toward targets — full parity would be
  # ~3000, deliberately undershot here to protect coverage. Calibrate against
  # the per-component "[vlfm] explore" log line.
  VLFM_VALUE_WEIGHT: "1500.0"
  # Frontier-style ray blacklist: a reached goal is banned for 180 s, and three
  # stalls at one spot ban it outright. Keeps the drones opening new ground
  # instead of re-selecting a high-similarity frontier they already worked.
  # NOT part of VLFM — capture-only, off by default everywhere else.
  VLFM_RAY_BLACKLIST: "true"
  LVLM_BASELINE: "false"

