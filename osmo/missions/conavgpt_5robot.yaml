  # ---- DowntownWest ----
  # spawn rect s1: [[-3, -43], [9, -28]]
  - <<: *downtownwest
    name: downtownwest_s1
    SPAWN_CONFIGS: '[{"x_m": -1.0, "y_m": -41.0, "orient": [0.0, 0.0, 0.698, 0.716]}, {"x_m": 3.0, "y_m": -35.0, "orient": [0.0, 0.0, 0.736, 0.677]}, {"x_m": 7.0, "y_m": -30.0, "orient": [0.0, 0.0, 0.784, 0.621]}, {"x_m": 8.5, "y_m": -42.5, "orient": [0.0, 0.0, 0.8277, 0.5612]}, {"x_m": -3.0, "y_m": -28.0, "orient": [0.0, 0.0, 0.9024, 0.4309]}]'

