# conavgpt_5robot — FIVE-ROBOT CoNavGPT (VLM-Assign) baseline: 8 scenes x 3
# fixed start locations, minus 2 starts that cannot hold 5 drones (22 runs).
#
# The largest fleet in the repo, and the fleet size the method is actually about:
# one VLM call per round assigns all five robots, so this is where a VLM's
# division of labour can be told apart from any single robot's region choice.
#
# Method (Co-NavGPT, Yu et al. arXiv:2310.07937, "VLM-Assign" arm): every round
# ONE 2B VLM call looks at the team's shared BEV with numbered frontier regions
# and numbered robots and returns a robot -> region assignment; the assignment
# is gossiped and each robot flies to its region. A robot with no fresh
# assignment falls back to nearest-viable-frontier and the round is marked
# `fallback: true` — that degradation is a measured result, not a run failure.
# The published method is single-target with co-located starts; this is the
# multi-target, non-co-located, time-integrated adaptation.
#
# multi_raven_mission.yaml IS THE SOURCE OF TRUTH. Its scene templates, queries,
# background queries, search areas, detection thresholds, spawn layouts and
# steps block are copied verbatim here so the numbers are directly comparable
# with multi-raven / frontier / vlfm / lvlm. The ONLY intended behavioural
# differences are CONAVGPT_BASELINE=true and the fleet size.
#
# Depends on the CONAVGPT_BASELINE passthrough in
# robot/docker/robot-base-docker-compose.yaml; without it the flag never reaches
# raven_nav and this silently runs as full multi-raven coordination. Check the
# first iteration's raven log says CoNavGPT-based before trusting a sweep.
#
# DROPPED STARTS — fireacademy_s2 and constructionsite_s2 are NOT in this file.
# With drones 1-3 pinned at their source-of-truth positions (moving them would
# break comparability), neither start rectangle admits even a 4th drone at the
# 3 m minimum, let alone a 5th:
#   constructionsite_s2, rect [[-21.6,-28.3],[-24.16,-41]] (2.56 x 12.7 m):
#     drones 1-3 sit at x=-22.9, y=-30.5/-34.5/-38.5, so |dx| <= 1.3 m anywhere
#     in the rect and clearing 3 m needs |dy| >= sqrt(9-1.3^2) = 2.70 m. The
#     y-gaps are 4 m (midpoint only 2.0 m away) and the ends leave 2.2 m above
#     and 2.5 m below. Best achievable 4th: 2.81 m.
#   fireacademy_s2, quad [[12.86,32.7],[9.5,36.12],[3.1,30.8],[6.6,27.4]]:
#     drones 1-3 lie along the quad's long axis 3.19 m apart, leaving no
#     interior point further than 2.88 m from all three.
# simtime300_4robot_a/b already fly a 4th drone in both of these at 2.14 m and
# 2.88 m separation — below the stated invariant. Fix there, not here.
#
# GPU SIZING — DO NOT run this on the stock 4-GPU workflow.
# semantic_search_task._pick_rayfronts_gpu() pins rayfronts to
# ROS_DOMAIN_ID % n_gpus, and the overflow robot wraps onto GPU 0, which is
# Isaac Sim's card. At gpu:4 that is robot_4 -> GPU 0 (rayfronts OOMs against
# the sim, exactly the failure airstack-mission.yaml's comment records) AND
# robot_5 -> GPU 1 doubled up with robot_1 and the assigner. gpu:5 is no better:
# 5 % 5 = 0, so robot_5 lands on the sim's card instead. The first count that
# keeps every rayfronts off GPU 0 is SIX: 1..5 % 6 = 1..5.
# Use osmo/workflows/airstack-mission-5robot.yaml (gpu: 6), selected with
# `--workflow`:
#
#   airstack osmo:mission osmo/missions/conavgpt_5robot.yaml \
#     --pool <gpu-pool> --branch multi-raven \
#     --workflow osmo/workflows/airstack-mission-5robot.yaml
#
# Or locally on a >= 6 GPU host:
#   python3 osmo/workspace/mission_runner.py osmo/missions/conavgpt_5robot.yaml \
#     --airstack-root "$(pwd)"
#
# Schema reference: osmo/missions/README.md

name: conavgpt_5robot

# Beside the rest of the 300-sim-second family, which is the set these runs are
# scored against.
nas_dest: /volume4/dsta/raven-simtime300/

stack:
  services: [isaac-sim, robot-desktop, gcs]

env:
  NUM_ROBOTS: 5
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  # The one behavioural switch this file exists for.
  CONAVGPT_BASELINE: "true"
  # Pinned false, not left to the node defaults: Stack.apply_env only MERGES env
  # vars, and the precedence chain is frontier > vlfm > conavgpt, so a sticky
  # true from an earlier mission on the same pod would silently outrank
  # CoNavGPT and the run would be mislabelled rather than fail.
  FRONTIER_ONLY_BASELINE: "false"
  VLFM_BASELINE: "false"
  LVLM_BASELINE: "false"
  # The thresholds in the templates below are SOFTMAX probabilities; with raw
  # cosines (which top out near 0.16) a 0.5 gate rejects every voxel and the run
  # detects nothing. Set explicitly for the same sticky-env reason as above.
  RAYFRONTS_COMPUTE_PROB: "True"
  # Full comms, the same sentinel the simtime300 sweeps use. A degraded-comms
  # CoNavGPT sweep is a separate mission: it measures the fallback path, which
  # is a different question from whether the VLM assigns well.
  COMMS_RANGE_M: 5000

