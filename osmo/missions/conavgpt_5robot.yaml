# ── 22 runs: 8 scenes x 3 start locations, minus 2 that cannot hold 5 ──────
# Drones 1-3 of every layout are the source-of-truth spawns, unchanged. Drone 4
# is the spawn simtime300_4robot_a already flies, so this fleet is that fleet
# plus one — fleet size is the only thing that moves between the two sweeps.
# Derivation rule, the same for all 22 entries: drone 5 is the point of the
# spawn rectangle that maximises the distance to the NEAREST of drones 1-4
# (0.05 m grid search), and its yaw faces outward, away from the centroid of
# drones 1-4, so the fifth drone opens a new bearing instead of duplicating a
# peer's field of view. Worked through for one scene so the rest is checkable:
#   downtownwest_s1, rect [[-3,-43],[9,-28]], drones 1-4 at (-1,-41) (3,-35)
#   (7,-30) (8.5,-42.5) -> centroid (4.375, -37.125).
#   argmax-min lands on the free corner (-3,-28), at 13.15 / 9.22 / 10.20 /
#   18.51 m from drones 1-4, so the binding separation is 9.22 m >= 3 m.
#   yaw = atan2(-28 + 37.125, -3 - 4.375) = 128.95 deg
#       -> [0, 0, sin(64.475 deg), cos(64.475 deg)] = [0, 0, 0.9024, 0.4309].
