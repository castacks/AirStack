name: camera_rate_32x8_pod58
stack:
  services:
  - isaac-sim
  - robot-desktop
  - gcs
  - offboard-compute
env:
  DETECTOR_URL: http://offboard-compute:8200
  ITM_URL: http://offboard-compute:8100
  VLM_URL: http://offboard-compute:8000/v1
  CONAVGPT2_YOLO_WORLD_WEIGHTS: /root/.cache/conavgpt2_weights/yolov8l-world.pt
  CONAVGPT2_VLM_MODEL: Qwen/Qwen2.5-VL-7B-Instruct
  CONAVGPT2_VLM_QUANT: nf4
  CONAVGPT2_VLM_GPU: ''
  NUM_ROBOTS: 8
  ISAAC_SIM_HEADLESS: 'true'
  ISAAC_SIM_MULTIGPU: ''
  GCS_VIZ_DECIMATE: '2'
  ISAAC_SIM_USE_STANDALONE: 'true'
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: 'true'
  SCENE_CONFIG: ''
  FROZEN_DATASET_ROOT: omniverse://airlab-nucleus.andrew.cmu.edu:443/Projects/SEI-COA/final_disaster_dataset
  SUBURB_COLLIDERS: ground
  SPAWN_HEIGHT_M: '0.5'
  ENABLE_LIDAR: 'false'
  ZED_PITCH_DEG: '30'
  ZED_WIDTH: '720'
  ZED_HEIGHT: '450'
  MAP_ANCHOR_ENU: 'true'
  AIRSTACK_STACK: full_mighty
  LOCAL_PLANNER: mighty
  CONAVGPT_BASELINE: 'false'
  FRONTIER_ONLY_BASELINE: 'false'
  VLFM_BASELINE: 'false'
  LVLM_BASELINE: 'false'
  COMMS_RANGE_M: 5000
  GT_ANNOTATIONS: 'on'
  ISAAC_SIM_ACTIVE_GPU: '2'
  OFFBOARD_COMPUTE_GPU: '2'
  ZED_PIPELINE: mono_rgbd
  MIGHTY_CLOUD_SUFFIX: sensors/front_stereo/left/depth_pcl
  SEARCH_DEPTH_TOPIC_TEMPLATE: /{robot}/sensors/front_stereo/left/depth_ground_truth
  ZED_TIME_SLICE_GROUPS: '32'
  ZED_HYDRA_TIME_SLICE: 'true'
  ZED_TIME_SLICE_BURST: '8'
  OVERHEAD_HYDRA_TIME_SLICE: 'true'
  OVERHEAD_RENDER_BURST: '8'
  OVERHEAD_RENDER_STEP: '250'
  ISAAC_SIM_DLSS_MODE: performance
  ISAAC_SIM_DISABLE_MOTION_BVH: 'true'
  ISAAC_SIM_DISABLE_VIEWPORT_UPDATES: 'true'
  LIDAR_RENDER_STEP: '1'
  LIDAR_TIME_SLICE_GROUPS: '2'
  SEARCH_MAX_SIM_SECONDS: '600'
  START_RAYFRONTS_SERVER: 'false'
  ISAAC_SIM_GPU_PHYSICS: 'false'
  FROZEN_GROUND_ONLY_CONTACTS: 'false'
environment_order: round_robin
iterations: 1
environments:
- name: fireurbanl1v1_lawnmower
  method: lawnmower
  model_port: ''
  scene_yaml: frozen_fire_urban_lvl1.yaml
  START_DETECTOR_SERVER: 'true'
  START_ITM_SERVER: 'false'
  START_VLM_SERVER: 'false'
  FROZEN_SCENE: Fire/Urban/level_1/1
  RESULTS_SCENE: FireUrbanL1V1
  SPAWN_CONFIGS: '[{"x_m": -350.0, "y_m": -492.5, "orient": [0.0, 0.0, 0.7297, 0.6838]},
    {"x_m": -490.0, "y_m": -412.5, "orient": [0.0, 0.0, 0.3599, 0.9330]}, {"x_m":
    -482.5, "y_m": -330.0, "orient": [0.0, 0.0, 0.2208, 0.9753]}, {"x_m": -357.5,
    "y_m": -290.0, "orient": [0.0, 0.0, 0.8305, 0.5570]}, {"x_m": -257.5, "y_m": -282.5,
    "orient": [0.0, 0.0, 0.9991, 0.0417]}, {"x_m": -452.5, "y_m": -175.0, "orient":
    [0.0, 0.0, -0.4080, 0.9130]}, {"x_m": -265.0, "y_m": -150.0, "orient": [0.0, 0.0,
    -0.9017, 0.4323]}, {"x_m": -462.5, "y_m": -35.0, "orient": [0.0, 0.0, -0.5564,
    0.8309]}]'
ready:
  timeout_s: 3600
  poll_interval_s: 10
up_timeout_s: 5400
iteration_attempts: 1
on_step_failure: abort_iteration
command_route: gcs
record:
  enabled: false
  scope: gcs
  required: true
  topics:
  - /tf_static
  - /{robot}/odometry_conversion/odometry
  - /{robot}/global_plan
  - /{robot}/search/round_stats
  - /{robot}/search/run_complete
  - /{robot}/search/detection_image
  - /gcs/{robot}/map_origin
  - /gcs/{robot}/occupancy
  - /gcs/{robot}/frontiers
  - /gcs/{robot}/frontier_cloud
  - /gcs/{robot}/voxel_map
  - /gcs/{robot}/value_map
  - /gcs/{robot}/search/markers
  - /gcs/robot_markers
  - /gcs/sim_ground
  - /gcs/annotations/bboxes
steps:
- run:
    container: robot_1
    cmd: "A=/root/AirStack/robot/ros_ws/src/global/planners/raven_nav/annotations\n\
      S={{env.RESULTS_SCENE}}\nfor f in \"$A/$S.json\" \"$A/${S}_obstacles.json\"\
      \ \"$A/${S}_region.json\"; do\n  [ -f \"$f\" ] || { echo \"MISSING $f\"; exit\
      \ 1; }\ndone\npython3 - \"$A\" \"$S\" <<'EOF'\nimport json, sys\na, s = sys.argv[1],\
      \ sys.argv[2]\npeople = json.load(open(f\"{a}/{s}.json\"))\nobst = json.load(open(f\"\
      {a}/{s}_obstacles.json\"))\nreg = json.load(open(f\"{a}/{s}_region.json\"))\n\
      meta = next(e for e in reg if e.get(\"class\") == \"meta\")\nsrch = next(e for\
      \ e in reg if e.get(\"class\") == \"search\")\nprint(f\"scene {s}: {len(people)}\
      \ people, {len(obst)} obstacle boxes\")\nprint(f\"  frozen_usd  {meta.get('frozen_usd')}\"\
      )\nprint(f\"  disaster    {meta.get('disaster')} / {meta.get('scene_config')}\"\
      )\nprint(f\"  search area {srch['area_m2']:,.0f} m2 \"\n      f\"({meta['search_frac_of_plate']:.0%}\
      \ of the plate), \"\n      f\"{len(srch['polygon_xy'])} pts\")\nprint(f\"  people\
      \ inside the search {meta['people_inside_search']}\"\n      f\"/{meta['people_total']}\"\
      )\nassert len(people) == meta[\"people_total\"], \"people GT / region disagree\"\
      \nassert meta[\"people_inside_search\"] > 0, \"no survivor is in the search\
      \ area\"\nEOF\n"
    timeout_s: 120
- run:
    container: robot_1
    cmd: "MP=\"{{env.model_port}}\"\necho \"waiting for offboard-compute: detector\
      \ :8200${MP:+ + model :$MP}\"\nfor i in $(seq 1 360); do\n  d=$(curl -sf http://offboard-compute:8200/health\
      \ 2>/dev/null | grep -c '\"status\": *\"ok\"')\n  if [ -n \"$MP\" ]; then\n\
      \    m=$(curl -sf \"http://offboard-compute:$MP/health\" 2>/dev/null | grep\
      \ -c '\"status\": *\"ok\"')\n  else\n    m=1\n  fi\n  if [ \"$d\" = \"1\" ]\
      \ && [ \"$m\" = \"1\" ]; then\n    echo OFFBOARD_READY\n    curl -s http://offboard-compute:8200/health\
      \ | head -c 300; echo\n    [ -n \"$MP\" ] && { curl -s \"http://offboard-compute:$MP/health\"\
      \ | head -c 200; echo; }\n    exit 0\n  fi\n  sleep 15\ndone\necho OFFBOARD_NOT_READY;\
      \ exit 1\n"
    timeout_s: 5700
    attempts: 2
    retry_delay_s: 20
- run:
    container: robot_1
    cmd: "mkdir -p /tmp/search\n: > /tmp/search/server_metrics.jsonl\nnohup bash -c\
      \ '\n  for i in $(seq 1 500); do\n    ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)\n  \
      \  det=$(curl -s --max-time 5 http://offboard-compute:8200/metrics 2>/dev/null);\
      \ [ -n \"$det\" ] || det=\"{}\"\n    itm=$(curl -s --max-time 5 http://offboard-compute:8100/metrics\
      \ 2>/dev/null); [ -n \"$itm\" ] || itm=\"{}\"\n    vlm=$(curl -s --max-time\
      \ 5 http://offboard-compute:8000/metrics 2>/dev/null); [ -n \"$vlm\" ] || vlm=\"\
      {}\"\n    printf \"{\\\"ts\\\":\\\"%s\\\",\\\"detector\\\":%s,\\\"itm\\\":%s,\\\
      \"vlm\\\":%s}\\n\" \"$ts\" \"$det\" \"$itm\" \"$vlm\" >> /tmp/search/server_metrics.jsonl\n\
      \    sleep 15\n  done\n' > /tmp/search/server_metrics_poller.log 2>&1 &\necho\
      \ $! > /tmp/search/poller.pid\necho POLLER_STARTED pid=$(cat /tmp/search/poller.pid)\n"
    timeout_s: 60
- run:
    container: airstack-robot-desktop-{n}
    cmd: "source /root/.bashrc >/dev/null 2>&1 || true\nexport ROBOT_NAME=robot_{n}\n\
      export ROS_DOMAIN_ID={n}\nfor i in $(seq 1 36); do\n  if ros2 node list 2>/dev/null\
      \ | grep -qx \"/robot_{n}/mighty/mighty_bridge\"; then\n    echo \"BRIDGE_UP\
      \ robot_{n}\"\n    grep -ah \"mighty_bridge up\" /root/.ros/log/mighty_bridge_*.log\
      \ 2>/dev/null | tail -1\n    ros2 action list 2>/dev/null | grep -qx \"/robot_{n}/tasks/navigate\"\
      \ \\\n      && echo \"NAVIGATE_ACTION_PRESENT robot_{n}\" \\\n      || echo\
      \ \"WARN: /robot_{n}/tasks/navigate not advertised\"\n    exit 0\n  fi\n  sleep\
      \ 5\ndone\necho \"BRIDGE_MISSING robot_{n}: no /robot_{n}/mighty/mighty_bridge\
      \ after 180 s.\"\necho \"Without it nothing serves tasks/navigate, nothing follows\
      \ /global_plan,\"\necho \"nothing publishes trajectory_override \u2014 the drone\
      \ will take off and hover.\"\necho \"--- mighty namespace as seen on this domain\
      \ ---\"\nros2 node list 2>/dev/null | grep \"/mighty/\" || echo \"(no mighty\
      \ nodes at all)\"\necho \"--- bring-up pane, mighty_bridge lines ---\"\ntmux\
      \ capture-pane -p -S -30000 -t bringup:0.0 2>/dev/null \\\n  | grep -a \"mighty_bridge\"\
      \ | tail -60 || echo \"(pane history already rolled over)\"\nexit 1\n"
    timeout_s: 300
- run:
    container: airstack-robot-desktop-{n}
    cmd: "source /root/.bashrc >/dev/null 2>&1 || true\nexport ROBOT_NAME=robot_{n}\n\
      export ROS_DOMAIN_ID={n}\n# The optimized benchmark uses simulator RGB-D (`mono_rgbd`),\
      \ which\n# intentionally bypasses stereo matching and therefore never publishes\n\
      # `/perception/stereo_image_proc/disparity`.  Validate the cloud Mighty\n# actually\
      \ consumes without subscribing to it (subscribing here would\n# open the high-bandwidth\
      \ DDS bridge route and can exhaust router RAM).\nif [ \"${ZED_PIPELINE:-}\"\
      \ = \"mono_rgbd\" ]; then\n  PC=/robot_{n}/$(printenv MIGHTY_CLOUD_SUFFIX)\n\
      \  npub=0; mapper_sub=0\n  for i in $(seq 1 30); do\n    npub=$(ros2 topic info\
      \ \"$PC\" 2>/dev/null \\\n           | grep -oE \"Publisher count: [0-9]+\"\
      \ | grep -oE \"[0-9]+\")\n    npub=${npub:-0}\n    info=$(ros2 topic info \"\
      $PC\" --verbose 2>/dev/null || true)\n    if printf '%s\\n' \"$info\" \\\n \
      \        | grep -A4 -F \"Node name: global_mapper_ros\" \\\n         | grep\
      \ -qF \"Node namespace: /robot_{n}/mighty\"; then\n      mapper_sub=1\n    fi\n\
      \    if [ \"$npub\" -gt 0 ] && [ \"$mapper_sub\" = \"1\" ]; then\n      echo\
      \ \"PERCEPTION_OK robot_{n}: $PC has $npub publisher(s) and global_mapper_ros\
      \ subscribes\"\n      exit 0\n    fi\n    sleep 5\n  done\n  echo \"PERCEPTION_DEAD\
      \ robot_{n}: $PC publisher_count=$npub mapper_sub=$mapper_sub\"\n  ros2 topic\
      \ info \"$PC\" --verbose 2>/dev/null || true\n  exit 1\nfi\n# PROBE THE DISPARITY,\
      \ NOT THE CLOUD OR THE IMAGE. Both of those are on\n# the dds_router ALLOWLIST\
      \ (`onboard_all/config/dds_router.yaml`:\n# `.../front_stereo/left/image_rect`\
      \ and\n# `.../perception/stereo_image_proc/point_cloud`), and `ros2 topic hz`\n\
      # creates a READER \u2014 which activates the robot->GCS bridge for a\n# ~21\
      \ MB/s point cloud that nothing on the GCS side consumes, so the\n# router buffers\
      \ it without bound.\n#\n# That is not hypothetical: on 2026-08-30 this step\
      \ ran at 22:01:00 and\n# robot_2's ddsrouter went 114 MB -> 66,225 MB in dead-linear\
      \ fashion\n# over the next 80 minutes (growth ~21 MB/s, i.e. exactly the cloud's\n\
      # bitrate), the container reached 74.8 GB, and robot_2 vanished from\n# the\
      \ bag \u2014 230 odometry messages against ~19,730 for every other\n# robot,\
      \ and ZERO global_plan / markers / occupancy / voxel_map. The\n# robot itself\
      \ flew fine (its own planner.log: 4,741 ticks, 25 gate\n# passes, 2 people visited);\
      \ only its telemetry was lost. The router\n# config's own rayfronts note records\
      \ the same failure mode: RSS\n# 130 MB -> 870 MB on point-cloud streams until\
      \ \"it died and took every\n# later iteration with it\".\n#\n# `/perception/stereo_image_proc/disparity`\
      \ is NOT allowlisted, so\n# subscribing to it creates no cross-domain route\
      \ \u2014 and it is a\n# STRICTLY STRONGER signal: disparity exists only if BOTH\
      \ rectified\n# images arrived and the block matcher ran, and `point_cloud` is\n\
      # produced from it by the very next node in the same launch file.\nDISP=/robot_{n}/perception/stereo_image_proc/disparity\n\
      PC=/robot_{n}/perception/stereo_image_proc/point_cloud\nok_disp=0; npub=0\n\
      for i in $(seq 1 20); do\n  if [ \"$ok_disp\" = \"0\" ]; then\n    timeout 20\
      \ ros2 topic hz \"$DISP\" 2>/dev/null \\\n      | grep -m1 -q \"average rate\"\
      \ && ok_disp=1\n  fi\n  if [ \"$ok_disp\" = \"1\" ]; then\n    # `topic info`\
      \ does NOT subscribe, so this cannot open a route.\n    npub=$(ros2 topic info\
      \ \"$PC\" 2>/dev/null \\\n           | grep -oE \"Publisher count: [0-9]+\"\
      \ | grep -oE \"[0-9]+\")\n    npub=${npub:-0}\n    if [ \"$npub\" -gt 0 ]; then\n\
      \      echo \"PERCEPTION_OK robot_{n}: $DISP streaming, $PC has $npub publisher(s)\"\
      \n      exit 0\n    fi\n  fi\n  sleep 5\ndone\necho \"PERCEPTION_DEAD robot_{n}:\
      \ disparity=$ok_disp cloud_publishers=$npub\"\necho \"This robot will take off\
      \ and hover: with no point cloud the\"\necho \"global mapper never builds a\
      \ map, mighty's KD-tree stays null,\"\necho \"no trajectory_override is ever\
      \ published, and every goal the\"\necho \"search planner picks is eventually\
      \ blacklisted. Seen on robot_3\"\necho \"in the 2026-08-30 09:09:51 run (10\
      \ m flown in 108 minutes).\"\necho \"--- is the sim publishing to this domain\
      \ at all ---\"\nros2 topic list 2>/dev/null | grep -c \"/robot_{n}/sensors/\"\
      \ || true\necho \"--- perception nodes on this domain ---\"\nros2 node list\
      \ 2>/dev/null | grep -E \"stereo|point_cloud|disparity|global_mapper\" \\\n\
      \  || echo \"(no perception nodes)\"\necho \"--- global_mapper log, PointCloudCallback\
      \ lines ---\"\ngrep -ah \"PointCloudCallback\" /root/.ros/log/global_mapper_node_*.log\
      \ 2>/dev/null \\\n  | tail -20 || echo \"(the callback never fired \u2014 not\
      \ one line)\"\nexit 1\n"
    timeout_s: 420
- run:
    container: airstack-robot-desktop-{n}
    cmd: source /opt/ros/jazzy/setup.bash; export ROS_DOMAIN_ID={n}; python3 /root/AirStack/scripts/measure_camera_rates.py
      --robot robot_{n} --seconds 120
    timeout_s: 180
