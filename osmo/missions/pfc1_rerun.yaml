# pfc1_rerun — the 28 runs the 1st-PFC sweep still owes us.
#
# Two reasons a run is here.
#
# A. The goal changed, so the old result is void:
#
#   DowntownWest x 3 starts x 3 methods       the scene's background queries were
#     (frontier, vlfm, multi-raven)           reworked (cafe table / food stand /
#                                             sidewalk / umbrella in, electric
#                                             cables out) and its voxel gate
#                                             raised to 0.67. LVLM is exempt: it
#                                             has no semantic mapper, so neither
#                                             change reaches it.
#   ModernCityDowntown x 3 starts x 3 methods its query said "cafe tables" while
#     (frontier, vlfm, multi-raven)           the annotation class is "cafe
#                                             table" — the plural matched
#                                             nothing, so 2 of the scene's 14
#                                             objects were invisible to the
#                                             offline scorer. The query is now
#                                             singular, and "car" has been
#                                             dropped from the background list it
#                                             shared with the target list.
#
# B. The fleet was a robot short. `trajectory_progress.py` flags a run when a
#    robot's maximum displacement inside the search window stays under 15 m or
#    it flies less than 20 m — it took off and hovered, so the scene was searched
#    by two drones and the run is not comparable with a full one:
#
#   multi-raven  fireacademy s1/s2/s3, abandonedfactory s3   robot_2 lost its GPU
#                                             to Isaac Sim and never got a
#                                             navigator (fixed: 4 GPUs, one
#                                             pinned per robot).
#   lvlm         constructionsite s1, fireacademy s2,        robot took off and
#                moderncitydowntown s3                       never departed.
#   vlfm         fireacademy s2, retroneighborhood s3,       near-range goal
#                moderncitydowntown s3                       selection: the
#                                             planner kept picking waypoints
#                                             ~5 m away, so the drone stayed put.
#                                             Not yet fixed — these may repeat.
#   multi-raven  militarybase s3               robot_1 held a `[ray]` "radio
#                                             tower" hypothesis 4.5 m from its
#                                             own spawn for all 297 coordination
#                                             ticks, committed, never exploring,
#                                             with 30 targets left unassigned. It
#                                             flew 6 m in 15 minutes.
#
# constructionsite_s3 and shipyard_s2 are deliberately absent: they have never
# armed in any sweep — 28 attempts, 0 successes, always MAVROS connected but
# PX4's EKF never converging, so `local_position/odom` never publishes. Widening
# their polygons and raising the ready timeout to 900 s changed nothing. They
# stay out until the PX4 preflight rejection is diagnosed rather than burning
# ~40 min of GPU per attempt.
#
# This mission cycles the method *within* one run: mission_runner calls
# apply_env(env_exports(entry)) before each iteration's `airstack up`, so the
# UPPERCASE keys on an environment entry reach the container. apply_env only
# ever *sets* keys, never clears them, so every entry states all three baseline
# flags explicitly — exactly one true, or all three false for multi-raven.
#
# Scene templates, SPAWN_CONFIGS, queries and thresholds are copied from
# multi_raven_mission.yaml (the source of truth — keep the five in lockstep).
#
# Run on OSMO (4 GPU / 24 CPU / 96Gi / 500Gi — GPU 0 is Isaac Sim, robot N gets GPU N):
#   airstack osmo:mission osmo/missions/pfc1_rerun.yaml --pool <gpu-pool>
#
# Or locally:
#   python3 osmo/workspace/mission_runner.py osmo/missions/pfc1_rerun.yaml \
#     --airstack-root "$(pwd)"
#
# Schema reference: osmo/missions/README.md

name: pfc1_rerun

nas_dest: /volume4/dsta/raven-multi/

stack:
  services: [isaac-sim, robot-desktop, gcs]

env:
  NUM_ROBOTS: 3
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  # Methods are selected per environment entry below; these are the defaults
  # each entry then overrides.
  FRONTIER_ONLY_BASELINE: "false"
  VLFM_BASELINE: "false"
  LVLM_BASELINE: "false"

# ── method anchors ─────────────────────────────────────────────────────────
baseline_templates:

  frontier: &frontier
    FRONTIER_ONLY_BASELINE: "true"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: frontier

  vlfm: &vlfm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "true"
    LVLM_BASELINE: "false"
    method: vlfm

  lvlm: &lvlm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "true"
    method: lvlm

  # No flag set -> the default full-coordination raven stack.
  multiraven: &multiraven
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: multi-raven

# ── scene anchors ──────────────────────────────────────────────────────────
