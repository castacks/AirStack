# pfc1_rerun — the 14 runs the 1st-PFC sweep still owes us.
#
# A. Never armed. The previous pass split this mission in two and ran both
#    concurrently; the first four iterations of *each* half failed with
#    `robots [1,2,3] not ready within 900s (connected so far: [])` — MAVROS
#    never connected — while the remaining ten of each ran clean. Nothing about
#    these eight spawns is otherwise distinctive, so they are simply owed:
#
#      downtownwest s1        frontier, vlfm, multi-raven
#      downtownwest s2        frontier
#      moderncitydowntown s1  frontier, vlfm, multi-raven
#      moderncitydowntown s2  frontier
#
# B. Flew a robot short. `trajectory_progress.py` flags a run when a robot's
#    maximum displacement inside the search window stays under 15 m or it flies
#    less than 20 m. All four are the same open defect — the planner keeps
#    selecting goals 3-8 m away where a healthy robot is sent ~43 m, so the drone
#    arrives and the next goal is just as close. Two have now failed this way
#    twice running, so they may repeat:
#
#      vlfm         downtownwest s2         robot_2, 265 goals at a 5.4 m median
#      vlfm         retroneighborhood s3    robot_2, 304 goals at a 7.1 m median
#      multi-raven  fireacademy s1          robot_1, assigned target 7.8 m away
#      multi-raven  militarybase s3         robot_1, assigned target 3.2 m away
#
# C. FireAcademy s2 and s3 for multi-raven, which flew clean but are worth a
#    repeat: with s1 still a robot short, the scene rests on two runs that
#    disagree by 0.4 (0.200 and 0.600 of 10 objects). Its earlier two-robot
#    flights averaged 0.567 against the current 0.400, which is inside the
#    +/-0.19 run-to-run spread DowntownWest established but leaves the scene
#    resting on too little.
#
# constructionsite_s3 and shipyard_s2 are deliberately absent: they have never
# armed in any sweep — 28 attempts, 0 successes, always MAVROS connected but
# PX4's EKF never converging, so `local_position/odom` never publishes. Widening
# their polygons and raising the ready timeout to 900 s changed nothing. They
# stay out until the PX4 preflight rejection is diagnosed rather than burning
# ~40 min of GPU per attempt.
#
# This mission cycles the method *within* one run: mission_runner calls
# apply_env(env_exports(entry)) before each iteration's `airstack up`, so the
# UPPERCASE keys on an environment entry reach the container. apply_env only
# ever *sets* keys, never clears them, so every entry states all three baseline
# flags explicitly — exactly one true, or all three false for multi-raven.
#
# Scene templates, SPAWN_CONFIGS, queries and thresholds are copied from
# multi_raven_mission.yaml (the source of truth — keep the five in lockstep).
#
# Run on OSMO (4 GPU / 24 CPU / 96Gi / 500Gi — GPU 0 is Isaac Sim, robot N gets GPU N):
#   airstack osmo:mission osmo/missions/pfc1_rerun.yaml --pool <gpu-pool>
#
# Or locally:
#   python3 osmo/workspace/mission_runner.py osmo/missions/pfc1_rerun.yaml \
#     --airstack-root "$(pwd)"
#
# Schema reference: osmo/missions/README.md

name: pfc1_rerun

nas_dest: /volume4/dsta/raven-multi/

stack:
  services: [isaac-sim, robot-desktop, gcs]

env:
  NUM_ROBOTS: 3
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  # Methods are selected per environment entry below; these are the defaults
  # each entry then overrides.
  FRONTIER_ONLY_BASELINE: "false"
  VLFM_BASELINE: "false"
  LVLM_BASELINE: "false"

# ── method anchors ─────────────────────────────────────────────────────────
baseline_templates:

  frontier: &frontier
    FRONTIER_ONLY_BASELINE: "true"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: frontier

  vlfm: &vlfm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "true"
    LVLM_BASELINE: "false"
    method: vlfm

  lvlm: &lvlm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "true"
    method: lvlm

  # No flag set -> the default full-coordination raven stack.
  multiraven: &multiraven
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: multi-raven

