# pfc1_rerun — the 18 runs the first PFC sweep still owes us.
#
# 6 environments x 3 baselines (frontier / vlfm / lvlm), one iteration each:
#
#   downtownwest_s1/s2/s3  re-run: the scene now carries 7 cars + 4 trucks
#                          (example_multi_drone_scene_import.py), the query is
#                          "fountain, car, truck" instead of "fountain" alone
#                          (1 -> 12 ground-truth targets), and the search area
#                          was widened to x[-260,160] y[-100,100] so every one
#                          of those 12 is reachable.
#   constructionsite_s3    never flew: bring-up timed out in all three missions
#                          ("robots [1,2,3] not ready within 600s", 3/3 attempts)
#   shipyard_s2            same bring-up failure, all three missions
#   shipyard_s3            flew but the result is void: its spawn (y ~ -205) sat
#                          outside the old +/-150 search polygon, so raven had no
#                          in-polygon frontier to chase and the fleet covered
#                          65 m in 15 minutes. The polygon is now +/-250.
#
# Unlike the four per-baseline mission files, this one cycles the baseline
# *within* one mission: mission_runner calls apply_env(env_exports(entry)) before
# each iteration's `airstack up`, so the UPPERCASE keys on an environment entry
# reach the container. apply_env only ever *sets* keys, never clears them, so
# every entry states all three flags explicitly — exactly one true.
#
# Scene templates, SPAWN_CONFIGS, queries and thresholds are copied verbatim from
# multi_raven_mission.yaml (the source of truth — keep the five in lockstep).
#
# Run on OSMO (3 GPU / 24 CPU / 96Gi / 500Gi):
#   airstack osmo:mission osmo/missions/pfc1_rerun.yaml --pool <gpu-pool>
#
# Or locally:
#   python3 osmo/workspace/mission_runner.py osmo/missions/pfc1_rerun.yaml \
#     --airstack-root "$(pwd)"
#
# Schema reference: osmo/missions/README.md

name: pfc1_rerun

nas_dest: /volume4/dsta/raven-multi/

stack:
  services: [isaac-sim, robot-desktop, gcs]

env:
  NUM_ROBOTS: 3
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  # Baselines are selected per environment entry below, not here — these are the
  # defaults every entry then overrides.
  FRONTIER_ONLY_BASELINE: "false"
  VLFM_BASELINE: "false"
  LVLM_BASELINE: "false"

# ── baseline anchors ───────────────────────────────────────────────────────
# Merged into each entry with `<<:`. Exactly one flag true; the other two are
# stated so the previous iteration's setting can't leak forward.
baseline_templates:
  frontier: &frontier
    FRONTIER_ONLY_BASELINE: "true"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: frontier

  vlfm: &vlfm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "true"
    LVLM_BASELINE: "false"
    method: vlfm

  lvlm: &lvlm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "true"
    method: lvlm

# ── scene anchors ──────────────────────────────────────────────────────────
scene_templates:
  downtownwest: &downtownwest
    ENV_URL: "Library/Stages/Dmytro/downtown_edited_v3_818.usd"
    STAGE_SCALE: "1.0"
    SPAWN_HEIGHT_M: "0.2"
    RESULTS_SCENE: "DowntownWest"
    query: "fountain, car, truck"
    background_queries: "grass, road, tree, building, street lamp, electric cables"
    voxel_score_threshold: 0.65
    score_threshold: -1
    voxel_min_cluster_size: -1
    # Widened from x[-150,150] y[-80,80]: truck_1 (7.8, -89.5) and truck_4
    # (-245.0, 39.0) fall outside the old polygon and would be unreachable.
    search_area:
      points:
        - {x: 160.0, y: 100.0, z: 0.0}
        - {x: 160.0, y: -100.0, z: 0.0}
        - {x: -260.0, y: -100.0, z: 0.0}
        - {x: -260.0, y: 100.0, z: 0.0}

  constructionsite: &constructionsite
    ENV_URL: "Library/Stages/ConstructionSite/ConstructionSite.stage.usd"
    STAGE_SCALE: "0.01"
    SPAWN_HEIGHT_M: "0.2"
    RESULTS_SCENE: "ConstructionSite"
    query: "forklift, tower crane, blue tarp, orange tarp"
    background_queries: "road, grass, mountain, parking lot, building, fence, container, gravel"
    voxel_score_threshold: 0.65
    score_threshold: -1
    voxel_min_cluster_size: -1
    search_area:
      points:
        - {x: 76.0, y: 50.0, z: 0.0}
        - {x: 76.0, y: -71.0, z: 0.0}
        - {x: -37.0, y: -67.0, z: 0.0}
        - {x: -40.0, y: 50.0, z: 0.0}

  shipyard: &shipyard
    ENV_URL: "Library/Stages/Dmytro/edit_v1_shipyard.usd"
    STAGE_SCALE: "1.0"
    SPAWN_HEIGHT_M: "2.0"
    RESULTS_SCENE: "Shipyard"
    query: "ship, crane"
    background_queries: "grass, road, tree, warehouse, pipe, fence"
    voxel_score_threshold: 0.65
    score_threshold: -1
    voxel_min_cluster_size: -1
    # Widened from +/-150 so shipyard_s3's spawn (y ~ -205) is inside the polygon.
    search_area:
      points:
        - {x: -250.0, y: 250.0, z: 0.0}
        - {x: 250.0, y: 250.0, z: 0.0}
        - {x: 250.0, y: -250.0, z: 0.0}
        - {x: -250.0, y: -250.0, z: 0.0}

# ── 18 runs: 6 environments x 3 baselines ──────────────────────────────────
# SPAWN_CONFIGS are byte-identical to the four per-baseline mission files.
# The three baselines for one environment are adjacent so a scene-level failure
# shows up as three consecutive bad iterations rather than three scattered ones.
environments:
  # ---- DowntownWest s1 ----
  - <<: [*downtownwest, *frontier]
    name: downtownwest_s1_frontier
    SPAWN_CONFIGS: '[{"x_m": -1.0, "y_m": -41.0, "orient": [0.0, 0.0, 0.698, 0.716]}, {"x_m": 3.0, "y_m": -35.0, "orient": [0.0, 0.0, 0.736, 0.677]}, {"x_m": 7.0, "y_m": -30.0, "orient": [0.0, 0.0, 0.784, 0.621]}]'
  - <<: [*downtownwest, *vlfm]
    name: downtownwest_s1_vlfm
    SPAWN_CONFIGS: '[{"x_m": -1.0, "y_m": -41.0, "orient": [0.0, 0.0, 0.698, 0.716]}, {"x_m": 3.0, "y_m": -35.0, "orient": [0.0, 0.0, 0.736, 0.677]}, {"x_m": 7.0, "y_m": -30.0, "orient": [0.0, 0.0, 0.784, 0.621]}]'
  - <<: [*downtownwest, *lvlm]
    name: downtownwest_s1_lvlm
    SPAWN_CONFIGS: '[{"x_m": -1.0, "y_m": -41.0, "orient": [0.0, 0.0, 0.698, 0.716]}, {"x_m": 3.0, "y_m": -35.0, "orient": [0.0, 0.0, 0.736, 0.677]}, {"x_m": 7.0, "y_m": -30.0, "orient": [0.0, 0.0, 0.784, 0.621]}]'

  # ---- DowntownWest s2 ----
  - <<: [*downtownwest, *frontier]
    name: downtownwest_s2_frontier
    SPAWN_CONFIGS: '[{"x_m": -33.0, "y_m": 59.0, "orient": [0.0, 0.0, -0.8583, 0.5132]}, {"x_m": -25.0, "y_m": 62.0, "orient": [0.0, 0.0, -0.561, 0.8278]}, {"x_m": -16.0, "y_m": 64.5, "orient": [0.0, 0.0, -0.1586, 0.9873]}]'
  - <<: [*downtownwest, *vlfm]
    name: downtownwest_s2_vlfm
    SPAWN_CONFIGS: '[{"x_m": -33.0, "y_m": 59.0, "orient": [0.0, 0.0, -0.8583, 0.5132]}, {"x_m": -25.0, "y_m": 62.0, "orient": [0.0, 0.0, -0.561, 0.8278]}, {"x_m": -16.0, "y_m": 64.5, "orient": [0.0, 0.0, -0.1586, 0.9873]}]'
  - <<: [*downtownwest, *lvlm]
    name: downtownwest_s2_lvlm
    SPAWN_CONFIGS: '[{"x_m": -33.0, "y_m": 59.0, "orient": [0.0, 0.0, -0.8583, 0.5132]}, {"x_m": -25.0, "y_m": 62.0, "orient": [0.0, 0.0, -0.561, 0.8278]}, {"x_m": -16.0, "y_m": 64.5, "orient": [0.0, 0.0, -0.1586, 0.9873]}]'

  # ---- DowntownWest s3 ----
  - <<: [*downtownwest, *frontier]
    name: downtownwest_s3_frontier
    SPAWN_CONFIGS: '[{"x_m": -120.0, "y_m": -0.5, "orient": [0.0, 0.0, -0.4343, 0.9007]}, {"x_m": -115.5, "y_m": 3.0, "orient": [0.0, 0.0, -0.013, 0.9999]}, {"x_m": -111.0, "y_m": 6.5, "orient": [0.0, 0.0, 0.4108, 0.9117]}]'
  - <<: [*downtownwest, *vlfm]
    name: downtownwest_s3_vlfm
    SPAWN_CONFIGS: '[{"x_m": -120.0, "y_m": -0.5, "orient": [0.0, 0.0, -0.4343, 0.9007]}, {"x_m": -115.5, "y_m": 3.0, "orient": [0.0, 0.0, -0.013, 0.9999]}, {"x_m": -111.0, "y_m": 6.5, "orient": [0.0, 0.0, 0.4108, 0.9117]}]'
  - <<: [*downtownwest, *lvlm]
    name: downtownwest_s3_lvlm
    SPAWN_CONFIGS: '[{"x_m": -120.0, "y_m": -0.5, "orient": [0.0, 0.0, -0.4343, 0.9007]}, {"x_m": -115.5, "y_m": 3.0, "orient": [0.0, 0.0, -0.013, 0.9999]}, {"x_m": -111.0, "y_m": 6.5, "orient": [0.0, 0.0, 0.4108, 0.9117]}]'

  # ---- ConstructionSite s3 (never flew) ----
  - <<: [*constructionsite, *frontier]
    name: constructionsite_s3_frontier
    SPAWN_CONFIGS: '[{"x_m": -57.0, "y_m": 3.4, "orient": [0.0, 0.0, -0.506, 0.8625]}, {"x_m": -53.8, "y_m": 3.9, "orient": [0.0, 0.0, -0.0941, 0.9956]}, {"x_m": -55.5, "y_m": 7.6, "orient": [0.0, 0.0, 0.3355, 0.942]}]'
  - <<: [*constructionsite, *vlfm]
    name: constructionsite_s3_vlfm
    SPAWN_CONFIGS: '[{"x_m": -57.0, "y_m": 3.4, "orient": [0.0, 0.0, -0.506, 0.8625]}, {"x_m": -53.8, "y_m": 3.9, "orient": [0.0, 0.0, -0.0941, 0.9956]}, {"x_m": -55.5, "y_m": 7.6, "orient": [0.0, 0.0, 0.3355, 0.942]}]'
  - <<: [*constructionsite, *lvlm]
