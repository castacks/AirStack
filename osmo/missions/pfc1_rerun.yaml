# pfc1_rerun — DowntownWest only, all four methods.
#
# 3 start locations x 4 methods (frontier / vlfm / lvlm / multi-raven) = 12 runs.
#
# Why DowntownWest is re-flown: the scene now carries 7 cars + 4 trucks placed by
# example_multi_drone_scene_import.py, with ground-truth boxes generated by
# simulation/isaac-sim/utils/vehicle_annotations.py. The query went from
# "fountain" alone (1 target — a single object flipping between hit and miss,
# worth no statistical weight) to "fountain, car, truck" (12 targets), and the
# search area was widened to x[-260,160] y[-100,100] so all 12 are reachable:
# truck_1 (7.8, -89.5) and truck_4 (-245.0, 39.0) sat outside the old polygon.
#
# This file previously also covered constructionsite_s3, shipyard_s2 and
# shipyard_s3. shipyard_s3 has since been re-flown for the three baselines.
# constructionsite_s3 and shipyard_s2 have never armed in any sweep — 28
# attempts, 0 successes, all with the same signature (MAVROS connects, PX4's EKF
# never converges, so `local_position/odom` never publishes and nothing can arm).
# Widening their polygons and raising the ready timeout to 900 s changed nothing,
# so they are out until the PX4 preflight rejection is diagnosed rather than
# burning another ~40 min of GPU per attempt.
#
# Unlike the four per-baseline mission files, this one cycles the method *within*
# one mission: mission_runner calls apply_env(env_exports(entry)) before each
# iteration's `airstack up`, so the UPPERCASE keys on an environment entry reach
# the container. apply_env only ever *sets* keys, never clears them, so every
# entry states all three baseline flags explicitly — exactly one true, or all
# three false for multi-raven (full coordination is the default stack).
#
# Scene template, SPAWN_CONFIGS, query and thresholds are copied verbatim from
# multi_raven_mission.yaml (the source of truth — keep the five in lockstep).
#
# Run on OSMO (4 GPU / 24 CPU / 96Gi / 500Gi — GPU 0 is Isaac Sim, robot N gets GPU N):
#   airstack osmo:mission osmo/missions/pfc1_rerun.yaml --pool <gpu-pool>
#
# Or locally:
#   python3 osmo/workspace/mission_runner.py osmo/missions/pfc1_rerun.yaml \
#     --airstack-root "$(pwd)"
#
# Schema reference: osmo/missions/README.md

name: pfc1_rerun

nas_dest: /volume4/dsta/raven-multi/

stack:
  services: [isaac-sim, robot-desktop, gcs]

env:
  NUM_ROBOTS: 3
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"
  # Baselines are selected per environment entry below, not here — these are the
  # defaults every entry then overrides.
  FRONTIER_ONLY_BASELINE: "false"
  VLFM_BASELINE: "false"
  LVLM_BASELINE: "false"

# ── baseline anchors ───────────────────────────────────────────────────────
# Merged into each entry with `<<:`. Exactly one flag true; the other two are
# stated so the previous iteration's setting can't leak forward.
baseline_templates:
  frontier: &frontier
    FRONTIER_ONLY_BASELINE: "true"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: frontier

  vlfm: &vlfm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "true"
    LVLM_BASELINE: "false"
    method: vlfm

  lvlm: &lvlm
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "true"
    method: lvlm

  # No flag set -> the default full-coordination raven stack.
  multiraven: &multiraven
    FRONTIER_ONLY_BASELINE: "false"
    VLFM_BASELINE: "false"
    LVLM_BASELINE: "false"
    method: multi-raven

# ── scene anchors ──────────────────────────────────────────────────────────
scene_templates:
  downtownwest: &downtownwest
    ENV_URL: "Library/Stages/Dmytro/downtown_edited_v3_818.usd"
    STAGE_SCALE: "1.0"
    SPAWN_HEIGHT_M: "0.2"
    RESULTS_SCENE: "DowntownWest"
    query: "fountain, car, truck"
    background_queries: "grass, road, tree, building, street lamp, electric cables, cafe tables, food stand"
    voxel_score_threshold: 0.65
    score_threshold: -1
    voxel_min_cluster_size: -1
    # Widened from x[-150,150] y[-80,80]: truck_1 (7.8, -89.5) and truck_4
    # (-245.0, 39.0) fall outside the old polygon and would be unreachable.
    search_area:
      points:
        - {x: 160.0, y: 100.0, z: 0.0}
        - {x: 160.0, y: -100.0, z: 0.0}
        - {x: -260.0, y: -100.0, z: 0.0}
        - {x: -260.0, y: 100.0, z: 0.0}

# ── 12 runs: DowntownWest x 3 start locations x 4 methods ──────────────────
# SPAWN_CONFIGS are byte-identical to the four per-baseline mission files.
# The four methods for one start location are adjacent, so a start-specific
# failure shows up as consecutive bad iterations rather than scattered ones.
environments:
  # ---- DowntownWest s1 ----
  - <<: [*downtownwest, *frontier]
    name: downtownwest_s1_frontier
    SPAWN_CONFIGS: '[{"x_m": -1.0, "y_m": -41.0, "orient": [0.0, 0.0, 0.698, 0.716]}, {"x_m": 3.0, "y_m": -35.0, "orient": [0.0, 0.0, 0.736, 0.677]}, {"x_m": 7.0, "y_m": -30.0, "orient": [0.0, 0.0, 0.784, 0.621]}]'
  - <<: [*downtownwest, *vlfm]
    name: downtownwest_s1_vlfm
    SPAWN_CONFIGS: '[{"x_m": -1.0, "y_m": -41.0, "orient": [0.0, 0.0, 0.698, 0.716]}, {"x_m": 3.0, "y_m": -35.0, "orient": [0.0, 0.0, 0.736, 0.677]}, {"x_m": 7.0, "y_m": -30.0, "orient": [0.0, 0.0, 0.784, 0.621]}]'
  - <<: [*downtownwest, *lvlm]
    name: downtownwest_s1_lvlm
    SPAWN_CONFIGS: '[{"x_m": -1.0, "y_m": -41.0, "orient": [0.0, 0.0, 0.698, 0.716]}, {"x_m": 3.0, "y_m": -35.0, "orient": [0.0, 0.0, 0.736, 0.677]}, {"x_m": 7.0, "y_m": -30.0, "orient": [0.0, 0.0, 0.784, 0.621]}]'
  - <<: [*downtownwest, *multiraven]
    name: downtownwest_s1_multiraven
    SPAWN_CONFIGS: '[{"x_m": -1.0, "y_m": -41.0, "orient": [0.0, 0.0, 0.698, 0.716]}, {"x_m": 3.0, "y_m": -35.0, "orient": [0.0, 0.0, 0.736, 0.677]}, {"x_m": 7.0, "y_m": -30.0, "orient": [0.0, 0.0, 0.784, 0.621]}]'

  # ---- DowntownWest s2 ----
  - <<: [*downtownwest, *frontier]
    name: downtownwest_s2_frontier
    SPAWN_CONFIGS: '[{"x_m": -33.0, "y_m": 59.0, "orient": [0.0, 0.0, -0.8583, 0.5132]}, {"x_m": -25.0, "y_m": 62.0, "orient": [0.0, 0.0, -0.561, 0.8278]}, {"x_m": -16.0, "y_m": 64.5, "orient": [0.0, 0.0, -0.1586, 0.9873]}]'
  - <<: [*downtownwest, *vlfm]
    name: downtownwest_s2_vlfm
    SPAWN_CONFIGS: '[{"x_m": -33.0, "y_m": 59.0, "orient": [0.0, 0.0, -0.8583, 0.5132]}, {"x_m": -25.0, "y_m": 62.0, "orient": [0.0, 0.0, -0.561, 0.8278]}, {"x_m": -16.0, "y_m": 64.5, "orient": [0.0, 0.0, -0.1586, 0.9873]}]'
  - <<: [*downtownwest, *lvlm]
    name: downtownwest_s2_lvlm
    SPAWN_CONFIGS: '[{"x_m": -33.0, "y_m": 59.0, "orient": [0.0, 0.0, -0.8583, 0.5132]}, {"x_m": -25.0, "y_m": 62.0, "orient": [0.0, 0.0, -0.561, 0.8278]}, {"x_m": -16.0, "y_m": 64.5, "orient": [0.0, 0.0, -0.1586, 0.9873]}]'
  - <<: [*downtownwest, *multiraven]
    name: downtownwest_s2_multiraven
    SPAWN_CONFIGS: '[{"x_m": -33.0, "y_m": 59.0, "orient": [0.0, 0.0, -0.8583, 0.5132]}, {"x_m": -25.0, "y_m": 62.0, "orient": [0.0, 0.0, -0.561, 0.8278]}, {"x_m": -16.0, "y_m": 64.5, "orient": [0.0, 0.0, -0.1586, 0.9873]}]'

  # ---- DowntownWest s3 ----
  - <<: [*downtownwest, *frontier]
    name: downtownwest_s3_frontier
    SPAWN_CONFIGS: '[{"x_m": -120.0, "y_m": -0.5, "orient": [0.0, 0.0, -0.4343, 0.9007]}, {"x_m": -115.5, "y_m": 3.0, "orient": [0.0, 0.0, -0.013, 0.9999]}, {"x_m": -111.0, "y_m": 6.5, "orient": [0.0, 0.0, 0.4108, 0.9117]}]'
  - <<: [*downtownwest, *vlfm]
    name: downtownwest_s3_vlfm
    SPAWN_CONFIGS: '[{"x_m": -120.0, "y_m": -0.5, "orient": [0.0, 0.0, -0.4343, 0.9007]}, {"x_m": -115.5, "y_m": 3.0, "orient": [0.0, 0.0, -0.013, 0.9999]}, {"x_m": -111.0, "y_m": 6.5, "orient": [0.0, 0.0, 0.4108, 0.9117]}]'
  - <<: [*downtownwest, *lvlm]
    name: downtownwest_s3_lvlm
    SPAWN_CONFIGS: '[{"x_m": -120.0, "y_m": -0.5, "orient": [0.0, 0.0, -0.4343, 0.9007]}, {"x_m": -115.5, "y_m": 3.0, "orient": [0.0, 0.0, -0.013, 0.9999]}, {"x_m": -111.0, "y_m": 6.5, "orient": [0.0, 0.0, 0.4108, 0.9117]}]'
  - <<: [*downtownwest, *multiraven]
    name: downtownwest_s3_multiraven
    SPAWN_CONFIGS: '[{"x_m": -120.0, "y_m": -0.5, "orient": [0.0, 0.0, -0.4343, 0.9007]}, {"x_m": -115.5, "y_m": 3.0, "orient": [0.0, 0.0, -0.013, 0.9999]}, {"x_m": -111.0, "y_m": 6.5, "orient": [0.0, 0.0, 0.4108, 0.9117]}]'


# Send goals through the GCS action_relay — the exact path Foxglove uses.
command_route: gcs

environment_order: grouped
iterations: 1

# DowntownWest has never needed a retry; 3 is the usual allowance.
iteration_attempts: 3

# 900 rather than the usual 600: PX4 heartbeat has taken up to 325 s to arrive
# on a loaded box, and DowntownWest is one of the heavier stages.
ready:
  timeout_s: 900

# Superset of the three per-baseline record blocks. The lvlm iterations simply
# produce no payload / rayfronts_debug topics; `ros2 bag record` waits on names
# that never appear rather than failing, and record.required only trips if the
# recorder process itself won't start.
record:
  enabled: true
  scope: gcs
  required: true
  topics:
    - /tf
    - /tf_static
    - /{robot}/odometry_conversion/odometry
    - /gcs/robot_markers
    - /gcs/payload/{robot}/filtered_rays
    - /gcs/payload/{robot}/filtered_frontiers
    - /gcs/payload/{robot}/explored_area_coverage
    - /gcs/payload/{robot}/confirmed_targets
    - /gcs/payload/{robot}/auction_table
    - /gcs/payload/{robot}/voxel_rgb
    - /gcs/sim_ground
    - /gcs/annotations/bboxes
    - /rayfronts_debug/{robot}/voxels_sim/all
    - /rayfronts_debug/{robot}/voxel_rgb

on_step_failure: abort_iteration

steps:
  # Both model pre-downloads run every iteration: RADIO is what rayfronts needs
  # (frontier + vlfm), InternVL3 is what the lvlm node needs. Both land in the
  # persistent /root/.cache shared across replicas, so after the first iteration
  # each is a cache hit and costs seconds.
  - run:
      container: robot_1
      cmd: python3 -c "import torch; torch.hub.load('NVlabs/RADIO', 'radio_model', version='c-radio_v3-b', skip_validation=True, adaptor_names=['siglip2','sam'])"
      timeout_s: 900
      attempts: 5
      retry_delay_s: 15

  - run:
      container: robot_1
      cmd: python3 -c "from huggingface_hub import snapshot_download; snapshot_download('OpenGVLab/InternVL3-2B')"
      timeout_s: 900
      attempts: 5
      retry_delay_s: 15

  - action:
      task: takeoff
      goal: {target_altitude_m: 12.0, velocity_m_s: 1.0}
      timeout_s: 180

  - wait: 5

  # 15-minute budget, same as the original sweep so the numbers stay comparable.
  # min_altitude_agl is 10.0 in lvlm_baseline.yaml and 5.0 in the other three;
  # 5.0 is used here because raven's altitude band is the one that matters for
  # frontier/vlfm and the lvlm node clamps its own waypoints anyway.
  - action:
      task: semantic_search
      timeout_s: 900
      cancel_on_timeout: true
      pass_on_feedback: true
      goal:
        query: "{{env.query}}"
        background_queries: "{{env.background_queries}}"
        search_area: "{{env.search_area}}"
        min_altitude_agl: 5.0
        max_altitude_agl: 20.0
        min_flight_speed: 0.5
        max_flight_speed: 1.0
        confidence_threshold: 0.95
        voxel_score_threshold: "{{env.voxel_score_threshold}}"
        score_threshold: "{{env.score_threshold}}"
        voxel_min_cluster_size: "{{env.voxel_min_cluster_size}}"
        bundle_len: 3
