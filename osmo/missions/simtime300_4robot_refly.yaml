# simtime300_4robot_refly
#
# The five 4-robot environments that produced no bag in simtime300_4robot_a/b.
# Each failed identically, for all four methods:
#
#     "robots [1, 2, 3, 4] not ready within 900s (connected so far: [])"
#
# steps_ok=0 — the run aborted before takeoff, so it was never a spawn or
# navigation problem. ddsrouter kept dying during bring-up (oom_dmesg.log shows
# repeated "ddsrouter vanished"), though not from memory pressure: oom_kill=0 on
# every container, peak RSS ~1.3 GB. These are the heaviest scenes and with four
# robots the stack simply did not come up inside the readiness gate.
#
# So two things change here:
#   * ready.timeout_s 900 -> 2400, the actual failure mode. 900 s was inherited
#     from the 2- and 3-robot missions and never scaled with fleet size.
#   * fresh SPAWN_CONFIGS, drawn inside each scene's spawn rectangle with the
#     widest spacing the rectangle allows. The previous layouts clustered all
#     four drones within ~10 m; these are 8 m (4.5 m in shipyard_s3, whose rectangle is only 8 x 12 m) apart.
#
# 20 environments = 5 environments x 4 methods, 300 s of simulated search.

name: simtime300_4robot_refly
nas_dest: /volume4/dsta/raven-simtime300/
stack:
  services:
  - isaac-sim
  - robot-desktop
  - gcs
env:
  NUM_ROBOTS: 4
  RAYFRONTS_COMPUTE_PROB: 'True'
  ISAAC_SIM_HEADLESS: 'true'
  ISAAC_SIM_USE_STANDALONE: 'true'
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: 'true'
  FRONTIER_ONLY_BASELINE: 'false'
  VLFM_BASELINE: 'false'
  LVLM_BASELINE: 'false'
