       {"x_m": 187.5, "y_m": -102.5, "orient": [0.0, 0.0, 0.9314, 0.3640]},
       {"x_m": 445.0, "y_m": -240.0, "orient": [0.0, 0.0, 0.9572, 0.2895]},
