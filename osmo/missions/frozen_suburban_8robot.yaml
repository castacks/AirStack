       {"x_m": 10.0, "y_m": 172.5, "orient": [0.0, 0.0, -0.5979, 0.8015]},
       {"x_m": 102.5, "y_m": -30.0, "orient": [0.0, 0.0, 0.9192, 0.3937]},
