# frozen_suburban_8robot — the FOUR implemented baselines x the SIX frozen
# suburban dataset cells, EIGHT drones each. 24 iterations, one file.
#
#     baseline   frontier | lawnmower | vlfm | conavgpt2 (team)
#     cell       Fire/Suburban/level_{1,2,3}/1
#                Tornado/Suburban/level_{1,2,3}/1
#     fleet      NUM_ROBOTS=8
#
# People placement 1 of each level only, as asked: the people axis is five
# casts over ONE geometry (freeze-disaster-dataset), so placements 2-5 add
# survivor-draw variance, not scene variance, and are a separate sweep.
# Only Fire/Suburban and Tornado/Suburban levels 1-3 exist on disk today; the
# urban locales and the earthquake / hurricane cells are not built.
#
# ── WHAT IS NEW HERE, AND WHY IT IS NOT A VARIANT OF wildfire1km_5robot_a ──
#
# 1. THE SCENE IS A FILE, NOT A BUILD. Every earlier mission set SCENE_CONFIG
#    and paid a ~20-minute procedural assembly per iteration, which at 24
#    iterations would be most of a day of GPU time spent rebuilding scenes that
#    have already been built, reviewed and frozen. `FROZEN_SCENE` names a cell
#    under `final_disaster_dataset/` and the launcher references it in as it
#    stands. That is not only faster: it is the only way all four arms fly
#    BIT-IDENTICAL geometry, which is the premise of comparing them.
#
#    WHERE THE CELLS LIVE. Locally: `FINAL_DATASET_DIR` (host) ->
#    /isaac-sim/final_disaster_dataset, already in
#    simulation/isaac-sim/docker/docker-compose.yaml. On a POD there is no such
#    mount and the dataset is not cloned, so the cells are read from Nucleus —
#    `FROZEN_DATASET_ROOT` below. A cell that does not resolve fails at t=0
#    with "FROZEN_SCENE=...: no such file or cell", which is the right failure:
#    loud, immediate, and it names what it looked for.
#
# 2. THE SEARCH AREA IS THE DAMAGE, MEASURED OFF THE CELL. The Isaac launcher
#    writes `<RESULTS_SCENE>_region.json` from the cell's own GT_hints.json
#    (simulation/isaac-sim/utils/frozen_annotations.py): the convex hull of
#    every damaged object, grown 50 m, clipped to the plate. The scene overlay
#    reads it with `search_area_source: 'scene'`,
#    `search_area_scene_key: 'search'`. Nothing outside the disaster-affected
#    area plus that pad is ever in any drone's search polygon.
#
#      cell              damage hull      search area      survivors
#      Fire   level_1     265k m2 (26%)    362k m2 (36%)    49  (49 inside)
#      Fire   level_2     546k m2 (55%)    648k m2 (65%)    79  (79 inside)
#      Fire   level_3     749k m2 (75%)    802k m2 (80%)    84  (84 inside)
#      Tornado level_1    161k m2 (16%)    285k m2 (28%)    30  (30 inside)
#      Tornado level_2    197k m2 (20%)    309k m2 (31%)    40  (40 inside)
#      Tornado level_3    313k m2 (31%)    431k m2 (43%)    70  (70 inside)
#
#    Every survivor is inside the search area on every cell. That is a property
#    to CHECK, not to assume: a search area that does not contain the answer
#    key is a benchmark that cannot be won, and the launcher prints
#    "people inside the search k/n" at t=0 for exactly this.
#
# 3. EACH DRONE SPAWNS IN ITS OWN SECTOR, ON FREE GROUND. Not the kerbside
#    cluster every earlier mission used. The reason is 4c of the benchmark
#    skill: MIGHTY flies its own v_max (1.5 m/s) and does NOT yet apply the
#    speed cap the NavigateTask carries, so the 500 m from a central kerb to an
#    outer sector is 330 s of a 600 s budget — more than half the run spent
#    getting to work, charged to the method. The eight coordinates per cell
#    below were computed by `scene_gen/tools/frozen_cell_plan.py`, which calls
#    the planner's OWN sector.py so the sectors it places drones in are the
#    ones search_planner cuts at run time, and picks the point in each sector
#    that is furthest from any house, tree, car, debris field — or survivor.
#    Re-run it (`--emit-yaml <search_baselines>/config`) if a cell is ever
#    re-exported; do not edit the numbers by hand.
#
# 4. ONE SCENE OVERLAY PER CELL, SHARED BY ALL FOUR ARMS —
#    `frozen_<disaster>_suburban_lvl<n>.yaml`, also generated by that tool.
#    map_extent_m (1380-1500 m -> 2.9-3.1 m/cell) is sized to satisfy BOTH the
#    sectored arms' local grids and the team arm's whole-plate global one, so
#    every arm rasterises at the same cell size and a difference in results has
#    to come from the selection policy.
#
# ── THE FOUR ARMS, AND THE ONE THAT IS DEPLOYED DIFFERENTLY ──
#
# frontier / lawnmower / vlfm are SECTORED: one search_planner per robot, in
# that robot's own container on its own DDS domain, each cutting slice N of the
# same search polygon. conavgpt2 is COOPERATIVE (arXiv 2310.07937) — ONE
# team_mode planner on offboard-compute (ROS_DOMAIN_ID=0) sees every robot's
# bridged sensors, merges them into one global-ENU grid and assigns every robot
# a frontier per VLM call. Both deployments live in this one file: the planner
# steps below branch on `{{env.method}}` and the wrong-arm branch exits 0.
#
# THE BUDGET IS 600 SIM SECONDS FROM THE MOMENT THE BASELINE STARTS, not from
# sim boot: `search_planner` latches its t0 on its FIRST tick with
# rgb + depth + camera_info + odometry, which is after the scene loaded, after
# the stack came up and after takeoff. None of that is charged to the method,
# and the two deployments are given the same 600 s however differently the wall
# clock ran. The planner announces it — `sim budget 600 s starts NOW, at sim
# t=... — the first tick with data. Time source: ...` — and both collect steps
# grep that line into their summary.
#
# The TEAM arm needed a fix to make that true. Isaac publishes /clock from a
# PER-DRONE OmniGraph node bound to that drone's ROS domain, so /clock exists
# on domains 1..8 and NOT on 0 — and dds_router.yaml bridges 47 topics, none of
# them rt/clock. The team planner runs on domain 0, so its clock read 0.0
# forever and the budget was never spent. `_sim_now` now falls back to the
# sim-time header stamps on the bridged observations, which is the same clock
# read a different way (and arguably the better reading for a budget: it is the
# time of the data the method actually processed).
#
# SCORING IS NOT ON ONE AXIS WITH raven_nav. All four arms here are the shared
# search_planner reporting its own round table; raven runs inside
# semantic_search_task, which owns coverage/recall scoring. max_sim_seconds
# matches, so the sim-time axis lines up — say so in any result table.
#
# ── SUBMIT ──
#
#   airstack osmo:mission osmo/missions/frozen_suburban_8robot.yaml \
#     --pool coasei --branch krrishj/disaster-dataset \
#     --workflow osmo/workflows/airstack-mission-8robot-1gpu.yaml
#
# The 1-robot / 5-robot workflows are the wrong size: cpu 24 / 64Gi cannot
# hold eight robot stacks beside Isaac Sim. To fly one cell or one arm first —
# strongly recommended before committing 24 iterations — cut `environments:`
# down to the entries you want and set `iterations:` to match.
#
# Schema: osmo/missions/README.md. Method matrix, scaling rules and the traps:
# .agents/skills/benchmark-disaster-dataset/SKILL.md. What a frozen cell is:
# .agents/skills/freeze-disaster-dataset + freeze-dataset-state.

name: frozen_suburban_8robot
nas_dest: /volume2/coa-sei

stack:
  services: [isaac-sim, robot-desktop, gcs, offboard-compute]

env:
  # ── the shared model services (offboard-compute) ─────────────────────────
  # THE MODELS DO NOT LIVE IN THE ROBOT CONTAINERS. At NUM_ROBOTS=8 a model
  # loaded in-process is loaded eight times on one card, and the detector —
  # which EVERY arm runs — is the worst offender (YOLO-World + MobileSAM). All
  # three services are stateless: one frame in, one answer out, no per-robot
  # history, so interleaved requests cannot cross-talk. Frames travel in the
  # HTTP body, so none of this is DDS traffic.
  DETECTOR_URL: "http://offboard-compute:8200"
  ITM_URL: "http://offboard-compute:8100"
  VLM_URL: "http://offboard-compute:8000/v1"
  # Must name the SAME file the offboard detector serves, or the planner logs
  # DETECTOR MISMATCH. Open-vocab weights: the 1 km plats need them.
  CONAVGPT2_YOLO_WORLD_WEIGHTS: "/root/.cache/conavgpt2_weights/yolov8l-world.pt"
  # 7B nf4 (~5.9 GiB) is the field-deployable size and the one that fits beside
  # Isaac + eight robot stacks. Model and quantisation are env vars, so 32B is
  # one change away. Only started for the conavgpt2 iterations.
  CONAVGPT2_VLM_MODEL: "Qwen/Qwen2.5-VL-7B-Instruct"
  CONAVGPT2_VLM_QUANT: "nf4"
  # The team planner runs in offboard-compute, which has ONE GPU here, so
  # nothing to pin. Set this on a multi-GPU pod: the sim does not OOM when a
  # model lands on its card, its RTX render graph fails EVERY FRAME and stops
  # publishing camera images altogether.
  CONAVGPT2_VLM_GPU: ""

  # ── the fleet and the sim ────────────────────────────────────────────────
  NUM_ROBOTS: 8
  ISAAC_SIM_HEADLESS: "true"
  ISAAC_SIM_CUDA_DEVICES: "0"
  ISAAC_SIM_USE_STANDALONE: "true"
  ISAAC_SIM_SCRIPT_NAME: example_multi_drone_scene_import.py
  PLAY_SIM_ON_START: "true"

  # THE SCENE. FROZEN_SCENE and SPAWN_CONFIGS are per-iteration and live in
  # `environments:` below; these are the knobs that are the same for all 24.
  # SCENE_CONFIG is deliberately ABSENT — setting it alongside FROZEN_SCENE is
  # ignored with a warning, but leaving it out is what states the intent.
  #
  # ── WHERE THE CELLS COME FROM ────────────────────────────────────────────
  # `final_disaster_dataset/` lives OUTSIDE the repo (4.8 GB across 18 cells,
  # bind-mounted from FINAL_DATASET_DIR) and is NOT in git. A pod clones the
  # branch and therefore has NEITHER — no mount, no cells. So they live on
  # Nucleus, the one place a pod can reach with a credential the workflow
  # already injects.
  #
  # UPLOADED 2026-08-29: all 18 cells, 69 files, 4.52 GB, verified
  # size-identical against the local originals, and two of them re-opened off
  # the server to confirm the structure the launcher reads (/World children,
  # 6,238 and 6,536 referenced objects under generated/inst). `snaps/` is not
  # uploaded — 571 MB of review captures that nothing reads at run time.
  # Textures and MDL are not uploaded either and do not need to be: they were
  # never inlined into the frozen files, so a cell still references them on
  # Nucleus and in the repo, both of which a pod resolves.
  #
  # Re-uploading a re-exported cell: the recipe is in
  # .agents/skills/freeze-dataset-state, the standalone `omni.client`
  # invocation it uses in .agents/skills/run-isaac-sim-launcher section 6.
  #
  # ON A LOCAL BENCH that already has the mount, comment this out and the
  # launcher falls back to /isaac-sim/final_disaster_dataset. FROZEN_SCENE is
  # the same cell path either way, so this one line is the whole difference.
  FROZEN_DATASET_ROOT: "omniverse://airlab-nucleus.andrew.cmu.edu/Projects/SEI-COA/final_disaster_dataset"
  #
  # The plat's own ground sheet gets colliders, exactly as the built path does,
  # so a frozen run and a rebuilt one agree about what the drone stands on.
  # `off` is the knob if the collider pass turns out to dominate the 24
  # iterations' load time — the Pegasus GroundPlane composed into every cell is
  # itself a collision plane at z = 0, which is all a takeoff needs.
  SUBURB_COLLIDERS: "ground"
  SPAWN_HEIGHT_M: "0.5"
  # People poles are the ANSWER KEY, authored deactivated in every cell.
  # NEVER set this on a scored run.
  # PEOPLE_POLES: "1"

  # The lidar is not free and is not read: search_planner reads no lidar, and
  # with it on cameras drop ~53 -> ~17 Hz and /clock ~53 -> 15 Hz — a ~3x
  # wall-clock multiplier on a sim-time-bounded run, for identical coverage.
  ENABLE_LIDAR: "false"

  # 30 deg down, read by BOTH sides: the launch script tilts the physical
  # mount, and search_planner takes it as the default camera_pitch_rad. TF
  # walks the URDF and the URDF models NO mount pitch, so a camera tilted in
  # one place and not declared in the other unprojects every point to the
  # wrong bearing without erroring. All four arms fly the same camera here —
  # conavgpt2 needs the tilt, and a comparison across arms needs it identical.
  ZED_PITCH_DEG: "30"
  ZED_WIDTH: "720"
  ZED_HEIGHT: "450"

  # Publish the MEASURED world->map transform and give each robot a GPS fix.
  # Required: the team arm's global_enu merge is built on each robot's boot
  # anchor, and the sectored arms' `search_area_frame: 'world'` conversion is
  # the same derivation.
  MAP_ANCHOR_ENU: "true"

  # ── the stack ────────────────────────────────────────────────────────────
  # MIGHTY, not droan_gl: droan spent its time spinning in place on the 1 km
  # plat however it was tuned. Same seam (/tasks/navigate + the trajectory
  # controller), so nothing above the local layer changed. LOCAL_PLANNER keeps
  # the search planners' `nav_activation: auto` on 'follower' — MIGHTY's bridge
  # follows /global_plan itself.
  AIRSTACK_STACK: "full_mighty"
  LOCAL_PLANNER: "mighty"

  # The raven-side baseline flags are ALL pinned false. `Stack.apply_env` only
  # MERGES env vars, so an omitted flag inherits whatever the previous mission
  # on this pod set — and a set one silently swaps in a method that is not
  # being compared.
  CONAVGPT_BASELINE: "false"
  FRONTIER_ONLY_BASELINE: "false"
  VLFM_BASELINE: "false"
  LVLM_BASELINE: "false"

  COMMS_RANGE_M: 5000
  # GT comes from the CELL's own GT_people.json / GT_hints.json, reshaped into
  # <RESULTS_SCENE>{,_obstacles,_region}.json. RESULTS_SCENE is per-iteration.
  GT_ANNOTATIONS: "on"

# ── the 24 iterations: 6 cells x 4 arms, cell-major ────────────────────────
# round_robin with iterations == len(environments) runs each entry exactly
# once, in this order, so the four arms on a cell run back to back and a
# partial sweep still yields complete cells.
#
# UPPERCASE keys become env vars for `airstack up` (so FROZEN_SCENE and
# SPAWN_CONFIGS reach the isaac-sim container); lowercase ones are only
# available to steps as {{env.<key>}}.
environment_order: round_robin
iterations: 24
