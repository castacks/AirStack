ready:
  # A frozen cell is a FILE OPEN, not a build: ~250 MB of geometry referenced
  # in, with textures and MDL still resolved off Nucleus (the cells are not
  # localised yet — freeze-dataset-state's punch list item 1). That is minutes,
  # not the 20+ the procedural assembly took, but eight PX4 airframes still
  # have to come up behind it and the FIRST iteration also pays the image pull.
  # 2400 s vs the built path's 4200.
  timeout_s: 2400
  poll_interval_s: 10

up_timeout_s: 5400
# A failed iteration is redone once, clean (down -> up -> fly -> down). The
# spawns are literal, not seeded, so a redo reproduces the same layout exactly.
iteration_attempts: 2
on_step_failure: abort_iteration
# Takeoff/land go through the GCS action_relay. The PLANNERS do not: a sectored
# planner is an ActionClient on its own robot's domain, and the team planner's
# goals reach droan over the DDS bridge.
command_route: gcs

record:
  # LEAN: scope gcs = ONE recorder on domain 0. The DDS router bridges every
  # /robot_N viz topic there, so no per-robot recorder and no raw sensor
  # streams.
  #
  # NO /sim/overhead/image — a 2048x2048 image published EVERY sim tick
  # (~12 MB/frame, ungated) that was ~90% of a 300 GB bag. /gcs/sim_ground is
  # the same overhead rendered by the GCS visualizer as a LATCHED ground
  # marker: one message, not thousands.
  #
  # FRAMES. Every raw /robot_N/... layer is in THAT ROBOT'S map, anchored at
  # its takeoff point — and on this mission the eight takeoff points are
  # HUNDREDS OF METRES APART, one per sector, which makes the frame error far
  # louder than it was on the kerbside-cluster missions: replaying the raw
  # names would draw eight maps scattered across the plate with nothing in the
  # bag to say so. foxglove_visualizer_node republishes each layer translated
  # into global ENU under /gcs/<robot>/<layer>; record THOSE, plus each robot's
  # latched /gcs/<robot>/map_origin so the raw odometry kept for analysis can
  # be placed.
  enabled: true
  scope: gcs
  required: true
  topics:
    - /tf_static
    - /{robot}/odometry_conversion/odometry
    - /{robot}/global_plan
    - /{robot}/search/round_stats
    - /{robot}/search/run_complete
    # JPEG of the annotated FPV, published ONLY on a tick whose goal-class
    # score cleared the gate: the evidence behind every "detector SEEN" /
    # "detector PASS" line, and the answer to "were those 15 committed targets
    # real". ~50 KB, event-driven.
    - /{robot}/search/detection_image
    - /gcs/{robot}/map_origin
    - /gcs/{robot}/occupancy
    - /gcs/{robot}/frontiers
    - /gcs/{robot}/frontier_cloud
    - /gcs/{robot}/voxel_map
    - /gcs/{robot}/value_map
    - /gcs/{robot}/search/markers
    - /gcs/robot_markers
    - /gcs/sim_ground
    - /gcs/annotations/bboxes

steps:
  # 1. THE GROUND TRUTH THIS ITERATION WILL BE SCORED AGAINST. Reading it back
  #    before flying is cheap and it is the one check that catches the two
  #    failures that otherwise look like a bad method: an annotation file left
  #    over from the PREVIOUS iteration's cell (the launcher writes into a
  #    shared directory, and a scene that failed to build leaves the last one
  #    in place), and a search area that does not contain the survivors.
  - run:
      container: robot_1
      cmd: |
        A=/root/AirStack/robot/ros_ws/src/global/planners/raven_nav/annotations
        S={{env.RESULTS_SCENE}}
        for f in "$A/$S.json" "$A/${S}_obstacles.json" "$A/${S}_region.json"; do
          [ -f "$f" ] || { echo "MISSING $f"; exit 1; }
        done
        python3 - "$A" "$S" <<'EOF'
        import json, sys
        a, s = sys.argv[1], sys.argv[2]
        people = json.load(open(f"{a}/{s}.json"))
        obst = json.load(open(f"{a}/{s}_obstacles.json"))
        reg = json.load(open(f"{a}/{s}_region.json"))
        meta = next(e for e in reg if e.get("class") == "meta")
        srch = next(e for e in reg if e.get("class") == "search")
        print(f"scene {s}: {len(people)} people, {len(obst)} obstacle boxes")
        print(f"  frozen_usd  {meta.get('frozen_usd')}")
        print(f"  disaster    {meta.get('disaster')} / {meta.get('scene_config')}")
        print(f"  search area {srch['area_m2']:,.0f} m2 "
              f"({meta['search_frac_of_plate']:.0%} of the plate), "
              f"{len(srch['polygon_xy'])} pts")
        print(f"  people inside the search {meta['people_inside_search']}"
              f"/{meta['people_total']}")
        assert len(people) == meta["people_total"], "people GT / region disagree"
        assert meta["people_inside_search"] > 0, "no survivor is in the search area"
        EOF
      timeout_s: 120

  # 2. Wait for the offboard-compute servers THIS arm needs: the detector on
  #    :8200 always, plus the model server named by {{env.model_port}} (:8100
  #    vlfm, :8000 conavgpt2, empty for frontier/lawnmower — which need no
  #    model for SELECTION but detect like everything else). A cold 7B download
  #    can take many minutes, so the loop is long.
  - run:
      container: robot_1
      cmd: |
        MP="{{env.model_port}}"
        echo "waiting for offboard-compute: detector :8200${MP:+ + model :$MP}"
        for i in $(seq 1 360); do
          d=$(curl -sf http://offboard-compute:8200/health 2>/dev/null | grep -c '"status": *"ok"')
          if [ -n "$MP" ]; then
            m=$(curl -sf "http://offboard-compute:$MP/health" 2>/dev/null | grep -c '"status": *"ok"')
          else
            m=1
          fi
          if [ "$d" = "1" ] && [ "$m" = "1" ]; then
            echo OFFBOARD_READY
            curl -s http://offboard-compute:8200/health | head -c 300; echo
            [ -n "$MP" ] && { curl -s "http://offboard-compute:$MP/health" | head -c 200; echo; }
            exit 0
          fi
          sleep 15
        done
        echo OFFBOARD_NOT_READY; exit 1
      timeout_s: 5700
      attempts: 2
      retry_delay_s: 20

  # 3. Server-metrics BACKLOG POLLER. At EIGHT robots this is the measurement
  #    that matters: the detector is shared and stateless, so 8 robots is 8x
  #    the request rate on one card. Watch mean_ms and errors climbing with
  #    time. For vlfm, one ITM scorer serves ~3 robots at the shipped 5 Hz
  #    keyframe rate and ~7 at 2 Hz — this fleet is above both, which is why
  #    vlfm_keyframe_period_s is raised to 1.0 s in the scene overlays and why
  #    the itm /metrics here is the check on whether that was enough rather
  #    than an assumption.
  - run:
      container: robot_1
      cmd: |
        mkdir -p /tmp/search
        : > /tmp/search/server_metrics.jsonl
        nohup bash -c '
          for i in $(seq 1 500); do
            ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            det=$(curl -s --max-time 5 http://offboard-compute:8200/metrics 2>/dev/null); [ -n "$det" ] || det="{}"
            itm=$(curl -s --max-time 5 http://offboard-compute:8100/metrics 2>/dev/null); [ -n "$itm" ] || itm="{}"
            vlm=$(curl -s --max-time 5 http://offboard-compute:8000/metrics 2>/dev/null); [ -n "$vlm" ] || vlm="{}"
            printf "{\"ts\":\"%s\",\"detector\":%s,\"itm\":%s,\"vlm\":%s}\n" "$ts" "$det" "$itm" "$vlm" >> /tmp/search/server_metrics.jsonl
            sleep 15
          done
        ' > /tmp/search/server_metrics_poller.log 2>&1 &
        echo $! > /tmp/search/poller.pid
        echo POLLER_STARTED pid=$(cat /tmp/search/poller.pid)
      timeout_s: 60

  # 4. Takeoff — all eight robots in parallel via the GCS relay. 20 m AGL is
  #    the bottom of the flight band in every frozen scene overlay.
  - action:
      task: takeoff
      goal: {target_altitude_m: 20.0, velocity_m_s: 2.0}
      timeout_s: 420
      robots: all

  - wait: 5

  # 5. THE SECTORED ARMS: one planner per robot, IN ITS OWN CONTAINER on its
  #    OWN DDS domain. Exits 0 on the conavgpt2 iterations, where step 6 runs
  #    instead.
  #
  #    WHY THE LITERAL CONTAINER NAME AND NOT `container: robot_{n}`: the
  #    runner maps a `robot_<n>` target to robot container 1 with only
  #    ROS_DOMAIN_ID=n exported, so all eight planners would launch inside
  #    robot-desktop-1 — sharing one container's CPU and all keeping
  #    ROBOT_NAME=robot_1, which is what the node derives its SECTOR from
  #    (sector_index: -1). Every planner would take slice 0 and drive robot_1.
  #    Targeting the Nth container by its compose name routes through the
  #    runner's literal-name path, and the cmd then pins ROBOT_NAME and
  #    ROS_DOMAIN_ID explicitly — a planner launched in a shell where the
  #    .bashrc mapping did not run lands on DOMAIN 0 and everything LOOKS alive
  #    while /global_plan reaches the robot only as the router's BEST_EFFORT
  #    copy, which the local planner's RELIABLE subscriber refuses.
  #
  #    Compose derives the project name from the checkout directory; on an OSMO
  #    pod the clone is /root/AirStack, so the prefix is `airstack-`.
  - run:
      container: airstack-robot-desktop-{n}
      cmd: |
        if [ "{{env.method}}" = "conavgpt2_team" ]; then
          echo "SKIP per-robot planner: {{env.method}} is a TEAM arm (step 6)"; exit 0
        fi
        source /root/.bashrc >/dev/null 2>&1 || true
        export ROBOT_NAME=robot_{n}
        export ROS_DOMAIN_ID={n}
        mkdir -p /tmp/search
        CFG=$(ros2 pkg prefix search_baselines)/share/search_baselines/config
        SCENE=$CFG/{{env.scene_yaml}}
        [ -f "$SCENE" ] || { echo "MISSING scene overlay $SCENE (was the workspace rebuilt after the overlays were added?)"; exit 1; }
        # vlfm's keyframe rate is NOT overridden here: `ros2 launch` takes
        # declared launch ARGS (name:=value), not `--ros-args -p`, so a
        # parameter tacked on here would be silently ignored or reject the
        # launch. It is in the scene overlay instead (vlfm_keyframe_period_s:
        # 1.0), which every arm loads and only vlfm reads.
        nohup ros2 launch search_baselines {{env.method}}.launch.xml \
          num_robots:=8 \
          scene_params_file:=$SCENE \
          > /tmp/search/planner.log 2>&1 &
        echo $! > /tmp/search/planner.pid
        sleep 25
        if kill -0 "$(cat /tmp/search/planner.pid)" 2>/dev/null; then
          echo PLANNER_STARTED robot_{n}
          grep -a -E "search area from the SCENE|sector [0-9]+/|search_planner starting" /tmp/search/planner.log | head -3 || true
        else
          echo PLANNER_DEAD robot_{n}; tail -n 80 /tmp/search/planner.log; exit 1
        fi
      timeout_s: 420
      attempts: 2
      retry_delay_s: 15

  # 6. THE TEAM ARM: ONE central planner in offboard-compute, joined to the
  #    shared GCS domain (ROS_DOMAIN_ID=0, not offboard-compute's own 99) where
  #    the DDS router has bridged every robot's rgb/depth/camera_info/odom,
  #    navsat and tasks/navigate. team_mode makes it drive all eight and issue
  #    ONE VLM assignment for the team. Exits 0 on the sectored iterations.
  #
  #    It can `ros2 launch search_baselines` because offboard-compute runs the
  #    ROBOT image and bind-mounts the same robot/ros_ws the robot containers
  #    build at bring-up. In detector_mode: server + nav_mode: gpt it loads NO
  #    local model, so it adds ~0 GPU load beside the servers it sits with.
  - run:
      container: offboard-compute
      cmd: |
        if [ "{{env.method}}" != "conavgpt2_team" ]; then
          echo "SKIP team planner: {{env.method}} is a SECTORED arm (step 5)"; exit 0
        fi
        source /root/.bashrc >/dev/null 2>&1 || true
        export ROS_DOMAIN_ID=0          # gcs_domain — the shared/bridged domain
        export ROBOT_NAME=robot_1       # team topics publish under robots[0]; label only
        export ZED_PITCH_DEG=30         # MUST match env.ZED_PITCH_DEG; this container's env lacks it
        export DETECTOR_URL=http://localhost:8200
        export VLM_URL=http://localhost:8000/v1
        mkdir -p /tmp/search
        if ! ros2 pkg prefix search_baselines >/dev/null 2>&1; then
          echo "WORKSPACE_NOT_BUILT (robot/ros_ws/install missing — the robots build it at bring-up and this step runs after takeoff, so it should exist)"; exit 1
        fi
        CFG=$(ros2 pkg prefix search_baselines)/share/search_baselines/config
        SCENE=$CFG/{{env.scene_yaml}}
        [ -f "$SCENE" ] || { echo "MISSING scene overlay $SCENE"; exit 1; }
        nohup ros2 launch search_baselines conavgpt2_team.launch.xml \
          num_robots:=8 \
          scene_params_file:=$SCENE \
          > /tmp/search/planner.log 2>&1 &
        echo $! > /tmp/search/planner.pid
        sleep 30
        if kill -0 "$(cat /tmp/search/planner.pid)" 2>/dev/null; then
          echo TEAM_PLANNER_STARTED
          grep -a -E "search area from the SCENE|search_planner starting|robots=\[" /tmp/search/planner.log | head -3 || true
        else
          echo TEAM_PLANNER_DEAD; tail -n 80 /tmp/search/planner.log; exit 1
        fi
      timeout_s: 420
      attempts: 2
      retry_delay_s: 20

  # 7. Gate on SIM time. The sectored arms latch run_complete PER ROBOT at 600
  #    sim-s from that robot's first data tick, so this fans out over all eight
  #    containers and passes only when every one is done; the team arm latches
  #    ONE, on domain 0. Both branches are here so the step list stays the same
  #    length for every iteration.
  - run:
      container: airstack-robot-desktop-{n}
      cmd: |
        if [ "{{env.method}}" = "conavgpt2_team" ]; then
          echo "SKIP per-robot gate: team run is gated in step 8"; exit 0
        fi
        source /root/.bashrc >/dev/null 2>&1 || true
        export ROS_DOMAIN_ID={n}
        # 900 polls x 15 s = 3 h 45 m of WALL clock for 600 s of SIM. That is
        # not slack, it is the real-time factor: eight stereo pairs rendering
        # on one card is the RTF this sweep has never measured, and a budget
        # that is generous in sim seconds can still be hours in wall seconds.
        # Every 20th poll prints the planner's own progress so a stalled run
        # is visible in the mission log within five minutes instead of at the
        # timeout.
        for i in $(seq 1 900); do
          if timeout 10 ros2 topic echo /{robot}/search/run_complete --once 2>/dev/null | grep -q "data: true"; then
            echo RUN_COMPLETE {robot}; exit 0
          fi
          kill -0 "$(cat /tmp/search/planner.pid)" 2>/dev/null || {
            echo PLANNER_EXITED {robot}; tail -n 80 /tmp/search/planner.log; exit 1; }
          if [ $((i % 20)) -eq 0 ]; then
            echo "--- {robot} poll $i"
            grep -a "sim budget" /tmp/search/planner.log | tail -1
            grep -a "ground speed\|round [0-9]* |" /tmp/search/planner.log | tail -1
          fi
          sleep 15
        done
        echo RUN_DID_NOT_COMPLETE {robot}; tail -n 40 /tmp/search/planner.log; exit 1
      timeout_s: 13800

  - run:
      container: offboard-compute
      cmd: |
        if [ "{{env.method}}" != "conavgpt2_team" ]; then
          echo "SKIP team gate: sectored run is gated in step 7"; exit 0
        fi
        source /root/.bashrc >/dev/null 2>&1 || true
        export ROS_DOMAIN_ID=0
        # THE TEAM ARM HAS NO /clock. Isaac publishes it from a per-drone
        # OmniGraph node bound to that drone's ROS domain, so it exists on
        # domains 1..8 and NOT on 0, and dds_router.yaml does not bridge it.
        # `_sim_now` therefore falls back to the sim-time header stamps on the
        # bridged observations — the same clock read a different way. The
        # `Time source:` line printed at t0 says which one is in use, and it
        # is the first thing to read if this gate ever runs long.
        for i in $(seq 1 900); do
          if timeout 10 ros2 topic echo /robot_1/search/run_complete --once 2>/dev/null | grep -q "data: true"; then
            echo TEAM_RUN_COMPLETE; exit 0
          fi
          kill -0 "$(cat /tmp/search/planner.pid)" 2>/dev/null || {
            echo TEAM_PLANNER_EXITED; tail -n 80 /tmp/search/planner.log; exit 1; }
          if [ $((i % 20)) -eq 0 ]; then
            echo "--- team poll $i"
            grep -a "sim budget" /tmp/search/planner.log | tail -1
            grep -a "round [0-9]* |" /tmp/search/planner.log | tail -1
          fi
          sleep 15
        done
        echo RUN_DID_NOT_COMPLETE; tail -n 60 /tmp/search/planner.log; exit 1
      timeout_s: 13800

  # 8. Per-ROBOT results and the planner-side signals worth grepping, collected
  #    in each container. DEST carries the SCENE and the METHOD as well as the
  #    robot, so 24 iterations cannot overwrite each other.
  - run:
      container: airstack-robot-desktop-{n}
      cmd: |
        if [ "{{env.method}}" = "conavgpt2_team" ]; then echo "SKIP"; exit 0; fi
        source /root/.bashrc >/dev/null 2>&1 || true
        DEST=/root/AirStack/results/frozen_suburban_8robot/{{env.RESULTS_SCENE}}/{{env.method}}/{robot}
        mkdir -p "$DEST"
        cp -v /tmp/search/*.log "$DEST"/ 2>/dev/null || true
        cp -v /tmp/conavgpt2/search_planner_rounds.jsonl "$DEST"/ 2>/dev/null || true
        {
          echo "# sim budget: when it started and from which clock"
          grep -a "sim budget" /tmp/search/planner.log | head -2
          echo "# scene / sector / search area"
          grep -a "search area from the SCENE" /tmp/search/planner.log | head -1
          grep -a "sector [0-9]*/" /tmp/search/planner.log | head -1
          echo "# ticks with a detection / total"
          grep -ac "targets:" /tmp/search/planner.log
          grep -a "targets:" /tmp/search/planner.log | grep -acv "'n': 0,"
          echo "# detector gate, last summary, gate passes"
          grep -a "detector gate:" /tmp/search/planner.log | head -1
          grep -a "detector summary" /tmp/search/planner.log | tail -1
          grep -ac "detector PASS" /tmp/search/planner.log
          echo "# seen at >= 0.5 but under the gate, and the last three"
          grep -ac "detector SEEN" /tmp/search/planner.log
          grep -a "detector SEEN" /tmp/search/planner.log | tail -3
          echo "# speed caps and the last measured ground speeds"
          grep -a "NavigateTask max_speed ->" /tmp/search/planner.log | head -6
          grep -a "ground speed" /tmp/search/planner.log | tail -3
          echo "# people visited / given up / goals blacklisted"
          grep -ac "target VISITED" /tmp/search/planner.log
          grep -ac "GIVING UP" /tmp/search/planner.log
          grep -ac "BLACKLISTED" /tmp/search/planner.log
          echo "# lawnmower: known obstacles and lifted legs"
          grep -a "known obstacles:" /tmp/search/planner.log | head -1
          grep -ac "lifting it to" /tmp/search/planner.log
          echo "# vlfm: last 'N scored, M failed' + view-score failures"
          grep -aoE "[0-9]+ scored, [0-9]+ failed" /tmp/search/planner.log | tail -1
          grep -ac "view score failed" /tmp/search/planner.log
          echo "# MIGHTY: bridge engaged, trajectories dropped"
          grep -a "follower: engaging\|mighty_bridge up" /tmp/search/planner.log | head -2
          grep -ac "dropping trajectory" /tmp/search/planner.log
          echo "# detector-call failures seen by the planner"
          grep -acE "detector.*(fail|error|timeout)" /tmp/search/planner.log
        } > "$DEST"/summary.txt 2>&1
        cat "$DEST"/summary.txt
      timeout_s: 240
      expect_success: false

  # 9. Team-arm results: the ONE planner's log plus its per-round table
  #    (num_images / server_s / overran / parse), which is where a stalled VLM
  #    shows up as a stalled fleet.
  - run:
      container: offboard-compute
      cmd: |
        if [ "{{env.method}}" != "conavgpt2_team" ]; then echo "SKIP"; exit 0; fi
        DEST=/root/AirStack/results/frozen_suburban_8robot/{{env.RESULTS_SCENE}}/{{env.method}}
        mkdir -p "$DEST"
        cp -v /tmp/search/planner.log "$DEST"/ 2>/dev/null || true
        cp -v /tmp/conavgpt2/search_planner_rounds.jsonl "$DEST"/ 2>/dev/null || true
        {
          grep -a "search area from the SCENE" /tmp/search/planner.log | head -1
          echo "# sim budget: when it started and from which clock"
          grep -a "sim budget" /tmp/search/planner.log | head -2
          echo "# rounds: last few total_s/server_s, overruns, parse failures"
          grep -aoE "total_s=[0-9.]+.*server_s=[0-9.]+" /tmp/search/planner.log | tail -5
          grep -ac "overran" /tmp/search/planner.log
          grep -ac "parse" /tmp/search/planner.log
          echo "# assignments issued / targets visited"
          grep -ac "assign" /tmp/search/planner.log
          grep -ac "target VISITED" /tmp/search/planner.log
        } > "$DEST"/summary.txt 2>&1
        cat "$DEST"/summary.txt
      timeout_s: 240
      expect_success: false

  # 10. Whole-run server aggregates + poller stop. Written under the SCENE and
  #     METHOD so the 24 files can be compared directly.
  - run:
      container: robot_1
      cmd: |
        DEST=/root/AirStack/results/frozen_suburban_8robot/{{env.RESULTS_SCENE}}/{{env.method}}
        mkdir -p "$DEST"
        cp -v /tmp/search/server_metrics.jsonl "$DEST"/ 2>/dev/null || true
        cp -v /tmp/search/server_metrics_poller.log "$DEST"/ 2>/dev/null || true
        curl -s http://offboard-compute:8200/metrics > "$DEST"/detector_metrics_final.json 2>/dev/null || true
        curl -s http://offboard-compute:8100/metrics > "$DEST"/itm_metrics_final.json 2>/dev/null || true
        curl -s http://offboard-compute:8000/metrics > "$DEST"/vlm_metrics_final.json 2>/dev/null || true
        echo "# detector:"; cat "$DEST"/detector_metrics_final.json; echo
        echo "# itm:";      cat "$DEST"/itm_metrics_final.json; echo
        echo "# vlm:";      cat "$DEST"/vlm_metrics_final.json; echo
        echo "# poller samples: $(wc -l < /tmp/search/server_metrics.jsonl 2>/dev/null || echo 0)"
        kill "$(cat /tmp/search/poller.pid)" 2>/dev/null || true
        sleep 2; echo stopped
      timeout_s: 180
      expect_success: false

  # 11. Stop the planners. Both branches, unconditionally — a planner left
  #     running holds droan's task_active_ and the NEXT iteration's activator
  #     is rejected with "task already active".
  - run:
      container: airstack-robot-desktop-{n}
      cmd: |
        kill "$(cat /tmp/search/planner.pid)" 2>/dev/null || true
        sleep 1; echo stopped robot_{n}
      timeout_s: 60
    optional: true

  - run:
      container: offboard-compute
      cmd: |
        kill "$(cat /tmp/search/planner.pid)" 2>/dev/null || true
        sleep 1; echo stopped team planner
      timeout_s: 60
    optional: true

  - action:
      task: land
      goal: {}
      timeout_s: 300
      robots: all
    optional: true
