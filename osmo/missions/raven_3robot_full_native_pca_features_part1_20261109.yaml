iteration_attempts: 1
iterations: 1
name: raven_3robot_full_native_pca_features_part1_20261109
nas_dest: /volume4/dsta/raven-ablations/
on_step_failure: abort_iteration
ready:
  timeout_s: 1200
record:
  enabled: true
  required: true
  robot_topics:
  - /robot_{n}/rayfronts/voxel_rgb
  - /robot_{n}/rayfronts/msg_serv/voxels_sim/all
  scope: both
  topics:
  - /tf
  - /tf_static
  - /{robot}/odometry_conversion/odometry
  - /gcs/robot_markers
  - /gcs/payload/{robot}/filtered_rays
  - /gcs/payload/{robot}/filtered_frontiers
  - /gcs/payload/{robot}/explored_area_coverage
  - /gcs/payload/{robot}/confirmed_targets
  - /gcs/payload/{robot}/auction_table
  - /gcs/sim_ground
  - /gcs/annotations/bboxes
stack:
  services:
  - isaac-sim
  - robot-desktop
  - gcs
steps:
- optional: true
  run:
    cmd: 'echo "[pod] shm: $(df -h /dev/shm | tail -1) segments=$(ls -1 /dev/shm 2>/dev/null
      | wc -l)"; echo "[pod] disk: $(df -h / | tail -1)"'
    container: pod
    expect_success: false
    timeout_s: 60
- run:
    attempts: 5
    cmd: python3 -c "import torch; torch.hub.load('NVlabs/RADIO', 'radio_model', version='c-radio_v3-b',
      skip_validation=True, adaptor_names=['siglip2','sam'])"
    container: robot_1
    retry_delay_s: 15
    timeout_s: 900
- run:
    attempts: 5
    cmd: python3 -c "from huggingface_hub import snapshot_download; snapshot_download('OpenGVLab/InternVL3-2B')"
    container: robot_1
    retry_delay_s: 15
    timeout_s: 900
- action:
    goal:
      target_altitude_m: 12.0
      velocity_m_s: 1.0
    task: takeoff
    timeout_s: 180
- wait: 5
- action:
    attempts: 1
    cancel_on_timeout: false
    goal:
      background_queries: '{{env.background_queries}}'
      bundle_len: 3
      confidence_threshold: 0.95
      max_altitude_agl: 20.0
      max_flight_speed: 1.0
      max_sim_seconds: 300
      min_altitude_agl: 5.0
      min_flight_speed: 0.5
      query: '{{env.query}}'
      score_threshold: '{{env.score_threshold}}'
      search_area: '{{env.search_area}}'
      voxel_min_cluster_size: '{{env.voxel_min_cluster_size}}'
      voxel_score_threshold: '{{env.voxel_score_threshold}}'
    pass_on_feedback: false
    task: semantic_search
    timeout_s: 2400
- run:
    container: pod
    cmd: python3 osmo/workspace/check_map_sharing_fleet.py
    timeout_s: 300
