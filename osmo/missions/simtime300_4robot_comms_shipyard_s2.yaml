# simtime300_4robot_comms_shipyard_s2
#
# The 8 shipyard_s2 comms runs, pulled out of the main rerun chunks.
#
# shipyard_s2 has NEVER completed at 4 robots: in simtime300_4robot_refly it
# was the only failure (iters 13-16 failed, 1-12 and 17-20 passed on the same
# pod), because its supplied spawn rect is nowhere near the env's actual spawn
# band. The layout here is the parent mission's fallback, spread across the
# original band x[32,56] y[-54,-45]. Treat these as unproven and run them last
# — kept separate so they cannot burn iteration_attempts inside a chunk that
# would otherwise complete.
#
# Contents (8 envs): shipyard_s2 x {{multiraven, frontier, vlfm, lvlm}}
#                    x {{comms50, comms30}}

