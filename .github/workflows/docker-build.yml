name: Auto Build on Docker Image Tag Change

on:
  push:
    branches: [ main, develop ]  # Adjust branches as needed
    paths:
      - '.env'
  workflow_dispatch:
    inputs:
      compose_profiles:
        description: 'Docker Compose profiles to build (comma-separated)'
        required: false
        default: 'desktop,isaac-sim,ms-airsim'
        type: string
      force_rebuild:
        description: 'Force a full rebuild of every service (skip retag)'
        required: false
        default: false
        type: boolean

env:
  DEFAULT_PROFILES: 'desktop,isaac-sim,ms-airsim'

jobs:
  check-docker-tag-change:
    runs-on: ubuntu-latest
    outputs:
      tag-changed: ${{ steps.check-changes.outputs.tag-changed }}
      current-version: ${{ steps.check-changes.outputs.current-version }}
      previous-version: ${{ steps.check-changes.outputs.previous-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Fetch current and previous commit
          submodules: recursive

      - name: Check if VERSION changed
        id: check-changes
        run: |
          # Get the current VERSION value
          CURRENT_TAG=$(grep "^VERSION=" .env | cut -d '=' -f2- | tr -d '"' | tr -d "'")

          # Get the previous VERSION value
          git show HEAD~1:.env > .env.prev 2>/dev/null || echo "" > .env.prev
          PREVIOUS_TAG=$(grep "^VERSION=" .env.prev | cut -d '=' -f2- | tr -d '"' | tr -d "'" || echo "")

          echo "Current tag: $CURRENT_TAG"
          echo "Previous tag: $PREVIOUS_TAG"
          echo "current-version=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          echo "previous-version=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_TAG" != "$PREVIOUS_TAG" ] && [ -n "$CURRENT_TAG" ]; then
            echo "VERSION has changed from '$PREVIOUS_TAG' to '$CURRENT_TAG'"
            echo "tag-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION has not changed"
            echo "tag-changed=false" >> "$GITHUB_OUTPUT"
          fi

  docker-build:
    needs: check-docker-tag-change
    if: github.event_name == 'workflow_dispatch' || needs.check-docker-tag-change.outputs.tag-changed == 'true'
    runs-on: [self-hosted, airstack-ephemeral]
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write  # Required for keyless cosign signing via GitHub OIDC
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY_URL }}  # e.g., your-registry.com or leave empty for Docker Hub
          username: ${{ vars.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Verify .env file and extract tag
        run: |
          if [ ! -f .env ]; then
            echo "Error: .env file not found"
            exit 1
          fi

      - name: Create dummy omni_pass.env
        run: |
          # Some compose files expect this file to exist, even if it is empty.
          mkdir -p simulation/isaac-sim/docker
          : > simulation/isaac-sim/docker/omni_pass.env

          DOCKER_TAG=$(grep "^VERSION=" .env | cut -d '=' -f2- | tr -d '"' | tr -d "'")
          echo "Building with VERSION: $DOCKER_TAG"

          if [ -z "$DOCKER_TAG" ]; then
            echo "Error: VERSION is empty"
            exit 1
          fi

      - name: Resolve compose profiles and previous VERSION
        id: prep
        run: |
          set -a
          source .env
          set +a

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            export COMPOSE_PROFILES="${{ github.event.inputs.compose_profiles || env.DEFAULT_PROFILES }}"
          else
            export COMPOSE_PROFILES="${{ env.DEFAULT_PROFILES }}"
          fi

          PREVIOUS_VERSION="${{ needs.check-docker-tag-change.outputs.previous-version }}"
          CURRENT_VERSION="${{ needs.check-docker-tag-change.outputs.current-version }}"
          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION=$(grep "^VERSION=" .env | cut -d '=' -f2- | tr -d '"' | tr -d "'")
          fi

          FORCE_REBUILD=false
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.force_rebuild }}" == "true" ]; then
            FORCE_REBUILD=true
          fi

          echo "COMPOSE_PROFILES=$COMPOSE_PROFILES" >> "$GITHUB_ENV"
          echo "PREVIOUS_VERSION=$PREVIOUS_VERSION" >> "$GITHUB_ENV"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"
          echo "FORCE_REBUILD=$FORCE_REBUILD" >> "$GITHUB_ENV"
          echo "profiles=$COMPOSE_PROFILES" >> "$GITHUB_OUTPUT"
          echo "previous-version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"
          echo "force-rebuild=$FORCE_REBUILD" >> "$GITHUB_OUTPUT"

      # Content-aware publish: retag previous versioned images when image inputs
      # are unchanged; rebuild only services whose fingerprint differs (or when
      # force_rebuild / unlabeled previous images force a cold build).
      - name: Plan retag vs rebuild
        id: plan
        run: |
          set -a
          source .env
          set +a
          export COMPOSE_PROFILES="${{ env.COMPOSE_PROFILES }}"

          FORCE_ARGS=()
          if [ "${{ env.FORCE_REBUILD }}" = "true" ]; then
            FORCE_ARGS+=(--force-rebuild)
          fi

          python3 .github/workflows/scripts/docker_image_plan.py \
            --version "${{ env.CURRENT_VERSION }}" \
            --previous-version "${{ env.PREVIOUS_VERSION }}" \
            --profiles "${{ env.COMPOSE_PROFILES }}" \
            --plan-out docker-image-plan.json \
            --override-out docker-compose.fingerprint.yaml \
            "${FORCE_ARGS[@]}"

          echo "Plan summary:"
          jq -r '.services | to_entries[] | "  \(.key): \(.value.action) (\(.value.reason))"' docker-image-plan.json

      - name: Retag unchanged images
        run: |
          set -euo pipefail
          RETAG_COUNT=$(jq '[.services[] | select(.action=="retag")] | length' docker-image-plan.json)
          echo "Services to retag: $RETAG_COUNT"
          if [ "$RETAG_COUNT" -eq 0 ]; then
            echo "Nothing to retag."
            exit 0
          fi

          jq -c '.services | to_entries[] | select(.value.action=="retag") | .value' docker-image-plan.json \
            | while IFS= read -r row; do
                IMAGE=$(echo "$row" | jq -r '.image')
                PREV=$(echo "$row" | jq -r '.previous_image')
                CACHE=$(echo "$row" | jq -r '.cache_tag // empty')
                echo "Retagging $PREV → $IMAGE"
                CREATE_ARGS=(--tag "$IMAGE")
                if [ -n "$CACHE" ] && [ "$CACHE" != "null" ]; then
                  echo "  also → $CACHE"
                  CREATE_ARGS+=(--tag "$CACHE")
                fi
                docker buildx imagetools create "${CREATE_ARGS[@]}" "$PREV"
              done

      - name: Build changed images
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          export COMPOSE_PROFILES="${{ env.COMPOSE_PROFILES }}"

          BUILD_SERVICES=$(jq -r '[.services | to_entries[] | select(.value.action=="build") | .key] | join(" ")' docker-image-plan.json)
          if [ -z "$BUILD_SERVICES" ]; then
            echo "No services require a rebuild."
            exit 0
          fi

          echo "Building services: $BUILD_SERVICES"
          # Override applies org.airstack.content-fingerprint build labels.
          # shellcheck disable=SC2086
          docker compose \
            -f docker-compose.yaml \
            -f docker-compose.fingerprint.yaml \
            build $BUILD_SERVICES

      - name: Push rebuilt images
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          export COMPOSE_PROFILES="${{ env.COMPOSE_PROFILES }}"

          BUILD_SERVICES=$(jq -r '[.services | to_entries[] | select(.value.action=="build") | .key] | join(" ")' docker-image-plan.json)
          if [ -z "$BUILD_SERVICES" ]; then
            echo "No rebuilt images to push."
            exit 0
          fi

          # shellcheck disable=SC2086
          docker compose \
            -f docker-compose.yaml \
            -f docker-compose.fingerprint.yaml \
            push $BUILD_SERVICES

      # `docker compose push` only publishes each service's `image:` (the
      # versioned tag). Floating CACHE_TAG entries are also applied via
      # build.tags on rebuild; retag already published them via imagetools.
      - name: Publish floating cache tags for rebuilt images
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          export COMPOSE_PROFILES="${{ env.COMPOSE_PROFILES }}"

          TAGS=$(jq -r --arg pfx ":${CACHE_TAG:-cache}_" '
            .services | to_entries[]
            | select(.value.action=="build")
            | .value.cache_tag // empty
            | select(length > 0 and contains($pfx))
          ' docker-image-plan.json | sort -u)

          if [ -z "$TAGS" ]; then
            echo "No rebuilt cache tags to publish (retag path already set them, or no rebuilds)."
            exit 0
          fi

          for TAG in $TAGS; do
            echo "Pushing cache tag $TAG"
            docker push "$TAG"
          done

      - name: Sign published images with Cosign (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          export COMPOSE_PROFILES="${{ env.COMPOSE_PROFILES }}"

          IMAGES=$(jq -r '.services[].image' docker-image-plan.json | sort -u)
          if [ -z "$IMAGES" ]; then
            echo "No images resolved from plan; nothing to sign."
            exit 1
          fi

          for IMG in $IMAGES; do
            DIGEST=$(docker buildx imagetools inspect "$IMG" --format '{{.Manifest.Digest}}')
            if [ -z "$DIGEST" ]; then
              echo "Error: could not resolve digest for $IMG"
              exit 1
            fi
            REPO="${IMG%:*}"
            REF="${REPO}@${DIGEST}"
            echo "Signing $REF"
            cosign sign "$REF"
          done

      - name: Verify Cosign signatures
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          export COMPOSE_PROFILES="${{ env.COMPOSE_PROFILES }}"

          IMAGES=$(jq -r '.services[].image' docker-image-plan.json | sort -u)
          for IMG in $IMAGES; do
            DIGEST=$(docker buildx imagetools inspect "$IMG" --format '{{.Manifest.Digest}}')
            REPO="${IMG%:*}"
            REF="${REPO}@${DIGEST}"
            echo "Verifying $REF"
            cosign verify "$REF" \
              --certificate-identity-regexp "^https://github\\.com/${{ github.repository }}/\\.github/workflows/docker-build\\.yml@" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              > /dev/null
          done

      - name: Upload image plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-plan-${{ github.run_id }}
          path: |
            docker-image-plan.json
            docker-compose.fingerprint.yaml
          if-no-files-found: ignore

  notify:
    needs: [check-docker-tag-change, docker-build]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.check-docker-tag-change.outputs.tag-changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Notify build and push result
        run: |
          if [ "${{ needs.docker-build.result }}" == "success" ]; then
            echo "✅ Docker Compose build/retag and push completed successfully"
          else
            echo "❌ Docker Compose build/retag or push failed"
            exit 1
          fi
