name: Unit Tests

# Fast, hermetic unit tests — pure Python, no Docker, no GPU.
# Runs on every push and every PR so feedback arrives in seconds,
# not after the GPU runner provisions.
#
# These tests mirror the robot/ros_ws/src/ layer layout:
#   tests/robot/perception/…  proxy → robot/ros_ws/src/perception/…/test/
#   tests/robot/sensors/…     proxy → robot/ros_ws/src/sensors/…/test/
#   tests/sim/…               proxy → simulation/…/test/  (future)
#   tests/gcs/…               proxy → gcs/…/test/         (future)

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  unit-tests:
    name: Unit Tests (pytest -m unit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install dependencies
        run: pip install pytest numpy

      - name: Run unit tests
        env:
          AIRSTACK_ROOT: ${{ github.workspace }}
        run: |
          pytest tests/ -m unit \
            -v \
            --log-cli-level=INFO \
            --log-cli-format='%(asctime)s [%(levelname)s] %(message)s' \
            --log-cli-date-format='%H:%M:%S'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.sha }}
          path: tests/results/
          retention-days: 30
