# Synthetic GPS origin for mocap / no-GNSS flight via MAVROS.
# Loaded by mavros_gp_origin.launch.xml when publish_to_mavros is enabled.
# See docs/robot/px4_external_vision.md for the height-datum explanation.

/**:
  ros__parameters:
    # Skipped if an origin already exists (e.g. a GNSS-equipped vehicle).
    enabled: true
    # MUST match the GCS world origin (gcs_visualizer/gcs_utils.py) and the sim
    # datum (launch_scripts/gps_utils.py), or the relay computes a huge ENU offset.
    latitude: 38.736832
    longitude: -9.137977
    # Shared world datum; used directly when use_geoid_altitude is false or in sim.
    altitude: 90.0
    # Real hardware: derive origin altitude from the geoid so local_position z
    # equals OptiTrack height. Auto-skipped in sim.
    use_geoid_altitude: true
    desired_floor_amsl: 0.0
    geoid_model: "egm96-5"
    settle_sec: 5.0
