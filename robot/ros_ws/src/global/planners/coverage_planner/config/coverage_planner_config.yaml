/**:
  ros__parameters:
    # ---- Frames & topics ----------------------------------------------
    world_frame_id: "map"
    pub_global_plan_topic: "~/global_plan"
    pub_path_viz_topic: "~/coverage_path_viz"
    pub_coverage_area_viz_topic: "~/coverage_area_viz"
    sub_odometry_topic: "odometry"

    # ---- Defaults (used if the CoverageTask goal doesn't override) ----
    default_altitude_m: 5.0           # world-z altitude (m) when goal min/max AGL is 0
    default_line_spacing_m: 5.0       # perpendicular spacing between sweep lines (m)
    default_boundary_inset_m: 0.0     # shrink the polygon by this much before sweeping (m)
    waypoint_tolerance_m: 2.0         # goal_tolerance_m passed to the local planner (m)
    direct_cruise_speed_mps: 2.0      # fallback speed for direct trajectory override (m/s)
    direct_sequence_tolerance_m: 0.35  # distance threshold for advancing subgoals (m)
    direct_sequence_advance_speed_mps: 0.35  # require slowing before advancing at corners
    direct_sequence_republish_period_s: 0.0  # 0 disables refreshing the active subgoal

    # ---- Behaviour ----------------------------------------------------
    # direct: send the lawnmower path to the trajectory controller as the actual reference
    # direct_sequential: send short trajectory overrides one subgoal at a time
    # auto: use NavigateTask when available, otherwise fall back to direct
    # navigate: require the downstream local planner NavigateTask action
    execution_mode: "direct_sequential"
    publish_visualizations: true      # publish RViz markers for the generated path
