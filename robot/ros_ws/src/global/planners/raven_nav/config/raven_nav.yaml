raven_nav:
  ros__parameters:
    timer_period: 0.5       # seconds between behavior loop iterations
    score_threshold: 0.68   # minimum softmax sim score to consider a ray
    min_altitude_agl: 3.0   # filter rays/frontiers below this altitude (m)
    max_altitude_agl: 15.0  # filter rays/frontiers above this altitude (m)
    # Temporal confirmation: a detection must persist across N ticks before it
    # counts, then rides out up to *_track_max_misses dropped ticks. 1 = off.
    voxel_confirm_hits: 3
    voxel_track_max_misses: 4
    ray_confirm_hits: 3
    ray_track_max_misses: 4
    # Must match the query order registered in RayFronts (target + background)
    query_labels:
      - 'red building'
      - 'water tower'
      - 'radio tower'
    # Which of the above to actually navigate toward (empty = all query_labels)
    target_labels: []
    # Run the frontier-only baseline: navigation ignores semantic cues.
    # (semantic_search_task spawns raven_nav with -p args, not this file,
    # and currently sets this to true — see semantic_search_task/node.py.)
    frontier_only_baseline: false
