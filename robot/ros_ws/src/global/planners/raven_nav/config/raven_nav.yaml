# raven_nav — single-agent RAVEN (Voxel > Ray > LVLM-guided > Frontier).
#
# NOTE: this file is read ONLY by launch/raven_nav.launch.xml. The mission path
# (semantic_search_task) spawns the node with `ros2 run ... --ros-args -p ...`
# and NO --params-file, so on a real run the declare_parameter() defaults in
# raven_nav/params.py are what apply. The values below mirror those defaults;
# every threshold is the original RAVEN paper value, with its source file.
raven_nav:
  ros__parameters:
    timer_period: 0.5             # behaviour loop period (s)

    # ── behaviour thresholds — ORIGINAL RAVEN values ────────────────────────
    # Ray-based search fires when a ray's softmax score on a target column
    # exceeds this (OG rayfronts/behaviors/ray_behavior.py:42).
    score_threshold: 0.95
    # Voxel-based go-to-object gate (OG behaviors/voxel_behavior.py:51).
    voxel_score_threshold: 0.98
    # Minimum voxels in a 26-connected component to become a target box
    # (OG behaviors/voxel_behavior.py:78).
    voxel_min_cluster_size: 30
    # Report-side only: drop AABBs whose mean score is below this. 0 = report
    # all. Not an OG knob; it exists because the benchmark scores detections.
    voxel_min_confidence: 0.0

    # ── altitude band (DEVIATION 1) ─────────────────────────────────────────
    # OG emitted whatever z the map gave it. Every waypoint is clamped into
    # this band here, because a casualty's standoff point is ~0.5 m AGL.
    min_altitude_agl: 3.0
    max_altitude_agl: 15.0

    # ── LVLM-guided behaviour ───────────────────────────────────────────────
    # Enabled unless env RAVEN_LVLM says otherwise. An unreachable VLM endpoint
    # disables it at startup (the chain then falls through to Frontier).
    lvlm_enabled: true
    lvlm_request_interval_s: 30.0   # OG LVLM/internvl3.py:35
    lvlm_ray_threshold: 0.9         # OG behaviors/lvlm_behavior.py:78
    lvlm_vlm_url: ''                # '' -> $VLM_URL, $OPENAI_BASE_URL, then
                                    #       http://offboard-compute:8000/v1
    lvlm_vlm_model: ''              # '' -> $CONAVGPT2_VLM_MODEL, else the
                                    #       endpoint's first served model
    lvlm_image_topic: ''            # '' -> /$ROBOT_NAME/sensors/front_stereo/
                                    #       left/image_rect

    # ── queries ─────────────────────────────────────────────────────────────
    # Must match the query order registered in RayFronts (targets + background).
    # The authoritative order is re-derived at runtime from the q{k}_<label>
    # topic names rayfronts publishes.
    query_labels:
      - 'red building'
      - 'water tower'
      - 'radio tower'
    # Which of the above to navigate toward (empty = all query_labels).
    target_labels: []

    # ── coverage / completion (DEVIATION 4) ─────────────────────────────────
    # RAVEN had no "done"; semantic_search_task ends a search on
    # navigation_mode == 'complete', which this threshold produces.
    coverage_complete_threshold: 0.90
    coverage_cell_size_m: 0.5
    coverage_raycast_range_m: 30.0
    coverage_raycast_min_step_m: 5.0

    # ── output ──────────────────────────────────────────────────────────────
    results_dir: ''
    results_dump_period_s: 3.0
    nav_output_enabled: true
    debug_ray_table: true
    debug_table_max_rows: 30
    debug_table_period_sec: 5.0
    debug_coordination: true

    # ── the one surviving baseline (DEVIATION 3) ────────────────────────────
    # Pure frontier navigation; passive voxel detection keeps running so the
    # arm still reports confirmed_targets / discoveries.
    frontier_only_baseline: false

    # Parameters below are ACCEPTED (semantic_search_task still passes them)
    # but INERT: the auction/consensus, peer state and the VLFM / Co-NavGPT
    # baselines were removed with the multi-robot code. The node logs any that
    # are set to a non-default value once, as ignored.
    # vlfm_baseline, vlfm_use_voxel_targets, vlfm_value_weight,
    # vlfm_ray_blacklist, conavgpt_baseline, conavgpt_leader_id,
    # conavgpt_round_period_s, conavgpt_max_regions, conavgpt_assignment_ttl_s,
    # conavgpt_replan_on_reach_m, bundle_len, voxel_confirm_hits,
    # voxel_track_max_misses, voxel_proximity_engage_m, ray_confirm_hits,
    # ray_track_max_misses, commit_swap_improvement_frac, commit_min_hold_s,
    # commit_radius_m, ray_reach_factor, target_behind_penalty_weight,
    # commit_switch_margin_m, debug_auction, bb_release_timeout_s
