llm_nav:
  ros__parameters:
    # HuggingFace model id (cached under /root/.cache on first run).
    model_path: 'Qwen/Qwen3-1.7B'
    # Target to search for; overridden at spawn by the semantic_search query.
    target: 'house'
    # Qwen3 thinking mode: off by default for latency at the narrate cadence.
    enable_thinking: false
    # Enough for action JSON + a short "seeing" sentence; too low truncates
    # mid-JSON and every decide falls back (seen when the digest grew large).
    max_new_tokens: 384
    # '4bit' (nf4, ~1.8 GB) fits alongside Isaac Sim + rayfronts on a shared
    # 16 GB GPU; 'none' (bf16, ~3.5 GB, fastest) for a dedicated GPU; '8bit'
    # exists but is slow (bnb int8 matmul) and barely smaller than needed.
    quantization: '4bit'
    # Waypoints are clamped to [min, max] altitude (m); the mission's
    # semantic_search goal overrides these at spawn.
    min_altitude_agl: 5.0
    max_altitude_agl: 20.0

    # ── digest / presentation knobs (NOT detection thresholds — the LLM
    #    judges instances from size + labels + scores together) ─────────────
    # Seconds between digest rebuilds and between narrate calls while committed.
    digest_period_s: 5.0
    narrate_period_s: 12.0
    # Clustering params below are PRE-LLM FALLBACKS only: with llm_perception
    # the LLM sets {min_voxels, score_floor, merge_gap_m} for the target at
    # startup and can retune them mid-run (the `retune` action) — no fixed
    # per-target thresholds.
    llm_perception: true
    retune_cooldown_s: 60.0
    # Fallback per-voxel cos-sim floor (rayfronts runs compute_prob=False,
    # raw cos-sims typically 0.05-0.30).
    floor_cos: 0.12
    # Fallback smallest connected component shown as an instance (0.5m voxels).
    min_instance_voxels: 8
    # 'alias=canonical': part labels cluster into their parent object so one
    # physical house is ONE growing instance, not roof/wall fragments.
    # Base list; with llm_aliases the LLM extends it per target at startup
    # ("which labels are PARTS of a {target}?") so nothing is hand-set per run.
    label_aliases: ['roof=house']
    llm_aliases: true

    # ── exploration (used when no unvisited target candidates remain) ──────
    # survey: climb to max altitude and fly a circle — droan yaws along the
    # velocity, so the camera sweeps the horizon and casts semantic rays at
    # everything distant; the next digest fills with labeled ray leads.
    survey_radius_m: 8.0
    survey_cooldown_s: 120.0
    # Digest caps so the prompt stays ~1-2k tokens.
    max_instances_shown: 15
    max_ray_groups: 8
    # Azimuth sector width for grouping rays (deg).
    ray_sector_deg: 30.0
    # A ray group is "pointing at" an instance if its line passes within this
    # radius of the instance centroid (m), out to assoc_max_range_m.
    assoc_radius_m: 8.0
    assoc_max_range_m: 40.0

    # ── commitment geometry ────────────────────────────────────────────────
    # goto_ray waypoint distance along the mean ray direction (m).
    ray_commit_dist_m: 15.0
    # goto_instance standoff from the instance bbox surface toward the robot (m).
    # (Goal placement only — the published global_plan is raven's recipe:
    # [waypoint, waypoint + 2m], a short stub AT the goal, never a
    # robot->goal line; droan free-routes there with obstacle avoidance.)
    standoff_m: 5.0
    # Arrival radius (m) — instance surface distance or waypoint distance.
    reach_m: 3.0
    # Abort a commitment if distance-to-waypoint hasn't improved by
    # progress_epsilon_m for progress_timeout_s.
    progress_timeout_s: 90.0
    progress_epsilon_m: 2.0
    blacklist_ttl_s: 120.0

    # ── open-set label bank ────────────────────────────────────────────────
    # Registered with rayfronts as standing queries alongside the target, so
    # every voxel/ray carries named top-k scores. object_labels get instanced;
    # surface_labels are summarized and never proposed as goals.
    label_bank: [
      'house', 'roof', 'car', 'truck', 'tree', 'bush', 'fence', 'swimming pool',
      'driveway', 'garage', 'shed', 'utility pole', 'street light', 'mailbox',
      'trampoline', 'playground', 'water tower', 'billboard', 'container',
      'road', 'grass', 'sidewalk', 'parking lot', 'mountain', 'dirt', 'wall',
    ]
    surface_labels: ['road', 'grass', 'sidewalk', 'parking lot', 'mountain', 'dirt', 'sky', 'ground']

    # Where the JSONL event log (every prompt/response/decision/function call)
    # is written; empty -> /tmp.
    results_dir: ''
