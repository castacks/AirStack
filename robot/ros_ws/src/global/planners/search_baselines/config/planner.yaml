# Defaults for the conavgpt2 node. Top-level key must match the node name.
#
# Values marked NEEDS TUNING have a defensible default but have not been checked
# against a real run; see the README section of the same name.
search_planner:
  ros__parameters:

    # ── team ────────────────────────────────────────────────────────────────
    # AirStack gives each robot its own container AND its own ROS_DOMAIN_ID, so
    # one process normally sees exactly one robot. num_robots > 1 only works
    # where the other robots' camera topics are actually visible.
    num_robots: 1
    robot_names: ['']              # empty -> robot_name_template x num_robots
    robot_name_template: 'robot_{i}'
    robot_index_base: 1

    # ── inputs (every topic is a parameter; these are the AirStack names) ────
    rgb_topic_template: '/{robot}/sensors/front_stereo/left/image_rect'
    # RIGHT, not left. The ZED subgraph publishes depth off the RIGHT render
    # product (`/{robot}/sensors/front_stereo/right/depth_ground_truth`);
    # rgb and camera_info are on the left. Pointed at `left`, the sync had one
    # live stream and one topic with no publisher, so it never emitted a pair
    # and every tick exited at "waiting for rgb/depth/camera_info/odometry" —
    # which reads as a camera fault and is a topic-name bug. Verified with
    # `ros2 topic info -v`: search_planner was absent from the right topic's
    # subscriber list entirely.
    depth_topic_template: '/{robot}/sensors/front_stereo/right/depth_ground_truth'
    camera_info_topic_template: '/{robot}/sensors/front_stereo/left/camera_info'
    odom_topic_template: '/{robot}/odometry_conversion/odometry'
    navsat_topic_template: '/{robot}/interface/mavros/global_position/raw/fix'

    # ── outputs ─────────────────────────────────────────────────────────────
    navigate_action_template: '/{robot}/tasks/navigate'
    global_plan_topic_template: '/{robot}/global_plan'
    map_image_topic: '/{robot}/search/map_image'
    vlm_image_topic: '/{robot}/search/vlm_prompt_image'
    agent_image_topic_template: '/{robot}/search/agent_image'
    round_stats_topic: '/{robot}/search/round_stats'
    occupancy_topic: '/{robot}/occupancy'
    frontier_marker_topic: '/{robot}/frontiers'
    frontier_marker_max_cells: 400   # cubes per frontier; thinned, not truncated
    # 'centroids' (the goal point only) | 'cells' (the region) | 'both'
    frontier_marker_style: 'centroids'
    # Draw height above map z=0. The sim ground is a flat plane at world
    # z=0 and so is this grid; at the same height they z-fight.
    occupancy_z_offset_m: 0.5
    run_complete_topic: '/{robot}/search/run_complete'
    value_map_topic: '/{robot}/value_map'
    # The three-state voxel map as a coloured cloud: green empty, red
    # occupied, unobserved omitted. Deliberately NOT bridged to the GCS
    # (dds_router's own note explains why point clouds are not) — watch it
    # on the robot domain.
    voxel_cloud_topic: '/{robot}/voxel_map'

    # ── frames ──────────────────────────────────────────────────────────────
    map_frame: 'map'
    pose_source: 'tf'              # 'tf' (exact, same domain only) | 'odom'
    camera_optical_frame_template: 'camera_left'
    frame_mode: 'local'            # 'local' | 'global_enu' (needed to merge robots)
    map_origin_xy: [0.0, 0.0]      # grid centre in the merge frame; must be set for global_enu
    camera_pitch_rad: 0.0          # the scene mounts the ZED level; do not invent one
    camera_offset_xyz: [0.209, 0.060, -0.037]   # base_link -> camera_left, odom path only

    # ── sensor conditioning ─────────────────────────────────────────────────
    sync_slop_s: 0.10
    sync_queue_size: 10
    depth_encoding_scale: 1.0      # AirStack depth is 32FC1 metres
    depth_min_m: 0.5
    depth_max_m: 60.0              # NEEDS TUNING
    depth_border_px: 0
    frame_width: 640               # upstream's render composites the FPV at 640x480
    frame_height: 480

    # ── map geometry ────────────────────────────────────────────────────────
    map_extent_m: 500.0            # upstream shipped 24 m: a house, not a suburb
    map_cells: 480                 # must stay 480: the VLM overlay assumes it
    map_resolution_cm: 0           # 0 -> derived from map_extent_m / map_cells
    map_size_cm: 0                 # 0 -> derived
    obstacle_min_z_m: 2.0          # NEEDS TUNING - ground vs structure, in m AGL
    obstacle_max_z_m: 15.0         # NEEDS TUNING
    scene_voxel_m: 0.25            # upstream 0.05, indoor
    scene_dbscan_eps_m: 0.0        # upstream 0.1; 0 with min_points 0 disables
    scene_dbscan_min_points: 0
    frontier_threshold_points: 20
    # 0 -> derived from map_extent_m (6 at 240 m, linear, capped by the
    # limit below). Upstream's hardcoded value is 6. Every extra frontier is
    # another BEV image in the prompt (~290 tokens) and more prefill time.
    max_frontiers: 0
    max_frontiers_limit: 12
    # 'smallest' (upstream: indoors a small frontier is a doorway) |
    # 'largest'  (outdoors from the air the prior inverts)
    frontier_order: 'smallest'

    # ── where frontiers come from ───────────────────────────────────────────
    #   'slab2d'  upstream: ONE altitude slab, so every frontier is at the same
    #             height because the map has no height.
    #   'voxel3d' rayfronts' definition: a three-state voxel map built by ray
    #             CARVING, frontier = EMPTY voxel with unobserved neighbours.
    #             Frontiers appear at every height actually seen through, and
    #             each carries its own z, which becomes the waypoint altitude.
    frontier_source: 'slab2d'
    voxel_size_m: 2.0
    # Range past which stereo depth is not a surface measurement. Returns
    # beyond it carve free space but mark nothing occupied.
    voxel_max_range_m: 20.0
    # A NAVIGATION map, not a survey: voxels not re-observed for this long go
    # back to unobserved and the frontiers in them are dropped, so the map
    # stays local to the drone. 0 keeps the whole scene.
    voxel_forget_after_s: 60.0
    voxel_carve_samples: 24          # samples along each ray when carving free
    voxel_max_points_per_tick: 20000
    voxel_neighborhood_r: 1          # (2r+1)^3 box, as rayfronts' neighborhood_r
    # EXACTLY rayfronts' frontier_vdb_map defaults, so this arm's frontier
    # definition is the same object as the one in RayFronts.
    voxel_min_unobserved: 4          # rayfronts' fronti_min_unobserved
    voxel_min_empty: 2               # rayfronts' fronti_min_empty
    # rayfronts can demand a nearby surface to suppress frontiers in open sky.
    # Indoors that helps; from the air it would delete the frontiers that matter.
    voxel_min_occupied: 0            # rayfronts' fronti_min_occupied
    # Frontiers ACCUMULATE and are invalidated only inside the bbox each
    # observation wrote (rayfronts update_frontiers). These two are its
    # voxel-grid subsample: group on a lattice N times coarser and keep only
    # groups holding at least `min_cells` frontier voxels.
    frontier_subsampling: 4          # rayfronts' fronti_subsampling
    frontier_subsampling_min_cells: 10   # rayfronts' fronti_subsampling_min_fronti
    voxel_frontier_subsample: 2
    # Height span of the voxel MAP (map-frame metres) — NOT the flight band.
    # The map must contain the ground and the buildings or nothing is ever
    # carved empty and no frontier can form. min_/max_altitude_agl_m still
    # filter which frontiers are CANDIDATES; that is a different question.
    # Where FRONTIERS may be — a different question from where the drone may
    # fly (min_/max_altitude_agl_m). 0 falls back to the flight band.
    # Offer the best frontier at each height before a second one anywhere.
    # Pure gain order collapses all candidates onto the least-observed height.
    frontier_z_stratify: true
    frontier_z_min_m: 0.0
    frontier_z_max_m: 0.0
    voxel_z_min_m: 0.0
    voxel_z_max_m: 0.0               # 0 -> obstacle ceiling / altitude ceiling + pad
    incremental_mapping: true

    # ── cadence ─────────────────────────────────────────────────────────────
    plan_period_s: 1.0
    round_period_s: 30.0           # 0 -> upstream's every-num_local_steps cadence
    num_local_steps: 25
    warmup_steps: 0                # upstream spun the robot for 30 steps first
    # SIM seconds of flight before the run is declared over and planning
    # stops (the node stays up so the final map survives). 0 = unbounded.
    # Matches semantic_search_task's max_sim_seconds so a CoNavGPT run is
    # bounded by the same budget as every other baseline here.
    max_sim_seconds: 0.0
    # 'gpt'     upstream Co-NavGPT: the VLM picks a frontier from numbered BEVs
    # 'vlfm'    VLFM: the VLM scores the live RGB, the score is painted into a
    #           value map, and the frontier in the highest-value cell wins
    # 'nearest' geometric control: closest frontier, no VLM at all
    # All three share the SAME map, frontiers and actuation, so a difference
    # in results is attributable to the selection policy and nothing else.
    nav_mode: 'gpt'

    # ── target ──────────────────────────────────────────────────────────────
    goal_name: 'person'
    detection_classes: ['person', 'car', 'truck', 'house', 'building', 'tree', 'smoke', 'fire']
    # ONE THRESHOLD FOR EVERY ARM AND EVERY SCENE. The detector is shared, so
    # it must not be a source of difference between arms — the same reason the
    # arms share one map, one frontier source and one actuation. Every method
    # and scene overlay is pinned to this same 0.65; upstream's 0.85 is an
    # indoor close-range number and is unreachable at aerial range (measured:
    # real people top out at 0.70 on the wildfire plat, 0.67 on suburb_mini).
    # 0.65 sits above the highest FALSE positive measured on the house bench
    # (a spurious `person` at 0.32) and under the confident real detections.
    sem_threshold: 0.65
    # LOGGING ONLY — does not move the gate. Every tick with a goal-class box
    # at or above this is logged unthrottled with each box's score and pixel
    # rect: "detector SEEN" when the best is under sem_threshold (seen, not
    # mapped), "detector PASS" when it cleared it (mapped). The annotated
    # frame goes out on /{robot}/search/detection_image on the same ticks.
    # 0.5 shows the band a threshold decision is made from.
    detector_log_conf: 0.5
    # SIM seconds between "detector summary" log lines per robot (ticks, goal
    # proposals, gate passes, run max, confidence histogram).
    detector_log_period_s: 30.0

    # ── actuation ───────────────────────────────────────────────────────────
    flight_altitude_m: 15.0
    goal_tolerance_m: 2.5
    nav_goal_timeout_s: 60.0
    goal_change_threshold_m: 5.0
    path_extension_m: 2.0
    # Speed by INTENT, carried to droan_gl ON THE NavigateTask GOAL
    # (task_msgs NavigateTask.Goal.max_speed_mps; droan applies it per goal
    # and PREEMPTS the running goal when a new cap arrives). Three gears:
    #   transit_speed_mps  OUTSIDE the robot's own sector and not on a
    #                      target — only travelling, so the fleet gets to
    #                      its strips fast (robot_5 spent 330 s of a 600 s
    #                      budget reaching its strip at 1 m/s, 2026-08-27).
    #   explore_speed_mps  inside the sector, searching.
    #   target_speed_mps   the approach to a detected person.
    # droan_gl's ceiling is 15 m/s. Not applied by the gpt arm (the paper
    # flies one speed). 0 on transit = no third gear; 0 on the others leaves
    # droan's own `max_velocity` (2 m/s). Log lines that prove it took:
    #   planner  `[robot_1] NavigateTask max_speed -> 7.0 m/s (transit to sector)`
    #            `[robot_1] ground speed 6.4 m/s over 10 s sim | cap 7.0 (...)`
    #   droan_gl `NavigateTask accepted: activator ..., max_speed 7.0 m/s (from the goal)`
    #            `[droan_gl] rollout speed cap -> 7 m/s`
    transit_speed_mps: 7.0
    explore_speed_mps: 1.5
    target_speed_mps: 1.5
    # SIM seconds between measured-ground-speed log lines per robot.
    speed_log_period_s: 10.0
    # How droan_gl is driven.
    #   'activator'      one EMPTY NavigateTask goal; droan enters ADD_SEGMENT
    #                    and steers by the global_plan TOPIC this node
    #                    republishes every tick, until cancelled. A new VLM
    #                    assignment lands within one plan tick.
    #   'goal_per_round' a fresh goal carrying the path each round. Needs a
    #                    cancel first, and droan's execute loop notices a cancel
    #                    only at 1 Hz, so the re-send can be rejected with
    #                    "task already active" and the drone keeps flying the
    #                    previous assignment.
    nav_activation: 'activator'
    # What goes on /global_plan.
    #   'waypoints' two poses (goal + path_extension_m beyond it), droan's
    #               local planner does the rest. This is raven_nav's shape
    #               and what the rest of this stack is tuned for.
    #   'fmm_path'  upstream's full FMM waypoint list. Truer to Co-NavGPT,
    #               but planned on a 0.6-3.5 m grid against droan's own
    #               finer avoidance.
    plan_output: 'waypoints'
    # Descend to this AGL once the target is DETECTED (found_goal), for the
    # confirmation pass; 0 = never descend, hold flight_altitude_m, which is
    # upstream's behaviour. Upstream is a 2D method on a quadruped and has
    # no altitude at all, so both of these are this port's inventions.
    inspect_altitude_m: 0.0
    # Target INSTANCES. Upstream has none: one merged cloud, one bool, one
    # nearest point, and nothing that retires a target — so it flies to the
    # closest instance and stays. With this on, the cloud is clustered into
    # instances, arriving within target_visit_radius_m blacklists one, and
    # the planner moves to the nearest unvisited. Frontier exploration
    # resumes when none are left.
    target_instances: true
    target_cluster_eps_m: 4.0        # gap that separates two instances
    target_cluster_min_points: 10
    target_visit_radius_m: 12.0      # arrive within this == visited
    activator_retry_s: 3.0

    # ── perception backend ──────────────────────────────────────────────────
    device: 'cuda:0'
    gpu_id: 0
    dump_location: '/tmp/conavgpt2'
    results_dir: ''                # '' -> dump_location
    save_debug_images: false
    publish_vis: true
    publish_agent_images: true
    yolo_world_weights: ''         # '' -> ultralytics resolves 'yolov8l-world.pt'
    mobile_sam_weights: ''         # '' -> ultralytics resolves 'mobile_sam.pt'
    ultralytics_weights_dir: ''   # '' -> ultralytics' relative 'weights' (the CWD!)

    # WHERE YOLO + MobileSAM RUN.
    #   'local'   one model pair loaded INSIDE this planner process (~1.6 GiB
    #             of VRAM each). With NUM_ROBOTS=3 that is three copies of the
    #             same weights on one card, answering identically.
    #   'server'  a shared detector service; this process loads nothing at all
    #             and posts each frame to `detector_url`. Safe to share because
    #             detection is STATELESS — one frame in, boxes and masks out,
    #             no history — the same property that lets one BLIP-2 ITM
    #             scorer serve the fleet. The three weights parameters above
    #             then configure the SERVER, not this node.
    #
    # There is no silent fallback: 'server' with an unreachable service is
    # fatal at startup, because a detector that quietly returns nothing is
    # indistinguishable from a search that found nobody.
    #
    # Start ONE, on the offboard-compute container, before any planner:
    #   ./airstack.sh up offboard-compute
    detector_mode: 'local'
    # An env override with a default, because a run that has no
    # offboard-compute container — an OSMO pod, a single-box bench — must be
    # able to point every arm at a server it DOES have without editing three
    # config layers. The launch file loads all three layers with
    # allow_substs="true".
    #
    # TWO TRAPS, both paid for once:
    #  * allow_substs evaluates the WHOLE FILE, COMMENTS INCLUDED. Writing the
    #    substitution syntax in a comment (with the literal dollar-paren-env)
    #    makes launch try to resolve it and every launch dies with
    #    "environment variable '...' does not exist". Never write that syntax
    #    in a comment in a file loaded this way.
    #  * a variable that is SET BUT EMPTY beats the default and yields an empty
    #    URL. That is why the compose files pass these through by BARE NAME
    #    (unset stays unset) instead of `VAR=${VAR:-}`.
    detector_url: '$(env DETECTOR_URL http://offboard-compute:8200)'
    # Per call, and generous on purpose: a full-resolution PNG plus YOLO+SAM is
    # tens to hundreds of ms, and the first call after start-up can queue behind
    # another robot's.
    detector_timeout_s: 30.0

    # ── VLM backend (OpenAI-compatible; NOT OpenAI) ─────────────────────────
    # The generative endpoint, on the SAME shared host as the detector and the
    # ITM scorer — one container holds every model the fleet talks to, and a
    # robot container holds none. Start it there with
    # `START_VLM_SERVER=true ./airstack.sh up offboard-compute`.
    # A non-empty value here BEATS $OPENAI_BASE_URL; set it back to '' to hand
    # the choice to the environment (-> OPENAI_BASE_URL -> localhost:8000/v1),
    # which is what a single-container bench wants.
    vlm_base_url: '$(env VLM_URL http://offboard-compute:8000/v1)'
    vlm_model: ''                  # '' -> CONAVGPT2_VLM_MODEL -> Qwen/Qwen2.5-VL-3B-Instruct
    vlm_api_key: ''                # '' -> OPENAI_API_KEY -> EMPTY
    vlm_timeout_s: 60.0
    vlm_preflight: true

    # ── VLFM (nav_mode 'vlfm') ──────────────────────────────────────────────
    # Seconds between view scorings. BLIP-2 ITM measures 17.4 ms (57 Hz), so
    # this is NOT throughput-bound — it is capped well under the camera's 15-20
    # Hz because scoring every frame buys nothing: consecutive frames from a
    # moving drone overlap almost entirely, and rayfronts runs its own semantics
    # at 0.5-1 Hz with VLFM-style exploration working fine.
    #
    # MEASURED at the shipped 2x3 tiling: 69 ms per keyframe (6 tiles batched).
    #   5 Hz (0.2 s) -> 35% duty per robot ->  3 robots off one scorer
    #   2 Hz (0.5 s) -> 14% duty per robot ->  7 robots
    #   1 Hz (1.0 s) ->  7% duty per robot -> 14 robots
    # 0.2 is right for the 1-robot benches. Raise it before adding robots, and
    # check /metrics on the ITM server rather than assuming.
    vlfm_keyframe_period_s: 0.2
    vlfm_value_range_m: 0.0        # 0 -> depth_max_m
    vlfm_min_confidence: 0.02      # below this a cell counts as unscored
    vlfm_distance_penalty: 0.002   # per metre; 0 = pure argmax value
    # Commitment, so the drone does not re-argmax every tick and thrash between
    # two frontiers that keep trading places as the value map fills. Modelled on
    # raven_nav's frontier_behavior (lock 6 s, 35% swap margin). NOT from the
    # VLFM paper — its reference implementation is not available here.
    frontier_lock_s: 6.0
    frontier_swap_margin_frac: 0.35
    frontier_unlock_radius_m: 8.0
    vlfm_image_max_side: 512       # BLIP-2 resizes to 224 internally anyway
    # The BLIP-2 ITM service (conavgpt2.blip2_itm_server). SEPARATE from the
    # generative endpoint: different model, different job, and only this one is
    # fast enough (17 ms) to serve a fleet from one instance.
    # Shared, on the offboard-compute container with the detector and the
    # generative VLM. Start it with
    # `START_ITM_SERVER=true ./airstack.sh up offboard-compute`; a VLFM robot
    # then makes two HTTP calls per tick to that one host (YOLO + BLIP-2), and
    # neither goes over DDS.
    vlfm_itm_url: '$(env ITM_URL http://offboard-compute:8100)'
    vlfm_prompt: ''                # '' -> the server's "Seems like there is a {target} ahead."
    # [rows, cols] tiles per keyframe. [1,1] is canonical whole-frame VLFM.
    # Larger because BLIP-2 resizes to 224x224 and a 13 px person in a 946 px
    # frame becomes 3 px: measured, the WHOLE-frame score of a scene with 8
    # people (0.090) is BELOW a flat grey image (0.129), while 2x3 tiling
    # gives 0.423. Rows collapse by max, columns paint their own bearing.
    # Cost: ~71 ms/keyframe batched at 2x3, so ~7 robots at 2 Hz.
    vlfm_tiles: [2, 3]

    # ── search area + altitude band (all modes) ─────────────────────────────
    # Flat [x0,y0,x1,y1,...] because ROS 2 params have no nested arrays. A
    # frontier outside the polygon is not a candidate. Empty = unbounded.
    # [0.0] means UNBOUNDED. Not [] — rclpy infers a parameter's type from its
    # value and an empty list has none, so it raises at declare time.
    search_area_xy: [0.0]
    # WHERE THE POLYGON COMES FROM.
    #   'config'  search_area_xy above.
    #   'scene'   the DISASTER-AFFECTED AREA the Isaac launcher writes for a
    #             generated scene with GT_ANNOTATIONS=on:
    #             <RESULTS_SCENE>_region.json beside the people GT and the
    #             obstacle boxes (scene_gen/disaster/region.py). Entry
    #             'affected' = the fire-front ellipse at the scene's burn time
    #             PLUS the evacuation band the survivors are staged in;
    #             'burn' = the burnt ground alone. Authored in WORLD, so
    #             search_area_frame is forced to 'world'; search_area_pad_m
    #             and the sector split then apply as for a config polygon.
    #             A missing file is FATAL (no silent whole-map fallback).
    search_area_source: 'config'
    search_area_scene_key: 'affected'
    # Sector partitioning. 'none' = the whole search area. 'strips' splits it
    # into NUM_ROBOTS equal-AREA slices along its long axis; 'rect' cuts
    # NUM_ROBOTS equal-WIDTH bands and hands each robot the bounding
    # RECTANGLE of its band's share of the region — tight to a non-rectangular
    # damage footprint (the fire ellipse), only roughly equal in area, and
    # what the method overlays use; 'grid' uses roughly square tiles. Every robot computes the same partition and reads off its
    # own index, so nothing is exchanged — that is the defining property of a
    # static-sector arm. At NUM_ROBOTS=1 all modes are a no-op.
    sector_partition: 'none'
    # 'auto' (the longer x/y extent) | 'x' | 'y' | 'principal' (rect only:
    # bands along the region's own major axis, rotated rectangles — for a
    # diagonal damage footprint).
    sector_axis: 'auto'
    sector_index: -1               # -1 -> derive from ROBOT_NAME
    # Grow the region before splitting, so a drone may work slightly outside the
    # nominal disaster boundary rather than being cut off at it.
    search_area_pad_m: 0.0
    min_altitude_agl_m: 0.0        # 0 = no floor
    max_altitude_agl_m: 0.0        # 0 = no ceiling
