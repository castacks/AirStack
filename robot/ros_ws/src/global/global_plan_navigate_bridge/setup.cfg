[develop]
script_dir=$base/lib/global_plan_navigate_bridge
[install]
install_scripts=$base/lib/global_plan_navigate_bridge

[tool:pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Hermetic unit tests (no ROS stack required)
    linter: ament copyright/flake8/pep257 (run separately, not via colcon test)
    copyright: ament_copyright
    flake8: ament_flake8
    pep257: ament_pep257
addopts =
    --ignore=test/test_copyright.py
    --ignore=test/test_flake8.py
    --ignore=test/test_pep257.py
