# note that all ROS2 topics must be prefixed:
#   rt/ (ROS Topic): Prefixed to all standard ROS 2 topics.
#   rq/<service_name>Request (ROS Service Request): Prefixed to the request topic of a ROS 2 service.
#   rr/<service_name>Reply (ROS Service Reply): Prefixed to the reply topic of a ROS 2 service.
#   rs/ (ROS Service): Reserved for systems where services are handled as a single entity rather than separate request/reply topics. 
#   [action_topic]/_action/status: A topic for goal status updates.
#   [action_topic]/_action/feedback: A topic for feedback during execution.
#   [action_topic]/_action/send_goal: A service to initiate the action.
#   [action_topic]/_action/get_result: A service to retrieve the final result.
#   [action_topic]/_action/cancel_goal: A service to cancel an active goal. 

# all topics are bidirectional by default. See https://eprosima-dds-router.readthedocs.io/ for more details

# onboard_all DDS Router
participants:
  - name: "robot"
    kind: "local"
    domain: $(env ROS_DOMAIN_ID)
  - name: "gcs"
    kind: "local"
    domain: $(var gcs_domain)
allowlist:
  # lidar and world model
  - name: "rt/$(env ROBOT_NAME)/sensors/ouster/point_cloud"
  - name: "rt/$(env ROBOT_NAME)/vdb_mapping/vdb_map_visualization"

  # camera streams
  - name: "rt/$(env ROBOT_NAME)/sensors/front_stereo/left/image_rect"
  - name: "rt/$(env ROBOT_NAME)/sensors/front_stereo/left/camera_info"
  - name: "rt/$(env ROBOT_NAME)/sensors/front_stereo/right/image_rect"
  - name: "rt/$(env ROBOT_NAME)/sensors/front_stereo/right/camera_info"
  - name: "rt/$(env ROBOT_NAME)/sensors/front_stereo/right/depth_ground_truth"
  - name: "rt/$(env ROBOT_NAME)/perception/stereo_image_proc/point_cloud"

  # TRANSFORMS ARE DELIBERATELY NOT BRIDGED (the multi-raven convention).
  # Every robot's `map` is its OWN takeoff-anchored frame, and TF frames carry
  # no robot prefix — so bridging /tf puts N different `map`s (and N
  # `world->map`s once MAP_ANCHOR_ENU is on) onto one GCS tree, where they
  # fight the GCS's own identity `world->map` and drag every `map`-stamped
  # layer around by whichever robot's transform arrived last. The GCS never
  # needs them: gcs_visualizer draws each robot from its GPS fix and translates
  # every robot-local topic (trajectory, plan, vdb, rayfronts, the
  # search_planner overlays) by that robot's boot ENU into the GLOBAL `map`
  # it publishes itself. Record /tf in the ROBOT scope (`record.robot_topics`);
  # a gcs-scope /tf entry records nothing, by design.

  # state information
  - name: "rt/$(env ROBOT_NAME)/odometry_conversion/odometry"
  - name: "rt/$(env ROBOT_NAME)/interface/mavros/global_position/global"
  - name: "rt/$(env ROBOT_NAME)/trajectory_controller/trajectory_vis"
  - name: "rt/$(env ROBOT_NAME)/global_plan"

  # raven_nav exploration debug — visible to operator in Foxglove
  - name: "rt/$(env ROBOT_NAME)/filtered_frontiers"
  - name: "rt/$(env ROBOT_NAME)/debug/frontier_table"

  # search_baselines (search_planner): the BEV the VLM is actually shown, and
  # the per-round trace of what it was asked and answered. These are the two
  # topics that make a bad assignment explicable after the fact instead of just
  # visible as a bad waypoint. Method-neutral names — vlfm, conavgpt2 and
  # nearest are one node with a parameter, so the same two topics serve every
  # arm. One node still drives the whole team, so the map is the team's, not a
  # robot's, but it is published under the FIRST robot's namespace so this
  # router (and the keepalive and the Foxglove layouts) can address it the same
  # way as everything else here.
  #
  # The per-agent annotated FPV (/$(env ROBOT_NAME)/search/agent_image) and the
  # candidate strip (/$(env ROBOT_NAME)/search/vlm_prompt_image) are
  # deliberately NOT here: both are per-TICK images, and the rayfronts note
  # below is what happens when image streams go through this router. Watch
  # those on the robot domain directly (foxglove_bridge in the robot container,
  # host port 8767+N).
  - name: "rt/$(env ROBOT_NAME)/search/map_image"
  - name: "rt/$(env ROBOT_NAME)/search/round_stats"
  # The same grid and frontiers as message types rather than as a picture, so
  # they draw in the 3D panel over the sim ground. One OccupancyGrid at 480x480
  # is 230 KB at 1 Hz — an order of magnitude under the image above, and both
  # are TRANSIENT_LOCAL so a panel that connects late is not blank.
  - name: "rt/$(env ROBOT_NAME)/occupancy"
  - name: "rt/$(env ROBOT_NAME)/frontiers"
  # Robot pose, trail and target visit state, in the map frame. A few KB.
  - name: "rt/$(env ROBOT_NAME)/search/markers"
  # The annotated FPV, JPEG, published ONLY on a tick where the goal class
  # scored >= detector_log_conf (0.5) — the evidence behind every "detector
  # SEEN" / "detector PASS" log line. Event-driven (a
  # few hundred ~50 KB frames a run), so it is not the per-tick stream the
  # note above refuses; it is what says whether a chased "person" was one.
  - name: "rt/$(env ROBOT_NAME)/search/detection_image"
  # The three-state voxel cloud behind the 3D frontiers, and the VLFM value
  # map. Measured on the preview scene at 1 Hz: 240 KB and 230 KB per message
  # — the same order as the occupancy grid above, and ~1/40th of a rayfronts
  # cloud, so the bandwidth argument below does not reach them.
  - name: "rt/$(env ROBOT_NAME)/voxel_map"
  - name: "rt/$(env ROBOT_NAME)/value_map"
  # Frontier candidates as a CLOUD as well as markers: a viewer can scale
  # point size on a cloud, which markers fix at publish time.
  - name: "rt/$(env ROBOT_NAME)/frontier_cloud"
  # The vdb_mapping occupancy cloud — the lidar/depth map the local
  # planner builds, distinct from the planner's own voxel_map above.
  - name: "rt/$(env ROBOT_NAME)/vdb_mapping/vdb_map_pointcloud"

  # rayfronts semantic voxel clouds are NOT bridged. They are Foxglove debug
  # visualisation only — no autonomy module and no offline analysis consumes
  # them (extract_run.py reads odometry + annotations/bboxes and nothing else).
  #
  # Two distinct clouds. voxel_rgb is the coloured map (x,y,z,rgb); voxels_sim
  # carries per-query similarity (x,y,z + sim_0..N) and is not a coloured map.
  # The wildcard below matched every voxels_sim topic, and rayfronts advertises
  # one per registered query: 48 clouds per robot on a typical mission, plus
  # voxel_rgb. At ~10 MB per cloud and four robots that is ~190 point-cloud
  # streams through this router, and its RSS climbed from ~130 MB to ~870 MB
  # over a 48-iteration sweep before it died and took every later iteration
  # with it (robots "not ready within 900s", no robots connected).
  #
  # Record them per robot instead — `record.scope: both` with
  # `record.robot_topics` writes them on the robot's own domain, where they
  # never cross DDS. Re-enable these two lines only for a live Foxglove session
  # that needs the voxel layers, and not for a long unattended sweep.
  #
  # ENABLED 2026-09-02 for exactly the case that note carves out: a LIVE,
  # ATTENDED single-robot Foxglove session (raven_shared_t250_1robot) where the
  # operator has to see the semantic map to tune voxel_score_threshold and
  # voxel_min_cluster_size. The bandwidth argument above was measured at FOUR
  # robots x 48 queries over a 48-iteration unattended sweep; this is one robot,
  # 34 queries, one iteration, watched.
  #
  # >>> TURN THESE TWO LINES BACK OFF BEFORE ANY MULTI-ROBOT OR UNATTENDED
  # >>> SWEEP. They killed the router at ~870 MB RSS last time.
  #
  # NOTE these entries alone are NOT sufficient: rayfronts gates every publish
  # on get_subscription_count() > 0 (messaging_services/ros.py:147,
  # visualizers/ros.py:155) and the DDS router's bare reader does NOT register
  # as a ROS subscriber. voxel_keepalive_node.py (perception.launch.xml) is what
  # actually makes these topics stream; without it this allowlist bridges
  # silence.
  # ONLY /all, NOT the wildcard. The `voxels_sim/*` wildcard is what caused the
  # incident described above: rayfronts advertises one cloud PER QUERY, so the
  # wildcard put 34 point-cloud streams (now 9, but still) through the router
  # for one robot. /all carries EVERY query as a separate `sim_K` field on ONE
  # cloud, so nothing is lost by dropping the per-query topics — colour by
  # sim_K in Foxglove instead of switching topics. sim_0 is the TARGET
  # (`person`); the full index->label order for a run is in that run's
  # /robot_N/rayfronts/status JSON ("queries": [...], in index order) and is
  # printed by scripts/raven_live/verify_topics.sh.
  - name: "rt/robot_$(env ROS_DOMAIN_ID)/rayfronts/msg_serv/voxels_sim/all"
  - name: "rt/robot_$(env ROS_DOMAIN_ID)/rayfronts/voxel_rgb"
  # The ray half of the map — the out-of-range pixels that never became
  # voxels. Without it the operator cannot tell "the casualty was never in the
  # voxel map" from "it was, and scored low". One cloud, same shape as /all.
  - name: "rt/robot_$(env ROS_DOMAIN_ID)/rayfronts/msg_serv/rays_sim/all"

  # behavior tree
  - name: "rt/$(env ROBOT_NAME)/behavior/behavior_tree_commands"
  - name: "rt/$(env ROBOT_NAME)/behavior/behavior_tree_graphviz"

  # # allow all services
  # - name: "rq/*"
  #   type: "*"
  # - name: "rr/*"
  #   type: "*"

  # behavior tree services
  - name: "rq/$(env ROBOT_NAME)/interface/robot_commandRequest"
  - name: "rr/$(env ROBOT_NAME)/interface/robot_commandReply"

  - name: "rq/$(env ROBOT_NAME)/trajectory_controller/set_trajectory_modeRequest"
  - name: "rr/$(env ROBOT_NAME)/trajectory_controller/set_trajectory_modeReply"

  - name: "rq/$(env ROBOT_NAME)/takeoff_landing_planner/set_takeoff_landing_commandRequest"
  - name: "rr/$(env ROBOT_NAME)/takeoff_landing_planner/set_takeoff_landing_commandReply"

  - name: "rq/$(env ROBOT_NAME)/behavior/global_plan_toggleRequest"
  - name: "rr/$(env ROBOT_NAME)/behavior/global_plan_toggleReply"

  # bag recording status
  - name: "rt/$(env ROBOT_NAME)/bag_record/bag_recording_status"
  - name: "rt/$(env ROBOT_NAME)/bag_record/set_recording_status"

  # control commands
  - name: "rt/$(env ROBOT_NAME)/fixed_trajectory_generator/fixed_trajectory_command"

  # tasks/navigate ACTION — bridged for the COOPERATIVE Co-NavGPT2 team run
  # (wildfire1km_5robot_conavgpt2.yaml) ONLY. There, ONE team_mode planner runs
  # on the shared GCS domain and drives every robot, so its rclpy ActionClient
  # to /$(env ROBOT_NAME)/tasks/navigate has to reach droan_gl's NavigateTask
  # server on THIS robot's own domain. In every OTHER deployment the planner
  # runs in the robot container on the robot's domain (co-domain with droan) and
  # this bridge is unused — the action goes native, so these entries were absent
  # until the team run needed them.
  #
  # An action = 2 topics (status, feedback) + 3 services (send_goal, get_result,
  # cancel_goal) under <action>/_action/. The activator sends ONE empty goal per
  # robot and thereafter steers by the already-bridged /global_plan TOPIC, so
  # this carries a one-shot goal plus its status/feedback/result and the shutdown
  # cancel — kilobytes, negligible beside the 5x already-bridged image streams.
  # (mavros/global_position/global is already bridged, so the team planner's
  # navsat needs no entry — it points navigate's config at that topic.)
  - name: "rt/$(env ROBOT_NAME)/tasks/navigate/_action/status"
  - name: "rt/$(env ROBOT_NAME)/tasks/navigate/_action/feedback"
  - name: "rq/$(env ROBOT_NAME)/tasks/navigate/_action/send_goalRequest"
  - name: "rr/$(env ROBOT_NAME)/tasks/navigate/_action/send_goalReply"
  - name: "rq/$(env ROBOT_NAME)/tasks/navigate/_action/get_resultRequest"
  - name: "rr/$(env ROBOT_NAME)/tasks/navigate/_action/get_resultReply"
  - name: "rq/$(env ROBOT_NAME)/tasks/navigate/_action/cancel_goalRequest"
  - name: "rr/$(env ROBOT_NAME)/tasks/navigate/_action/cancel_goalReply"

  # gossip peer profiles are bridged by the dedicated gossip_dds_router (domain 99),
  # NOT here — having it in both routers causes message flooding/amplification.
