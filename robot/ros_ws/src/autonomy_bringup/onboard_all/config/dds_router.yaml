# note that all ROS2 topics must be prefixed:
#   rt/ (ROS Topic): Prefixed to all standard ROS 2 topics.
#   rq/<service_name>Request (ROS Service Request): Prefixed to the request topic of a ROS 2 service.
#   rr/<service_name>Reply (ROS Service Reply): Prefixed to the reply topic of a ROS 2 service.
#   rs/ (ROS Service): Reserved for systems where services are handled as a single entity rather than separate request/reply topics. 
#   [action_topic]/_action/status: A topic for goal status updates.
#   [action_topic]/_action/feedback: A topic for feedback during execution.
#   [action_topic]/_action/send_goal: A service to initiate the action.
#   [action_topic]/_action/get_result: A service to retrieve the final result.
#   [action_topic]/_action/cancel_goal: A service to cancel an active goal. 

# all topics are bidirectional by default. See https://eprosima-dds-router.readthedocs.io/ for more details

# onboard_all DDS Router
participants:
  - name: "robot"
    kind: "local"
    domain: $(env ROS_DOMAIN_ID)
  - name: "gcs"
    kind: "local"
    domain: $(var gcs_domain)
allowlist:
  # lidar and world model
  - name: "rt/$(env ROBOT_NAME)/sensors/ouster/point_cloud"
  - name: "rt/$(env ROBOT_NAME)/vdb_mapping/vdb_map_visualization"

  # camera streams
  - name: "rt/$(env ROBOT_NAME)/sensors/front_stereo/left/image_rect"
  - name: "rt/$(env ROBOT_NAME)/sensors/front_stereo/left/camera_info"
  - name: "rt/$(env ROBOT_NAME)/sensors/front_stereo/right/image_rect"
  - name: "rt/$(env ROBOT_NAME)/sensors/front_stereo/right/camera_info"
  - name: "rt/$(env ROBOT_NAME)/sensors/front_stereo/right/depth_ground_truth"
  - name: "rt/$(env ROBOT_NAME)/perception/stereo_image_proc/point_cloud"

  # TRANSFORMS. Without these the GCS domain has odometry but no frames, so
  # Foxglove's 3D panel has nothing to place the robot — or anything published
  # in `map` — against, and every marker silently fails to render. The GCS
  # publishes no transforms of its own, so although the router is bidirectional
  # this only ever flows robot -> gcs. Note the missions' `record:` gcs-scope
  # list already asks for /tf and /tf_static; until now that recorded nothing.
  - name: "rt/tf"
  - name: "rt/tf_static"

  # state information
  - name: "rt/$(env ROBOT_NAME)/odometry_conversion/odometry"
  - name: "rt/$(env ROBOT_NAME)/interface/mavros/global_position/global"
  - name: "rt/$(env ROBOT_NAME)/trajectory_controller/trajectory_vis"
  - name: "rt/$(env ROBOT_NAME)/global_plan"

  # raven_nav exploration debug — visible to operator in Foxglove
  - name: "rt/$(env ROBOT_NAME)/filtered_frontiers"
  - name: "rt/$(env ROBOT_NAME)/debug/frontier_table"

  # search_baselines (search_planner): the BEV the VLM is actually shown, and
  # the per-round trace of what it was asked and answered. These are the two
  # topics that make a bad assignment explicable after the fact instead of just
  # visible as a bad waypoint. Method-neutral names — vlfm, conavgpt2 and
  # nearest are one node with a parameter, so the same two topics serve every
  # arm. One node still drives the whole team, so the map is the team's, not a
  # robot's, but it is published under the FIRST robot's namespace so this
  # router (and the keepalive and the Foxglove layouts) can address it the same
  # way as everything else here.
  #
  # The per-agent annotated FPV (/$(env ROBOT_NAME)/search/agent_image) and the
  # candidate strip (/$(env ROBOT_NAME)/search/vlm_prompt_image) are
  # deliberately NOT here: both are per-TICK images, and the rayfronts note
  # below is what happens when image streams go through this router. Watch
  # those on the robot domain directly (foxglove_bridge in the robot container,
  # host port 8767+N).
  - name: "rt/$(env ROBOT_NAME)/search/map_image"
  - name: "rt/$(env ROBOT_NAME)/search/round_stats"
  # The same grid and frontiers as message types rather than as a picture, so
  # they draw in the 3D panel over the sim ground. One OccupancyGrid at 480x480
  # is 230 KB at 1 Hz — an order of magnitude under the image above, and both
  # are TRANSIENT_LOCAL so a panel that connects late is not blank.
  - name: "rt/$(env ROBOT_NAME)/occupancy"
  - name: "rt/$(env ROBOT_NAME)/frontiers"
  # /$(env ROBOT_NAME)/voxel_map (the planner's three-state voxel cloud) is NOT
  # bridged, for the same bandwidth reason as the rayfronts clouds below.

  # rayfronts semantic voxel clouds are NOT bridged. They are Foxglove debug
  # visualisation only — no autonomy module and no offline analysis consumes
  # them (extract_run.py reads odometry + annotations/bboxes and nothing else).
  #
  # Two distinct clouds. voxel_rgb is the coloured map (x,y,z,rgb); voxels_sim
  # carries per-query similarity (x,y,z + sim_0..N) and is not a coloured map.
  # The wildcard below matched every voxels_sim topic, and rayfronts advertises
  # one per registered query: 48 clouds per robot on a typical mission, plus
  # voxel_rgb. At ~10 MB per cloud and four robots that is ~190 point-cloud
  # streams through this router, and its RSS climbed from ~130 MB to ~870 MB
  # over a 48-iteration sweep before it died and took every later iteration
  # with it (robots "not ready within 900s", no robots connected).
  #
  # Record them per robot instead — `record.scope: both` with
  # `record.robot_topics` writes them on the robot's own domain, where they
  # never cross DDS. Re-enable these two lines only for a live Foxglove session
  # that needs the voxel layers, and not for a long unattended sweep.
  #
  # - name: "rt/robot_$(env ROS_DOMAIN_ID)/rayfronts/msg_serv/voxels_sim/*"
  # - name: "rt/robot_$(env ROS_DOMAIN_ID)/rayfronts/voxel_rgb"

  # behavior tree
  - name: "rt/$(env ROBOT_NAME)/behavior/behavior_tree_commands"
  - name: "rt/$(env ROBOT_NAME)/behavior/behavior_tree_graphviz"

  # # allow all services
  # - name: "rq/*"
  #   type: "*"
  # - name: "rr/*"
  #   type: "*"

  # behavior tree services
  - name: "rq/$(env ROBOT_NAME)/interface/robot_commandRequest"
  - name: "rr/$(env ROBOT_NAME)/interface/robot_commandReply"

  - name: "rq/$(env ROBOT_NAME)/trajectory_controller/set_trajectory_modeRequest"
  - name: "rr/$(env ROBOT_NAME)/trajectory_controller/set_trajectory_modeReply"

  - name: "rq/$(env ROBOT_NAME)/takeoff_landing_planner/set_takeoff_landing_commandRequest"
  - name: "rr/$(env ROBOT_NAME)/takeoff_landing_planner/set_takeoff_landing_commandReply"

  - name: "rq/$(env ROBOT_NAME)/behavior/global_plan_toggleRequest"
  - name: "rr/$(env ROBOT_NAME)/behavior/global_plan_toggleReply"

  # bag recording status
  - name: "rt/$(env ROBOT_NAME)/bag_record/bag_recording_status"
  - name: "rt/$(env ROBOT_NAME)/bag_record/set_recording_status"

  # control commands
  - name: "rt/$(env ROBOT_NAME)/fixed_trajectory_generator/fixed_trajectory_command"

  # gossip peer profiles are bridged by the dedicated gossip_dds_router (domain 99),
  # NOT here — having it in both routers causes message flooding/amplification.
