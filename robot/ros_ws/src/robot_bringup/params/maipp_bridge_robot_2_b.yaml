# MAIPP peer bridge: robot_2's own coordination topics -> domain 3 (robot_3).
name: maipp_bridge_robot_2_b
from_domain: 2
to_domain: 3
topics:
  /robot_2/maipp/coverage_grid:
    type: nav_msgs/msg/OccupancyGrid
  /robot_2/maipp/task_claim:
    type: geometry_msgs/msg/PolygonStamped
  /robot_2/maipp/tracks:
    type: vision_msgs/msg/Detection3DArray
