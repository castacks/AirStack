# Drone-soccer PPO inference on Starling hardware (direct FMU pose setpoints).
#
# Prerequisites (separate terminals):
#   - natnet_ros2, real_interfaces, mocap_bridge (see swarm_real_single_goal_drone4.yaml
#     mocap_bridge section; set extra_body_names for the ball)
# Do NOT run swarm_commander or trajectory_commander concurrently.
#
# Launch:
#   ros2 launch svg_ground_control policy_commander.launch.py \
#     model_path:=/path/to/ppo_final.zip

policy_commander:
  ros__parameters:
    drone: "drone_4"
    ball_name: "VolleyBall"
    model_path: ""
    frame_id: "map"
    target_x: 3.0
    target_y: 0.0
    policy_dt: 0.02
    deterministic: true
    action_low: [-3.0, -3.0, 0.3]
    action_high: [3.0, 3.0, 2.0]
    bounds_min: [-1.5, -1.5, 0.3]
    bounds_max: [1.5, 1.5, 1.2]
    odom_topic_template: "/{name}/odometry_conversion/odometry"
    ball_odom_topic_template: "/{name}/mocap_odometry"
    ball_pose_topic_template: "/{name}/pose"
    fmu_pose_topic_template: "/{name}/fmu/pose_command"
    state_timeout_s: 0.5
    velocity_filter_alpha: 0.4
    publish_debug: true
    debug_topic_prefix: "/policy_commander"

# Mocap bridge params for PPO: use the mocap_bridge section in
# swarm_real_single_goal_drone4.yaml (extra_body_names, publish_mocap_odometry).
