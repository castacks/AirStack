# Drone-soccer circle trajectory for drone_3 through swarm_commander.
#
# Start swarm_commander with swarm_real_single_goal_drone3.yaml, complete
# takeoff, and call /swarm_commander/start before launching this file.
# This publishes SVG goals; do not run an fmu_pose trajectory commander at the
# same time.
#
# drone_3 remains no-fly until its external-vision frame and odometry-staleness
# issues are corrected and revalidated disarmed.
#
# Launch later with:
#   ros2 launch svg_ground_control trajectory_commander.launch.py \
#     config:=$(ros2 pkg prefix svg_ground_control)/share/svg_ground_control/config/drone_soccer/trajectory_commander_drone3_circle.yaml

trajectory_commander:
  ros__parameters:
    drone: "drone_3"
    backend: "svg_goal"
    frame_id: "map"
    publish_rate_hz: 20.0

    bounds_min: [-1.5, -1.5, 0.3]
    bounds_max: [1.5, 1.5, 1.8]
    odom_topic_template: "/{name}/odometry_conversion/odometry"

    script_type: "circle"
    center_mode: "current_at_start"
    center: [0.0, 0.0, 1.0]
    center_offset: [0.0, 0.0, 0.0]
    radius_m: 1.20
    amplitude: [0.25, 0.15]
    period_s: 18.0
    loop: true
    waypoints: [0.0, 0.0, 1.0,
                0.3, 0.0, 1.0]
    segment_durations: [4.0]

    svg_goal_topic_template: "/svg/{name}/goal_command"
    svg_speed_topic_template: "/svg/{name}/speed_command"
    fmu_pose_topic_template: "/{name}/fmu/pose_command"
    speed_mps: 0.3
    log_goal_updates: true
    log_goal_period_s: 1.0
