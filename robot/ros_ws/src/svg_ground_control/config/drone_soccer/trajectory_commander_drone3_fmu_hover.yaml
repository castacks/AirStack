# Drone-soccer direct-PX4 position-setpoint hover test for BV as drone_3.
#
# This bypasses swarm_commander and publishes directly to:
#   /drone_3/fmu/pose_command
#
# Flight constraints:
# - Do not run ground_control.launch.py, swarm_commander, or another setpoint
#   publisher at the same time.
# - Launch while disarmed and verify mocap, PX4 estimator validity, and the
#   external-vision frame directions before requesting Offboard or arming.
# - Keep this node running until PX4 has landed and disarmed; do not stop it
#   while airborne.
# - Physical BV remains no-fly until its external-vision frame issue is cleared
#   by the required disarmed direction and heading checks.
#
# Launch with:
#   ros2 launch svg_ground_control trajectory_commander.launch.py \
#     config:=$(ros2 pkg prefix svg_ground_control)/share/svg_ground_control/config/drone_soccer/trajectory_commander_drone3_fmu_hover.yaml

trajectory_commander:
  ros__parameters:
    drone: "drone_3"
    backend: "fmu_pose"
    frame_id: "map"
    publish_rate_hz: 20.0

    # Absolute world-frame clamps around the intended flight volume.
    bounds_min: [-1.5, -1.5, 0.3]
    bounds_max: [1.5, 1.5, 1.2]
    odom_topic_template: "/{name}/odometry_conversion/odometry"

    # Freeze at the initial hover setpoint until ~/start is explicitly called.
    script_type: "circle"
    script_auto_start: false
    center_mode: "current_at_start"
    center: [0.0, 0.0, 0.7]
    center_offset: [0.0, 0.0, 0.7]
    radius_m: 0.0
    amplitude: [0.0, 0.0]
    period_s: 20.0
    loop: true
    waypoints: [0.0, 0.0, 0.7]
    segment_durations: [1.0]

    svg_goal_topic_template: "/svg/{name}/goal_command"
    svg_speed_topic_template: "/svg/{name}/speed_command"
    fmu_pose_topic_template: "/{name}/fmu/pose_command"
    speed_mps: 0.0
    log_goal_updates: true
    log_goal_period_s: 1.0

# Launch this node separately from the same parameter file after NatNet is
# publishing /drone_3/pose:
#   ros2 run svg_ground_control mocap_bridge --ros-args \
#     --params-file <this-file>
mocap_bridge:
  ros__parameters:
    drone_names: ["drone_3"]
    mocap_topic_template: "/{name}/pose"
    px4_vio_mode: "direct"
    # The 2026-07-30 carry test confirmed Motive world ENU and rigid-body +X
    # aligned with BV's nose: with the physical nose East, raw Motive attitude
    # was near identity and PX4 must report +90 degrees NED yaw. This standard
    # conversion still requires the full disarmed carry test before flight.
    px4_vio_frame: "enu_to_ned"
    vio_quality: 100
    px4_vio_topic_template: "/{name}/fmu/in/vehicle_visual_odometry"
    visual_odometry_topic_template: "/{name}/fmu/visual_odometry_in"
    mocap_frame: "map"
    velocity_filter_alpha: 0.4
    mocap_qos_best_effort: false
