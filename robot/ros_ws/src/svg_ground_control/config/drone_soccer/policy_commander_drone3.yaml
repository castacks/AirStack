# Drone-soccer PPO inference on Starling hardware (direct PX4 setpoints).
#
# Prerequisites (separate terminals):
#   - natnet_ros2, real_interfaces, mocap_bridge (see swarm_real_single_goal_drone3.yaml
#     mocap_bridge section; set extra_body_names for the ball)
# Do NOT run swarm_commander or trajectory_commander concurrently.
#
# Launch:
#   ros2 launch svg_ground_control policy_commander.launch.py \
#     model_path:=/root/drone_soccer/drone_soccer/saved_policies/safe.zip

/**/policy_commander:
  ros__parameters:
    drone: "drone_3"
    ball_name: "VolleyBall"
    model_path: "/root/drone_soccer/drone_soccer/saved_policies/train_tune_dynamic.zip"
    # Random ball goals used by the planar policy observation. One goal is
    # sampled uniformly inside this ENU rectangle. When the drone comes within
    # goal_arrival_radius, a new goal is sampled. /policy_commander/start also
    # starts with a fresh goal.
    target_x: 0.0
    target_y: 0.0
    goal_trajectory: "random"
    goal_radius: 1.5
    goal_period_s: 32.0
    goal_phase_rad: 0.0
    goal_rotation_rad: 1.5707963267948966
    goal_spawn_min_xy: [-1.0, -1.0]
    goal_spawn_max_xy: [1.0, 1.0]
    goal_arrival_radius: 0.3
    # Set >= 0 for repeatable tests; -1 draws nondeterministically.
    goal_random_seed: 0
    policy_dt: 0.1
    deterministic: true
    action_low: [-3.0, -3.0, 0.5]
    action_high: [3.0, 3.0, 1.5]
    # XY waypoints clamp only after the drone enters this distance from a
    # horizontal fence face. Altitude always remains clamped.
    bounds_min: [-4.0, -5.0, 0.5]
    bounds_max: [4.0, 5.0, 1.5]
    geofence_buffer_m: 0.5
    odom_topic_template: "/{name}/odometry_conversion/odometry"
    ball_odom_topic_template: "/{name}/mocap_odometry"
    ball_pose_topic_template: "/{name}/pose"
    trajectory_setpoint_topic_template: "/{name}/fmu/in/trajectory_setpoint"
    offboard_control_mode_topic_template: "/{name}/fmu/in/offboard_control_mode"
    state_timeout_s: 0.5
    velocity_filter_alpha: 0.4
    publish_debug: true
    debug_topic_prefix: "/policy_commander"

# Mocap bridge params for PPO: use the mocap_bridge section in
# swarm_real_single_goal_drone3.yaml or
# trajectory_commander_drone3_fmu_hover.yaml (SoccerBall mocap odometry).
