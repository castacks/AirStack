# DiffAero commander — SINGLE-DRONE SIMULATION configuration.
#
# Phase 0: takeoff + hover via velocity commands (same interface as
# swarm_commander, but through diffaero_commander).  The DiffAero policy is
# not active yet — the drone takes off, hovers at the target, and responds to
# hold/land.  Swap scenario: "goal" + send /svg/drone_1/goal_command to fly.
#
# Isaac Sim: spawn with NUM_ROBOTS=1 (drone_1 spawns at x=0, offset=0).
# MAVROS interface: ./src/svg_ground_control/scripts/launch_sim_interfaces.sh 1
#
# Launch:
#   ros2 launch svg_ground_control diffaero_single.launch.py
#
# Fly:
#   ros2 service call /diffaero_commander/takeoff std_srvs/srv/Trigger
#   ros2 service call /diffaero_commander/start   std_srvs/srv/Trigger
#   ros2 service call /diffaero_commander/land    std_srvs/srv/Trigger

diffaero_commander:
  ros__parameters:
    drone_names: ["drone_1"]
    drone_modes: "sim"
    teleop_drones: ""
    external_drones: ""
    cbf_exempt_drones: ""

    scenario: "hover"
    scenario_speed_mps: 0.6
    arena_low: [-2.0, -2.0, 0.8]
    arena_high: [2.0, 2.0, 2.0]

    # NUM_ROBOTS=1 in Isaac: drone_1 spawns at x=0 (formula 2*(i-1)-(N-1)=0).
    # Offset = 0 means raw odometry == world frame.
    drone_position_offsets: [0.0, 0.0, 0.0]
    hover_positions: [0.0, 0.0, 1.2]

    state_topic_template: "/{name}/odometry_conversion/odometry"

    control_rate_hz: 20.0
    state_timeout_s: 0.5
    hover_kp: 1.0
    arrival_threshold_m: 0.15
    land_speed_mps: 0.3
    land_complete_altitude_m: 0.15

    cbf_safety_radius_m: 0.55
    cbf_max_speed_mps: 1.2
    cbf_alpha: 2.5

    fence_enabled: true
    fence_min: [-3.0, -3.0, 0.0]
    fence_max: [3.0, 3.0, 3.0]
