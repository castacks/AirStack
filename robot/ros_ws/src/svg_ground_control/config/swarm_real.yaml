# SVG ground control — HARDWARE configuration (ModalAI Starling 2 Max + mocap).
#
# Each drone's uXRCE-DDS client must be namespaced (uxrce_dds_client -n drone_i
# on the VOXL), so its PX4 topics appear as /drone_i/fmu/... on the shared
# domain. Per-drone px4_interface stacks are started with
#   ros2 launch svg_ground_control drone_interface.launch.xml drone_name:=drone_i
# which yields the /{name}/fmu command topics used below.
#
# The mocap system publishes one PoseStamped per rigid body on /drone_i/pose
# (configurable via mocap_topic_template).

swarm_commander:
  ros__parameters:
    drone_names: ["drone_1", "drone_2", "drone_3"]
    drone_roles: ["hover", "hover", "teleop"]
    hover_positions: [-1.5, 0.0, 1.2,
                       1.5, 0.0, 1.2,
                       0.0, -1.5, 1.2]

    # px4_interface (uXRCE-DDS) topic layout (see drone_interface.launch.xml)
    state_topic_template: "/{name}/odometry_conversion/odometry"
    velocity_command_topic_template: "/{name}/fmu/velocity_command"
    robot_command_service_template: "/{name}/fmu/robot_command"
    teleop_topic: "/svg/teleop_command"

    control_rate_hz: 20.0
    state_timeout_s: 0.5
    teleop_timeout_s: 0.5

    hover_kp: 1.0
    arrival_threshold_m: 0.15
    land_speed_mps: 0.3
    land_complete_altitude_m: 0.15

    cbf_safety_radius_m: 0.55
    cbf_max_speed_mps: 1.2
    cbf_alpha: 2.5
    teleop_max_speed_mps: 1.2

mocap_bridge:
  ros__parameters:
    drone_names: ["drone_1", "drone_2", "drone_3"]
    mocap_topic_template: "/{name}/pose"
    visual_odometry_topic_template: "/{name}/fmu/visual_odometry_in"
    mocap_frame: "map"
    velocity_filter_alpha: 0.4
    mocap_qos_best_effort: false
