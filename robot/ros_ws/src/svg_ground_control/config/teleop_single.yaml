# SVG ground control — one drone, gamepad teleop, simulation topics.
#
#   ros2 launch svg_ground_control ground_control.launch.py \
#     config:=$(ros2 pkg prefix svg_ground_control)/share/svg_ground_control/config/teleop_single.yaml
#
# Tests one question: do the sticks move the drone, and does the altitude
# hold when the left stick is released. One drone, so the CBF has no pair to
# constrain — see teleop.md for the 3-drone squeeze test with a hand-flown
# intruder (swarm_sim.yaml, scenario:=squeeze teleop_drones:=drone_3).
#
# Spawn the sim with NUM_ROBOTS=1 and run launch_sim_interfaces.sh 1.

swarm_commander:
  ros__parameters:
    drone_names: ["drone_1"]
    drone_modes: "sim"
    teleop_drones: "drone_1"
    external_drones: ""
    cbf_exempt_drones: ""

    scenario: "hover"
    scenario_speed_mps: 0.6     # nominal speed. Live: ros2 param set /swarm_commander scenario_speed_mps X
    # (also capped by cbf_max_speed_mps below; it is a cruise cap — the drone
    # brakes at goal_accel_mps2, so a goal closer than v^2/(2a) + v*settle
    # never sees the full speed)
    scenario_seed: 7
    arena_low: [-2.0, -2.0, 0.8]
    arena_high: [2.0, 2.0, 2.0]

    # One drone spawns at the sim origin, so no offset.
    drone_position_offsets: [0.0, 0.0, 0.0]

    # Takeoff/hold point, used until /swarm_commander/start.
    hover_positions: [0.0, 0.0, 1.2]

    state_topic_template: "/{name}/odometry_conversion/odometry"
    teleop_topic_template: "/svg/{name}/teleop_command"

    control_rate_hz: 20.0
    state_timeout_s: 0.5
    teleop_timeout_s: 0.5

    hover_kp: 1.0
    arrival_threshold_m: 0.15
    land_speed_mps: 0.3
    takeoff_speed_mps: 0.5    # climb profile speed (braking law to the target)
    hold_lead_m: 0.2          # reference leash while taking off/landing/holding:
                              # PX4's z loop is stiff, keep it close (C1_0920_203148)
    land_complete_altitude_m: 0.15

    cbf_safety_radius_m: 0.55
    cbf_max_speed_mps: 2.0
    cbf_alpha: 2.5
    teleop_max_speed_mps: 2.0
    # Position-mode teleop: the sticks move a target the commander tracks
    # (P + feedforward), seeded from the drone's position at /start, so
    # released sticks hold position. teleop_lead_m leashes the target to the
    # drone (a drone held back by the CBF/fence does not bank up error).
    teleop_kp: 1.0
    teleop_lead_m: 0.5

    # Breach -> all drones hold until /swarm_commander/reset_fence.
    fence_enabled: true
    # fence_behavior: what a breach of [fence_min, fence_max] does.
    #   "hold_all" - any ACTIVE drone (auto, teleop OR external) outside the
    #                box latches: everyone freezes, scenario stops, until
    #                ~/reset_fence. Safe default for autonomous runs.
    #   "keep_in"  - nobody stops. Commanded drones are held inside the box by
    #                a per-axis velocity barrier (outward speed <= gain *
    #                distance to the wall, pushed back if outside); external
    #                drones cannot be steered and are only reported.
    fence_behavior: "keep_in"
    fence_keep_in_gain: 1.0   # keep_in: 1/s
    fence_margin_m: 0.0       # keep_in: meet the wall this early (m)
    fence_min: [-4.0, -2.0, 0.0]
    fence_max: [4.0, 2.0, 3.0]

# Gamepad teleop (teleop.launch.py, run in its own terminal before the
# commander; needs teleop_drones non-empty here or via teleop_drones:= on the
# commander launch). teleop_controller names the input device — an entry of svg_ground_control/safe_teleop/controllers.py,
# which supplies the driver node (joy_node) and the axis map for it.
# Supported today: "dragonrise_usb", "xbox_usb". Add new devices there.
safe_teleop:
  ros__parameters:
    # The pad on the bench is a SHANWAN/DragonRise "Android gamepad", whose
    # DirectInput layout is NOT the Xbox one (right stick on axes 2/3, left
    # bumper button 6, and axes 4/5 are triggers that rest at FULL SCALE).
    # Set this to "xbox_usb" if you swap in a real Xbox pad. Check an unknown
    # pad with `ros2 run svg_ground_control joy_map` before flying it.
    teleop_controller: "dragonrise_usb"
    max_speed_mps: 2.0        # full right stick; keep <= teleop/cbf_max_speed_mps above
