# SVG ground control — ONE REAL DRONE, gamepad teleop (Starling 2 Max + mocap).
#
# The hardware counterpart of teleop_single.yaml: same single-drone teleop
# question (do the sticks move it, does the altitude hold), but routed to
# px4_interface over uXRCE-DDS instead of MAVROS. Brought up end to end by
#   ./svg_teleop.sh real
# or by hand:
#   ros2 launch svg_ground_control ground_control.launch.py \
#     config:=$(ros2 pkg prefix svg_ground_control)/share/svg_ground_control/config/teleop_real.yaml \
#     use_mocap:=true
#
# Prerequisites (experiment.md Part B): VOXL provisioned via
# voxl_setup_real_drone.sh, MicroXRCEAgent on port 8888, real_interfaces
# drones:=drone_1, natnet_ros2 streaming /drone_1/pose, EKF2 external-vision
# params set and verified (B4b), hand-carry RViz preflight done (B5).
#
# ALTITUDE: there is no separate altitude clamp any more. The commander flies
# the teleop drone in position mode (sticks move a target it tracks) and the
# fence in keep_in mode is what bounds it — fence_min/max z below are height
# above the MOCAP ORIGIN, so verify Motive's ground plane is at floor level.
#
# YAW CAVEAT: yaw sign cannot be verified in sim (px4_interface negates
# angular.z, mavros_interface does not). Test yaw slowly at low altitude on the
# first flight.

swarm_commander:
  ros__parameters:
    drone_names: ["drone_1"]
    drone_modes: "real"
    teleop_drones: "drone_1"
    external_drones: ""
    cbf_exempt_drones: ""

    scenario: "hover"
    scenario_speed_mps: 0.5
    scenario_seed: 7
    # Fit to the mocap capture volume!
    arena_low: [-1.5, -1.5, 0.8]
    arena_high: [1.5, 1.5, 1.8]
    # Zeros: mocap anchors the drone's EKF to the shared mocap origin.
    drone_position_offsets: [0.0, 0.0, 0.0]

    # Takeoff/hold point, used until /swarm_commander/start.
    hover_positions: [0.0, 0.0, 1.2]

    state_topic_template: "/{name}/odometry_conversion/odometry"
    teleop_topic_template: "/svg/{name}/teleop_command"

    control_rate_hz: 20.0
    state_timeout_s: 0.5
    teleop_timeout_s: 0.5

    hover_kp: 1.0
    arrival_threshold_m: 0.15
    land_speed_mps: 0.3
    land_complete_altitude_m: 0.15

    # One drone, so the CBF has no pair to constrain — the caps below are the
    # active limits. Deliberately slower than the sim config for a first
    # hardware flight.
    cbf_safety_radius_m: 0.55
    cbf_max_speed_mps: 0.7
    cbf_alpha: 2.5
    teleop_max_speed_mps: 0.7
    # Position-mode teleop: the sticks move a target the commander tracks
    # (P + feedforward), seeded from the drone's position at /start, so
    # released sticks hold position. teleop_lead_m leashes the target to the
    # drone (a drone held back by the CBF/fence does not bank up error).
    teleop_kp: 1.0
    teleop_lead_m: 0.5

    # Geofence: SET TO YOUR CAPTURE VOLUME. breach -> hold, ~/reset_fence to clear
    fence_enabled: true
    # fence_behavior: what a breach of [fence_min, fence_max] does.
    #   "hold_all" - any ACTIVE drone (auto, teleop OR external) outside the
    #                box latches: everyone freezes, scenario stops, until
    #                ~/reset_fence. Safe default for autonomous runs.
    #   "keep_in"  - nobody stops. Commanded drones are held inside the box by
    #                a per-axis velocity barrier (outward speed <= gain *
    #                distance to the wall, pushed back if outside); external
    #                drones cannot be steered and are only reported.
    fence_behavior: "keep_in"
    fence_keep_in_gain: 1.0   # keep_in: 1/s
    fence_margin_m: 0.0       # keep_in: meet the wall this early (m)
    fence_min: [-4.0, -2.0, 0.0]
    fence_max: [4.0, 2.0, 3.0]

mocap_bridge:
  ros__parameters:
    drone_names: ["drone_1"]
    # With natnet_ros2 (body_id: -1, Motive body named drone_1) the pose topic
    # is /drone_1/pose; adjust if `ros2 topic list` shows a different prefix.
    mocap_topic_template: "/{name}/pose"
    # See swarm_real.yaml for the mode/frame notes. VERIFY px4_vio_frame with
    # the hand-check in experiment.md B4b before flying.
    px4_vio_mode: "direct"
    px4_vio_frame: "enu_to_ned"
    vio_quality: 100
    px4_vio_topic_template: "/{name}/fmu/in/vehicle_visual_odometry"
    visual_odometry_topic_template: "/{name}/fmu/visual_odometry_in"
    mocap_frame: "map"
    velocity_filter_alpha: 0.4
    mocap_qos_best_effort: false

# Gamepad teleop (teleop.launch.py reads this block; ./svg_teleop.sh real
# starts the same nodes by hand). The input device is teleop_controller — an
# entry of svg_ground_control/safe_teleop/controllers.py (driver node + axis
# map).
# Supported today: "dragonrise_usb", "xbox_usb". Add new devices there.
safe_teleop:
  ros__parameters:
    # The pad on the bench is a SHANWAN/DragonRise "Android gamepad", whose
    # DirectInput layout is NOT the Xbox one (right stick on axes 2/3, left
    # bumper button 6, and axes 4/5 are triggers that rest at FULL SCALE).
    # Set this to "xbox_usb" if you swap in a real Xbox pad. Check an unknown
    # pad with `ros2 run svg_ground_control joy_map` before flying it.
    teleop_controller: "dragonrise_usb"
    max_speed_mps: 0.7        # full right stick, first hardware flights: slow (= caps above)
    max_climb_speed_mps: 0.5  # full left stick (vertical). Position hold is the commander's.
