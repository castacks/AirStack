# docker compose file
services:
  robot_base:
    # Interactive shell
    stdin_open: true # docker run -i
    tty: true # docker run -t
    # Needed to display graphical applications
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - QT_QPA_PLATFORM
      # Record bags
      - RECORD_BAGS=${RECORD_BAGS}
      - LOG_CONFIG=${LOG_CONFIG:-log.yaml}
      # docker compose interpolation to env variables
      - URDF_FILE=${URDF_FILE}
      # MAVROS
      - OFFBOARD_BASE_PORT=${OFFBOARD_BASE_PORT}
      - ONBOARD_BASE_PORT=${ONBOARD_BASE_PORT}
      - ROBOT_NAME_MAP_CONFIG_FILE=${ROBOT_NAME_MAP_CONFIG_FILE:-default_robot_name_map.yaml}
      - DEBUG_RVIZ=${DEBUG_RVIZ:-false}
      # Stack dispatch (RFC #379) — the ONLY dispatch (the legacy
      # AUTONOMY_ROLE role dispatch was removed). Set by `airstack up
      # --stack <name>` to the CONTAINER path of the stack folder
      # (/root/AirStack/stacks/<name>); unset = the trunk reference stack
      # full_default.
      - AIRSTACK_STACK_DIR=${AIRSTACK_STACK_DIR:-/root/AirStack/stacks/full_default}
      - AIRSTACK_STACK_ENTRY=${AIRSTACK_STACK_ENTRY:-stack}
      # Fleet dispatch (RFC #380): set by `airstack up --fleet <name>` to the
      # CONTAINER path of the fleet file (/root/AirStack/config/fleets/...).
      # Empty = legacy robot_name_map resolution in .bashrc.
      - FLEET_CONFIG_FILE=${FLEET_CONFIG_FILE:-}
    volumes:
      # display stuff
      - $HOME/.Xauthority:/.Xauthority
      - /tmp/.X11-unix:/tmp/.X11-unix
      # developer stuff
      - .dev:/root/.dev:rw # developer config
      - ../../common/.bash_profile:/root/.bash_profile:rw  # commented out - common/ no longer exists
      - .bashrc:/root/.bashrc:rw # bash config
      - ../../common/inputrc:/etc/inputrc:rw  
      - ../../common/.tmux.conf:/root/.tmux.conf:rw  
      - ../../.devcontainer/robot/launch.json:/root/AirStack/.vscode/launch.json:rw
      - ../../.devcontainer/robot/tasks.json:/root/AirStack/.vscode/tasks.json:rw
      - ./robot_name_map:/root/AirStack/robot/docker/robot_name_map:rw
      # autonomy stack stuff
      - ../../common/ros_packages:/root/AirStack/robot/ros_ws/src/common:rw
      - ../../common/fastdds.xml:/root/AirStack/robot/ros_ws/src/fastdds.xml
      - ../ros_ws:/root/AirStack/robot/ros_ws:rw
      # reference stack folders (launch entry points read via AIRSTACK_STACK_DIR)
      - ../../stacks:/root/AirStack/stacks:rw
      # fleet + vehicle configs and the fleet resolver (.bashrc uses them only
      # when FLEET_CONFIG_FILE is set — RFC #380)
      - ../../config:/root/AirStack/config:ro
      - ../../tools/fleet:/root/AirStack/tools/fleet:ro
      # Generated artifacts split-stack entries read at launch (bridge-derived
      # DDS-router configs from tools/gen_dds_router.py).
      - ../../.airstack/generated:/root/AirStack/.airstack/generated:ro
      # bags
      - ../bags:/bags:rw

