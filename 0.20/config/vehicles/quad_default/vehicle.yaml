# Vehicle TYPE: quad_default (RFC #380 §1)
#
# The default AirStack quadrotor — the Pegasus Iris airframe carrying the
# stereo camera + 3D lidar suite every reference stack is wired for. A vehicle
# manifest is DATA: it describes a class of airframe (what sensors it carries,
# which driver runs each on hardware and which sim subgraph represents it),
# never code. Per-serial calibration does NOT live here — see
# config/vehicles/README.md (type vs. unit) and config/local/.
#
# Consumed by:
#   - tools/fleet/resolve_fleet.py  → URDF_FILE / VEHICLE exports per robot
#   - simulation/isaac-sim/launch_scripts/fleet_spawn.py → sensor toggles
#   - (future) doctor's (vehicle, stack) pairing check: a stack consuming
#     sensors/front_stereo/* requires a sensor with id front_stereo here.

name: quad_default
platform: px4_multirotor

airframe:
  # PASS-THROUGH form: points at the existing hand-built URDF unchanged.
  # RFC #380 §1's target is a GENERATED URDF (base xacro + sensor mounts);
  # until that generator exists, base_urdf names the monolithic file the
  # robot_state_publisher already loads (package-relative, as URDF_FILE).
  base_urdf: robot_descriptions/iris/urdf/iris_with_sensors.pegasus.robot.urdf
  # ms-airsim runs a reduced stereo-only URDF today; `airstack up --sim airsim`
  # keeps exporting it (env wins over the fleet resolver's URDF_FILE).

# One entry per sensor: the real driver and the sim representation declared
# together (one source of truth for both worlds). `id` is the sensors/* topic
# namespace segment and the name wiring snapshots normalize driver nodes to.
sensors:
  - type: stereo_cam
    id: front_stereo                    # topics: sensors/front_stereo/{left,right}/{image_rect,camera_info}
    frame: base_link_ZED_X              # URDF link (camera_left / camera_right children)
    driver: {module: zed_wrapper}       # hardware: ZED X driver (the zed-l4t service today)
    sim: {pegasus: zed_stereo_camera}   # add_zed_stereo_camera_subgraph (pegasus_app.spawn_drone)

  - type: lidar_3d
    id: ouster                          # topics: sensors/ouster/point_cloud_raw (filtered: sensors/ouster/point_cloud)
    frame: ouster                       # URDF link, mounted via lidar_mount
    driver: {module: ouster_ros}
    sim: {pegasus: rtx_lidar, config: ouster_os1}  # add_rtx_lidar_subgraph

# Pegasus Iris asset spawned by the fleet spawner (pegasus_app.DEFAULT_DRONE_USD).
sim_asset: iris.usd
