# simple-sim: lightweight kinematic simulator (no PX4, no MAVROS). One node
# mocks the MAVROS surface the autonomy stack talks to (state/odom topics,
# set_mode/arming/takeoff services, attitude setpoint input — hardcoded to
# robot_1 on ROS_DOMAIN_ID=1) and renders stereo camera images of a single
# FBX world via OpenGL. Launch with `airstack up --sim simple`, which pairs
# this service with the simple-robot service (SIM_TYPE=simple) instead of
# robot-desktop. Actively used by core maintainer John Keller.
services:
  simple-sim:
    profiles:
      - simple
    container_name: simple-sim  # stable name, mirrors isaac-sim / ms-airsim
    image: &simple_sim_image ${PROJECT_DOCKER_REGISTRY}/${PROJECT_NAME}:v${VERSION}_simple_sim
    build:
      context: ./
      dockerfile: Dockerfile.sim
      tags:
        - *simple_sim_image
    entrypoint: ""
    command: >
      bash -c "service ssh restart;
      tmux new -d -s sim
      && tmux send-keys -t sim
      'source /opt/ros/jazzy/setup.bash && cd /models && ./download.sh && cd ~/ros_ws/ && colcon build --symlink-install && source install/setup.bash && ROS_DOMAIN_ID=1 ros2 launch sim sim.launch.xml' ENTER
      && sleep infinity"
    # Interactive shell
    stdin_open: true
    tty: true
    ipc: host
    privileged: true
    networks:
      airstack_network:
        # INVARIANT: every sim service (isaac-sim, ms-airsim, simple-sim)
        # binds this same fixed address — robot containers reach the sim at
        # SIM_IP (default 172.31.0.200), so only one sim can run at a time.
        ipv4_address: 172.31.0.200
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      # let it use the GPU
      resources:
        reservations:
          devices:
            - driver: nvidia # https://stackoverflow.com/a/70761193
              count: 1
              capabilities: [gpu]
    volumes:
      # display stuff
      - $HOME/.Xauthority:/root/.Xauthority
      - /tmp/.X11-unix:/tmp/.X11-unix
      # developer stuff
      - ./bashrc:/root/.bashrc:rw # bash config
      - /var/run/docker.sock:/var/run/docker.sock # access docker API for container name
      - ../models:/models/:rw
      # autonomy stack stuff
      - ../ros_ws:/root/ros_ws:rw # sim-specific ROS packages
      # - ../../../ros_ws/src/fastdds.xml:/root/ros_ws/fastdds.xml:rw  # fastdds.xml - commented out, may not be needed
      # - ../../../common/inputrc:/etc/inputrc:rw  # optional page-up/down history search; kept unmounted