# Automated sequence configuration for AirStack.
# All delay_s values are relative to the previous step (or Isaac Sim play detection for the first step).

robot_container: "airstack-robot-desktop-1"
isaac_sim_container: "isaac-sim"

steps:
  # T+20s after Isaac Sim starts playing
  - name: "takeoff"
    delay_s: 20
    action: "ros2_action"
    action_server: "/robot_1/tasks/takeoff"
    action_type: "task_msgs/action/TakeoffTask"
    goal: "{target_altitude_m: 1.0, velocity_m_s: 0.5}"

  # T+30s
  - name: "enable_target_tracking"
    delay_s: 10
    action: "ros2_publish"
    topic: "/robot_1/bpmp/target_tracking_enable"
    msg_type: "std_msgs/msg/Bool"
    msg: "{data: true}"

  # T+330s — stop Isaac Sim and robot-desktop simultaneously
  - name: "stop_isaac_and_robot"
    delay_s: 300
    action: "parallel"
    steps:
      - name: "stop_isaac_sim"
        action: "airstack_down"
        args: "isaac-sim"
      - name: "stop_robot_desktop"
        action: "airstack_down"
        args: "robot-desktop"

  # T+340s
  - name: "restart_robot_desktop"
    delay_s: 10
    action: "airstack_up"
    args: "robot-desktop"

  # T+350s
  - name: "restart_isaac_sim"
    delay_s: 10
    action: "airstack_up"
    args: "isaac-sim"

  # T+475s
  - name: "shutdown_all"
    delay_s: 125
    action: "airstack_down"
