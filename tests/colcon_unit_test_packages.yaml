# Packages run via `colcon test` in system.test_build_packages.test_colcon_test_robot.
#
# Add a package here when it has gtests (ament_add_gtest) and/or pytest tests under
# <package>/test/. Keep in sync with tests/robot/ proxies for Python unit tests.
#
# See: docs/development/intermediate/testing/unit_testing.md

robot:
  packages:
    - natnet_ros2
    - lidar_point_cloud_filter
  # Skips ament_copyright / flake8 / pep257 on Python packages; run linters separately.
  # launch_testing is disabled via PYTEST_DISABLE_PLUGIN_AUTOLOAD in the test
  # ( -p no:launch_testing is too late: pytest 8.1+ validates the plugin at
  # register, before -p is applied).
  pytest_args:
    - -m
    - not linter
