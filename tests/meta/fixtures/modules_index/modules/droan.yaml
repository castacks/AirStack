# Registry entry for the droan module (schema/module-entry.schema.json).
# airstack_compat is the DECLARED range copied from the module's module.yaml;
# the VERIFIED matrix lives in compat/droan.yaml (CI-stamped only).
name: droan
repo: https://github.com/castacks/asm_droan
description: >-
  DROAN disparity-space local obstacle avoidance — the GPU (OpenGL) droan_gl
  planner and the CPU droan_local_planner with its disparity_expansion /
  disparity_graph / disparity_graph_cost_map world model, serving AirStack's
  NavigateTask / trajectory_controller seam from a stereo disparity image
maintainer: ajong@andrew.cmu.edu   # Andrew Jong
license: BSD-3-Clause-Clear
type: ros_package
registered_ref: v0.1.0
airstack_compat: ">=0.21.0-dev.10 <0.22.0"   # DECLARED (from module.yaml)
notes: >-
  Public repo. AirStack's in-tree local planner through 0.20.x, extracted
  with git filter-repo (history preserved) when MIGHTY became the default
  local planner in 0.21.0-dev.11 (compat floor dev.10 is one catalog-only sync earlier); older trunks still carry these packages
  in-tree, hence the compat floor. The droan_gl link deps (assimp / EGL /
  GLFW / GLM) are declared as tier-1 apt deps and enter the robot image via
  `airstack module lock --build` (run by `airstack up` when missing). Pick
  DROAN for depth-camera-only vehicles or minimal compute; the judged
  comparison that motivated the MIGHTY default is in the asm_mighty README.
  Consumed by trunk reference stacks full_droan (GPU), full_droan_cpu (CPU)
  and full_macvo (GPU, MAC-VO disparity source).
