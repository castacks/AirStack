# Registry entry for the raven module (schema/module-entry.schema.json).
# airstack_compat is the DECLARED range copied from the module's module.yaml;
# the VERIFIED matrix lives in compat/raven.yaml (CI-stamped only).
name: raven
repo: https://github.com/castacks/asm_raven
description: >-
  RAVEN semantic aerial navigation (ICRA 2026) — the RayFronts open-set
  semantic ray-frontier map and behavior manager (voxel, ray, LVLM and
  frontier search) in a GPU sidecar container publishing global_plan toward a
  natural-language target, plus the raven_bridge plan/prompt relay on the robot
maintainer: ajong@andrew.cmu.edu   # Andrew Jong
license: BSD-3-Clause-Clear
type: ros_package
registered_ref: v0.1.1
airstack_compat: ">=0.21.0-dev.8 <0.22.0"   # DECLARED (from module.yaml)
notes: >-
  Wrapper (raven_bridge, sidecar Dockerfile, compose fragment, test_stack) is
  BSD-3-Clause-Clear; the vendored RayFronts fork (seungchan-kim/RayFronts,
  branch raven) keeps its own license — see the module's VENDORED.md. The
  sidecar is declared through the manifest's compose fragment (first module to
  bring its own container) and is built on first `airstack up` (~20 GB image).
  Consumed by trunk reference stack full_raven.
