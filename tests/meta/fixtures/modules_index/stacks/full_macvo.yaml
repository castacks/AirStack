# Registry entry for the full_macvo trunk reference stack (schema/stack-entry.schema.json).
name: full_macvo
repo: https://github.com/castacks/AirStack
path: stacks/full_macvo
description: >-
  Full autonomy with MAC-VO learned stereo visual odometry as the disparity
  source for the DROAN local planner (droan_gl, asm_droan module, consumes
  /$ROBOT_NAME/perception/macvo/disparity)
airstack_compat: ">=0.21.0-dev.10 <0.22.0"   # from the stack's modules.repos airstack_compat key
wiring: stacks/full_macvo/wiring.md            # docs site embeds the CI-generated wiring.md from trunk
notes: >-
  Requires two modules: macvo (registry: modules/macvo.yaml; pinned by SHA
  pending the module's first release tag) and droan (registry:
  modules/droan.yaml) — it keeps the stereo-disparity DROAN planner rather
  than the lidar-fed MIGHTY default because a disparity source is what it
  exercises. Both pins are synced by `airstack up`. One of the presets
  absorbing trunk's local_*.launch.xml variant explosion into named stacks.
