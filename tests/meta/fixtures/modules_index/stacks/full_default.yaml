# Registry entry for the full_default trunk reference stack (schema/stack-entry.schema.json).
name: full_default
repo: https://github.com/castacks/AirStack
path: stacks/full_default
description: >-
  The full-autonomy topology as a self-contained stack folder, with the MIGHTY
  map-based local planner (asm_mighty module: planner + acl-mapping voxel world
  model + NavigateTask bridge) — the baseline most users start from, the
  default when no stack is selected, and the stack other stacks are copied from
airstack_compat: ">=0.21.0-dev.10 <0.22.0"   # from the stack's modules.repos airstack_compat key
wiring: stacks/full_default/wiring.md          # docs site embeds the CI-generated wiring.md from trunk
notes: >-
  Pins the mighty module (registry: modules/mighty.yaml, v0.1.4 or newer);
  `airstack up` adds the pin and syncs it when missing. The module declares no
  image-level deps (its nlohmann-json header dep ships in the trunk robot
  image), so the stack runs on the trunk images with no composed layer. The
  previous default local planner (GPU DROAN) is the full_droan stack.
