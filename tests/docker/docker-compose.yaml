services:
  test:
    image: &tests_image ${PROJECT_DOCKER_REGISTRY}/${PROJECT_NAME}:v${VERSION}_tests
    build:
      context: ../
      dockerfile: docker/Dockerfile
      tags:
        - *tests_image
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AIRSTACK_PATH}:${AIRSTACK_PATH}:ro
      - ${AIRSTACK_PATH}/tests/results:${AIRSTACK_PATH}/tests/results
    environment:
      - AIRSTACK_ROOT=${AIRSTACK_PATH}
      - DISPLAY=${DISPLAY:-}
      # Forward the OptiTrack/NatNet toggle so the in-runner `airstack up`
      # (which does os.environ.copy()) brings the stack up with NatNet enabled and
      # the test_natnet_pose_alive sentinel runs instead of skipping.
      - LAUNCH_NATNET=${LAUNCH_NATNET:-false}
      - NATNET_BODY_NAME=${NATNET_BODY_NAME:-Drone}
    working_dir: ${AIRSTACK_PATH}/tests
    network_mode: host
